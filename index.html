lt/compose/Business_Partner_A2/Bus_Part_A2_Video.pdf", "link_text": "閱讀 BP A2 影音腳本 (Page 3)[cite: 2]"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "聽力與發音特訓 (BP WB 5.5)", "category_en": "Audio Self-Study", "title": "展會心得聽力特訓", "title_en": "Trade Fair Impressions (BP Audio 5.5)", "key_takeaways": "【聽力檢測】\n1. Did Amy and Marta arrive on the same day?[cite: 1]\n2. What did Victor think about the presentation?[cite: 1]", "key_takeaways_en": "Listen and identify discrepancies in travel times.[cite: 1]", "main_content": "A: What did Amy think about the conference center? What did she like?\nB: She liked the presentations.[cite: 1]", "vocab_notes": ["【課堂延伸】Dash [dæʃ] (n.)：破折號 (-)。", "【課堂延伸】Hyphen [ˈhaɪfən] (n.)：連字號 (-)。", "【課堂延伸】5-minute (adj.)：五分鐘的 (加上連字號)。", "【課堂延伸】Under score / Underline emphasize：底線 (_)、畫底線強調。"], "vocab_notes_en": ["Dash/Hyphen: Punctuation marks used to separate words or syllables."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/BP_A2_WB_5_05.mp3", "link_text": "聆聽 BP Workbook 5.5 音檔[cite: 2]"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "BBC 職場入門 (BBC Intro)", "category_en": "BBC Introduction", "title": "面試技巧與辦公室生存", "title_en": "BBC English at Work: An Introduction", "key_takeaways": "【影片重點】\n1. 職場強項表達：This job is an ideal match for my skills.[cite: 1]\n2. 行程衝突：I have got two meetings scheduled at the same time. I am double-booked![cite: 1]", "key_takeaways_en": "Anna interviews at a plastic fruit company.[cite: 1]", "main_content": "A: Can you tell me about yourself?\nB: I get on with people easily. I want to be a part of that.[cite: 1]\nA: There is a problem with my timetable. I am double-booked.[cite: 1]", "vocab_notes": ["Double-booked (adj.)：同一時間被重複預約[cite: 1]。", "【課堂延伸】Recruit (n./v.)：新進員工；招募。", "【課堂延伸】Employee (n.)：員工。", "【課堂延伸】Over hear / Eavesdrop (v.)：無意間聽到 / 偷聽。", "【課堂延伸】Plastic fruit sector / industry：塑膠水果產業。", "【課堂延伸】Prestigious / Famous (adj.)：有聲望的 / 著名的。"], "vocab_notes_en": ["Double-booked: Having two commitments at the same time.[cite: 1]"], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/english-at-work-intro", "link_text": "觀看 BBC Intro[cite: 2]"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "口語特訓 (Papa Teach Me)", "category_en": "YouTube Self-Study", "title": "Stop Saying 'I am fine'", "title_en": "Alternatives to 'How are you?'", "key_takeaways": "【自學任務】學習 15 種回答 How are you 的替代說法，以及當對方生病時的 5 種關心用語[cite: 1]。", "key_takeaways_en": "Learn alternatives to 'I am fine, thank you. And you?'[cite: 1].", "main_content": "• Watch the video and practice the alternative responses.[cite: 1]", "vocab_notes": ["Alternatives (n.)：替代方案[cite: 1]。", "【課堂延伸】Composite (adj./n.)：混合的/合成物。"], "vocab_notes_en": ["Alternatives: Available as another possibility.[cite: 1]"], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "觀看 Papa Teach Me 影片[cite: 2]"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation)", "category_en": "Travel & Logistics", "title": "研討會住宿與地鐵動線", "title_en": "Conference Transit & Hotel Proximity", "key_takeaways": "【教材重點】\n1. 描述距離：within walking distance[cite: 3]。\n2. 說明搭乘交通工具：take the subway directly[cite: 3]。", "key_takeaways_en": "Expressing walkability and direct subway transit[cite: 3].", "main_content": "A: The hotel is near the subway station and within walking distance.[cite: 3]\nB: From the hotel, can I take the subway directly to the conference venue?[cite: 3]\nA: Yes, you can take the Blue Line directly. You do not need to transfer.[cite: 3]", "vocab_notes": ["Within walking distance (phr.)：步行可達的距離[cite: 3]。", "Transfer (v.)：轉乘[cite: 3]。", "【課堂延伸】Near / close to / nearby：靠近、在附近。"], "vocab_notes_en": ["Transfer: Change from one vehicle or line to another.[cite: 3]"], "link": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf?v=1726683206", "link_text": "Minneapolis Skyway Map (PDF)[cite: 3]"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "推薦與觀光 (Recommendations)", "category_en": "Food & Places", "title": "在地美食與景點推薦", "title_en": "Recommending Food and Places", "key_takeaways": "【教材重點】\n1. 推薦句型：I recommend ___ because ___ / I think ___ is worth seeing.[cite: 3]\n2. 必用語：It is a must-see / must-eat.[cite: 3]\n3. 避開陷阱：Tourist trap vs Tourist attraction, Rip-off[cite: 3]。", "key_takeaways_en": "Recommending local food and avoiding tourist traps[cite: 3].", "main_content": "A: I recommend Kaohsiung because the food is amazing.[cite: 3]\nB: You simply can not miss it! It is a once-in-a-lifetime experience![cite: 3]\nA: But be careful of the tourist trap, it is a total rip-off![cite: 3]", "vocab_notes": ["Tourist trap (n.)：坑遊客的地方[cite: 3]。", "Rip-off (n.)：敲竹槓[cite: 3]。", "【課堂延伸】Be worth seeing：值得一看。", "【課堂延伸】Rice noodle, Hakka dishes, roasted duck wrap, crepe, mutton fried rice, lamb chop：在地美食單字。", "【課堂延伸】Cut guava：切好的芭樂。", "【課堂延伸】Accessible, Cuisine：容易到達的、料理。", "【課堂延伸】Bed & breakfast / B&B, food court：民宿、美食街。", "【課堂延伸】Out-of-towner：外地人。"], "vocab_notes_en": ["Tourist trap: A place that attracts and overcharges tourists.[cite: 3]"], "practice_quiz": [{"question": "【填空題】這是一個坑遊客的地方：\nIt is a _________ _________.", "answer": "✔ 填空解答：tourist trap[cite: 3]"}], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "展會破冰 (Networking)", "category_en": "Networking Role-Play", "title": "展會破冰與部門職掌交流", "title_en": "Networking Role-Play", "key_takeaways": "【教材重點】\n6 階段交際：自我介紹 ➔ 問對方部門 ➔ 簡述己方職掌 ➔ 帶出痛點 (You just remind me that...) ➔ 提供協助 ➔ 交換名片 (Here is my business card should you want to call.)[cite: 3]。", "key_takeaways_en": "6-Stage Networking Script[cite: 3].", "main_content": "A: Can I briefly tell you about what our department does?[cite: 3]\nB: Of course! I am all ears. Fire away![cite: 3]\nA: You just remind me that we may need your help in...[cite: 3]\nB: Here is my business card should you want to call.[cite: 3]", "vocab_notes": ["I am all ears (idiom)：我洗耳恭聽[cite: 3]。", "Fire away (idiom)：請說吧[cite: 3]。", "【課堂延伸】Networking / socializing：建立人脈 / 社交。"], "vocab_notes_en": ["Fire away: Permission to start speaking.[cite: 3]"], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "BBC 職場自習 (BBC Networking)", "category_en": "BBC Networking Self-Study", "title": "商務社交實戰：Tip Top Trading", "title_en": "Networking Face-to-Face (BBC #48)", "key_takeaways": "【教材重點】\n經濟不景氣 (Tough economic climate) 下的社交：I will give it a shot / Let’s get down to business[cite: 3]。", "key_takeaways_en": "Summary: Networking in a tough economic climate[cite: 3].", "main_content": "A: Do some networking and do some schmoozing with new clients.[cite: 3]\nB: I will give it a shot. Let’s get down to business.[cite: 3]\nA: It is a tough economic climate, we need to be rid of one member of staff.[cite: 3]", "vocab_notes": ["Schmooze (v.)：社交應酬[cite: 3]。", "【課堂延伸】I heard you were in town / out of town：聽說你在鎮上 / 出城。", "【課堂延伸】Get down to business：開始談正事。", "【課堂延伸】Smashing / amazing：極好的。", "【課堂延伸】Mouldy / mold：發霉的。", "【課堂延伸】Biscuit / cookie, a wedge of cheese：餅乾、一塊起司。", "【課堂延伸】Sore loser：輸不起的人。", "【課堂延伸】Sort this out / sort this company out：解決問題 / 整頓公司。", "【課堂延伸】Crumbs / my god：我的天啊。", "【課堂延伸】Bad news go down with them：他們無法接受這壞消息。", "【課堂延伸】Inappropriate：不得體的。"], "vocab_notes_en": ["Schmooze: Talk casually and friendly.[cite: 3]"], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/48-language-for-networking", "link_text": "前往 BBC #48 課程網頁[cite: 4]"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "科技與隱私自習 (Tech & Privacy)", "category_en": "Tech & Privacy Self-Study", "title": "Passkey 與智慧眼鏡防偷拍", "title_en": "Passkeys & Smart Glasses Hack", "key_takeaways": "【自習任務】\n1. 了解 Passkey 如何成為未來的網路安全解答[cite: 4]。\n2. 了解如何防止被 Smart Glasses 偷拍[cite: 4]。", "key_takeaways_en": "Explore biometric passkeys and privacy hacks[cite: 4].", "main_content": "• Watch the videos about Passkey and Smart Glasses to learn new tech vocabulary.[cite: 4]", "vocab_notes": ["【課堂延伸】Biometrics：生物辨識。", "【課堂延伸】Encryption：加密。", "【課堂延伸】Identify：辨識。", "【課堂延伸】Fraud：詐騙。", "【課堂延伸】Harass：騷擾。", "【課堂延伸】Consent：同意。", "【課堂延伸】Copyright from infringement：侵犯版權。", "【課堂延伸】Inevitably：不可避免地。"], "vocab_notes_en": ["Passkey: A digital credential.[cite: 4]"], "link": "https://www.youtube.com/watch?v=lf5L_1oqHDs", "link_text": "觀看 BBC Passkey 影片[cite: 4]"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "CNN 短片 (Smart Glasses)", "category_en": "CNN Shorts", "title": "Smart Glasses 隱私防範", "title_en": "Smart Glasses Privacy Hack", "key_takeaways": "【自習任務】觀看 CNN 短片，了解智慧眼鏡偷拍的防範方法[cite: 4]。", "key_takeaways_en": "Learn to avoid being filmed by smart glasses[cite: 4].", "main_content": "• If You Think You’re Being Filmed by Smart Glasses, Try This[cite: 4]", "vocab_notes": ["【課堂延伸】Filmed：被拍攝。"], "vocab_notes_en": ["Film: To record on camera.[cite: 4]"], "link": "https://youtube.com/shorts/H7qyXwntx08?si=zc6OtSPaJOuWMik9", "link_text": "觀看 CNN Smart Glasses 影片[cite: 4]"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "工作日常與職責 (Work Routine)", "category_en": "Work Routine & Duties", "title": "日常工作職責與頻率副詞", "title_en": "Work Routine & Frequency Adverbs", "key_takeaways": "【教材重點】\n1. 詢問職業：What do you do for a living? / I am responsible for...[cite: 6]\n2. 分析數據與報告：analyze data / write reports[cite: 6]。\n3. 頻率副詞：never, rarely, sometimes, occasionally, often, usually, always[cite: 6]。", "key_takeaways_en": "Describing daily responsibilities and frequency adverbs[cite: 6].", "main_content": "A: What do you do for a living?[cite: 6]\nB: I am responsible for a team of 5 people.[cite: 6]\nA: What does your typical workday look like?[cite: 6]\nB: I analyze sales data, and I often write reports.[cite: 6]", "vocab_notes": ["Responsible for (adj.)：負責的[cite: 6]。", "Analyze (v.)：分析[cite: 6]。", "Rarely (adv.)：很少[cite: 6]。", "【課堂延伸】介紹自己工作的日常。", "【課堂延伸】Sometimes, sometime, some time：有時候、某個時候、一段時間。", "【課堂延伸】WFH (Work From Home)：在家工作。", "【課堂延伸】Cycle to and from：騎腳踏車上下班。", "【課堂延伸】Resolve inter-departmental conflicts：解決跨部門衝突。", "【課堂延伸】Track milestone：追蹤里程碑。", "【課堂延伸】Collect：收集。", "【課堂延伸】Chief executive officer：執行長。", "【課堂延伸】Sri Lanka：斯里蘭卡。"], "vocab_notes_en": ["Responsible for: In charge of.[cite: 6]"], "practice_quiz": [{"question": "【填空題】He works _________. (努力工作)[cite: 6]", "answer": "✔ 填空解答：hard[cite: 6]"}], "link": "", "link_text": ""}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "線上會議 (Virtual Meetings)", "category_en": "Online Meetings", "title": "線上會議填空與比較", "title_en": "Online Meetings Pros & Cons", "key_takeaways": "【教材重點】\n1. 會議文件：budget, agenda, update, presentation[cite: 6]。\n2. 會議型態比較：Online meeting vs face-to-face meeting 的優缺點[cite: 6]。", "key_takeaways_en": "Meeting vocabulary and comparing meeting types[cite: 6].", "main_content": "A: The agenda says the meeting starts at 10 a.m.[cite: 6]\nB: Please calculate the costs before the meeting.[cite: 6]\nA: Can you give me an update on it?[cite: 6]", "vocab_notes": ["Agenda (n.)：議程[cite: 6]。", "Budget (n.)：預算[cite: 6]。", "【課堂延伸】Brief：簡報/摘要。", "【課堂延伸】Figure / number / do the math：數字 / 計算。", "【課堂延伸】Online meeting / face-to-face meeting：線上會議 / 實體會議。", "【課堂延伸】Pros / cons：優點 / 缺點。", "【課堂延伸】Get distributed easily / concentrated easily：容易分心 (應為 distracted) / 容易專注。", "【課堂延伸】Time consumption：耗時。", "【課堂延伸】Hidden agenda / push one's agenda：隱藏意圖 / 推動某人計畫。"], "vocab_notes_en": ["Agenda: A list of items to be discussed.[cite: 6]"], "link": "", "link_text": ""}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "官方影音自習 (BP Video 1.1.1)", "category_en": "Official Video 1.1.1", "title": "日常工作描述 (BP Video 1.1.1)", "title_en": "Business Partner A2 Video 1.1.1", "key_takeaways": "【聽力任務】\n比較 Liz、Ellen 與 Muj 的工作開始時間、出差頻率與日常職責[cite: 6]。", "key_takeaways_en": "Watch Video 1.1.1 and compare work routines[cite: 6].", "main_content": "• 聽力精選對話句型:\nA: Who starts work at 7:30?[cite: 6]\nB: Liz does. She processes orders for the sales team.[cite: 6]\nA: Who analyses data and writes reports?[cite: 6]\nB: Muj does.[cite: 6]", "vocab_notes": ["Process orders (v. phr.)：處理訂單[cite: 6]。", "Take notes (v. phr.)：做筆記[cite: 6]。", "【課堂延伸】Sign on the dotted line：在虛線上簽名 (正式簽約)。"], "vocab_notes_en": ["Process orders: To handle requests.[cite: 6]"], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U1L1_1.1.1.mp4", "link_text": "觀看 BP Video 1.1.1[cite: 5]"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "腳本閱讀 (BP Script)", "category_en": "Video Script Reading", "title": "BP Video Script (Video 1.1.1)", "title_en": "BP Video Script PDF", "key_takeaways": "【閱讀任務】請參閱腳本第 1 頁，閱讀 Video 1.1.1 完整對白文字檔[cite: 5]。", "key_takeaways_en": "Read Video Script 1.1.1 on page 1[cite: 5].", "main_content": "• 請開啟 PDF 檔案對照聽力[cite: 5]。", "vocab_notes": ["【課堂延伸】Sign：簽名/標誌。"], "vocab_notes_en": ["Transcript: Written text.[cite: 5]"], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_Video.pdf", "link_text": "閱讀 BP 影音腳本 (Page 1)[cite: 5]"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "線上會議除錯 (Usherwood)", "category_en": "Video Conferencing Issues", "title": "視訊會議 6 大常見問題與排解", "title_en": "6 Common Issues with Video Conferencing", "key_takeaways": "【文章重點】掌握視訊會議音訊與連線故障排除[cite: 5]。", "key_takeaways_en": "Learn professional expressions for troubleshooting 6 common video glitches[cite: 5].", "main_content": "• 閱讀文章，學習解決會議技術問題[cite: 5]。", "vocab_notes": ["【課堂延伸】Static：雜音。", "【課堂延伸】Frozen：畫面卡住。", "【課堂延伸】Glitch：小故障。", "【課堂延伸】Grainy：畫質模糊。", "【課堂延伸】You are on mute：你靜音了。", "【課堂延伸】Breaking up：聲音斷斷續續。", "【課堂延伸】On and off：斷斷續續。", "【課堂延伸】Get cut off：斷線。", "【課堂延伸】Echo / feedback：回音。"], "vocab_notes_en": ["Troubleshoot: Solving problems.[cite: 5]"], "link": "https://www.usherwood.com/blog/6-common-issues-with-video-conferencing-and-how-to-solve-them", "link_text": "閱讀 6 Common Issues 文章[cite: 5]"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "官方影音自習 (BP Video 4.4.1)", "category_en": "Official Video 4.4.1", "title": "線上會議問題特訓 (BP Video 4.4.1)", "title_en": "Problems Encountered in Online Meetings", "key_takeaways": "【聽力任務】觀察三段對話（Conversation 1, 2, 3）中的連線與會議問題[cite: 6]。", "key_takeaways_en": "Identify problems in online meetings[cite: 6].", "main_content": "• 聽取對話中遭遇的技術困難[cite: 6]。", "vocab_notes": ["【課堂延伸】Pound key：井字鍵 (#)。", "【課堂延伸】Recap：總結。"], "vocab_notes_en": ["Identify problems in video calls.[cite: 6]"], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U4L4_4.4.1.mp4", "link_text": "觀看 BP Video 4.4.1[cite: 5]"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "實境短片 (Tripp & Tyler)", "category_en": "Real Life Conference Calls", "title": "A Conference Call in Real Life", "title_en": "A Conference Call in Real Life", "key_takeaways": "【影音學習】幽默呈現真實視訊會議狀況[cite: 5]。", "key_takeaways_en": "Comedic depiction of conference calls[cite: 5].", "main_content": "• 學習會議中的尷尬狀況用語[cite: 5]。", "vocab_notes": ["【課堂延伸】Troll：網路酸民/搗亂者。"], "vocab_notes_en": ["Troll: Someone who leaves intentionally annoying messages.[cite: 5]"], "link": "https://www.youtube.com/watch?v=DYu_bGbZiiQ", "link_text": "觀看 Tripp & Tyler 影片 (Audio Call)[cite: 5]"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "進階實境短片 (Tripp & Tyler)", "category_en": "Video Conference Call in Real Life", "title": "A Video Conference Call in Real Life", "title_en": "A Video Conference Call in Real Life", "key_takeaways": "【影音學習】加入視訊畫面後的尷尬會議實況[cite: 5]。", "key_takeaways_en": "Comedic depiction of video conference calls[cite: 5].", "main_content": "• 學習視訊畫面分享的常用語[cite: 5]。", "vocab_notes": ["【課堂延伸】Crepe, creep：可麗餅，怪胎 (易混淆字)。"], "vocab_notes_en": ["Video conferencing terminology.[cite: 5]"], "link": "https://www.youtube.com/watch?v=JMOOG7rWTPq", "link_text": "觀看 Tripp & Tyler 影片 (Video Call)[cite: 5]"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "商業自習 (CNBC)", "category_en": "CNBC Self-Study", "title": "商業思維：Costco 汽油", "title_en": "Why Costco Gas is So Cheap", "key_takeaways": "【商業學習】了解好市多為什麼汽油便宜[cite: 5]。", "key_takeaways_en": "Self-study business analysis on Costco gas pricing[cite: 5].", "main_content": "• 學習商業定價策略[cite: 5]。", "vocab_notes": ["【課堂延伸】Barista：咖啡師。"], "vocab_notes_en": ["Profit margin analysis.[cite: 5]"], "link": "https://www.youtube.com/watch?v=vvBYMNXgfVo", "link_text": "觀看 CNBC 影片[cite: 5]"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "心理學自習 (BBC Global)", "category_en": "BBC Self-Study", "title": "心理學：哼唱好處", "title_en": "The Psychological Benefits of Humming", "key_takeaways": "【心理學學習】了解哼唱如何幫助身體放鬆[cite: 5]。", "key_takeaways_en": "BBC psychological benefits of humming[cite: 5].", "main_content": "• 學習身心健康相關單字[cite: 5]。", "vocab_notes": ["【課堂延伸】Blended family：繼親家庭。", "【課堂延伸】LGBTQ：多元性別族群。", "【課堂延伸】Bridesmaid：伴娘。", "【課堂延伸】Wig：假髮。"], "vocab_notes_en": ["Psychological well-being.[cite: 5]"], "link": "https://www.youtube.com/watch?v=LCW5Ftg0_uI", "link_text": "觀看 BBC Global 影片[cite: 5]"}];
        let filteredPool = [];
        let currentIndex = 0;
        let currentTab = 'sentence';

        function switchAppMode(mode, btn) {
            document.querySelectorAll('.main-mode-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            document.getElementById('viewCards').style.display = (mode === 'cards') ? 'block' : 'none';
            document.getElementById('viewExam').style.display = (mode === 'exam') ? 'block' : 'none';
        }

        function initWeekOptions() {
            const selector = document.getElementById('weekFilter');
            selector.innerHTML = "";
            const weekMap = {};
            rawDatabase.forEach(item => {
                if (item.week && !weekMap[item.week]) {
                    weekMap[item.week] = item.class_date || "2026";
                }
            });

            Object.keys(weekMap).sort().forEach(w => {
                const opt = document.createElement('option');
                opt.value = w;
                opt.innerText = w.toUpperCase();
                selector.appendChild(opt);
            });
        }

        function setTab(tabName) {
            currentTab = tabName;
            document.getElementById('tabSentence').classList.toggle('active', tabName === 'sentence');
            document.getElementById('tabMedia').classList.toggle('active', tabName === 'media');
            applyFilters();
        }

        function applyFilters() {
            const selectedWeek = document.getElementById('weekFilter').value;
            filteredPool = rawDatabase.filter(item => {
                const wMatch = String(item.week).trim().toLowerCase() === String(selectedWeek).trim().toLowerCase();
                const tMatch = String(item.type).trim().toLowerCase() === String(currentTab).trim().toLowerCase();
                return wMatch && tMatch;
            });
            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            const cardEl = document.getElementById('cardElement');
            cardEl.scrollTop = 0;

            if (!filteredPool.length) {
                document.getElementById('categoryBadge').innerText = "無資料";
                document.getElementById('titleDisplay').innerText = "本分類尚無資料";
                document.getElementById('takeawaysSection').style.display = "none";
                document.getElementById('mainContentSection').style.display = "none";
                document.getElementById('vocabSection').style.display = "none";
                document.getElementById('linkSection').style.display = "none";
                document.getElementById('counterDisplay').innerText = "0 / 0";
                return;
            }

            const item = filteredPool[currentIndex];
            document.getElementById('categoryBadge').innerText = item.category || "教材";
            document.getElementById('counterDisplay').innerText = `${currentIndex + 1} / ${filteredPool.length}`;
            document.getElementById('titleDisplay').innerText = item.title || "";

            const tkSection = document.getElementById('takeawaysSection');
            if (item.key_takeaways) {
                tkSection.style.display = "block";
                document.getElementById('takeawaysDisplay').innerText = item.key_takeaways;
            } else {
                tkSection.style.display = "none";
            }

            document.getElementById('mainContentSection').style.display = "block";
            document.getElementById('mainContentContainer').innerText = item.main_content;

            const vbSection = document.getElementById('vocabSection');
            const vocabUl = document.getElementById('vocabDisplay');
            vocabUl.innerHTML = "";
            if (item.vocab_notes && item.vocab_notes.length > 0) {
                vbSection.style.display = "block";
                item.vocab_notes.forEach(note => {
                    const li = document.createElement('li');
                    li.innerText = note;
                    vocabUl.appendChild(li);
                });
            } else {
                vbSection.style.display = "none";
            }

            const linkSection = document.getElementById('linkSection');
            const linkTag = document.getElementById('linkDisplay');
            if (item.link) {
                linkSection.style.display = "block";
                linkTag.href = item.link;
                linkTag.innerText = "🔗 " + (item.link_text || "開啟連結");
            } else {
                linkSection.style.display = "none";
            }
        }

        function navigateCard(dir) {
            if (!filteredPool.length) return;
            currentIndex = (currentIndex + dir + filteredPool.length) % filteredPool.length;
            renderCard();
        }

        window.onload = () => {
            initWeekOptions();
            applyFilters();
        };
    </script>
</body>
</html>
