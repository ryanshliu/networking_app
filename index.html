<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Networking English - AI Learning Suite</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #1e1b4b;
            --text-body: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --amber-bg: #fffbeb; --amber-border: #fef3c7; --amber-text: #b45309;
            --sky-bg: #f0f9ff; --sky-border: #e0f2fe; --sky-text: #0369a1;
            --emerald-bg: #ecfdf5; --emerald-border: #d1fae5; --emerald-text: #047857;
            --violet-bg: #faf5ff; --violet-border: #e9d5ff; --violet-text: #6b21a8;
            --bubble-a-bg: #ffffff; --bubble-a-border: #cbd5e1; --bubble-a-text: #0f172a;
            --bubble-b-bg: #eef2ff; --bubble-b-border: #c7d2fe; --bubble-b-text: #1e1b4b;
            --app-max-width: 460px;
        }
        @media (min-width: 640px) {
            :root { --app-max-width: 680px; }
            body { padding: 24px 20px !important; }
            h1 { font-size: 28px !important; }
            .card { padding: 28px 26px !important; max-height: 72vh !important; border-radius: 28px !important; }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); margin: 0; padding: 16px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }
        .app-layout { width: 100%; max-width: var(--app-max-width); display: flex; flex-direction: column; }
        .header { width: 100%; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 25px; font-weight: 800; color: var(--text-title); margin: 4px 0 2px 0; }
        .author-badge {
            display: inline-block; font-size: 12px; font-weight: 700; color: var(--primary);
            background-color: var(--primary-soft); padding: 3px 12px; border-radius: 12px; margin-bottom: 8px;
        }
        .main-mode-nav { display: flex; gap: 6px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; margin-bottom: 10px; }
        .main-mode-btn {
            flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 800; border: none; border-radius: 12px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .main-mode-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 3px 10px rgba(79, 70, 229, 0.15); }
        .pen-toolbar { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 12px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
        }
        .tool-btn.active-pen { background-color: #ffe4e6; border-color: #e11d48; color: #e11d48; }
        
        .filters { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        select {
            width: 100%; box-sizing: border-box; padding: 13px 16px; font-size: 16px; font-weight: 700;
            border-radius: 16px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none;
        }
        .tab-group { width: 100%; box-sizing: border-box; display: flex; gap: 8px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 11px 6px; font-size: 15px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12); }
        
        .card-container { width: 100%; flex: 1; display: flex; flex-direction: column; position: relative; }
        .card {
            background-color: var(--card-bg); border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        #drawCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100; }
        .card.canvas-active #drawCanvas { pointer-events: auto; touch-action: none; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .badge.media-badge { background-color: #fef3c7; color: #92400e; }
        .counter { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .title { font-size: 21px; font-weight: 800; color: var(--text-title); margin-bottom: 14px; line-height: 1.35; }
        .block-section { margin-bottom: 18px; text-align: left; }
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 12.5px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
        .tag-violet { background-color: var(--violet-bg); color: var(--violet-text); border: 1px solid var(--violet-border); }
        .block-desc { font-size: 15.5px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }
        
        .dialogue-container { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .chat-bubble-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
        .chat-bubble-row.speaker-b { flex-direction: row-reverse; }
        .speaker-avatar {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; color: #ffffff; flex-shrink: 0; margin-top: 4px;
        }
        .speaker-avatar.avatar-a { background: #2563eb; }
        .speaker-avatar.avatar-b { background: #7c3aed; }
        .chat-bubble-content {
            max-width: 82%; padding: 11px 15px; border-radius: 16px; font-size: 15.5px; line-height: 1.5; font-weight: 600;
        }
        .speaker-a .chat-bubble-content { background-color: var(--bubble-a-bg); border: 1.5px solid var(--bubble-a-border); }
        .speaker-b .chat-bubble-content { background-color: var(--bubble-b-bg); border: 1.5px solid var(--bubble-b-border); }
        
        .vocab-ul { margin: 0; padding-left: 20px; font-size: 15px; color: var(--text-body); line-height: 1.7; }
        .vocab-ul li { margin-bottom: 10px; line-height: 1.6; }
        .highlight-term { color: #3730a3 !important; font-weight: 800 !important; }
        .ipa-tag { color: #6d28d9; font-weight: 700; margin: 0 2px; }

        .quiz-card {
            background-color: var(--violet-bg); border: 1.5px solid var(--violet-border);
            border-radius: 18px; padding: 16px; margin-bottom: 12px;
        }
        .quiz-q { font-size: 15.5px; font-weight: 700; color: #4c1d95; line-height: 1.6; margin-bottom: 10px; }
        .blank-line { display: inline-block; min-width: 80px; border-bottom: 2.5px solid #7c3aed; margin: 0 4px; }
        .quiz-toggle-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff; border: none; padding: 7px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer;
        }
        .quiz-ans-wrapper { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d8b4fe; }
        .quiz-ans-box {
            background: #ffffff; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #bbf7d0;
            font-size: 15px; color: #14532d; line-height: 1.65; white-space: pre-line; font-weight: 600;
        }

        .link-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-color); text-align: left; }
        .link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
            padding: 13px 18px; font-size: 15px; color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            text-decoration: none; font-weight: 700; border-radius: 14px;
        }

        /* 8 大模式 UI */
        .suite-scope-nav { display: flex; gap: 6px; background-color: #f1f5f9; padding: 4px; border-radius: 14px; margin-bottom: 10px; }
        .suite-scope-btn {
            flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 800; border: none; border-radius: 10px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .suite-scope-btn.active { background: #ffffff; color: var(--primary); }
        .suite-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .suite-btn {
            background: #ffffff; border: 1.5px solid #cbd5e1; padding: 10px 8px; border-radius: 14px;
            font-size: 13px; font-weight: 800; color: #334155; cursor: pointer; text-align: left;
        }
        .suite-btn.active { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
        .suite-panel { background: #ffffff; border: 1.5px solid var(--border-color); border-radius: 20px; padding: 18px; }

        .podcast-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #ffffff; padding: 20px 16px; border-radius: 20px; text-align: center;
        }
        .podcast-controls {
            display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 12px 0;
            background: rgba(0, 0, 0, 0.25); padding: 14px; border-radius: 16px;
        }
        .control-row { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 13.5px; color: #c7d2fe; }
        .accent-select { background: #ffffff; color: #1e1b4b; font-weight: 800; padding: 6px 10px; border-radius: 10px; border: none; }
        .podcast-play-btn {
            background: #10b981; color: #fff; border: none; padding: 13px 26px; border-radius: 24px;
            font-size: 15.5px; font-weight: 800; cursor: pointer;
        }
        .podcast-play-btn.playing { background: #ef4444 !important; }

        .nav-controls { width: 100%; display: flex; gap: 12px; margin-top: 12px; }
        .nav-btn { flex: 1; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="header">
            <h1>Networking English</h1>
            <div class="author-badge">By Ryan Liu, V1.2</div>
            <div class="main-mode-nav">
                <button class="main-mode-btn active" onclick="switchAppMode('cards', this)">📚 學習卡片</button>
                <button class="main-mode-btn" onclick="switchAppMode('suite', this)">⚡ 8大學習模組</button>
                <button class="main-mode-btn" onclick="switchAppMode('exam', this)">📝 全真模擬考</button>
            </div>
            <div class="pen-toolbar">
                <button id="penBtn" class="tool-btn" onclick="togglePenMode()">🖍️ 細畫筆</button>
                <button class="tool-btn" onclick="undoLastStroke()">↩️ 復原</button>
                <button class="tool-btn" onclick="clearAllCanvas()">🗑️ 全清</button>
            </div>
        </div>

        <!-- 視圖 1: 學習卡片模式 -->
        <div id="viewCards">
            <div class="filters">
                <select id="weekFilter" onchange="applyFilters()"></select>
                <div class="tab-group">
                    <button id="tabSentence" class="tab-btn active" onclick="setTab('sentence')">句型 / 文法</button>
                    <button id="tabMedia" class="tab-btn" onclick="setTab('media')">影音 / 自習</button>
                </div>
            </div>

            <div class="card-container">
                <div class="card" id="cardElement">
                    <canvas id="drawCanvas"></canvas>
                    <div>
                        <div class="card-header">
                            <div>
                                <span class="badge" id="categoryBadge">分類</span>
                                <span style="font-size: 12.5px; color: #64748b;" id="dateDisplay"></span>
                            </div>
                            <span class="counter" id="counterDisplay">0 / 0</span>
                        </div>
                        <div class="title" id="titleDisplay">標題</div>

                        <div class="block-section" id="takeawaysSection">
                            <div class="tag-title tag-amber">💡 核心重點說明</div>
                            <div class="block-desc" id="takeawaysDisplay"></div>
                        </div>

                        <div class="block-section" id="mainContentSection">
                            <div class="tag-title tag-sky">📖 學習內容與核心對話</div>
                            <div id="mainContentContainer"></div>
                        </div>

                        <div class="block-section" id="quizSection">
                            <div class="tag-title tag-violet">✍️ 實戰練習題</div>
                            <div id="quizContainer"></div>
                        </div>

                        <div class="block-section" id="vocabSection">
                            <div class="tag-title tag-emerald">📝 重點單字與注意事項</div>
                            <ul class="vocab-ul" id="vocabDisplay"></ul>
                        </div>

                        <div class="block-section" id="taskSection">
                            <div class="tag-title tag-violet">🎯 下週課堂延續示範任務</div>
                            <div id="taskContainer" class="block-desc"></div>
                        </div>
                    </div>

                    <div class="link-box" id="linkSection">
                        <a class="link-btn" id="linkDisplay" href="#" target="_blank">🔗 開啟延伸閱讀與學習資源</a>
                    </div>
                </div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
                <button class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
            </div>
        </div>

        <!-- 視圖 2: 8 大特訓模組 -->
        <div id="viewSuite" style="display: none;">
            <div class="suite-scope-nav">
                <button id="scopeCurrentBtn" class="suite-scope-btn active" onclick="setSuiteScope('current', this)">📌 當前選定週次</button>
                <button id="scopeAllBtn" class="suite-scope-btn" onclick="setSuiteScope('all', this)">🌐 全部課程大整合</button>
            </div>

            <div class="suite-grid">
                <button class="suite-btn active" onclick="loadSuiteTool('guide', this)">📖 速成指南</button>
                <button class="suite-btn" onclick="loadSuiteTool('socratic', this)">🏛️ 蘇格拉底問答</button>
                <button class="suite-btn" onclick="loadSuiteTool('forecaster', this)">🎯 考點預測 Top5</button>
                <button class="suite-btn" onclick="loadSuiteTool('confusion', this)">💡 盲點澄清器</button>
                <button class="suite-btn" onclick="loadSuiteTool('gap', this)">🔍 知識缺口診斷</button>
                <button class="suite-btn" onclick="loadSuiteTool('podcast', this)">🎙️ Audio Podcast</button>
            </div>

            <div class="suite-panel" id="suiteContentPanel"></div>
        </div>

        <!-- 視圖 3: 全真模擬考卷 -->
        <div id="viewExam" style="display: none;">
            <div class="card" style="max-height: 75vh;">
                <h2 style="font-size: 20px; color: #1e1b4b; margin-top:0;">📝 Networking English 全真模擬檢測試卷</h2>
                <div id="examContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const rawDatabase = [{"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "社交問候 (Greetings)", "category_en": "Greetings & Small Talk", "title": "打招呼與近況寒暄 (Greetings & Responses)", "title_en": "Greetings & Daily Catch-ups", "key_takeaways": "1. 熟人與同事間的自然問候：優先使用 Hey there! 或 How’s it going?。\n2. 描述近況平淡無波折時：避免只說 I'm fine，使用 Same old, same old 或 The usual 更在地自然。", "key_takeaways_en": "1. Natural casual greetings: Use Hey there! or How’s it going? among coworkers.\n2. Neutral responses: Instead of just saying I’m fine, use Same old, same old or The usual for natural daily updates.", "main_content": "A: Hey there! How’s it going?\nB: Same old, same old! Pretty much the same.\nA: How are things with you?\nB: Can't complain, things have been pretty uneventful.", "vocab_notes": ["Same old, same old [sem old, sem old (idiom)：老樣子、一切照舊。\n  例句：How’s business these days? — Oh, *same old, same old*. We’re keeping busy.", "Uneventful [ˌʌnɪˈvɛntfəl (adj.)：平靜無事的、沒有重大事故發生的。\n  例句：The overnight plant operation was smooth and completely *uneventful*.", "How have you been? (phrase)：你最近好嗎？（現在完成式，詢問上次見面以來的近況）。\n  例句：It’s great to see you again in Kaohsiung! *How have you been*?", "Can't complain (idiom)：挺好的、沒什麼好挑剔的。\n  例句：How’s the new safety system working out? — *Can't complain*, it’s very reliable."], "vocab_notes_en": ["Same old, same old: Common idiom indicating that life or work is going on as usual.\n  Example: How’s business these days? — Oh, *same old, same old*.", "Uneventful: Adjective meaning quiet with no unexpected or disruptive events.\n  Example: The overnight plant operation was completely *uneventful*."], "practice_quiz": [{"question": "【填空題】同事問你 How’s work going?，你想回答「老樣子，一切照舊」：\n_________ , _________ ! Pretty much the same.", "question_en": "Fill-in-the-blank: When asked How’s work going?, reply that everything is as usual:\n_________ , _________ ! Pretty much the same.", "answer": "✔ 填空解答：Same old, same old\n👉 整句回答：Same old, same old! Pretty much the same.\n💡 解析：Same old, same old 是最道地的口語說法，用來表達一切如常。"}], "instant_guide": {"core_concepts": ["1. 破冰開場語意強度階梯（Formal -> Casual）。", "2. 中性回答（Neutral Responses）的語境運用。"], "misconceptions": ["誤解 1：以為每次都要回覆 I'm fine, thank you, and you?（過於生硬機械化）。", "誤解 2：以為 Same old 帶有負面抱怨意涵（其實是非常健康的日常中性表達）。"], "exam_questions": ["Q1: 當外國客戶在走廊問你 How are things?，請給出 2 種比 I am fine 更自然的回覆。"]}, "socratic_quiz": [{"level": "社交應對 (Level 1)", "prompt": "如果對方問你 How's it going?，你可以回答 I'm fine 嗎？為什麼母語人士很少這樣說？", "feedback": "可以，但在語感上偏向制式教科書用語。母語人士更常使用 Good, how are you?、Can't complain 或 Same old, same old 來建立平易近人的連結。"}], "confusion_fixer": {"analogy": "【生活類比】：問候就像打羽球發球。I'm fine 像是把球直接打在網上停住；而 Same old, how about you? 則是把球順暢地拍回對方場地。", "real_example": "在走廊遇到同事：Hey Ryan, how are things? ➔ Can't complain, just wrapping up the weekly safety audit. How are things on your side?", "common_mistake": "錯誤：How do you do? 用於熟人寒暄（✖ 錯誤，這只用於非常正式的初次見面握手場合）。"}, "gap_finder": ["⚠️ 潛在缺口：缺少主動拋出第二個問題（Bounce-back question）延續話題的習慣。"]}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "影音自習 (Video Study)", "category_en": "Video Self-Study", "title": "商務社交情境：巴黎會面 (Business Partner A2 5.4.1)", "title_en": "Business Socializing in Paris (BP A2 5.4.1)", "key_takeaways": "【詳細劇情情境摘要】\nJulia 抵達巴黎參加商務研討會，與合作夥伴 Maria 和 Max 會面。對話圍繞著抵達的交通方式、入住飯店品質展開。Max 提及雖然飯店房間不大，但勝在舒適且離展場步行僅需幾分鐘。最後三人順勢敲定當晚的晚餐邀約。", "key_takeaways_en": "Summary: Julia arrives in Paris for a conference and meets partners Maria and Max. They discuss travel routes and hotel comfort before planning a joint dinner.", "main_content": "A: When did you arrive in Paris?\nB: I flew in yesterday afternoon. Traffic from the airport was heavy.\nA: How is the hotel you are staying at?\nB: The room is small, but comfortable, and it is a 5-minute walk to the exhibition venue.\nA: Do you have plans for dinner tonight?\nB: Would you like to join us for French bistro dishes? Count me in!", "vocab_notes": ["Exhibition venue [ˌɛksəˈbɪʃən ˈvɛnju (n.)：展覽會場、大會場地。\n  例句：The *exhibition venue* is equipped with advanced presentation rooms.", "Fly in / Fly here (v. phr.)：搭機抵達（商務差旅高頻動詞）。\n  例句：Our technical consultants *flew in* from Singapore this morning.", "Roll one's eyes [rol wʌnz aɪz (idiom)：翻白眼（表達無奈或受不了）。\n  例句：He *rolled his eyes* when the keynote speech ran 30 minutes over schedule."], "vocab_notes_en": ["Exhibition venue: The designated conference center or exhibition hall.", "Fly in / Fly here: Arrive by airplane for a business trip."], "next_week_tasks": ["💡 課堂示範預告：下週會隨機請同學模擬巴黎會面情境（扮演 Julia, Maria 或 Max），請準備好 30 秒抵達交通與飯店評價對話。"], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U5L4_5.4.1.mp4", "link_text": "觀看 Business Partner 5.4.1 影片 (MP4)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation)", "category_en": "Travel & Logistics", "title": "研討會住宿與地鐵動線描述 (AIChE Minneapolis)", "title_en": "AIChE Conference Transit & Hotel Proximity", "key_takeaways": "【課堂情境與學習重點】\n1. 商務差旅中（以赴美參加 AIChE 2026 年會為例）精確描述飯店距離、步行時間、地鐵直達與免轉乘動線。\n2. 詢問與說明房價預算、掌握明尼阿波利斯 Skyway 空中步道系統在防寒與通行上的優勢。", "key_takeaways_en": "1. Describe hotel distances, walking duration, and direct transit without transfers.\n2. Inquire about room rates and leverage the Minneapolis Skyway climate-controlled system.", "main_content": "A: The hotel is near the subway station and within walking distance.\nB: From the hotel, can I take the subway directly to the conference venue?\nA: Yes, you can take the Blue Line directly. You don't need to transfer.\nB: That is very convenient. I have no idea about their room price.", "vocab_notes": ["Proximity [prɑkˈsɪməti (n.)：鄰近、接近程度。\n  例句：The *proximity* of our hotel to the convention center saved us a lot of travel time.", "Transfer [trænsˈfɚ (v./n.)：轉乘、換線。\n  例句：Take the Blue Line directly; there is no need to *transfer* at all.", "Within walking distance (phr.)：步行可達的距離。\n  例句：Several great local restaurants are located *within walking distance*.", "Skyway system [ˈskaɪˌwe ˈsɪstəm (n.)：空中連通步道系統（防寒/防雨通道）。\n  例句：You can navigate downtown Minneapolis comfortably via the indoor *Skyway system*."], "vocab_notes_en": ["Proximity: Nearness in space, time, or relationship.", "Transfer: Change from one transit route or vehicle to another.", "Within walking distance: Easily accessible on foot."], "practice_quiz": [{"question": "【填空題】商務出差描述飯店「走路就可抵達會場」，請填入核心片語：\nThe hotel is _________ _________ distance to the conference center.", "question_en": "Fill-in-the-blank: State that the hotel is easily walkable to the venue:\nThe hotel is _________ _________ distance to the conference center.", "answer": "✔ 填空解答：within walking\n👉 整句回答：The hotel is within walking distance to the conference center.\n💡 解析：within walking distance 是商務訂房與交通指南中最常用的片語。"}], "instant_guide": {"core_concepts": ["1. 步行距離固定片語：within walking distance（或 It’s a 5-minute walk）。", "2. 免轉乘直達表達：take the Blue Line directly without transferring。"], "misconceptions": ["誤解 1：將『直達』說成 go direct（應使用副詞 directly）。"], "exam_questions": ["Q1: 請用一句話說明『飯店離地鐵站非常近，步行只要 5 分鐘』。"]}, "socratic_quiz": [{"level": "差旅規劃 (Level 1)", "prompt": "在預訂國際研討會飯店時，為什麼向主辦方確認 'within walking distance' 比離機場近更關鍵？", "feedback": "因為研討會每日行程緊湊且常有夜間社交（Happy Hour），步行可達能省下大量等車與轉乘的時間成本。"}], "confusion_fixer": {"analogy": "【生活類比】：出差選飯店就像選高鐵站旁邊的停車場，'within walking distance'（走路就到）永遠比『便宜但要轉兩班公車』更具時間效益！", "real_example": "出差報告：We selected the Hyatt because it is *within walking distance* to the AIChE venue and connects directly via the Skyway.", "common_mistake": "錯誤：The hotel is in walking distance.（介系詞必須搭配 within，即 within walking distance）。"}, "gap_finder": ["⚠️ 潛在缺口：在美加寒帶城市出差時，常忽略利用 Skyway 系統避開風雪的英文詢問方式。"], "link": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf?v=1726683206", "link_text": "Minneapolis Skyway & Hotel Map"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "BBC 職場自習 (BBC Networking)", "category_en": "BBC Networking Self-Study", "title": "商務社交實戰：Tip Top Trading (BBC #48 Face-to-face)", "title_en": "Networking Face-to-Face (BBC #48)", "key_takeaways": "【詳細劇情情境摘要】\nTip Top Trading 的員工參加產業大會。Anna 必須在會場與同業積極拓展人脈（Networking）。同時公司正面臨嚴峻的經濟景氣（Tough economic climate），管理階層面臨裁員縮編壓力（Reduce team / be rid of staff）。Anna 必須把握展會機會展現熱情，積極爭取新商機。", "key_takeaways_en": "Summary: Anna attends an industry conference to network in a tough economic climate. She must be friendly and chatty to secure new business and impress management.", "main_content": "A: Do some networking and do some schmoozing with new clients.\nB: I’ll give it a shot. Let’s get down to business.\nA: It is a tough economic climate, and we need new opportunities.\nB: Here is my business card should you want to call.", "vocab_notes": ["Schmooze [ʃmuz (v.)：社交應酬、拉攏關係、建立人脈（商務口語高頻詞）。\n  例句：Conference receptions are the perfect venue to *schmooze* with industry partners.", "Be rid of [bi rɪd əv (v. phr.)：擺脫、裁減（員工）。\n  例句：During corporate restructuring, the firm sought to *be rid of* redundant positions.", "Tough economic climate (n. phr.)：艱困的經濟大環境。\n  例句：Companies must optimize operational efficiency in this *tough economic climate*."], "vocab_notes_en": ["Schmooze: Talk casually and friendly in a social/business setting to gain advantage.", "Be rid of: Dismiss or free oneself from someone or something redundant."], "next_week_tasks": ["💡 課堂角色扮演預告：下週課堂將進行兩人一組 Networking 配對演練，請務必熟記『投影片全劇本』的 6 階段對話流程！"], "link": "https://www.bbc.co.uk/learningenglish/features/english-at-work/48-language-for-networking", "link_text": "前往 BBC 課程網頁 (收聽音檔與劇本)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "展會深度洽談 (Trade Fair In-depth)", "category_en": "Trade Fair In-depth Discussion", "title": "規格需求詢問與價值主張 (Exploring Client Needs & Value Pitch)", "title_en": "Exploring Client Needs & Value Proposition", "key_takeaways": "【課堂情境與學習重點】\n1. 展會進階技巧：從表面的寒暄，自然推進到詢問對方的實際工程規格與技術痛點。\n2. 價值主張 (Value Proposition)：避免空洞吹噓，使用精準動詞（streamline, optimize, comply with）陳述能為對方帶來的實質效益。", "key_takeaways_en": "1. Advanced Networking: Move from polite small talk to uncovering technical specs and client pain points.\n2. Value Proposition: Use strong business verbs (streamline, optimize, comply with) to articulate concrete operational benefits.", "main_content": "A: What specific challenges are you currently facing with your chemical distribution lines?\nB: We are struggling with vapor emissions during high-temperature transfers.\nA: That’s a critical safety issue. Our team has developed an automated vapor recovery system that complies with the latest environmental regulations.\nB: Really? Does it integrate seamlessly with existing PLC architectures?\nA: Absolutely. In fact, it typically reduces VOC emissions by over 95% without disrupting daily throughput.", "vocab_notes": ["Vapor emission [ˈvepɚ ɪˈmɪʃən (n.)：蒸氣排放、氣體揮發逸散。\n  例句：Strict environmental audits require minimizing all chemical *vapor emissions* across the plant.", "Comply with [kəmˈplaɪ wɪð (v. phr.)：遵守、符合（法規或安全規範）。\n  例句：Our storage tanks fully *comply with* international OSHA and CCPS standards.", "Seamlessly [ˈsimləsli (adv.)：無縫地、完美銜接順暢地。\n  例句：The updated monitoring software integrates *seamlessly* with our existing DCS control loop.", "Throughput [ˈθruˌpʊt (n.)：生產吞吐量、單位時間產出率。\n  例句：Upgrading safety valves must not compromise total daily production *throughput*."], "vocab_notes_en": ["Vapor emission: Gas or vapor released into the air during industrial chemical operations.", "Comply with: Act in accordance with rules, safety regulations, or standards.", "Seamlessly: Smoothly and continuously, without noticeable transitions or interruptions."], "practice_quiz": [{"question": "【填空題】你想說明新安全模組「完全符合法規規範」，請填入動詞片語 comply ___：\nAll our safety valves strictly _________ _________ the latest ISO standards.", "question_en": "Fill-in-the-blank: State that equipment conforms to official regulations:\nAll our safety valves strictly _________ _________ the latest ISO standards.", "answer": "✔ 填空解答：comply with\n👉 整句回答：All our safety valves strictly comply with the latest ISO standards.\n💡 解析：comply with 是法規與安全合規最標準的高頻商務片語。"}], "instant_guide": {"core_concepts": ["1. 挖掘痛點提問法：'What specific challenges are you facing with...?'", "2. 效益量化呈現：'It reduces VOC emissions by over 95% without disrupting throughput.'", "3. 相容性確認：'Does it integrate seamlessly with...?'"], "misconceptions": ["誤解 1：急於推銷產品硬體，忽略詢問客戶既有系統的相容性 (Compatibility)。", "誤解 2：使用模糊宣稱（如 very good），應改用具體數字（reduces by 95%）。"], "exam_questions": ["Q1: 請用英文向客戶說明你的製程改善方案能『無縫整合至現有產線』。"]}, "socratic_quiz": [{"level": "技術銷售策略 (Level 1)", "prompt": "當客戶提出『蒸氣逸散』痛點時，為什麼先確認『現有系統相容性 (Integrate seamlessly)』比直接報價更關鍵？", "feedback": "因為工業與化工客戶最關心的是停機時間（Downtime）與整合風險。確認能無縫接軌，才能消除採購顧慮並奠定技術信任。"}], "confusion_fixer": {"analogy": "【生活類比】：介紹新設備就像幫手機換充電線。客戶最怕買了新接頭卻不能插在舊手機上；因此 'integrates seamlessly'（無縫整合相容）比單純強調線材很粗更具說服力！", "real_example": "向客戶簡報：Our safety valve retrofit *complies with* all local regulations and integrates *seamlessly* into your plant without requiring extended shutdown.", "common_mistake": "錯誤：The system complies to the standard.（✖ 嚴重介系詞錯誤！comply 必須搭配 with，conforming 才是搭配 to）。"}, "gap_finder": ["⚠️ 潛在缺口 1：在說明效益時，缺乏將專業術語（VOC, scrubber, PLC）轉化為商業財務語言（ROI, payback period）的能力。", "⚠️ 潛在缺口 2：容易將 comply with 誤用為 comply to。"]}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "商務談判自習 (Negotiation Study)", "category_en": "Business Negotiation Study", "title": "商務合作意向與條件商討 (Business Partner A2 6.4.1)", "title_en": "Negotiating Terms & Mutual Value (BP A2 6.4.1)", "key_takeaways": "【詳細劇情情境摘要】\n雙方代表在經過前期的展會初步接觸後，正式進入商務合作細節商討。對話聚焦於供貨週期（Lead Time）、保固維修條款以及最小採購量（MOQ）。雙方透過專業退讓與交換條件（Trade-offs），展現兼顧彼此成本與風險控制的雙贏策略。", "key_takeaways_en": "Summary: Business representatives negotiate supply lead times, warranty terms, and minimum order quantities, demonstrating professional concession techniques to achieve a win-win partnership.", "main_content": "A: What is your standard lead time for customized chemical sensor units?\nB: Typically it takes 4 to 6 weeks from purchase order confirmation.\nA: We need delivery expedited within 3 weeks due to our turnaround schedule.\nB: If you can finalize the purchase order by this Friday, we can prioritize your batch.", "vocab_notes": ["Lead time [lid taɪm (n.)：交期、從下單到完成交貨的前置時間。\n  例句：Reducing component *lead time* is vital for meeting scheduled turnaround deadlines.", "Turnaround [ˈtɜrnəˌraʊnd (n.)：工廠大修、歲修停爐維護期（化工界核心術語）。\n  例句：All critical sensor replacements must be finished before the planned annual *turnaround*.", "Expedite [ˈɛkspəˌdaɪt (v.)：加速、加快（生產或運送進度）。\n  例句：We are willing to pay an overtime fee to *expedite* the fabrication process."], "vocab_notes_en": ["Lead time: The time between the initiation and completion of a production process.", "Turnaround: Planned periodic shutdown of a processing unit for maintenance.", "Expedite: Make an action or process happen sooner or be accomplished more quickly."], "next_week_tasks": ["💡 課堂角色扮演預告：下週課堂將抽點同學模擬採購主管與供應商，針對『縮短交期 (Lead Time)』進行 1 分鐘談判條件交換演練！"], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U6L4_6.4.1.mp4", "link_text": "觀看 Business Partner 6.4.1 影片 (MP4)"}];

        let speechQueue = [], queueIndex = 0;
        function togglePodcastPlayback() {
            if (!('speechSynthesis' in window)) return;
            const btn = document.getElementById('podcastMainBtn');

            if (isPodcastPlaying) {
                window.speechSynthesis.cancel();
                isPodcastPlaying = false;
                if (btn) btn.innerText = "▶️ 開始雙人對話朗讀";
            } else {
                window.speechSynthesis.cancel();
                speechQueue = [];
                queueIndex = 0;

                const target = (suiteScope === 'all') ? rawDatabase : [filteredPool[currentIndex] || rawDatabase[0]];
                target.forEach(l => {
                    const lines = l.main_content.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                    lines.forEach(line => {
                        if (line.startsWith('A:')) speechQueue.push({ speaker: 'A', text: line.substring(2).trim() });
                        else if (line.startsWith('B:')) speechQueue.push({ speaker: 'B', text: line.substring(2).trim() });
                        else speechQueue.push({ speaker: 'narrator', text: line.replace(/[•-]/g, '').trim() });
                    });
                });

                if (!speechQueue.length) return;
                isPodcastPlaying = true;
                if (btn) btn.innerText = "⏹️ 停止播放";
                playNextInQueue();
            }
        }

        function playNextInQueue() {
            if (!isPodcastPlaying || queueIndex >= speechQueue.length) {
                isPodcastPlaying = false;
                const btn = document.getElementById('podcastMainBtn');
                if (btn) btn.innerText = "▶️ 開始雙人對話朗讀";
                return;
            }

            const item = speechQueue[queueIndex];
            const utter = new SpeechSynthesisUtterance(item.text);
            utter.rate = podcastRate;

            if (item.speaker === 'A') {
                if (speakerAVoice) utter.voice = speakerAVoice;
                utter.pitch = 0.82;
            } else if (item.speaker === 'B') {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.22;
            } else {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.0;
            }

            utter.onend = () => { queueIndex++; setTimeout(playNextInQueue, 160); };
            utter.onerror = () => { isPodcastPlaying = false; };
            window.speechSynthesis.speak(utter);
        }

        function renderMainContent(rawContent) {
            const container = document.getElementById('mainContentContainer');
            container.innerHTML = "";
            if (!rawContent) return;

            const lines = String(rawContent).split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const hasDialogue = lines.some(l => l.startsWith('A:') || l.startsWith('B:'));

            if (hasDialogue) {
                const dialogueBox = document.createElement('div');
                dialogueBox.className = 'dialogue-container';
                lines.forEach(line => {
                    if (line.startsWith('A:')) {
                        dialogueBox.innerHTML += `
                            <div class="chat-bubble-row speaker-a">
                                <div class="speaker-avatar avatar-a">A</div>
                                <div class="chat-bubble-content">${line.substring(2).trim()}</div>
                            </div>`;
                    } else if (line.startsWith('B:')) {
                        dialogueBox.innerHTML += `
                            <div class="chat-bubble-row speaker-b">
                                <div class="speaker-avatar avatar-b">B</div>
                                <div class="chat-bubble-content">${line.substring(2).trim()}</div>
                            </div>`;
                    } else {
                        dialogueBox.innerHTML += `<div style="font-size:14px; font-weight:700; color:#64748b; margin:4px 0;">${line}</div>`;
                    }
                });
                container.appendChild(dialogueBox);
            } else {
                const plain = document.createElement('div');
                plain.style.background = 'var(--sky-bg)';
                plain.style.padding = '14px';
                plain.style.borderRadius = '14px';
                plain.style.whiteSpace = 'pre-line';
                plain.innerText = rawContent;
                container.appendChild(plain);
            }
        }

        function formatVocabItem(rawText) {
            let text = String(rawText);
            text = text.replace(/\[([^\]]+)\]/g, '<span class="ipa-tag">[$1]</span>');
            text = text.replace(/\*([^*]+)\*/g, '<span class="highlight-term">$1</span>');
            return text.replace(/\n/g, '<br>');
        }

        function formatQuestionText(text) {
            let s = String(text);
            s = s.replace(/_{3,}/g, '<span class="blank-line">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
            return s;
        }

        function initWeekOptions() {
            const selector = document.getElementById('weekFilter');
            selector.innerHTML = "";
            const weekMap = {};
            rawDatabase.forEach(item => {
                if (item.week && !weekMap[item.week]) {
                    weekMap[item.week] = item.class_date || "2026";
                }
            });

            Object.keys(weekMap).sort((a, b) => {
                const numA = parseInt(a.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.replace(/\D/g, '')) || 0;
                return numA - numB;
            }).forEach(w => {
                const opt = document.createElement('option');
                opt.value = w;
                opt.innerText = `${w.toUpperCase()} (${weekMap[w]})`;
                selector.appendChild(opt);
            });
        }

            }
        }

        function navigateCard(dir) {
            if (!filteredPool.length) return;
            currentIndex = (currentIndex + dir + filteredPool.length) % filteredPool.length;
            renderCard();
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            document.getElementById('penBtn').classList.toggle('active-pen', isPenMode);
            document.getElementById('cardElement').classList.toggle('canvas-active', isPenMode);
        }

        function clearAllCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function undoLastStroke() { clearAllCanvas(); }

        window.onload = () => {
            initWeekOptions();
            updateTabButtonsUI();
            applyFilters();
        };
    </script>
</body>
</html>
