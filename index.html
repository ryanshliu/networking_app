<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Networking English - AI Learning Suite</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #1e1b4b;
            --text-body: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --amber-bg: #fffbeb; --amber-border: #fef3c7; --amber-text: #b45309;
            --sky-bg: #f0f9ff; --sky-border: #e0f2fe; --sky-text: #0369a1;
            --emerald-bg: #ecfdf5; --emerald-border: #d1fae5; --emerald-text: #047857;
            --violet-bg: #faf5ff; --violet-border: #e9d5ff; --violet-text: #6b21a8;
            --bubble-a-bg: #ffffff; --bubble-a-border: #cbd5e1; --bubble-a-text: #0f172a;
            --bubble-b-bg: #eef2ff; --bubble-b-border: #c7d2fe; --bubble-b-text: #1e1b4b;
            --app-max-width: 460px;
        }
        @media (min-width: 640px) {
            :root { --app-max-width: 680px; }
            body { padding: 24px 20px !important; }
            h1 { font-size: 28px !important; }
            .card { padding: 28px 26px !important; max-height: 72vh !important; border-radius: 28px !important; }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); margin: 0; padding: 16px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }
        .app-layout { width: 100%; max-width: var(--app-max-width); display: flex; flex-direction: column; }
        .header { width: 100%; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 25px; font-weight: 800; color: var(--text-title); margin: 4px 0 2px 0; }
        .author-badge {
            display: inline-block; font-size: 12px; font-weight: 700; color: var(--primary);
            background-color: var(--primary-soft); padding: 3px 12px; border-radius: 12px; margin-bottom: 8px;
        }
        .main-mode-nav { display: flex; gap: 6px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; margin-bottom: 10px; }
        .main-mode-btn {
            flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 800; border: none; border-radius: 12px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .main-mode-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 3px 10px rgba(79, 70, 229, 0.15); }
        .pen-toolbar { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 12px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
        }
        .tool-btn.active-pen { background-color: #ffe4e6; border-color: #e11d48; color: #e11d48; }
        .filters { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        select {
            width: 100%; box-sizing: border-box; padding: 13px 16px; font-size: 16px; font-weight: 700;
            border-radius: 16px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none;
        }
        .tab-group { width: 100%; box-sizing: border-box; display: flex; gap: 8px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 11px 6px; font-size: 15px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
        }
        .tab-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12); }
        .card-container { width: 100%; flex: 1; display: flex; flex-direction: column; position: relative; }
        .card {
            background-color: var(--card-bg); border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        #drawCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100; }
        .card.canvas-active #drawCanvas { pointer-events: auto; touch-action: none; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .counter { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .title { font-size: 21px; font-weight: 800; color: var(--text-title); margin-bottom: 14px; line-height: 1.35; }
        .block-section { margin-bottom: 18px; text-align: left; }
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 12.5px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
        .tag-violet { background-color: var(--violet-bg); color: var(--violet-text); border: 1px solid var(--violet-border); }
        .block-desc { font-size: 15.5px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }
        
        .dialogue-container { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .chat-bubble-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
        .chat-bubble-row.speaker-b { flex-direction: row-reverse; }
        .speaker-avatar {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; color: #ffffff; flex-shrink: 0; margin-top: 4px;
        }
        .speaker-avatar.avatar-a { background: #2563eb; }
        .speaker-avatar.avatar-b { background: #7c3aed; }
        .chat-bubble-content {
            max-width: 82%; padding: 11px 15px; border-radius: 16px; font-size: 15.5px; line-height: 1.5; font-weight: 600;
        }
        .speaker-a .chat-bubble-content { background-color: var(--bubble-a-bg); border: 1.5px solid var(--bubble-a-border); }
        .speaker-b .chat-bubble-content { background-color: var(--bubble-b-bg); border: 1.5px solid var(--bubble-b-border); }
        
        .vocab-ul { margin: 0; padding-left: 20px; font-size: 15px; color: var(--text-body); line-height: 1.7; }
        .vocab-ul li { margin-bottom: 10px; line-height: 1.6; }
        .highlight-term { color: #3730a3 !important; font-weight: 800 !important; }
        .ipa-tag { color: #6d28d9; font-weight: 700; margin: 0 2px; }

        .quiz-card {
            background-color: var(--violet-bg); border: 1.5px solid var(--violet-border);
            border-radius: 18px; padding: 16px; margin-bottom: 12px;
        }
        .quiz-q { font-size: 15.5px; font-weight: 700; color: #4c1d95; line-height: 1.6; margin-bottom: 10px; }
        .blank-line { display: inline-block; min-width: 80px; border-bottom: 2.5px solid #7c3aed; margin: 0 4px; }
        .quiz-toggle-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff; border: none; padding: 7px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer;
        }
        .quiz-ans-wrapper { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d8b4fe; }
        .quiz-ans-box {
            background: #ffffff; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #bbf7d0;
            font-size: 15px; color: #14532d; line-height: 1.65; white-space: pre-line; font-weight: 600;
        }

        .link-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-color); text-align: left; }
        .link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
            padding: 13px 18px; font-size: 15px; color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            text-decoration: none; font-weight: 700; border-radius: 14px;
        }

        /* 8 大模式 UI */
        .suite-scope-nav { display: flex; gap: 6px; background-color: #f1f5f9; padding: 4px; border-radius: 14px; margin-bottom: 10px; }
        .suite-scope-btn {
            flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 800; border: none; border-radius: 10px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .suite-scope-btn.active { background: #ffffff; color: var(--primary); }
        .suite-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .suite-btn {
            background: #ffffff; border: 1.5px solid #cbd5e1; padding: 10px 8px; border-radius: 14px;
            font-size: 13px; font-weight: 800; color: #334155; cursor: pointer; text-align: left;
        }
        .suite-btn.active { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
        .suite-panel { background: #ffffff; border: 1.5px solid var(--border-color); border-radius: 20px; padding: 18px; }

        .podcast-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #ffffff; padding: 20px 16px; border-radius: 20px; text-align: center;
        }
        .podcast-controls {
            display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 12px 0;
            background: rgba(0, 0, 0, 0.25); padding: 14px; border-radius: 16px;
        }
        .control-row { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 13.5px; color: #c7d2fe; }
        .accent-select { background: #ffffff; color: #1e1b4b; font-weight: 800; padding: 6px 10px; border-radius: 10px; border: none; }
        .podcast-play-btn {
            background: #10b981; color: #fff; border: none; padding: 13px 26px; border-radius: 24px;
            font-size: 15.5px; font-weight: 800; cursor: pointer;
        }
        .podcast-play-btn.playing { background: #ef4444 !important; }

        .nav-controls { width: 100%; display: flex; gap: 12px; margin-top: 12px; }
        .nav-btn { flex: 1; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="header">
            <h1>Networking English</h1>
            <div class="author-badge">By Ryan Liu, V1.2</div>
            <div class="main-mode-nav">
                <button class="main-mode-btn active" onclick="switchAppMode('cards', this)">📚 學習卡片</button>
                <button class="main-mode-btn" onclick="switchAppMode('suite', this)">⚡ 8大學習模組</button>
                <button class="main-mode-btn" onclick="switchAppMode('exam', this)">📝 全真模擬考</button>
            </div>
            <div class="pen-toolbar">
                <button id="penBtn" class="tool-btn" onclick="togglePenMode()">🖍️ 細畫筆</button>
                <button class="tool-btn" onclick="undoLastStroke()">↩️ 復原</button>
                <button class="tool-btn" onclick="clearAllCanvas()">🗑️ 全清</button>
            </div>
        </div>

        <!-- 視圖 1: 學習卡片模式 -->
        <div id="viewCards">
            <div class="filters">
                <select id="weekFilter" onchange="applyFilters()"></select>
                <div class="tab-group">
                    <button id="tabSentence" class="tab-btn active" onclick="setTab('sentence', this)">句型 / 文法</button>
                    <button id="tabMedia" class="tab-btn" onclick="setTab('media', this)">影音 / 自習</button>
                </div>
            </div>

            <div class="card-container">
                <div class="card" id="cardElement">
                    <canvas id="drawCanvas"></canvas>
                    <div>
                        <div class="card-header">
                            <div>
                                <span class="badge" id="categoryBadge">分類</span>
                                <span style="font-size: 12.5px; color: #64748b;" id="dateDisplay"></span>
                            </div>
                            <span class="counter" id="counterDisplay">0 / 0</span>
                        </div>
                        <div class="title" id="titleDisplay">標題</div>

                        <div class="block-section" id="takeawaysSection">
                            <div class="tag-title tag-amber">💡 核心重點說明</div>
                            <div class="block-desc" id="takeawaysDisplay"></div>
                        </div>

                        <div class="block-section" id="mainContentSection">
                            <div class="tag-title tag-sky">📖 學習內容與核心對話</div>
                            <div id="mainContentContainer"></div>
                        </div>

                        <div class="block-section" id="quizSection">
                            <div class="tag-title tag-violet">✍️ 實戰練習題</div>
                            <div id="quizContainer"></div>
                        </div>

                        <div class="block-section" id="vocabSection">
                            <div class="tag-title tag-emerald">📝 重點單字與注意事項</div>
                            <ul class="vocab-ul" id="vocabDisplay"></ul>
                        </div>
                    </div>

                    <div class="link-box" id="linkSection">
                        <a class="link-btn" id="linkDisplay" href="#" target="_blank">🔗 開啟延伸閱讀與學習資源</a>
                    </div>
                </div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
                <button class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
            </div>
        </div>

        <!-- 視圖 2: 8 大特訓模組 (已完整修復盲點澄清器) -->
        <div id="viewSuite" style="display: none;">
            <div class="suite-scope-nav">
                <button id="scopeCurrentBtn" class="suite-scope-btn active" onclick="setSuiteScope('current', this)">📌 當前選定週次</button>
                <button id="scopeAllBtn" class="suite-scope-btn" onclick="setSuiteScope('all', this)">🌐 全部課程大整合</button>
            </div>

            <div class="suite-grid">
                <button class="suite-btn active" onclick="loadSuiteTool('guide', this)">📖 速成指南</button>
                <button class="suite-btn" onclick="loadSuiteTool('socratic', this)">🏛️ 蘇格拉底問答</button>
                <button class="suite-btn" onclick="loadSuiteTool('forecaster', this)">🎯 考點預測 Top5</button>
                <button class="suite-btn" onclick="loadSuiteTool('confusion', this)">💡 盲點澄清器</button>
                <button class="suite-btn" onclick="loadSuiteTool('gap', this)">🔍 知識缺口診斷</button>
                <button class="suite-btn" onclick="loadSuiteTool('podcast', this)">🎙️ Audio Podcast</button>
            </div>

            <div class="suite-panel" id="suiteContentPanel"></div>
        </div>

        <!-- 視圖 3: 全真模擬考卷 -->
        <div id="viewExam" style="display: none;">
            <div class="card" style="max-height: 75vh;">
                <h2 style="font-size: 20px; color: #1e1b4b; margin-top:0;">📝 Networking English 全真模擬檢測試卷</h2>
                <div id="examContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const rawDatabase = [{"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "社交問候 (Greetings)", "category_en": "Greetings & Small Talk", "title": "打招呼與近況寒暄 (Greetings & Responses)", "title_en": "Greetings & Daily Catch-ups", "key_takeaways": "1. 熟人與同事間的自然問候：優先使用 Hey there! 或 How’s it going?。\n2. 描述近況平淡無波折時：避免只說 I'm fine，使用 Same old, same old 或 The usual 更在地自然。", "key_takeaways_en": "1. Natural casual greetings: Use Hey there! or How’s it going? among coworkers.\n2. Neutral responses: Instead of just saying I’m fine, use Same old, same old or The usual for natural daily updates.", "main_content": "A: Hey there! How’s it going?\nB: Same old, same old! Pretty much the same.\nA: How are things with you?\nB: Can't complain, things have been pretty uneventful.", "vocab_notes": ["Same old, same old [sem old, sem old (idiom)：老樣子、一切照舊。\n  例句：How’s business these days? — Oh, *same old, same old*. We’re keeping busy.", "Uneventful [ˌʌnɪˈvɛntfəl (adj.)：平靜無事的、沒有重大事故發生的。\n  例句：The overnight plant operation was smooth and completely *uneventful*.", "How have you been? (phrase)：你最近好嗎？（現在完成式，詢問上次見面以來的近況）。\n  例句：It’s great to see you again in Kaohsiung! *How have you been*?", "Can't complain (idiom)：挺好的、沒什麼好挑剔的。\n  例句：How’s the new safety system working out? — *Can't complain*, it’s very reliable.", "Pretty much the same (phrase)：幾乎跟平常一模一樣。\n  例句：How are things in your department? — *Pretty much the same* as last month."], "vocab_notes_en": ["Same old, same old: Common idiom indicating that life or work is going on as usual.\n  Example: How’s business these days? — Oh, *same old, same old*.", "Uneventful [ˌʌnɪˈvɛntfəl: Adjective meaning quiet with no unexpected or disruptive events.\n  Example: The overnight plant operation was completely *uneventful*.", "How have you been?: Present perfect tense used to ask about someone's life since last meeting.\n  Example: Great to see you again! *How have you been*?", "Can't complain: Casual phrase meaning things are going well.\n  Example: How’s the new project? — *Can't complain*, running smoothly.", "Pretty much the same: Standard polite response indicating routine.\n  Example: Things are *pretty much the same* as usual."], "practice_quiz": [{"question": "【填空題】同事問你 How’s work going?，你想回答「老樣子，一切照舊」：\n_________ , _________ ! Pretty much the same.", "question_en": "Fill-in-the-blank: When asked How’s work going?, reply that everything is as usual:\n_________ , _________ ! Pretty much the same.", "answer": "✔ 填空解答：Same old, same old\n👉 整句回答：Same old, same old! Pretty much the same.\n💡 解析：Same old, same old 是最道地的口語說法，用來表達一切如常。", "answer_en": "✔ Answer: Same old, same old\n👉 Full Sentence: Same old, same old! Pretty much the same.\n💡 Explanation: Standard conversational reply indicating routine and normalcy."}], "instant_guide": {"core_concepts": ["1. 破冰開場語意強度階梯（Formal -> Casual）。", "2. 中性回答（Neutral Responses）的語境運用。", "3. 藉由現在完成式 (How have you been?) 延續對話動能。"], "misconceptions": ["誤解 1：以為每次都要回覆 I'm fine, thank you, and you?（過於生硬機械化）。", "誤解 2：以為 Same old 帶有負面抱怨意涵（其實是非常健康的日常中性表達）。"], "exam_questions": ["Q1: 當外國客戶在走廊問你 How are things?，請給出 2 種比 I am fine 更自然的商務中性回覆。", "Q2: 請說明 How do you do? 與 How have you been? 在使用時機與時態上的根本差異。"]}, "socratic_quiz": [{"level": "基礎題 (Level 1)", "prompt": "如果對方問你 How's it going?，你可以回答 I'm fine 嗎？為什麼母語人士很少這樣說？", "feedback": "可以，但在語感上偏向制式教科書用語。母語人士更常使用 Good, how are you?、Can't complain 或 Same old, same old 來建立平易近人的連結。"}], "confusion_fixer": {"analogy": "【生活類比】：問候就像打羽球發球。I'm fine 像是把球直接打在網上停住；而 Same old, how about you? 則是把球順暢地拍回對方場地。", "real_example": "在走廊遇到同事：Hey Ryan, how are things? ➔ Can't complain, just wrapping up the weekly safety audit. How are things on your side?", "common_mistake": "錯誤：How do you do? 用於熟人寒暄（✖ 錯誤，這只用於非常正式的初次見面握手）。"}, "gap_finder": ["⚠️ 潛在缺口 1：忽略了問候時的聲調（語調上揚表達熱情，平調表達平淡）。", "⚠️ 潛在缺口 2：缺少主動拋出第二個問題（Bounce-back question）的習慣。"], "teach_back": {"prompt": "請試著用你自己的話，向剛進公司的外籍同仁解釋什麼時候該用 Same old, same old，以及它的適用場合。", "keywords": ["照舊", "日常", "中性", "平穩", "usual", "routine"]}, "link": "https://www.linkedin.com/pulse/18-ways-say-hello-english-thomas-spengler/", "link_text": "18 Ways to Say Hello in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "道別用語 (Goodbyes)", "category_en": "Goodbyes & Core Grammar", "title": "道別與重要文法規則 (Ways to Say Goodbye & Grammar)", "title_en": "Ways to Say Goodbye & Grammar Rule", "key_takeaways": "Pro Tip 文法核心：Look forward to 中的 to 是介系詞，後面必須接動名詞 (V-ing) 或名詞，絕不可接原形動詞！\n✔ 正確：I look forward to seeing you in Kaohsiung.\n✖ 錯誤：I look forward to see you.", "key_takeaways_en": "Grammar Core: The to in look forward to is a preposition, so it MUST be followed by a gerund (V-ing) or a noun!\n✔ Correct: I look forward to seeing you in Kaohsiung.\n✖ Incorrect: I look forward to see you.", "main_content": "A: I’ve got to get going! I look forward to our next meeting.\nB: Take it easy! Have a good one!\nA: It was a pleasure to see you.\nB: I look forward to seeing you soon in Kaohsiung.", "vocab_notes": ["I've got to [aɪv ɡɑt tu (phr.)：我必須...（口語常縮讀為 I gotta）。\n  例句：*I’ve got to* get going now before the evening traffic starts.", "Have a good one (phr.)：祝你有美好的一天/週末（美式常用祝福）。\n  例句：Thanks for the discussion, Ryan. *Have a good one*!", "Take it easy (idiom)：保重、放輕鬆（非正式道別語）。\n  例句：*Take it easy* this weekend, you’ve been working really hard.", "Look forward to + V-ing [lʊk ˈfɔrwərd tu (phr.)：期待相會（商務書信核心介系詞片語）。\n  例句：I *look forward to collaborating* with your team on the upcoming audit."], "vocab_notes_en": ["I've got to: Equivalent to I have to, often contracted to I gotta in spoken English.\n  Example: *I’ve got to* get going now to catch my train.", "Have a good one: Common American farewell greeting where one stands for day or weekend.\n  Example: *Have a good one*! See you Monday.", "Take it easy: Friendly way to say goodbye and advise someone to rest.\n  Example: *Take it easy* and enjoy your vacation.", "Look forward to + V-ing: Formal phrase used in business correspondence to anticipate future meetings.\n  Example: I *look forward to meeting* with your executive board."], "practice_quiz": [{"question": "【文法填空題】請填入 see 的正確動詞形式：\nI look forward to _________ you at the conference next month.", "question_en": "Grammar Quiz: Fill in the correct form of the verb see:\nI look forward to _________ you at the conference next month.", "answer": "✔ 填空解答：seeing (V-ing)\n👉 整句回答：I look forward to seeing you at the conference next month.\n💡 解析：Look forward to 的 to 是介系詞，後面必須搭配動名詞 V-ing！", "answer_en": "✔ Answer: seeing (V-ing)\n👉 Full Sentence: I look forward to seeing you at the conference next month.\n💡 Explanation: To is a preposition here, requiring a gerund (V-ing)."}], "instant_guide": {"core_concepts": ["1. Look forward to + V-ing 的介系詞本質。", "2. 初次見面（meeting）與再次見面（seeing）的道別動詞區分。", "3. 職場非正式道別（I've got to get going）的得體性。"], "misconceptions": ["誤解 1：看到 to 就直覺接原形動詞（✖ 錯誤：I look forward to hear from you）。", "誤解 2：在非初次見面時說 Nice to meet you（再次見面應為 Good to see you）。"], "exam_questions": ["Q1: 請挑出錯誤並改正：We look forward to discuss the project with your team.", "Q2: 在週五下班前，美籍顧問向你說 Have a good one!，這句話的 one 指的是什麼？"]}, "socratic_quiz": [{"level": "文法陷阱題 (Level 1)", "prompt": "為什麼 I am looking forward to see you 在文法審查中會被判定為嚴重錯誤？", "feedback": "因為此處的 to 不是不定詞符號，而是表示方向與對象的介系詞（Preposition），介系詞後方必須接動名詞 (Gerund) 或名詞。"}], "confusion_fixer": {"analogy": "【生活類比】：to 就像一個收納箱，有些箱子只裝原形動詞（不定詞），有些箱子只裝名詞與動名詞（介系詞）。Look forward to 屬於後者！", "real_example": "信件結尾：I look forward to collaborating with your EHS team in Kaohsiung.", "common_mistake": "錯誤：I look forward to receive your feedback."}, "gap_finder": ["⚠️ 潛在缺口：在書信與口語中混淆 Nice meeting you（初見面結尾）與 Nice seeing you（熟人結尾）。"], "teach_back": {"prompt": "請說明為什麼 Look forward to 後面一定要接 V-ing，並造出一個正確的商務例句。", "keywords": ["介系詞", "動名詞", "V-ing", "preposition", "meeting", "seeing"]}, "link": "https://www.berlitz.com/blog/goodbye-english", "link_text": "81 Ways to Say Goodbye in English"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "商務人脈 (Networking)", "category_en": "Networking Role-Play", "title": "展會破冰與部門職掌交流 (Networking Role-Play 投影片全劇本)", "title_en": "Networking Role-Play Full Script", "key_takeaways": "【課堂即興演練核心 Scenario】\n在 Networking Event 初次見面，互相介紹自身與公司，並在交流中自然帶出工作上遭遇的實際問題（Problem/Need），促成合作與交換名片！\n\n【標準 6 階段流程】\n1. 自我介紹與部門 ➔ 2. 詢問對方部門業務 ➔ 3. 簡述自己部門職掌 ➔ 4. 對方帶出工作痛點 ➔ 5. 主動提供協助 ➔ 6. 交換名片約定後續聯絡。", "key_takeaways_en": "Scenario: Meet someone for the first time at a networking event, introduce company roles, identify an operational problem, offer help, and exchange cards.\n\n6-Step Flow: Introduction ➔ Inquire role ➔ Explain dept capabilities ➔ Identify client pain point ➔ Offer assistance ➔ Exchange business cards.", "main_content": "A: Hello, I’m Ryan. I work as a Senior EHS Specialist in Process Safety.\nB: Hi, I’m Alex. It’s a pleasure to meet you.\nA: Can you tell me about your department?\nB: Sure! I work in Operations. We manage plant production lines.\nA: Can I briefly tell you about what our department does?\nB: Of course! I’m all ears. Fire away!\nA: We conduct safety risk assessments and incident prevention audits.\nB: You just remind me that we may need your help in identifying chemical vapor leakage risks.\nA: Yeah, I think we might be able to help you.\nB: That would be great! It’s so nice of you to offer help.\nA: Here's my business card should you want to call.\nB: Absolutely. I’ll be in touch soon.", "vocab_notes": ["I'm all ears [aɪm ɔl ɪrz (idiom)：我洗耳恭聽、全神貫注在聽。\n  例句：Tell me about your plant expansion plan; *I’m all ears*.", "Fire away! [ˈfaɪər əˈwe (idiom)：請說吧！開始問吧！\n  例句：Do you have questions regarding the safety protocol? *Fire away*!", "You just remind me that... (phr.)：你正好提醒了我...（切入痛點的關鍵句）。\n  例句：*You just remind me that* we need an external review for our relief valve sizing.", "Should you want to call (phr.)：若您想致電的話（If you should want to call 之倒裝高階句法）。\n  例句：Here is my contact info *should you want to call* regarding process safety."], "vocab_notes_en": ["I'm all ears: Idiom meaning listening with full attention.\n  Example: *I’m all ears*; let's hear your proposal.", "Fire away!: Colloquial phrase giving permission to start speaking/asking questions.\n  Example: Ready for questions? *Fire away*!", "You just remind me that...: Natural conversational bridge to introduce a relevant work problem.\n  Example: *You just remind me that* we need safety consulting.", "Should you want to call: Inverted formal conditional meaning 'If you should want to call'."], "practice_quiz": [{"question": "【填空題】對方想向你簡報業務，你想熱情表示「請儘管說吧！/ 我洗耳恭聽」：\nOf course! I’m all _________ . / _________ away!", "question_en": "Fill-in-the-blank: Politely tell the other person you are listening and to go ahead:\nOf course! I’m all _________ . / _________ away!", "answer": "✔ 填空解答：ears, Fire\n👉 整句回答：Of course! I’m all ears. / Fire away!\n💡 解析：I'm all ears 與 Fire away! 都是表達樂意聆聽的商務社交用語。", "answer_en": "✔ Answer: ears, Fire\n👉 Full Sentence: Of course! I’m all ears. / Fire away!\n💡 Explanation: Standard polite idiom in networking."}], "instant_guide": {"core_concepts": ["1. Networking 的核心是解決對方問題（Value Creation）而非硬性推銷。", "2. 關鍵樞紐轉折句：You just remind me that we may need your help in...", "3. 名片遞交的高階假設句法：Here's my card should you want to call."], "misconceptions": ["誤解 1：以為 Networking 只是單向自我介紹（必須雙向詢問並挖掘痛點）。", "誤解 2：以為遞名片只能說 This is my card（使用 should you want to... 更展現專業與謙遜）。"], "exam_questions": ["Q1: 請默寫出從『聽取對方部門職掌』銜接到『帶出自身部門需求』的關鍵英文句子。", "Q2: 請說明倒裝假設句 should you want to call 的文法由來（If you should want to call）。"]}, "socratic_quiz": [{"level": "策略提問 (Level 1)", "prompt": "在 Networking 場合中，為什麼 A 要先詢問 B 的部門，而不是一開始就推銷自己的業務？", "feedback": "這展現了專業社交禮貌與聆聽者的素養（Active Listening），先理解對方的業務範疇，後續才能精準將自身能力包裝成對方的解決方案（Solution）。"}], "confusion_fixer": {"analogy": "【生活類比】：Networking 不像發傳單，而是像醫生問診：先聽對方的症狀（業務痛點），再開出你的專業處方（提供協助）。", "real_example": "A: We specialize in process hazard analysis. ➔ B: You just remind me that we need an independent review for our upcoming expansion project.", "common_mistake": "錯誤：直接塞名片說 Call me for business!（過於具侵略性且缺乏專業度）。"}, "gap_finder": ["⚠️ 潛在缺口 1：忘記在交換名片後 24-48 小時內寄送 Follow-up Email 鞏固人脈。", "⚠️ 潛在缺口 2：在吵雜展會環境下，尚未準備好 10 秒精準自我介紹 (Elevator Pitch)。"], "teach_back": {"prompt": "請用英文扮演角色 A，向一位新認識的工廠營運主管進行 30 秒自我介紹，並提出能夠協助改善製程安全的提議。", "keywords": ["process safety", "risk assessment", "help", "business card", "in touch"]}, "link": "", "link_text": ""}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "展會深度洽談 (Trade Fair In-depth)", "category_en": "Trade Fair In-depth Discussion", "title": "規格需求詢問與價值主張 (Exploring Client Needs & Value Pitch)", "title_en": "Exploring Client Needs & Value Proposition", "key_takeaways": "【課堂情境與學習重點】\n1. 展會進階技巧：從表面的寒暄，自然推進到詢問對方的實際工程規格與技術痛點。\n2. 價值主張 (Value Proposition)：避免空洞吹噓，使用精準動詞（streamline, optimize, comply with）陳述能為對方帶來的實質效益。", "key_takeaways_en": "1. Advanced Networking: Move from polite small talk to uncovering technical specs and client pain points.\n2. Value Proposition: Use strong business verbs (streamline, optimize, comply with) to articulate concrete operational benefits.", "main_content": "A: What specific challenges are you currently facing with your chemical distribution lines?\nB: We are struggling with vapor emissions during high-temperature transfers.\nA: That’s a critical safety issue. Our team has developed an automated vapor recovery system that complies with the latest environmental regulations.\nB: Really? Does it integrate seamlessly with existing PLC architectures?\nA: Absolutely. In fact, it typically reduces VOC emissions by over 95% without disrupting daily throughput.", "vocab_notes": ["Vapor emission [ˈvepɚ ɪˈmɪʃən (n.)：蒸氣排放、氣體揮發逸散。\n  例句：Strict environmental audits require minimizing all chemical *vapor emissions* across the plant.", "Comply with [kəmˈplaɪ wɪð (v. phr.)：遵守、符合（法規或安全規範）。\n  例句：Our storage tanks fully *comply with* international OSHA and CCPS standards.", "Seamlessly [ˈsimləsli (adv.)：無縫地、完美銜接順暢地。\n  例句：The updated monitoring software integrates *seamlessly* with our existing DCS control loop.", "Throughput [ˈθruˌpʊt (n.)：生產吞吐量、單位時間產出率。\n  例句：Upgrading safety valves must not compromise total daily production *throughput*.", "Volatile Organic Compounds (VOCs) [ˈvɑlətəl ɔrˈɡænɪk (n.)：揮發性有機化合物。\n  例句：Continuous monitoring devices track *VOC* levels around processing units."], "vocab_notes_en": ["Vapor emission: Gas or vapor released into the air during industrial chemical operations.\n  Example: We installed scrubbers to curb *vapor emissions*.", "Comply with: Act in accordance with rules, safety regulations, or standards.\n  Example: All manufacturing units must *comply with* stringent environmental laws.", "Seamlessly: Smoothly and continuously, without noticeable transitions or interruptions.\n  Example: The emergency shutdown system operates *seamlessly*.", "Throughput: The amount of material or work processed through a system in a given period.\n  Example: The optimization project enhanced plant *throughput* by 15%."], "practice_quiz": [{"question": "【填空題】你想說明新安全模組「完全符合法規規範」，請填入動詞片語 comply ___：\nAll our safety valves strictly _________ _________ the latest ISO standards.", "question_en": "Fill-in-the-blank: State that equipment conforms to official regulations:\nAll our safety valves strictly _________ _________ the latest ISO standards.", "answer": "✔ 填空解答：comply with\n👉 整句回答：All our safety valves strictly comply with the latest ISO standards.\n💡 解析：comply with 是法規與安全合規最標準的高頻商務片語。"}], "instant_guide": {"core_concepts": ["1. 挖掘痛點提問法：'What specific challenges are you facing with...?'", "2. 效益量化呈現：'It reduces VOC emissions by over 95% without disrupting throughput.'", "3. 相容性確認：'Does it integrate seamlessly with...?'"], "misconceptions": ["誤解 1：急於推銷產品硬體，忽略詢問客戶既有系統的相容性 (Compatibility)。", "誤解 2：使用 vague claims（如 very good），應改用具體數字（reduces by 95%）。"], "exam_questions": ["Q1: 請用英文向客戶說明你的製程改善方案能『無縫整合至現有產線』。", "Q2: 請指出 comply 接續的介系詞是什 sible to push our meeting back to Thursday morning?\nB: Thursday morning works perfectly for me. Shall we say 10:30 AM?\nA: That suits me well. I’ll send out an updated calendar invite shortly. Thank you for your flexibility!\nB: You’re welcome. Good luck with the audit!", "vocab_notes": ["Push back [pʊʃ bæk (v. phr.)：推遲、延後（會議或專案時程）。\n  例句：Can we *push back* the kick-off meeting by an hour to allow the audit team to join?", "Something urgent has come up (phr.)：臨時有緊急要事發生（改期最常見且正當的理由）。\n  例句：I apologize for the short notice, but *something urgent has come up* at the terminal.", "Updated calendar invite (n. phr.)：更新後的行事曆會議邀請。\n  例句：I will send an *updated calendar invite* with the new Teams link right away.", "Thank you for your flexibility (phr.)：感謝您的彈性配合（商務改期信結尾高分禮貌句）。\n  例句：I truly appreciate your understanding and *thank you for your flexibility*.", "Suit [sut (v.)：適合、方便（等同於 work for）。\n  例句：Does 2:30 PM *suit* your schedule, or would Friday be better?"], "vocab_notes_en": ["Push back: Postpone or reschedule an event to a later date or time.\n  Example: Let’s *push back* the project review until test results arrive.", "Something urgent has come up: Professional explanation indicating an unanticipated critical task.\n  Example: *Something urgent has come up*, requiring my physical presence on-site.", "Flexibility: Willingness to change or compromise schedules smoothly.\n  Example: Thank you for your *flexibility* on such short notice."], "practice_quiz": [{"question": "【填空題】因為廠區突發狀況，你想提議「把會議延後到週四」，請填入片語 push ___：\nWould it be possible to _________ the safety meeting _________ to Thursday?", "question_en": "Fill-in-the-blank: Politely propose postponing a meeting:\nWould it be possible to _________ the safety meeting _________ to Thursday?", "answer": "✔ 填空解答：push, back\n👉 整句回答：Would it be possible to push the safety meeting back to Thursday?\n💡 解析：push back 是商務上最常使用的推遲、改期動詞片語。"}], "instant_guide": {"core_concepts": ["1. 改期的黃金三步驟：致歉說明事由 (Something has come up) ➔ 提議明確                             <button class="quiz-toggle-btn" style="padding:4px 10px; font-size:12px;" onclick="this.nextElementSibling.style.display='block'">💡 查看蘇格拉底啟發引導</button>
                            <div style="display:none; margin-top:8px; font-size:14px; color:#15803d; line-height:1.5; font-weight:600;">${q.feedback}</div>
                        </div>
                    `).join('')}
                `;
            } else if (toolName === 'gap') {
                let gapList = [];
                targetLessons.forEach(l => {
                    if (l.gap_finder) gapList = gapList.concat(l.gap_finder);
                });
                panel.innerHTML = `
                    <h3>🔍 Gap Finder (${suiteScope === 'all' ? '全部課程弱點診斷' : '單週弱點診斷'})</h3>
                    <div style="font-size:14.5px; color:#475569; line-height:1.6; font-weight:600;">系統分析後發現以下知識缺口：</div>
                    <ul class="vocab-ul" style="margin-top:8px;">${gapList.map(g => `<li>${g}</li>`).join('')}</ul>
                `;
            } else if (toolName === 'forecaster') {
                panel.innerHTML = `
                    <h3>🎯 Exam Forecaster (高頻考點 Top 5 預測)</h3>
                    ${top5Data.map(t => `
                        <div style="background:#f8fafc; border:1.5px solid #e2e8f0; border-radius:14px; padding:12px; margin-bottom:10px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="font-weight:800; color:#4f46e5; font-size:14px;">${t.rank}</span>
                                <span style="background:#dcfce7; color:#166534; font-size:12px; font-weight:700; padding:2px 8px; border-radius:10px;">${t.prob}</span>
                            </div>
                            <div style="font-size:15px; font-weight:700; margin:6px 0;">${t.topic}</div>
                            <div style="font-size:14px; color:#475569;">${t.challenge_q}</div>
                            <button class="quiz-toggle-btn" style="padding:4px 10px; font-size:12px; margin-top:6px;" onclick="this.nextElementSibling.style.display='block'">查看高難度解答</button>
                            <div style="display:none; margin-top:6px; font-size:14px; color:#166534; font-weight:600;">${t.challenge_ans}</div>
                        </div>
                    `).join('')}
                `;
            } else if (toolName === 'podcast') {
                panel.innerHTML = `
                    <div class="podcast-box">
                        <h3 style="color:#fff; margin:0 0 6px 0;">🎙️ Audio Study Partner (自然雙人聲 Podcast)</h3>
                        <div style="font-size:13px; color:#c7d2fe; margin-bottom:10px;">👨 Speaker A (男聲) • 👩 Speaker B (女聲)</div>
                        <div class="podcast-controls">
                            <div class="control-row" style="margin-bottom:8px;">
                                <span>🗣️ 示範腔調:</span>
                                <select class="accent-select" onchange="selectedAccent=this.value; initVoicesByAccent(this.value);">
                                    <option value="en-US">🇺🇸 美式英語 (US)</option>
                                    <option value="en-GB">🇬🇧 英式英語 (UK)</option>
                                    <option value="en-AU">🇦🇺 澳式英語 (AU)</option>
                                    <option value="en-IN">🇮🇳 印度英語 (IN)</option>
                                </select>
                            </div>
                            <div class="control-row">
                                <span>⚡ 語速調節 Speed:</span>
                                <input type="range" min="0.5" max="2.0" step="0.1" value="${podcastRate}" class="speed-slider" oninput="podcastRate=parseFloat(this.value); document.getElementById('spVal').innerText=this.value+'x';">
                                <span id="spVal" style="color:#86efac; min-width:40px;">${podcastRate}x</span>
                            </div>
                        </div>
                        <button id="podcastMainBtn" class="podcast-play-btn" onclick="togglePodcastPlayback()">
                            ${isPodcastPlaying ? '⏹️ 停止播放' : '▶️ 開始雙人對話朗讀'}
                        </button>
                    </div>
                `;
            }
        }

        let speechQueue = [], queueIndex = 0;
        function togglePodcastPlayback() {
            if (!('speechSynthesis' in window)) return;
            const btn = document.getElementById('podcastMainBtn');

            if (isPodcastPlaying) {
                window.speechSynthesis.cancel();
                isPodcastPlaying = false;
                if (btn) btn.innerText = "▶️ 開始雙人對話朗讀";
            } else {
                window.speechSynthesis.cancel();
                speechQueue = [];
                queueIndex = 0;

                const target = (suiteScope === 'all') ? rawDatabase : [filteredPool[currentIndex] || rawDatabase[0]];
                target.forEach(l => {
                    const lines = l.main_content.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                    lines.forEach(line => {
                        if (line.startsWith('A:')) speechQueue.push({ speaker: 'A', text: line.substring(2).trim() });
                        else if (line.startsWith('B:')) speechQueue.push({ speaker: 'B', text: line.substring(2).trim() });
                        else speechQueue.push({ speaker: 'narrator', text: line.replace(/[•-]/g, '').trim() });
                    });
                });

                if (!speechQueue.length) return;
                isPodcastPlaying = true;
                if (btn) btn.innerText = "⏹️ 停止播放";
                playNextInQueue();
            }
        }

        function playNextInQueue() {
            if (!isPodcastPlaying || queueIndex >= speechQueue.length) {
                isPodcastPlaying = false;
                const btn = document.getElementById('podcastMainBtn');
                if (btn) btn.innerText = "▶️ 開始雙人對話朗讀";
                return;
            }

            const item = speechQueue[queueIndex];
            const utter = new SpeechSynthesisUtterance(item.text);
            utter.rate = podcastRate;

            if (item.speaker === 'A') {
                if (speakerAVoice) utter.voice = speakerAVoice;
                utter.pitch = 0.82;
            } else if (item.speaker === 'B') {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.22;
            } else {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.0;
            }

            utter.onend = () => { queueIndex++; setTimeout(playNextInQueue, 160); };
            utter.onerror = () => { isPodcastPlaying = false; };
            window.speechSynthesis.speak(utter);
        }

        function renderExam() {
            const container = document.getElementById('examContainer');
            container.innerHTML = "";
            examData.sections.forEach(sec => {
                const secDiv = document.createElement('div');
                secDiv.innerHTML = `<h4 style="color:#4f46e5; margin:14px 0 8px 0;">${sec.type}</h4>`;
                sec.questions.forEach(q => {
                    let optionsHtml = '';
                    if (q.options) {
                        optionsHtml = `<div style="margin:8px 0;">${q.options.map(o => `<div style="font-size:14.5px; margin:4px 0; color:#334155;">${o}</div>`).join('')}</div>`;
                    }
                    secDiv.innerHTML += `
                        <div class="exam-q-card" style="background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:12px; margin-bottom:10px;">
                            <div style="font-weight:700; color:#1e1b4b;">${q.q}</div>
                            ${optionsHtml}
                            <button class="quiz-toggle-btn" style="padding:6px 12px; font-size:12.5px; margin-top:8px;" onclick="this.nextElementSibling.style.display = (this.nextElementSibling.style.display==='block'?'none':'block')">
                                👁️ 顯示解答與詳解
                            </button>
                            <div style="display:none; margin-top:8px; padding:10px; background:#f0fdf4; border-radius:10px; color:#166534; font-weight:600;">
                                答案：${q.ans}<br>解析：${q.explanation}
                            </div>
                        </div>
                    `;
                });
                container.appendChild(secDiv);
            });
        }

        function renderMainContent(rawContent) {
            const container = document.getElementById('mainContentContainer');
            container.innerHTML = "";
            if (!rawContent) return;

            const lines = String(rawContent).split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const hasDialogue = lines.some(l => l.startsWith('A:') || l.startsWith('B:'));

            if (hasDialogue) {
                const dialogueBox = document.createElement('div');
                dialogueBox.className = 'dialogue-container';
                lines.forEach(line => {
                    if (line.startsWith('A:')) {
                        dialogueBox.innerHTML += `
                            <div class="chat-bubble-row speaker-a">
                                <div class="speaker-avatar avatar-a">A</div>
                                <div class="chat-bubble-content">${line.substring(2).trim()}</div>
                            </div>`;
                    } else if (line.startsWith('B:')) {
                        dialogueBox.innerHTML += `
                            <div class="chat-bubble-row speaker-b">
                                <div class="speaker-avatar avatar-b">B</div>
                                <div class="chat-bubble-content">${line.substring(2).trim()}</div>
                            </div>`;
                    } else {
                        dialogueBox.innerHTML += `<div style="font-size:14px; font-weight:700; color:#64748b; margin:4px 0;">${line}</div>`;
                    }
                });
                container.appendChild(dialogueBox);
            } else {
                const plain = document.createElement('div');
                plain.style.background = 'var(--sky-bg)';
                plain.style.padding = '14px';
                plain.style.borderRadius = '14px';
                plain.style.whiteSpace = 'pre-line';
                plain.innerText = rawContent;
                container.appendChild(plain);
            }
        }

        function formatVocabItem(rawText) {
            let text = String(rawText);
            text = text.replace(/\[([^\]]+)\]/g, '<span class="ipa-tag">[$1]</span>');
            text = text.replace(/\*([^*]+)\*/g, '<span class="highlight-term">$1</span>');
            return text.replace(/\n/g, '<br>');
        }

        function formatQuestionText(text) {
            let s = String(text);
            s = s.replace(/_{3,}/g, '<span class="blank-line">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
            return s;
        }

        function toggleAnswer(btn) {
            const wrapper = btn.nextElementSibling;
            if (wrapper.style.display === 'block') {
                wrapper.style.display = 'none';
                btn.innerText = '👁️ 顯示參考答案與示範';
            } else {
                wrapper.style.display = 'block';
                btn.innerText = '🙈 隱藏解答';
            }
        }

        function initWeekOptions() {
            const selector = document.getElementById('weekFilter');
            selector.innerHTML = "";
            const weekMap = {};
            rawDatabase.forEach(item => {
                if (item.week && !weekMap[item.week]) {
                    weekMap[item.week] = item.class_date || "2026";
                }
            });

            Object.keys(weekMap).sort((a, b) => {
                const numA = parseInt(a.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.replace(/\D/g, '')) || 0;
                return numA - numB;
            }).forEach(w => {
                const opt = document.createElement('option');
                opt.value = w;
                opt.innerText = `${w.toUpperCase()} (${weekMap[w]})`;
                selector.appendChild(opt);
            });
        }

        function setTab(tabName, element) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const selectedWeek = document.getElementById('weekFilter').value;
            filteredPool = rawDatabase.filter(item => (item.week === selectedWeek) && (item.type === currentTab));
            if (!filteredPool.length) {
                currentTab = (currentTab === 'sentence') ? 'media' : 'sentence';
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                if (currentTab === 'sentence') document.getElementById('tabSentence').classList.add('active');
                else document.getElementById('tabMedia').classList.add('active');
                filteredPool = rawDatabase.filter(item => (item.week === selectedWeek) && (item.type === currentTab));
            }
            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            if (!filteredPool.length) {
                document.getElementById('titleDisplay').innerText = "本分類尚無資料";
                document.getElementById('takeawaysSection').style.display = "none";
                document.getElementById('mainContentSection').style.display = "none";
                document.getElementById('quizSection').style.display = "none";
                document.getElementById('vocabSection').style.display = "none";
                document.getElementById('linkSection').style.display = "none";
                document.getElementById('counterDisplay').innerText = "0 / 0";
                return;
            }

            const item = filteredPool[currentIndex];
            document.getElementById('categoryBadge').innerText = item.category || "教材";
            document.getElementById('dateDisplay').innerText = item.class_date ? ` • ${item.class_date}` : '';
            document.getElementById('counterDisplay').innerText = `${currentIndex + 1} / ${filteredPool.length}`;
            document.getElementById('titleDisplay').innerText = item.title || "";

            const tkSection = document.getElementById('takeawaysSection');
            if (item.key_takeaways) {
                tkSection.style.display = "block";
                document.getElementById('takeawaysDisplay').innerText = item.key_takeaways;
            } else {
                tkSection.style.display = "none";
            }

            document.getElementById('mainContentSection').style.display = "block";
            renderMainContent(item.main_content);

            const quizSection = document.getElementById('quizSection');
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.innerHTML = "";
            if (item.practice_quiz && item.practice_quiz.length > 0) {
                quizSection.style.display = "block";
                item.practice_quiz.forEach(q => {
                    const qCard = document.createElement('div');
                    qCard.className = 'quiz-card';
                    qCard.innerHTML = `
                        <div class="quiz-q">${formatQuestionText(q.question)}</div>
                        <button class="quiz-toggle-btn" onclick="toggleAnswer(this)">👁️ 顯示參考答案與示範</button>
                        <div class="quiz-ans-wrapper">
                            <div class="quiz-ans-box">${q.answer}</div>
                        </div>
                    `;
                    quizContainer.appendChild(qCard);
                });
            } else {
                quizSection.style.display = "none";
            }

            const vbSection = document.getElementById('vocabSection');
            const vocabUl = document.getElementById('vocabDisplay');
            vocabUl.innerHTML = "";
            if (item.vocab_notes && item.vocab_notes.length > 0) {
                vbSection.style.display = "block";
                item.vocab_notes.forEach(note => {
                    const li = document.createElement('li');
                    li.innerHTML = formatVocabItem(note);
                    vocabUl.appendChild(li);
                });
            } else {
                vbSection.style.display = "none";
            }

            const linkSection = document.getElementById('linkSection');
            const linkTag = document.getElementById('linkDisplay');
            if (item.link) {
                linkSection.style.display = "block";
                linkTag.href = item.link;
                linkTag.innerText = "🔗 " + (item.link_text || "開啟延伸資源");
            } else {
                linkSection.style.display = "none";
            }
        }

        function navigateCard(dir) {
            if (!filteredPool.length) return;
            currentIndex = (currentIndex + dir + filteredPool.length) % filteredPool.length;
            renderCard();
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            document.getElementById('penBtn').classList.toggle('active-pen', isPenMode);
            document.getElementById('cardElement').classList.toggle('canvas-active', isPenMode);
        }

        function clearAllCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function undoLastStroke() { clearAllCanvas(); }

        window.onload = () => {
            initWeekOptions();
            applyFilters();
        };
    </script>
</body>
</html>
