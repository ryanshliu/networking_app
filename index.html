<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Networking English - AI Learning Suite</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #1e1b4b;
            --text-body: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            
            --amber-bg: #fffbeb;
            --amber-border: #fef3c7;
            --amber-text: #b45309;
            
            --sky-bg: #f0f9ff;
            --sky-border: #e0f2fe;
            --sky-text: #0369a1;

            --emerald-bg: #ecfdf5;
            --emerald-border: #d1fae5;
            --emerald-text: #047857;

            --violet-bg: #faf5ff;
            --violet-border: #e9d5ff;
            --violet-text: #6b21a8;

            --bubble-a-bg: #ffffff;
            --bubble-a-border: #cbd5e1;
            --bubble-a-text: #0f172a;

            --bubble-b-bg: #eef2ff;
            --bubble-b-border: #c7d2fe;
            --bubble-b-text: #1e1b4b;

            --app-max-width: 460px;
        }

        @media (min-width: 640px) {
            :root {
                --app-max-width: 680px;
            }
            body {
                padding: 24px 20px !important;
            }
            h1 {
                font-size: 28px !important;
            }
            .card {
                padding: 28px 26px !important;
                max-height: 72vh !important;
                border-radius: 28px !important;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg);
            margin: 0; padding: 16px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }

        .app-layout {
            width: 100%;
            max-width: var(--app-max-width);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin: 0 auto;
        }

        #updateNotice {
            display: none; width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff; padding: 10px 16px; border-radius: 14px;
            margin-bottom: 10px; box-sizing: border-box; font-size: 14px; font-weight: 700;
            text-align: center; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            cursor: pointer;
        }
        
        .header { width: 100%; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 25px; font-weight: 800; color: var(--text-title); margin: 4px 0 2px 0; letter-spacing: -0.5px; }
        
        .author-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            background-color: var(--primary-soft);
            padding: 3px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        /* 頂部主模式切換列 (學習卡片 / 8大學習模組 / 全真模擬考) */
        .main-mode-nav {
            display: flex; gap: 6px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; margin-bottom: 10px;
        }
        .main-mode-btn {
            flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 800; border: none; border-radius: 12px;
            background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.2s ease;
        }
        .main-mode-btn.active {
            background: #ffffff; color: var(--primary); box-shadow: 0 3px 10px rgba(79, 70, 229, 0.15);
        }

        .pen-toolbar {
            display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
        }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 12px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted);
            display: flex; align-items: center; gap: 4px; cursor: pointer; transition: all 0.2s ease;
        }
        .tool-btn.active-pen {
            background-color: #ffe4e6; border-color: #e11d48; color: #e11d48;
            box-shadow: 0 2px 8px rgba(225, 29, 72, 0.25);
        }
        .tool-btn.lang-btn {
            background-color: #f0fdf4; border-color: #86efac; color: #166534;
        }
        .tool-btn:active { transform: scale(0.96); }

        .filters { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        select {
            width: 100%; box-sizing: border-box; padding: 13px 16px; font-size: 16px; font-weight: 700;
            border-radius: 16px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none; box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        
        .tab-group { width: 100%; box-sizing: border-box; display: flex; gap: 8px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 11px 6px; font-size: 15px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-btn.active {
            background: #ffffff; color: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
        }

        .card-container {
            width: 100%; flex: 1; display: flex; flex-direction: column; position: relative;
        }
        .card {
            background-color: var(--card-bg); border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
            position: relative;
        }

        #drawCanvas {
            position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100;
        }
        .card.canvas-active #drawCanvas {
            pointer-events: auto; touch-action: none;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .date-badge { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
        .counter { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        
        .title { font-size: 21px; font-weight: 800; color: var(--text-title); margin-bottom: 14px; line-height: 1.35; }
        .block-section { margin-bottom: 18px; text-align: left; }
        
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 12.5px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
        .tag-violet { background-color: var(--violet-bg); color: var(--violet-text); border: 1px solid var(--violet-border); }

        .block-desc { font-size: 15.5px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }

        /* A/B 對話氣泡排版 */
        .dialogue-container { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .chat-bubble-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
        .chat-bubble-row.speaker-b { flex-direction: row-reverse; }
        .speaker-avatar {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; color: #ffffff; flex-shrink: 0;
            margin-top: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .speaker-avatar.avatar-a { background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%); }
        .speaker-avatar.avatar-b { background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%); }

        .chat-bubble-content {
            max-width: 82%; padding: 11px 15px; border-radius: 16px;
            font-size: 15.5px; line-height: 1.5; font-weight: 600;
        }
        .speaker-a .chat-bubble-content {
            background-color: var(--bubble-a-bg); color: var(--bubble-a-text);
            border: 1.5px solid var(--bubble-a-border); border-top-left-radius: 4px;
        }
        .speaker-b .chat-bubble-content {
            background-color: var(--bubble-b-bg); color: var(--bubble-b-text);
            border: 1.5px solid var(--bubble-b-border); border-top-right-radius: 4px;
        }

        .vocab-ul { margin: 0; padding-left: 20px; font-size: 15px; color: var(--text-body); line-height: 1.7; }
        .vocab-ul li { margin-bottom: 7px; }

        .quiz-card {
            background-color: var(--violet-bg); border: 1.5px solid var(--violet-border);
            border-radius: 18px; padding: 16px; margin-bottom: 12px;
        }
        .quiz-q { font-size: 15.5px; font-weight: 700; color: #4c1d95; line-height: 1.6; margin-bottom: 10px; }
        .blank-line { display: inline-block; min-width: 80px; border-bottom: 2.5px solid #7c3aed; margin: 0 4px; }

        .quiz-toggle-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff; border: none; padding: 7px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer;
        }
        .quiz-ans-wrapper { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d8b4fe; }
        .quiz-ans-box {
            background: #ffffff; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #bbf7d0;
            font-size: 15px; color: #14532d; line-height: 1.65; white-space: pre-line; font-weight: 600;
        }

        /* 8 大模式專屬 UI 樣式 */
        .suite-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;
        }
        .suite-btn {
            background: #ffffff; border: 1.5px solid #cbd5e1; padding: 10px 8px; border-radius: 14px;
            font-size: 13px; font-weight: 800; color: #334155; cursor: pointer; text-align: left;
            display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;
        }
        .suite-btn.active {
            background: #eef2ff; border-color: #6366f1; color: #4338ca;
        }

        .suite-panel {
            background: #ffffff; border: 1.5px solid var(--border-color); border-radius: 20px;
            padding: 18px; margin-top: 8px;
        }
        .suite-panel h3 { margin: 0 0 10px 0; font-size: 17px; color: #1e1b4b; }

        /* Podcast 語音按鈕 */
        .podcast-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #ffffff; padding: 18px; border-radius: 20px; text-align: center;
        }
        .podcast-play-btn {
            background: #10b981; color: #fff; border: none; padding: 12px 24px; border-radius: 24px;
            font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }

        /* 費曼教學輸入框 */
        .teach-input {
            width: 100%; box-sizing: border-box; min-height: 90px; padding: 12px; font-size: 15px;
            border-radius: 12px; border: 1.5px solid #cbd5e1; margin-top: 8px; font-family: inherit;
        }

        .nav-controls { width: 100%; display: flex; gap: 12px; margin-top: 12px; margin-bottom: 10px; }
        .nav-btn {
            flex: 1; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer;
        }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; }
    </style>
</head>
<body>

    <div class="app-layout">
        <div id="updateNotice" onclick="forceReloadApp()">
            ✨ 發現最新教材版本，點此立即更新！
        </div>

        <div class="header">
            <h1>Networking English</h1>
            <!-- 正式定版 V1.0 -->
            <div class="author-badge">By Ryan Liu, V1.0</div>
            
            <!-- 頂部主模式切換 -->
            <div class="main-mode-nav">
                <button class="main-mode-btn active" onclick="switchAppMode('cards', this)">📚 學習卡片</button>
                <button class="main-mode-btn" onclick="switchAppMode('suite', this)">⚡ 8大學習模組</button>
                <button class="main-mode-btn" onclick="switchAppMode('exam', this)">📝 全真模擬考</button>
            </div>

            <!-- 工具列 -->
            <div class="pen-toolbar">
                <button id="langToggleBtn" class="tool-btn lang-btn" onclick="toggleLanguage()">
                    <span id="langBtnText">🌐 English</span>
                </button>
                <button id="penBtn" class="tool-btn" onclick="togglePenMode()">
                    <span id="penBtnText">🖍️ 細畫筆</span>
                </button>
                <button class="tool-btn" onclick="undoLastStroke()">
                    <span id="undoBtnText">↩️ 復原</span>
                </button>
                <button class="tool-btn" onclick="clearAllCanvas()">
                    <span id="clearBtnText">🗑️ 全清</span>
                </button>
            </div>
        </div>

        <!-- 視圖 1: 學習卡片模式 (預設) -->
        <div id="viewCards">
            <div class="filters">
                <select id="weekFilter" onchange="applyFilters()"></select>
                <div class="tab-group">
                    <button id="tabSentence" class="tab-btn active" onclick="setTab('sentence', this)">句型 / 文法</button>
                    <button id="tabMedia" class="tab-btn" onclick="setTab('media', this)">影音 / 自學</button>
                </div>
            </div>

            <div class="card-container">
                <div class="card" id="cardElement">
                    <canvas id="drawCanvas"></canvas>

                    <div>
                        <div class="card-header">
                            <div>
                                <span class="badge" id="categoryBadge">分類</span>
                                <span class="date-badge" id="dateDisplay"></span>
                            </div>
                            <span class="counter" id="counterDisplay">0 / 0</span>
                        </div>
                        <div class="title" id="titleDisplay">標題</div>

                        <div class="block-section" id="takeawaysSection">
                            <div class="tag-title tag-amber" id="tagTakeaways">💡 核心重點說明</div>
                            <div class="block-desc" id="takeawaysDisplay"></div>
                        </div>

                        <div class="block-section" id="mainContentSection">
                            <div class="tag-title tag-sky" id="tagMainContent">📖 整理後學習內容與核心句型</div>
                            <div id="mainContentContainer"></div>
                        </div>

                        <!-- 句型實戰練習題 -->
                        <div class="block-section" id="quizSection">
                            <div class="tag-title tag-violet" id="tagQuiz">✍️ 實戰練習與自我檢測</div>
                            <div id="quizContainer"></div>
                        </div>

                        <div class="block-section" id="vocabSection">
                            <div class="tag-title tag-emerald" id="tagVocab">📝 重點單字與注意事項</div>
                            <ul class="vocab-ul" id="vocabDisplay"></ul>
                        </div>
                    </div>
                </div>
            </div>

            <div class="nav-controls">
                <button id="btnPrev" class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
                <button id="btnNext" class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
            </div>
        </div>

        <!-- 視圖 2: 8 大特訓模組 (AI Learning Suite) -->
        <div id="viewSuite" style="display: none;">
            <div class="suite-grid">
                <button class="suite-btn active" onclick="loadSuiteTool('guide', this)">📖 速成指南</button>
                <button class="suite-btn" onclick="loadSuiteTool('socratic', this)">🏛️ 蘇格拉底問答</button>
                <button class="suite-btn" onclick="loadSuiteTool('forecaster', this)">🎯 考點預測 Top5</button>
                <button class="suite-btn" onclick="loadSuiteTool('confusion', this)">💡 盲點澄清器</button>
                <button class="suite-btn" onclick="loadSuiteTool('gap', this)">🔍 知識缺口診斷</button>
                <button class="suite-btn" onclick="loadSuiteTool('podcast', this)">🎙️ Audio Podcast</button>
                <button class="suite-btn" onclick="loadSuiteTool('teachback', this)">🧑‍🏫 費曼自述檢測</button>
                <button class="suite-btn" onclick="switchAppMode('exam', document.querySelectorAll('.main-mode-btn')[2])">📝 模擬考卷</button>
            </div>

            <div class="suite-panel" id="suiteContentPanel">
                <!-- 動態注入 8 大工具內容 -->
            </div>
        </div>

        <!-- 視圖 3: 全真模擬考卷 (Practice Exam Generator) -->
        <div id="viewExam" style="display: none;">
            <div class="card" style="max-height: 75vh;">
                <h2 style="font-size: 20px; color: #1e1b4b; margin-top:0;">📝 Networking English 全真模擬檢測試卷</h2>
                <div style="font-size: 13px; color: #64748b; margin-bottom: 14px;">⏱️ 建議作答時間：20 分鐘 | 滿分：100 分</div>
                
                <div id="examContainer"></div>
                
                <button class="quiz-toggle-btn" style="width: 100%; padding: 14px; font-size: 16px; margin-top: 16px;" onclick="toggleExamAnswers()">
                    🎯 繳卷並核對全真詳解
                </button>
            </div>
        </div>

    </div>

    <script>

        const rawDatabase = [{"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "社交問候 (Greetings)", "category_en": "Greetings & Small Talk", "title": "打招呼與近況寒暄 (Greetings & Responses)", "title_en": "Greetings & Daily Catch-ups", "key_takeaways": "1. 熟人與同事間的自然問候：優先使用 Hey there! 或 How’s it going?。\n2. 描述近況平淡無波折時：避免只說 I'm fine，使用 Same old, same old 或 The usual 更在地自然。", "key_takeaways_en": "1. Natural casual greetings: Use 'Hey there!' or 'How’s it going?' among coworkers.\n2. Neutral responses: Instead of just saying 'I’m fine', use 'Same old, same old' or 'The usual' for natural daily updates.", "main_content": "• 自然問候 (Informal Greetings):\n  - Hey there!\n  - How’s it going?\n  - How are things (with you)?\n\n• 描述近況平穩 (Neutral Responses):\n  - Same old, same old!\n  - The usual. / Pretty much the same.\n  - (Pretty) uneventful. / Nothing special.", "vocab_notes": ["Same old, same old：高頻口語，表達工作或生活一切照舊、沒太大變化。", "Uneventful：形容詞，指平靜無事的、沒有重大事件發生的。", "How have you been?：現在完成式，用於詢問自上次見面以來的近況。", "Can't complain：挺好的、沒什麼好挑剔的，相當於 Not bad 或 Pretty good。", "Pretty much the same：幾乎跟平常一模一樣，常用於回答 How are things?。"], "vocab_notes_en": ["Same old, same old: Common idiom indicating that life or work is going on as usual.", "Uneventful: Adjective meaning quiet with no exciting, unusual, or major events.", "How have you been?: Present perfect tense used to ask about someone's life since last meeting.", "Can't complain: Casual phrase meaning things are pretty good and there's nothing to gripe about.", "Pretty much the same: Standard polite response to 'How are things?'."], "practice_quiz": [{"question": "【填空題】同事問你 How’s work going?，你想回答「老樣子，一切照舊」：\n_________ , _________ ! Pretty much the same.", "question_en": "Fill-in-the-blank: When asked 'How’s work going?', reply that everything is as usual:\n_________ , _________ ! Pretty much the same.", "answer": "✔ 填空解答：Same old, same old\n👉 整句回答：Same old, same old! Pretty much the same.\n💡 解析：Same old, same old 是最道地的口語 concepts": ["1. 'Look forward to + V-ing' 的介系詞本質。", "2. 初次見面（meeting）與再次見面（seeing）的道別動詞區分。", "3. 職場非正式道別（I've got to get going）的得體性。"], "misconceptions": ["誤解 1：看到 to 就直覺接原形動詞（✖ 錯誤：I look forward to hear from you）。", "誤解 2：在非初次見面時說 'Nice to meet you'（再次見面應為 'Good to see you'）。"], "exam_questions": ["Q1: 請挑出錯誤並改正：'We look forward to discuss the project with your team.'", "Q2: 在週五下班前，美籍顧問向你說 'Have a good one!'，這句話的 'one' 指的是什麼？"]}, "socratic_quiz": [{"level": "文法陷阱題 (Level 1)", "prompt": "為什麼 'I am looking forward to see you' 在文法審查中會被判定為嚴重錯誤？", "feedback": "因為此處的 'to' 不是不定詞符號，而是表示方向與對象的介系詞（Preposition），介系詞後方必須接動名詞 (Gerund) 或名詞。"}], "confusion_fixer": {"analogy": "【生活類比】：'to' 就像一個收納箱，有些箱子只裝原形動詞（不定詞），有些箱子只裝名詞與動名詞（介系詞）。'Look forward to' 屬於後者！", "real_example": "信件結尾：'I look forward to collaborating with your EHS team in Kaohsiung.'", "common_mistake": "錯誤：I look forward to receive your feedback."}, "gap_finder": ["⚠️ 潛在缺口：在書信與口語中混淆 'Nice meeting you'（初見面結尾）與 'Nice seeing you'（熟人結尾）。"], "teach_back": {"prompt": "請說明為什麼 'Look forward to' 後面一定要接 V-ing，並造出一個正確的商務例句。", "keywords": ["介系詞", "動名詞", "V-ing", "preposition", "meeting", "seeing"]}, "link": "https://www.berlitz.com/blog/goodbye-english", "link_text": "81 Ways to Say Goodbye in English"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "商務人脈 (Networking)", "category_en": "Networking Role-Play", "title": "展會破冰與部門職掌交流 (Networking Role-Play 投影片全劇本)", "title_en": "Networking Role-Play Full Script", "key_takeaways": "【課堂即興演練核心 Scenario】\n在 Networking Event 初次見面，互相介紹自身與公司，並在交流中自然帶出工作上遭遇的實際問題（Problem/Need），促成合作與交換名片！\n\n【標準 6 階段流程】\n1. 自我介紹與部門 ➔ 2. 詢問對方部門業務 ➔ 3. 簡述自己部門職掌 ➔ 4. 對方帶出工作痛點 ➔ 5. 主動提供協助 ➔ 6. 交換名片約定後續聯絡。", "key_takeaways_en": "Scenario: Meet someone for the first time at a networking event, introduce company roles, identify an operational problem, offer help, and exchange cards.\n\n6-Step Flow: Introduction ➔ Inquire role ➔ Explain dept capabilities ➔ Identify client pain point ➔ Offer ety.\nB: Hi, I'm Alex. Pleasure to meet you.\nA: Can you tell me about your department?\nB: Sure! I work in Operations. We manage plant production lines.\nA: Can I briefly tell you about what our department does?\nB: Of course! Fire away!\nA: We conduct safety risk assessments and incident prevention audits.\nB: You just remind me that we may need your help in identifying chemical vapor leakage risks.\nA: Yeah, I think we might be able to help you.\nB: That would be great!\nA: Here's my business card should you want to call.\nB: Absolutely. I'll be in touch soon.", "answer_en": "A: Hello, I'm Ryan. I work as a Senior EHS Specialist in Process Safety.\nB: Hi, I'm Alex. Pleasure to meet you.\nA: Can you tell me about your department?\nB: Sure! I work in Operations. We manage plant production lines.\nA: Can I briefly tell you about what our department does?\nB: Of course! Fire away!\nA: We conduct safety risk assessments and incident prevention audits.\nB: You just remind me that we may need your help in identifying chemical vapor leakage risks.\nA: Yeah, I think we might be able to help you.\nB: That would be great!\nA: Here's my business card should you want to call.\nB: Absolutely. I'll be in touch soon."}], "instant_guide": {"core_concepts": ["1. Networking 的核心是解決對方問題（Value Creation）而非硬性推銷。", "2. 關鍵樞紐轉折句：'You just remind me that we may need your help in...'", "3. 名片遞交的高階假設句法：'Here's my card should you want to call.'"], "misconceptions": ["誤解 1：以為 Networking 只是單向自我介紹（必須雙向詢問並挖掘痛點）。", "誤解 2：以為遞名片只能說 'This is my card'（使用 'should you want to...' 更展現專業與謙遜）。"], "exam_questions": ["Q1: 請默寫出從『聽取對方部門職掌』銜接到『帶出自身部門需求』的關鍵英文句子。", "Q2: 請說明倒裝假設句 'should you want to call' 的文法由來（If you should want to call）。"]}, "socratic_quiz": [{"level": "策略提問 (Level 1)", "prompt": "在 Networking 場合中，為什麼 A 要先詢問 B 的部門，而不是一開始就推銷自己的業務？", "feedback": "這展現了專業社交禮貌與聆聽者的素養（Active Listening），先理解對方的業務範疇，後續才能精準將自身能力包裝成對方的解決方案（Solution）。"}, {"level": "實戰挑戰 (Level 2)", "prompt": "如果對方聽完你的業務後沒有主動提需求，你該如何得體地主動提供協助         function cleanText(str) {
            if (!str) return '';
            return String(str).replace(/\]*\]/g, '').trim();
        }

        function resizeCanvas() {
            const card = document.getElementById('cardElement');
            const width = card.scrollWidth;
            const height = Math.max(card.scrollHeight, card.clientHeight);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            canvas.width = width;
            canvas.height = height;
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            const penBtn = document.getElementById('penBtn');
            const card = document.getElementById('cardElement');
            if (isPenMode) {
                penBtn.classList.add('active-pen');
                card.classList.add('canvas-active');
                resizeCanvas();
            } else {
                penBtn.classList.remove('active-pen');
                card.classList.remove('canvas-active');
            }
        }

        function saveSnapshot() {
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (undoStack.length > 25) undoStack.shift();
        }

        function undoLastStroke() {
            if (undoStack.length > 0) {
                const previousState = undoStack.pop();
                ctx.putImageData(previousState, 0, 0);
            } else {
                clearAllCanvas();
            }
        }

        function clearAllCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            undoStack = [];
        }

        function getExactCoords(e) {
            const card = document.getElementById('cardElement');
            const rect = card.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left + card.scrollLeft,
                y: clientY - rect.top + card.scrollTop
            };
        }

        function startDrawing(e) {
            if (!isPenMode) return;
            isDrawing = true;
            saveSnapshot();
            const coords = getExactCoords(e);
            lastX = coords.x; lastY = coords.y;
        }

        function draw(e) {
            if (!isDrawing || !isPenMode) return;
            if (e.cancelable) e.preventDefault();
            const coords = getExactCoords(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);
            ctx.strokeStyle = 'rgba(225, 29, 72, 0.85)';
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            lastX = coords.x; lastY = coords.y;
        }

        function stopDrawing() { isDrawing = false; }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        function renderMainContent(rawContent) {
            const container = document.getElementById('mainContentContainer');
            container.innerHTML = "";
            if (!rawContent) return;

            const text = cleanText(rawContent);
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const hasDialogue = lines.some(l => l.startsWith('A:') || l.startsWith('B:'));

            if (hasDialogue) {
                const dialogueBox = document.createElement('div');
                dialogueBox.className = 'dialogue-container';
                lines.forEach(line => {
                    if (line.startsWith('A:')) {
                        const row = document.createElement('div');
                        row.className = 'chat-bubble-row speaker-a';
                        row.innerHTML = `<div class="speaker-avatar avatar-a">A</div><div class="chat-bubble-content">${line.substring(2).trim()}</div>`;
                        dialogueBox.appendChild(row);
                    } else if (line.startsWith('B:')) {
                        const row = document.createElement('div');
                        row.className = 'chat-bubble-row speaker-b';
                        row.innerHTML = `<div class="speaker-avatar avatar-b">B</div><div class="chat-bubble-content">${line.substring(2).trim()}</div>`;
                        dialogueBox.appendChild(row);
                    } else {
                        const intro = document.createElement('div');
                        intro.style.fontSize = '14px'; intro.style.fontWeight = '700'; intro.style.color = '#64748b'; intro.style.margin = '4px 0';
                        intro.innerText = line;
                        dialogueBox.appendChild(intro);
                    }
                });
                container.appendChild(dialogueBox);
            } else {
                const plainBox = document.createElement('div');
                plainBox.style.fontSize = '16px'; plainBox.style.fontWeight = '600'; plainBox.style.color = '#0c4a6e';
                plainBox.style.backgroundColor = 'var(--sky-bg)'; plainBox.style.padding = '16px'; plainBox.style.borderRadius = '16px';

                container.appendChild(plainBox);
            }
        }

            initWeekOptions();
            applyFilters();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
            checkAppVersion();
        };
    </script>
</body>
</html>
