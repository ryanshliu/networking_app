<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Networking English - AI Learning Suite (Version 1.5)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #1e1b4b;
            --text-body: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --amber-bg: #fffbeb; --amber-border: #fef3c7; --amber-text: #b45309;
            --sky-bg: #f0f9ff; --sky-border: #e0f2fe; --sky-text: #0369a1;
            --emerald-bg: #ecfdf5; --emerald-border: #d1fae5; --emerald-text: #047857;
            --violet-bg: #faf5ff; --violet-border: #e9d5ff; --violet-text: #6b21a8;
            --bubble-a-bg: #ffffff; --bubble-a-border: #cbd5e1;
            --bubble-b-bg: #eef2ff; --bubble-b-border: #c7d2fe;
            --app-max-width: 480px;
        }
        @media (min-width: 640px) {
            :root { --app-max-width: 720px; }
            body { padding: 24px 20px !important; }
            h1 { font-size: 28px !important; }
            .card { padding: 30px 28px !important; max-height: 74vh !important; border-radius: 28px !important; }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); margin: 0; padding: 16px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }
        .app-layout { width: 100%; max-width: var(--app-max-width); display: flex; flex-direction: column; }
        .header { width: 100%; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 25px; font-weight: 800; color: var(--text-title); margin: 4px 0 2px 0; }
        .author-badge {
            display: inline-block; font-size: 12px; font-weight: 700; color: var(--primary);
            background-color: var(--primary-soft); padding: 3px 12px; border-radius: 12px; margin-bottom: 8px;
        }
        .main-mode-nav { display: flex; gap: 6px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; margin-bottom: 10px; }
        .main-mode-btn {
            flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 800; border: none; border-radius: 12px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .main-mode-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 3px 10px rgba(79, 70, 229, 0.15); }
        .pen-toolbar { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 12px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
        }
        .tool-btn.active-pen { background-color: #ffe4e6; border-color: #e11d48; color: #e11d48; }
        .admin-btn { background-color: #f1f5f9; border: 1.5px dashed #64748b; color: #334155; }
        .filters { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        select {
            width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 15px; font-weight: 600;
            border-radius: 14px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none; margin-bottom: 8px;
        }
        .tab-group { width: 100%; box-sizing: border-box; display: flex; gap: 8px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 11px 6px; font-size: 15px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active { background: #ffffff !important; color: var(--primary) !important; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12); }
        .card-container { width: 100%; flex: 1; display: flex; flex-direction: column; position: relative; }
        .card {
            background-color: var(--card-bg); border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        #drawCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100; }
        .card.canvas-active #drawCanvas { pointer-events: auto; touch-action: none; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .badge.media-badge { background-color: #fef3c7; color: #92400e; }
        .counter { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .title { font-size: 21px; font-weight: 800; color: var(--text-title); margin-bottom: 14px; line-height: 1.35; }
        .block-section { margin-bottom: 18px; text-align: left; }
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 12.5px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
        .tag-violet { background-color: var(--violet-bg); color: var(--violet-text); border: 1px solid var(--violet-border); }
        .block-desc { font-size: 15.5px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }

        /* ==================== 膠囊標籤系統 ==================== */
        .context-tag {
            display: inline-block; padding: 2px 9px; font-size: 12px; font-weight: 800; border-radius: 14px;
            margin: 1px 3px; letter-spacing: 0.2px; vertical-align: middle; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .tag-blue { background-color: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; } /* 英式用法/交通 */
        .tag-amber-badge { background-color: #fef3c7; color: #b45309; border: 1px solid #fde68a; } /* 美式用法/警示 */
        .tag-purple { background-color: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; } /* 高階管理/管理風格/性格 */
        .tag-green { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; } /* 多益核心/商業/財務 */
        .tag-rose { background-color: #ffe4e6; color: #e11d48; border: 1px solid #fecdd3; } /* 高頻/談判策略/社交 */
        .tag-neutral { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; } /* 其他屬性標籤 */

        /* ==================== 音標柔和化 (自然融入行文，不突兀) ==================== */
        .ipa-tag {
            color: #64748b; /* 柔和沉穩的低調灰藍色，絕不刺眼 */
            font-family: "Lucida Sans Unicode", "DejaVu Sans", "Segoe UI", sans-serif;
            font-size: 0.88em;
            font-weight: 600;
            background: transparent; /* 完全移除突兀的底色 */
            border: none; /* 完全移除外框 */
            padding: 0 2px;
            margin: 0 2px;
            display: inline;
        }

        /* ==================== 重點單字專屬美化卡片條目 (告別擁擠) ==================== */
        .vocab-card-item {
            background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 14px 16px;
            margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 6px;
        }
        .vocab-head-row {
            display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 16px; font-weight: 800; color: #1e1b4b;
        }
        .vocab-pos-tag { font-size: 13px; font-weight: 700; color: #64748b; font-style: italic; }
        .vocab-def-text { font-size: 14.5px; font-weight: 600; color: #334155; line-height: 1.5; margin-top: 2px; }
        .vocab-example-box {
            background-color: #f8fafc; border-left: 3.5px solid #4f46e5; border-radius: 0 8px 8px 0;
            padding: 8px 12px; font-size: 14px; color: #1e293b; line-height: 1.5; margin-top: 4px; font-weight: 500;
        }

        /* ==================== Your Tasks 美工階層卡片 ==================== */
        .task-card {
            background: #ffffff; border: 1.5px solid #a7f3d0; border-radius: 20px; padding: 18px 16px;
            margin: 18px 0; box-shadow: 0 6px 18px rgba(16, 185, 129, 0.08); text-align: left;
        }
        .task-card-header {
            display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; color: #047857;
            margin-bottom: 14px; border-bottom: 2px dashed #bbf7d0; padding-bottom: 10px;
        }
        .task-block {
            background: #f0fdf4; border: 1px solid #d1fae5; border-radius: 12px; padding: 12px 14px;
            margin-bottom: 10px; font-size: 14px; line-height: 1.7; color: #064e3b;
        }
        .task-block-title { font-weight: 800; color: #065f46; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }

        /* 對話與雙語排版 */
        .dialogue-container { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .chat-bubble-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
        .chat-bubble-row.speaker-b { flex-direction: row-reverse; }
        .speaker-avatar {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; color: #ffffff; flex-shrink: 0; margin-top: 4px;
        }
        .speaker-avatar.avatar-a { background: #2563eb; }
        .speaker-avatar.avatar-b { background: #7c3aed; }
        .chat-bubble-content {
            max-width: 84%; padding: 11px 15px; border-radius: 16px; font-size: 15px; line-height: 1.55; font-weight: 600;
        }
        .speaker-a .chat-bubble-content { background-color: var(--bubble-a-bg); border: 1.5px solid var(--bubble-a-border); }
        .speaker-b .chat-bubble-content { background-color: var(--bubble-b-bg); border: 1.5px solid var(--bubble-b-border); }
        .chat-cn-trans { font-size: 13px; color: #64748b; margin-top: 4px; font-weight: 500; }

        .quiz-card {
            background-color: var(--violet-bg); border: 1.5px solid var(--violet-border);
            border-radius: 18px; padding: 16px; margin-bottom: 12px;
        }
        .quiz-q { font-size: 15.5px; font-weight: 700; color: #4c1d95; line-height: 1.6; margin-bottom: 10px; }
        .quiz-toggle-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff; border: none; padding: 7px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer;
        }
        .quiz-ans-wrapper { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d8b4fe; }
        .quiz-ans-box {
            background: #ffffff; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #bbf7d0;
            font-size: 15px; color: #14532d; line-height: 1.65; white-space: pre-line; font-weight: 600;
        }

        .link-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-color); text-align: left; }
        .link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
            padding: 13px 18px; font-size: 15px; color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            text-decoration: none; font-weight: 700; border-radius: 14px;
        }

        /* 8 大模式 UI */
        .suite-scope-nav { display: flex; gap: 6px; background-color: #f1f5f9; padding: 4px; border-radius: 14px; margin-bottom: 10px; }
        .suite-scope-btn {
            flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 800; border: none; border-radius: 10px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .suite-scope-btn.active { background: #ffffff; color: var(--primary); }
        .suite-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .suite-btn {
            background: #ffffff; border: 1.5px solid #cbd5e1; padding: 10px 8px; border-radius: 14px;
            font-size: 13px; font-weight: 800; color: #334155; cursor: pointer; text-align: left;
        }
        .suite-btn.active { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
        .suite-panel { background: #ffffff; border: 1.5px solid var(--border-color); border-radius: 20px; padding: 18px; }

        .podcast-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #ffffff; padding: 20px 16px; border-radius: 20px; text-align: center;
        }
        .podcast-controls {
            display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 12px 0;
            background: rgba(0, 0, 0, 0.25); padding: 14px; border-radius: 16px;
        }
        .control-row { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 13.5px; color: #c7d2fe; }
        .accent-select { background: #ffffff; color: #1e1b4b; font-weight: 800; padding: 6px 10px; border-radius: 10px; border: none; }
        .podcast-play-btn {
            background: #10b981; color: #fff; border: none; padding: 13px 26px; border-radius: 24px;
            font-size: 15.5px; font-weight: 800; cursor: pointer;
        }
        .podcast-play-btn.playing { background: #ef4444 !important; }

        .nav-controls { width: 100%; display: flex; gap: 12px; margin-top: 12px; }
        .nav-btn { flex: 1; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; }

        /* 管理者 Modal */
        #adminModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 999; justify-content: center; align-items: center; padding: 14px; box-sizing: border-box;
        }
        .admin-box {
            background: #ffffff; border-radius: 24px; width: 100%; max-width: 500px; max-height: 85vh;
            overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        input, textarea {
            width: 100%; box-sizing: border-box; padding: 10px; border-radius: 12px; border: 1.5px solid var(--border-color); margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="header">
            <h1>Networking English</h1>
            <div class="author-badge">By Ryan Liu, Version 1.5</div>
            <div class="main-mode-nav">
                <button class="main-mode-btn active" onclick="switchAppMode('cards', this)">📚 學習卡片</button>
                <button class="main-mode-btn" onclick="switchAppMode('suite', this)">⚡ 8大學習模組</button>
                <button class="main-mode-btn" onclick="switchAppMode('exam', this)">📝 全真模擬考</button>
            </div>
            <div class="pen-toolbar">
                <button id="penBtn" class="tool-btn" onclick="togglePenMode()">🖍️ 細畫筆</button>
                <button class="tool-btn" onclick="undoLastStroke()">↩️ 復原</button>
                <button class="tool-btn" onclick="clearAllCanvas()">🗑️ 全清</button>
                <button class="tool-btn admin-btn" onclick="openAdminModal()">🔒 補充單字</button>
            </div>
        </div>

        <!-- 視圖 1: 學習卡片模式 -->
        <div id="viewCards">
            <div class="filters">
                <select id="weekFilter" onchange="applyFilters()">
                    <option value="week1">WEEK 1 (2026/08/12)</option>
                    <option value="week2">WEEK 2 (2026/08/19)</option>
                    <option value="week3">WEEK 3 (2026/09/02)</option>
                    <option value="week4" selected>WEEK 4 (2026/09/09)</option>
                </select>
                <div class="tab-group">
                    <button id="tabSentence" class="tab-btn active" onclick="setTab('sentence')">句型 / 文法</button>
                    <button id="tabMedia" class="tab-btn" onclick="setTab('media')">影音 / 自習</button>
                </div>
            </div>

            <div class="card-container">
                <div class="card" id="cardElement">
                    <canvas id="drawCanvas"></canvas>
                    <div>
                        <div class="card-header">
                            <div>
                                <span class="badge" id="categoryBadge">分類</span>
                                <span style="font-size: 12.5px; color: #64748b;" id="dateDisplay"></span>
                            </div>
                            <span class="counter" id="counterDisplay">1 / 1</span>
                        </div>
                        <div class="title" id="titleDisplay">載入中...</div>

                        <div class="block-section" id="takeawaysSection">
                            <div class="tag-title tag-amber">💡 核心重點說明</div>
                            <div class="block-desc" id="takeawaysDisplay"></div>
                        </div>

                        <!-- 專屬美工 Your Tasks 卡片 -->
                        <div id="taskCardSection" style="display:none;"></div>

                        <div class="block-section" id="mainContentSection">
                            <div class="tag-title tag-sky">📖 學習內容與核心對話</div>
                            <div id="mainContentContainer"></div>
                        </div>

                        <div class="block-section" id="quizSection">
                            <div class="tag-title tag-violet">✍️ 課堂實戰練習與填空題</div>
                            <div id="quizContainer"></div>
                        </div>

                        <div class="block-section" id="vocabSection">
                            <div class="tag-title tag-emerald">📝 重點單字與注意事項</div>
                            <div id="vocabDisplayContainer"></div>
                        </div>
                    </div>

                    <div class="link-box" id="linkSection">
                        <a class="link-btn" id="linkDisplay" href="#" target="_blank" rel="noopener noreferrer">🔗 開啟延伸學習資源</a>
                    </div>
                </div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
                <button class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
            </div>
        </div>

        <!-- 視圖 2: 8 大特訓模組 -->
        <div id="viewSuite" style="display: none;">
            <div class="suite-scope-nav">
                <button id="scopeCurrentBtn" class="suite-scope-btn active" onclick="setSuiteScope('current', this)">📌 當前選定週次</button>
                <button id="scopeAllBtn" class="suite-scope-btn" onclick="setSuiteScope('all', this)">🌐 全部課程大整合</button>
            </div>

            <div class="suite-grid">
                <button class="suite-btn active" onclick="loadSuiteTool('guide', this)">📖 速成指南</button>
                <button class="suite-btn" onclick="loadSuiteTool('socratic', this)">🏛️ 蘇格拉底問答</button>
                <button class="suite-btn" onclick="loadSuiteTool('forecaster', this)">🎯 考點預測 Top5</button>
                <button class="suite-btn" onclick="loadSuiteTool('confusion', this)">💡 盲點澄清器</button>
                <button class="suite-btn" onclick="loadSuiteTool('gap', this)">🔍 知識缺口診斷</button>
                <button class="suite-btn" onclick="loadSuiteTool('podcast', this)">🎙️ Audio Podcast</button>
            </div>

            <div class="suite-panel" id="suiteContentPanel"></div>
        </div>

        <!-- 視圖 3: 全真模擬考卷 -->
        <div id="viewExam" style="display: none;">
            <div class="card" style="max-height: 75vh;">
                <h2 style="font-size: 20px; color: #1e1b4b; margin-top:0;">📝 Networking English 全真模擬檢測試卷</h2>
                <div id="examContainer"></div>
            </div>
        </div>
    </div>

    <!-- 管理者 Modal -->
    <div id="adminModal">
        <div class="admin-box">
            <h3 style="margin-top:0; color:#1e1b4b;">🔒 管理者課堂即時補充</h3>
            <div id="adminAuthSection">
                <div style="font-size:14px; margin-bottom:8px; color:#64748b;">請輸入管理者密碼以解鎖編輯權限：</div>
                <input type="password" id="adminPwdInput">
                <button class="quiz-toggle-btn" style="width:100%; padding:10px;" onclick="verifyAdminPassword()">解鎖管理後台</button>
            </div>
            <div id="adminFormSection" style="display:none;">
                <label style="font-size:13px; font-weight:700;">選擇週次：</label>
                <select id="admWeek">
                    <option value="week1">Week 1 (2026/08/12)</option>
                    <option value="week2">Week 2 (2026/08/19)</option>
                    <option value="week3">Week 3 (2026/09/02)</option>
                    <option value="week4">Week 4 (2026/09/09)</option>
                </select>
                <label style="font-size:13px; font-weight:700;">補充標題：</label>
                <input type="text" id="admTitle">
                <label style="font-size:13px; font-weight:700;">核心句型/對話：</label>
                <textarea id="admContent" rows="3"></textarea>
                <label style="font-size:13px; font-weight:700;">補充單字 (每行一個)：</label>
                <textarea id="admVocab" rows="3"></textarea>
                
                <div style="display:flex; gap:8px; margin-top:10px;">
                    <button class="quiz-toggle-btn" style="flex:1; padding:10px;" onclick="saveAdminSupplement()">💾 儲存並即時套用</button>
                    <button class="quiz-toggle-btn" style="background:#64748b; padding:10px;" onclick="closeAdminModal()">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const database = [{"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "社交問候 (Greetings)", "title": "初次見面與熟人寒暄 (Greetings & Responses)", "key_takeaways": "【多益高頻句型與職場延伸】\n1. 詢問近況的道地句型：How is it going? / How are things with you? (近來如何？)\n2. 萬用中性回答公式：Same old, same old. / Pretty much the same. / Can not complain [kənˈpleɪn]. (老樣子/一切都好/沒什麼好抱怨的)\n3. 職場接人文化差異：美式常用 pick up someone，而英式英語則常使用 collect [kəˈlɛkt] someone 來表示接送某人。\n4. 接待禮儀：正式會議開場引導外賓入座時，請使用 Please be seated [ˈsitɪd]. (請入座)", "main_content": "A: Hi, my name is John. Please be seated. And you are?\n（你好，我是約翰。請坐，請問您是？）\nB: I am Ryan. I am a new recruit from the IT department.\n（我是 Ryan，我是資訊部門的新進員工。）\nA: How is it going with your new project?\n（新專案進行得怎麼樣？）\nB: Pretty good. Can not complain.\n（挺好的，沒什麼好抱怨的。）\nA: I have got to go now to collect our client from the station. See ya!\n（我現在得去車站接客戶了，回頭見！）\nB: Sure! Catch up with you later!\n（好的，待會再聊！）", "vocab_notes": ["Collect someone [kəˈlɛkt] (v. phr.) [英式用法]：接送某人（等同美式 pick up someone）。\n  例句：I need to *collect* my manager from Kaohsiung High Speed Rail Station at 3 PM.", "Pick up someone (v. phr.) [美式用法]：接送某人。\n  例句：Can you *pick up* the client from the airport tomorrow morning?", "Recruit [rɪˈkrut] (n./v.) [職場高頻]：新進員工；招募。\n  例句：Anna is our latest *recruit* in the research and development department.", "Please be seated [ˈsitɪd] (句型) [商務禮儀]：請入座、請坐下。\n  例句：Ladies and gentlemen, the keynote presentation is starting, *please be seated*.", "Catch up with someone (片語) [商務社交]：與某人敘舊、聊聊近況。\n  例句：It was wonderful to *catch up with you* after the regional conference."], "practice_quiz": [{"question": "【第 1 題】英式英語中要表達去車站接客戶，可以填入哪個動詞？\nI need to _________ our client from the train station.", "answer": "✔ 填空解答：collect\n👉 整句回答：I need to collect our client from the train station.\n💡 解析：在英式英語中，collect 常用於接送人；美式英語則偏好使用 pick up."}], "instant_guide": {"core_concepts": ["1. 熟人寒暄避免死板回答 I am fine。", "2. 英美用法區分：collect someone (英) vs pick up someone (美)。", "3. 正式接待外賓禮儀：Please be seated。"], "misconceptions": ["誤解：以為每次道別都只能說 Goodbye，口語中 Catch up with you later 更顯親切。"], "exam_questions": ["Q1: 請說明英式英語 collect someone 與美式英語 pick up someone 在使用上的語意等價性。"]}, "socratic_quiz": {"level": "商務社交策略 (Level 1)", "prompt": "當外國客戶問你 How is work going? 時，回答 Same old, same old 與 Can not complain 在語感上有何不同？", "feedback": "Same old 表示工作如常、平穩無重大波折；Can not complain 則帶有積極正向、事情進行順利且沒有值得挑剔之處的語感。"}, "confusion_fixer": {"analogy": "問候就像拋接球，回覆 I am fine 像是把球接住後直接放地上，而回答 Can not complain 則是把球順暢地拋回對方場地。", "real_example": "走廊偶遇：Hey Ryan, how are things? ➔ Can not complain, just wrapping up the weekly safety audit.", "common_mistake": "錯誤：How do you do? 用於熟人寒暄（這只用於非常正式的初次見面握手場合）。"}, "gap_finder": ["⚠️ 潛在缺口：與英系外商客戶溝通時，常忽略 collect 表示接人的實務用法。"], "link": "https://www.linkedin.com/pulse/18-ways-say-hello-english-thomas-spengler/", "link_text": "18 Ways to Say Hello in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "道別用語 (Goodbyes)", "title": "道別與核心文法規則 (Ways to Say Goodbye & Grammar)", "key_takeaways": "【多益高頻句型與文法規則】\n1. 職場非正式道別：I have got to get going / Take it easy / Have a good one / See ya.\n2. 正式商務道別：It was a pleasure [ˈplɛʒɚ] to see you / I look forward to our next meeting.\n3. 多益必考文法 Pro Tip：Look forward to + V-ing（to 是介系詞，後面必須接動名詞 V-ing 或名詞，絕不可接原形動詞！）。", "main_content": "A: I have got to get going now! I look forward to our next meeting.\n（我現在得告辭了！期待我們的下次會議。）\nB: Take it easy! Have a good one!\n（保重！祝你今天順心！）\nA: It was a pleasure to see you.\n（很高興見到您。）\nB: I look forward to seeing you soon in Kaohsiung.\n（期待很快在高雄與您見面。）", "vocab_notes": ["Look forward to + V-ing [lʊk ˈfɔrwərd tu] (phr.) [多益核心]：期待相會（to 為介系詞）。\n  例句：I *look forward to collaborating* with your process safety team on the upcoming plant audit.", "Take it easy (idiom) [口語高頻]：保重、放輕鬆（非正式道別語）。\n  例句：*Take it easy* this weekend, you have been working exceptionally hard.", "Exit vs. Exist [易混淆字]：\n  - Exit [ˈɛɡzɪt] (n./v.)：出口；離開。\n  - Exist [ɪɡˈzɪst] (v.)：存在、生存。\n  例句：Please proceed to the emergency *exit* if safety alarms sound."], "practice_quiz": [{"question": "【第 1 題】請填入 see 的正確動詞形式：\nI look forward to _________ you at the conference next month.", "answer": "✔ 填空解答：seeing (V-ing)\n👉 整句回答：I look forward to seeing you at the conference next month.\n💡 解析：Look forward to 中的 to 是介系詞，後方必須搭配動名詞 V-ing 或名詞！"}], "instant_guide": {"core_concepts": ["1. Look forward to 後接動名詞 V-ing 的介系詞本質。", "2. 初次見面與再次見面的道別動詞區分。"], "misconceptions": ["誤解：看到 to 就直覺接原形動詞 ➔ 錯誤：I look forward to see you。"], "exam_questions": ["Q1: 請挑出錯誤並改正：We look forward to discuss the project with your team."]}, "socratic_quiz": {"level": "文法規則 (Level 1)", "prompt": "為什麼 I am looking forward to see you 在正式商業書信中會被判定為嚴重文法錯誤？", "feedback": "因為此處的 to 不是不定詞符號，而是表示方向與對象的介系詞，介系詞後方必須接動名詞 (V-ing) 或名詞。"}, "confusion_fixer": {"analogy": "to 就像特定規格的插座，不定詞插座只插原形動詞，而介系詞插座只接受名詞或動名詞。", "real_example": "信件結尾：I look forward to cooperating with your technical division.", "common_mistake": "錯誤：I look forward to receive your quotation."}, "gap_finder": ["⚠️ 潛在缺口：在書信中混淆初次見面結尾與熟人再次見面結尾。"], "link": "https://www.berlitz.com/blog/goodbye-english", "link_text": "81 Ways to Say Goodbye in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "影音自習 (BP 5.4.1)", "title": "商務社交情境：巴黎會面 (Business Partner A2 5.4.1)", "key_takeaways": "【詳細劇情摘要與學習重點】\n1. 劇情核心：Julia 抵達巴黎參加商務研討會，與合作夥伴 Maria 和 Max 會面，討論抵達交通方式與飯店舒適度。\n2. 詢問抵達交通句型：When did you arrive? / I flew in yesterday afternoon.\n3. 接待餐敘邀約：Do you have plans for dinner tonight? / Count me in!", "main_content": "A: When did you arrive in Paris?\n（妳什麼時候抵達巴黎的？）\nB: I flew here yesterday afternoon. Traffic from the airport was heavy.\n（我昨天下午搭飛機到的。從機場過來的路上交通很塞。）\nA: Where are you staying? Do you like the hotel?\n（妳住在哪裡？喜歡這間飯店嗎？）\nB: At the Mason Park Hotel. The room is small, but comfortable, and it is a 5-minute walk to the venue.\n（住在梅森公園飯店。房間雖小但很舒服，步行到會場只要5分鐘。）\nA: Do you have plans for dinner tonight? Would you like to come?\n（今晚有晚餐計畫嗎？想一起來嗎？）\nB: Count me in! Why not?\n（算我一份！當然好啊！）", "vocab_notes": ["Venue [ˈvɛnju] (n.) [多益高頻]：會場、舉辦地點。\n  例句：It is a 5-minute walk from our hotel to the exhibition *venue*.", "Fly in / Fly here (v. phr.) [商務出差]：搭機抵達。\n  例句：Our technical consultants *flew in* from Singapore this morning to join the conference."], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "觀看 Business Partner 5.4.1 示範影片 (YouTube)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "官方腳本閱讀 (BP Script)", "title": "Business Partner A2 影音逐字稿對照 (Page 3)", "key_takeaways": "【官方指定文件研讀】\n請參閱 Business Partner A2 影音腳本 PDF 第 3 頁，對照聽力逐字稿加強記憶，比對真實商務語速、發音弱化與連音技巧。", "main_content": "閱讀重點指引:\n請開啟下方 PDF 講義第 3 頁，比對 Julia、Maria 與 Max 在飯店大廳會面時的真實語速、發音弱化與商務社交措辭。", "vocab_notes": ["Transcript [ˈtrænsˌkrɪpt] (n.) [商務必備]：逐字稿、會議文字記錄。\n  例句：Please read through the video *transcript* to master natural liaison and reduction in speech."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_Video.pdf", "link_text": "閱讀 Business Partner A2 影音腳本 PDF (請翻至第 3 頁)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "聽力與發音特訓 (BP WB 5.5)", "title": "展會心得聽力特訓與標點發音 (BP Workbook 5.5)", "key_takeaways": "【聽力檢測與標點符號發音】\n1. 聽力辨識時間差：Did Amy and Marta arrive on the same day?\n2. 標點符號的英文唸法：Dash [dæʃ] (破折號 —)、Hyphen [ˈhaɪfən] (連字號 -)、Underscore [ˌʌndɚˈskɔr] (底線 _)。", "main_content": "A: What did Amy think about the conference center?\n（Amy 覺得這個會議中心如何？）\nB: She liked the recycling presentation. It is very accessible.\n（她很喜歡資源回收的簡報，交通也很便利。）\nA: I need to send her the compliance report. What is her email address?\n（我需要把法規遵循報告寄給她，她的電子郵件地址是什麼？）\nB: It is amy hyphen smith underscore ehs at company dot com.\n（是 amy-smith_ehs@company.com。）", "vocab_notes": ["Hyphen [ˈhaɪfən] (n.) [多益高頻]：連字號（-，用於連接複合詞）。\n  例句：A *hyphen* is used in compound adjectives such as user-friendly."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/BP_A2_WB_5_05.mp3", "link_text": "聆聽 Business Partner Workbook 5.5 音檔 (MP3)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "BBC 職場入門 (BBC Intro)", "title": "職場求職與辦公室生存 (BBC English at Work Intro)", "key_takeaways": "【職場高頻單字與面試技巧】\n1. 公司背景：Tip Top Trading 是一家塑膠水果製造商 (Plastic fruit sector [ˈsɛktɚ])。\n2. 辦公室禁忌：嚴禁在走廊或茶水間刻意偷聽他人對話 (Eavesdrop [ˈivzˌdrɑp] vs. Overhear [ˌoʊvɚˈhɪr])。", "main_content": "A: Can you tell me about yourself?\n（你能簡單自我介紹一下嗎？）\nB: This job is an ideal match for my skills and experience. I get on with people easily.\n（這份工作與我的專業技能及經驗非常契合，我很容易與人相處融洽。）\nA: What does your company manufacture?\n（你們公司生產什麼產品？）\nB: We operate in the plastic fruit sector. Our company is prestigious and famous.\n（我們在塑膠水果領域經營，我們公司聲譽卓著且非常有名。）", "vocab_notes": ["Eavesdrop [ˈivzˌdrɑp] (v.) [職場高頻]：偷聽、竊聽（有意識地故意去聽）。\n  例句：It is unethical to *eavesdrop* on private management discussions."], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/english-at-work-intro", "link_text": "觀看 BBC English at Work: Intro"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "口語特訓 (Papa Teach Me)", "title": "告別生硬問候 (Stop Saying I am fine)", "key_takeaways": "【自學影音任務重點】\n學習超過 15 種回答 How are you 的在地自然替代說法，並掌握當對方氣色不佳時的關心問句 (Under the weather [ˈʌndɚ ðə ˈwɛðɚ])。", "main_content": "A: How are you doing today?\n（你今天過得如何？）\nB: Never better! Couldn't be better!\n（再好不過了！一切都棒極了！）\nA: Are you feeling alright? You look a bit under the weather.\n（你還好嗎？你看起來身體有點不太舒服。）\nB: I am feeling a bit exhausted due to the audit, but hanging in there.\n（因為稽核有點筋疲力盡，但我還撐得住。）", "vocab_notes": ["Under the weather [ˈʌndɚ ðə ˈwɛðɚ] (idiom) [日常高頻]：身體微恙、不太舒服。\n  例句：Our senior engineer is *under the weather* and taking sick leave today."], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "觀看 Papa Teach Me 教學影片 (YouTube)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation)", "title": "研討會住宿與地鐵動線 (AIChE Minneapolis)", "key_takeaways": "【多益高頻句型與差旅延伸】\n1. 飯店評估指標：Price [praɪs], Location [loʊˈkeɪʃən], Distance [ˈdɪstəns] to the venue.\n2. 描述步行與地鐵直達：The hotel is within walking distance [ˈwɔkɪŋ ˈdɪstəns].\n3. 明尼阿波利斯 Skyway 空中步道系統在防寒防雪上的實務通行優勢。", "main_content": "A: The hotel is near the subway station and within walking distance.\n（飯店靠近地鐵站，而且步行即可抵達。）\nB: From the hotel, can I take the subway directly to the conference venue?\n（從飯店出發，我可以搭地鐵直達會議會場嗎？）\nA: Yes, you can take the Blue Line directly. You do not need to transfer.\n（可以，你可以直接搭藍線，完全不需要轉車。）", "vocab_notes": ["Within walking distance [ˈwɔkɪŋ ˈdɪstəns] (phr.) [多益核心]：步行可達的距離。\n  例句：Our conference hotel is located *within walking distance* of the convention center.", "Transfer [trænsˈfɚ] (v./n.) [大眾交通]：轉乘、換車。\n  例句：Take the Blue Line directly; there is no need to *transfer* at all."], "practice_quiz": [{"question": "【第 1 題】告訴外國客戶飯店走路就能到會場，請填入核心片語：\nThe hotel is _________ _________ distance to the venue.", "answer": "✔ 填空解答：within walking\n👉 整句回答：The hotel is within walking distance to the venue.\n💡 解析：within walking distance 是商務訂房與交通指南中最常用的片語。"}], "instant_guide": {"core_concepts": ["1. 住宿地點優勢描述。", "2. 大眾運輸直達與免轉乘表達。"], "misconceptions": ["誤解：將轉車說成 change train（商務正式用語優先使用 transfer）。"], "exam_questions": ["Q1: 請用一句話說明飯店離地鐵站非常近，步行只要 5 分鐘。"]}, "socratic_quiz": {"level": "差旅規劃 (Level 1)", "prompt": "在預訂國際研討會飯店時，為什麼向主辦方確認 within walking distance 比離機場近更關鍵？", "feedback": "因為研討會每日行程緊湊且常有夜間社交，步行可達能省下大量等車時間。"}, "confusion_fixer": {"analogy": "出差選飯店就像選高鐵站旁邊的停車場，within walking distance 永遠比便宜但要轉車更具效益！", "real_example": "We selected the Hyatt because it is *within walking distance* to the AIChE venue.", "common_mistake": "錯誤：The hotel is in walking distance.（介系詞必須搭配 within）。"}, "gap_finder": ["⚠️ 潛在缺口：口語常常忘記使用 directly (副詞) 來修飾搭乘交通工具。"], "link": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf?v=1726683206", "link_text": "Minneapolis Skyway & Hotel Map (PDF)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "在地推薦 (Recommendations)", "title": "在地美食景點推薦與避開觀光陷阱", "key_takeaways": "【多益高頻句型與在地推薦】\n1. 推薦句型：I recommend ___ because ___ / I think ___ is worth seeing / visiting / eating.\n2. 必訪與難忘體驗：It is my all-time favorite / It is a must-see!\n3. 觀光陷阱與敲竹槓辨析：Tourist trap [ˈtʊrɪst træp] (專坑遊客的店) vs. Tourist attraction [əˈtrækʃən] (著名觀光景點)；Rip off (動詞) vs. Rip-off [ˈrɪp ˌɔf] (名詞敲竹槓)。", "main_content": "A: In Kaohsiung, what food do you recommend to enjoy our stay?\n（在高雄，你推薦吃什麼美食來好好享受旅程呢？）\nB: I think Hakka dishes and mutton fried rice are worth eating! They are accessible and delicious cuisine.\n（我覺得客家菜和羊肉炒飯很值得一吃！平價又美味。）\nA: What about the night market?\n（那夜市呢？）\nB: The night market is a famous tourist attraction, but beware of overpriced fruit stands. Paying NT$500 for cut guava is a complete rip-off and a tourist trap!\n（夜市是有名的觀光景點，但要小心價格灌水的水果攤。一小包切片芭樂要500元完全是敲竹槓，是專坑觀光客的陷阱！）", "vocab_notes": ["Tourist trap [ˈtʊrɪst træp] (n.) [生活高頻]：專坑遊客的店（反義詞：Tourist attraction 著名景點）。\n  例句：That seafood restaurant is a *tourist trap*; they rip off out-of-towners with inflated prices.", "Rip-off [ˈrɪp ˌɔf] (n.) [多益常考]：敲竹槓、暴利收費。\n  例句：Charging NT$500 for a small bag of cut guava is a complete *rip-off*."], "practice_quiz": [{"question": "【第 1 題】指控某家餐廳專門敲觀光客竹槓、收取暴利：\nThat restaurant is a _________ _________; charging NT$500 for fruit is a total _________-_________.", "answer": "✔ 填空解答：tourist trap, rip-off\n👉 整句回答：That restaurant is a tourist trap; charging NT$500 for fruit is a total rip-off."}], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "展會人脈 (Networking)", "title": "展會破冰與部門職掌交流 (Networking Role-Play)", "key_takeaways": "【課堂即興演練 6 階段黃金劇本】\n1. 自我介紹與部門 ➔ 2. 詢問對方部門 ➔ 3. 簡述己方職掌 ➔ 4. 帶出工作痛點 ➔ 5. 提供協助 ➔ 6. 交換名片約定後續聯絡。\n核心轉折金句：You just remind [rɪˈmaɪnd] me that we may need your help in... / Here is my business card should you want to call.", "main_content": "A: Hello, I am Ryan. I work as a Senior Specialist in Process Safety.\n（您好，我是 Ryan。我在製程安全部擔任資深專家。）\nB: Hi, I am Alex. It is a pleasure to meet you.\n（嗨，我是 Alex。很高興認識你。）\nA: Can you tell me about your department?\n（能跟我介紹一下你們部門嗎？）\nB: Sure! I work in Operations. We manage plant production lines.\n（當然！我在營運部工作，負責管理工廠產線。）\nA: Can I briefly tell you about what our department does?\n（我可以簡單說明一下我們部門的職掌嗎？）\nB: Of course! I am all ears. Fire away!\n（當然！我洗耳恭聽，請儘管說！）\nA: We conduct safety risk assessments and incident prevention audits.\n（我們負責執行安全風險評估及事故預防稽核。）\nB: You just remind me that we may need your help in identifying vapor leakage risks.\n（你正好提醒了我，我們在辨識蒸氣洩漏風險方面可能需要你們的協助。）\nA: Yeah, I think we might be able to help you.\n（沒問題，我想我們應該幫得上忙。）\nB: That would be great! It is so nice of you to offer help.\n（太好了！非常感謝你主動提供協助。）\nA: Here is my business card should you want to call.\n（這是我的名片，如果您後續想聯絡我的話。）\nB: Absolutely. I will be in touch soon.\n（一定，我很快會跟您聯繫。）", "vocab_notes": ["I am all ears [aɪm ɔl ɪrz] (idiom) [商務社交]：我洗耳恭聽、全神貫注。\n  例句：Tell me about your plant expansion plan; *I am all ears*.", "Fire away (idiom) [口語高頻]：請說吧、開始問吧。\n  例句：Do you have questions regarding the safety protocol? *Fire away*!"], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "BBC 職場自習 (BBC Networking)", "title": "商務社交實戰：Tip Top Trading (BBC #48)", "key_takeaways": "【詳細劇情與語言重點】\n1. 展會社交心態：在艱困經濟環境 (Tough economic climate [ˈklaɪmət]) 下，必須積極拓展人脈 (Networking / Schmooze [ʃmuz])。\n2. 行動口訣：Just be chatty and friendly / I will give it a shot / Let us get down to business。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Reflection Question: What social strategies did Anna use to initiate conversation under business pressure?\n   👉 Reference Answer: Anna maintained an upbeat attitude, used casual compliments, and seamlessly transitioned into discussing business cooperation.\n2. Vocabulary Focus: Schmooze [ʃmuz] (社交應酬), Down to business (切入正題), Climate [ˈklaɪmət] (當前經濟形勢).\n3. Practical Task: Draft a 3-sentence networking opening for an industry seminar.", "main_content": "A: I heard you were in town! Let us do some networking and schmoozing with new clients.\n（聽說你來城裡了！我們一起去跟新客戶拓展人脈應酬一下吧。）\nB: Smashing! I will give it a shot. Let us get down to business.\n（太棒了！我來試試看，我們切入正題吧。）\nA: It is a tough economic climate. By my calculations, you need to be rid of one member of staff.\n（目前的經濟大環境很嚴峻。依我的計算，你必須精簡一名員工。）\nB: Crumbs! Bad news will not go down well with the team.\n（糟糕！這壞消息在團隊裡肯定不會受到歡迎。）", "vocab_notes": ["Schmooze [ʃmuz] (v.) [商務口語]：社交應酬、拉攏關係。\n  例句：Industry gala dinners are the perfect venue to *schmooze* with key accounts."], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/48-language-for-networking", "link_text": "前往 BBC #48 課程網頁 (收聽音檔與劇本)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "科技與隱私自習 (Tech & Privacy)", "title": "Passkey 通行密鑰原理 (BBC News 02:35)", "key_takeaways": "【影片詳細摘要與科技字彙】\nBBC News 探討 Passkey（通行密鑰）技術如何透過生物辨識 (Biometrics [ˌbaɪoʊˈmɛtrɪks]) 與非對稱加密 (Encryption [ɪnˈkrɪpʃən]) 取代傳統密碼，防禦釣魚攻擊與詐騙 (Fraud [frɔd])。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Tech Concept Review: How does a Passkey eliminate vulnerability compared to traditional passwords?\n   👉 Reference Answer: Passkeys replace shared secrets with on-device cryptographic key pairs, making user credentials immune to online phishing and database leaks.\n2. Key Tech Terms: Biometrics [ˌbaɪoʊˈmɛtrɪks] (生物辨識), Asymmetric encryption (非對稱加密), Phishing defense (防釣魚攻擊).\n3. Practical Task: Write down 2 reasons why your enterprise should adopt biometric authentication.", "main_content": "A: Passkeys replace traditional passwords with fast biometric authentication.\n（Passkey 以快速的生物辨識技術取代傳統密碼。）\nB: They rely on public-key encryption to identify users and prevent fraud.\n（它們依賴公鑰加密機制來驗證使用者身分並防範詐騙。）\nA: You do not need to remember complex character strings anymore.\n（你再也不需要死記複雜的字元密碼串了。）\nB: It represents an inevitable evolution toward passwordless online security.\n（這代表了邁向無密碼網路安全時代的必然演進。）", "vocab_notes": ["Biometrics [ˌbaɪoʊˈmɛtrɪks] (n.) [科技資安]：生物辨識技術（指紋、人臉辨識）。\n  例句：Modern smartphones use *biometrics* to identify authorized users securely."], "link": "https://www.youtube.com/watch?v=lf5L_1oqHDs", "link_text": "開啟 BBC Passkey 影片 (YouTube)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "CNN 科技隱私 (CNN Shorts)", "title": "智慧眼鏡防偷拍奇招 (CNN Shorts 02:15)", "key_takeaways": "【短片情境與法律字彙】\nCNN 探討 Meta 等智慧眼鏡引發的未經授權錄影隱憂，以及透過播放受版權保護的知名音樂觸發演算法判定侵權 (Copyright infringement [ɪnˈfrɪndʒmənt]) 而自動下架影片的反制策略。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Legal & Practical Analysis: What defensive tactic is discussed to discourage non-consensual filming?\n   👉 Reference Answer: Playing copyrighted audio triggers social media platform upload filters, effectively preventing unauthorized video clips from being published.\n2. Legal Vocabulary: Informed consent [kənˈsɛnt] (知情同意), Algorithmic filter (演算法過濾器), Surveillance infringement (監控侵權).\n3. Practical Task: Formulate a 2-sentence plant security rule regarding smart glasses in confidential manufacturing areas.", "main_content": "A: What should you do if someone uses smart glasses to harass or film you without consent?\n（如果有人用智慧眼鏡騷擾或未經同意偷拍你，你該怎麼辦？）\nB: Play a Disney song on your phone! The copyright infringement algorithm will block the video from being uploaded.\n（在手機上播放迪士尼的歌曲！演算法會判定侵犯版權，進而阻止影片被上傳發布。）", "vocab_notes": ["Consent [kənˈsɛnt] (n./v.) [多益高頻]：同意、許可。\n  例句：You must obtain informed *consent* before filming individuals on industrial premises."], "link": "https://youtube.com/shorts/H7qyXwntx08?si=zc6OtSPaJOuWMik9", "link_text": "觀看 CNN Smart Glasses 短片 (YouTube)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "商務社交技巧 (Business Tips)", "title": "如何打破商務聚會冷場 (Breaking the Ice in Meetings)", "key_takeaways": "【商務交流技巧精讀】\n1. 善用開放式問句建立共通話題。\n2. 傾聽並適時展現專業共鳴，轉化為後續合作契機。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Communication Strategy: What makes open-ended questions effective in professional networking?\n   👉 Reference Answer: Open-ended questions encourage the other party to share personal observations, which naturally reveals shared business interests.\n2. Key Terms: Rapport building [ræˈpɔr] (建立融洽關係), Common ground (共同點), Active listening (積極傾聽).\n3. Practical Task: Prepare two natural opening questions for an international chemical engineering conference.", "main_content": "A: Breaking the ice at corporate mixers can be challenging.\n（在企業交流酒會上破冰有時候極具挑戰性。）\nB: Just ask open-ended questions about their travel or previous conference sessions to find common ground.\n（只要針對他們的差旅交通或先前的會議議程提出開放式問句，就能輕鬆找到共通話題。）", "vocab_notes": ["Rapport [ræˈpɔr] (n.) [高階社交]：融洽關係、親善。\n  例句：Establishing *rapport* with stakeholders is essential for project alignment."], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "觀看 Business Icebreaking 影片 (YouTube)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "差旅文化比較 (Travel Culture)", "title": "跨國出差文化禮儀與溝通 (International Business Etiquette)", "key_takeaways": "【跨文化溝通重點】\n了解不同文化在商業會議、時間觀念 (Punctuality [ˌpʌŋktʃuˈæləti]) 與名片交換上的禮儀細節。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Cultural Analysis: What are the main differences in punctuality and card exchange between Asian and Western business cultures?\n   👉 Reference Answer: Western business interactions emphasize concise introductions and immediate focus on agenda items, whereas Asian cultures place greater ritual value on card exchange.\n2. Cultural Terms: Business protocol [ˈproʊtəkɑl] (商務禮節), Time orientation (時間觀念), Professional decorum (專業端莊儀態).\n3. Practical Task: Draft three cross-cultural guidelines for welcoming foreign engineering auditors.", "main_content": "A: Does business card exchange follow strict protocol in Western firms?\n（在西方企業中，交換名片是否需要遵循嚴格的禮節規矩？）\nB: It is generally more informal than in Asia, but presenting your card clearly is always appreciated.\n（通常比亞洲更隨性，但端正清晰地遞上名片永遠是受歡迎的專業表現。）", "vocab_notes": ["Punctuality [ˌpʌŋktʃuˈæləti] (n.) [商務素養]：準時、守時。\n  例句：*Punctuality* is considered a fundamental sign of respect in professional environments."], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "觀看 Business Etiquette 影片 (YouTube)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "工作日常 (Work Routine)", "title": "日常工作職責與跨部門協調 (What Do You Do? - BP Unit 1)", "key_takeaways": "【多益高頻句型與職場延伸】\n1. 描述工作職責：I am responsible [rɪˈspɑnsəbəl] for a team of 5 people / I am in charge of plant safety。\n2. 跨部門協調與專案追蹤：Resolve inter-departmental conflicts [ˈkɑnflɪkts] (解決跨部門衝突) / Track project milestones [ˈmaɪlˌstoʊnz] (追蹤專案里程碑)。\n3. 通勤型態英美辨析：\n   - 英式用語：cycle to and from work。\n   - 美式用語：bike to and from work / commute by bicycle。\n4. 頻率副詞與易混淆字：Sometimes (有時) vs. Sometime (某個時候) vs. Some time (一段時間)。", "main_content": "A: What do you do for a living?\n（您的本行是做什麼工作的？）\nB: I serve as Chief Executive Officer. I am responsible for resolving inter-departmental conflicts and tracking project milestones.\n（我擔任執行長，負責化解跨部門衝突並追蹤專案重大里程碑。）\nA: How often do you commute or WFH?\n（你多久通勤一次或居家辦公？）\nB: I sometimes cycle to and from the plant, but I usually WFH on Fridays to collect operational data and do the math for our budget.\n（我有時騎自行車上下班通勤往返廠區，但週五通常在家工作以整理營運數據並精算專案預算。）", "vocab_notes": ["Cycle to and from [ˈsaɪkəl tu ænd frʌm] (v. phr.) [英式用法]：騎自行車上下班通勤（美式常說 bike to and from 或 commute by bicycle）。\n  例句：In Cambridge, thousands of professionals *cycle to and from* work every day.", "Resolve inter-departmental conflicts [rɪˈzɑlv ˈkɑnflɪkts] (phr.) [高階管理]：解決跨部門衝突。\n  例句：A principal engineer must skillfully *resolve inter-departmental conflicts* between safety and production."], "practice_quiz": [{"question": "【第 1 題】英式英語常說 cycle to and from work，美式口語則常用哪個動詞來表達騎車通勤？\nI usually _________ to and from the office every sunny morning.", "answer": "✔ 填空解答：bike\n👉 整句回答：I usually bike to and from the office every sunny morning."}, {"question": "【第 2 題】She needs to _________ a room for ten people for the meeting. (預訂會議室)", "answer": "✔ 填空解答：book\n👉 整句：She needs to book a room for ten people for the meeting."}, {"question": "【第 3 題】Money isn’t a problem. The _________ says we have $10,000 for the project. (專案預算)", "answer": "✔ 填空解答：budget\n👉 整句：Money isn’t a problem. The budget says we have $10,000 for the project."}, {"question": "【第 4 題】The _________ says the meeting starts at 10 a.m., and we have five points to discuss. (會議議程)", "answer": "✔ 填空解答：agenda\n👉 整句：The agenda says the meeting starts at 10 a.m., and we have five points to discuss."}, {"question": "【第 5 題】The work isn’t difficult. The _________ gives instructions about the job. (任務簡報說明)", "answer": "✔ 填空解答：brief\n👉 整句：The work isn’t difficult. The brief gives instructions about the job."}], "link": "", "link_text": ""}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "會議議程 (Meeting Agendas)", "title": "會議型態比較與議程掌握 (Online Meetings & Hidden Agendas)", "key_takeaways": "【多益高頻句型與會議深度分析】\n1. 會議型態優缺點比較：Online meeting vs. Face-to-face meeting 的 Pros [proʊz] (優點) and Cons [kɑnz] (缺點)。\n2. 專注力管理：容易分心 (Get distracted easily) vs. 容易集中精神 (Concentrated easily)。\n3. 會議議程名詞：Brief [brif] (專案簡報摘要), Hidden agenda [ˈhɪdən əˈdʒɛndə] (不可告人的隱藏意圖), Push one's agenda (強行推動個人議程), Sign on the dotted line (正式在虛線上簽字履約)。", "main_content": "A: What are the pros and cons of an online meeting?\n（線上會議的優缺點有哪些？）\nB: In virtual sessions, participants get distracted easily. In-person meetings consume more travel time, but people are concentrated easily.\n（在線上視訊會議中，與會者很容易分心；實體面對面會議雖然耗費較多交通時間，但大家更容易集中注意力。）\nA: Does the vendor agree with our safety brief?\n（供應商同意我們的安全簡報規範了嗎？）\nB: Yes, but watch out for any hidden agenda. Make sure their authorized representative signs on the dotted line before work commences.\n（同意，但仍需提防任何隱藏意圖。在工程動工前，務必確保對方的授權代表在合約虛線上正式簽字。）", "vocab_notes": ["Pros and cons [proʊz ænd kɑnz] (n. phr.) [多益必備]：優缺點、利弊得失。\n  例句：We must carefully weigh the *pros and cons* before selecting a DCS vendor.", "Hidden agenda [ˈhɪdən əˈdʒɛndə] (n.) [商務高階]：隱藏的意圖、不可告人的動機。\n  例句：The contractor has a *hidden agenda* to request budget variations later in the project."], "link": "", "link_text": ""}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "官方影音自習 1 (BP Video 1.1.1)", "title": "工作職責與出差頻率 (Business Partner A2 1.1.1)", "key_takeaways": "【官方指定影音學習任務】\n1. 影片任務：觀看 Video 1.1.1，比較 Liz、Ellen 與 Muj 的上下班時間與國際出差頻率。\n2. 掌握工作動詞搭配：Process orders [ˈprɑsɛs ˈɔrdɚz], Take notes, Conduct data analysis [ˈdætə əˈnæləsɪs]。", "main_content": "A: Who starts work at 7:30 in Video 1.1.1?\n（在 Video 1.1.1 中是誰早上 7 點半就開始上班？）\nB: Liz does. She works with the sales team and often processes orders.\n（是 Liz。她與業務團隊共事，經常負責處理客戶訂單。）\nA: Who travels to other countries for work and finishes at 5:30?\n（是誰經常出國出差而且下午 5 點半下班？）\nB: Muj does. He also analyzes data and prepares executive presentations.\n（是 Muj。他也負責分析數據並準備高階主管簡報。）", "vocab_notes": ["Process orders [ˈprɑsɛs ˈɔrdɚz] (v. phr.) [多益核心]：處理客戶訂單。\n  例句：Our logistics team *processes orders* rapidly to ensure zero delivery delay."], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "觀看 Business Partner Video 1.1.1 (YouTube)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "官方腳本研讀 (BP Script 1.1.1)", "title": "Business Partner A2 影音腳本對照 (Page 1)", "key_takeaways": "【官方文件閱讀任務】\n請參閱 Business Partner A2 影音腳本 PDF 第 1 頁，仔細閱讀 Video 1.1.1 三位發言者的完整職責敘述。", "main_content": "閱讀重點指引:\n請開啟下方 PDF 文件第 1 頁，掌握動詞第三人稱單數加 s/es 的規則變化。", "vocab_notes": ["Sign [saɪn] (v./n.) [商務必備]：簽署；標誌。\n  例句：Please *sign* the safety entry permit before entering the processing unit."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_Video.pdf", "link_text": "閱讀 Business Partner A2 影音腳本 PDF (請見第 1 頁)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "線上會議除錯 (Usherwood)", "title": "視訊會議 6 大常見問題與排解 (Usherwood)", "key_takeaways": "【商務科技文章精讀】\n跨國視訊會議最常見的 6 大連線與影音障礙及專業英文排除術語：Static [ˈstætɪk], Echo [ˈɛkoʊ], Mute [mjut], Breaking up, Frozen screen [ˈfroʊzən skrin]。", "main_content": "A: Alex, can you hear me? Your audio is breaking up and there is heavy static on the line.\n（Alex，你聽得見我嗎？你的聲音斷斷續續，通話線路裡有很重的靜電雜音。）\nB: Sorry, my connection is unstable. Am I on mute?\n（抱歉，我的網路連線不太穩。我剛才被靜音了嗎？）\nA: No, we can hear you now, but your camera feed is completely frozen and grainy. We got cut off earlier.\n（沒有，我們現在聽得見你，但你的視訊畫面完全死當凍結且畫質很粗糙。我們剛才通話徹底斷線了。）\nB: Let me restart my router to troubleshoot the bandwidth issue.\n（我來重開路由器，排解一下網路頻寬問題。）", "vocab_notes": ["Static [ˈstætɪk] (n.) [會議通訊]：雜音、靜電干擾聲。\n  例句：There is noticeable *static* on the conference phone; let us switch to Microsoft Teams."], "link": "https://www.usherwood.com/blog/6-common-issues-with-video-conferencing-and-how-to-solve-them", "link_text": "閱讀 Usherwood 視訊會議疑難排解文章"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "官方影音自習 2 (BP Video 4.4.1)", "title": "視訊會議真實狀況聽力檢測 (Business Partner A2 4.4.1)", "key_takeaways": "【官方影音任務：問題辨識】\n觀看 Video 4.4.1，識別三段不同遠端會議情境中的技術困難與總結要點 (Recap [ˈrikæp])。", "main_content": "A: Welcome everyone. Please dial your participant code followed by the pound key.\n（歡迎各位。請輸入您的參會代碼，並在最後按下井字鍵。）\nB: I think someone is on mute. Can you hear us?\n（我覺得有人好像被靜音了。你們聽得到我們的聲音嗎？）\nA: Yes, sorry! Let us do a quick recap of the three problems observed in Conversation 1, 2, and 3.\n（聽得到，抱歉！讓我們快速總結歸納一下在對話 1、2、3 中觀察到的三個問題。）", "vocab_notes": ["Pound key [paʊnd ki] (n.) [美式通訊]：井字鍵（#）。\n  例句：Enter your conference meeting ID followed by the *pound key*."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U4L4_4.4.1.mp4", "link_text": "觀看 Business Partner Video 4.4.1 影片 (MP4)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "實境喜劇 1 (Tripp & Tyler)", "title": "電話會議實境爆笑諷刺劇 (A Conference Call in Real Life)", "key_takeaways": "【YouTube 實境文化學習】\n透過 Tripp & Tyler 破千萬觀看的經典搞笑諷刺短片，體會電話會議中令人抓狂的荒唐實況。", "main_content": "短片經典爆笑對白片段:\n- Hi guys, sorry I am late, I had trouble with the access code.\n（嗨大家，抱歉我遲到了，我剛才輸入存取密碼卡關。）\n- Who just joined?\n（剛才進來的是誰？）\n- John, you are not muted, we can hear your dog barking!\n（約翰，你沒有靜音，我們都聽到你家的狗在狂吠了！）\n- Stop trolling the conference call and get back to work!\n（別在電話會議裡鬧了，趕緊回到正題工作吧！）", "vocab_notes": ["Troll [troʊl] (n./v.) [網路職場]：惡作劇者、網路酸民、故意搗亂者。\n  例句：Ignore anonymous *trolls* who try to derail constructive project discussions."], "link": "https://www.youtube.com/watch?v=DYu_bGbZiiQ", "link_text": "觀看 A Conference Call in Real Life (YouTube)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "實境喜劇 2 (Tripp & Tyler)", "title": "視訊會議實境爆笑短片 (A Video Conference Call in Real Life)", "key_takeaways": "【YouTube 實境文化學習】\n短片真實呈現視訊會議中的各種尷尬與技術故障：輸出設定錯誤 (Output settings)、音訊回音干擾 (Echo)、軟體強迫更新導致遲到、畫面死當凍結 (Frozen)、背景家人與突發打擾等日常痛點。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: The video humorously depicts everyday frustrations of corporate video calls, including audio output glitches, microphone echo, and mandatory software updates.\n   👉 Sentence 2: Presenters suddenly freeze during critical updates and uninvited family interruptions derail the business agenda.\n   👉 Sentence 3: The sketch highlights how easily remote technical friction can turn high-stakes workplace meetings into chaotic distractions.\n2. New Words Learned:\n   👉 Reference Answer: Output settings (音訊輸出設定), Cut out (聲音斷續中斷), Freeze / Frozen (畫面凍結死當), Echo (麥克風回音), Reschedule (重新排程).\n3. Assignment Submission:\n   👉 Reference Answer: Write three professional troubleshooting phrases: (1) 'Excuse me Tyler, your audio is cutting out; could you check your connection?' (2) 'It appears the presentation screen is frozen; let me re-share the deck.' (3) 'Due to bandwidth issues, let us reschedule this session for tomorrow morning.'", "main_content": "視訊短片核心經典問句與對白:\n- Paul, can you hear me? I can't hear you! Try adjusting your output settings.\n（Paul，你聽得見我嗎？我聽不見你！試著調整一下你的聲音輸出設定。）\n- Sorry I'm late, I had to download a new version of the platform.\n（抱歉我遲到了，我剛才被迫下載更新會議軟體的新版本。）\n- Tyler, you are cutting out and your screen is completely frozen!\n（Tyler，你的聲音斷斷續續，而且你的螢幕畫面完全凍結死當了！）\n- Daddy is in a meeting right now! Let's just reschedule and do a regular conference call.\n（爸爸現在正在開會！我們乾脆重新排程，改開一般的電話會議算了。）", "vocab_notes": ["Output settings [ˈaʊtˌpʊt ˈsɛtɪŋz] (n. phr.) [IT視訊]：輸出設定（音訊或影像裝置設定）。\n  例句：Please adjust your *output settings* to select the proper USB headset.", "Cutting out (v. phr.) [會議通訊]：聲音斷斷續續、訊號斷斷續續。\n  例句：Your voice is *cutting out*; please turn off video to save bandwidth.", "Freeze / Frozen [friz] (v./adj.) [視訊必備]：畫面卡住死當。\n  例句：Am I *frozen* or can everyone still hear my voice?", "Reschedule [riˈskɛdʒʊl] (v.) [多益核心]：重新安排、延期再議。\n  例句：Due to server connection failures, let us *reschedule* the alignment meeting for Thursday."], "link": "https://www.youtube.com/watch?v=JMOOG7rWTPg", "link_text": "觀看 A Video Conference Call in Real Life (YouTube 官方影片)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "商業策略自學 (CNBC Make It)", "title": "好市多汽油定價商業策略 (Why Costco Gas is So Cheap - CNBC 03:28)", "key_takeaways": "【CNBC 商業專題自學摘要】\n深入解析好市多 (Costco) 為什麼能長年維持低油價的商業策略：以微薄利潤率 (Margins / Profit margins) 甚至虧損銷售汽油作為帶路貨 (Loss leader)，在宏觀不確定性 (Macro uncertainty) 下維持競爭優勢 (Competitive advantage / edge)，藉此吸引龐大會員客流 (Foot traffic) 進入賣場購買高毛利商品，並帶動高續約率的會員費 (Dues / Fees) 護城河。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: CNBC examines how Costco strategically prices its retail gasoline significantly lower at the pump to provide an undeniable competitive edge to its dues-paying members.\n   👉 Sentence 2: Amid macro uncertainty and volatile energy markets, the warehouse retailer treats fuel as a stand-alone loss leader to fuel record store foot traffic.\n   👉 Sentence 3: By accepting razor-thin profit margins on gas, Costco accelerates double-digit growth in quality goods sales and secures record-level membership renewals in its fiscal third quarter.\n2. New Words Learned:\n   👉 Reference Answer: At the pump (在加油站零售點), Fuel the record (刷新紀錄), Profit margins (利潤率), Volatile (易波動的), Stand-alone (獨立運作的), Competitive advantage/edge (競爭優勢), Dues / Fees (會員年費), Outstanding bills (未結帳單), Macro uncertainty (總體經濟不確定性), Double-digit growth (雙位數成長).\n3. Assignment Submission:\n   👉 Reference Answer: Explain in three sentences how a traditional retailer differs from a bulk wholesaler in handling volatile commodity prices and maintaining competitive edge.", "main_content": "A: Why is Costco gas consistently cheaper than neighboring stations at the pump?\n（為什麼好市多的汽油在加油站零售點總是比鄰近加油站便宜？）\nB: Costco treats fuel as a stand-alone loss leader. In an era of volatile oil markets and macro uncertainty, cheap gas gives them a distinct competitive edge.\n（好市多把汽油當作獨立的帶路貨促銷品。在油價劇烈波動與總體經濟不確定性升高的時代，便宜的油價賦予了他們極具特色的競爭優勢。）\nA: Does this strategy sacrifice their profit margins?\n（這種定價策略難道不會犧牲他們的毛利率嗎？）\nB: Although gas margins are razor-thin, membership dues and double-digit growth in quality goods sales fuel record financial performance toward the end of their fiscal third quarter.\n（雖然汽油毛利薄如刀鋒，但會員年費收入以及優質產品雙位數的高成長，推升了他們在會計第三季末繳出歷史新高的亮眼財務成績。）", "vocab_notes": ["At the pump (phr.) [能源商業]：在加油站（指零售端油價，如 prices at the pump）。\n  例句：Consumers are thrilled to see lower gasoline prices *at the pump* this month.", "Fuel the record (phr.) [財經商務]：推升紀錄、刷新歷史新高。\n  例句：Surging electric vehicle demand helped *fuel the record* revenue in the fourth quarter.", "Profit margins [ˈprɑfɪt ˈmɑrdʒənz] (n.) [多益核心]：利潤率（make/generate profit 為創造獲利）。\n  例句：Wholesale operators deliberately operate on tight *profit margins* to maximize volume.", "Retailer vs. Wholesaler [易混淆字]：Retailer [ˈriˌteɪlɚ] (n.) 零售商 ↔ Wholesaler [ˈhoʊlˌseɪlɚ] (n.) 批發商。\n  例句：Costco operates as a membership *wholesaler* rather than a conventional grocery *retailer*.", "Volatile [ˈvɑlətəl] (adj.) [財經核心]：劇烈波動的、易變不穩定的。\n  例句：Global chemical supply chains are vulnerable to *volatile* crude oil markets.", "Competitive advantage / edge (n.) [企管必備]：競爭優勢。\n  例句：Continuous proprietary R&D gives our specialty polymers a decisive *competitive edge*.", "Dues / Fees (n.) [商業管理]：費用、應繳會費/會員費（membership dues）。\n  例句：Annual membership *dues* provide Costco with predictable recurring cash flow.", "Outstanding bills (n.) [會計財務]：未結清/逾期的帳單。\n  例句：The accounting division followed up strictly on *outstanding bills* before the fiscal year-end.", "Fiscal [ˈfɪskəl] (adj.) [財政會計]：財政的、會計年度的（如 fiscal year / fiscal quarter）。\n  例句：The group hit record revenue levels toward the end of its *fiscal* third quarter.", "Macro uncertainty (n.) [經濟學]：總體經濟不確定性。\n  例句：Businesses are tightening operational expenditures to withstand ongoing *macro uncertainty*.", "Quality goods & services (n.)：優質產品與服務（注意 goods 必為複數名詞）。\n  例句：Customer loyalty stems from consistently delivering *quality goods & services*.", "Double-digit growth (n.) [業績報告]：雙位數（10%以上）高成長。\n  例句：Our specialty chemical line achieved *double-digit growth* in the Asian market.", "Poll [poʊl] (n./v.) [商務分析]：民意調查；對……進行民調。\n  例句：A recent customer satisfaction *poll* ranked the company highest in safety reliability."], "link": "https://www.youtube.com/watch?v=vvBYMNXgfVo", "link_text": "觀看 CNBC: Why Costco Gas is So Cheap (YouTube)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "身心健康自學 (BBC Global)", "title": "哼唱的心理與生理效益 (The Psychological Benefits of Humming - BBC 02:17)", "key_takeaways": "【BBC 科普影音自學摘要】\nBBC Global 探討「哼唱 (Humming [ˈhʌmɪŋ])」在神經生物學上的生理與心理效益：閉口震動能有效刺激迷走神經 (Vagus nerve [ˈveɪɡəs nɜrv])，啟動副交感神經系統 (Parasympathetic system [ˌpærəsɪmpəˈθɛtɪk])，抑制戰或逃反應 (Fight or flight)，在短短 2 分鐘內顯著降低心率與皮質醇壓力指數，提升身心健康 (Well-being [ˌwɛlˈbiɪŋ])。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: Scientific research highlighted by BBC demonstrates that vocal humming produces soothing acoustic vibrations that deeply resonate with internal bodily tissues.\n   👉 Sentence 2: These rhythmic vibrations directly stimulate the vagus nerve and activate the parasympathetic nervous system, effectively shutting down the acute fight or flight stress response.\n   👉 Sentence 3: Similar to ancient practices of chanting mantras, intentional humming contracts specific facial muscles and allows executives to regain composure before high-stakes meetings.\n2. New Words Learned:\n   👉 Reference Answer: Resonate with (與……產生共鳴), Soothing music (舒緩音樂), Vagus nerve (迷走神經), Parasympathetic nervous system (副交感神經系統), Fight or flight (戰或逃反應), Contracts (收縮肌肉/血管), Chanting mantras (念咒/誦經).\n3. Assignment Submission:\n   👉 Reference Answer: Describe how stimulating the parasympathetic system counteracts the fight or flight reaction during emergency industrial crisis management.", "main_content": "A: Did you know that simple vocal humming can quiet down your body's fight or flight response?\n（你知道單純的閉口哼唱就能平息身體內部的戰或逃緊繃反應嗎？）\nB: Yes, acoustic vibrations deeply resonate with our chest cavity and activate the parasympathetic nervous system via the vagus nerve.\n（沒錯，聲波震動會與胸腔深層產生共振，並透過迷走神經啟動副交感神經系統。）\nA: Is that why listening to soothing music or chanting mantras feels so calming?\n（這就是為什麼聽舒緩的音樂或誦念真言會讓人感到如此平靜放鬆嗎？）\nB: Exactly! It contracts smooth muscles beneficially, lowers blood pressure, and restores psychological well-being in minutes.\n（完全正確！它能良性收縮平滑肌，降低血壓，並在數分鐘內恢復心理健康與安定。）", "vocab_notes": ["Resonate with [ˈrɛzəˌneɪt wɪð] (v. phr.) [生理/社交]：與……產生共振/引起強烈共鳴。\n  例句：His keynote address on workplace safety *resonated with* plant managers across the region.", "Soothing music [ˈsuðɪŋ ˈmjuzɪk] (n.) [身心放鬆]：舒緩撫慰人心的音樂。\n  例句：Playing *soothing music* in breakout rooms helps team members decompress between audit sessions.", "Vagus nerve [ˈveɪɡəs nɜrv] (n. phr.) [生理醫學]：迷走神經（掌控副交感神經核心）。\n  例句：Deep diaphragmatic breathing stimulates the *vagus nerve* to reduce cardiac stress.", "Parasympathetic [ˌpærəsɪmpəˈθɛtɪk] (n./adj.) [醫學核心]：副交感神經系統（負責休息與放鬆）。\n  例句：Humming shifts the autonomic system into the *parasympathetic* state, lowering cortisol.", "Fight or flight (n./adj.) [心理生理]：戰或逃應激反應。\n  例句：Chronic workplace anxiety keeps the nervous system trapped in *fight or flight* mode.", "Contracts [kənˈtrækts] (v.) [生理動作]：（肌肉、血管）收縮。\n  例句：When exposed to intense cold, peripheral blood vessels *contract* to conserve core heat.", "Chanting mantras [ˈtʃæntɪŋ ˈmæntrəz] (phr.) [冥想放鬆]：誦經、念咒調息。\n  例句：*Chanting mantras* and steady vocalizations have been proven to enhance meditative mindfulness."], "link": "https://www.youtube.com/watch?v=LCW5Ftg0_uI", "link_text": "觀看 BBC Global: Benefits of Humming (YouTube)"}, {"week": "week4", "class_date": "2026/09/09", "type": "sentence", "category": "對話掌控與諮詢 (Managing Conversations)", "title": "會前諮詢與客戶風格應對 (Advice Before Meeting a Client)", "key_takeaways": "【多益與職場核心商務表達】\n1. 職場諮詢與借鏡他人經驗：\n   - Pick someone's brain: 向某人請教、諮詢專業意見。\n   - Piggyback [ˈpɪɡiˌbæk] on someone's idea / Echo someone's idea: 順帶利用、附和呼應某人的想法。\n2. 差旅與代墊款項核銷：\n   - Reimburse my expenses [ˌriɪmˈbɜrs maɪ ɪkˈspɛnsɪz] (v. phr.) / Reimbursement (n.): 核銷/報銷我的費用。\n   - Daily allowance / Per diem [pɚ ˈdiəm] (n.): 出差日支費、每日津貼。\n   - Cab fare [kæb fɛr] (n.): 計程車費。\n3. 文法核心辨析：Used to + V (過去習慣) vs. Be used to + V-ing / N (現在習慣於)。\n4. 領導與人格特質辨析：\n   - Domineering [ˌdɑmɪˈnɪrɪŋ] (adj.) / Dominant [ˈdɑmɪnənt] (adj.) / Dominate (v.): 跋扈強勢的 / 主導支配的 / 支配掌控。\n   - Obey [oʊˈbeɪ] (v.) ➔ Obedient [oʊˈbidiənt] (adj.) / Submissive [səbˈmɪsɪv] (adj.): 服從 ➔ 聽話順從的 / 屈從百依百順的。\n   - Chatty [ˈtʃæti] (adj.) [健談愛聊天的] vs. Agreeable [əˈɡriəbəl] (adj.) [隨和好相處的]。\n   - Reinstate [ˌriɪnˈsteɪt] / Resume (v.): 恢復、重啟（注意 resume 讀 /rɪˈzuːm/ 為動詞恢復；讀 /ˈrez.ə.meɪ/ 為名詞履歷表）。", "main_content": "A: Have you asked a senior sales rep for advice before meeting Mateo in Rio de Janeiro?\n（在去里約熱內盧拜訪 Mateo 之前，你有先請教資深業務代表的建議嗎？）\nB: Yes, I wanted to pick Alex's brain and echo his strategic ideas. The company will reimburse my expenses, per diem, and cab fare.\n（有的，我想向 Alex 請教並借鏡他的策略想法。公司會全額核銷我的差旅開銷、出差日支費和計程車資。）\nA: Did Alex give you helpful advice? How should we handle Mateo?\n（Alex 給的建議管用嗎？我們該怎麼跟 Mateo 打交道？）\nB: Alex warned that Mateo can be very domineering and loves to dominate meetings. He's not very submissive or agreeable, but he is quite chatty!\n（Alex 警告說 Mateo 的作風非常盛氣凌人，喜歡主導會議。他不是很順從好說話的人，但人非常健談愛聊！）\nA: Keep that in mind and just give it a go! Don't worry, you are off the hook if things get volatile.\n（把這點牢記在心，放手去試試吧！別擔心，萬一情況生變，也不會把責任怪到你頭上的。）", "vocab_notes": ["Pick someone's brain (idiom) [商務社交]：向某人請教、諮詢專業意見。\n  例句：Can I *pick your brain* for ten minutes regarding the environmental compliance permit?", "Piggyback on / Echo someone's idea (phr.) [商務核心]：順著發揮 / 贊同呼應某人觀點。\n  例句：I would like to *echo John's idea* and *piggyback on* his safety proposal for the turnaround.", "Reimburse my expenses [ˌriɪmˈbɜrs] (v. phr.) [出差財務]：核銷報銷差旅代墊款（reimbursement 為名詞）。\n  例句：Please submit all flight stubs so finance can *reimburse your expenses* and cab fare.", "Daily allowance / Per diem [pɚ ˈdiəm] (n.) [差旅必備]：每日差旅津貼、日支費。\n  例句：Engineers dispatched on international plant turnarounds receive a fixed *per diem*.", "Sales rep. = sales representative / associate (n.) [商務職位]：業務代表、業務專員。\n  例句：Our regional *sales rep* closed a multi-million-dollar supply contract in Southeast Asia.", "Between jobs (phr.) [職場過渡]：換工作過渡期、待業中。\n  例句：After leaving the tech firm, David was *between jobs* for two months before joining our EHS team.", "Reinstate / Resume (v.) [商務用法]：恢復、重啟。\n  - Resume /rɪˈzuːm/ (v.)：重新開始、恢復運作；Resume /ˈrez.ə.meɪ/ (n.)：履歷表。\n  例句：The two petrochemical firms agreed to *resume* joint pipeline operations following the audit.", "Ceasefire [ˈsisˌfaɪr] (n.) [國際情勢]：停火協議（常搭配 port blockade 港口封鎖）。\n  例句：A verified *ceasefire* allowed maritime chemical tankers to bypass the hostile *port blockade*.", "Domineering vs. Submissive [性格對比]：\n  - Domineering [ˌdɑmɪˈnɪrɪŋ] (adj.)：盛氣凌人、專橫跋扈的（名詞/動詞：domination / dominate）。\n  - Submissive [səbˈmɪsɪv] / Obedient [oʊˈbidiənt] (adj.)：順從聽話的（源自 obey 服從）。\n  例句：An overly *domineering* superintendent may silence *obedient* front-line operators.", "Chatty vs. Agreeable [特質描繪]：\n  - Chatty (adj.)：愛聊天的、健談的。\n  - Agreeable [əˈɡriəbəl] (adj.)：隨和好相處的、令人愉悅的。\n  例句：Although the client was exceptionally *chatty*, he remained tough and rarely *agreeable* on pricing.", "You're off the hook (idiom) [口語高頻]：饒過你、讓你脫身/免除責任。\n  例句：Since the vendor delivered the valves early, our logistics coordinator is *off the hook*.", "Give it a go (idiom) [正向鼓勵]：試一試、嘗試看看（等同於 give it a try / give it a shot）。\n  例句：The automated permit system seems complex, but let us *give it a go* during tomorrow's shift."], "practice_quiz": [{"question": "【第 1 題】向同事請教某個專業領域的建議或想法，可以使用哪個生動片語？\nCan I _________ your _________ for a moment about this DCS control issue?", "answer": "✔ 填空解答：pick, brain\n👉 整句回答：Can I pick your brain for a moment about this DCS control issue?\n💡 解析：Pick someone's brain 是商務場合極為道地的請益表達。"}, {"question": "【第 2 題】請填入 reimburse 的正確名詞形式：\nPlease submit all receipts to HR for travel _________ before Friday.", "answer": "✔ 填空解答：reimbursement\n👉 整句回答：Please submit all receipts to HR for travel reimbursement before Friday."}], "instant_guide": {"core_concepts": ["1. 掌握會前諮詢與借力他人經驗 (Pick brain / Piggyback / Echo)。", "2. 客戶性格評估 (Domineering vs. Submissive / Agreeable)。", "3. 費用報銷與日支津貼術語 (Reimburse expenses / Per diem / Cab fare)。"], "misconceptions": ["誤解：以為 resume 只有履歷表意思，動詞念作 /rɪˈzuːm/ 代表重啟恢復。"], "exam_questions": ["Q1: 請說明 pick someone's brain 與 ask for advice 在語感上的微幅差異。"]}, "link": "", "link_text": ""}, {"week": "week4", "class_date": "2026/09/09", "type": "sentence", "category": "談判策略與風格 (Negotiation Approaches)", "title": "堅持立場與順應情勢之抉擇 (Option A vs. Option B)", "key_takeaways": "【多益與高階談判技巧】\n1. 談判策略兩難：\n   - Option A: Stand one's ground (堅持立場、寸步不讓) ➔ 強推己方議程 (Push one's own agenda)。\n   - Option B: Go with the flow (順應情勢、順勢而為，反義詞為 Rock the boat 惹事生非) ➔ 建立長期信任。\n2. 溝通風格與人際技能：\n   - Brush it off: 一笑置之、不當一回事、處之泰然。\n   - Screw up [skru ʌp]: 搞砸、弄糟（俗語）。\n   - People skills / Communication skills: 人際相處技巧與溝通能力。\n   - Time-saving vs. Time-consuming [kənˈsumɪŋ]: 省時的高效途徑 vs. 耗費時間的彎路。\n3. 結果評估與思維模式：\n   - Both parties are unhappy: 雙方都不滿意。\n   - Detail-oriented vs. Result-oriented: 細節導向 vs. 結果導向。\n   - Maintain the relationship: 維繫彼此長期夥伴關係。", "main_content": "A: In Option A, Beata tried to cut to the chase, but she screwed up and both parties were unhappy.\n（在策略 A 中，Beata 試圖開門見山切入主題，但她搞砸了，搞得雙方都很不高興。）\nB: Exactly! She lacked people skills and didn't know how to brush off Mateo's digressions.\n（完全正確！她缺乏人際溝通技巧，不知道該如何對 Mateo 扯開的話題一笑置之。）\nA: In Option B, she decided to go with the flow rather than rock the boat.\n（在策略 B 中，她決定順應情勢順水推舟，而不是故意唱反調惹是生非。）\nB: Mateo has a very dominant style, but Beata adapted to his pacing and maintained the relationship smoothly!\n（Mateo 具有強勢主導的風格，但 Beata 適應了他的節奏，非常順暢地維繫了雙方的合作關係！）", "vocab_notes": ["Brush it off (phr. v.) [情緒管理]：一笑置之、不當一回事、輕易拋開。\n  例句：A seasoned crisis manager learns to *brush off* minor criticisms and stay focused on resolution.", "Go with the flow vs. Rock the boat [談判策略]：\n  - Go with the flow (idiom)：順其自然、順應形勢。\n  - Rock the boat (idiom)：惹事生非、打破平衡、搗亂。\n  例句：In preliminary client meetings, it is safer to *go with the flow* instead of *rocking the boat*.", "Screw up [skru ʌp] (phr. v.) [口語俗語]：搞砸、弄糟。\n  例句：Failing to verify the safety valve setting could *screw up* the entire commissioning schedule.", "People skills / Communication skills (n.) [職場軟實力]：人際溝通相處技巧。\n  例句：Executive leadership requires technical expertise balanced with exceptional *people skills*.", "Time-saving vs. Time-consuming [效率辨析]：\n  - Time-saving (adj.)：省時的。\n  - Time-consuming [kənˈsumɪŋ] (adj.)：費時耗力的。\n  例句：Standardized digital reporting is a *time-saving* procedure compared to *time-consuming* paper logs.", "Detail-oriented vs. Result-oriented [思維導向]：\n  - Detail-oriented (adj.)：注重細節的、絲毫畢現的。\n  - Result-oriented (adj.)：注重結果成效的。\n  例句：A plant safety audit demands *detail-oriented* inspectors working alongside *result-oriented* leaders.", "Maintain the relationship (phr.) [商業策略]：維護與客戶的長期關係。\n  例句：Even when contractual terms get tough, both firms strive to *maintain the relationship*.", "Both parties are unhappy (sent.) [談判僵局]：雙方皆不滿意（雙輸局面）。\n  例句：A rigid take-it-or-leave-it approach often ensures *both parties are unhappy*.", "Cut to the chase / Get down to business (idiom) ↔ Beat around the bush (idiom)：開門見山切入重點 ↔ 拐彎抹角旁敲側擊。\n  例句：Let us *cut to the chase* and stop *beating around the bush* regarding maintenance liabilities."], "practice_quiz": [{"question": "【第 1 題】請不要拐彎抹角，直接切入核心重點吧！請填入核心片語：\nStop _________ around the _________ and get straight down to business.", "answer": "✔ 填空解答：beating, bush\n👉 整句回答：Stop beating around the bush and get straight down to business."}], "link": "", "link_text": ""}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "對話管理諮詢 (BP B1 4.3.1)", "title": "Alex 與 Beata 之會前請益 (Managing Conversations: Alex & Beata)", "key_takeaways": "【商務情境與實務解析】\nBeata 行前向 Alex 請益里約客戶 Mateo 的處事風格。Alex 提醒 Mateo 性格強勢 (Domineering [ˌdɑmɪˈnɪrɪŋ])、喜歡多工處理 (Multitask [ˈmʌltiˌtæsk])，且有時很難維持在主題上 (Difficult to stay on track)。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: Beata consults her colleague Alex before embarking on a critical business trip to Rio de Janeiro to negotiate the Diabsensor project.\n   👉 Sentence 2: Alex warns her that the client, Mateo, has a domineering personality, likes multitasking, and often strays away from formal agendas.\n   👉 Sentence 3: He strongly recommends that Beata keep this communication habit in mind and remain patient rather than rigid during their meetings.\n2. New Words Learned:\n   👉 Reference Answer: Domineering [ˌdɑmɪˈnɪrɪŋ] (盛氣凌人的), Stay on track (保持在既定軌道上), Multitask (多工處理), Gut feeling (直覺預感).\n3. Assignment Submission:\n   👉 Reference Answer: Compose three sentences describing how you would prepare yourself psychologically before meeting an executive client known to be domineering.", "main_content": "A: Has Alex ever been to Rio de Janeiro?\n（Alex 以前去過里約熱內盧嗎？）\nB: Yes, and he knows Mateo quite well. He cautioned Beata that Mateo loves the sound of his own voice.\n（去過，而且他相當了解 Mateo。他提醒 Beata 說，Mateo 說話非常專斷、很愛聽自己講話的聲音。）\nA: What specific advice did Alex give?\n（Alex 到底給了什麼具體的建議？）\nB: He suggested that Beata should be prepared to go with the flow, because forcing Mateo onto a rigid track can backfire.\n（他建議 Beata 必須做好順勢而為的心理準備，因為強迫 Mateo 走死板僵化的議程只會適得其反。）", "vocab_notes": ["Stay on track (phr.) [議程控制]：維持在既定軌道/主題上。\n  例句：Our facilitator kept the workshop discussion *on track* despite heated debates.", "Rio de Janeiro [ˈriːoʊ deɪ ʒəˈnɛroʊ] (n.) [國際大城]：里約熱內盧（巴西經貿文化大城）。\n  例句：Our regional technical delegation landed in *Rio de Janeiro* for bilateral energy talks."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_B1/Bus_Part_B1_U4L3_4.3.1.mp4", "link_text": "觀看 Business Partner B1 Video 4.3.1 影片 (MP4)"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "談判策略 A (BP B1 4.3.2)", "title": "策略 A：堅持立場寸步不讓 (Option A: Beata Stands Her Ground)", "key_takeaways": "【談判策略剖析與父親背景】\nMateo 詢問 Beata 的家庭背景與父親。Beata 提及母親已退休，父親則是大學音樂教授，是業界公認的音樂鬼才 (Musical mastermind [ˈmju-zɪ-kəl ˈmæs-tɚ-ˌmaɪnd])。但 Beata 隨後選擇堅持業務立場 (Stand her ground)，不斷打斷 Mateo 關於華沙文化科學宮 (Palace of Culture and Science) 的話題想強行切入 Diabsensor，導致 Mateo 感到被冒犯而破局。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: In Option A, Mateo engages in personal chit-chat where Beata explains her father is a university professor and a true musical mastermind.\n   👉 Sentence 2: However, Beata quickly stands her ground by repeatedly interrupting Mateo's questions about Warsaw's Palace of Culture and Science to push the Diabsensor pitch.\n   👉 Sentence 3: Offended by her impatience and rigid focus, Mateo brushes her proposal off, leaving both parties profoundly dissatisfied.\n2. New Words Learned:\n   👉 Reference Answer: Musical mastermind (音樂鬼才/大師), Stand one's ground (堅持立場), Brush off (冷落敷衍), Palace of Culture and Science (文化科學宮), Be fond of (喜愛).\n3. Assignment Submission:\n   👉 Reference Answer: Write three sentences demonstrating how Beata could have transitioned from introducing her musical father to discussing Diabsensor without offending Mateo.", "main_content": "A: Did Mateo ask Beata about her family background?\n（Mateo 有詢問 Beata 的家庭背景嗎？）\nB: Yes, Beata mentioned her mom is retired and her dad is a university professor—quite a musical mastermind!\n（有，Beata 提到她母親已退休，而她父親是大學教授——一位十足的音樂界鬼才/大師！）\nA: How did Beata react when Mateo talked about the Palace of Culture and Science?\n（當 Mateo 聊到華沙的文化科學宮時，Beata 是如何反應的？）\nB: She brushed it off and aggressively pushed to discuss Diabsensor. Mateo felt offended, and both parties ended up unhappy.\n（她敷衍帶過，並強勢推動要討論 Diabsensor。Mateo 感到被冒犯，結果落得雙方都不愉快。）", "vocab_notes": ["Musical mastermind [ˈmju-zɪ-kəl ˈmæs-tɚ-ˌmaɪnd] (n. phr.) [才華人物]：音樂鬼才、音樂大師（在此指 Beata 擔任音樂教授的父親）。\n  例句：Beata's father is regarded as a true *musical mastermind* in European classical academies.", "Stand one's ground (idiom) [談判立場]：堅持立場、寸步不讓。\n  例句：While you must *stand your ground* on process safety criteria, commercial terms require diplomatic flexibility.", "Palace of Culture and Science (n.) [文化地標]：文化科學宮（波蘭華沙著名歷史地標）。\n  例句：Mateo recalled admiring the historic *Palace of Culture and Science* during his visit to Warsaw.", "Be fond of [bæ fɑnd ʌv] = love / adore (v. phr.) [情感表達]：對……非常喜愛、熱愛。\n  例句：I am very *fond of* the architecture in Rio de Janeiro."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_B1/Bus_Part_B1_U4L3_4.3.2.mp4", "link_text": "觀看 Business Partner B1 Video 4.3.2 (Option A) 影片 (MP4)"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "談判策略 B (BP B1 4.3.3)", "title": "策略 B：順應情勢建立互信 (Option B: Beata Goes with the Flow)", "key_takeaways": "【關係經營策略剖析】\nBeata 轉變策略選擇順應情勢 (Go with the flow)，展現同理心並積極參與 Mateo 談論的生活與城市話題（如波蘭蕭邦 Chopin [ˈʃoʊpæn]、蒸餾酒 Distilled spirits 等文化背景 Backdrop [ˈbækˌdrɑp]）。在建立了深厚的情感連帶與信任後，Mateo 主動提議展開 Diabsensor 的實質合作。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: In Option B, Beata exercises social patience by actively participating in Mateo's personal discussions regarding Warsaw, Chopin, and local distilled spirits.\n   👉 Sentence 2: She demonstrates respect for his conversational pacing and refrains from pushing the Diabsensor proposal prematurely.\n   👉 Sentence 3: Because of this mutual rapport, both parties remain relaxed, and Mateo willingly invites her to review the business project in detail at the end.\n2. New Words Learned:\n   👉 Reference Answer: Go with the flow (順應情勢), Distilled spirits (蒸餾烈酒), Warsaw (華沙), Chopin (蕭邦), Backdrop (背景幕).\n3. Assignment Submission:\n   👉 Reference Answer: Provide three concrete conversational phrases showing sincere interest in a client's hometown culture before talking business.", "main_content": "A: What was the primary difference in Beata's behavior during Option B?\n（在策略 B 中，Beata 的言行表現有何關鍵不同？）\nB: She listened attentively, asked relevant follow-up questions, and showed genuine curiosity about Warsaw, Chopin, and Brazilian preference for distilled wine.\n（她專注傾聽，提出恰當的後續問題，並對華沙、蕭邦以及巴西人對蒸餾烈酒的偏好展現出真誠的好奇心。）\nA: What was the outcome?\n（談判結果如何？）\nB: Mateo felt respected and welcomed the Diabsensor discussion naturally once the social rapport was established.\n（Mateo 感受到了被尊重，一旦社交融洽感建立起來，他便非常自然主動地切入 Diabsensor 的實質討論。）", "vocab_notes": ["Go with the flow (phr.) [處事策略]：順其自然、順應情勢。\n  例句：During executive networking d
