<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Networking English</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #1e1b4b;
            --text-body: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            
            --amber-bg: #fffbeb;
            --amber-border: #fef3c7;
            --amber-text: #b45309;
            
            --sky-bg: #f0f9ff;
            --sky-border: #e0f2fe;
            --sky-text: #0369a1;

            --emerald-bg: #ecfdf5;
            --emerald-border: #d1fae5;
            --emerald-text: #047857;

            --violet-bg: #faf5ff;
            --violet-border: #e9d5ff;
            --violet-text: #6b21a8;

            --bubble-a-bg: #ffffff;
            --bubble-a-border: #cbd5e1;
            --bubble-a-text: #0f172a;

            --bubble-b-bg: #eef2ff;
            --bubble-b-border: #c7d2fe;
            --bubble-b-text: #1e1b4b;

            --app-max-width: 460px;
        }

        @media (min-width: 640px) {
            :root {
                --app-max-width: 680px;
            }
            body {
                padding: 24px 20px !important;
            }
            h1 {
                font-size: 28px !important;
            }
            .card {
                padding: 28px 26px !important;
                max-height: 72vh !important;
                border-radius: 28px !important;
            }
            .title {
                font-size: 23px !important;
            }
            .block-desc, .vocab-ul {
                font-size: 16px !important;
            }
            .chat-bubble-content {
                font-size: 16px !important;
                max-width: 80% !important;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg);
            margin: 0; padding: 16px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }

        .app-layout {
            width: 100%;
            max-width: var(--app-max-width);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin: 0 auto;
        }

        #updateNotice {
            display: none; width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff; padding: 10px 16px; border-radius: 14px;
            margin-bottom: 10px; box-sizing: border-box; font-size: 14px; font-weight: 700;
            text-align: center; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            cursor: pointer;
        }
        
        .header { width: 100%; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 25px; font-weight: 800; color: var(--text-title); margin: 4px 0 2px 0; letter-spacing: -0.5px; }
        
        .author-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            background-color: var(--primary-soft);
            padding: 3px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        /* 工具列 (含語言切換按鈕) */
        .pen-toolbar {
            display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
        }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 12px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted);
            display: flex; align-items: center; gap: 4px; cursor: pointer; transition: all 0.2s ease;
        }
        .tool-btn.active-pen {
            background-color: #ffe4e6; border-color: #e11d48; color: #e11d48;
            box-shadow: 0 2px 8px rgba(225, 29, 72, 0.25);
        }
        .tool-btn.lang-btn {
            background-color: #f0fdf4; border-color: #86efac; color: #166534;
        }
        .tool-btn:active { transform: scale(0.96); }

        .filters { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        select {
            width: 100%; box-sizing: border-box; padding: 13px 16px; font-size: 16px; font-weight: 700;
            border-radius: 16px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none; box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        
        .tab-group { width: 100%; box-sizing: border-box; display: flex; gap: 8px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 11px 6px; font-size: 15px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-btn.active {
            background: #ffffff; color: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
        }

        .card-container {
            width: 100%; flex: 1; display: flex; flex-direction: column;
            position: relative;
        }
        .card {
            background-color: var(--card-bg); border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
            position: relative;
        }

        #drawCanvas {
            position: absolute; top: 0; left: 0;
            pointer-events: none;
            z-index: 100;
        }
        .card.canvas-active #drawCanvas {
            pointer-events: auto;
            touch-action: none;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .badge.media-badge { background-color: #fef3c7; color: #92400e; }
        .badge.task-badge { background-color: #dcfce7; color: #166534; }
        .date-badge { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
        .counter { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        
        .title { font-size: 21px; font-weight: 800; color: var(--text-title); margin-bottom: 14px; line-height: 1.35; }
        
        .block-section { margin-bottom: 18px; text-align: left; }
        
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 12.5px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
        .tag-violet { background-color: var(--violet-bg); color: var(--violet-text); border: 1px solid var(--violet-border); }

        .block-desc { font-size: 15.5px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }

        .content-plain-box {
            font-size: 16px; font-weight: 600; color: #0c4a6e; line-height: 1.65;
            background-color: var(--sky-bg); padding: 16px; border-radius: 16px; white-space: pre-line;
            border: 1px solid var(--sky-border); margin: 0;
        }

        .dialogue-container {
            display: flex; flex-direction: column; gap: 10px; margin-top: 4px;
        }
        .chat-bubble-row {
            display: flex; align-items: flex-start; gap: 8px; width: 100%;
        }
        .chat-bubble-row.speaker-b {
            flex-direction: row-reverse;
        }
        .speaker-avatar {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; color: #ffffff; flex-shrink: 0;
            margin-top: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .speaker-avatar.avatar-a { background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%); }
        .speaker-avatar.avatar-b { background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%); }

        .chat-bubble-content {
            max-width: 82%; padding: 11px 15px; border-radius: 16px;
            font-size: 15.5px; line-height: 1.5; font-weight: 600;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .speaker-a .chat-bubble-content {
            background-color: var(--bubble-a-bg);
            color: var(--bubble-a-text);
            border: 1.5px solid var(--bubble-a-border);
            border-top-left-radius: 4px;
        }
        .speaker-b .chat-bubble-content {
            background-color: var(--bubble-b-bg);
            color: var(--bubble-b-text);
            border: 1.5px solid var(--bubble-b-border);
            border-top-right-radius: 4px;
        }

        .vocab-ul {
            margin: 0; padding-left: 20px; font-size: 15px; color: var(--text-body); line-height: 1.7;
        }
        .vocab-ul li { margin-bottom: 7px; }

        .quiz-card {
            background-color: var(--violet-bg);
            border: 1.5px solid var(--violet-border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(107, 33, 168, 0.04);
        }
        .quiz-q {
            font-size: 15.5px; font-weight: 700; color: #4c1d95; line-height: 1.6; margin-bottom: 10px;
            white-space: pre-line;
        }
        
        .blank-line {
            display: inline-block;
            min-width: 80px;
            border-bottom: 2.5px solid #7c3aed;
            margin: 0 4px;
            vertical-align: baseline;
        }

        .quiz-toggle-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff; border: none; padding: 7px 16px;
            border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer;
            box-shadow: 0 2px 6px rgba(124, 58, 237, 0.25);
            transition: all 0.2s ease;
        }
        .quiz-toggle-btn:active { transform: scale(0.96); }

        .quiz-ans-wrapper {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #d8b4fe;
        }
        .quiz-ans-title {
            font-size: 13.5px; font-weight: 800; color: #15803d; margin-bottom: 8px;
            display: flex; align-items: center; gap: 4px;
        }
        .quiz-ans-box {
            background: #ffffff;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1.5px solid #bbf7d0;
            font-size: 15px;
            color: #14532d;
            line-height: 1.65;
            white-space: pre-line;
            font-weight: 600;
        }

        .mini-dialogue-box {
            display: flex; flex-direction: column; gap: 8px;
        }
        .mini-bubble-row {
            display: flex; align-items: flex-start; gap: 6px; width: 100%;
        }
        .mini-bubble-row.mini-b {
            flex-direction: row-reverse;
        }
        .mini-avatar {
            width: 24px; height: 24px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 800; color: #fff; flex-shrink: 0; margin-top: 3px;
        }
        .mini-avatar.av-a { background: #2563eb; }
        .mini-avatar.av-b { background: #7c3aed; }
        .mini-content {
            max-width: 84%; padding: 8px 12px; border-radius: 12px; font-size: 14.5px; line-height: 1.45; font-weight: 600;
        }
        .mini-a .mini-content {
            background-color: #f8fafc; color: #0f172a; border: 1px solid #cbd5e1;
        }
        .mini-b .mini-content {
            background-color: #ede9fe; color: #3b0764; border: 1px solid #ddd6fe;
        }

        .task-box {
            background-color: var(--violet-bg);
            border: 1.5px solid var(--violet-border);
            border-radius: 16px;
            padding: 16px;
            font-size: 15px;
            line-height: 1.6;
            color: #4c1d95;
            font-weight: 600;
        }

        .link-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-color); text-align: left; }
        .link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
            padding: 13px 18px; font-size: 15px; color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            text-decoration: none; font-weight: 700; border-radius: 14px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: all 0.2s ease;
        }

        .nav-controls { width: 100%; display: flex; gap: 12px; margin-top: 12px; margin-bottom: 10px; }
        .nav-btn {
            flex: 1; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3); }
        .nav-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="app-layout">
        <div id="updateNotice" onclick="forceReloadApp()">
            ✨ 發現最新教材版本，點此立即更新！
        </div>

        <div class="header">
            <h1>Networking English</h1>
            <div class="author-badge">By Ryan Liu, V1.2</div>
            
            <!-- 工具列 (含中英切換) -->
            <div class="pen-toolbar">
                <button id="langToggleBtn" class="tool-btn lang-btn" onclick="toggleLanguage()">
                    <span id="langBtnText">🌐 English</span>
                </button>
                <button id="penBtn" class="tool-btn" onclick="togglePenMode()">
                    <span id="penBtnText">🖍️ 細畫筆</span>
                </button>
                <button class="tool-btn" onclick="undoLastStroke()">
                    <span id="undoBtnText">↩️ 復原</span>
                </button>
                <button class="tool-btn" onclick="clearAllCanvas()">
                    <span id="clearBtnText">🗑️ 全清</span>
                </button>
            </div>
        </div>

        <div class="filters">
            <select id="weekFilter" onchange="applyFilters()"></select>
            <div class="tab-group">
                <button id="tabSentence" class="tab-btn active" onclick="setTab('sentence', this)">句型 / 文法</button>
                <button id="tabMedia" class="tab-btn" onclick="setTab('media', this)">影音 / 自學</button>
            </div>
        </div>

        <div class="card-container">
            <div class="card" id="cardElement">
                <canvas id="drawCanvas"></canvas>

                <div>
                    <div class="card-header">
                        <div>
                            <span class="badge" id="categoryBadge">分類</span>
                            <span class="date-badge" id="dateDisplay"></span>
                        </div>
                        <span class="counter" id="counterDisplay">0 / 0</span>
                    </div>
                    <div class="title" id="titleDisplay">標題</div>

                    <div class="block-section" id="takeawaysSection">
                        <div class="tag-title tag-amber" id="tagTakeaways">💡 核心重點說明</div>
                        <div class="block-desc" id="takeawaysDisplay"></div>
                    </div>

                    <div class="block-section" id="mainContentSection">
                        <div class="tag-title tag-sky" id="tagMainContent">📖 整理後學習內容與核心句型</div>
                        <div id="mainContentContainer"></div>
                    </div>

                    <!-- 句型實戰練習題 -->
                    <div class="block-section" id="quizSection">
                        <div class="tag-title tag-violet" id="tagQuiz">✍️ 實戰練習與自我檢測</div>
                        <div id="quizContainer"></div>
                    </div>

                    <div class="block-section" id="vocabSection">
                        <div class="tag-title tag-emerald" id="tagVocab">📝 重點單字與注意事項</div>

                    </div>

                    <!-- 下週課堂延續任務 -->
                    <div class="block-section" id="taskSection">
                        <div class="tag-title tag-violet" id="tagTask">🎯 下週課堂延續示範任務</div>
                        <div id="taskContainer" class="task-box"></div>
                    </div>
                </div>

                <div class="link-box" id="linkSection">
                    <a class="link-btn" id="linkDisplay" href="#" target="_blank">🔗 開啟延伸閱讀與學習資源</a>
                </div>
            </div>
        </div>

        <div class="nav-controls">
            <button id="btnPrev" class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
            <button id="btnNext" class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
        </div>
    </div>

    <script>
        const LOCAL_APP_VERSION = "2026-08-26 22:41:03";
        const rawDatabase = [{"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "社交問候 (Greetings)", "category_en": "Greetings & Small Talk", "title": "打招呼與近況寒暄 (Greetings & Responses)", "title_en": "Greetings & Daily Catch-ups", "key_takeaways": "1. 熟人與同事間的自然問候：優先使用 Hey there! 或 How’s it going?。\n2. 描述近況平淡無波折時：避免只說 I'm fine，使用 Same old, same old 或 The usual 更在地自然。", "key_takeaways_en": "1. Natural casual greetings: Use 'Hey there!' or 'How’s it going?' among coworkers.\n2. Neutral responses: Instead of just saying 'I’m fine', use 'Same old, same old' or 'The usual' for natural daily updates.", "main_content": "• 自然問候 (Informal Greetings):\n  - Hey there!\n  - How’s it going?\n  - How are things (with you)?\n\n• 描述近況平穩 (Neutral Responses):\n  - Same old, same old!\n  - The usual. / Pretty much the same.\n  - (Pretty) uneventful. / Nothing special.", "vocab_notes": ["Same old, same old：高頻口語，表達工作或生活一切照舊、沒太大變化。", "Uneventful：形容詞，指平靜無事的、沒有重大事件發生的。", "How have you been?：現在完成式，用於詢問自上次見面以來的近況。", "Can't complain：挺好的、沒什麼好挑剔的，相當於 Not bad 或 Pretty good。", "Pretty much the same：幾乎跟平常一模一樣，常用於回答 How are things?。"], "vocab_notes_en": ["Same old, same old: Common idiom indicating that life or work is going on as usual.", "Uneventful: Adjective meaning quiet with no exciting, unusual, or major events.", "How have you been?: Present perfect tense used to ask about someone's life since last meeting.", "Can't complain: Casual phrase meaning things are pretty good and there's nothing to gripe about.", "Pretty much the same: Standard polite response to 'How are things?'."], "practice_quiz": [{"question": "【填空題】同事問你 How’s work going?，你想回答「老樣子，一切照舊」：\n_________ , _________ ! Pretty much the same.", "question_en": "Fill-in-the-blank: When asked 'How’s work going?', reply that everything is as usual:\n_________ , _________ ! Pretty much the same.", "answer": "✔ 填空解答：Same old, same old\n👉 整句回答：Same old, same old! Pretty much the same.\n💡 解析：Same old, same old 是最道地的口語說法，用來表達一切如常。", "answer_en": "✔ Answer: Same old, same old\n👉 Full Sentence: Same old, same old! Pretty much the same.\n💡 Explanation: Standard conversational reply indicating routine and normalcy."}, {"question": "【填空題】想表達「最近沒什麼大事發生，挺平靜的」，請填入字首為 un- 的形容詞：\nThings have been pretty _________ lately.", "question_en": "Fill-in-the-blank: Express that work/life has been calm and quiet without major issues (starts with 'un-'):\nThings have been pretty _________ lately.", "answer": "✔ 填空解答：uneventful\n👉 整句回答：Things have been pretty uneventful lately.\n💡 解析：uneventful 指平靜無事、無重大波折。", "answer_en": "✔ Answer: uneventful\n👉 Full Sentence: Things have been pretty uneventful lately.\n💡 Explanation: 'Uneventful' denotes that nothing unexpected or disruptive happened."}], "link": "https://www.linkedin.com/pulse/18-ways-say-hello-english-thomas-spengler/", "link_text": "18 Ways to Say Hello in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "道別用語 (Goodbyes)", "category_en": "Goodbyes & Core Grammar", "title": "道別與重要文法規則 (Ways to Say Goodbye & Grammar)", "title_en": "Ways to Say Goodbye & Grammar Rule", "key_takeaways": "Pro Tip 文法核心：Look forward to 中的 to 是介系詞，後面必須接動名詞 (V-ing) 或名詞，絕不可接原形動詞！\n✔ 正確：I look forward to seeing you in Kaohsiung.\n✖ 錯誤：I look forward to see you.", "key_takeaways_en": "Grammar Core: The 'to' in 'look forward to' is a preposition, so it MUST be followed by a gerund (V-ing) or a noun!\n✔ Correct: I look forward to seeing you in Kaohsiung.\n✖ Incorrect: I look forward to see you.", "main_content": "• 非正式道別 (Informal Goodbyes):\n  - I’ve got to get going! (= I have to leave now)\n  - Take it easy! / Have a good one!\n  - I’m off!\n\n• 正式商務道別 (Formal Goodbyes):\n  - It was nice meeting you. / It was a pleasure to see you。\n  - I look forward to our next meeting!\n  - I look forward to seeing you soon。", "vocab_notes": ["I've got to (= I have to / I need to)：口語中常縮讀為 I gotta。", "Have a good one：美式極常見祝福語，one 可泛指 day, weekend 或 evening。", "Take it easy：道別時使用，相當於保重、放輕鬆。", "Look forward to + V-ing：商務書信與會面結尾最標準的期待相會用語。"], "vocab_notes_en": ["I've got to: Equivalent to 'I have to' or 'I need to', often contracted to 'I gotta' in speech.", "Have a good one: Common American farewell greeting where 'one' stands for day or weekend.", "Take it easy: Friendly way to say goodbye and tell someone not to stress.", "Look forward to + V-ing: Formal phrase used in business correspondence to anticipate future meetings."], "practice_quiz": [{"question": "【文法填空題】請填入 see 的正確動詞形式：\nI look forward to _________ you at the conference next month.", "question_en": "Grammar Quiz: Fill in the correct form of the verb 'see':\nI look forward to _________ you at the conference next month.", "answer": "✔ 填空解答：seeing (V-ing)\n👉 整句回答：I look forward to seeing you at the conference next month.\n💡 解析：Look forward to 的 to 是介系詞，後面必須搭配動名詞 V-ing！", "answer_en": "✔ Answer: seeing (V-ing)\n👉 Full Sentence: I look forward to seeing you at the conference next month.\n💡 Explanation: 'To' is a preposition here, requiring a gerund (V-ing)."}], "link": "https://www.berlitz.com/blog/goodbye-english", "link_text": "81 Ways to Say Goodbye in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "展會社交 (Trade Fair)", "category_en": "Conference Small Talk", "title": "展會破冰與邀約 (Small Talk At a Conference)", "title_en": "Conference Ice-breaking & Happy Hour", "key_takeaways": "展會社交四部曲心法：\n1. 詢問抵達與交通 ➔ 2. 詢問住宿評價與距離 ➔ 3. 交流攤位心得 ➔ 4. 提出社交邀約 (Happy Hour)。", "key_takeaways_en": "Conference Networking 4-Step Formula:\n1. Ask arrival details ➔ 2. Check hotel quality & distance ➔ 3. Discuss exhibitor stands ➔ 4. Propose Happy Hour invitation.", "main_content": "A: When did you arrive?\nB: I flew here yesterday. And you?\nA: I got here 2 days ago. Where are you staying?\nB: At the Mason Park Hotel。\nA: That’s where I am! Do you like the hotel?\nB: It’s okay. The room is small, but comfortable, and it’s a 5-minute walk to the venue。\nA: What do you think of the trade fair?\nB: I like some of the exhibitor’s stands, and I plan to join the happy hour tomorrow at 5pm. Would you like to come?\nA: Why not? Count me in!", "vocab_notes": ["Trade fair：商務展覽會、貿易展。", "Within walking distance：步行即可達到的範圍。", "Count me in!：口語高頻片語，表示算我一份、我也要參加。", "Happy hour：展會結束後的非正式飲酒社交時段，破冰關鍵場合。"], "vocab_notes_en": ["Trade fair: Large exhibition where companies promote products and services.", "Within walking distance: Close enough to easily walk to.", "Count me in!: Enthusiastic idiom meaning 'include me in the activity'.", "Happy hour: Informal social gathering with drinks after conference sessions."], "practice_quiz": [{"question": "【填空題】對方邀請你參加展後聚會，你想表達「算我一份！」，請填入片語：\nWhy not? _________ me _________ !", "question_en": "Fill-in-the-blank: Accept an invitation enthusiastically ('include me!'):\nWhy not? _________ me _________ !", "answer": "✔ 填空解答：Count, in\n👉 整句回答：Why not? Count me in!\n💡 解析：Count me in! 是表示「我也要加入/算我一份」的高頻口語。", "answer_en": "✔ Answer: Count, in\n👉 Full Sentence: Why not? Count me in!\n💡 Explanation: Casual way to say you definitely want to join."}], "link": "", "link_text": ""}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "職場英語 (Workplace)", "category_en": "Workplace Communication", "title": "職場核心表達與行程衝突 (Useful Workplace Phrases)", "title_en": "Workplace Skills & Scheduling Conflicts", "key_takeaways": "職場商務溝通核心：精準表達職能特長、跨部門人際相處，以及面對會議撞期時的專業應對。", "key_takeaways_en": "Core Workplace Communication: Articulate skills clearly, build rapport with colleagues, and handle double-booked meetings professionally.", "main_content": "• 專業特質與人際相處:\n  - This job is an ideal match for my skills and experience。\n  - I get on with people easily. (= I get along with people well)\n\n• 行程衝突與時間管理:\n  - I’ve got two meetings scheduled at the same time. (= I’m double-booked.)\n  - I can’t do them both at once! (= I have a scheduling conflict.)\n\n• 決策權限說明:\n  - The decision is in the hands of the manager。", "vocab_notes": ["Ideal match：理想搭配、完美契合的人選。", "Double-booked：同一時間被重複安排了兩項會議行程。", "Scheduling conflict：時間安排上的衝突、衝堂。", "In the hands of：掌握在...手中、由...作決定。"], "vocab_notes_en": ["Ideal match: A perfect fit for a job position or project role.", "Double-booked: Having two appointments or commitments scheduled at the same time.", "Scheduling conflict: When two planned events clash in timetable.", "In the hands of: Controlled by or dependent on someone's decision."], "practice_quiz": [{"question": "【填空題】當你同一時間被排了兩場會議（撞期），請填入複合形容詞：\nI’m afraid I’m _________ at 3:00 PM.", "question_en": "Fill-in-the-blank: State that you have two meetings scheduled simultaneously:\nI’m afraid I’m _________ at 3:00 PM.", "answer": "✔ 填空解答：double-booked\n👉 整句回答：I’m afraid I’m double-booked at 3:00 PM.\n💡 解析：Double-booked 表示同一時段重複預約/行程衝堂。", "answer_en": "✔ Answer: double-booked\n👉 Full Sentence: I’m afraid I’m double-booked at 3:00 PM.\n💡 Explanation: Indicates a time conflict due to two overlapping meetings."}], "link": "https://www.bbc.co.uk/learningenglish/features/english-at-work/english-at-work-intro", "link_text": "BBC English at Work 介紹頁面"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "影音學習 (Video Study)", "category_en": "Video Study", "title": "商務社交情境：巴黎會面 (Business Partner A2 5.4.1)", "title_en": "Business Socializing in Paris (BP A2 5.4.1)", "key_takeaways": "【詳細劇情情境摘要】\nJulia 抵達巴黎參加商務研討會，與合作夥伴 Maria 和 Max 會面。對話圍繞著抵達的交通方式、入住飯店品質展開。Max 提及雖然飯店房間不大，但勝在舒適且離展場步行僅需幾分鐘。最後三人順勢敲定當晚的晚餐邀約。", "key_takeaways_en": "Summary: Julia arrives in Paris for a conference and meets partners Maria and Max. They discuss travel routes and hotel comfort before planning a joint dinner.", "main_content": "• When did you arrive? / How did she get there?\n• Did Max like the hotel he was staying? (The room is small, but comfortable)\n• What was their dinner plan?", "vocab_notes": ["Socialize with clients：與客戶建立社交關係、商務應酬。", "Make a face：做出不悅、嫌棄或無奈的面部表情。", "Roll one's eyes：翻白眼，表示不認同或受不了。"], "vocab_notes_en": ["Socialize with clients: Networking and building relationships with clients.", "Make a face: Make a facial expression showing dislike or disgust.", "Roll one's eyes: Move eyes upward to show frustration or disbelief."], "next_week_tasks": ["💡 課堂示範預告：老師下週會隨機請同學模擬巴黎會面情境（扮演 Julia, Maria 或 Max），請準備好 30 秒抵達交通與飯店評價對話。"], "next_week_tasks_en": ["💡 In-Class Role-play: Practice a 30-second dialog about travel arrival and hotel review as Julia, Maria, or Max."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U5L4_5.4.1.mp4", "link_text": "觀看 Business Partner 5.4.1 影片 (MP4)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "聽力學習 (Audio Study)", "category_en": "Listening Practice", "title": "展館心得與產品發表聽力 (BP A2 Workbook 5.5)", "title_en": "Venue Reviews & Product Launch (BP 5.5)", "key_takeaways": "【詳細對話摘要】\nAmy 與 Marta 在展會現場交流彼此抵達展場的日期與參觀心得。Amy 分享了對展覽中心硬體設施的正面評價，並預告隔天自家公司將舉辦新產品發表會；隨後 Victor 加入討論，三人針對『資源回收 (Recycling)』專題演講交流意見。", "key_takeaways_en": "Summary: Amy and Marta exchange thoughts on venue facilities and upcoming product launches, joined by Victor to discuss presentations on recycling.", "main_content": "• Conference center facilities (會議中心硬體設施)\n• Product launch presentation (新產品發表會)\n• Presentation on recycling (環保資源回收簡報)", "vocab_notes": ["Conference hotel：大會指定特約飯店。", "Product launch：新產品上市發布。", "Recycling presentation：資源回收專題簡報。"], "vocab_notes_en": ["Conference hotel: Designated hotel near the convention venue.", "Product launch: Official introduction of a new product to the market.", "Recycling presentation: Presentation focused on waste management and sustainability."], "next_week_tasks": ["💡 課堂延續練習：下週上課將核對 3 項聽力題目的細部答案，請先標記出 Amy 和 Marta 抵達日期的時間差距。"], "next_week_tasks_en": ["💡 Listening Task: Check the arrival date difference between Amy and Marta before class."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/BP_A2_WB_5_05.mp3", "link_text": "收聽 BP A2 5.5 練習音檔 (MP3)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "自學任務 (Self-Study)", "category_en": "Self-Study Task", "title": "拒絕制式回答：替代 'I’m fine, thank you' (Papa Teach Me)", "title_en": "Beyond 'I'm Fine, Thank You' (Papa Teach Me)", "key_takeaways": "【影片核心內容摘要】\n深入探討母語人士在日常社交中如何依據真實心境提供靈活、道地的回覆，徹底擺脫死板的 'I'm fine, thank you'；同時傳授如何敏銳觀察對方面色並給予合適的關懷問候。", "key_takeaways_en": "Summary: Learn authentic ways native speakers reply to 'How are you?' based on mood, moving beyond robotic textbook answers.", "main_content": "• 狀況極佳：Never better! / Couldn't be better!\n• 平淡日常：Can't complain. / Same old, same old. / The usual。\n• 關懷問句：Are you feeling alright? / You look a bit under the weather.", "vocab_notes": ["Can't complain：挺好的，沒什麼好挑剔的。", "A bit under the weather：身體微恙、略感不適（口語高頻慣用語）。", "Never better：再好不過了，表示個人狀態極佳。"], "vocab_notes_en": ["Can't complain: Casual reply meaning things are going well.", "Under the weather: Feeling slightly ill, fatigued, or unwell.", "Never better: Feeling at the peak of health and spirits."], "next_week_tasks": ["💡 下週課堂暖身示範：下週課前寒暄，老師將隨機指定情境，請同學以影片中的在地說法即興回應，不可使用 'I'm fine'！"], "next_week_tasks_en": ["💡 Warm-up Task: Prepare to answer 'How are you?' dynamically without using 'I'm fine'."], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "開啟 YouTube 教學影片 (14:18)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "走廊寒暄 (Catching Up)", "category_en": "Corridor Small Talk", "title": "巧遇寒暄與公務告退 (Catching up with Each Other)", "title_en": "Casual Catch-up & Polite Departure", "key_takeaways": "【課堂情境與學習重點】\n1. 在走廊、電梯口或課後偶遇時，進行自然簡短的 30 秒破冰寒暄。\n2. 當有緊急公務（如趕著交報告、開會）時，如何有禮貌且合情合理地向對方告退，並給予正面口語祝福。", "key_takeaways_en": "1. 30-second quick catch-up in corridors or after class.\n2. How to politely excuse yourself when rushing to meet deadlines or submit reports.", "main_content": "A: Hi, [Name. How have you been?\nB: Things are good~ And how are things with you?\nA: Same old, same old。\nB: What are you doing after class?\nA: I’ve got to get back to work. I need to turn in a report by 5:30pm。\nB: Wow, ok. Good luck with that!\nA: Thanks! I really need it!", "vocab_notes": ["Turn in a report：繳交/呈報報告（turn in 同義於 submit 或 hand in）。", "Good luck with that!：祝你在那件事上順利！日常高頻口語祝福。", "Get back to work：回到工作崗位上繼續忙碌。"], "vocab_notes_en": ["Turn in a report: Submit or hand in a document/report before deadline.", "Good luck with that!: Common friendly phrase offering encouragement for a task.", "Get back to work: Return to job duties or office."], "practice_quiz": [{"question": "【填空題】你想表達「我必須在下午五點半前繳交報告」，請填入片語 turn ___：\nI need to _________ in a report by 5:30 PM.", "question_en": "Fill-in-the-blank: Express that you must submit a report before 5:30 PM:\nI need to _________ in a report by 5:30 PM.", "answer": "✔ 填空解答：turn\n👉 整句回答：I need to turn in a report by 5:30 PM.\n💡 解析：Turn in 同義於 submit 或 hand in (繳交報告/文件)。", "answer_en": "✔ Answer: turn\n👉 Full Sentence: I need to turn in a report by 5:30 PM.\n💡 Explanation: 'Turn in' is synonymous with 'submit'."}], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation)", "category_en": "Travel & Logistics", "title": "研討會住宿與地鐵動線描述 (AIChE Minneapolis)", "title_en": "AIChE Conference Transit & Hotel Proximity", "key_takeaways": "【課堂情境與學習重點】\n1. 商務差旅中（以赴美參加 AIChE 2026 年會為例）精確描述飯店距離、步行時間、地鐵直達與免轉乘動線。\n2. 詢問與說明房價預算、掌握明尼阿波利斯 Skyway 空中步道系統在防寒與通行上的優勢。", "key_takeaways_en": "1. Describe hotel distances, walking duration, and direct transit without transfers.\n2. Inquire about room rates and leverage the Minneapolis Skyway climate-controlled system.", "main_content": "• 距離與位置描述:\n  - The hotel is near / close to the subway station。\n  - The subway station is within walking distance. (= It’s a 5-minute walk to the station.)\n\n• 交通動線與直達:\n  - From the hotel, I can take the subway directly to the conference venue。\n  - I don’t need to transfer。\n\n• 房價說明:\n  - I have no idea about their room price.", "vocab_notes": ["Within walking distance：步行可達的距離（商務出差選飯店首要考量）。", "Directly：副詞，直達地、直接地。", "Transfer：動詞/名詞，轉乘、換線。", "Skyway system：空中連通步道系統（如明尼阿波利斯著名防寒通道）。"], "vocab_notes_en": ["Within walking distance: Easily reached on foot.", "Directly: Without stopping or changing routes.", "Transfer: Change from one transit line/vehicle to another.", "Skyway system: Enclosed elevated pedestrian walkway connecting buildings."], "practice_quiz": [{"question": "【填空題】商務出差描述飯店「走路就可抵達會場」，請填入核心片語：\nThe hotel is _________ _________ distance to the conference center.", "question_en": "Fill-in-the-blank: State that the hotel is easily walkable to the venue:\nThe hotel is _________ _________ distance to the conference center.", "answer": "✔ 填空解答：within walking\n👉 整句回答：The hotel is within walking distance to the conference center.\n💡 解析：within walking distance 是商務訂房與交通指南中最常用的片語。", "answer_en": "✔ Answer: within walking\n👉 Full Sentence: The hotel is within walking distance to the conference center.\n💡 Explanation: Standard business hospitality idiom."}, {"question": "【填空題】說明搭地鐵「直達會場、不需要轉乘」，請填入轉乘動詞：\nYou can take the blue line directly; you don’t need to _________ .", "question_en": "Fill-in-the-blank: You can ride directly without changing trains:\nYou can take the blue line directly; you don’t need to _________ .", "answer": "✔ 填空解答：transfer\n👉 整句回答：You can take the blue line directly; you don’t need to transfer.\n💡 解析：transfer 在大眾運輸中表示轉車、換線。", "answer_en": "✔ Answer: transfer\n👉 Full Sentence: You can take the blue line directly; you don’t need to transfer.\n💡 Explanation: 'Transfer' means changing train/bus lines."}], "link": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf?v=1726683206", "link_text": "Minneapolis Skyway & Hotel Map"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "在地推薦 (Recommendations)", "category_en": "Local Recommendations", "title": "會後在地景點與美食推薦 (Post-conference Recommendations)", "title_en": "Local Sightseeing & Food Recommendations", "key_takeaways": "【課堂情境與學習重點】\n1. 向外國訪客介紹台灣在地景點（如高雄景點與特色小吃）的高階推薦句型。\n2. ★ 重要文法核心：worth (值得) 後方必須接動名詞『V-ing』！（例：is worth visiting / eating）。\n3. 提醒外國友人避開觀光陷阱與敲竹槓店家（Tourist trap / Rip-off）。", "key_takeaways_en": "1. Recommend local attractions and cuisine to foreign visitors.\n2. Grammar: 'Worth' MUST be followed by a gerund V-ing (e.g., 'worth visiting').\n3. Advise visitors to avoid tourist traps and rip-off pricing.", "main_content": "• 推薦原因句型:\n  - I recommend [Place/Food because [Reason。\n  - I think [Place/Food is worth seeing/visiting/eating, as it [Reason。\n\n• 最高評價句型:\n  - [Place/Food is my all-time favorite. It’s a must-see / must-eat / must-do here in Kaohsiung。\n  - You simply can’t miss [Place/Food. It’s a once-in-a-lifetime experience!", "vocab_notes": ["All-time favorite：一直以來的最愛、終極最愛。", "Must-see / Must-eat：必看景點 / 必吃美食（名詞用法）。", "Tourist trap：專門敲觀光客竹槓的黑店或名不副實的景點。", "Rip-off (n./v.)：敲竹槓、暴利商品。"], "vocab_notes_en": ["All-time favorite: The single favorite choice across all time.", "Must-see / Must-eat: Essential attractions or food that should not be missed.", "Tourist trap: Overpriced or disappointing destination targeting tourists.", "Rip-off: An item or service that is greatly overpriced."], "practice_quiz": [{"question": "【文法填空題】請填入 visit 的正確動詞形式：\nPier-2 Art Center is definitely worth _________ during your stay.", "question_en": "Grammar Quiz: Fill in the correct form of 'visit':\nPier-2 Art Center is definitely worth _________ during your stay.", "answer": "✔ 填空解答：visiting (V-ing)\n👉 整句回答：Pier-2 Art Center is definitely worth visiting during your stay.\n💡 解析：worth 後方接動名詞 V-ing。", "answer_en": "✔ Answer: visiting (V-ing)\n👉 Full Sentence: Pier-2 Art Center is definitely worth visiting during your stay.\n💡 Explanation: 'Worth' requires a gerund."}], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "商務人脈 (Networking)", "category_en": "Networking Role-Play", "title": "展會破冰與部門職掌交流 (Networking Role-Play 投影片全劇本)", "title_en": "Networking Role-Play Full Script", "key_takeaways": "【課堂即興演練核心 Scenario】\n在 Networking Event 初次見面，互相介紹自身與公司，並在交流中自然帶出工作上遭遇的實際問題（Problem/Need），促成合作與交換名片！\n\n【標準 6 階段流程】\n1. 自我介紹與部門 ➔ 2. 詢問對方部門業務 ➔ 3. 簡述自己部門職掌 ➔ 4. 對方帶出工作痛點 ➔ 5. 主動提供協助 ➔ 6. 交換名片約定後續聯絡。", "key_takeaways_en": "Scenario: Meet someone for the first time at a networking event, introduce company roles, identify an operational problem, offer help, and exchange cards.\n\n6-Step Flow: Introduction ➔ Inquire role ➔ Explain dept capabilities ➔ Identify client pain point ➔ Offer assistance ➔ Exchange business cards.", "main_content": "A: Hello, I’m [Name. I work as a/an [Title in [Dept.\nB: Hi, I’m [Name. It’s a pleasure to meet you.\nA: Can you tell me about your department?\nB: Sure! I work in [Dept. We [Responsibilities.\nA: Can I briefly tell you about what our department does?\nB: Of course! I’m all ears. / Fire away!\nA: We [Our work / What our department does.\nB: You just remind me that we may need your help in [Name a problem at work.\nA: Yeah, I think we might be able to help you.\nB: That would be great! / It’s so nice of you to offer help.\nA: Here's my business card should you want to call.\nB: Absolutely. I’ll be in touch / I'll give you a call soon.", "vocab_notes": ["I'm all ears / Fire away!：我洗耳恭聽 / 請儘管說吧！", "You just remind me that...：你正好提醒了我...（極佳的業務痛點切入句型）。", "Offer help：主動提供專業協助。", "Here's my business card should you want to call：這是我的名片，若您需要可隨時聯繫。"], "vocab_notes_en": ["I'm all ears / Fire away!: Enthusiastic idioms meaning 'I am listening attentively / please go ahead!'.", "You just remind me that...: Natural conversational bridge to introduce a work problem/need.", "Offer help: Proactively propose business assistance.", "Here's my business card should you want to call: Professional card exchange phrase."], "practice_quiz": [{"question": "【填空題】對方想向你簡報業務，你想熱情表示「請儘管說吧！/ 我洗耳恭聽」：\nOf course! I’m all _________ . / _________ away!", "question_en": "Fill-in-the-blank: Politely tell the other person you are listening and to go ahead:\nOf course! I’m all _________ . / _________ away!", "answer": "✔ 填空解答：ears, Fire\n👉 整句回答：Of course! I’m all ears. / Fire away!\n💡 解析：I'm all ears 與 Fire away! 都是表達樂意聆聽的商務社交用語。", "answer_en": "✔ Answer: ears, Fire\n👉 Full Sentence: Of course! I’m all ears. / Fire away!\n💡 Explanation: Standard polite idiom in networking."}, {"question": "【課堂示範實戰填空範例（EHS / 製程安全情境）】", "question_en": "In-Class EHS Practice Sample Script:", "answer": "A: Hello, I'm Ryan. I work as a Senior EHS Specialist in Process Safety.\nB: Hi, I'm Alex. Pleasure to meet you.\nA: Can you tell me about your department?\nB: Sure! I work in Operations. We manage plant production lines.\nA: Can I briefly tell you about what our department does?\nB: Of course! Fire away!\nA: We conduct safety risk assessments and incident prevention audits.\nB: You just remind me that we may need your help in identifying chemical vapor leakage risks.\nA: Yeah, I think we might be able to help you.\nB: That would be great!\nA: Here's my business card should you want to call.\nB: Absolutely. I'll be in touch soon.", "answer_en": "A: Hello, I'm Ryan. I work as a Senior EHS Specialist in Process Safety.\nB: Hi, I'm Alex. Pleasure to meet you.\nA: Can you tell me about your department?\nB: Sure! I work in Operations. We manage plant production lines.\nA: Can I briefly tell you about what our department does?\nB: Of course! Fire away!\nA: We conduct safety risk assessments and incident prevention audits.\nB: You just remind me that we may need your help in identifying chemical vapor leakage risks.\nA: Yeah, I think we might be able to help you.\nB: That would be great!\nA: Here's my business card should you want to call.\nB: Absolutely. I'll be in touch soon."}], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "BBC 職場英語 (BBC Networking)", "category_en": "BBC English at Work", "title": "商務社交實戰：Tip Top Trading (BBC #48 Face-to-face)", "title_en": "Networking Face-to-Face (BBC #48)", "key_takeaways": "【詳細劇情情境摘要】\nTip Top Trading 的員工參加產業大會。Anna 必須在會場與同業積極拓展人脈（Networking）。同時公司正面臨嚴峻的經濟景氣（Tough economic climate），管理階層面臨裁員縮編壓力。Anna 必須把握展會機會展現熱情，積極爭取新商機。", "key_takeaways_en": "Summary: Anna attends an industry conference to network in a tough economic climate. She must be friendly and chatty to secure new business and impress management.", "main_content": "• Do some networking = do some schmoozing (建立人脈 / 社交應酬)\n• I’ll give it a try. = I’ll give it a shot. (我來試試看)\n• Let’s get down to business. (讓我們切入正題談公事)\n• It's a tough economic climate. (這是個嚴峻的經濟景氣)\n• Here's my business card should you want to call。", "vocab_notes": ["Schmooze (v.)：社交應酬、拉攏關係、建立人脈。", "Give it a shot：嘗試一下（口語高頻同義詞 give it a try）。", "Tough economic climate：艱困的經濟大環境。"], "vocab_notes_en": ["Schmooze: Talk casually and friendly in a social/business setting.", "Give it a shot: Try something out.", "Tough economic climate: Difficult economic market conditions."], "next_week_tasks": ["💡 課堂角色扮演預告：下週課堂將進行兩人一組 Networking 配對演練，請務必熟記『投影片全劇本』的 6 階段對話流程！"], "next_week_tasks_en": ["💡 In-Class Task: Paired networking role-play following the 6-stage script."], "link": "https://www.bbc.co.uk/learningenglish/features/english-at-work/48-language-for-networking", "link_text": "前往 BBC 課程網頁 (收聽音檔與劇本)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "自學任務 (Self-Study)", "category_en": "Self-Study Task", "title": "Passkey 通行密鑰原理 (BBC News 02:35)", "title_en": "What is a Passkey? (BBC News 02:35)", "key_takeaways": "【影片詳細摘要】\nBBC News 深入探討 Passkey（通行密鑰）技術如何透過裝置端生物辨識（指紋/FaceID）取代傳統容易被駭、外洩或遺忘的字元密碼，成為新一代跨平台網路安全驗證標準。", "key_takeaways_en": "Summary: Explains how biometric passkeys replace vulnerable passwords with on-device cryptographic keys.", "main_content": "• Passkey (通行密鑰)\n• Online security & Authentication (網路安全與身分驗證)\n• Biometrics (生物辨識技術：Touch ID / Face ID)\n• Passwordless future (無密碼化趨勢)", "vocab_notes": ["Authentication：身分驗證、認證流程。", "Biometrics：生物辨識技術（如指紋、臉部辨識）。", "Data encryption：資料加密傳輸技術。"], "vocab_notes_en": ["Authentication: Process of verifying who someone is.", "Biometrics: Measurements of human physical characteristics for identification.", "Data encryption: Encoding data to prevent unauthorized access."], "next_week_tasks": ["💡 課堂示範預告：下週課堂老師將抽點同學以 1 分鐘英文簡報說明：'Why are passkeys more secure than traditional passwords?'，請先擬妥要點。"], "next_week_tasks_en": ["💡 1-Minute Pitch: Prepare a quick explanation on why passkeys are superior to passwords."], "link": "https://www.youtube.com/watch?v=lf5L_1oqHDs", "link_text": "開啟 BBC Passkey 影片 (02:35)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "自學任務 (Self-Study)", "category_en": "Self-Study Task", "title": "智慧眼鏡防偷拍妙招 (CNN Shorts 02:15)", "title_en": "Smart Glasses Privacy Hack (CNN Shorts 02:15)", "key_takeaways": "【影片詳細情境摘要】\nCNN 報導網路上流傳一項應對智慧眼鏡（如 Meta Ray-Ban）未經同意偷拍的新招數：如果你懷疑身邊有人正配戴智慧眼鏡對你進行錄影，可以在現場播放或哼唱『迪士尼版權歌曲』！因為社群平台的演算法與版權偵測技術會自動識別受版權保護的音訊，一旦對方將偷拍影片上傳至社群平台，該影片很可能會直接被系統下架或消音。Meta 同時向 CNN 表示已在 AI 智慧眼鏡鏡框上內建 LED 隱私提示燈，並嚴肅看待未經同意的偷拍行為。", "key_takeaways_en": "Summary: A viral trick to stop covert filming by smart glasses involves playing copyrighted Disney music so automated platform algorithms block the uploaded video.", "main_content": "• Smart glasses & Being filmed (智慧眼鏡與正在被錄影)\n• Privacy concern & Filming without consent (隱私隱憂與未經同意拍攝)\n• Copyrighted song & Detection technology (版權歌曲與偵測下架技術)\n• LED indicator light (鏡框拍攝提示指示燈)", "vocab_notes": ["Film without consent：未經同意擅自錄影/拍攝。", "Privacy concern：個人隱私隱憂與防範。", "Copyrighted content：受智慧財產權保護的內容。"], "vocab_notes_en": ["Film without consent: Record someone on video without permission.", "Privacy concern: Worry over violation of personal privacy.", "Copyrighted content: IP-protected audio/video material."], "next_week_tasks": ["💡 課堂討論預告：下週將針對『穿戴式 AI 裝置與個人隱私 (Privacy Concerns)』進行課堂分組討論，請準備好 1 個支持或反對在公共場合配戴智慧眼鏡的英文論點。"], "next_week_tasks_en": ["💡 Discussion Prep: Prepare 1 argument for/against wearing AI smart glasses in public."], "link": "https://youtube.com/shorts/H7qyXwntx08?si=zc6OtSPaJOuWMik9", "link_text": "開啟 CNN Smart Glasses 短片 (02:15)"}];

        const canvas = document.getElementById('drawCanvas');

        // 一鍵切換中英語言
        function toggleLanguage() {
            currentLang = (currentLang === 'zh') ? 'en' : 'zh';
            updateUIStrings();
            renderCard();
        }

        function updateUIStrings() {
            const t = i18nDict[currentLang];
            document.getElementById('langBtnText').innerText = t.langBtn;
            document.getElementById('penBtnText').innerText = t.penBtn;
            document.getElementById('undoBtnText').innerText = t.undoBtn;

            document.getElementById('tagMainContent').innerText = t.tagMainContent;

            document.getElementById('tagVocab').innerText = t.tagVocab;
            document.getElementById('tagTask').innerText = t.tagTask;
            document.getElementById('btnPrev').innerText = t.btnPrev;
            document.getElementById('btnNext').innerText = t.btnNext;

        function checkAppVersion() {
            fetch('./index.html?check=' + Date.now(), { cache: 'no-store' })
                .then(res => res.text())
                .then(html => {
                    const match = html.match(/const LOCAL_APP_VERSION = "([^"]+)";/);
                    if (match && match[1]) {
                        const remoteVersion = match[1];
                        if (remoteVersion !== LOCAL_APP_VERSION) {
                            const notice = document.getElementById('updateNotice');
                            if (notice) notice.style.display = 'block';
                        }
                    }
                })
                .catch(err => console.log('版本檢查略過:', err));
        }

        function forceReloadApp() {
            window.location.href = window.location.pathname + '?v=' + Date.now();
        }

        function cleanText(str) {
            if (!str) return '';
            return String(str).replace(/\]*\]/g, '').trim();
        }

        function resizeCanvas() {
            const card = document.getElementById('cardElement');
            const width = card.scrollWidth;
            const height = Math.max(card.scrollHeight, card.clientHeight);

            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            canvas.width = width;
            canvas.height = height;
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            const penBtn = document.getElementById('penBtn');
            const card = document.getElementById('cardElement');

            if (isPenMode) {
                penBtn.classList.add('active-pen');
                card.classList.add('canvas-active');
                resizeCanvas();
            } else {
                penBtn.classList.remove('active-pen');
                card.classList.remove('canvas-active');
            }
        }

        function saveSnapshot() {
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (undoStack.length > 25) undoStack.shift();
        }

        function undoLastStroke() {
            if (undoStack.length > 0) {
                const previousState = undoStack.pop();
                ctx.putImageData(previousState, 0, 0);
            } else {
                clearAllCanvas();
            }
        }

        function clearAllCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            undoStack = [];
        }

        function getExactCoords(e) {
            const card = document.getElementById('cardElement');
            const rect = card.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: clientX - rect.left + card.scrollLeft,
                y: clientY - rect.top + card.scrollTop
            };
        }

        function startDrawing(e) {
            if (!isPenMode) return;
            isDrawing = true;
            saveSnapshot();

            const coords = getExactCoords(e);
            lastX = coords.x;
            lastY = coords.y;
        }

        function draw(e) {
            if (!isDrawing || !isPenMode) return;
            if (e.cancelable) e.preventDefault();

            const coords = getExactCoords(e);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);
            ctx.strokeStyle = 'rgba(225, 29, 72, 0.85)';
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            lastX = coords.x;
            lastY = coords.y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        function renderMainContent(rawContent) {
            const container = document.getElementById('mainContentContainer');
            container.innerHTML = "";

            if (!rawContent) return;

            const text = cleanText(rawContent);
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const hasDialogue = lines.some(l => l.startsWith('A:') || l.startsWith('B:'));

            if (hasDialogue) {
                const dialogueBox = document.createElement('div');
                dialogueBox.className = 'dialogue-container';

                lines.forEach(line => {
                    if (line.startsWith('A:')) {
                        const row = document.createElement('div');
                        row.className = 'chat-bubble-row speaker-a';
                        row.innerHTML = `
                            <div class="speaker-avatar avatar-a">A</div>
                            <div class="chat-bubble-content">${line.substring(2).trim()}</div>
                        `;
                        dialogueBox.appendChild(row);
                    } else if (line.startsWith('B:')) {
                        const row = document.createElement('div');
                        row.className = 'chat-bubble-row speaker-b';
                        row.innerHTML = `
                            <div class="speaker-avatar avatar-b">B</div>
                            <div class="chat-bubble-content">${line.substring(2).trim()}</div>
                        `;
                        dialogueBox.appendChild(row);
                    } else {
                        const intro = document.createElement('div');
                        intro.style.fontSize = '14px';
                        intro.style.fontWeight = '700';
                        intro.style.color = '#64748b';
                        intro.style.margin = '4px 0';
                        intro.innerText = line;
                        dialogueBox.appendChild(intro);
                    }
                });
                container.appendChild(dialogueBox);
            } else {
                const plainBox = document.createElement('div');
                plainBox.className = 'content-plain-box';
                plainBox.innerText = text;
                container.appendChild(plainBox);
            }
        }

        function formatQuestionText(text) {
            let s = cleanText(text);
            s = s.replace(/\[\s*_{3,}\s*\]/g, '<span class="blank-line">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
            s = s.replace(/_{3,}/g, '<span class="blank-line">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
            return s;
        }

        function renderQuizAnswer(rawAnswer) {
            const text = cleanText(rawAnswer);
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const hasDialogue = lines.some(l => l.startsWith('A:') || l.startsWith('B:'));

            if (hasDialogue) {
                let html = '<div class="mini-dialogue-box">';
                lines.forEach(line => {
                    if (line.startsWith('A:')) {
                        html += `
                            <div class="mini-bubble-row mini-a">
                                <div class="mini-avatar av-a">A</div>
                                <div class="mini-content">${line.substring(2).trim()}</div>
                            </div>`;
                    } else if (line.startsWith('B:')) {
                        html += `
                            <div class="mini-bubble-row mini-b">
                                <div class="mini-avatar av-b">B</div>
                                <div class="mini-content">${line.substring(2).trim()}</div>
                            </div>`;
                    } else {
                        html += `<div style="font-size:13.5px;font-weight:700;color:#6b21a8;margin:4px 0;">${line}</div>`;
                    }
                });
                html += '</div>';
                return html;
            } else {
                return `<div class="quiz-ans-box">${text}</div>`;
            }
        }

        function toggleAnswer(btn) {
            const t = i18nDict[currentLang];
            const wrapper = btn.nextElementSibling;
            if (wrapper.style.display === 'block') {
                wrapper.style.display = 'none';
                btn.innerText = t.showAnsBtn;
            } else {
                wrapper.style.display = 'block';
                btn.innerText = t.hideAnsBtn;
            }
        }

        function initWeekOptions() {
            const selector = document.getElementById('weekFilter');
            selector.innerHTML = "";

            const weekMap = {};
            rawDatabase.forEach(item => {
                if (item.week && !weekMap[item.week]) {
                    weekMap[item.week] = item.class_date;
                }
            });

            const sortedWeeks = Object.keys(weekMap).sort();
            sortedWeeks.forEach(w => {
                const opt = document.createElement('option');
                opt.value = w;
                const dateStr = weekMap[w] ? ` (${weekMap[w]})` : '';
                opt.innerText = `${w.toUpperCase()}${dateStr}`;
                selector.appendChild(opt);
            });
        }

        function setTab(tabName, element) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const selectedWeek = document.getElementById('weekFilter').value;
            filteredPool = rawDatabase.filter(item => (item.week === selectedWeek) && (item.type === currentTab));
            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            const cardEl = document.getElementById('cardElement');
            cardEl.scrollTop = 0;
            clearAllCanvas();
            const t = i18nDict[currentLang];

            if (!filteredPool.length) {
                document.getElementById('categoryBadge').innerText = t.noData;
                document.getElementById('dateDisplay').innerText = "";
                document.getElementById('titleDisplay').innerText = t.noContent;
                document.getElementById('takeawaysSection').style.display = "none";
                document.getElementById('mainContentSection').style.display = "none";
                document.getElementById('quizSection').style.display = "none";
                document.getElementById('vocabSection').style.display = "none";
                document.getElementById('taskSection').style.display = "none";
                document.getElementById('linkSection').style.display = "none";
                document.getElementById('counterDisplay').innerText = "0 / 0";
                return;
            }

            const item = filteredPool[currentIndex];
            const badge = document.getElementById('categoryBadge');
            
            // 雙語分類
            const categoryText = (currentLang === 'en' && item.category_en) ? item.category_en : item.category;
            badge.innerText = cleanText(categoryText);
            
            if (item.category.includes("自學") || item.category.includes("Self-Study")) {
                badge.className = 'badge task-badge';
            } else if (item.type === 'media') {
                badge.className = 'badge media-badge';
            } else {
                badge.className = 'badge';
            }

            document.getElementById('dateDisplay').innerText = item.class_date ? ` • ${item.class_date}` : '';
            document.getElementById('counterDisplay').innerText = (currentIndex + 1) + " / " + filteredPool.length;

            // 雙語標題
            const titleText = (currentLang === 'en' && item.title_en) ? item.title_en : item.title;
            document.getElementById('titleDisplay').innerText = cleanText(titleText);

            // 雙語核心重點
            const tkSection = document.getElementById('takeawaysSection');
            const tkText = (currentLang === 'en' && item.key_takeaways_en) ? item.key_takeaways_en : item.key_takeaways;
            if (tkText) {
                tkSection.style.display = "block";
                document.getElementById('takeawaysDisplay').innerText = cleanText(tkText);
            } else {
                tkSection.style.display = "none";
            }

            // 學習內容
            const mcSection = document.getElementById('mainContentSection');
            if (item.main_content) {
                mcSection.style.display = "block";
                renderMainContent(item.main_content);
            } else {
                mcSection.style.display = "none";
            }

            // 雙語實戰練習題
            const quizSection = document.getElementById('quizSection');
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.innerHTML = "";
            if (item.practice_quiz && item.practice_quiz.length > 0) {
                quizSection.style.display = "block";
                item.practice_quiz.forEach(q => {
                    const qText = (currentLang === 'en' && q.question_en) ? q.question_en : q.question;
                    const ansText = (currentLang === 'en' && q.answer_en) ? q.answer_en : q.answer;

                    const qCard = document.createElement('div');
                    qCard.className = 'quiz-card';
                    qCard.innerHTML = `
                        <div class="quiz-q">${formatQuestionText(qText)}</div>
                        <button class="quiz-toggle-btn" onclick="toggleAnswer(this)">${t.showAnsBtn}</button>
                        <div class="quiz-ans-wrapper">
                            <div class="quiz-ans-title">${t.ansTitle}</div>
                            ${renderQuizAnswer(ansText)}
                        </div>
                    `;
                    quizContainer.appendChild(qCard);
                });
            } else {
                quizSection.style.display = "none";
            }

            // 雙語重點單字與注意事項
            const vbSection = document.getElementById('vocabSection');
            const vocabUl = document.getElementById('vocabDisplay');
            vocabUl.innerHTML = "";
            const vList = (currentLang === 'en' && item.vocab_notes_en) ? item.vocab_notes_en : item.vocab_notes;
            if (vList && vList.length > 0) {
                vbSection.style.display = "block";
                vList.forEach(note => {
                    const li = document.createElement('li');
                    li.innerText = cleanText(note);
                    vocabUl.appendChild(li);
                });
            } else {
                vbSection.style.display = "none";
            }

            // 雙語下週課堂任務
            const taskSection = document.getElementById('taskSection');
            const taskContainer = document.getElementById('taskContainer');
            taskContainer.innerHTML = "";
            const taskList = (currentLang === 'en' && item.next_week_tasks_en) ? item.next_week_tasks_en : item.next_week_tasks;
            if (taskList && taskList.length > 0) {
                taskSection.style.display = "block";
                taskContainer.innerHTML = cleanText(taskList.join('\n\n'));
            } else {
                taskSection.style.display = "none";
            }

            // 延伸資源按鈕
            const linkSection = document.getElementById('linkSection');
            const linkTag = document.getElementById('linkDisplay');
            if (item.link) {
                linkSection.style.display = "block";
                linkTag.href = item.link;
                linkTag.innerText = (currentLang === 'en') ? "🔗 " + t.openResBtn : "🔗 " + (cleanText(item.link_text) || t.openResBtn);
            } else {
                linkSection.style.display = "none";
            }

            setTimeout(resizeCanvas, 60);
        }

        function navigateCard(direction) {
            if (!filteredPool.length) return;
            currentIndex = (currentIndex + direction + filteredPool.length) % filteredPool.length;
            renderCard();
        }

        window.onload = () => {
            initWeekOptions();
            updateUIStrings();
            applyFilters();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
            checkAppVersion();
        };
    </script>
</body>
</html>
