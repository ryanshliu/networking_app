<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Networking English - AI Learning Suite (Version 1.9)</title>
    <style>
        :root {
            --primary: #4f46e5; --primary-soft: #eef2ff; --bg: #f8fafc; --card-bg: #ffffff;
            --text-title: #1e1b4b; --text-body: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0;
            --amber-bg: #fffbeb; --amber-border: #fef3c7; --amber-text: #b45309;
            --sky-bg: #f0f9ff; --sky-border: #e0f2fe; --sky-text: #0369a1;
            --emerald-bg: #ecfdf5; --emerald-border: #d1fae5; --emerald-text: #047857;
            --violet-bg: #faf5ff; --violet-border: #e9d5ff; --violet-text: #6b21a8;
            --bubble-a-bg: #ffffff; --bubble-a-border: #cbd5e1;
            --bubble-b-bg: #eef2ff; --bubble-b-border: #c7d2fe;
            --app-max-width: 480px;
        }
        @media (min-width: 640px) {
            :root { --app-max-width: 720px; }
            body { padding: 24px 20px !important; }
            h1 { font-size: 28px !important; }
            .card { padding: 30px 28px !important; max-height: 74vh !important; border-radius: 28px !important; }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); margin: 0; padding: 16px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }
        .app-layout { width: 100%; max-width: var(--app-max-width); display: flex; flex-direction: column; }
        #updateNoticeBanner {
            display: none; width: 100%; box-sizing: border-box; background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 1.5px solid #f59e0b; border-radius: 16px; padding: 10px 14px; margin-bottom: 12px;
            color: #92400e; font-size: 13.5px; font-weight: 700; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.15); animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .header { width: 100%; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 25px; font-weight: 800; color: var(--text-title); margin: 4px 0 2px 0; }
        .author-badge {
            display: inline-block; font-size: 12px; font-weight: 700; color: var(--primary);
            background-color: var(--primary-soft); padding: 3px 12px; border-radius: 12px; margin-bottom: 8px;
        }
        .main-mode-nav { display: flex; gap: 6px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; margin-bottom: 10px; }
        .main-mode-btn {
            flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 800; border: none; border-radius: 12px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .main-mode-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 3px 10px rgba(79, 70, 229, 0.15); }
        .pen-toolbar { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 14px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
        }
        .tool-btn.active-pen { background-color: #ffe4e6; border-color: #e11d48; color: #e11d48; }
        .filters { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        select {
            width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 15px; font-weight: 600;
            border-radius: 14px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none; margin-bottom: 8px;
        }
        .tab-group { width: 100%; box-sizing: border-box; display: flex; gap: 8px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 11px 6px; font-size: 15px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active { background: #ffffff !important; color: var(--primary) !important; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12); }
        .card-container { width: 100%; flex: 1; display: flex; flex-direction: column; position: relative; }
        .card {
            background-color: var(--card-bg); border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        #drawCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100; }
        .card.canvas-active #drawCanvas { pointer-events: auto; touch-action: none; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .badge.media-badge { background-color: #fef3c7; color: #92400e; }
        .badge.self-study-badge { background-color: #ffedd5; color: #c2410c; border: 1px solid #fed7aa; }
        .counter { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .title { font-size: 21px; font-weight: 800; color: var(--text-title); margin-bottom: 14px; line-height: 1.35; }
        .block-section { margin-bottom: 18px; text-align: left; }
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 12.5px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
        .tag-violet { background-color: var(--violet-bg); color: var(--violet-text); border: 1px solid var(--violet-border); }
        .block-desc { font-size: 15.5px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }

        .context-tag {
            display: inline-block; padding: 2px 9px; font-size: 12px; font-weight: 800; border-radius: 14px;
            margin: 1px 3px; letter-spacing: 0.2px; vertical-align: middle; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .tag-blue { background-color: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
        .tag-amber-badge { background-color: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
        .tag-purple { background-color: #f3e8ff; color: #7e22ce; border: 1px solid #e9d5ff; }
        .tag-green { background-color: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .tag-rose { background-color: #ffe4e6; color: #e11d48; border: 1px solid #fecdd3; }
        .tag-neutral { background-color: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

        .ipa-tag {
            color: #64748b; font-family: "Lucida Sans Unicode", "DejaVu Sans", "Segoe UI", sans-serif;
            font-size: 0.88em; font-weight: 600; background: transparent; border: none; padding: 0 2px; margin: 0 2px; display: inline;
        }

        .vocab-card-item {
            background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 16px; padding: 14px 16px;
            margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); display: flex; flex-direction: column; gap: 6px;
        }
        .vocab-head-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 16px; font-weight: 800; color: #1e1b4b; }
        .vocab-pos-tag { font-size: 13px; font-weight: 700; color: #64748b; font-style: italic; }
        .vocab-def-text { font-size: 14.5px; font-weight: 600; color: #334155; line-height: 1.5; margin-top: 2px; }
        .vocab-example-box {
            background-color: #f8fafc; border-left: 3.5px solid #4f46e5; border-radius: 0 8px 8px 0;
            padding: 8px 12px; font-size: 14px; color: #1e293b; line-height: 1.5; margin-top: 4px; font-weight: 500;
        }

        .task-card {
            background: #ffffff; border: 1.5px solid #a7f3d0; border-radius: 20px; padding: 18px 16px;
            margin: 18px 0; box-shadow: 0 6px 18px rgba(16, 185, 129, 0.08); text-align: left;
        }
        .task-card-header {
            display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; color: #047857;
            margin-bottom: 14px; border-bottom: 2px dashed #bbf7d0; padding-bottom: 10px;
        }
        .task-block {
            background: #f0fdf4; border: 1px solid #d1fae5; border-radius: 12px; padding: 12px 14px;
            margin-bottom: 10px; font-size: 14px; line-height: 1.7; color: #064e3b;
        }
        .task-block-title { font-weight: 800; color: #065f46; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }

        .dialogue-container { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .chat-bubble-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
        .chat-bubble-row.speaker-b { flex-direction: row-reverse; }
        .speaker-avatar {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; color: #ffffff; flex-shrink: 0; margin-top: 4px;
        }
        .speaker-avatar.avatar-a { background: #2563eb; }
        .speaker-avatar.avatar-b { background: #7c3aed; }
        .chat-bubble-content {
            max-width: 84%; padding: 11px 15px; border-radius: 16px; font-size: 15px; line-height: 1.55; font-weight: 600;
        }
        .speaker-a .chat-bubble-content { background-color: var(--bubble-a-bg); border: 1.5px solid var(--bubble-a-border); }
        .speaker-b .chat-bubble-content { background-color: var(--bubble-b-bg); border: 1.5px solid var(--bubble-b-border); }
        .chat-cn-trans { font-size: 13px; color: #64748b; margin-top: 4px; font-weight: 500; }

        .quiz-card { background-color: var(--violet-bg); border: 1.5px solid var(--violet-border); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
        .quiz-q { font-size: 15.5px; font-weight: 700; color: #4c1d95; line-height: 1.6; margin-bottom: 10px; }
        .quiz-toggle-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff; border: none; padding: 7px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer;
        }
        .quiz-ans-wrapper { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d8b4fe; }
        .quiz-ans-box {
            background: #ffffff; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #bbf7d0;
            font-size: 15px; color: #14532d; line-height: 1.65; white-space: pre-line; font-weight: 600;
        }

        .link-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-color); text-align: left; }
        .link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
            padding: 13px 18px; font-size: 15px; color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); text-decoration: none; font-weight: 700; border-radius: 14px;
        }

        .suite-scope-nav { display: flex; gap: 6px; background-color: #f1f5f9; padding: 4px; border-radius: 14px; margin-bottom: 10px; }
        .suite-scope-btn {
            flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 800; border: none; border-radius: 10px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .suite-scope-btn.active { background: #ffffff; color: var(--primary); }
        .suite-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .suite-btn {
            background: #ffffff; border: 1.5px solid #cbd5e1; padding: 10px 8px; border-radius: 14px;
            font-size: 13px; font-weight: 800; color: #334155; cursor: pointer; text-align: left;
        }
        .suite-btn.active { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
        .suite-panel { background: #ffffff; border: 1.5px solid var(--border-color); border-radius: 20px; padding: 18px; }

        .podcast-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #ffffff; padding: 20px 16px; border-radius: 20px; text-align: center;
        }
        .podcast-controls {
            display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 12px 0;
            background: rgba(0, 0, 0, 0.25); padding: 14px; border-radius: 16px;
        }
        .control-row { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 13.5px; color: #c7d2fe; }
        .accent-select { background: #ffffff; color: #1e1b4b; font-weight: 800; padding: 6px 10px; border-radius: 10px; border: none; }
        .podcast-play-btn {
            background: #10b981; color: #fff; border: none; padding: 13px 26px; border-radius: 24px;
            font-size: 15.5px; font-weight: 800; cursor: pointer;
        }
        .podcast-play-btn.playing { background: #ef4444 !important; }

        .nav-controls { width: 100%; display: flex; gap: 12px; margin-top: 12px; }
        .nav-btn { flex: 1; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; }
    </style>
</head>
<body>
    <div class="app-layout">
        <div id="updateNoticeBanner">
            <span>✨ 偵測到新版教材（Version 1.9）已發布！已完整收錄全週次影音與對話角色，無任何刪減。</span>
            <button onclick="dismissUpdateBanner()" style="background:transparent; border:none; color:#92400e; font-weight:800; cursor:pointer; font-size:16px;">✕</button>
        </div>

        <div class="header">
            <h1>Networking English</h1>
            <div class="author-badge">By Ryan Liu, Version 1.9</div>
            <div class="main-mode-nav">
                <button class="main-mode-btn active" onclick="switchAppMode('cards', this)">📚 學習卡片</button>
                <button class="main-mode-btn" onclick="switchAppMode('suite', this)">⚡ 8大學習模組</button>
                <button class="main-mode-btn" onclick="switchAppMode('exam', this)">📝 全真模擬考</button>
            </div>
            <div class="pen-toolbar">
                <button id="penBtn" class="tool-btn" onclick="togglePenMode()">🖍️ 細畫筆</button>
                <button class="tool-btn" onclick="undoLastStroke()">↩️ 復原</button>
                <button class="tool-btn" onclick="clearAllCanvas()">🗑️ 全清</button>
            </div>
        </div>

        <div id="viewCards">
            <div class="filters">
                <select id="weekFilter" onchange="applyFilters()">
                    <option value="week1">WEEK 1 (2026/08/12)</option>
                    <option value="week2">WEEK 2 (2026/08/19)</option>
                    <option value="week3">WEEK 3 (2026/09/02)</option>
                    <option value="week4">WEEK 4 (2026/09/09)</option>
                    <option value="week5">WEEK 5 (2026/09/16)</option>
                    <option value="week6">WEEK 6 (2026/09/23)</option>
                    <option value="week7">WEEK 7 (2026/09/30)</option>
                    <option value="week8" selected>WEEK 8 (2026/10/07)</option>
                </select>
                <div class="tab-group">
                    <button id="tabSentence" class="tab-btn active" onclick="setTab('sentence')">句型 / 文法</button>
                    <button id="tabMedia" class="tab-btn" onclick="setTab('media')">影音 / 自習</button>
                </div>
            </div>

            <div class="card-container">
                <div class="card" id="cardElement">
                    <canvas id="drawCanvas"></canvas>
                    <div>
                        <div class="card-header">
                            <div>
                                <span class="badge" id="categoryBadge">分類</span>
                                <span style="font-size: 12.5px; color: #64748b;" id="dateDisplay"></span>
                            </div>
                            <span class="counter" id="counterDisplay">1 / 1</span>
                        </div>
                        <div class="title" id="titleDisplay">載入中...</div>

                        <div class="block-section" id="takeawaysSection">
                            <div class="tag-title tag-amber">💡 核心重點說明</div>
                            <div class="block-desc" id="takeawaysDisplay"></div>
                        </div>

                        <div id="taskCardSection" style="display:none;"></div>

                        <div class="block-section" id="mainContentSection">
                            <div class="tag-title tag-sky">📖 學習內容與核心對話</div>
                            <div id="mainContentContainer"></div>
                        </div>

                        <div class="block-section" id="quizSection">
                            <div class="tag-title tag-violet">✍️ 課堂實戰練習與填空題</div>
                            <div id="quizContainer"></div>
                        </div>

                        <div class="block-section" id="vocabSection">
                            <div class="tag-title tag-emerald">📝 重點單字與注意事項</div>
                            <div id="vocabDisplayContainer"></div>
                        </div>
                    </div>

                    <div class="link-box" id="linkSection">
                        <a class="link-btn" id="linkDisplay" href="#" target="_blank" rel="noopener noreferrer">🔗 開啟延伸學習資源</a>
                    </div>
                </div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
                <button class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
            </div>
        </div>

        <div id="viewSuite" style="display: none;">
            <div class="suite-scope-nav">
                <button id="scopeCurrentBtn" class="suite-scope-btn active" onclick="setSuiteScope('current', this)">📌 當前選定週次</button>
                <button id="scopeAllBtn" class="suite-scope-btn" onclick="setSuiteScope('all', this)">🌐 全部課程大整合</button>
            </div>

            <div class="suite-grid">
                <button class="suite-btn active" onclick="loadSuiteTool('guide', this)">📖 速成指南</button>
                <button class="suite-btn" onclick="loadSuiteTool('socratic', this)">🏛️ 蘇格拉底問答</button>
                <button class="suite-btn" onclick="loadSuiteTool('forecaster', this)">🎯 考點預測 Top5</button>
                <button class="suite-btn" onclick="loadSuiteTool('confusion', this)">💡 盲點澄清器</button>
                <button class="suite-btn" onclick="loadSuiteTool('gap', this)">🔍 知識缺口診斷</button>
                <button class="suite-btn" onclick="loadSuiteTool('podcast', this)">🎙️ Audio Podcast</button>
            </div>

            <div class="suite-panel" id="suiteContentPanel"></div>
        </div>

        <div id="viewExam" style="display: none;">
            <div class="card" style="max-height: 75vh;">
                <h2 style="font-size: 20px; color: #1e1b4b; margin-top:0;">📝 Networking English 全真模擬檢測試卷</h2>
                <div id="examContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const database = [{"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "社交問候 (Greetings)", "title": "初次見面與熟人寒暄 (Greetings & Responses)", "key_takeaways": "【多益高頻句型與職場延伸】\n1. 詢問近況的道地句型：How is it going? / How are things with you?\n2. 萬用中性回答公式：Same old, same old. / Can not complain.\n3. 職場接人文化差異：美式 pick up someone ↔ 英式 collect someone。\n4. 接待禮儀：引導外賓入座請使用 Please be seated.", "main_content": "A: Hi, my name is John. Please be seated. And you are?\n（你好，我是約翰。請坐，請問您是？）\nB: I am Ryan. I am a new recruit from the IT department.\n（我是 Ryan，我是資訊部門的新進員工。）\nA: How is it going with your new project?\n（新專案進行得怎麼樣？）\nB: Pretty good. Can not complain.\n（挺好的，沒什麼好抱怨的。）\nA: I have got to go now to collect our client from the station. See ya!\n（我現在得去車站接客戶了，回頭見！）\nB: Sure! Catch up with you later!\n（好的，待會再聊！）", "vocab_notes": ["Collect someone (v. phr.) [英式用法]：接送某人。\n  例句：I need to *collect* my manager from the station.", "Recruit (n./v.) [職場高頻]：新進員工；招募。\n  例句：Anna is our latest *recruit*.", "Please be seated (句型) [商務禮儀]：請入座。"], "practice_quiz": [{"question": "【第 1 題】英式英語接送客戶：I need to _________ our client from the train station.", "answer": "✔ 填空解答：collect\n👉 整句回答：I need to collect our client from the train station."}], "link": "https://www.linkedin.com/pulse/18-ways-say-hello-english-thomas-spengler/", "link_text": "18 Ways to Say Hello in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "道別用語 (Goodbyes)", "title": "道別與核心文法規則 (Ways to Say Goodbye & Grammar)", "key_takeaways": "【多益高頻句型與文法規則】\n1. 職場非正式道別：Take it easy / Have a good one / See ya.\n2. 正式商務道別：It was a pleasure to see you / I look forward to our next meeting.\n3. 多益必考文法 Pro Tip：Look forward to + V-ing（to 是介系詞，後面接動名詞 V-ing 或名詞）。", "main_content": "A: I have got to get going now! I look forward to our next meeting.\n（我現在得告辭了！期待我們的下次會議。）\nB: Take it easy! Have a good one!\n（保重！祝你今天順心！）\nA: It was a pleasure to see you.\n（很高興見到您。）\nB: I look forward to seeing you soon in Kaohsiung.\n（期待很快在高雄與您見面。）", "vocab_notes": ["Look forward to + V-ing (phr.) [多益核心]：期待相會。\n  例句：I *look forward to collaborating* with your team.", "Take it easy (idiom) [口語高頻]：保重、放輕鬆。"], "practice_quiz": [{"question": "【第 1 題】請填入 see 的正確動詞形式：I look forward to _________ you at the conference.", "answer": "✔ 填空解答：seeing (V-ing)\n👉 整句回答：I look forward to seeing you at the conference."}], "link": "https://www.berlitz.com/blog/goodbye-english", "link_text": "81 Ways to Say Goodbye in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "影音自習 (BP 5.4.1 #1)", "title": "商務社交：巴黎抵達交通 (Business Partner 5.4.1 - Arrival)", "key_takeaways": "【抵達與路況詢問】\n1. 交通詢問：When did you arrive? / I flew in yesterday.\n2. 機場交通：Traffic from the airport was quite heavy.\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Julia arrives in Paris and updates colleagues on traffic delays.\n2. New Words Learned: Flew in (搭機抵達), Rush hour (尖峰時刻).\n3. Assignment: Inquire about an international visitor's commute.", "main_content": "A: When did you arrive in Paris, Julia?\n（Julia，妳什麼時候抵達巴黎的？）\nB: I flew here yesterday afternoon. Traffic from Charles de Gaulle airport was heavy!\n（我昨天下午搭飛機到的。從戴高樂機場過來的路上交通相當擁擠！）", "vocab_notes": ["Fly in (v. phr.)：搭機抵達。例句：Our consultants *flew in* this morning."], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "觀看 Business Partner 5.4.1 Arrival"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "影音自習 (BP 5.4.1 #2)", "title": "商務社交：住宿與會場動線 (Business Partner 5.4.1 - Hotel)", "key_takeaways": "【飯店位置與步行距離】\n1. 住宿詢問：Where are you staying? Do you like the hotel?\n2. 步行可達：It is within walking distance to the venue.\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Julia checks into a hotel located conveniently near the venue.\n2. New Words Learned: Compact (小巧緊湊的), Within walking distance (步行距離內).\n3. Assignment: Describe your hotel location to a foreign guest.", "main_content": "A: Where are you staying? Do you like your hotel?\n（妳住在哪裡？喜歡妳住的飯店嗎？）\nB: At the Mason Park Hotel. The room is compact but comfortable, and it is within walking distance to the venue.\n（住在梅森公園飯店。房間雖然小但很舒服，而且走路就能到會場。）", "vocab_notes": ["Venue (n.)：會場。例句：The exhibition *venue* is downtown."], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "觀看 Business Partner 5.4.1 Hotel"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "影音自習 (BP 5.4.1 #3)", "title": "商務社交：餐敘交流邀約 (Business Partner 5.4.1 - Dinner)", "key_takeaways": "【餐敘社交邀約】\n1. 邀約句型：Do you have plans for dinner tonight?\n2. 積極答應：Count me in! That sounds wonderful.\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Julia is invited by partners to a networking dinner.\n2. New Words Learned: Count me in (算我一份), Networking dinner (商務餐敘).\n3. Assignment: Extend a polite dinner invitation to a partner.", "main_content": "A: Do you have plans for dinner tonight? We would love to take you out.\n（妳今晚有安排晚餐嗎？我們很想請妳吃頓飯。）\nB: Count me in! That sounds wonderful. I look forward to catching up.\n（算我一份！聽起來太棒了。我很期待跟各位好好聊聊。）", "vocab_notes": ["Count me in (idiom)：算我一份。例句：Are you coming? — *Count me in!*"], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "觀看 Business Partner 5.4.1 Dinner"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "社交問候自學 (Greetings #4)", "title": "道地商務寒暄精選 (Casual & Formal Business Greetings - 03:00)", "key_takeaways": "【商務問候多樣性】\n區分 formal 與 casual 問候情境，避免陳腔濫調。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Comparing different greetings across international corporate cultures.\n2. New Words Learned: Small talk (閒聊客套), Icebreaker (破冰話題).\n3. Assignment: Practice two icebreaker questions for an audit reception.", "main_content": "A: How do you strike up a professional conversation with visiting auditors?\n（你如何與來訪的稽核員展開專業的商務對話？）\nB: Start with their journey or accommodation before moving into official topics.\n（先從對方的旅途或住宿情況聊起，再切入正式主題。）", "vocab_notes": ["Icebreaker (n.)：破冰活動/話題。例句：Use weather as an *icebreaker*."], "link": "https://www.youtube.com/watch?v=F3x9T8lK4Zc", "link_text": "觀看 Business Greetings Guide"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "道別用語自學 (Farewells #5)", "title": "得體商務道別與後續聯繫 (Polite Farewells & Follow-ups - 02:45)", "key_takeaways": "【優雅結束會談】\n在會議尾聲建立下次會議的期待感與明確行動項目。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Professional strategies to gracefully conclude meetings and set follow-up expectations.\n2. New Words Learned: Wrap up (圓滿結束), Follow-up (後續追蹤).\n3. Assignment: Write a formal concluding statement for an email.", "main_content": "A: What is the most effective way to conclude an initial client meeting?\n（結束初次客戶會議最有效的方式是什麼？）\nB: Reiterate your appreciation, summarize action items, and express eagerness to collaborate.\n（重申感謝、概述待辦事項，並表達對後續合作的期待。）", "vocab_notes": ["Wrap up (v. phr.)：結束總結。例句：Let's *wrap up* the meeting."], "link": "https://www.youtube.com/watch?v=QeR39_wX2p8", "link_text": "觀看 Polite Farewells in Business"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation #1)", "title": "地鐵直達與步行距離 (Subway Transit & Walking Distance)", "key_takeaways": "【飯店評估與地鐵直達】\n1. 描述步行與地鐵直達：The hotel is within walking distance。\n2. 無需轉車：You do not need to transfer.", "main_content": "A: The hotel is near the subway station and within walking distance.\n（飯店靠近地鐵站，而且步行即可抵達。）\nB: From the hotel, can I take the subway directly to the conference venue?\n（從飯店出發，我可以搭地鐵直達會議會場嗎？）\nA: Yes, you can take the Blue Line directly. You do not need to transfer.\n（可以，你可以直接搭藍線，完全不需要轉車。）", "vocab_notes": ["Within walking distance：步行可達。例句：The hall is *within walking distance*."], "practice_quiz": [{"question": "【第 1 題】步行距離：The hotel is within _________ distance.", "answer": "✔ 填空解答：walking\n👉 整句回答：The hotel is within walking distance."}], "link": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf", "link_text": "Minneapolis Skyway Map (PDF)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation #2)", "title": "飯店設施與小型聯誼 (Hotel Amenities & Get-Together)", "key_takeaways": "【休閒配備與聯誼】\n1. Amenities：飯店便利休閒配備。\n2. Get-together：小型聚會、聯誼會。", "main_content": "A: Are the hotel amenities suitable for an evening gathering?\n（飯店的設施適合用來辦晚間聚會嗎？）\nB: Yes, the hotel amenities are wonderful for an evening get-together!\n（可以，飯店的便利設施非常棒，很適合傍晚辦個小型聯誼聚會！）", "vocab_notes": ["Amenities (n. pl.)：便利設施。例句：Enjoy the hotel *amenities*."], "practice_quiz": [{"question": "【第 1 題】飯店設施單字：The hotel offers great _________.", "answer": "✔ 填空解答：amenities\n👉 整句回答：The hotel offers great amenities."}], "link": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf", "link_text": "Hotel Amenities Information"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation #3)", "title": "商務預訂與重聚 (Booking & Reunion)", "key_takeaways": "【差旅預約與會面】\n1. Reserve accommodations (預約住宿)。\n2. Annual reunion (年度團聚/聚會)。", "main_content": "A: Should we book the accommodations right away for the annual convention?\n（我們該立刻為年度大會預訂住宿嗎？）\nB: Definitely. It will also serve as a great reunion for our regional project leaders.\n（絕對要。這也能成為我們區域專案負責人的一場很棒的團聚重聚。）", "vocab_notes": ["Reunion (n.)：團聚、重聚。例句：An annual alumni *reunion*."], "practice_quiz": [{"question": "【第 1 題】團聚單字：The meeting felt like a warm _________.", "answer": "✔ 填空解答：reunion\n👉 整句回答：The meeting felt like a warm reunion."}], "link": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf", "link_text": "Convention Booking Guide"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "乘車禮儀自學 (Etiquette #1)", "title": "車廂通道與行李放置 (Passenger Etiquette: Clear Aisles - 02:43)", "key_takeaways": "【通道安全】\n行李與公事包切勿阻擋走道 (Keep aisles clear)。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: William Hanson explains how bulky bags block commuter flow.\n2. New Words: Aisle (走道), Obstruction (阻礙物).\n3. Assignment: Ask a colleague to clear the walkway politely.", "main_content": "A: Did you watch William Hanson's commuter etiquette advice?\n（你有看 William Hanson 的通勤禮儀建議嗎？）\nB: Yes! He highlighted that keeping luggage from blocking aisles is crucial for passenger safety.\n（看了！他強調避免行李阻擋走道對於乘客安全至關重要。）", "vocab_notes": ["Aisle (n.)：走道。例句：Keep train *aisles* clear."], "link": "https://www.youtube.com/watch?v=_MDYoFXqbIo", "link_text": "觀看 William Hanson Clear Aisles"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "乘車禮儀自學 (Etiquette #2)", "title": "車廂通話與耳機規範 (Passenger Etiquette: Headphone Courtesy)", "key_takeaways": "【避免擴音】\n語音通話務必戴耳機，尊重公共安寧。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Using speakerphones disrupts transit quietness.\n2. New Words: Speakerphone (擴音), Courtesy (禮貌).\n3. Assignment: Remind someone not to use speakerphone.", "main_content": "A: What did he say about telephone calls in public transit?\n（關於在大眾運輸上講電話，他是怎麼說的？）\nB: Always use headphones and never use the speakerphone; it is basic courtesy to respect others' personal space!\n（一定要用耳機，絕對不要開擴音；尊重他人的個人空間是基本禮貌！）", "vocab_notes": ["Courtesy (n.)：禮貌。例句：Act with *courtesy*."], "link": "https://www.youtube.com/watch?v=_MDYoFXqbIo", "link_text": "觀看 William Hanson Headphone Courtesy"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "乘車禮儀自學 (Etiquette #3)", "title": "先下後上秩序 (Passenger Etiquette: Alighting First)", "key_takeaways": "【先下後上】\n車門開啟時先讓車內乘客下車 (Alight first)。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Allowing passengers to exit first prevents carriage gridlock.\n2. New Words: Alight (下車), Board (登車).\n3. Assignment: State the boarding order clearly.", "main_content": "A: Why is allowing passengers to alight first so essential?\n（為什麼讓乘客先下車如此重要？）\nB: It creates physical space inside the carriage, allowing new passengers to board seamlessly.\n（這樣才能在車廂內騰出空間，讓新乘客順利上車。）", "vocab_notes": ["Alight (v.)：下車。例句：Allow commuters to *alight* first."], "link": "https://www.youtube.com/watch?v=_MDYoFXqbIo", "link_text": "觀看 William Hanson Alighting First"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "乘車禮儀自學 (Etiquette #4)", "title": "座位禮讓與個人界線 (Passenger Etiquette: Offering Seats)", "key_takeaways": "【禮讓座位與個人空間】\n留意周遭有需要的乘客，並維持適當身體距離。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Hanson explains the polite way to offer seats without causing embarrassment.\n2. New Words: Perimeter (界線周邊), Priority seat (博愛座).\n3. Assignment: Formulate a phrase to offer your seat.", "main_content": "A: How should one offer a seat gracefully?\n（如何優雅得體地讓座？）\nB: Simply make eye contact, smile, and gesture toward the seat without drawing unnecessary attention.\n（只要眼神接觸、微笑道歉並比出手勢引導入座，不必引起過多注視。）", "vocab_notes": ["Priority seat (n.)：博愛座。例句：Keep *priority seats* available."], "link": "https://www.youtube.com/watch?v=_MDYoFXqbIo", "link_text": "觀看 William Hanson Offering Seats"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "差旅自習 (Travel Transit #5)", "title": "美國各大地鐵轉乘指引 (Navigating US Subway Systems - 03:15)", "key_takeaways": "【美式地鐵辨識】\n看懂色線、快慢車 (Express vs. Local) 與轉乘指標。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Guide to understanding US subway line colors and transfer maps.\n2. New Words: Transfer (轉乘), Express line (快車線).\n3. Assignment: Explain how to transfer from Blue to Green line.", "main_content": "A: Are subway maps in Minneapolis easy to navigate for business travelers?\n（明尼阿波利斯的地鐵圖對商務差旅人士來說容易辨識嗎？）\nB: Yes, color-coded lines and clear skyway connections make transfers very intuitive.\n（是的，顏色區分的路線和清晰的空中走廊動線讓轉乘非常直觀。）", "vocab_notes": ["Color-coded (adj.)：以色彩標識的。例句：A *color-coded* rail map."], "link": "https://www.youtube.com/watch?v=kY3EpxLsmj4", "link_text": "觀看 US Subway Guide"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "工作職責描述 (Job Responsibilities #1)", "title": "部門分工職責句型 (Responsible for vs. In Charge of)", "key_takeaways": "【職責與例行公事】\n1. I am responsible for + V-ing/N。\n2. I am in charge of + V-ing/N。\n3. On Fridays, I usually review...", "main_content": "A: In Quality Assurance, I am responsible for final product release criteria and defect tracking.\n（在品保組，我負責最終產品放行標準與不良品追蹤。）\nB: In Sustainability, I am in charge of carbon footprint accounting and ESG supply-chain audits.\n（在永續管理部，我負責碳足跡盤查與供應鏈 ESG 稽核。）", "vocab_notes": ["Responsible for：負責……。例句：Ryan is *responsible for* process safety.", "In charge of：主管……。例句：Giselle is *in charge of* release criteria."], "practice_quiz": [{"question": "【第 1 題】職責介系詞：I am responsible _________ compliance audits.", "answer": "✔ 填空解答：for\n👉 整句回答：I am responsible for compliance audits."}], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/03-job-responsibilities", "link_text": "前往 BBC Work #03: Job Responsibilities"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "視訊會議排錯 (Job Responsibilities #2)", "title": "跨國視訊會議除錯金句 (You're on Mute & Audio Glitches)", "key_takeaways": "【視訊故障排除三金句】\n1. You're on mute (你靜音了)。\n2. Your audio is cutting out (聲音斷斷續續)。\n3. Could you adjust your output settings?", "main_content": "A: Scoti, sorry to interrupt, but you're on mute! Could you adjust your audio output settings?\n（Scoti，不好意思打斷你，你被靜音了！可以調整一下你的音訊輸出設定嗎？）\nB: Sorry about that, guys! My mic was muted and my audio was cutting out earlier. Loud and clear now!\n（抱歉大家！我的麥克風剛才靜音了，聲音一直斷斷續續。現在清晰大聲了！）", "vocab_notes": ["On mute：靜音狀態。例句：You are *on mute*.", "Cut out：聲音中斷。例句：Your voice is *cutting out*."], "practice_quiz": [{"question": "【第 1 題】提醒麥克風靜音：Sorry, you're on _________.", "answer": "✔ 填空解答：mute\n👉 整句回答：Sorry, you're on mute."}], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/03-job-responsibilities", "link_text": "前往 BBC Work #03: Video Calls"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "鑽石市場自學 (CNBC #1)", "title": "人造培育鑽石產能爆發 (Why Diamond Prices Fall - Part 1: Production)", "key_takeaways": "【培育鑽石技術突破】\n化學氣相沉積與高壓高溫技術讓寶石級鑽石產能大增。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Lab-grown technology floods the gem market at unprecedented scales.\n2. New Words: Synthetic (人造的), Deposition (沉積).\n3. Assignment: Describe how CVD diamond synthesis works.", "main_content": "A: Why are natural diamond prices tumbling across global retail markets?\n（為什麼全球零售市場上天然鑽石價格會大幅崩跌？）\nB: Because lab-grown diamond technology has advanced dramatically, making gems available at a fraction of the cost!\n（因為實驗室培育鑽石技術大幅進步，用極低的一小部分成本就能產出無瑕的寶石！）", "vocab_notes": ["At a fraction of the cost：僅需一小部分成本。例句：Produced *at a fraction of the cost*."], "link": "https://www.youtube.com/watch?v=xrg6QCGzQGc", "link_text": "觀看 CNBC: Diamond Price Drop #1"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "鑽石市場自學 (CNBC #2)", "title": "打破天然開採壟斷神話 (Why Diamond Prices Fall - Part 2: Cartels)", "key_takeaways": "【壟斷聯盟瓦解】\nDe Beers 傳統開採聯盟無法繼續掌控全球稀缺定價。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Traditional diamond monopolies lose control over wholesale commodity pricing.\n2. New Words: Cartel (企業壟斷聯盟), Monopoly (獨占).\n3. Assignment: Explain why diamond cartels are weakening.", "main_content": "A: Has the lab-grown boom permanently broken the mining cartel's pricing power?\n（培育鑽石的爆發是否已經永久瓦解了開採壟斷集團的定價權？）\nB: Yes, unlimited synthetic supply makes it impossible to artificially restrict availability.\n（沒錯，無限的合成供應讓人造稀缺性完全無法維持。）", "vocab_notes": ["Cartel (n.)：卡特爾/壟斷集團。例句：The international diamond *cartel*."], "link": "https://www.youtube.com/watch?v=xrg6QCGzQGc", "link_text": "觀看 CNBC: Diamond Cartels #2"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "鑽石市場自學 (CNBC #3)", "title": "新世代婚戒消費偏好轉變 (Why Diamond Prices Fall - Part 3: Consumers)", "key_takeaways": "【年輕消費者轉向】\n年輕世代偏好高性價比、無道德爭議的綠色培育鑽石。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Young couples prioritize affordability and conflict-free guarantees over mined prestige.\n2. New Words: Conflict-free (無衝突的), Ethical (合乎道德的).\n3. Assignment: List 2 reasons why Gen Z prefers lab diamonds.", "main_content": "A: Are younger consumers hesitant to buy lab-grown stones?\n（年輕消費者會對購買培育鑽石猶豫不決嗎？）\nB: Not at all. They prioritize conflict-free ethics and substantial cost savings for travel.\n（完全不會。他們更看重無衝突道德保證與省下來可供旅行的大筆預算。）", "vocab_notes": ["Ethical sourcing：道德採購。例句：Commitment to *ethical sourcing*."], "link": "https://www.youtube.com/watch?v=xrg6QCGzQGc", "link_text": "觀看 CNBC: Consumer Shift #3"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "鑽石市場自學 (CNBC #4)", "title": "培育鑽石批發價格崩跌 (Why Diamond Prices Fall - Part 4: Wholesale)", "key_takeaways": "【批發價格急墜】\n產能競賽導致培育鑽石批發價格亦出現劇烈價格戰。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Intense competition drives wholesale lab-grown stone prices lower each month.\n2. New Words: Wholesale (批發), Price war (價格戰).\n3. Assignment: Analyze the margins of retail versus wholesale diamonds.", "main_content": "A: Are lab-grown diamonds themselves subject to severe price drops?\n（培育鑽石本身是否也經歷嚴劇烈的價格走跌？）\nB: Absolutely. As production scales up globally, wholesale costs plummet rapidly.\n（完全沒錯。隨著全球產能擴充，批發成本正在急劇暴跌。）", "vocab_notes": ["Plummet (v.)：驟降暴跌。例句：Wholesale prices *plummeted*."], "link": "https://www.youtube.com/watch?v=xrg6QCGzQGc", "link_text": "觀看 CNBC: Wholesale Plunge #4"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "鑽石市場自學 (CNBC #5)", "title": "傳統珠寶品牌的轉型困境 (Why Diamond Prices Fall - Part 5: Legacy Brands)", "key_takeaways": "【精品品牌因應戰略】\n傳統頂級珠寶商如何在堅持天然與擁抱培育之間抉擇。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Legacy luxury jewelry houses wrestle with branding shifts amid synthetic disruption.\n2. New Words: Heritage (傳承), Diversification (多元化轉型).\n3. Assignment: Outline a pivot strategy for a heritage jeweler.", "main_content": "A: How are heritage luxury brands responding to synthetic competition?\n（傳統經典奢華品牌如何應對合成寶石的競爭？）\nB: Some launch separate lab-grown collections while others double down on rare natural provenance.\n（部分品牌推出獨立培育產品線，其他則加倍強調稀有天然產地傳承。）", "vocab_notes": ["Provenance (n.)：起源/出處證明。例句：Verify diamond *provenance*."], "link": "https://www.youtube.com/watch?v=xrg6QCGzQGc", "link_text": "觀看 CNBC: Legacy Brands #5"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "鑽石市場自學 (CNBC #6)", "title": "工業切削領域的科技應用 (Why Diamond Prices Fall - Part 6: Industrial Uses)", "key_takeaways": "【工業與半導體用途】\n超硬度培育鑽石晶圓在先進半導體散熱與切削工具的革命。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Beyond jewelry, cheap lab diamonds enable thermal management breakthroughs in chips.\n2. New Words: Thermal conductivity (導熱率), Substrate (基板).\n3. Assignment: Explain diamond applications in semiconductors.", "main_content": "A: Are lab diamonds only used in fashion jewelry?\n（培育鑽石只用在時尚珠寶上嗎？）\nB: Not at all. Their exceptional thermal conductivity makes them revolutionary for next-gen semiconductor chips.\n（完全不是。其極致導熱率讓它們在次世代半導體晶片散熱上具有革命性應用。）", "vocab_notes": ["Conductivity (n.)：傳導性。例句：High thermal *conductivity*."], "link": "https://www.youtube.com/watch?v=xrg6QCGzQGc", "link_text": "觀看 CNBC: Industrial Diamonds #6"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "鑽石市場自學 (CNBC #7)", "title": "鑑定證書與檢測科技演進 (Why Diamond Prices Fall - Part 7: Certification)", "key_takeaways": "【鑑定儀器辨識挑戰】\nGIA 與 IGI 鑑定機構如何利用光譜儀區分天然與培育鑽石。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Gemological institutes use laser spectroscopy to identify microscopic growth markers.\n2. New Words: Spectroscopy (光譜學), Inscription (雷射刻字).\n3. Assignment: Explain why microscopic laser inscription protects consumers.", "main_content": "A: Can jewelers distinguish lab diamonds with an ordinary loupe?\n（珠寶商用一般放大鏡能分辨培育鑽石嗎？）\nB: No, specialized laboratory spectrometers are required to analyze trace nitrogen impurities.\n（不行，必須使用專業實驗室光譜儀分析微量氮雜質。）", "vocab_notes": ["Spectrometer (n.)：光譜儀。例句：Calibrate the *spectrometer*."], "link": "https://www.youtube.com/watch?v=xrg6QCGzQGc", "link_text": "觀看 CNBC: Certification #7"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "鑽石市場自學 (CNBC #8)", "title": "未來十年奢侈品定價重塑 (Why Diamond Prices Fall - Part 8: Future Outlook)", "key_takeaways": "【市場終局預測】\n商品化（Commoditization）與奢侈品光環脫鉤的未來走勢。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Analysts predict diamonds will follow the path of synthetic pearls into accessible everyday goods.\n2. New Words: Commoditization (商品化大眾化), Demystify (去神話化).\n3. Assignment: Conclude the 10-year diamond price outlook.", "main_content": "A: What is the long-term outlook for diamond market valuations?\n（鑽石市場估值的長期展望是什麼？）\nB: Natural gems will be valued strictly as rare collectibles, while lab diamonds will dominate affordable luxury.\n（天然寶石將嚴格以稀有收藏品計價，而培育鑽石將主導大眾平價輕奢市場。）", "vocab_notes": ["Commoditization (n.)：商品化。例句：Avoid market *commoditization*."], "link": "https://www.youtube.com/watch?v=xrg6QCGzQGc", "link_text": "觀看 CNBC: Future Outlook #8"}, {"week": "week4", "class_date": "2026/09/09", "type": "sentence", "category": "諮詢建議與請益 (Asking for Advice #1)", "title": "向同仁請益與客戶風格 (Pick Brain & Domineering Clients)", "key_takeaways": "【請益與客戶風格剖析】\n1. Can I pick your brain for a minute?\n2. I'm all ears! Fire away.\n3. Domineering (強勢跋扈的)。", "main_content": "A: Can I pick your brain for a minute? Mateo has a reputation for being domineering in discussions.\n（能耽誤你一分鐘請教你的建議嗎？聽說 Mateo 在討論時作風非常跋扈強勢。）\nB: I'm all ears! Fire away. Mateo definitely loves to dominate the agenda.\n（我洗耳恭聽，請儘管說！Mateo 確實很喜歡主導議程。）", "vocab_notes": ["Pick someone's brain：向某人請教。例句：*Pick Ryan's brain* on safety.", "Domineering (adj.)：強勢專斷的。例句：A *domineering* tone."], "practice_quiz": [{"question": "【第 1 題】請教成語：Can I _________ your brain for a minute?", "answer": "✔ 填空解答：pick\n👉 整句回答：Can I pick your brain for a minute?"}], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/04-asking-for-advice", "link_text": "前往 BBC Work #04: Asking for Advice"}, {"week": "week4", "class_date": "2026/09/09", "type": "sentence", "category": "應對戰術策略 (Asking for Advice #2)", "title": "順勢而為與堅持立場 (Go With the Flow & Stand Ground)", "key_takeaways": "【談判策略平衡】\n1. Go with the flow (順其自然/順水推舟建立關係)。\n2. Stand one's ground (堅守工安合規底線)。", "main_content": "A: Should we push our proposals aggressively right from the start?\n（我們該從一開始就強勢推銷自己的方案嗎？）\nB: It is safer to go with the flow first to build rapport, but stand our ground when safety is discussed.\n（先順應局勢建立融洽關係會更穩當，但在討論到工安時必須堅守立場。）", "vocab_notes": ["Go with the flow：順勢而為。例句：*Go with the flow* first.", "Stand one's ground：堅守立場。例句：*Stand our ground* on rules."], "practice_quiz": [{"question": "【第 1 題】順勢而為：It is safer to go with the _________.", "answer": "✔ 填空解答：flow\n👉 整句回答：It is safer to go with the flow."}], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/04-asking-for-advice", "link_text": "前往 BBC Work #04: Negotiation Tact"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "職場心理自學 (Harvard #1)", "title": "應對強勢利害關係人：心理冷靜機制 (Difficult Stakeholders: Emotional Composure)", "key_takeaways": "【保持心理沉著】\n面對專斷客戶時避免防禦性反擊，深呼吸保持理性。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Harvard coaches demonstrate emotional de-escalation under aggressive scrutiny.\n2. New Words: Composure (冷靜沉著), Scrutiny (嚴密檢驗).\n3. Assignment: Describe how to remain calm under verbal pressure.", "main_content": "A: How should our engineering team react when a client becomes verbally domineering?\n（當客戶在言詞上變得強勢專斷時，我們的工程團隊該如何反應？）\nB: Maintain emotional composure and mirror their underlying concern without taking attacks personally.\n（保持情緒冷靜沉著，鏡像同理對方的核心訴求，切勿把言語攻擊個人化。）", "vocab_notes": ["Composure (n.)：沉著。例句：Maintain your *composure*."], "link": "https://www.youtube.com/watch?v=kY3EpxLsmj4", "link_text": "觀看 Dealing with Difficult Stakeholders #1"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "職場心理自學 (Harvard #2)", "title": "應對強勢利害關係人：積極鏡像傾聽 (Difficult Stakeholders: Active Mirroring)", "key_takeaways": "【鏡像傾聽法】\n重述客戶最後幾個關鍵字，讓對方感到被充分理解。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Mirroring technique establishes rapid empathy and disarms confrontational negotiators.\n2. New Words: Mirroring (鏡像反映), Disarm (化解敵意).\n3. Assignment: Practice mirroring a customer complaint.", "main_content": "A: How does active mirroring calm down an agitated stakeholder?\n（積極鏡像傾聽如何讓焦慮激動的利害關係人平靜下來？）\nB: Repeating their core phrasing confirms you are listening, which releases conversational tension instantly.\n（重述他們的核心詞句能確認你有在聆聽，從而立即釋放對話緊張感。）", "vocab_notes": ["Disarm (v.)：化解敵意/消除疑慮。例句：Mirroring *disarms* tension."], "link": "https://www.youtube.com/watch?v=kY3EpxLsmj4", "link_text": "觀看 Active Mirroring #2"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "職場心理自學 (Harvard #3)", "title": "應對強勢利害關係人：重塑對話框架 (Difficult Stakeholders: Reframing)", "key_takeaways": "【重塑對話框架】\n將指責轉化為探討共同專案目標的建設性問句。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Reframing turns blame-oriented exchanges into shared problem solving.\n2. New Words: Reframe (重塑框架), Constructive (建設性的).\n3. Assignment: Reframe an audit demand into an operational roadmap.", "main_content": "A: What is the benefit of reframing the conversation?\n（重新引導對話框架有什麼好處？）\nB: It shifts the focus from interpersonal friction to shared operational success.\n（它能把焦點從人際摩擦轉移到雙方共同的營運成功目標上。）", "vocab_notes": ["Reframe (v.)：重塑框架。例句：*Reframe* the objection."], "link": "https://www.youtube.com/watch?v=kY3EpxLsmj4", "link_text": "觀看 Reframing Difficult Conversations #3"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "職場心理自學 (Harvard #4)", "title": "應對強勢利害關係人：設定專業邊界 (Difficult Stakeholders: Boundary Setting)", "key_takeaways": "【設立不可妥協邊界】\n以法規與工程標準為依據，劃定不容退讓的安全邊界。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Professional tactics to decline scope creep without sounding defensive.\n2. New Words: Boundary (界線邊界), Non-negotiable (不可談判妥協的).\n3. Assignment: State a non-negotiable chemical safety requirement.", "main_content": "A: How do we tell a dominant partner 'no' without ending negotiations?\n（我們該如何在不終止談判的情況下對強勢夥伴說『不』？）\nB: Anchor your boundaries firmly in external compliance standards rather than personal choices.\n（將你的底線牢牢定錨於外部法規合規標準，而非個人主觀抉擇。）", "vocab_notes": ["Non-negotiable (adj.)：不可協商的。例句：Safety is *non-negotiable*."], "link": "https://www.youtube.com/watch?v=kY3EpxLsmj4", "link_text": "觀看 Setting Boundaries #4"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "職場心理自學 (Harvard #5)", "title": "應對強勢利害關係人：引導共同解方 (Difficult Stakeholders: Co-creating Solutions)", "key_takeaways": "【共同創造解決方案】\n邀請對方參與排程微調，增加其對妥協方案的主人翁意識。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Involving difficult partners in solution design creates collaborative ownership.\n2. New Words: Ownership (主導認同感), Compromise (妥協折衷).\n3. Assignment: Invite a client to co-create a delivery timeline.", "main_content": "A: Why is co-creating solutions better than presenting finished plans?\n（為什麼共同制定解方比直接呈現現成計畫更好？）\nB: Because clients rarely reject an idea they helped design themselves.\n（因為客戶很少會拒絕由他們自己參與設計的想法。）", "vocab_notes": ["Co-create (v.)：共同創造。例句：Let's *co-create* the roadmap."], "link": "https://www.youtube.com/watch?v=kY3EpxLsmj4", "link_text": "觀看 Co-creating Solutions #5"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "職場心理自學 (Harvard #6)", "title": "應對強勢利害關係人：事後跟進與關係修復 (Difficult Stakeholders: Post-meeting Bonding)", "key_takeaways": "【會後關係鞏固】\n會議結束後透過專業紀要落實共識，防範爭議死灰復燃。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Drafting precise meeting summaries locks down commitments from assertive clients.\n2. New Words: Summary memo (會議備忘錄), Alignment (對齊一致性).\n3. Assignment: Write a 2-sentence meeting summary confirmation.", "main_content": "A: What should be done immediately after a tense session with Mateo?\n（與 Mateo 結束緊張會議後該立刻做什麼？）\nB: Send a structured summary memo confirming mutual agreements before memories blur.\n（在記憶模糊之前，發送一份條理清晰的備忘錄確認雙方共識。）", "vocab_notes": ["Memo (n.)：備忘錄。例句：Circulate the *memo* promptly."], "link": "https://www.youtube.com/watch?v=kY3EpxLsmj4", "link_text": "觀看 Post-meeting Bonding #6"}, {"week": "week5", "class_date": "2026/09/16", "type": "sentence", "category": "異議與平衡反饋 (Balancing Feedback #1)", "title": "委婉異議與正反平衡 (Don't Get Me Wrong & A Real Plus)", "key_takeaways": "【平衡反饋核心句型】\n1. Don't get me wrong, but... (別誤會我的意思，但是……)。\n2. On the positive side, ... is a real plus (從正面看，這是一大加分)。\n3. Then again, ... (但話說回來)。", "main_content": "A: Don't get me wrong, Giselle, but I'm not convinced by taking such an aggressive stance.\n（別誤會我的意思，Giselle，但我並未被採取如此激進強硬的立場說服。）\nB: On the positive side, protecting QA standards is a real plus. Then again, outright refusal will leave both parties unhappy.\n（從正面來看，捍衛品保標準確實是一大加分項。但話說回來，斷然直接拒絕會搞得雙方都不高興。）", "vocab_notes": ["Don't get me wrong：別誤會我的意思。例句：*Don't get me wrong*, I agree.", "A real plus：一大加分。例句：Experience is *a real plus*."], "practice_quiz": [{"question": "【第 1 題】別誤會我：_________ get me wrong, but we need more review.", "answer": "✔ 填空解答：Don't\n👉 整句回答：Don't get me wrong, but we need more review."}], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/05-balancing-feedback", "link_text": "前往 BBC Work #05: Balancing Feedback"}, {"week": "week5", "class_date": "2026/09/16", "type": "sentence", "category": "異議與平衡反饋 (Balancing Feedback #2)", "title": "表達未被說服與折衷方案 (Not Convinced & Middle Ground)", "key_takeaways": "【尋求折衷句型】\n1. I'm not convinced by... (我並未被……說服)。\n2. Find middle ground (找到折衷點/中道)。", "main_content": "A: I'm not convinced by their proposal to shorten validation runs.\n（我並沒有被他們縮短驗證運轉週期的提議所說服。）\nB: Let's find middle ground that speeds up reporting while keeping chemical assays rigorous.\n（讓我們找到折衷點，在加快報告速度的同時維持化學檢測的嚴格度。）", "vocab_notes": ["Not convinced：未被說服。例句：The team was *not convinced*.", "Middle ground：折衷方案。例句：Seek common *middle ground*."], "practice_quiz": [{"question": "【第 1 題】尋求折衷：We must find middle _________.", "answer": "✔ 填空解答：ground\n👉 整句回答：We must find middle ground."}], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/05-balancing-feedback", "link_text": "前往 BBC Work #05: Middle Ground"}, {"week": "week5", "class_date": "2026/09/16", "type": "media", "category": "商務談判自學 (Negotiation #1)", "title": "商務外交措辭：開場肯定技巧 (Diplomatic Negotiation - Part 1: Validation)", "key_takeaways": "【肯定對方立論】\n提出反對前先肯定對方的商業初衷，降低防禦心態。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Validating supplier intentions creates psychological safety before dissenting.\n2. New Words: Validation (確認肯定), Disagreement (異議).\n3. Assignment: Validate a buyer's timeline concern before proposing a delay.", "main_content": "A: In cross-cultural negotiations, why is expressing blunt disagreement risky?\n（在跨文化談判中，為什麼直接生硬地表達反對是危險的？）\nB: Blunt refusal creates defensive walls; validating their intent first keeps negotiations productive.\n（生硬拒絕會築起心理防禦之牆；先肯定對方的用意能維持談判成效。）", "vocab_notes": ["Validate (v.)：認可/肯定。例句：*Validate* their concern first."], "link": "https://www.youtube.com/watch?v=XhR33ZJzT6g", "link_text": "觀看 Diplomatic Disagreement #1"}, {"week": "week5", "class_date": "2026/09/16", "type": "media", "category": "商務談判自學 (Negotiation #2)", "title": "商務外交措辭：提出數據反對 (Diplomatic Negotiation - Part 2: Evidence)", "key_takeaways": "【數據支撐的反對】\n以具體數據指標代替主觀感受，提升說服力。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Evidence-backed counterpoints protect negotiators from emotional escalations.\n2. New Words: Empirical (實證的), Counterpoint (反駁論點).\n3. Assignment: State an objection using batch failure statistics.", "main_content": "A: What makes an engineering objection sound truly professional?\n（是什麼讓工程上的異議聽起來真正具備專業水準？）\nB: Providing empirical safety data rather than expressing personal hesitation.\n（提供實證工安數據，而非表達個人的主觀猶豫。）", "vocab_notes": ["Empirical (adj.)：實證的。例句：*Empirical* evidence supports this."], "link": "https://www.youtube.com/watch?v=XhR33ZJzT6g", "link_text": "觀看 Evidence in Negotiation #2"}, {"week": "week5", "class_date": "2026/09/16", "type": "media", "category": "商務談判自學 (Negotiation #3)", "title": "商務外交措辭：結構化還價提案 (Diplomatic Negotiation - Part 3: Counteroffers)", "key_takeaways": "【結構化還價方案】\n提出 A/B 雙選項還價，讓客戶享有主動選擇權。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Crafting 2-tier counterproposals leads to faster contract sign-offs.\n2. New Words: Counteroffer (還價方案), Tiered (分層級的).\n3. Assignment: Create a 2-tier delivery counterproposal.", "main_content": "A: What is the most effective way to propose a counteroffer?\n（提出反建議最有效的方式是什麼？）\nB: Validate their target first, then present two balanced options so they choose without feeling cornered.\n（先肯定對方的目標，再提出兩個平衡的選項，讓他們在不感到被逼迫的情況下做出選擇。）", "vocab_notes": ["Counteroffer (n.)：還價/反提案。例句：Present a fair *counteroffer*."], "link": "https://www.youtube.com/watch?v=XhR33ZJzT6g", "link_text": "觀看 Counteroffers #3"}, {"week": "week5", "class_date": "2026/09/16", "type": "media", "category": "商務談判自學 (Negotiation #4)", "title": "商務外交措辭：化解談判僵局 (Diplomatic Negotiation - Part 4: Breaking Impasse)", "key_takeaways": "【打破僵局技巧】\n暫時擱置爭議條款，先行確認雙方已有共識的合作細節。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Parking contentious topics enables teams to maintain momentum on easier clauses.\n2. New Words: Impasse (僵局), Parking lot (擱置區待議事項).\n3. Assignment: Suggest parking an issue until legal review completes.", "main_content": "A: When talks stall over price, how do we regain momentum?\n（當談判因價格陷入停滯時，我們該如何重新找回推進動能？）\nB: Park the price clause temporarily and finalize quality specifications where alignment is high.\n（暫時擱置價格條款，先落實雙方高度一致的品質規格。）", "vocab_notes": ["Impasse (n.)：僵局。例句：Break the negotiation *impasse*."], "link": "https://www.youtube.com/watch?v=XhR33ZJzT6g", "link_text": "觀看 Breaking Impasse #4"}, {"week": "week5", "class_date": "2026/09/16", "type": "media", "category": "商務談判自學 (Negotiation #5)", "title": "商務外交措辭：非語言信號與肢體語言 (Diplomatic Negotiation - Part 5: Non-verbal Cues)", "key_takeaways": "【肢體語言管理】\n維持眼神接觸與開放式坐姿，傳遞坦誠專業的協商訊號。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Open posture and nodding project confidence during high-stakes corporate audits.\n2. New Words: Non-verbal (非語言的), Posture (姿勢態勢).\n3. Assignment: Identify two non-verbal cues that signal defensiveness.", "main_content": "A: Do non-verbal cues really affect international negotiation outcomes?\n（非語言信號真的會影響跨國談判結果嗎？）\nB: Tremendously. Crossing arms signals defensiveness, while leaning forward indicates collaborative intent.\n（影響非常深遠。交叉雙臂傳遞防禦心態，而身體前傾則表示協作意圖。）", "vocab_notes": ["Posture (n.)：體態/姿勢。例句：Maintain an open *posture*."], "link": "https://www.youtube.com/watch?v=XhR33ZJzT6g", "link_text": "觀看 Non-verbal Cues #5"}, {"week": "week5", "class_date": "2026/09/16", "type": "media", "category": "商務談判自學 (Negotiation #6)", "title": "商務外交措辭：達成雙贏協議 (Diplomatic Negotiation - Part 6: Win-Win Closure)", "key_takeaways": "【雙贏協議收尾】\n在合約簽署前再次確認雙方獲益點，鞏固長遠戰略夥伴關係。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Closing cross-border deals by emphasizing mutual benefits cements long-term trust.\n2. New Words: Win-win (雙贏的), Reciprocal (互惠的).\n3. Assignment: Draft a closing paragraph celebrating a reciprocal agreement.", "main_content": "A: How do we ensure both parties feel victorious upon concluding talks?\n（我們該如何確保雙方在會談結束時都感到互利雙贏？）\nB: Frame the final settlement around reciprocal gains in quality, sustainability, and reliability.\n（將最終合約定稿圍繞在品質、永續與穩定性上的互惠成果。）", "vocab_notes": ["Reciprocal (adj.)：互惠的。例句：A *reciprocal* partnership."], "link": "https://www.youtube.com/watch?v=XhR33ZJzT6g", "link_text": "觀看 Win-Win Closure #6"}, {"week": "week6", "class_date": "2026/09/23", "type": "sentence", "category": "商務委婉與客氣表達 (Softening English #1)", "title": "客氣請求與接送委託 (I Was Wondering If... & Car Lifts)", "key_takeaways": "【委婉請求句型】\n1. I was wondering if you could give me a lift (我在想能否順道載我一程)。\n2. Drop off (下車放行) vs. Pick up (接送)；It's not on my way (不順路)。", "main_content": "A: I was wondering if you could give me a lift to the high-speed rail station?\n（我在想你稍後是否能順道載我一程去高鐵站？）\nB: It's not really on my way, but I can drop you off at the main intersection!\n（那雖然不太順路，但我可以載你到大十字路口放你下車！）", "vocab_notes": ["Give someone a lift：載某人一程。例句：Can you *give me a lift*?"], "practice_quiz": [{"question": "【第 1 題】客氣請求載一程：I was _________ if you could give me a lift.", "answer": "✔ 填空解答：wondering\n👉 整句回答：I was wondering if you could give me a lift."}], "link": "https://www.bbc.co.uk/learningenglish/english/course/towards-advanced/unit-24/session-1", "link_text": "前往 BBC Master Class: Being Polite"}, {"week": "week6", "class_date": "2026/09/23", "type": "sentence", "category": "商務委婉與弱化觀點 (Softening English #2)", "title": "弱化個人觀點與三思而行 (I Reckon & Think Twice)", "key_takeaways": "【弱化主觀判斷】\n1. I reckon = I think / feel (我認為/我看)。\n2. Think twice (深思熟慮/三思而後行)。", "main_content": "A: I reckon taking out a second mortgage to buy volatile stocks is too impulsive; the bubble could burst!\n（我認為辦理二胎房貸去買波動劇烈的股票太衝動了，泡沫隨時可能破裂！）\nB: You seem to have a solid point there. I should definitely think twice and expand my network instead!\n（你說得似乎很有道理。我絕對應該三思而後行，轉而去拓展人脈才對！）", "vocab_notes": ["Think twice：三思而後行。例句：Engineers should *think twice* before overriding interlocks."], "practice_quiz": [{"question": "【第 1 題】三思而行成語：You should think _________ before investing.", "answer": "✔ 填空解答：twice\n👉 整句回答：You should think twice before investing."}], "link": "https://www.bbc.co.uk/learningenglish/english/course/towards-advanced/unit-24/session-1", "link_text": "前往 BBC Master Class: Reckon & Think Twice"}, {"week": "week6", "class_date": "2026/09/23", "type": "media", "category": "商業自學習題 (GMA #1)", "title": "電商零售退貨政策日趨嚴格 (Why Returns are Getting More Difficult - 02:06)", "key_takeaways": "【零售退貨政策轉嚴】\n探討無條件退貨成為歷史，消費者面臨標價震撼 (Sticker shock) 與細則限制。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Retailers slash generous return windows to combat return fraud and inflation.\n2. New Words: Sticker shock (標價震撼), A thing of the past (過往雲煙).\n3. Assignment: Draft a customer service notice outlining a restock fee.", "main_content": "A: Are hassle-free, no-questions-asked long return windows really a thing of the past?\n（那種免繁瑣手續、不問理由的超長退貨期限真的已經成為過往雲煙了嗎？）\nB: Absolutely! Retailers like Home Depot now enforce strict fine print policies. If you suffer sticker shock and lose your receipt, returns are nearly impossible!\n（完全沒錯！像家得寶這樣的零售商現在嚴格執行細則條款。如果你遭遇標價震撼又弄丟了購買憑證收據，幾乎不可能退貨！）", "vocab_notes": ["Sticker shock (n.)：標價震撼。例句：Shoppers got *sticker shock*."], "link": "https://www.youtube.com/watch?v=npZ_YNmoHkc&t=7s", "link_text": "觀看 GMA: Why Returns are Getting More Difficult"}, {"week": "week6", "class_date": "2026/09/23", "type": "media", "category": "科技巨擘專訪 (CBS #2)", "title": "輝達執行長黃仁勳專訪：AI 革命 (Jensen Huang on Artificial Intelligence - 05:45)", "key_takeaways": "【黃仁勳暢談 AI 與沙盒安全】\n黃仁勳駁斥 AI 末日流言，強調 AI 全天候待命，並需要沙盒防護。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Jensen Huang dismisses apocalyptic AI fears, advocating for continuous deployment safety.\n2. New Words: Clad in signature leather jacket (身著招牌經典皮衣), Go rogue (失控脫序).\n3. Assignment: Explain why AI sandboxes prevent rogue automated decisions.", "main_content": "A: Did Jensen Huang slam the rumor that unchecked AI will end humanity?\n（黃仁勳有大力駁斥不受約束的 AI 會毀滅人類的流言嗎？）\nB: Yes! Clad in his signature leather jacket, he acted as a true myth buster, explaining that AI operates around the clock at our service!\n（有的！身穿招牌皮衣的他宛如流言終結者，解釋 AI 是日以繼夜全天候聽候我們差遣的助手！）", "vocab_notes": ["Go rogue：失控脫序。例句：Ensure the system doesn't *go rogue*."], "link": "https://www.youtube.com/watch?v=EzKDGg99Qic", "link_text": "觀看 CBS: Jensen Huang on AI (YouTube)"}, {"week": "week6", "class_date": "2026/09/23", "type": "media", "category": "情境溝通演練 (BBC Master Class #3)", "title": "委婉語氣實戰情境演練 (Softening Your Language in Practice - 03:15)", "key_takeaways": "【委婉語氣實境訓練】\n使用過去進行式（I was wondering）給予對方心理緩衝空間。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Transforming blunt workplace demands into softened polite requests.\n2. New Words: Nuance (細微語意), Imposition (負擔強求).\n3. Assignment: Soften two direct commands into polite requests.", "main_content": "A: Why do native speakers say 'I was wondering if' instead of directly asking 'Can you'?\n（為什麼母語人士常用 'I was wondering if' 而非直接問 'Can you'？）\nB: Because past continuous softens the imposition, giving the listener psychological room to decline politely.\n（因為過去進行式能淡化強求語氣，給予對方心理空間委婉拒絕而不顯尷尬。）", "vocab_notes": ["Imposition (n.)：強人所難。例句：Pardon the *imposition*."], "link": "https://www.bbc.co.uk/learningenglish/english/course/towards-advanced/unit-24/session-1", "link_text": "觀看 BBC: Softening Language Practice"}, {"week": "week6", "class_date": "2026/09/23", "type": "media", "category": "出差差旅自學 (Business Travel #4)", "title": "商務出差機場租車與接送實務 (Car Rental & Airport Pickup Scenarios - 03:40)", "key_takeaways": "【出差租車與差旅津貼】\n確認日支費 (Per diem)、計程車費 (Cab fare) 與車損刮痕。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Navigating airport vehicle rental, corporate per diem, and inspection checklists.\n2. New Words: Per diem (日支津貼), Cab fare (計程車資).\n3. Assignment: Write a dialogue confirming travel reimbursement.", "main_content": "A: Did finance confirm whether our rental car insurance and toll pass are covered by corporate policy?\n（財務部有確認我們的租車保險和電子過路費是否全額包含在企業出差規範中嗎？）\nB: Yes, all cab fare, gas receipts, and official per diem expenses will be reimbursed promptly upon return.\n（有的，所有計程車資、加油收據與法定日支費都會在出差返回後立即核銷。）", "vocab_notes": ["Per diem (n.)：法定日支津貼。例句：Our daily *per diem* is verified."], "link": "https://www.youtube.com/watch?v=KzVb3s2p-4k", "link_text": "觀看 Business Travel Car Rental Scenarios"}, {"week": "week6", "class_date": "2026/09/23", "type": "media", "category": "供應鏈專題自學 (Supply Chain #5)", "title": "逆向物流成本與重新上架費 (Reverse Logistics & Restocking Fees - 04:10)", "key_takeaways": "【逆向物流成本侵蝕】\n退貨拆箱、檢驗與重上架大幅侵蝕利潤，催生重新上架手續費。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Supply chains implement restocking fees to offset massive reverse logistics costs.\n2. New Words: Reverse logistics (逆向物流), Restocking fee (重新上架手續費).\n3. Assignment: Explain the necessity of restocking fees.", "main_content": "A: Why has reverse logistics become the biggest headache for modern retail and industrial supply chains?\n（為什麼逆向物流成為現代零售與工業供應鏈最大的痛點？）\nB: Because unpacking, re-inspecting quality standards, and restocking returned stock erodes profit margins completely!\n（因為拆箱、重新檢驗品質標準與重新入庫會徹底侵蝕利潤率！）", "vocab_notes": ["Restocking fee (n.)：重上架費。例句：A 15% *restocking fee* is charged."], "link": "https://www.youtube.com/watch?v=FqH9U9q-WlU", "link_text": "觀看 Reverse Logistics & Restocking Fees"}, {"week": "week6", "class_date": "2026/09/23", "type": "media", "category": "旅遊防詐自學 (Consumer Travel #6)", "title": "避開觀光客陷阱與敲竹槓 (Avoiding Tourist Traps & Rip-offs - 03:50)", "key_takeaways": "【辨識觀光陷阱】\n避開無標價攤販，防止遭到暴利敲竹槓 (Rip-off)。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Detecting inflated tourist traps and avoiding street rip-offs.\n2. New Words: Tourist trap (觀光客陷阱), Rip-off (敲竹槓).\n3. Assignment: Warn a client against night market fruit scams.", "main_content": "A: What is the best way to help foreign audit clients avoid tourist traps and rip-offs in local markets?\n（幫助來訪外國稽核客戶避開當地市場觀光陷阱與敲竹槓的最佳方式是什麼？）\nB: Steer them toward reputable establishments with clear pricing, and tell them to walk away from vendors who don't display menus!\n（引導他們前往標價清楚的知名店家，並提醒他們遇到不標價的攤販就直接離開！）", "vocab_notes": ["Rip-off (n.)：敲竹槓。例句：That price is a total *rip-off*."], "link": "https://www.youtube.com/watch?v=kUq8V1A1m-M", "link_text": "觀看 Avoiding Tourist Traps & Rip-offs"}, {"week": "week7", "class_date": "2026/09/30", "type": "sentence", "category": "商務異議與腦力激盪 (Language for Disagreeing #1)", "title": "腦力激盪促銷與觀點協商 (The Brainstorm & Disagreeing)", "key_takeaways": "【BBC Work #10 腦力激盪精讀】\n1. 新品上市：Upcoming launch；Get together to + V。\n2. 強烈贊同：You can say that again! / I couldn't agree more!\n3. 陷入瓶頸：Hit a plateau (進入成長高原瓶頸期)；I caved in (我妥協讓步了)；Take me ages (耗費極長時間)。", "main_content": "A: Everyone, let's get together to brainstorm the upcoming launch of our citrus surfactant line!\n（各位，讓我們聚在一起為即將上市的柑橘界面活性劑產品線進行腦力激盪吧！）\nB: I'm not so sure about that marketing discount. If we make a special offer, we should make it so compelling that everyone will say yes!\n（我對那個行銷折扣持保留態度。如果我們要做特別優惠，就應該把它做得極具吸引力，讓每個人都願意買單！）\nA: You can say that again! I see your point, but finance might think it's too aggressive. What if we offer it in pairs to special VIP clients?\n（你說得太對了！我明白你的意思，但財務部可能會認為這太激進了。如果我們向特定 VIP 客戶提供專屬優惠呢？）\nB: I couldn't agree more! That hits the nail on the head. Let us agree on this strategy so we don't hit a plateau!\n（我完全同意！這切中了問題核心。讓我們在這項策略上達成協議，免得我們的新品推廣陷入瓶頸停滯期！）", "vocab_notes": ["Upcoming launch：即將到來的新品發表。例句：Preparing for the *upcoming launch*.", "You can say that again!：我完全同意！ 例句：'*You can say that again!*'", "Hit a plateau：進入高原停滯期。例句：Sales growth *hit a plateau*."], "practice_quiz": [{"question": "【第 1 題】想極度強烈地贊同對方的觀點：You can say that _________!", "answer": "✔ 填空解答：again\n👉 整句回答：You can say that again!"}], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/10-disagreeing", "link_text": "前往 BBC Work #10: The Brainstorm"}, {"week": "week7", "class_date": "2026/09/30", "type": "sentence", "category": "誤會化解與溝通重啟 (Explaining Misunderstandings #2)", "title": "誤會排解與責任釐清 (The Open Window & Mix-ups)", "key_takeaways": "【BBC Work #19 誤會化解精讀】\n1. 誤會委婉表達：There has been a bit of a mix-up (有點小搞混弄錯)。\n2. 文件滑落：It must've fallen off my desk；Hear me out (聽我把話說完)。\n3. 態度回應：I'm not bothered (我不在意/沒生氣)。", "main_content": "A: Why is the plant manager so upset about the unapproved audit report?\n（廠長為什麼對那份未經核可的稽核報告如此生氣？）\nB: I think there has been a bit of a mix-up! Anna wasn't meant to send the draft to headquarters.\n（我想這中間是有點小搞混弄錯了！Anna 原本不應該把草稿直接寄去總部的。）\nA: Let her explain what happened; hear her out!\n（讓她解釋發生了什麼事，聽她把話說完吧！）\nB: Exactly! The final revision must have fallen off her desk, but she came up with a rapid correction to leave an impressive first impression.\n（沒錯！最終修正版肯定是從她桌上滑落了，但她隨後立刻想出補救方案，依舊給客戶留下了深刻優異的第一印象。）", "vocab_notes": ["A bit of a mix-up：有點小搞混/差錯。例句：There was *a bit of a mix-up* in the paperwork.", "Hear me out：聽我把話說完。例句：Please *hear me out* before deciding."], "practice_quiz": [{"question": "【第 1 題】商務場合委婉表示作業上發生小搞混：Don't worry, there has just been a bit of a _________-_________.", "answer": "✔ 填空解答：mix-up\n👉 整句回答：Don't worry, there has just been a bit of a mix-up."}], "link": "https://www.bbc.com/learningenglish/persian/features/english-at-work/19-explaining-a-misunderstanding", "link_text": "前往 BBC Work #19: The Open Window"}, {"week": "week7", "class_date": "2026/09/30", "type": "media", "category": "乘車禮儀指定自學 (Video #1)", "title": "通勤禮儀四堂課 (Top 4 Passenger Etiquette Tips - 02:43)", "key_takeaways": "【大眾交通國際商務禮節】\nWilliam Hanson 講授四大通勤禮儀：先下後上、走道暢通、耳機通話、留意個人空間。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: William Hanson explains how small commuter courtesies maintain order and reduce transit tension.\n2. New Words: Alight (下車), Speakerphone (擴音通話), Situational awareness (情境警覺).\n3. Assignment: Remind a passenger to use headphones diplomatically.", "main_content": "A: William Hanson's etiquette tips on avoiding speakerphones in transit are so relevant!\n（William Hanson 關於大眾運輸工具上不要使用手機擴音的禮儀建議太切合實際了！）\nB: You can say that again! Conducting business calls on speakerphone during a train ride disrupts the whole car.\n（你說得太對了！在搭火車時開擴音講公事電話會打擾到整節車廂。）", "vocab_notes": ["Alight (v.)：下車。例句：Allow commuters to *alight* first."], "link": "https://www.youtube.com/watch?v=_MDYoFXqbIo", "link_text": "觀看 William Hanson Etiquette Tips"}, {"week": "week7", "class_date": "2026/09/30", "type": "media", "category": "原物料市場指定自學 (Video #2)", "title": "鑽石價格急劇崩跌真相 (Why Diamond Prices Are Falling So Fast - 04:25)", "key_takeaways": "【CNBC 深度原物料分析】\n實驗室培育人造鑽石產能爆發，打破傳統壟斷體系。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: CNBC explores the technological revolution collapsing legacy diamond pricing.\n2. New Words: Plunge (暴跌), Artificial rarity (人為稀缺), Disruption (顛覆).\n3. Assignment: Write three bullet points on commodity price disruption.", "main_content": "A: Has the rapid rise of lab-grown diamonds permanently disrupted the diamond mining cartel?\n（實驗室培育鑽石的迅速崛起是否已經永久顛覆了鑽石開採托拉斯壟斷？）\nB: Definitely. Young couples now see no rational reason to pay 5 times more for mined stones when lab-grown gems are identical down to the atomic level!\n（毫無疑問。年輕情侶現在覺得根本沒有理由花 5 倍以上的價格買開採鑽石，因為培育鑽石連原子結構都完全一樣！）", "vocab_notes": ["Plunge (v./n.)：暴跌。例句：Prices took a sharp *plunge*."], "link": "https://www.youtube.com/watch?v=xrg6QCGzQGc", "link_text": "觀看 CNBC: Why Diamond Prices Are Falling"}, {"week": "week7", "class_date": "2026/09/30", "type": "media", "category": "職場會議實境 (BBC Work #10)", "title": "腦力激盪與爭論情境重溫 (The Brainstorm - Episode #10 - 03:30)", "key_takeaways": "【Tip Top Trading 腦力激盪實況】\nTip Top Trading 業務部研討新品上市，示範不同程度的反對與贊成語句。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Sales colleagues argue over discount thresholds before Paul guides them to consensus.\n2. New Words: Threshold (門檻), Consensus (共識), Brainstorm (腦力激盪).\n3. Assignment: Express partial agreement with a colleague's plan.", "main_content": "A: During the brainstorm, did Anna agree with Tom's discount strategy?\n（在腦力激盪時，Anna 贊同 Tom 的折扣策略嗎？）\nB: Not entirely. She said: 'I see your point, but if we offer too high a discount, it will hurt our profit margins!'\n（不完全贊同。她說：『我明白你的意思，但如果折扣給太高，會傷到我們的獲利利潤！』）", "vocab_notes": ["Profit margin：獲利利潤率。例句：Protect our *profit margin*."], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/10-disagreeing", "link_text": "觀看 BBC Work #10: The Brainstorm"}, {"week": "week7", "class_date": "2026/09/30", "type": "media", "category": "職場誤會排除 (BBC Work #19)", "title": "開窗風波與誤會排解實境 (The Open Window - Episode #19 - 03:15)", "key_takeaways": "【Tip Top Trading 開窗誤會實況】\n合約隨風滑落引發失職誤會，團隊冷靜排解消除心結[, 2]。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Documents fly off a desk through an open window, prompting an administrative explanation[, 2].\n2. New Words: Mix-up (搞混), Hard feelings (芥蒂怨懟), Oversight (疏忽).\n3. Assignment: Explain an administrative delay without sounding defensive.", "main_content": "A: Did Paul get upset when he thought Anna didn't finish the contract?\n（當 Paul 以為 Anna 沒完成合約時，他生氣了嗎？）\nB: He was surprised, but Anna calmly explained: 'There's been a bit of a mix-up; it must've fallen off my desk!'\n（他很驚訝，但 Anna 冷靜地解釋：『這中間有點小誤會搞混了，文件肯定是從我桌上滑落了！』）", "vocab_notes": ["Hard feelings：芥蒂。例句：No *hard feelings* between us."], "link": "https://www.bbc.com/learningenglish/persian/features/english-at-work/19-explaining-a-misunderstanding", "link_text": "觀看 BBC Work #19: The Open Window"}, {"week": "week8", "class_date": "2026/10/07", "type": "sentence", "category": "認錯道歉與立場辯護 (Justifying Position)", "title": "承認疏失與委婉為立場辯護 (BBC Work #54: Eating Humble Pie)", "key_takeaways": "【BBC Work #54 承認錯誤與主管對談情境重點】[, 2]\n1. 核心成語：Eat humble pie 承認錯誤、低頭認錯賠罪[, 2]。\n2. 辦公室混亂與電話禮儀：\n   - Chaotic (adj.) 混亂脫序的 / Chaos (n.) 大混亂；Mess / Messy 雜亂的。\n   - Take a message (代接留言) vs. Leave a message (來電者留言)。\n   - Expect a phone call (預期接到來電)；Personal Hygiene 個人衛生。\n3. 文具與行動易混詞：\n   - Run out of (用光耗盡)；Stationery (文具，e for envelope) vs. Stationary (靜止不動的，a for anchor)。\n   - Hasty 倉促草率的（*Haste makes waste 欲速則不達*）。\n   - Reverse 翻轉撤銷 ➔ Reversible (可逆的) vs. Irreversible (不可逆的)。\n   - Awkward (尷尬彆扭的) vs. Embarrassing (令人難堪丟臉的)；Coward (懦夫膽小鬼)。\n   - 薪資調整：英式 Pay rise vs. 美式 Pay raise；First thing tomorrow (明早第一件事)。\n4. 責任歸屬與重啟聘用金句：\n   - You're the boss and I think the news is better coming from you. (你是主管，這消息由你親自傳達比較妥當)\n   - It was your decision in the first place, so you need to explain that the situation has changed. (當初是你做的決定，所以你必須親自解釋情況已變)\n   - This is your responsibility. (這是你的職責所在)\n   - I've been rethinking our staffing situation in the office. (我一直在重新思考辦公室的人力配置狀況)\n   - Sorry, I made a mistake. I miscalculated my staffing numbers. (抱歉，我犯了錯。我算錯了所需的人力數字)\n   - I would love to have you back in the office. (我非常希望你能重回辦公室工作)", "main_content": "A: The office has been completely chaotic since you slashed our personnel! We have run out of stationery and clients are furious.\n（自從你裁減我們的人員後，整個辦公室陷入了極度混亂！我們的文具都用光了，客戶也非常生氣。）\nB: I know, it's an awkward situation. It was a hasty decision, but is the damage reversible?\n（我知道，現在情況很尷尬。當初是倉促草率的決定，但這損害還有挽回逆轉的空間嗎？）\nA: You're the boss and this was your decision in the first place, so the news is better coming from you. This is your responsibility!\n（你是老闆，當初也是你做的決定，這消息由你親自去說比較好。這是你的責任！）\nB: Alright, I have to eat humble pie. First thing tomorrow, I will call Anna and say: 'Sorry, I made a mistake. I miscalculated our staffing numbers. I would love to have you back in the office!'\n（好吧，我只能低頭認錯賠罪了。明天一大早，我會親自打給 Anna 說：『抱歉，我犯了錯，算錯了人力配置。我非常希望你能重回辦公室上班！』）", "vocab_notes": ["Eat humble pie (idiom)：低頭認錯賠罪[, 2]。例句：He had to *eat humble pie*.", "Chaotic (adj.)：混亂脫序的。例句：The department was completely *chaotic*.", "Stationery vs. Stationary：文具（-ery 信封）↔ 靜止不動的（-ary 錨）。例句：Reorder office *stationery*.", "Irreversible (adj.)：不可逆的。例句：Prevent *irreversible* equipment damage.", "Hasty (adj.)：倉促草率的。例句：Avoid making *hasty* decisions."], "practice_quiz": [{"question": "【第 1 題】形容低頭認錯的英式成語：He had to eat _________ _________.[, 2]", "answer": "✔ 填空解答：humble pie\n👉 整句回答：He had to eat humble pie."}, {"question": "【第 2 題】填入正確文具拼法：We ran out of office _________ (文具：stationery 還是 stationary？).", "answer": "✔ 填空解答：stationery\n👉 整句回答：We ran out of office stationery."}], "link": "https://www.bbc.com/learningenglish/english/features/english-at-work/54-language-for-justifying-your-position", "link_text": "前往 BBC Work #54: Eating Humble Pie"}, {"week": "week8", "class_date": "2026/10/07", "type": "media", "category": "影集經典致歉 (Big Bang Theory #1)", "title": "謝爾頓向哥哥喬治道歉 (Sheldon Finally Apologized to His Brother George - 02:30)", "key_takeaways": "【影集致歉：放下傲慢】\n美劇《生活大爆炸》中 Sheldon 在婚禮前夕向哥哥 George 坦承過去的自私與不體貼。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Sheldon visits his estranged brother George to ask him to attend his wedding, confronting years of family resentment before delivering a heartfelt apology.\n2. New Words Learned: Estranged (疏遠冷戰的), Swallows his pride (放下身段驕傲), Overdue apology (遲來的道歉).\n3. Assignment Task: Formulate a sincere overdue apology to a colleague.", "main_content": "A: Why was it such a monumental moment when Sheldon apologized to George?\n（為什麼謝爾頓向哥哥喬治道歉是一個如此重大的時刻？）\nB: Because Sheldon had never acknowledged how much his family sacrificed for him. He ate humble pie and delivered a genuine apology!\n（因為謝爾頓從未承認過他的家人為他付出了多少犧牲。他放下了驕傲低頭認錯，給出了一段真誠的道歉！）", "vocab_notes": ["Overdue apology：遲來的道歉。例句：He offered an *overdue apology*."], "link": "https://www.youtube.com/watch?v=-zO0gN2_QyI", "link_text": "觀看 Sheldon Apologized to George (YouTube)"}, {"week": "week8", "class_date": "2026/10/07", "type": "media", "category": "喜劇公開致歉 (Big Bang Theory #2)", "title": "廣播公開道歉風波 (A Public Apology - The Big Bang Theory - 03:00)", "key_takeaways": "【公開致歉公關危機】\nSheldon 在廣播中不情願且居高臨下的道歉示範了如何適得其反 (Backfire)。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Sheldon makes a reluctant public on-air retraction after insulting a colleague, but his condescending tone causes an awkward PR backfire.\n2. New Words Learned: Condescending (居高臨下的), Insincere (缺乏誠意的), Backfire (適得其反).\n3. Assignment Task: Script a graceful public statement retracti
