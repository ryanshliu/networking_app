<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Networking English - AI Learning Suite</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #1e1b4b;
            --text-body: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --amber-bg: #fffbeb; --amber-border: #fef3c7; --amber-text: #b45309;
            --sky-bg: #f0f9ff; --sky-border: #e0f2fe; --sky-text: #0369a1;
            --emerald-bg: #ecfdf5; --emerald-border: #d1fae5; --emerald-text: #047857;
            --violet-bg: #faf5ff; --violet-border: #e9d5ff; --violet-text: #6b21a8;
            --bubble-a-bg: #ffffff; --bubble-a-border: #cbd5e1; --bubble-a-text: #0f172a;
            --bubble-b-bg: #eef2ff; --bubble-b-border: #c7d2fe; --bubble-b-text: #1e1b4b;
            --app-max-width: 460px;
        }
        @media (min-width: 640px) {
            :root { --app-max-width: 680px; }
            body { padding: 24px 20px !important; }
            h1 { font-size: 28px !important; }
            .card { padding: 28px 26px !important; max-height: 72vh !important; border-radius: 28px !important; }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); margin: 0; padding: 16px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }
        .app-layout { width: 100%; max-width: var(--app-max-width); display: flex; flex-direction: column; }
        .header { width: 100%; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 25px; font-weight: 800; color: var(--text-title); margin: 4px 0 2px 0; }
        .author-badge {
            display: inline-block; font-size: 12px; font-weight: 700; color: var(--primary);
            background-color: var(--primary-soft); padding: 3px 12px; border-radius: 12px; margin-bottom: 8px;
        }
        .main-mode-nav { display: flex; gap: 6px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; margin-bottom: 10px; }
        .main-mode-btn {
            flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 800; border: none; border-radius: 12px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .main-mode-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 3px 10px rgba(79, 70, 229, 0.15); }
        .pen-toolbar { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 12px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
        }
        .tool-btn.active-pen { background-color: #ffe4e6; border-color: #e11d48; color: #e11d48; }
        .filters { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        select {
            width: 100%; box-sizing: border-box; padding: 13px 16px; font-size: 16px; font-weight: 700;
            border-radius: 16px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none;
        }
        .tab-group { width: 100%; box-sizing: border-box; display: flex; gap: 8px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 11px 6px; font-size: 15px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12); }
        .card-container { width: 100%; flex: 1; display: flex; flex-direction: column; position: relative; }
        .card {
            background-color: var(--card-bg); border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        #drawCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100; }
        .card.canvas-active #drawCanvas { pointer-events: auto; touch-action: none; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .badge.media-badge { background-color: #fef3c7; color: #92400e; }
        .counter { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .title { font-size: 21px; font-weight: 800; color: var(--text-title); margin-bottom: 14px; line-height: 1.35; }
        .block-section { margin-bottom: 18px; text-align: left; }
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 12.5px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
        .tag-violet { background-color: var(--violet-bg); color: var(--violet-text); border: 1px solid var(--violet-border); }
        .block-desc { font-size: 15.5px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }
        
        .dialogue-container { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .chat-bubble-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
        .chat-bubble-row.speaker-b { flex-direction: row-reverse; }
        .speaker-avatar {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; color: #ffffff; flex-shrink: 0; margin-top: 4px;
        }
        .speaker-avatar.avatar-a { background: #2563eb; }
        .speaker-avatar.avatar-b { background: #7c3aed; }
        .chat-bubble-content {
            max-width: 82%; padding: 11px 15px; border-radius: 16px; font-size: 15.5px; line-height: 1.5; font-weight: 600;
        }
        .speaker-a .chat-bubble-content { background-color: var(--bubble-a-bg); border: 1.5px solid var(--bubble-a-border); }
        .speaker-b .chat-bubble-content { background-color: var(--bubble-b-bg); border: 1.5px solid var(--bubble-b-border); }
        
        .vocab-ul { margin: 0; padding-left: 20px; font-size: 15px; color: var(--text-body); line-height: 1.7; }
        .vocab-ul li { margin-bottom: 10px; line-height: 1.6; }
        .highlight-term { color: #3730a3 !important; font-weight: 800 !important; }
        .ipa-tag { color: #6d28d9; font-weight: 700; margin: 0 2px; }

        .quiz-card {
            background-color: var(--violet-bg); border: 1.5px solid var(--violet-border);
            border-radius: 18px; padding: 16px; margin-bottom: 12px;
        }
        .quiz-q { font-size: 15.5px; font-weight: 700; color: #4c1d95; line-height: 1.6; margin-bottom: 10px; }
        .blank-line { display: inline-block; min-width: 80px; border-bottom: 2.5px solid #7c3aed; margin: 0 4px; }
        .quiz-toggle-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff; border: none; padding: 7px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer;
        }
        .quiz-ans-wrapper { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d8b4fe; }
        .quiz-ans-box {
            background: #ffffff; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #bbf7d0;
            font-size: 15px; color: #14532d; line-height: 1.65; white-space: pre-line; font-weight: 600;
        }

        .link-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-color); text-align: left; }
        .link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
            padding: 13px 18px; font-size: 15px; color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            text-decoration: none; font-weight: 700; border-radius: 14px;
        }

        /* 8 大模式 UI */
        .suite-scope-nav { display: flex; gap: 6px; background-color: #f1f5f9; padding: 4px; border-radius: 14px; margin-bottom: 10px; }
        .suite-scope-btn {
            flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 800; border: none; border-radius: 10px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .suite-scope-btn.active { background: #ffffff; color: var(--primary); }
        .suite-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .suite-btn {
            background: #ffffff; border: 1.5px solid #cbd5e1; padding: 10px 8px; border-radius: 14px;
            font-size: 13px; font-weight: 800; color: #334155; cursor: pointer; text-align: left;
        }
        .suite-btn.active { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
        .suite-panel { background: #ffffff; border: 1.5px solid var(--border-color); border-radius: 20px; padding: 18px; }

        .podcast-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #ffffff; padding: 20px 16px; border-radius: 20px; text-align: center;
        }
        .podcast-controls {
            display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 12px 0;
            background: rgba(0, 0, 0, 0.25); padding: 14px; border-radius: 16px;
        }
        .control-row { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 13.5px; color: #c7d2fe; }
        .accent-select { background: #ffffff; color: #1e1b4b; font-weight: 800; padding: 6px 10px; border-radius: 10px; border: none; }
        .podcast-play-btn {
            background: #10b981; color: #fff; border: none; padding: 13px 26px; border-radius: 24px;
            font-size: 15.5px; font-weight: 800; cursor: pointer;
        }
        .podcast-play-btn.playing { background: #ef4444 !important; }

        .nav-controls { width: 100%; display: flex; gap: 12px; margin-top: 12px; }
        .nav-btn { flex: 1; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="header">
            <h1>Networking English</h1>
            <div class="author-badge">By Ryan Liu, V1.7</div>
            <div class="main-mode-nav">
                <button class="main-mode-btn active" onclick="switchAppMode('cards', this)">📚 學習卡片</button>
                <button class="main-mode-btn" onclick="switchAppMode('suite', this)">⚡ 8大學習模組</button>
                <button class="main-mode-btn" onclick="switchAppMode('exam', this)">📝 全真模擬考</button>
            </div>
            <div class="pen-toolbar">
                <button id="penBtn" class="tool-btn" onclick="togglePenMode()">🖍️ 細畫筆</button>
                <button class="tool-btn" onclick="undoLastStroke()">↩️ 復原</button>
                <button class="tool-btn" onclick="clearAllCanvas()">🗑️ 全清</button>
            </div>
        </div>

        <!-- 視圖 1: 學習卡片模式 -->
        <div id="viewCards">
            <div class="filters">
                <select id="weekFilter" onchange="applyFilters()"></select>
                <div class="tab-group">
                    <button id="tabSentence" class="tab-btn active" onclick="setTab('sentence')">句型 / 文法</button>
                    <button id="tabMedia" class="tab-btn" onclick="setTab('media')">影音 / 自習</button>
                </div>
            </div>

            <div class="card-container">
                <div class="card" id="cardElement">
                    <canvas id="drawCanvas"></canvas>
                    <div>
                        <div class="card-header">
                            <div>
                                <span class="badge" id="categoryBadge">分類</span>
                                <span style="font-size: 12.5px; color: #64748b;" id="dateDisplay"></span>
                            </div>
                            <span class="counter" id="counterDisplay">0 / 0</span>
                        </div>
                        <div class="title" id="titleDisplay">標題</div>

                        <div class="block-section" id="takeawaysSection">
                            <div class="tag-title tag-amber">💡 核心重點說明</div>
                            <div class="block-desc" id="takeawaysDisplay"></div>
                        </div>

                        <div class="block-section" id="mainContentSection">
                            <div class="tag-title tag-sky">📖 學習內容與核心對話</div>
                            <div id="mainContentContainer"></div>
                        </div>

                        <div class="block-section" id="quizSection">
                            <div class="tag-title tag-violet">✍️ 實戰練習題</div>
                            <div id="quizContainer"></div>
                        </div>

                        <div class="block-section" id="vocabSection">
                            <div class="tag-title tag-emerald">📝 重點單字與注意事項</div>
                            <ul class="vocab-ul" id="vocabDisplay"></ul>
                        </div>

                        <div class="block-section" id="taskSection">
                            <div class="tag-title tag-violet">🎯 下週課堂延續示範任務</div>
                            <div id="taskContainer" class="block-desc"></div>
                        </div>
                    </div>

                    <div class="link-box" id="linkSection">
                        <a class="link-btn" id="linkDisplay" href="#" target="_blank">🔗 開啟延伸閱讀與學習資源</a>
                    </div>
                </div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
                <button class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
            </div>
        </div>

        <!-- 視圖 2: 8 大特訓模組 -->
        <div id="viewSuite" style="display: none;">
            <div class="suite-scope-nav">
                <button id="scopeCurrentBtn" class="suite-scope-btn active" onclick="setSuiteScope('current', this)">📌 當前選定週次</button>
                <button id="scopeAllBtn" class="suite-scope-btn" onclick="setSuiteScope('all', this)">🌐 全部課程大整合</button>
            </div>

            <div class="suite-grid">
                <button class="suite-btn active" onclick="loadSuiteTool('guide', this)">📖 速成指南</button>
                <button class="suite-btn" onclick="loadSuiteTool('socratic', this)">🏛️ 蘇格拉底問答</button>
                <button class="suite-btn" onclick="loadSuiteTool('forecaster', this)">🎯 考點預測 Top5</button>
                <button class="suite-btn" onclick="loadSuiteTool('confusion', this)">💡 盲點澄清器</button>
                <button class="suite-btn" onclick="loadSuiteTool('gap', this)">🔍 知識缺口診斷</button>
                <button class="suite-btn" onclick="loadSuiteTool('podcast', this)">🎙️ Audio Podcast</button>
            </div>

            <div class="suite-panel" id="suiteContentPanel"></div>
        </div>

        <!-- 視圖 3: 全真模擬考卷 -->
        <div id="viewExam" style="display: none;">
            <div class="card" style="max-height: 75vh;">
                <h2 style="font-size: 20px; color: #1e1b4b; margin-top:0;">📝 Networking English 全真模擬檢測試卷</h2>
                <div id="examContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const rawDatabase = [{"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "社交問候 (Greetings)", "category_en": "Greetings & Small Talk", "title": "初次見面與熟人寒暄 (Greetings & Responses)", "title_en": "Greetings & Daily Catch-ups", "key_takeaways": "【多益高頻句型與職場延伸】\n1. 詢問近況的道地句型：How is it going? / How are things with you?\n2. 萬用中性回答公式：Same old, same old. / Pretty much the same. / Can't complain.\n3. 職場互動：catch up with someone (與某人敘舊)。", "key_takeaways_en": "Master natural casual updates and formal business greetings.", "main_content": "A: Hi, my name is John. Please be seated. And you are?\nB: I am Ryan. I am a new recruit from IT.\nA: How is it going?\nB: Pretty good. And you?\nA: Can not complain. Oops, I have got to go. See ya.\nB: Sure! Catch up with you later!", "vocab_notes": ["Recruit [rɪˈkrut (n./v.) [職場高頻：新進員工；招募。\n  例句：We have three new *recruits* in our department.", "Employee [ɪmˈplɔɪi (n.) [多益必考：員工。\n  例句：Every *employee* must wear an ID badge.", "Please be seated (句型) [正式場合：請入座。\n  例句：Ladies and gentlemen, *please be seated*.", "Catch up with someone (片語) [口語極高頻：與某人敘舊、聊近況。\n  例句：It was great to *catch up with you*.", "See ya (片語) [非正式：再見 (See you 的口語)。", "Pickup line (n.) [生活用語：搭訕用語。\n  例句：That is a terrible *pickup line*."], "vocab_notes_en": ["Recruit: A newly enlisted or hired person.", "Catch up: To talk to someone you have not seen for some time."], "practice_quiz": [{"question": "【填空題】同事問你 How is work going?，你想回答「老樣子，一切照舊」：\n_________ , _________ ! Pretty much the same.", "answer": "✔ 填空解答：Same old, same old"}], "instant_guide": {"core_concepts": ["1. 口語破冰開場與敘舊用語。"], "misconceptions": ["誤解：每次被問近況都只能回答 I am fine."], "exam_questions": ["Q1: 請寫出兩種信件開頭的專業問候語。"]}}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "影音自習 (Video Study)", "category_en": "Video Self-Study", "title": "商務社交情境：巴黎會面 (BP A2 5.4.1)", "title_en": "Business Socializing in Paris (BP A2 5.4.1)", "key_takeaways": "【多益高頻劇情與句型拆解】\n1. 詢問抵達與交通：When did you arrive? / I flew in yesterday.\n2. 表達臉部微表情 (Micro-expression)：他的臉部表情透露了別的意思 (His facial expression otherwise)。", "key_takeaways_en": "Summary: Julia arrives in Paris. Learn past tense for arrivals and facial expressions.", "main_content": "A: When did you arrive in Paris?\nB: I flew in yesterday afternoon. Traffic from the airport was heavy.\nA: Where are you staying?\nB: At the Mason Park Hotel. It is a 5-minute walk to the venue.\nA: Do you have plans for dinner tonight? Would you like to join us?\nB: Count me in!", "vocab_notes": ["Venue [ˈvɛnju (n.) [多益高頻：會場、舉辦地點。\n  例句：It is a 5-minute walk to the exhibition *venue*.", "Facial [ˈfeʃəl (adj.) [生活延伸：臉部的。\n  片語：Facial expression (臉部表情)。", "Micro-expression [ˈmaɪkroʊ ɪkˈsprɛʃən (n.)：微表情。\n  例句：You can tell he is lying from his *micro-expression*."], "vocab_notes_en": ["Venue: The place where an event happens.", "Facial expression: The look on someone's face."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U5L4_5.4.1.mp4", "link_text": "觀看 Business Partner 5.4.1 影片 (MP4)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "聽力與發音特訓 (Audio Study)", "category_en": "Audio Self-Study", "title": "展會心得聽力特訓與發音解析 (BP Workbook 5.5)", "title_en": "Trade Fair Impressions & Punctuation", "key_takeaways": "【聽力檢測與發音重點】\n1. 辨識抵達時間差異：Did Amy and Marta arrive on the same day?\n2. 標點符號的英文唸法：Dash (破折號 -), Hyphen (連字號 -), Underscore (底線 _)。", "key_takeaways_en": "Summary: Listen to trade fair impressions and learn punctuation marks in English.", "main_content": "A: What did Amy think about the conference center?\nB: She liked it. It is very accessible.\nA: I need to send her an email. What is her address?\nB: It is amy dash smith at email dot com.", "vocab_notes": ["Dash [dæʃ (n.) [發音必備：破折號 (—)。\n  例句：Please insert a *dash* here.", "Hyphen [ˈhaɪfən (n.) [發音必備：連字號 (-)。\n  例句：5-minute is a *hyphenated* word.", "Underscore [ˌʌndɚˈskɔr (n./v.) [發音必備：底線 (_)、強調。\n  例句：Her email has an *underscore* between her first and last name.", "Underline emphasize (v. phr.)：畫底線強調。"], "vocab_notes_en": ["Dash/Hyphen: Punctuation marks used to separate words or syllables.", "Underscore: A line drawn under a word or phrase for emphasis."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/BP_A2_WB_5_05.mp3", "link_text": "聆聽 Business Partner Workbook 5.5 音檔 (MP3)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "BBC 職場入門 (BBC Intro)", "category_en": "BBC Introduction", "title": "面試技巧與辦公室生存 (BBC English at Work Intro)", "title_en": "BBC English at Work: An Introduction", "key_takeaways": "【職場高頻單字與面試技巧】\n1. 公司背景：Tip Top Trading 是一家塑膠水果製造商 (Plastic fruit industry / sector)。\n2. 辦公室禁忌：不要偷聽別人說話 (Eavesdrop / overhear)。\n3. 面試金句：This job is an ideal match for my skills.", "key_takeaways_en": "Summary: Anna interviews at a plastic fruit company. Learn interview phrases and office dynamics.", "main_content": "A: Tell me about your company.\nB: We are in the plastic fruit sector. Our company is very prestigious and famous.\nA: I accidentally overheard the manager talking.\nB: It is inappropriate to eavesdrop on management meetings.", "vocab_notes": ["Eavesdrop [ˈivzˌdrɑp (v.) [職場高頻：偷聽、竊聽 (刻意去聽)。\n  例句：It is inappropriate to *eavesdrop* on other people's conversations.", "Overhear [ˌoʊvɚˈhɪr (v.) [多益常考：無意間聽到。\n  例句：I *overheard* them discussing the new project.", "Sector / Industry [ˈsɛktɚ (n.) [商務必備：產業、部門。\n  例句：He works in the plastic fruit *sector*.", "Prestigious [prɛˈstɪdʒəs (adj.) [進階單字：有聲望的、著名的 (Famous)。\n  例句：It is a very *prestigious* company."], "vocab_notes_en": ["Eavesdrop: Secretly listen to a conversation.", "Sector: An area of the economy."], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/english-at-work-intro", "link_text": "觀看 BBC English at Work Intro"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation)", "category_en": "Travel & Logistics", "title": "研討會住宿與在地美食推薦 (Accommodation & Recommendations)", "title_en": "Hotel Proximity & Food Recommendations", "key_takeaways": "【多益高頻句型與觀光推薦】\n1. 描述距離：near / close to (靠近), nearby (在附近)。\n2. 推薦句型：It is worth seeing / eating. (值得一看/一吃)。\n3. 觀光陷阱與敲竹槓：Beware of the tourist trap. It is a rip-off!", "key_takeaways_en": "Expressing walkability, direct transit, and recommending local food while avoiding tourist traps.", "main_content": "A: The hotel is close to the subway station.\nB: What food do you recommend here in Kaohsiung?\nA: I highly recommend Hakka dishes, rice noodle, roasted duck wrap, and mutton fried rice! They are very accessible and delicious cuisine.\nB: I heard the night market is great.\nA: Be careful with cut guava there, sometimes it is a tourist trap and a total rip-off!", "vocab_notes": ["Tourist trap [ˈtʊrɪst træp (n.) [觀光高頻：專坑遊客的地方 (相對詞：Tourist attraction 觀光勝地)。\n  例句：Do not buy souvenirs there; it is a *tourist trap*.", "Rip-off [ˈrɪp ˌɔf (n.) [口語高頻：敲竹槓、極度不合理的昂貴。\n  例句：NT$500 for cut guava? That is a *rip-off*!", "Accessible [ækˈsɛsəbəl (adj.) [多益必考：容易到達的、易取得的。\n  例句：The food court is easily *accessible* from the hotel.", "Cuisine [kwɪˈzin (n.) [生活單字：料理、菜餚。\n  例句：Taiwanese *cuisine* is famous worldwide.", "Out-of-towner (n.) [在地用語：外地人、非本地人。"], "vocab_notes_en": ["Tourist trap: A place that attracts and overcharges tourists.", "Accessible: Able to be reached or entered."], "practice_quiz": [{"question": "【單字選擇題】That restaurant overcharges tourists; it's a total _________ trap.\n(A) mouse (B) tourist (C) food", "answer": "✔ 解答：(B) tourist\n💡 解析：tourist trap 為固定用法，指敲竹槓的觀光陷阱。"}], "instant_guide": {"core_concepts": ["1. 大眾運輸直達與在地美食推薦。"], "misconceptions": ["誤解：將 tourist trap (陷阱) 與 tourist attraction (勝地) 搞混。"]}}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "BBC 職場自習 (BBC Networking)", "category_en": "BBC Networking Self-Study", "title": "商務社交實戰：Tip Top Trading (BBC #48)", "title_en": "Networking Face-to-Face (BBC #48)", "key_takeaways": "【多益高頻劇情與會議用字】\n1. 社交心法：Networking / socializing, Let’s get down to business. (開始談正事)。\n2. 辦公室抱怨與驚嘆用語：Sore loser (輸不起的人), Crumbs / My god (我的天啊), Bad news go down with them (他們無法接受這壞消息)。\n3. 影片單字：Biscuit / Cookie (餅乾), Mouldy / mold (發霉的), A wedge of cheese (一塊起司)。", "key_takeaways_en": "Summary: Anna attends a conference to network. Learn basic phrases to start talking business.", "main_content": "A: I heard you were in town! Let's do some networking and socializing.\nB: Smashing! I’ll give it a shot. Let’s get down to business.\nA: We need to sort this out. The company is serving mouldy cheese and biscuits!\nB: Crumbs! That is inappropriate.", "vocab_notes": ["Get down to business (idiom) [會議高頻：言歸正傳、切入正題。\n  例句：Enough small talk, let's *get down to business*.", "Sort this out (phr.) [多益高頻：解決問題、處理好。\n  例句：There is an issue with the invoice, we need to *sort this out*.", "Smashing / Amazing (adj.) [英式口語：極好的、了不起的。\n  例句：That was a *smashing* presentation!", "Inappropriate [ˌɪnəˈproʊpriɪt (adj.) [商務禮儀：不適當的、不得體的。\n  例句：It is *inappropriate* to wear jeans to a formal meeting."], "vocab_notes_en": ["Get down to business: To start focusing on the important task.", "Sort this out: To resolve a problem."], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/48-language-for-networking", "link_text": "前往 BBC #48 課程網頁 (收聽音檔與劇本)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "科技與隱私自習 (Tech & Privacy)", "category_en": "Tech & Privacy Self-Study", "title": "Passkey 原理與智慧眼鏡防偷拍 (BBC News & CNN)", "title_en": "Passkey Security & Smart Glasses Privacy Hack", "key_takeaways": "【自習任務：科技與資安單字】\n1. BBC News：探討 Passkey 技術如何透過生物辨識（Biometrics）與加密（Encryption）取代密碼，防止詐騙（Fraud）。\n2. CNN Shorts：探討智慧眼鏡的隱私侵犯（Harass / Copyright infringement）。", "key_takeaways_en": "Summary: Explore biometric passkeys, encryption, and privacy hacks against smart glasses.", "main_content": "• 科技與資安核心學習內容：\n1. Passkeys replace passwords with biometrics to prevent fraud. It relies on encryption.\n2. If someone tries to harass you or film you without consent, play a copyrighted song to cause copyright infringement and trigger takedowns.", "vocab_notes": ["Biometrics [ˌbaɪoʊˈmɛtrɪks (n.) [科技高頻：生物辨識技術。\n  例句：Phones use *biometrics* like fingerprints to identify users.", "Encryption [ɪnˈkrɪpʃən (n.) [IT資安必考：加密。\n  例句：Data *encryption* protects your personal information.", "Consent [kənˈsɛnt (n./v.) [商務法律：同意、許可。\n  例句：You cannot film people without their *consent*.", "Copyright infringement (n. phr.) [商務法律：侵犯著作權。\n  例句：Using that song in your video is *copyright infringement*.", "Fraud [frɔd (n.) [多益高頻：詐騙、欺詐。\n  例句：The bank stopped the transaction due to suspected *fraud*."], "vocab_notes_en": ["Encryption: The process of converting information into a code.", "Consent: Permission for something to happen."], "link": "https://www.youtube.com/watch?v=lf5L_1oqHDs", "link_text": "開啟 BBC Passkey 影片 (02:35)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "工作日常與職責 (Work Routine)", "category_en": "Work Routine & Duties", "title": "日常工作職責與頻率副詞 (What Do You Do? - BP Unit 1)", "title_en": "Work Routine & Frequency Adverbs (BP Unit 1)", "key_takeaways": "【多益高頻句型與職場延伸】\n1. 描述工作日常：介紹自己工作的日常、WFH (Work From Home)、Cycle to and from (騎車上下班)。\n2. 跨部門溝通：Resolve inter-departmental conflicts (解決跨部門衝突)。\n3. 專案管理：Track milestone (追蹤里程碑), Collect data, Figure, Number, Do the math (算一下/計算)。\n4. 頻率與時間副詞：Sometimes (有時候), Sometime (某個時候), Some time (一段時間)。", "key_takeaways_en": "Describing daily responsibilities, resolving conflicts, and using frequency adverbs correctly.", "main_content": "A: What do you do for a living?\nB: I am a Chief Executive Officer. I resolve inter-departmental conflicts and track project milestones.\nA: Do you commute or WFH?\nB: Sometimes I cycle to and from work. Let me collect the data and do the math for our budget.", "vocab_notes": ["Resolve [rɪˈzɑlv (v.) [多益必考：解決 (衝突/問題)。\n  例句：Managers need to *resolve inter-departmental conflicts*.", "Milestone [ˈmaɪlˌstoʊn (n.) [專案管理必備：里程碑、重要階段。\n  例句：We need to track every *milestone* of the project.", "Do the math (idiom) [口語高頻：算一下、計算。\n  例句：Look at these figures, just *do the math*.", "Sometime vs Sometimes vs Some time [易混淆字：\n  - Sometime (某個時候，未來或過去)。\n  - Sometimes (有時候，頻率)。\n  - Some time (一段時間)。"], "vocab_notes_en": ["Resolve: Firm determination to do something or settle a problem.", "Milestone: A significant stage or event in the development of something."], "practice_quiz": [{"question": "【單字填空題】請填入正確的商務頻率副詞（有時候）：\nI _________ WFH on Fridays.", "answer": "✔ 填空解答：sometimes (有時候)"}]}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "展會與會議談判 (Negotiation)", "category_en": "Trade Fair & Negotiation", "title": "規格需求詢問與議程目的 (Exploring Client Needs)", "title_en": "Exploring Client Needs & Agendas", "key_takeaways": "【多益高頻句型與會議延伸】\n1. 會議型態比較：Online meeting vs. Face-to-face meeting. 了解各自的 Pros (優點) and Cons (缺點)。\n2. 注意力管理：Get distracted easily (容易分心) vs. Concentrated easily (容易集中精神)。\n3. 議程與目的：Brief (簡報/摘要), Hidden agenda (隱藏的目的/不可告人的動機), Push one's agenda (推動某人的計畫)。", "key_takeaways_en": "Comparing online vs face-to-face meetings, pros and cons, and understanding meeting agendas.", "main_content": "A: What are the pros and cons of an online meeting?\nB: One of the cons is that people get distracted easily. Time consumption is also an issue.\nA: What about the new client?\nB: We need to be careful; he might have a hidden agenda and is just trying to push his agenda. Make sure he signs on the dotted line.", "vocab_notes": ["Pros and cons [proʊz ænd kɑnz (n. phr.) [多益高頻：優缺點、利弊。\n  例句：Let's discuss the *pros and cons* of WFH.", "Distract [dɪˈstrækt (v.) [多益必備：使分心。\n  片語：Get distracted easily (容易分心)。\n  例句：It is easy to *get distracted* during long online meetings.", "Agenda [əˈdʒɛndə (n.) [商務核心：議程、意圖。\n  片語：Hidden agenda (隱藏的意圖)。\n  例句：I suspect they have a *hidden agenda*.", "Sign on the dotted line (idiom) [商務口語：正式簽約。\n  例句：We finally got them to *sign on the dotted line*."], "vocab_notes_en": ["Pros and cons: Advantages and disadvantages.", "Hidden agenda: A secret or ulterior motive for something."], "practice_quiz": [{"question": "【填空題】我們要討論這個計畫的「優缺點」：\nWe need to discuss the _________ and _________ of the plan.", "answer": "✔ 填空解答：pros, cons"}]}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "線上會議工具與除錯 (Usherwood & Tripp)", "category_en": "Video Conferencing Issues", "title": "視訊會議常見問題與排解 (Troubleshooting Video Calls)", "title_en": "Video Conferencing Troubleshooting Guide", "key_takeaways": "【多益高頻文章與影音重點拆解】\n1. 視訊畫面問題：Frozen (畫面卡住), Grainy (畫質模糊/顆粒感), Glitch (小故障)。\n2. 聲音收音問題：You are on mute (你靜音了), Breaking up (聲音斷斷續續), Echo / feedback (回音), Static (雜音), On and off (斷斷續續), Get cut off (斷線)。\n3. 視訊會議其他用語：Pound key (井字鍵 #), Troll (網路酸民/搗亂者), Recap (總結/重新敘述)。", "key_takeaways_en": "Summary: Learn professional expressions for troubleshooting video glitches, static, and frozen screens.", "main_content": "• 實用視訊障礙排除對話：\nA: I can't hear you clearly. You are breaking up and there is static. Are you on mute?\nB: Oh, sorry. My screen was frozen. Let me reconnect.\nA: We got cut off. Please dial the number followed by the pound key.\nB: Let's do a quick recap before the connection drops again.", "vocab_notes": ["Static [ˈstætɪk (n.) [會議除錯：雜音、靜電干擾。\n  例句：There is a lot of *static* on the line.", "Frozen [ˈfroʊzən (adj.) [線上會議必備：凍結的、卡住的。\n  例句：Your screen is *frozen*.", "Grainy [ˈɡreɪni (adj.) [生活單字：畫質差的、有顆粒感的。\n  例句：The video quality is very *grainy*.", "Break up (v. phr.) [通訊用語：通訊斷斷續續。\n  例句：Sorry, you're *breaking up*. Could you repeat that?", "Recap [ˈrikæp (n./v.) [商務極高頻：總結、重述要點。\n  例句：Let's do a quick *recap* of today's meeting."], "vocab_notes_en": ["Static: Crackling or hissing noises on a telephone or radio.", "Recap: State again as a summary."],         let speechQueue = [], queueIndex = 0;
        function togglePodcastPlayback() {
            if (!('speechSynthesis' in window)) return;
            const btn = document.getElementById('podcastMainBtn');

            if (isPodcastPlaying) {
                window.speechSynthesis.cancel();
                isPodcastPlaying = false;
                if (btn) btn.innerText = "▶️ 開始雙人對話朗讀";
            } else {
                window.speechSynthesis.cancel();
                speechQueue = [];
                queueIndex = 0;

                const target = (suiteScope === 'all') ? rawDatabase : [filteredPool[currentIndex] || rawDatabase[0]];
                target.forEach(l => {
                    const lines = l.main_content.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                    lines.forEach(line => {
                        if (line.startsWith('A:')) speechQueue.push({ speaker: 'A', text: line.substring(2).trim() });
                        else if (line.startsWith('B:')) speechQueue.push({ speaker: 'B', text: line.substring(2).trim() });
                        else speechQueue.push({ speaker: 'narrator', text: line.replace(/[•-]/g, '').trim() });
                    });
                });

                if (!speechQueue.length) return;
                isPodcastPlaying = true;
                if (btn) btn.innerText = "⏹️ 停止播放";
                playNextInQueue();
            }
        }

        function playNextInQueue() {
            if (!isPodcastPlaying || queueIndex >= speechQueue.length) {
                isPodcastPlaying = false;
                const btn = document.getElementById('podcastMainBtn');
                if (btn) btn.innerText = "▶️ 開始雙人對話朗讀";
                return;
            }

            const item = speechQueue[queueIndex];
            const utter = new SpeechSynthesisUtterance(item.text);
            utter.rate = podcastRate;

            if (item.speaker === 'A') {
                if (speakerAVoice) utter.voice = speakerAVoice;
                utter.pitch = 0.82;
            } else if (item.speaker === 'B') {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.22;
            } else {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.0;
            }

            utter.onend = () => { queueIndex++; setTimeout(playNextInQueue, 160); };
            utter.onerror = () => { isPodcastPlaying = false; };
            window.speechSynthesis.speak(utter);
        }

                plain.style.padding = '14px';
                plain.style.borderRadius = '14px';
                plain.style.whiteSpace = 'pre-line';
                plain.innerText = rawContent;
                container.appendChild(plain);
            }
        }

        function formatVocabItem(rawText) {
            let text = String(rawText);
            text = text.replace(/\[([^\]]+)\]/g, '<span class="ipa-tag">[$1]</span>');
            text = text.replace(/\*([^*]+)\*/g, '<span class="highlight-term">$1</span>');
            return text.replace(/\n/g, '<br>');
        }

        function formatQuestionText(text) {
            let s = String(text);
            s = s.replace(/_{3,}/g, '<span class="blank-line">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
            return s;
        }

        function toggleAnswer(btn) {
            const wrapper = btn.nextElementSibling;
            if (wrapper.style.display === 'block') {
                wrapper.style.display = 'none';
                btn.innerText = '👁️ 顯示參考答案與示範';
            } else {
                wrapper.style.display = 'block';
                btn.innerText = '🙈 隱藏解答';
            }
        }

        function initWeekOptions() {
            const selector = document.getElementById('weekFilter');
            selector.innerHTML = "";
            const weekMap = {};
            rawDatabase.forEach(item => {
                if (item.week && !weekMap[item.week]) {
                    weekMap[item.week] = item.class_date || "2026";
                }
            });

            Object.keys(weekMap).sort((a, b) => {
                const numA = parseInt(a.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.replace(/\D/g, '')) || 0;
                return numA - numB;
            }).forEach(w => {
                const opt = document.createElement('option');
                opt.value = w;
                opt.innerText = `${w.toUpperCase()} (${weekMap[w]})`;
                selector.appendChild(opt);
            });
        }

        function setTab(tabName) {
            currentTab = tabName;
            updateTabButtonsUI();
            applyFilters();
        }

        function updateTabButtonsUI() {
            const btnSentence = document.getElementById('tabSentence');
            const btnMedia = document.getElementById('tabMedia');
            if (currentTab === 'sentence') {
                btnSentence.classList.add('active');
                btnMedia.classList.remove('active');
            } else {
                btnMedia.classList.add('active');
                btnSentence.classList.remove('active');
            }
        }

        function applyFilters() {
            const selectedWeek = document.getElementById('weekFilter').value;
            filteredPool = rawDatabase.filter(item => {
                const wMatch = String(item.week).trim().toLowerCase() === String(selectedWeek).trim().toLowerCase();
                const tMatch = String(item.type).trim().toLowerCase() === String(currentTab).trim().toLowerCase();
                return wMatch && tMatch;
            });
            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            const cardEl = document.getElementById('cardElement');
            cardEl.scrollTop = 0;

            if (!filteredPool.length) {
                document.getElementById('categoryBadge').innerText = (currentTab === 'media') ? "影音 / 自習" : "句型 / 文法";
                document.getElementById('categoryBadge').className = (currentTab === 'media') ? "badge media-badge" : "badge";
                document.getElementById('dateDisplay').innerText = "";
                document.getElementById('titleDisplay').innerText = "本分類尚無資料";
                document.getElementById('takeawaysSection').style.display = "none";
                document.getElementById('mainContentSection').style.display = "none";
                document.getElementById('quizSection').style.display = "none";
                document.getElementById('vocabSection').style.display = "none";
                document.getElementById('taskSection').style.display = "none";
                document.getElementById('linkSection').style.display = "none";
                document.getElementById('counterDisplay').innerText = "0 / 0";
                return;
            }

            const item = filteredPool[currentIndex];
            const badge = document.getElementById('categoryBadge');
            badge.innerText = item.category || "教材";
            badge.className = (item.type === 'media') ? "badge media-badge" : "badge";

            document.getElementById('dateDisplay').innerText = item.class_date ? ` • ${item.class_date}` : '';
            document.getElementById('counterDisplay').innerText = `${currentIndex + 1} / ${filteredPool.length}`;
            document.getElementById('titleDisplay').innerText = item.title || "";

            const tkSection = document.getElementById('takeawaysSection');
            if (item.key_takeaways) {
                tkSection.style.display = "block";
                document.getElementById('takeawaysDisplay').innerText = item.key_takeaways;
            } else {
                tkSection.style.display = "none";
            }

            document.getElementById('mainContentSection').style.display = "block";
            renderMainContent(item.main_content);

            const quizSection = document.getElementById('quizSection');
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.innerHTML = "";
            if (item.practice_quiz && item.practice_quiz.length > 0) {
                quizSection.style.display = "block";
                item.practice_quiz.forEach(q => {
                    const qCard = document.createElement('div');
                    qCard.className = 'quiz-card';
                    qCard.innerHTML = `
                        <div class="quiz-q">${formatQuestionText(q.question)}</div>
                        <button class="quiz-toggle-btn" onclick="toggleAnswer(this)">👁️ 顯示參考答案與示範</button>
                        <div class="quiz-ans-wrapper">
                            <div class="quiz-ans-box">${q.answer}</div>
                        </div>
                    `;
                    quizContainer.appendChild(qCard);
                });
            } else {
                quizSection.style.display = "none";
            }

            const vbSection = document.getElementById('vocabSection');
            const vocabUl = document.getElementById('vocabDisplay');
            vocabUl.innerHTML = "";
            if (item.vocab_notes && item.vocab_notes.length > 0) {
                vbSection.style.display = "block";
                item.vocab_notes.forEach(note => {
                    const li = document.createElement('li');
                    li.innerHTML = formatVocabItem(note);
                    vocabUl.appendChild(li);
                });
            } else {
                vbSection.style.display = "none";
            }

            const taskSection = document.getElementById('taskSection');
            const taskContainer = document.getElementById('taskContainer');
            if (item.next_week_tasks && item.next_week_tasks.length > 0) {
                taskSection.style.display = "block";
                taskContainer.innerText = item.next_week_tasks.join('\n\n');
            } else {
                taskSection.style.display = "none";
            }

            const linkSection = document.getElementById('linkSection');
            const linkTag = document.getElementById('linkDisplay');
            if (item.link) {
                linkSection.style.display = "block";
                linkTag.href = item.link;
                linkTag.innerText = "🔗 " + (item.link_text || "開啟延伸學習資源");
            } else {
                linkSection.style.display = "none";
            }
        }

        function navigateCard(dir) {
            if (!filteredPool.length) return;
            currentIndex = (currentIndex + dir + filteredPool.length) % filteredPool.length;
            renderCard();
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            document.getElementById('penBtn').classList.toggle('active-pen', isPenMode);
            document.getElementById('cardElement').classList.toggle('canvas-active', isPenMode);
        }

        function clearAllCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function undoLastStroke() { clearAllCanvas(); }

        window.onload = () => {
            initWeekOptions();
            updateTabButtonsUI();
            applyFilters();
        };
    </script>
</body>
</html>
