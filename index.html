inners, learning to *go with the flow* fosters long-term collaborative trust.", "Distilled spirits / wine [dɪˈstɪld ˈspɪrɪts] (n.) [餐飲文化]：蒸餾烈酒。\n  例句：Regional hospitality often includes offering customary local *distilled spirits* to visiting dignitaries.", "Backdrop [ˈbækˌdrɑp] (n.) [場景背景]：背景幕、歷史時代背景。\n  例句：The historic landmarks provided an enchanting *backdrop* for bilateral industrial negotiations.", "Warsaw [ˈwɔrsɔ] & Chopin [ˈʃoʊpæn] (n.) [歐洲人文]：華沙（波蘭首都）與蕭邦（波蘭鋼琴詩人名家）。\n  例句：Beata shared anecdotes about classical concerts in *Warsaw* honoring the legacy of *Chopin*."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_B1/Bus_Part_B1_U4L3_4.3.3.mp4", "link_text": "觀看 Business Partner B1 Video 4.3.3 (Option B) 影片 (MP4)"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "商務對話總結 (BP B1 4.3.4)", "title": "對話掌控與風格分析總結 (Managing Conversations: Conclusion)", "key_takeaways": "【商務溝通分析精讀】\n分析 Mateo 與 Beata 在文化、年齡、位階與個性上的顯著差異。總結在面對強勢主導風格 (Dominant style [ˈdɑmɪnənt staɪl]) 的長輩或客戶時，如何靈活調整自我議程以達成雙贏共識 (Consensus [kənˈsɛnsəs])。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: The video concludes by analyzing the significant differences in seniority, cultural expectations, and communication personalities between Mateo and Beata.\n   👉 Sentence 2: The expert explains that individuals with a dominant communication style view rigid agenda-pushing as an offensive power struggle.\n   👉 Sentence 3: Successful cross-cultural negotiators must blend interpersonal flexibility with long-term strategic objectives to secure lasting consensus.\n2. New Words Learned:\n   👉 Reference Answer: Dominant style (主導/強勢風格), Offend (冒犯/惹惱), Consensus building (建立共識), Strategic patience (戰略性耐心).\n3. Assignment Submission:\n   👉 Reference Answer: Write three sentences explaining whether you prefer a task-oriented or relationship-oriented approach when negotiating with international partners.", "main_content": "A: Why did the conclusion emphasize Mateo's dominant style?\n（為什麼總結分析會特別強調 Mateo 的強勢主導風格？）\nB: Because high-status clients expect respect; pushing your own agenda too early is often perceived as disrespectful.\n（因為位高權重的資深客戶期待被尊重；過早強推自己的既定議程往往會被視為不敬。）\nA: What is the golden takeaway?\n（最核心的收穫是什麼？）\nB: First build the relationship bridge, and then cross it to complete the business deal.\n（先搭建起信任的人際橋樑，再跨越它順利完成商業交易。）", "vocab_notes": ["Dominant style [ˈdɑmɪnənt staɪl] (n. phr.) [管理風格]：強勢主導型溝通風格。\n  例句：Managing an executive with a *dominant style* requires active listening rather than direct confrontation.", "Consensus [kənˈsɛnsəs] (n.) [商務決策]：共識、一致意見。\n  例句：After lengthy deliberation, the board reached a solid *consensus* on the capital expansion plan."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_B1/Bus_Part_B1_U4L3_4.3.4.mp4", "link_text": "觀看 Business Partner B1 Video 4.3.4 (Conclusion) 影片 (MP4)"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "社會經濟趨勢 (CBS News 02:10)", "title": "居住負擔危機與成年子女同住潮 (Adults Moving In with Parents)", "key_takeaways": "【經濟趨勢專題精讀】\nCBS News 報導美國在住房負擔能力危機 (Affordability crisis [əˌfɔrdəˈbɪləti ˈkraɪsɪs])、通膨與高利率夾擊下，越來越多年輕人選擇搬回與父母同住以節省租金開支。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: CBS News reports that escalating rental costs and macroeconomic inflation have forced an unprecedented number of young American adults to move back in with their parents.\n   👉 Sentence 2: The report highlights how steep home prices, student loan debts, and high mortgage rates prevent first-time buyers from achieving financial independence.\n   👉 Sentence 3: This demographic shift is reshaping traditional household dynamics and consumer spending patterns across the United States economy.\n2. New Words Learned:\n   👉 Reference Answer: Affordability crisis [əˌfɔrdəˈbɪləti ˈkraɪsɪs] (負擔能力危機), Multigenerational household (多代同堂家庭), Mortgage rate (房貸利率), Financial independence (財務獨立).\n3. Assignment Submission:\n   👉 Reference Answer: Write three sentences comparing the economic factors influencing young adults living with their parents in Taiwan versus the United States.", "main_content": "A: Why are so many young American adults moving back into their childhood bedrooms?\n（為什麼這麼多美國年輕成年人選擇搬回小時候住的房間與父母同住？）\nB: Severe housing affordability crises, combined with stubborn consumer inflation, leave them little alternative.\n（嚴峻的住房負擔危機加上難纏的消費通膨，讓他們幾乎別無選擇。）\nA: How does this impact consumer behavior?\n（這對消費者的日常支出行為造成了什麼影響？）\nB: It allows them to save on rental costs, though it delays major financial milestones like home ownership.\n（這讓他們能省下昂貴的租金支出，但同時也推遲了諸如購屋等重大財務里程碑。）", "vocab_notes": ["Affordability crisis [əˌfɔrdəˈbɪləti ˈkraɪsɪs] (n. phr.) [總體經濟]：可負擔能力危機。\n  例句：Skyrocketing housing prices have precipitated an acute *affordability crisis* in metropolitan regions."], "link": "https://www.youtube.com/watch?v=EmqHdzJ6BnA", "link_text": "觀看 CBS News: Adults Moving In with Parents (YouTube)"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "全球商業競爭 (CNBC 03:38)", "title": "美企在華競爭困境解析 (Why American Companies Struggle in China)", "key_takeaways": "【國際商業策略專題】\nCNBC 深度解析美國跨國企業在中國市場面臨的嚴峻競爭：本土品牌崛起、敏捷產品迭代 (Product iteration [ˌɪtəˈreɪʃən]) 速度、地緣政治摩擦以及消費者偏好 (Preference [ˈprɛfərəns]) 的轉變。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: CNBC investigates the growing operational headwinds confronting major American corporations operating within the Chinese domestic consumer market.\n   👉 Sentence 2: Domestic competitors have rapidly surpassed foreign brands by delivering ultra-fast product iterations, localized digital features, and competitive pricing.\n   👉 Sentence 3: Furthermore, escalating geopolitical tensions and nationalistic consumer preferences have intensified the urgency for foreign firms to rethink their Asian supply chains.\n2. New Words         const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const card = document.getElementById('cardElement');
            if (card && canvas) {
                canvas.width = card.clientWidth;
                canvas.height = card.clientHeight;
            }
        }

        function saveCanvasState() {
            if (undoStack.length > 15) undoStack.shift();
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        function undoLastStroke() {
            if (undoStack.length > 0) {
                const prevState = undoStack.pop();
                ctx.putImageData(prevState, 0, 0);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            document.getElementById('penBtn').classList.toggle('active-pen', isPenMode);
            document.getElementById('cardElement').classList.toggle('canvas-active', isPenMode);
            if (isPenMode) resizeCanvas();
        }

        function clearAllCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            undoStack = [];
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!isPenMode) return;
            isDrawing = true;
            saveCanvasState();
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.strokeStyle = '#e11d48';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !isPenMode) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        });

        canvas.addEventListener('pointerup', () => { isDrawing = false; });

        // ==================== 視覺標籤與文字著色引擎 (柔和音標) ====================
        function formatFormattedText(rawText) {
            let text = String(rawText);

            // 1. 處理國際音標：以極簡低調字體融入行文，不加任何框線與外皮
            text = text.replace(/\[([^\[\]]*[ˈˌəɪæʊʌθðʃʒŋɑɔɒ][^\[\]]*)\]/g, '<span class="ipa-tag">/$1/</span>');

            // 2. 通用情境膠囊標籤
            text = text.replace(/\[([^\[\]]+)\]/g, function(match, content) {
                let lower = content.toLowerCase();
                if (lower.includes('英式') || lower.includes('交通')) {
                    return '<span class="context-tag tag-blue">' + content + '</span>';
                } else if (lower.includes('美式') || lower.includes('警示')) {
                    return '<span class="context-tag tag-amber-badge">' + content + '</span>';
                } else if (lower.includes('管理') || lower.includes('風格') || lower.includes('性格') || lower.includes('特質') || lower.includes('思維')) {
                    return '<span class="context-tag tag-purple">' + content + '</span>';
                } else if (lower.includes('多益') || lower.includes('核心') || lower.includes('商業') || lower.includes('商務') || lower.includes('財經') || lower.includes('經濟') || lower.includes('會計') || lower.includes('總體')) {
                    return '<span class="context-tag tag-green">' + content + '</span>';
                } else if (lower.includes('高頻') || lower.includes('口語') || lower.includes('情緒') || lower.includes('談判') || lower.includes('社交') || lower.includes('過渡')) {
                    return '<span class="context-tag tag-rose">' + content + '</span>';
                } else {
                    return '<span class="context-tag tag-neutral">' + content + '</span>';
                }
            });

            // 粗體星號轉紫色強調
            text = text.replace(/\*([^*]+)\*/g, '<span class="highlight-term">$1</span>');
            return text.replace(/\n/g, '<br>');
        }

        // ==================== 重點單字革新排版 (卡片式條目) ====================
        function renderVocabCardItem(rawText) {
            let text = String(rawText).trim();
            let exampleText = "";
            
            // 提取例句部分
            if (text.includes("例句：") || text.includes("例句:")) {
                let parts = text.split(/例句[：:]/);
                text = parts[0].trim();
                exampleText = parts[1].trim();
            }

            // 解析詞性 (v.), (n.), (phr.), (adj.)
            let posMatch = text.match(/\((v\.|n\.|adj\.|adv\.|phr\.|idiom|句型)[^\)]*\)/i);
            let posTagHtml = "";
            if (posMatch) {
                posTagHtml = `<span class="vocab-pos-tag">${posMatch[0]}</span>`;
                text = text.replace(posMatch[0], "").trim();
            }

            // 提取中文解釋（以冒號區分）
            let mainTerm = text;
            let defText = "";
            if (text.includes("：") || text.includes(":")) {
                let colonParts = text.split(/[：:]/);
                mainTerm = colonParts[0].trim();
                defText = colonParts.slice(1).join("：").trim();
            }

            return `
                <div class="vocab-card-item">
                    <div class="vocab-head-row">
                        <span>${formatFormattedText(mainTerm)}</span>
                        ${posTagHtml}
                    </div>
                    ${defText ? `<div class="vocab-def-text">${formatFormattedText(defText)}</div>` : ''}
                    ${exampleText ? `<div class="vocab-example-box"><strong>例句：</strong>${formatFormattedText(exampleText)}</div>` : ''}
                </div>
            `;
        }

        // ==================== Your Tasks 美化結構化渲染 ====================
        function renderTaskBlocks(taskContent) {

            function flushBlock() {
                if (currentTitle || currentBody.length) {
                    html += `
                        <div class="task-block">
                            <div class="task-block-title">${currentTitle}</div>
                            <div>${formatFormattedText(currentBody.join('\n'))}</div>
                        </div>
                    `;
                    currentTitle = "";
                    currentBody = [];
                }
            }

            lines.forEach(line => {
                let l = line.trim();
                if (!l) return;
                if (l.match(/^[123]\./) || l.startsWith("【Your Tasks")) {
                    flushBlock();
                    currentTitle = l;
                } else {
                    currentBody.push(l);
                }
            });
            flushBlock();
            return html;
        }

                                    <div class="speaker-avatar avatar-a">A</div>
                                    <div class="chat-bubble-content">
                                        <div>${enText}</div>
                                        ${cnText ? `<div class="chat-cn-trans">${cnText}</div>` : ''}
                                    </div>
                                </div>`;
                        } else if (l.startsWith('B:')) {
                            let enText = l.substring(2).trim();
                            let cnText = '';
                            if (i + 1 < lines.length && (lines[i+1].trim().startsWith('（') || lines[i+1].trim().startsWith('('))) {
                                cnText = lines[i+1].trim();
                                i++;
                            }
                            box.innerHTML += `
                                <div class="chat-bubble-row speaker-b">
                                    <div class="speaker-avatar avatar-b">B</div>
                                    <div class="chat-bubble-content">
                                        <div>${enText}</div>
                                        ${cnText ? `<div class="chat-cn-trans">${cnText}</div>` : ''}
                                    </div>
                                </div>`;
                        } else {
                            box.innerHTML += `<div style="font-size:13.5px; color:#64748b; margin:4px 0;">${l}</div>`;
                        }
                    }
                    mainContainer.appendChild(box);
                } else {
                    mainContainer.innerHTML = '<div style="background:var(--sky-bg); padding:12px; border-radius:14px; white-space:pre-line;">' + formatFormattedText(item.main_content) + '</div>';
                }
            }

            const quizSection = document.getElementById('quizSection');
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.innerHTML = '';
            if (item.practice_quiz && item.practice_quiz.length > 0) {
                quizSection.style.display = 'block';
                item.practice_quiz.forEach(q => {
                    const card = document.createElement('div');
                    card.className = 'quiz-card';
                    card.innerHTML = '<div class="quiz-q">' + q.question + '</div>' +
                                     '<button class="quiz-toggle-btn" onclick="toggleAnswer(this)">👁️ 顯示參考答案與示範</button>' +
                                     '<div class="quiz-ans-wrapper"><div class="quiz-ans-box">' + q.answer + '</div></div>';
                    quizContainer.appendChild(card);
                });
            } else {
                quizSection.style.display = 'none';
            }

            // 重點單字全面革新排版 (卡片條目式)
            const vocabSection = document.getElementById('vocabSection');
            const vocabContainer = document.getElementById('vocabDisplayContainer');
            vocabContainer.innerHTML = '';
            if (item.vocab_notes && item.vocab_notes.length > 0) {
                vocabSection.style.display = 'block';
                item.vocab_notes.forEach(v => {
                    vocabContainer.innerHTML += renderVocabCardItem(v);
                });
            } else {
                vocabSection.style.display = 'none';
            }

            const linkSection = document.getElementById('linkSection');
            const linkDisplay = document.getElementById('linkDisplay');
            if (item.link) {
                linkSection.style.display = 'block';
                linkDisplay.href = item.link;
                linkDisplay.innerText = '🔗 ' + (item.link_text || '開啟延伸學習資源');
            } else {
                linkSection.style.display = 'none';
            }
        }

        function navigateCard(direction) {
            if (currentPool.length === 0) return;
            currentIndex = (currentIndex + direction + currentPool.length) % currentPool.length;
            renderCard();
        }

        function toggleAnswer(btn) {
            const ans = btn.nextElementSibling;
            if (ans.style.display === 'block') {
                ans.style.display = 'none';
                btn.innerText = '👁️ 顯示參考答案與示範';
            } else {
                ans.style.display = 'block';
                btn.innerText = '🙈 隱藏解答';
            }
        }

        function setSuiteScope(scope, btn) {
            suiteScope = scope;
            document.querySelectorAll('.suite-scope-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            loadSuiteTool(currentSuiteTool);
        }

        function loadSuiteTool(toolName, btn) {
            currentSuiteTool = toolName;
            if (btn) {
                document.querySelectorAll('.suite-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            const panel = document.getElementById('suiteContentPanel');
            const targetLessons = (suiteScope === 'all') ? allItems : [currentPool[currentIndex] || allItems[0]];

            if (toolName === 'guide') {
                let concepts = [], misconceptions = [], questions = [];
                targetLessons.forEach(l => {
                    if (l.instant_guide) {
                        concepts = concepts.concat(l.instant_guide.core_concepts || []);
                        misconceptions = misconceptions.concat(l.instant_guide.misconceptions || []);
                        questions = questions.concat(l.instant_guide.exam_questions || []);
                    }
                });
                panel.innerHTML = '<h3 style="margin-top:0; color:#1e1b4b;">📖 Instant Study Guide</h3>' +
                    '<div style="font-size:14px; font-weight:700; color:#4f46e5;">🎯 核心概念：</div><ul class="vocab-ul">' +
                    (concepts.length ? concepts.map(c => '<li>' + c + '</li>').join('') : '<li>精選商務溝通與社交句型架構。</li>') + '</ul>' +
                    '<div style="font-size:14px; font-weight:700; color:#b45309; margin-top:8px;">⚠️ 常見誤解：</div><ul class="vocab-ul">' +
                    (misconceptions.length ? misconceptions.map(m => '<li>' + m + '</li>').join('') : '<li>避免直譯中文口語，應著重母語人士習慣搭配詞。</li>') + '</ul>' +
                    '<div style="font-size:14px; font-weight:700; color:#047857; margin-top:8px;">✍️ 實戰自測：</div><ul class="vocab-ul">' +
                    (questions.length ? questions.map(q => '<li>' + q + '</li>').join('') : '<li>請嘗試複述今日核心對話。</li>') + '</ul>';
            } else if (toolName === 'socratic') {
                let sqList = [];
                targetLessons.forEach(l => {
                    if (l.socratic_quiz) sqList.push(l.socratic_quiz);
                });
                if (!sqList.length) sqList.push({ level: "商務策略 (Level 1)", prompt: "在跨國商務社交中，如何透過開放式問句引導對方談論業務痛點？", feedback: "透過詢問對方部門面臨的主要挑戰，能自然帶出己方專業解決方案。" });
                panel.innerHTML = '<h3 style="margin-top:0; color:#1e1b4b;">🏛️ 蘇格拉底啟發引導</h3>' +
                    sqList.map(q => '<div style="background:#faf5ff; border:1px solid #e9d5ff; border-radius:14px; padding:12px; margin-bottom:10px;">' +
                        '<div style="font-weight:800; color:#6b21a8;">' + q.level + '</div>' +
                        '<div style="margin:6px 0; font-weight:600;">' + q.prompt + '</div>' +
                        '<button class="quiz-toggle-btn" style="padding:4px 10px; font-size:12px;" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display===\'block\'?\'none\':\'block\')">💡 啟發解析</button>' +
                        '<div style="display:none; margin-top:8px; color:#15803d; font-weight:600;">' + q.feedback + '</div>' +
                        '</div>').join('');
            } else if (toolName === 'forecaster') {
                panel.innerHTML = '<h3 style="margin-top:0; color:#1e1b4b;">🎯 Exam Forecaster (考點預測 Top 5)</h3>' +
                    top5Data.map(t => '<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:8px;">' +
                        '<div style="display:flex; justify-content:space-between;"><span style="font-weight:800; color:#4f46e5;">' + t.rank + '</span><span style="color:#166534; font-weight:700;">' + t.prob + '</span></div>' +
                        '<div style="font-weight:700; margin:6px 0;">' + t.topic + '</div>' +
                        '<div style="font-size:14px; color:#475569;">' + t.challenge_q + '</div>' +
                        '<div style="margin-top:6px; color:#166534; font-weight:600;">' + t.challenge_ans + '</div></div>').join('');
            } else if (toolName === 'confusion') {
                let confusions = [];
                targetLessons.forEach(l => {
                    if (l.confusion_fixer) confusions.push(l.confusion_fixer);
                });
                if (!confusions.length) confusions.push({ analogy: "介系詞 to 就像接力棒，只傳給名詞或動名詞。", real_example: "I look forward to our meeting.", common_mistake: "錯誤：I look forward to meet you." });
                panel.innerHTML = '<h3 style="margin-top:0; color:#1e1b4b;">💡 盲點澄清器</h3>' +
                    confusions.map(c => '<div style="margin-bottom:12px;">' +
                        '<div style="background:#fffbeb; padding:10px; border-radius:10px; color:#92400e; font-weight:600; margin-bottom:6px;">' + c.analogy + '</div>' +
                        '<div style="background:#f0f9ff; padding:10px; border-radius:10px; color:#0369a1; font-weight:600; margin-bottom:6px;">🏢 職場實戰：<br>' + c.real_example + '</div>' +
                        '<div style="background:#fef2f2; padding:10px; border-radius:10px; color:#991b1b; font-weight:600;">⚠️ 易犯錯：<br>' + c.common_mistake + '</div></div>').join('');
            } else if (toolName === 'gap') {
                let gaps = [];
                targetLessons.forEach(l => {
                    if (l.gap_finder) gaps = gaps.concat(l.gap_finder);
                });
                if (!gaps.length) gaps = ["⚠️ 潛在缺口：在面對強勢客戶時容易僵化推動個人議程，忽略建立信任的關係階段。"];
                panel.innerHTML = '<h3 style="margin-top:0; color:#1e1b4b;">🔍 知識缺口診斷</h3><ul class="vocab-ul">' +
                    gaps.map(g => '<li>' + g + '</li>').join('') + '</ul>';
            } else if (toolName === 'podcast') {
                panel.innerHTML = '<div class="podcast-box">' +
                    '<h3 style="color:#fff; margin:0 0 6px 0;">🎙️ Audio Study Partner (自然雙人朗讀)</h3>' +
                    '<div style="font-size:13px; color:#c7d2fe; margin-bottom:10px;">👨 Speaker A • 👩 Speaker B</div>' +
                    '<div class="podcast-controls">' +
                    '<div class="control-row" style="margin-bottom:8px;"><span>🗣️ 選擇腔調:</span>' +
                    '<select id="podcastAccent" class="accent-select"><option value="en-US">🇺🇸 美式英語</option><option value="en-GB">🇬🇧 英式英語</option><option value="en-AU">🇦🇺 澳式英語</option></select></div>' +
                    '<div class="control-row"><span>⚡ 語速調節:</span>' +
                    '<input type="range" id="podcastSpeed" min="0.5" max="2.0" step="0.1" value="0.95" oninput="document.getElementById(\'spdVal\').innerText=this.value+\'x\';">' +
                    '<span id="spdVal" style="color:#86efac;">0.95x</span></div></div>' +
                    '<button id="podcastMainBtn" class="podcast-play-btn" onclick="togglePodcastPlayback()">▶️ 開始朗讀對話</button>' +
                    '</div>';
            }
        }

        let isPodcastPlaying = false;
        function togglePodcastPlayback() {
            if (!('speechSynthesis' in window)) return;
            const btn = document.getElementById('podcastMainBtn');
            if (isPodcastPlaying) {
                window.speechSynthesis.cancel();
                isPodcastPlaying = false;
                if (btn) btn.innerText = "▶️ 開始朗讀對話";
            } else {
                window.speechSynthesis.cancel();
                const target = (suiteScope === 'all') ? allItems : [currentPool[currentIndex] || allItems[0]];
                let queue = [];
                target.forEach(l => {
                    if (l.main_content) {
                        l.main_content.split('\n').forEach(line => {
                            let textLine = line.trim();
                            if (textLine.startsWith('（') || textLine.startsWith('(')) return; // 朗讀時跳過純中文翻譯行
                            if (textLine.startsWith('A:')) queue.push({ s: 'A', t: textLine.substring(2).trim() });
                            else if (textLine.startsWith('B:')) queue.push({ s: 'B', t: textLine.substring(2).trim() });
                        });
                    }
                });
                if (!queue.length) return;

                const accentSelect = document.getElementById('podcastAccent');
                const speedSlider = document.getElementById('podcastSpeed');
                const lang = accentSelect ? accentSelect.value : 'en-US';
                const speed = speedSlider ? parseFloat(speedSlider.value) : 0.95;

                isPodcastPlaying = true;
                if (btn) btn.innerText = "⏹️ 停止朗讀";
                let idx = 0;

                function speakNext() {
                    if (!isPodcastPlaying || idx >= queue.length) {
                        isPodcastPlaying = false;
                        if (btn) btn.innerText = "▶️ 開始朗讀對話";
                        return;
                    }
                    const item = queue[idx];
                    const u = new SpeechSynthesisUtterance(item.t);
                    u.lang = lang;
                    u.rate = speed;
                    u.pitch = (item.s === 'A') ? 0.85 : 1.25;
                    u.onend = () => { idx++; speakNext(); };
                    u.onerror = () => { isPodcastPlaying = false; };
                    window.speechSynthesis.speak(u);
                }
                speakNext();
            }
        }

        function renderExam() {
            const container = document.getElementById('examContainer');
            container.innerHTML = '';
            examData.sections.forEach(sec => {
                const secDiv = document.createElement('div');
                secDiv.innerHTML = '<h4 style="color:#4f46e5; margin:14px 0 8px 0;">' + sec.type + '</h4>';
                sec.questions.forEach(q => {
                    let optHtml = '';
                    if (q.options) {
                        optHtml = '<div style="margin:8px 0;">' + q.options.map(o => '<div style="font-size:14px; margin:4px 0;">' + o + '</div>').join('') + '</div>';
                    }
                    secDiv.innerHTML += '<div style="background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:12px; margin-bottom:10px;">' +
                        '<div style="font-weight:700;">' + q.q + '</div>' + optHtml +
                        '<button class="quiz-toggle-btn" style="padding:6px 12px; font-size:12px; margin-top:8px;" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display===\'block\'?\'none\':\'block\')">👁️ 顯示解答</button>' +
                        '<div style="display:none; margin-top:8px; padding:10px; background:#f0fdf4; border-radius:10px; color:#166534; font-weight:600;">答案：' + q.ans + '<br>解析：' + q.explanation + '</div></div>';
                });
                container.appendChild(secDiv);
            });
        }

        function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }
        function verifyAdminPassword() {
            if (document.getElementById('adminPwdInput').value.trim() === 'ryan2026') {
                document.getElementById('adminAuthSection').style.display = 'none';
                document.getElementById('adminFormSection').style.display = 'block';
            } else {
                alert('密碼錯誤！');
            }
        }

        function saveAdminSupplement() {
            const week = document.getElementById('admWeek').value;
            const title = document.getElementById('admTitle').value.trim() || '課堂即時補充';
            const content = document.getElementById('admContent').value.trim();
            const vocab = document.getElementById('admVocab').value.trim();

            if (!vocab && !content) {
                alert('請填寫內容！');
                return;
            }

            const newItem = {
                week: week,
                class_date: (week === 'week1') ? '2026/08/12' : (week === 'week2') ? '2026/08/19' : (week === 'week3') ? '2026/09/02' : '2026/09/09',
                type: 'sentence',
                category: '課堂延伸補充',
                title: title,
                key_takeaways: '【課堂即時補充】\n記錄最新重點單字與句型。',
                main_content: content || '課堂延伸補充內容',
                vocab_notes: vocab ? vocab.split('\n').filter(s => s.trim()) : []
            };

            localItems.push(newItem);
            localStorage.setItem('ryan_networking_supplements_v15', JSON.stringify(localItems));
            allItems.push(newItem);

            alert('✅ 補充成功！');
            closeAdminModal();
            applyFilters();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const selector = document.getElementById('weekFilter');
            if (selector) selector.value = 'week4';
            setTab('sentence');
        });
    </script>
