 Successful cross-cultural negotiators must blend interpersonal flexibility with long-term strategic objectives to secure lasting consensus.\n2. New Words Learned:\n   👉 Reference Answer: Dominant style (主導/強勢風格), Offend (冒犯/惹惱), Consensus building (建立共識), Strategic patience (戰略性耐心).\n3. Assignment Submission:\n   👉 Reference Answer: Write three sentences explaining whether you prefer a task-oriented or relationship-oriented approach when negotiating with international partners.", "main_content": "A: Why did the conclusion emphasize Mateo's dominant style?\n（為什麼總結分析會特別強調 Mateo 的強勢主導風格？）\nB: Because high-status clients expect respect; pushing your own agenda too early is often perceived as disrespectful.\n（因為位高權重的資深客戶期待被尊重；過早強推自己的既定議程往往會被視為不敬。）\nA: What is the golden takeaway?\n（最核心的收穫是什麼？）\nB: First build the relationship bridge, and then cross it to complete the business deal.\n（先搭建起信任的人際橋樑，再跨越它順利完成商業交易。）", "vocab_notes": ["Dominant style [ˈdɑmɪnənt staɪl] (n. phr.) [管理風格]：強勢主導型溝通風格。\n  例句：Managing an executive with a *dominant style* requires active listening rather than direct confrontation.", "Consensus [kənˈsɛnsəs] (n.) [商務決策]：共識、一致意見。\n  例句：After lengthy deliberation, the board reached a solid *consensus* on the capital expansion plan."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_B1/Bus_Part_B1_U4L3_4.3.4.mp4", "link_text": "觀看 Business Partner B1 Video 4.3.4 (Conclusion) 影片 (MP4)"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "社會經濟趨勢 (CBS News 02:10)", "title": "居住負擔危機與成年子女同住潮 (Adults Moving In with Parents)", "key_takeaways": "【經濟趨勢專題精讀與手寫筆記整合】\nCBS News 報導美國在住房負擔能力危機 (Affordability crisis) 下，許多青年被迫緊縮預算 (Stretch their budget)、申請房貸 (Mortgage loan) 困難，面對生活成本 (Living costs) 攀升與感情分手 (Break up)，選擇搬回與父母同住。兩代人在生活動線上重疊相遇 (Cross paths)，從疫情高峰 (Pandemic peak) 到後續低谷 (Valley)，各階層全面性 (Across the board) 受到衝擊，連社群網紅 (Influencer / Content creator) 也紛紛記錄 (Document the ups and downs) 這種生活起伏。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: CBS News reports that soaring living costs and mortgage loan barriers have forced adult children across the board to stretch their budget by moving back in with parents.\n   👉 Sentence 2: Economic turbulence, high car payment obligations, and post-breakup hardships have driven multigenerational families to cross paths in shared households.\n   👉 Sentence 3: From the pandemic peak to current economic valleys, influencers and content creators are actively documenting the ups and downs of intergenerational living.\n2. New Words Learned:\n   👉 Reference Answer: Stretch their budget (緊縮預算), Mortgage loan (房貸), Living costs (生活成本), Cross paths (相遇/動線交會), Break up (分手), On top of (除此之外), Pandemic peak vs. valley (疫情高峰與低谷), Across the board (全面性地), Document the ups and downs (記錄生活起伏).\n3. Assignment Submission:\n   👉 Reference Answer: Compose three sentences describing how escalating living costs and car payments impact young professionals trying to achieve financial independence.", "main_content": "A: Why are so many young American adults moving back into their childhood bedrooms?\n（為什麼這麼多美國成年子女選擇搬回兒時臥室與父母同住？）\nB: Soaring living costs and unaffordable mortgage loans force them to stretch their budget. On top of car payments, many can't afford rent after a break up!\n（暴漲的生活成本和難以負擔的房貸迫使他們緊縮預算。除了車貸之外，許多人在分手後根本無力獨自負擔房租！）\nA: How are family dynamics changing when they cross paths at home?\n（當兩代人在家中動線交會相遇時，家庭關係產生了什麼變化？）\nB: It is an adjustment across the board! Many influencers and content creators now document the ups and downs of living with their parents from pandemic peaks to economic valleys.\n（這是各層面全方位的適應！許多網紅與內容創作者現在都在社群上忠實記錄從疫情高峰到經濟低谷間，與父母同住的生活起伏。）", "vocab_notes": ["Stretch their budget (phr.) [生活財務]：緊縮預算、精打細算。\n  例句：Rising grocery and utility prices have compelled young couples to *stretch their budget*.", "Mortgage loan [ˈmɔrɡɪdʒ loʊn] (n.) [銀行金融]：房屋抵押貸款、房貸。\n  例句：Securing an affordable *mortgage loan* has become a major hurdle due to elevated interest rates.", "Cross paths (idiom) [人際相遇]：不期而遇、動線交會。\n  例句：Working remote shifts allows parents and adult children to *cross paths* more frequently during the day.", "Across the board (idiom) [全面普及]：全盤地、全體一致地。\n  例句：The manufacturing facility implemented safety operational revisions *across the board*.", "Document the ups and downs (phr.)：記錄生活中的起起落落/高低起伏。\n  例句：The entrepreneur used her blog to *document the ups and downs* of building a startup.", "Influencer / Content creator (n.) [網路新創]：網紅、意見領袖 / 數位內容創作者。\n  例句：The brand partnered with a prominent *influencer* to reach Gen Z consumers directly."], "link": "https://www.youtube.com/watch?v=EmqHdzJ6BnA", "link_text": "觀看 CBS News: Adults Moving In with Parents (YouTube)"}, {"week": "week4", "class_date": "2026/09/09", "type": "media", "category": "全球商業競爭 (CNBC 03:38)", "title": "美企在華競爭困境解析 (Why American Companies Struggle in China)", "key_takeaways": "【國際商業策略專題與手寫筆記整合】\nCNBC 深度解析美國跨國企業在中國市場面臨的嚴峻競爭：昔日暴利豐厚 (Lucrative / Profitable) 的市場如今遭遇銷售趨緩 (Slower sales) 與營收萎縮 (Revenue shrink / shrunk)。本土運動鞋 (Sneakers) 與單一品牌店 (Mono-brand store) 崛起，外企的高溢價 (Price premium) 優勢衰退 (Wane)。捲入關稅戰 (Embroiled in a tariff) 與民族主義愛國情緒 (Nationalism / Patriotic) 下，外企必須對抗放緩 (Counter that slowdown)、脫手資產 (Offload) 或進行分拆 (Spin-off)，設法維持產品價值主張 (Value proposition)。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: CNBC investigates why once-lucrative Chinese market revenues for American giants are rapidly shrinking due to slower sales and intense domestic competition.\n   👉 Sentence 2: Embroiled in geopolitical tariff disputes and rising consumer nationalism, Western brands find their traditional price premium appeal beginning to wane.\n   👉 Sentence 3: To counter that slowdown and maintain strategic relevance, multinational retailers must disrupt their supply chains, offload stagnant assets, or pursue regional spin-offs.\n2. New Words Learned:\n   👉 Reference Answer: Lucrative / Profitable (有利可圖的), Price premium (溢價), Embroiled in a tariff (捲入關稅爭端), Nationalism / Patriotic (民族主義/愛國的), Counter that slowdown (對抗增長放緩), Offload (脫手/卸載資產), Spin-off (分拆獨立), Disrupt (破壞/顛覆傳統), Lost traction (失去黏著度/牽引力), Wane (衰退/減弱), Value proposition (價值主張).\n3. Assignment Submission:\n   👉 Reference Answer: Explain in three sentences how localized product iteration and price competitiveness allow domestic brands to erode the price premium of foreign multinationals.", "main_content": "A: Why are American multinationals struggling in what was once a highly lucrative market?\n（為什麼美國跨國企業在曾經獲利極其豐厚的市場陷入苦戰？）\nB: Annual revenues have shrunk because foreign sportswear brands have lost a lot of their traction to hyper-agile domestic competitors.\n（年度營收大幅縮水，因為外國運動服飾品牌在本土敏捷對手的競爭下失去了市場黏著度與吸引力。）\nA: How are geopolitical tensions and tariffs affecting their market strategy?\n（地緣政治緊張與關稅如何影響他們的市場策略？）\nB: Embroiled in tariffs and rising patriotism, Western brands are seeing their price premium wane; many must offload assets or spin off their China segments to counter that slowdown!\n（捲入關稅與日益升溫的愛國情緒中，西方品牌的溢價優勢逐漸減退；許多企業必須脫手資產或將其中國業務分拆獨立，以對抗業績放緩！）", "vocab_notes": ["Lucrative / Profitable [ˈlukrətɪv] (adj.) [商業獲利]：有利可圖的、賺錢的。\n  例句：Specialty chemical manufacturing remains a highly *lucrative* market niche.", "Price premium (n. phr.) [行銷定價]：品牌溢價（消費者願支付之額外高價）。\n  例句：Luxury brands must continually innovate to justify their substantial *price premium*.", "Embroiled in a tariff (phr.) [國際貿易]：捲入關稅戰/關稅紛爭之中。\n  例句：Exporters found themselves *embroiled in a tariff* dispute that eroded their profit margins.", "Nationalism [ˈnæʃənəˌlɪzəm] / Patriotic [ˌpeɪtriˈɑtɪk] (n./adj.) [社會政治]：民族主義 / 愛國的。\n  例句：Surging *nationalism* has led regional buyers to prioritize domestic product alternatives.", "Counter that slowdown (phr.) [企業營運]：對抗/扭轉業績放緩趨勢。\n  例句：The management launched aggressive promotional campaigns to *counter that slowdown*.", "Offload [ˌɔfˈloʊd] (v.) [財務操作]：脫手、出脫卸下（不賺錢的資產/庫存）。\n  例句：The conglomerate decided to *offload* underperforming retail business units.", "Spin-off [ˈspɪnˌɔf] (n./v.) [企業重組]：子公司分拆獨立上市。\n  例句：The pharmaceutical giant announced a corporate *spin-off* of its consumer health division.", "Lost traction (phr.) [市場份額]：失去吸引力、失去市場推動力/牽引力。\n  例句：The legacy software product *lost traction* after modern cloud solutions entered the market.", "Wane [weɪn] (v.) [趨勢變化]：逐漸減弱、衰退、萎縮。\n  例句：Investor confidence began to *wane* following consecutive quarters of stagnant revenue.", "Value proposition [ˈvælju ˌprɑpəˈzɪʃən] (n.) [商業策略]：價值主張（帶給客戶之核心價值）。\n  例句：A compelling *value proposition* clearly explains why customers should choose your solution."], "link": "https://www.youtube.com/watch?v=2q5VS91n2-c", "link_text": "觀看 CNBC: American Companies in China (YouTube)"}, {"week": "week5", "class_date": "2026/09/16", "type": "sentence", "category": "評價與評論技巧 (Positive & Negative Comments)", "title": "正面與負面評論之轉折藝術 (Making Positive & Negative Comments)", "key_takeaways": "【BBC Speak Session 8 核心口語精髓與手寫筆記整合】\n1. 正負向語氣轉折句型：\n   - But actually [ˈæktʃuəli]... it is a little small. (但事實上……有點小)\n   - On the other hand... I do quite like the colours. (另一方面……我確實挺喜歡這顏色)\n   - Then again... it is a bit messy [ˈmɛsi]. (但話說回來……有點雜亂)\n2. 正面信號與錦上添花片語：\n   - On the positive side... / One of the strengths of this is...\n   - What I like about this is... / It is a big/real plus [rɪl plʌs]. (這是一大加分項)\n   - The icing on the cake [ˈaɪsɪŋ ɑn ðə keɪk] = The cherry on top [ˈtʃɛri ɑn tɑp]: 錦上添花、更棒的是。\n3. 負面委婉信號與斟酌性讚美 (Giving Qualified Praise)：\n   - On the negative side... / Perhaps a weakness of this is that...\n   - For / In terms of a first project, I think you've done a great job here. (以第一個專案來說，我覺得你做得非常出色)\n4. 重音與肯定強調技巧：使用助動詞 do 強調肯定立場 (But actually, I DO like the design!)。", "main_content": "A: What do you think of our new living room setup with the loveseat and coffee table?\n（你覺得我們客廳新佈置的雙人沙發與咖啡茶几如何？）\nB: On the positive side, the matte finish is really great, and having the matching end table is a real plus!\n（從正面來看，霧面質感非常棒，而且搭配了成套的邊几真的是一大加分項！）\nA: Are there any drawbacks we should consider?\n（有任何我們應該考量的缺點嗎？）\nB: Then again, for a three-seater family, it is a little small. But in terms of aesthetics, the ambient lighting is the cherry on top!\n（但話說回來，對三人座家庭來說這稍嫌小了點。不過就美學而言，氣氛燈光簡直是錦上添花！）", "vocab_notes": ["The icing on the cake = The cherry on top (idiom) [商務口語]：錦上添花的好事。\n  例句：The pay raise was wonderful, but the remote work flexibility was *the cherry on top*.", "A real/big plus [rɪl plʌs] (n. phr.) [商務評價]：一大加分項、顯著優勢。\n  例句：Having extensive PSM audit experience is a *big plus* for this senior safety role.", "Qualified praise (n. phr.) [高階溝通]：有保留/附加條件的讚美（如 In terms of a first attempt...）。\n  例句：The director offered *qualified praise*, commending the speed while requesting data revision.", "Then again (phr.) [語氣轉折]：但話說回來、不過又說回來。\n  例句：The equipment is costly; *then again*, its unmatched durability justifies the capital expenditure.", "Loveseat [ˈlʌvˌsit] (n.) [家具空間]：雙人座沙發（相對於 three-seater 三人座沙發）。\n  例句：A compact *loveseat* is ideal for maximizing floor space in urban apartments.", "Coffee table vs. End table [家具配置]：Coffee table 咖啡桌/茶几 ↔ End table 沙發邊几。\n  例句：Place the document binder on the *coffee table* next to the leather *end table*.", "Matte vs. Gloss / Glossy [表面材質]：Matte [mæt] 霧面啞光 ↔ Gloss / Glossy [ɡlɔsi] 亮面光澤。\n  例句：The instrument casing is available in both fingerprint-resistant *matte* and sleek *glossy* finishes.", "Have a fragile ego (phr.) [性格描述]：自尊心脆弱、玻璃心、經不起批評。\n  例句：Senior managers must deliver feedback gently to team members who *have a fragile ego*.", "Squeeze someone in for a meeting (idiom) [時程安排]：硬擠出時間安排會議。\n  例句：The CEO is fully booked today, but her assistant managed to *squeeze me in* for a ten-minute briefing."], "practice_quiz": [{"question": "【第 1 題】要表達某項優點是『錦上添花、好上加好』，可以使用哪個美味的英文成語？\nWinning the safety award was great, but receiving the cash bonus was the _________ on top.", "answer": "✔ 填空解答：cherry (或 icing on the cake)\n👉 整句回答：Winning the safety award was great, but receiving the cash bonus was the cherry on top."}], "instant_guide": {"core_concepts": ["1. 掌握正反語氣流暢切換 (But actually / On the other hand / Then again)。", "2. 委婉點出弱點 (Something you might want to look at again)。", "3. 肯定加強語氣 (Use uncontracted statements & do)。"], "misconceptions": ["誤解：以為提出缺點一定要用 Direct No，商務場合善用 Qualified Praise (In terms of...) 更具建設性。"], "exam_questions": ["Q1: 請使用 'big plus' 與 'cherry on top' 造出一個針對新產品發布會的正面評價句子。"]}, "link": "https://www.bbc.co.uk/learningenglish/english/course/how-to-speak-english/unit-1/session-8", "link_text": "前往 BBC Speak Session 8 官方課程"}, {"week": "week5", "class_date": "2026/09/16", "type": "sentence", "category": "共識與爭議表達 (Agreeing & Disagreeing)", "title": "贊同、異議與共識協商 (Agreeing, Disagreeing & Consensus)", "key_takeaways": "【British Council 溝通協商技巧精讀】\n1. 禮貌表達不同意見與質疑：\n   - I'm not convinced [kənˈvɪnst] by that idea. (我對那個想法並不信服/未被說服)\n   - Don't get me wrong, but I don't think they fit. (別誤會我的意思，但我認為它們並不合適)\n   - I see what you mean, but it looks a bit empty / busy. (我明白你的意思，但看起來有點空曠 / 太雜亂)\n2. 達成共識與確認共鳴：\n   - OK, maybe you've got a point there. (好吧，也許你說得有道理)\n   - So it looks like we can agree. (所以看來我們能達成共識了)\n3. 設計與佈局評價字彙：\n   - Minimal / Minimalist [ˈmɪnəməlɪst] (adj.): 極簡主義的。\n   - Too much going on -> Busy: 元素太多太繁雜。\n   - Hood ornament [hʊd ˈɔrnəmənt] (n.): 引擎蓋裝飾品（如勞斯萊斯歡慶女神，比喻畫龍點睛的標誌性裝飾）。", "main_content": "A: Don't get me wrong, but I think this floor plan looks a bit too busy; there's just too much going on!\n（別誤會我的意思，但我覺得這個平面圖看起來有點太雜亂了，上面的元素實在太多了！）\nB: I see what you mean, but our original intention was to make it multifunctional rather than strictly minimalist.\n（我明白你的意思，但我們最初的用意是希望它具備多功能，而不是走純粹的極簡風格。）\nA: I'm not convinced by placing the heavy display right in the lobby; it blocks the walkway.\n（我並不贊同把厚重的展示架直接擺在大廳中央，這會擋住走道動線。）\nB: OK, maybe you've got a point there. If we treat the central sculpture as a hood ornament like on a Rolls-Royce, we can clear the side aisles!\n（好吧，也許你說得有道理。如果我們把中央雕塑當成勞斯萊斯車頭的引擎蓋立標那樣純作焦點裝飾，就能把兩側走道完全清空了！）\nA: Exactly! So it looks like we can agree on this revised layout.\n（沒錯！看來我們對這個修正後的佈局達成共識了。）", "vocab_notes": ["I'm not convinced by [kənˈvɪnst] (phr.) [商務談判]：我對……並不信服/未被說服。\n  例句：The board was *not convinced by* the contractor's optimistic turnaround timetable.", "Don't get me wrong (phr.) [溝通緩和]：別誤會我的意思、請恕我直言。\n  例句：*Don't get me wrong*, the safety system is functional, but user adoption remains low.", "Too much going on -> Busy (phr.) [設計評價]：元素太雜亂繁複。\n  例句：The dashboard interface has *too much going on*; let us simplify it for the field operators.", "Hood ornament [hʊd ˈɔrnəmənt] (n.) [文化比喻]：汽車引擎蓋上的裝飾立標（比喻醒目畫龍點睛之物）。\n  例句：The iconic bird atop the kettle serves as a playful *hood ornament* for the design.", "Minimalist [ˈmɪnəməlɪst] (adj./n.) [設計風格]：極簡主義者；極簡風格的。\n  例句：Steve Jobs advocated for sleek, *minimalist* hardware lines with zero unnecessary screws."], "practice_quiz": [{"question": "【第 1 題】委婉地向客戶表示『我並未被這個提案說服』，應填入哪個形容詞？\nI am not _________ by that marketing proposal; we need more empirical field data.", "answer": "✔ 填空解答：convinced\n👉 整句回答：I am not convinced by that marketing proposal; we need more empirical field data."}], "link": "https://learnenglish.britishcouncil.org/skills/speaking/b1-speaking/agreeing-disagreeing", "link_text": "前往 British Council B1 Speaking 教程"}, {"week": "week5", "class_date": "2026/09/16", "type": "media", "category": "正反評論技巧 (BBC Speak #8)", "title": "如何優雅表達正面與負面意見 (How to Make Positive/Negative Comments)", "key_takeaways": "【BBC Speak Session 8 官方自習課程】\n探討如何在職場會議中平衡表達正面與負面觀點，使用重音對比 (Using stress to add balance) 避免衝突，並學會運用合格性讚美 (Qualified praise) 提出建設性反饋。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: The BBC tutorial demonstrates effective conversational transitions to shift smoothly between positive strengths and negative limitations.\n   👉 Sentence 2: Learners practice using uncontracted statements and emphatic auxiliary verbs like 'do' to add nuance and balance to their critiques.\n   👉 Sentence 3: By adopting qualified praise phrases such as 'in terms of', business speakers can deliver constructive criticism without sounding harsh or discourteous.\n2. New Words Learned:\n   👉 Reference Answer: Qualified praise (斟酌性讚美), Big plus (顯著優勢), The cherry on top (錦上添花), Uncontracted statement (未縮寫陳述).\n3. Assignment Submission:\n   👉 Reference Answer: Write a balanced 3-sentence performance review of a recent team presentation using 'on the positive side', 'then again', and 'big plus'.", "main_content": "A: How does BBC Speak recommend balancing critical remarks?\n（BBC Speak 建議如何平衡批評性的評論意見？）\nB: Instead of blunt disapproval, use phrases like 'One of the strengths is...' followed by 'Then again, you might want to look at...'.\n（不要直接生硬反對，而是先說『優勢之一是……』，接著再接『話說回來，你或許會想重新檢視……』。）\nA: What is the benefit of making uncontracted statements?\n（使用未縮寫的完整陳述有什麼好處？）\nB: Stating 'It IS quite small' adds deliberate acoustic weight, highlighting thoughtful balance.\n（說出『It IS quite small』能增加刻意的聲音重量感，突顯深思熟慮的平衡感。）", "vocab_notes": ["Qualified praise (n. phr.) [高階溝通]：有保留的讚譽。\n  例句：Offering *qualified praise* encourages engineers to maintain safety while refining cost."], "link": "https://www.bbc.co.uk/learningenglish/english/course/how-to-speak-english/unit-1/session-8", "link_text": "前往 BBC Speak: Session 8 互動教材"}, {"week": "week5", "class_date": "2026/09/16", "type": "media", "category": "贊同與異議對話 (British Council B1)", "title": "商務對話贊同與反對實戰 (Agreeing & Disagreeing in Practice)", "key_takeaways": "【英國文化協會 B1 實戰對話精讀】\n學習如何聽懂合作夥伴的弦外之音。掌握由完全贊同 (Definitely / I think you're right) 到委婉異議 (I see what you mean, but...) 的階梯式應對策略。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: The British Council audio lesson showcases two colleagues deliberating interior room aesthetics while negotiating conflicting design viewpoints.\n   👉 Sentence 2: The speakers demonstrate diplomatic disagreement techniques by acknowledging their partner's perspective before highlighting personal reservations.\n   👉 Sentence 3: Through gradual concession and mutual clarification, the dialogue concludes with an amicable consensus that satisfies both professional criteria.\n2. New Words Learned:\n   👉 Reference Answer: Not convinced (不信服), Have a point (有道理), Too much going on (畫面太雜), Amicable consensus (融洽共識).\n3. Assignment Submission:\n   👉 Reference Answer: Script a brief dialogue between two plant supervisors resolving a disagreement on maintenance shift rotations.", "main_content": "A: How should I respond if a client says 'Don't get me wrong, but I don't think this works'?\n（如果客戶說『別誤會我的意思，但我覺得這樣行不通』，我該如何回應？）\nB: You can validate their concern by replying 'I see what you mean, but perhaps we can adjust the parameters.'\n（你可以先肯定對方的顧慮，回答說『我明白您的意思，但或許我們可以調整一下參數』。）\nA: That keeps the negotiation constructive!\n（這樣能讓整個談判維持建設性！）\nB: Exactly, it leads naturally toward 'So it looks like we can agree!'.\n（沒錯，這會自然引導向『看來我們能達成共識了！』的雙贏結局。）", "vocab_notes": ["Amicable consensus [ˈæmɪkəbəl kənˈsɛnsəs] (n. phr.) [爭議解決]：融洽的共識。\n  例句：After collaborative discussions, the union and plant management reached an *amicable consensus*."], "link": "https://learnenglish.britishcouncil.org/skills/speaking/b1-speaking/agreeing-disagreeing", "link_text": "觀看 British Council Speaking 教程"}, {"week": "week5", "class_date": "2026/09/16", "type": "media", "category": "經典產品設計 (Alessi 9093 Kettle)", "title": "經典鳥鳴壺設計工藝 (Alessi: The 9093 Bird Kettle)", "key_takeaways": "【工業設計美學與功能權衡】\n介紹義大利國寶級設計品牌 Alessi 著名的「小鳥水壺 (9093 Kettle)」。探討現代產品在極致美學造型 (Iconic shape) 與實用容量 (Instrumental utility)、清潔保養之間的經典權衡。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: Alessi's iconic 9093 tea kettle revolutionized domestic kitchenware by introducing a whimsical singing bird whistle at the spout.\n   👉 Sentence 2: Designed by Michael Graves, the kettle blends post-modern art deco aesthetics with functional stainless-steel thermal conductivity.\n   👉 Sentence 3: It serves as an enduring design case study on transforming utilitarian appliances into emotional, conversational pieces for home entertaining.\n2. New Words Learned:\n   👉 Reference Answer: Conversational piece (話題焦點物件), Utilitarian appliance (實用型家電), Whistle spout (鳴笛壺嘴), Iconic craftsmanship (經典工藝).\n3. Assignment Submission:\n   👉 Reference Answer: Evaluate the Alessi Bird Kettle using 'For something that is used for boiling water, but on the other hand...'.", "main_content": "A: What makes the Alessi 9093 Bird Kettle such an iconic design worldwide?\n（是什麼讓 Alessi 9093 小鳥水壺成為風靡全球的經典設計？）\nB: When the water boils, the small bird whistles a cheerful tune instead of a piercing alarm!\n（水滾時，小鳥造型的壺嘴會吹奏出愉悅的鳴笛聲，而不是刺耳的警報！）\nA: What is the trade-off for such a decorative piece?\n（擁有這樣一件裝飾性藝術品有什麼權衡取捨呢？）\nB: For something that boils water, it is pretty stylish, but then again, cleaning around the metal studs is somewhat time-consuming.\n（作為煮水用具它極為時髦，但話說回來，清洗金屬鉚釘周圍確實有點耗時。）", "vocab_notes": ["Conversational piece (n. phr.) [生活美學]：引人注目的話匣子物件、話題焦點。\n  例句：The futuristic citrus squeezer doubles as an eye-catching *conversational piece* during client receptions.", "Anchors the kitchen (phr.) [空間配置]：成為廚房空間視覺的核心錨點。\n  例句：With its bold silhouette, Graves' kettle truly *anchors the kitchen* counter."], "link": "https://alessi.com/products/9093-kettle?variant=46489024823622", "link_text": "瀏覽 Alessi 官方 9093 小鳥水壺規格"}, {"week": "week5", "class_date": "2026/09/16", "type": "media", "category": "設計專訪自學 (Tea Kettle Interview)", "title": "重新設計水壺：設計師 Donald Strum 專訪 (Redesigning the Tea Kettle)", "key_takeaways": "【經典工業設計思維專訪】\n專訪著名設計師 Donald Strum 與 Michael Graves 團隊重新打造水壺的歷程。探討如何從剛畢業 (Fresh out of college) 的抱負，到測試數十種手把色調 (50 shades of blue)，並將產品推向數百萬銷量熱潮。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: Designer Donald Strum reflects on his early career collaboration with Michael Graves in reimagining the everyday kitchen tea kettle.\n   👉 Sentence 2: The design team rigorously evaluated dozens of color samples before choosing a distinct calming blue handle paired with a playful whistle.\n   👉 Sentence 3: The video illustrates how harmonizing functional ergonomic requirements with distinctive visual character produced a global commercial bestseller.\n2. New Words Learned:\n   👉 Reference Answer: Redesign (重新設計), Ergonomic handle (符合人體工學的手把), Color shade (色彩色調), Bestseller (暢銷產品).\n3. Assignment Submission:\n   👉 Reference Answer: Answer the 5 video comprehension questions in English regarding Donald Strum's college background and design choices.", "main_content": "A: What was Donald Strum planning to do when he graduated from college?\n（Donald Strum 剛大學畢業時原本打算做什麼？）\nB: Fresh out of college, he was enlisted to work on high-profile product commissions with design legends.\n（剛自大學畢業，他便被招募與設計傳奇大師共同投入高規格產品委託設計。）\nA: How many colors had the team evaluated before choosing the iconic blue handle?\n（在選定標誌性的藍色手把之前，團隊一共評估測試了多少種顏色？）\nB: They tested over 50 shades of blue until they discovered the exact hue that resonated with domestic warmth!\n（他們測試了超過 50 種藍色色調，直到發現最能喚起家庭溫暖的那抹藍色！）", "vocab_notes": ["Ergonomic [ˌɜrɡəˈnɑmɪk] (adj.) [工程工藝]：符合人體工學的。\n  例句：Our control console features an *ergonomic* arrangement to reduce operator fatigue.", "Fresh out of college (phr.) [職場起步]：剛大學畢業。\n  例句：*Fresh out of college*, young chemical engineers bring fresh perspectives to sustainability.", "Enlisted [ɪnˈlɪstɪd] (v./adj.)：被招募、參與投入特定任務。\n  例句：Top mechanical consultants were *enlisted* to troubleshoot plant vibration issues."], "link": "https://www.youtube.com/watch?v=sksELwqi1C0", "link_text": "觀看 Redesigning the Tea Kettle (YouTube)"}, {"week": "week5", "class_date": "2026/09/16", "type": "media", "category": "科技硬體自學 (WSJ News 03:39)", "title": "實測蘋果首款摺疊 iPhone：三大核心收穫 (I Tried Apple's First Folding iPhone)", "key_takeaways": "【華爾街日報 WSJ 科技自學專題】\nWSJ 科技資深編輯深入實測體驗蘋果首款摺疊式 iPhone（iPhone Fold / Duo），精準點出三大關鍵收穫 (3 Takeaways)：\n1. 螢幕摺痕控制與轉軸鉸鏈耐用性 (Display crease & Hinge durability)。\n2. 大螢幕多工操作與單手便攜性之間的平衡折衷 (Multitasking canvas vs. Portability)。\n3. 高昂售價與電池續航在硬體規格取捨 (Trade-offs) 上的市場挑戰。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: The Wall Street Journal video provides an exclusive hands-on evaluation of Apple's pioneering foldable iPhone prototype.\n   👉 Sentence 2: The journalist outlines three fundamental takeaways concerning hinge resilience, minimal display crease visibility, and expansive multitasking software capabilities.\n   👉 Sentence 3: Ultimately, while the foldable device unlocks superior mobile productivity, premium pricing and battery compromises remain critical hurdles for widespread consumer adoption.\n2. New Words Learned:\n   👉 Reference Answer: Takeaway (核心收穫/心得), Foldable form factor (摺疊外形規格), Display crease (螢幕摺痕), Hinge durability (鉸鏈耐用度), Trade-off (權衡取捨).\n3. Assignment Submission:\n   👉 Reference Answer: Summarize your personal perspective on whether foldable smartphones provide genuine commercial utility or merely novelty for business travelers.", "main_content": "A: What are the three primary takeaways from the WSJ evaluation of Apple's folding iPhone?\n（華爾街日報實測蘋果摺疊 iPhone 後的三大核心收穫是什麼？）\nB: First, the custom hinge engineering virtually eliminates the visible crease. Second, the tablet-like inner screen dramatically enhances split-screen document editing!\n（第一，特製的鉸鏈工藝幾乎消除了肉眼可見的螢幕摺痕；第二，宛如平板的內螢幕大幅提升了分割視窗編輯文件的效率！）\nA: And what about the third takeaway?\n（那第三個收穫呢？）\nB: The substantial price premium and heavier chassis represent a significant trade-off that buyers must weigh.\n（顯著的高昂溢價與較笨重的機身重量，構成了消費者在入手前必須仔細權衡的重要妥協取捨。）", "vocab_notes": ["Takeaway [ˈteɪkəˌweɪ] (n.) [多益核心]：重點心得、核心收穫。\n  例句：The key *takeaway* from the executive audit is that preventative maintenance saves millions.", "Display crease [kris] (n. phr.) [科技硬體]：螢幕摺痕。\n  例句：Engineers engineered a teardrop hinge to smooth out the central *display crease*.", "Split-screen multitasking (n. phr.)：分割螢幕多工處理。\n  例句：The tablet layout enables real-time *split-screen multitasking* for field operators."], "link": "https://www.youtube.com/watch?v=mji8eZu8YYE", "link_text": "觀看 WSJ News: I Tried Apple's First Folding iPhone (YouTube)"}, {"week": "week5", "class_date": "2026/09/16", "type": "media", "category": "生醫AI自學 (SCMP 02:34)", "title": "AI 演算法加持之癌症嗅探犬 (Meet the Dogs Trained to Sniff out Cancer)", "key_takeaways": "【南華早報 SCMP 生醫科技專題】\n南華早報報導醫療科研團隊如何訓練嗅覺靈敏的犬隻（如黃金獵犬 Golden Retrievers）辨識人體尿液或呼吸中的癌症揮發性有機化合物 (Volatile organic compounds)，並導入人工智慧機器學習模型 (AI Boost) 交叉比對氣味圖譜，大幅提高早期癌症篩檢的精準度與判別效率。\n\n【Your Tasks & Reference Answer / Assignment】\n1. Summary (Strictly 3 sentences):\n   👉 Sentence 1: South China Morning Post highlights innovative biomedical research where specialized dogs are trained to detect early-stage cancer from patient samples.\n   👉 Sentence 2: Advanced artificial intelligence algorithms complement the canines' olfactory acuity by analyzing chemical signatures and filtering false positives.\n   👉 Sentence 3: This synergistic integration of biological sensory capabilities and machine learning provides a cost-effective diagnostic breakthrough for non-invasive medical screening.\n2. New Words Learned:\n   👉 Reference Answer: Sniff out (嗅出/辨識出), Olfactory acuity (嗅覺靈敏度), Chemical signature (化學特徵圖譜), Non-invasive screening (非侵入性篩檢), AI Boost (人工智慧演算法加持).\n3. Assignment Submission:\n   👉 Reference Answer: Write three sentences explaining how cross-disciplinary technologies combining biology and AI can optimize industrial hazard prevention.", "main_content": "A: How can dogs sniff out cancer accurately according to the South China Morning Post report?\n（根據南華早報的報導，狗狗是如何精準嗅出癌症的？）\nB: Specially trained canines can smell minute volatile organic compounds associated with malignant tumors in biological samples.\n（經過專門訓練的犬隻能夠嗅出生化樣本中與惡性腫瘤相關的微量揮發性有機化合物。）\nA: What role does the AI boost play in this diagnostic program?\n（人工智慧演算法在這種診斷計畫中扮演了什麼角色？）\nB: The AI algorithms analyze gas chromatography data alongside canine responses, dramatically reducing false alarms and accelerating non-invasive screening!\n（AI 演算法將氣相層析數據與犬隻的反應進行交叉比對，大幅降低了誤報率並加速非侵入性篩檢流程！）", "vocab_notes": ["Sniff out [snɪf aʊt] (phr. v.) [生醫偵測]：嗅出、查出、發現。\n  例句：Specially trained dogs can *sniff out* hazardous gas leaks long before electronic sensors trigger.", "Non-invasive screening (n. phr.) [醫療科技]：非侵入性篩檢。\n  例句：Preventative corporate health programs prioritize rapid, *non-invasive screening* methods.", "Volatile organic compounds (VOCs) [ˈvɑlətəl ɔrˈɡænɪk] (n.) [化學環安]：揮發性有機化合物。\n  例句：Petrochemical plants deploy laser detectors to monitor ambient *volatile organic compounds*."], "link": "https://www.youtube.com/watch?v=xnMGvrZTbZY", "link_text": "觀看 SCMP: Dogs Trained to Sniff out Cancer (YouTube)"}];
        const examData = {"title": "Networking English 全真模擬檢測試卷 (Mid-Term Practice)", "sections": [{"type": "單選題 (Multiple Choice)", "questions": [{"q": "1. Which of the following is grammatically CORRECT when ending a business email?", "options": ["A. I look forward to see you next week.", "B. I look forward to seeing you next week.", "C. I look forward to meet with you.", "D. I am looking forward to meet you."], "ans": "B", "explanation": "Look forward to 中的 to 是介系詞，後方必須搭配動名詞 (seeing)。"}, {"q": "2. When someone proposes an idea that you doubt and do not fully agree with, which polite diplomatic phrase is most suitable?", "options": ["A. I'm not convinced by that idea.", "B. You are completely mistaken.", "C. Stop pushing your agenda.", "D. Beat around the bush."], "ans": "A", "explanation": "在商務場合禮貌表達未被說服或有疑慮時，使用 'I'm not convinced by that idea' 既客觀又得體。"}, {"q": "3. What does the idiom 'the cherry on top' (or 'the icing on the cake') mean in business evaluations?", "options": ["A. An unexpected severe obstacle.", "B. An additional benefit that makes a good situation even better.", "C. A costly component that should be cut.", "D. A secret hidden agenda."], "ans": "B", "explanation": "The cherry on top 指的是讓原本就很好的情境『錦上添花』的額外好處。"}, {"q": "4. In engineering product reviews, what term refers to 'sacrificing one desirable quality in order to gain another'?", "options": ["A. Form factor", "B. Loss leader", "C. Trade-off", "D. Crease"], "ans": "C", "explanation": "Trade-off 指在兩項衝突的效益之間進行權衡取捨與折衷妥協。"}]}]};
        const top5Data = [{"rank": "Top 1 必考核心", "topic": "Look forward to + V-ing 文法與介系詞規則", "prob": "出題機率：99%", "challenge_q": "Q: 請判斷 I look forward to our next meeting 是否正確？為什麼？", "challenge_ans": "✔ 正確！因為 our next meeting 是名詞片語。介系詞 to 後方接動名詞 (V-ing) 或名詞皆完全正確！"}, {"rank": "Top 2 必考核心", "topic": "正反面評論轉折與錦上添花 (Qualified Praise & The Cherry on Top)", "prob": "出題機率：96%", "challenge_q": "Q: 如何以 'qualified praise' 稱讚新人專案做得很棒，但仍有成長空間？", "challenge_ans": "✔ 'For a first attempt, you've done a great job, though testing speed is something to look at again.'"}, {"rank": "Top 3 必考核心", "topic": "商務異議與共識協商 (I'm not convinced by... / You've got a point)", "prob": "出題機率：94%", "challenge_q": "Q: 如何禮貌地向外賓表達『我理解你的觀點，但那項方案成本過高』？", "challenge_ans": "✔ 'I see what you mean, but the initial capital expenditure remains a huge hurdle.'"}, {"rank": "Top 4 必考核心", "topic": "談判策略對比 (Cut to the chase vs. Beat around the bush)", "prob": "出題機率：91%", "challenge_q": "Q: 請解釋 Cut to the chase 與 Beat around the bush 的反義對比關係。", "challenge_ans": "✔ Cut to the chase 表示開門見山切入重點；Beat around the bush 則是拐彎抹角不切入核心。"}, {"rank": "Top 5 必考核心", "topic": "工程產品決策權衡 (Trade-off & Form Factor)", "prob": "出題機率：89%", "challenge_q": "Q: 什麼是工程決策中的 'trade-off'？", "challenge_ans": "✔ 指的是效益間的權衡折衷（例如為了無縫大螢幕而接受相機畫質的輕微折損）。"}];

        let currentPool = [];

        let isPenMode = false;
        let isDrawing = false;
        let undoStack = [];
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const card = document.getElementById('cardElement');
            if (card && canvas) {
                canvas.width = card.clientWidth;
                canvas.height = card.clientHeight;
            }
        }

        function saveCanvasState() {
            if (undoStack.length > 15) undoStack.shift();
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        function undoLastStroke() {
            if (undoStack.length > 0) {
                const prevState = undoStack.pop();
                ctx.putImageData(prevState, 0, 0);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            document.getElementById('penBtn').classList.toggle('active-pen', isPenMode);
            document.getElementById('cardElement').classList.toggle('canvas-active', isPenMode);
            if (isPenMode) resizeCanvas();
        }

        function clearAllCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            undoStack = [];
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!isPenMode) return;
            isDrawing = true;
            saveCanvasState();
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.strokeStyle = '#e11d48';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !isPenMode) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        });

        canvas.addEventListener('pointerup', () => { isDrawing = false; });
        canvas.addEventListener('pointercancel', () => { isDrawing = false; });

        // ==================== 視覺標籤與文字著色引擎 (柔和低調音標) ====================
        function formatFormattedText(rawText) {
            let text = String(rawText);

            // 1. 處理國際音標：以極簡低調字體融入行文
            text = text.replace(/\[([^\[\]]*[ˈˌəɪæʊʌθðʃʒŋɑɔɒ][^\[\]]*)\]/g, '<span class="ipa-tag">/$1/</span>');

            // 2. 通用情境膠囊標籤
            text = text.replace(/\[([^\[\]]+)\]/g, function(match, content) {
                let lower = content.toLowerCase();
                if (lower.includes('英式') || lower.includes('交通')) {
                    return '<span class="context-tag tag-blue">' + content + '</span>';
                } else if (lower.includes('美式') || lower.includes('警示')) {
                    return '<span class="context-tag tag-amber-badge">' + content + '</span>';
                } else if (lower.includes('管理') || lower.includes('風格') || lower.includes('性格') || lower.includes('特質') || lower.includes('思維')) {
                    return '<span class="context-tag tag-purple">' + content + '</span>';
                } else if (lower.includes('多益') || lower.includes('核心') || lower.includes('商業') || lower.includes('商務') || lower.includes('財經') || lower.includes('經濟') || lower.includes('會計') || lower.includes('總體')) {
                    return '<span class="context-tag tag-green">' + content + '</span>';
                } else if (lower.includes('高頻') || lower.includes('口語') || lower.includes('情緒') || lower.includes('談判') || lower.includes('社交') || lower.includes('過渡')) {
                    return '<span class="context-tag tag-rose">' + content + '</span>';
                } else {
                    return '<span class="context-tag tag-neutral">' + content + '</span>';
                }
            });

            // 粗體星號轉紫色強調
            text = text.replace(/\*([^*]+)\*/g, '<span class="highlight-term">$1</span>');
            return text.replace(/\n/g, '<br>');
        }

        // ==================== 重點單字革新排版 (卡片式條目) ====================
        function renderVocabCardItem(rawText) {
            let text = String(rawText).trim();
            let exampleText = "";
            
            // 提取例句部分
            if (text.includes("例句：") || text.includes("例句:")) {
                let parts = text.split(/例句[：:]/);
                text = parts[0].trim();
                exampleText = parts[1].trim();
            }

            // 解析詞性 (v.), (n.), (phr.), (adj.)
            let posMatch = text.match(/\((v\.|n\.|adj\.|adv\.|phr\.|idiom|句型)[^\)]*\)/i);
            let posTagHtml = "";
            if (posMatch) {
                posTagHtml = `<span class="vocab-pos-tag">${posMatch[0]}</span>`;
                text = text.replace(posMatch[0], "").trim();
            }

            // 提取中文解釋（以冒號區分）
            let mainTerm = text;
            let defText = "";
            if (text.includes("：") || text.includes(":")) {
                let colonParts = text.split(/[：:]/);
                mainTerm = colonParts[0].trim();
                defText = colonParts.slice(1).join("：").trim();
            }

            return `
                <div class="vocab-card-item">
                    <div class="vocab-head-row">
                        <span>${formatFormattedText(mainTerm)}</span>
                        ${posTagHtml}
                    </div>
                    ${defText ? `<div class="vocab-def-text">${formatFormattedText(defText)}</div>` : ''}
                    ${exampleText ? `<div class="vocab-example-box"><strong>例句：</strong>${formatFormattedText(exampleText)}</div>` : ''}
                </div>
            `;
        }

        // ==================== Your Tasks 美化結構化渲染 ====================
        function renderTaskBlocks(taskContent) {
            let html = "";
            let lines = taskContent.split('\n');
            let currentTitle = "";
            let currentBody = [];

            function flushBlock() {
                if (currentTitle || currentBody.length) {
                    html += `
                        <div class="task-block">
                            <div class="task-block-title">${currentTitle}</div>
                            <div>${formatFormattedText(currentBody.join('\n'))}</div>
                        </div>
                    `;
                    currentTitle = "";
                    currentBody = [];
                }
            }

            lines.forEach(line => {
                let l = line.trim();
                if (!l) return;
                if (l.match(/^[123]\./) || l.startsWith("【Your Tasks")) {
                    flushBlock();
                    currentTitle = l;
                } else {
                    currentBody.push(l);
                }
            });
            flushBlock();
            return html;
        }

        let isPodcastPlaying = false;
        function togglePodcastPlayback() {
            if (!('speechSynthesis' in window)) return;
            const btn = document.getElementById('podcastMainBtn');
            if (isPodcastPlaying) {
                window.speechSynthesis.cancel();
                isPodcastPlaying = false;
                if (btn) btn.innerText = "▶️ 開始朗讀對話";
            } else {
                window.speechSynthesis.cancel();
                const target = (suiteScope === 'all') ? allItems : [currentPool[currentIndex] || allItems[0]];
                let queue = [];
                target.forEach(l => {
                    if (l.main_content) {
                        l.main_content.split('\n').forEach(line => {
                            let textLine = line.trim();
                            if (textLine.startsWith('（') || textLine.startsWith('(')) return;
                            if (textLine.startsWith('A:')) queue.push({ s: 'A', t: textLine.substring(2).trim() });
                            else if (textLine.startsWith('B:')) queue.push({ s: 'B', t: textLine.substring(2).trim() });
                        });
                    }
                });
                if (!queue.length) return;

                const accentSelect = document.getElementById('podcastAccent');
                const speedSlider = document.getElementById('podcastSpeed');
                const lang = accentSelect ? accentSelect.value : 'en-US';
                const speed = speedSlider ? parseFloat(speedSlider.value) : 0.95;

                isPodcastPlaying = true;
                if (btn) btn.innerText = "⏹️ 停止朗讀";
                let idx = 0;

                function speakNext() {
                    if (!isPodcastPlaying || idx >= queue.length) {
                        isPodcastPlaying = false;
                        if (btn) btn.innerText = "▶️ 開始朗讀對話";
                        return;
                    }
                    const item = queue[idx];
                    const u = new SpeechSynthesisUtterance(item.t);
                    u.lang = lang;
                    u.rate = speed;
                    u.pitch = (item.s === 'A') ? 0.85 : 1.25;
                    u.onend = () => { idx++; speakNext(); };
                    u.onerror = () => { isPodcastPlaying = false; };
                    window.speechSynthesis.speak(u);
                }
                speakNext();
            }
        }

                vocab_notes: vocab ? vocab.split('\n').filter(s => s.trim()) : []
            };

            localItems.push(newItem);
            localStorage.setItem('ryan_networking_supplements_v16', JSON.stringify(localItems));
            allItems.push(newItem);

            alert('✅ 補充成功！');
            closeAdminModal();
            applyFilters();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const selector = document.getElementById('weekFilter');
            if (selector) selector.value = 'week5';
            setTab('sentence');
        });
    </script>
</body>
</html>
