<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Networking English - AI Learning Suite</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #1e1b4b;
            --text-body: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --amber-bg: #fffbeb; --amber-border: #fef3c7; --amber-text: #b45309;
            --sky-bg: #f0f9ff; --sky-border: #e0f2fe; --sky-text: #0369a1;
            --emerald-bg: #ecfdf5; --emerald-border: #d1fae5; --emerald-text: #047857;
            --violet-bg: #faf5ff; --violet-border: #e9d5ff; --violet-text: #6b21a8;
            --bubble-a-bg: #ffffff; --bubble-a-border: #cbd5e1; --bubble-a-text: #0f172a;
            --bubble-b-bg: #eef2ff; --bubble-b-border: #c7d2fe; --bubble-b-text: #1e1b4b;
            --app-max-width: 460px;
        }
        @media (min-width: 640px) {
            :root { --app-max-width: 680px; }
            body { padding: 24px 20px !important; }
            h1 { font-size: 28px !important; }
            .card { padding: 28px 26px !important; max-height: 72vh !important; border-radius: 28px !important; }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); margin: 0; padding: 16px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }
        .app-layout { width: 100%; max-width: var(--app-max-width); display: flex; flex-direction: column; }
        .header { width: 100%; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 25px; font-weight: 800; color: var(--text-title); margin: 4px 0 2px 0; }
        .author-badge {
            display: inline-block; font-size: 12px; font-weight: 700; color: var(--primary);
            background-color: var(--primary-soft); padding: 3px 12px; border-radius: 12px; margin-bottom: 8px;
        }
        .main-mode-nav { display: flex; gap: 6px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; margin-bottom: 10px; }
        .main-mode-btn {
            flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 800; border: none; border-radius: 12px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .main-mode-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 3px 10px rgba(79, 70, 229, 0.15); }
        .pen-toolbar { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 12px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
        }
        .tool-btn.active-pen { background-color: #ffe4e6; border-color: #e11d48; color: #e11d48; }
        .filters { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        select {
            width: 100%; box-sizing: border-box; padding: 13px 16px; font-size: 16px; font-weight: 700;
            border-radius: 16px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none;
        }
        .tab-group { width: 100%; box-sizing: border-box; display: flex; gap: 8px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 11px 6px; font-size: 15px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12); }
        .card-container { width: 100%; flex: 1; display: flex; flex-direction: column; position: relative; }
        .card {
            background-color: var(--card-bg); border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        #drawCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100; }
        .card.canvas-active #drawCanvas { pointer-events: auto; touch-action: none; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .badge.media-badge { background-color: #fef3c7; color: #92400e; }
        .counter { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .title { font-size: 21px; font-weight: 800; color: var(--text-title); margin-bottom: 14px; line-height: 1.35; }
        .block-section { margin-bottom: 18px; text-align: left; }
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 12.5px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
        .tag-violet { background-color: var(--violet-bg); color: var(--violet-text); border: 1px solid var(--violet-border); }
        .block-desc { font-size: 15.5px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }
        
        .dialogue-container { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .chat-bubble-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
        .chat-bubble-row.speaker-b { flex-direction: row-reverse; }
        .speaker-avatar {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; color: #ffffff; flex-shrink: 0; margin-top: 4px;
        }
        .speaker-avatar.avatar-a { background: #2563eb; }
        .speaker-avatar.avatar-b { background: #7c3aed; }
        .chat-bubble-content {
            max-width: 82%; padding: 11px 15px; border-radius: 16px; font-size: 15.5px; line-height: 1.5; font-weight: 600;
        }
        .speaker-a .chat-bubble-content { background-color: var(--bubble-a-bg); border: 1.5px solid var(--bubble-a-border); }
        .speaker-b .chat-bubble-content { background-color: var(--bubble-b-bg); border: 1.5px solid var(--bubble-b-border); }
        
        .vocab-ul { margin: 0; padding-left: 20px; font-size: 15px; color: var(--text-body); line-height: 1.7; }
        .vocab-ul li { margin-bottom: 10px; line-height: 1.6; }
        .highlight-term { color: #3730a3 !important; font-weight: 800 !important; }
        .ipa-tag { color: #6d28d9; font-weight: 700; margin: 0 2px; }

        .quiz-card {
            background-color: var(--violet-bg); border: 1.5px solid var(--violet-border);
            border-radius: 18px; padding: 16px; margin-bottom: 12px;
        }
        .quiz-q { font-size: 15.5px; font-weight: 700; color: #4c1d95; line-height: 1.6; margin-bottom: 10px; }
        .blank-line { display: inline-block; min-width: 80px; border-bottom: 2.5px solid #7c3aed; margin: 0 4px; }
        .quiz-toggle-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff; border: none; padding: 7px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer;
        }
        .quiz-ans-wrapper { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d8b4fe; }
        .quiz-ans-box {
            background: #ffffff; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #bbf7d0;
            font-size: 15px; color: #14532d; line-height: 1.65; white-space: pre-line; font-weight: 600;
        }

        .link-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-color); text-align: left; }
        .link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
            padding: 13px 18px; font-size: 15px; color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            text-decoration: none; font-weight: 700; border-radius: 14px;
        }

        /* 8 大模式 UI */
        .suite-scope-nav { display: flex; gap: 6px; background-color: #f1f5f9; padding: 4px; border-radius: 14px; margin-bottom: 10px; }
        .suite-scope-btn {
            flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 800; border: none; border-radius: 10px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .suite-scope-btn.active { background: #ffffff; color: var(--primary); }
        .suite-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .suite-btn {
            background: #ffffff; border: 1.5px solid #cbd5e1; padding: 10px 8px; border-radius: 14px;
            font-size: 13px; font-weight: 800; color: #334155; cursor: pointer; text-align: left;
        }
        .suite-btn.active { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
        .suite-panel { background: #ffffff; border: 1.5px solid var(--border-color); border-radius: 20px; padding: 18px; }

        .podcast-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #ffffff; padding: 20px 16px; border-radius: 20px; text-align: center;
        }
        .podcast-controls {
            display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 12px 0;
            background: rgba(0, 0, 0, 0.25); padding: 14px; border-radius: 16px;
        }
        .control-row { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 13.5px; color: #c7d2fe; }
        .accent-select { background: #ffffff; color: #1e1b4b; font-weight: 800; padding: 6px 10px; border-radius: 10px; border: none; }
        .podcast-play-btn {
            background: #10b981; color: #fff; border: none; padding: 13px 26px; border-radius: 24px;
            font-size: 15.5px; font-weight: 800; cursor: pointer;
        }
        .podcast-play-btn.playing { background: #ef4444 !important; }

        .nav-controls { width: 100%; display: flex; gap: 12px; margin-top: 12px; }
        .nav-btn { flex: 1; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="header">
            <h1>Networking English</h1>
            <div class="author-badge">By Ryan Liu, V1.3</div>
            <div class="main-mode-nav">
                <button class="main-mode-btn active" onclick="switchAppMode('cards', this)">📚 學習卡片</button>
                <button class="main-mode-btn" onclick="switchAppMode('suite', this)">⚡ 8大學習模組</button>
                <button class="main-mode-btn" onclick="switchAppMode('exam', this)">📝 全真模擬考</button>
            </div>
            <div class="pen-toolbar">
                <button id="penBtn" class="tool-btn" onclick="togglePenMode()">🖍️ 細畫筆</button>
                <button class="tool-btn" onclick="undoLastStroke()">↩️ 復原</button>
                <button class="tool-btn" onclick="clearAllCanvas()">🗑️ 全清</button>
            </div>
        </div>

        <!-- 視圖 1: 學習卡片模式 -->
        <div id="viewCards">
            <div class="filters">
                <select id="weekFilter" onchange="applyFilters()"></select>
                <div class="tab-group">
                    <button id="tabSentence" class="tab-btn active" onclick="setTab('sentence')">句型 / 文法</button>
                    <button id="tabMedia" class="tab-btn" onclick="setTab('media')">影音 / 自習</button>
                </div>
            </div>

            <div class="card-container">
                <div class="card" id="cardElement">
                    <canvas id="drawCanvas"></canvas>
                    <div>
                        <div class="card-header">
                            <div>
                                <span class="badge" id="categoryBadge">分類</span>
                                <span style="font-size: 12.5px; color: #64748b;" id="dateDisplay"></span>
                            </div>
                            <span class="counter" id="counterDisplay">0 / 0</span>
                        </div>
                        <div class="title" id="titleDisplay">標題</div>

                        <div class="block-section" id="takeawaysSection">
                            <div class="tag-title tag-amber">💡 核心重點說明</div>
                            <div class="block-desc" id="takeawaysDisplay"></div>
                        </div>

                        <div class="block-section" id="mainContentSection">
                            <div class="tag-title tag-sky">📖 學習內容與核心對話</div>
                            <div id="mainContentContainer"></div>
                        </div>

                        <div class="block-section" id="quizSection">
                            <div class="tag-title tag-violet">✍️ 實戰練習題</div>
                            <div id="quizContainer"></div>
                        </div>

                        <div class="block-section" id="vocabSection">
                            <div class="tag-title tag-emerald">📝 重點單字與注意事項</div>
                            <ul class="vocab-ul" id="vocabDisplay"></ul>
                        </div>

                        <div class="block-section" id="taskSection">
                            <div class="tag-title tag-violet">🎯 下週課堂延續示範任務</div>
                            <div id="taskContainer" class="block-desc"></div>
                        </div>
                    </div>

                    <div class="link-box" id="linkSection">
                        <a class="link-btn" id="linkDisplay" href="#" target="_blank">🔗 開啟延伸閱讀與學習資源</a>
                    </div>
                </div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
                <button class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
            </div>
        </div>

        <!-- 視圖 2: 8 大特訓模組 -->
        <div id="viewSuite" style="display: none;">
            <div class="suite-scope-nav">
                <button id="scopeCurrentBtn" class="suite-scope-btn active" onclick="setSuiteScope('current', this)">📌 當前選定週次</button>
                <button id="scopeAllBtn" class="suite-scope-btn" onclick="setSuiteScope('all', this)">🌐 全部課程大整合</button>
            </div>

            <div class="suite-grid">
                <button class="suite-btn active" onclick="loadSuiteTool('guide', this)">📖 速成指南</button>
                <button class="suite-btn" onclick="loadSuiteTool('socratic', this)">🏛️ 蘇格拉底問答</button>
                <button class="suite-btn" onclick="loadSuiteTool('forecaster', this)">🎯 考點預測 Top5</button>
                <button class="suite-btn" onclick="loadSuiteTool('confusion', this)">💡 盲點澄清器</button>
                <button class="suite-btn" onclick="loadSuiteTool('gap', this)">🔍 知識缺口診斷</button>
                <button class="suite-btn" onclick="loadSuiteTool('podcast', this)">🎙️ Audio Podcast</button>
            </div>

            <div class="suite-panel" id="suiteContentPanel"></div>
        </div>

        <!-- 視圖 3: 全真模擬考卷 -->
        <div id="viewExam" style="display: none;">
            <div class="card" style="max-height: 75vh;">
                <h2 style="font-size: 20px; color: #1e1b4b; margin-top:0;">📝 Networking English 全真模擬檢測試卷</h2>
                <div id="examContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const rawDatabase = [{"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "社交問候 (Greetings)", "category_en": "Greetings & Small Talk", "title": "初次見面與熟人寒暄 (Greetings & Responses)", "title_en": "Greetings & Daily Catch-ups", "key_takeaways": "1. 首次見面正式與非正式問候。\n2. 問候老朋友時的自然口語：Hey there!, How’s it going?, How are things?\n3. 回答 'How are you?' 的多種替代說法：Same old, same old!, The usual, Pretty much the same, Uneventful。", "key_takeaways_en": "1. Formal vs. Informal greetings for first-time meetings.\n2. Natural casual updates instead of just saying 'I'm fine'.", "main_content": "A: Hi, my name is John. And you are?\nB: I'm Ryan. I'm from IT.\nA: How’s it going?\nB: Pretty good. And you?\nA: Can’t complain. Oops, I’ve got to go. See you around.\nB: Sure! Have a good one!", "vocab_notes": ["Same old, same old [sem old, sem old (phrase)：老樣子、一切照舊。\n  例句：How’s business? — Oh, *same old, same old*.", "Uneventful [ˌʌnɪˈvɛntfəl (adj.)：平靜無事的。\n  例句：The overnight operation was completely *uneventful*.", "Can't complain (phrase)：挺好的、沒什麼好抱怨的。\n  例句：How's the new project? — *Can't complain*, running smoothly.", "Have a good one (phrase)：祝你有美好的一天/週末（美式常用祝福）。"], "vocab_notes_en": ["Same old, same old: Common idiom indicating routine.", "Uneventful: Quiet with no disruptive events."], "practice_quiz": [{"question": "【填空題】當別人問你近況，你想回答「老樣子，一切照舊」：\n_________ , _________ !", "answer": "✔ 填空解答：Same old, same old"}], "instant_guide": {"core_concepts": ["1. 破冰開場語意強度階梯。", "2. 避免機械化回答 I'm fine。"], "misconceptions": ["誤解：每次被問近況都只能回答 I'm fine thank you."], "exam_questions": ["Q1: 請列舉 3 種以上回答 How are you? 的道地替代說法。"]}, "socratic_quiz": [{"level": "社交應對 (Level 1)", "prompt": "為什麼母語人士很少在日常寒暄中回答 'I'm fine, thank you'？", "feedback": "因為聽起來過於制式與距離感，使用 'Can't complain' 或 'Same old' 能展現更多人情味與互動。"}], "confusion_fixer": {"analogy": "【生活類比】：問候就像拋接球，制式回答會把球直接接死，而道地回覆則能順暢地把話題拋回給對方。", "real_example": "Hey Ryan, how are things? ➔ Can't complain, just wrapping up the safety audit.", "common_mistake": "錯誤：How do you do? 用於熟人寒暄（✖ 僅用於非常正式的初次見面握手）。"}, "gap_finder": ["⚠️ 潛在缺口：缺少主動拋出反問（And you?）的習慣。"], "link": "https://www.linkedin.com/pulse/18-ways-say-hello-english-thomas-spengler/", "link_text": "18 Ways to Say Hello in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "道別用語 (Goodbyes)", "category_en": "Goodbyes & Core Grammar", "title": "道別與核心文法規則 (Ways to Say Goodbye & Grammar)", "title_en": "Ways to Say Goodbye & Grammar Rule", "key_takeaways": "1. 非正式道別：See you later, I've got to get going, Take it easy, Have a good one, I'm off!\n2. 正式道別：It was nice meeting you, It was a pleasure to see you, I look forward to our next meeting!\n3. 文法核心 Pro Tip：Look forward to + V-ing（to 是介系詞，後面必須接動名詞 V-ing 或名詞）！", "key_takeaways_en": "1. Informal vs Formal goodbyes.\n2. Grammar Rule: Look forward to MUST be followed by V-ing.", "main_content": "A: I've got to get going! I look forward to our next meeting.\nB: Take it easy! Have a good one!\nA: It was a pleasure to see you.\nB: I look forward to seeing you soon in Kaohsiung.", "vocab_notes": ["I've got to / I've gotta (phr.)：我必須走了（等同於 I need to / I have to）。\n  例句：*I've got to* get going before the traffic gets heavy.", "Take it easy (idiom)：保重、放輕鬆（非正式道別）。\n  例句：*Take it easy* this weekend, you've worked hard.", "Look forward to + V-ing (phr.)：期待...（商務書信高頻介系詞片語）。\n  例句：I *look forward to collaborating* with your team."], "vocab_notes_en": ["I've got to: Equivalent to I have to.", "Look forward to + V-ing: Anticipating future events with excitement."], "practice_quiz": [{"question": "【文法填空題】請填入 see 的正確動詞形式：\nI look forward to _________ you next week.", "answer": "✔ 填空解答：seeing (V-ing)\n💡 解析：Look forward to 的 to 是介系詞，後方必須接 V-ing。"}], "instant_guide": {"core_concepts": ["1. Look forward to 的介系詞本質。"], "misconceptions": ["誤解：看到 to 就直覺接原形動詞 (to see) ➔ ✖ 錯誤！"], "exam_questions": ["Q1: 請更正：We look forward to discuss the project."]}, "socratic_quiz": [{"level": "文法陷阱題 (Level 1)", " : "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U5L4_5.4.1.mp4", "link_text": "觀看 Business Partner 5.4.1 影片 (MP4)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "自習與網路資源 (Self-Study Tasks)", "category_en": "Self-Study Resources", "title": "告別生硬問候與 BBC 職場入門 (Papa Teach Me & BBC)", "title_en": "Beyond 'I'm Fine' & BBC English at Work Intro", "key_takeaways": "【自習任務摘要】\n1. Papa Teach Me 影片：學習超過 15 種回答 'How are you?' 的在地替代說法，以及當對方氣色不佳時的 5 種關心問句。\n2. BBC English at Work：認識 Tip Top Trading 公司背景與職場用語（Eavesdrop, recruit）。", "key_takeaways_en": "Summary: Master 15+ alternatives to 'How are you?' and explore BBC workplace terminology.", "main_content": "A: How are you doing today?\nB: Never better! Couldn't be better!\nA: Are you feeling alright? You look a bit under the weather.\nB: I'm a bit tired, but hanging in there.", "vocab_notes": ["Under the weather [ˈʌndɚ ðə ˈwɛðɚ (idiom)：身體微恙、精神不適。\n  例句：She stayed home because she felt *under the weather*.", "Never better [ˈnɛvɚ ˈbɛtɚ (idiom)：再好不過了、狀態處於顛峰。"], "vocab_notes_en": ["Under the weather: Feeling slightly ill or fatigued.", "Never better: At peak physical or mental condition."], "next_week_tasks": ["💡 準備好隨時用 Papa Teach Me 片語即興回答 How are you?"], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "觀看 Papa Teach Me 教學影片 (YouTube)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "走廊寒暄 (Catching Up)", "category_en": "Corridor Small Talk", "title": "巧遇寒暄與公務告退 (Catching up & Polite Departure)", "title_en": "Casual Catch-up & Polite Departure", "key_takeaways": "1. 30秒走廊偶遇寒暄：'How have you been?' ➔ 'Same old, same old.'\n2. 有禮貌地因公告退：'I've got to get back to work. I need to turn in a report by 5:30pm.'\n3. 對方給予正面祝福：'Good luck with that!'", "key_takeaways_en": "1. Quick corridor catch-up and polite departure.\n2. Excusing yourself to meet report deadlines.", "main_content": "A: Hi, Alex. How have you been?\nB: Things are good~ And how are things with you?\nA: Same old, same old.\nB: What are you doing after class?\nA: I've got to get back to work. I need to turn in a report by 5:30pm.\nB: Wow, ok. Good luck with that!\nA: Thanks! I really need it!", "vocab_notes": ["Turn in a report [tɜrn ɪn ə rɪˈpɔrt (v. phr.)：呈報、繳交報告。\n  例句：I must *turn in* the safety audit report before 5 PM.", "Good luck with that! (phrase)：祝你順利（帶有一點挑戰性的真誠祝福）。\n  例句：You have three audits today? Wow, *good luck with that*!"], "vocab_notes_en": ["Turn in a report: Submit a document before deadline.", "Good luck with that!: Friendly encouragement for a tough task."], "practice_quiz": [{"question": "【填空題】你想表達「我必須在五點半前交報告」，請填入動詞片語 turn ___：\nI need to _________ in a report by 5:30pm.", "answer": "✔ 填空解答：turn"}], "instant_guide": {"core_concepts": ["1. 辦公室走廊的短暫高效社交。", "2. 具體說出任務與死線（turn in a report by...）。"], "misconceptions": ["誤解：離開時直接走開不打招呼（缺乏職場禮貌）。"], "exam_questions": ["Q1: 請造句說明你必須在明天中午前繳交安全評估報告。"]}, "socratic_quiz": [{"level": "職場禮儀 (Level 1)", "prompt": "在走廊遇到正要趕路的同事，為什麼加上 'Good luck with that!' 比單純說 Bye 更好？", "feedback": "能展現出對同事工作挑戰的同理與支持，拉近團隊距離。"}], "confusion_fixer": {"analogy": "【生活類比】：就像在便利商店遇到熟人打招呼，講完近況後立刻要趕去上班的真實情境。", "real_example": "I need to *turn in* the compliance checklist before the team meeting.", "common_mistake": "錯誤：I need to send in the report to my boss. (send in 較少用於正式繳交紙本或系統報告，優先用 turn in 或 submit)。"}, "gap_finder": ["⚠️ 潛在缺口：缺少在告退時順口給予對方鼓勵的話語。"]}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation)", "category_en": "Travel & Logistics", "title": "研討會住宿與地鐵動線描述 (AIChE Minneapolis)", "title_en": "AIChE Conference Transit & Hotel Proximity", "key_takeaways": "1. 飯店評估指標：Price, Location, Distance to the venue。\n2. 描述步行與地鐵直達：\n   - 'The hotel is within walking distance.' (5-minute walk)\n   - 'I can take the subway directly without transferring.'\n3. 認識明尼阿波利斯 Skyway 空中步道系統（室內防寒防雨連通通道）。", "key_takeaways_en": "1. Hotel comparison criteria (Price, Location, Distance).\n2. Expressing walkability and direct subway transit without transfers.", "main_content": "A: The hotel is near the subway station and within walking distance.\nB: From the hotel, can I take the subway directly to the conference venue?\nA: Yes, you can take the Blue Line directly. You don't need to transfer.\nB: That is very convenient. I have no idea about their room price.", "vocab_notes": ["Within walking distance (phr.)：步行可達的距離。\n  例句：Our hotel is *within walking distance* of the convention center.", "Transfer [trænsˈfɚ (v./n.)：轉乘、換車（搭乘大眾運輸）。\n  例句：Take the Blue Line directly; there is no need to *transfer*."], "vocab_notes_en": ["Within walking distance: Easily accessible on foot.", "Transfer: Change from one vehicle or line to another."], "practice_quiz": [{"question": "【填空題】描述飯店離會場走路就能到，請填入固定片語：\nThe hotel is _________ _________ distance.", "answer": "✔ 填空解答：within walking"}], "instant_guide": {"core_concepts": ["1. 住宿地點優勢描述。", "2. 大眾運輸直達與免轉乘表達。"], "misconceptions": ["誤解：認為轉車只能說 change trains（正式商務更常使用 transfer）。"], "exam_questions": ["Q1: 請比較 Hilton Minneapolis 與 Hyatt Regency 的房價與交通距離。"]}, "link": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf?v=1726683206", "link_text": "Minneapolis Skyway & Hotel Map (PDF)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "商務人脈 (Networking)", "category_en": "Networking Role-Play", "title": "展會破冰與部門職掌交流 (Networking Role-Play 投影片全劇本)", "title_en": "Networking Role-Play Full Script", "key_takeaways": "【Networking 6階段黃金劇本】\n1. 自我介紹與部門 ➔ 2. 詢問對方部門 ➔ 3. 簡述自己部門職掌 ➔ 4. 帶出工作痛點 ➔ 5. 提供協助 ➔ 6. 交換名片。\n核心金句：'You just remind me that we may need your help in...' 與 'Here's my business card should you want to call.'", "key_takeaways_en": "6-Stage Networking Script: Introduction, Department inquiry, Value pitch, Pain point bridge, Offering help, and Card exchange.", "main_content": "A: Hello, I’m Ryan. I work as a Senior EHS Specialist in Process Safety.\nB: Hi, I’m Alex. It’s a pleasure to meet you.\nA: Can you tell me about your department?\nB: Sure! I work in Operations. We manage plant production lines.\nA: Can I briefly tell you about what our department does?\nB: Of course! I’m all ears. Fire away!\nA: We conduct safety risk assessments and incident prevention audits.\nB: You just remind me that we may need your help in identifying chemical vapor leakage risks.\nA: Yeah, I think we might be able to help you.\nB: Here's my business card should you want to call.", "vocab_notes": ["I'm all ears [aɪm ɔl ɪrz (idiom)：我洗耳恭聽、全神貫注。\n  例句：Tell me about your plant expansion plan; *I’m all ears*.", "Fire away! [ˈfaɪər əˈwe (idiom)：請說吧！請開始問吧！\n  例句：Do you have questions regarding the safety protocol? *Fire away*!", "You just remind me that... (phr.)：你正好提醒了我...（切入痛點的神級轉折句）。", "Should you want to call (phr.)：若您想致電的話（高階倒裝假設句）。"], "vocab_notes_en": ["I'm all ears: Listening with full attention.", "Fire away!: Permission to start speaking or asking questions."], "practice_quiz": [{"question": "【填空題】對方想向你簡報，你熱情說「請說吧！我洗耳恭聽」：\nI'm all _________ ! / _________ away!", "answer": "✔ 填空解答：ears, Fire"}], "instant_guide": {"core_concepts": ["1. 透過聆聽對方的部門痛點，順勢建立商業合作機會。"], "misconceptions": ["誤解：Networking 等同於盲目發名片（應著重於 Value Creation）。"], "exam_questions": ["Q1: 請默寫出帶出痛點的關鍵句型 You just remind me that..."]}, "link": "", "link_text": "Networking 6-Stage Masterclass"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "BBC 職場自習 (BBC Networking)", "category_en": "BBC Networking Self-Study", "title": "商務社交實戰：Tip Top Trading (BBC #48 Face-to-face)", "title_en": "Networking Face-to-Face (BBC #48)", "key_takeaways": "【劇情與語言重點】\n1. 在艱困經濟大環境（Tough economic climate）下，Anna 參加展會進行 Networking 與 schmoozing。\n2. 核心心態：Just be chatty and friendly, give it a shot, get down to business。", "key_takeaways_en": "Summary: Anna networks in a tough economic climate, learning to be chatty, friendly, and proactive.", "main_content": "A: Do some networking and do some schmoozing with new clients.\nB: I’ll give it a shot. Let’s get down to business.\nA: It is a tough economic climate, and we need new opportunities.\nB: Here is my business card should you want to call.", "vocab_notes": ["Schmooze [ʃmuz (v.)：社交應酬、拉攏建立人脈。\n  例句：Conference receptions are great to *schmooze* with partners.", "Give it a shot (idiom)：嘗試一下、給它一個機會（同 give it a try）。\n  例句：I'm not sure if it will work, but let's *give it a shot*!"], "vocab_notes_en": ["Schmooze: Talk casually and friendly to gain advantage.", "Give it a shot: Try something out enthusiastically."], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/48-language-for-networking", "link_text": "前往 BBC 課程網頁 (收聽音檔與劇本)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "科技與隱私自習 (Tech & Privacy)", "category_en": "Tech & Privacy Self-Study", "title": "Passkey 原理與智慧眼鏡防偷拍 (BBC News & CNN)", "title_en": "Passkey Security & Smart Glasses Privacy Hack", "key_takeaways": "【自習任務摘要】\n1. BBC News：探討 Passkey（通行密鑰）如何透過生物辨識（Touch ID / Face ID）取代易被駭的密碼。\n2. CNN Shorts：探討智慧眼鏡隱私隱憂，以及利用播放版權音樂（迪士尼歌曲）觸發演算法自動下架偷拍影片的奇招。", "key_takeaways_en": "Summary: Explore biometric passkeys replacing passwords and viral privacy hacks against smart glasses filming.", "main_content": "A: Passkeys replace traditional passwords with fast biometric authentication.\nB: They use cryptographic key pairs on your device to resist phishing attacks.\nA: If you suspect being filmed by smart glasses, play a copyrighted song to trigger auto-takedown algorithms.", "vocab_notes": ["Authentication [ɔˌθɛntɪˈkeʃən (n.)：身分驗證、認證。\n  例句：Multi-factor *authentication* is mandatory.", "Copyright infringement [ˈkɑpiˌraɪt ɪnˈfrɪndʒmənt (n.)：侵犯著作權/版權。"], "vocab_notes_en": ["Authentication: Verifying identity before granting access.", "Copyright infringement: Unauthorized use of copyrighted material."], "link": "https://www.youtube.com/watch?v=lf5L_1oqHDs", "link_text": "開啟 BBC Passkey 影片 (02:35)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "展會深度洽談 (Trade Fair In-depth)", "category_en": "Trade Fair In-depth Discussion", "title": "規格需求詢問與價值主張 (Exploring Client Needs & Value Pitch)", "title_en": "Exploring Client Needs & Value Proposition", "key_takeaways": "1. 展會進階技巧：詢問客戶實際工程規格與技術痛點（'What specific challenges are you facing with...?'）。\n2. 價值主張：精準使用動詞陳述效益（'It reduces VOC emissions by 95% without disrupting throughput.'）。\n3. 系統相容性確認：'Does it integrate seamlessly with existing PLC architectures?'", "key_takeaways_en": "1. Uncovering technical specs and pain points.\n2. Articulating value proposition and seamless PLC integration.", "main_content": "A: What specific challenges are you currently facing with your chemical distribution lines?\nB: We are struggling with vapor emissions during high-temperature transfers.\nA: That's a critical safety issue. Our automated vapor recovery system complies with the latest environmental regulations.\nB: Really? Does it integrate seamlessly with existing PLC architectures?\nA: Absolutely. It typically reduces VOC emissions by over 95% without disrupting throughput.", "vocab_notes": ["Comply with [kəmˈplaɪ wɪð (v. phr.)：遵守、符合法規。\n  例句：Our storage tanks fully *comply with* OSHA standards.", "Seamlessly [ˈsimləsli (adv.)：無縫地、完美銜接。\n  例句：The software integrates *seamlessly* with our DCS control loop.", "Throughput [ˈθruˌpʊt (n.)：生產吞吐量、單位時間產出率。\n  例句：The optimization project enhanced plant *throughput* by 15%."], "vocab_notes_en": ["Comply with: Act in accordance with rules.", "Seamlessly: Smoothly and continuously without interruption.", "Throughput: Amount of material processed in a given period."], "practice_quiz": [{"question": "【填空題】新設備完全符合法規規範，請填入動詞片語 comply ___：\nThe new unit strictly _________ _________ environmental regulations.", "answer": "✔ 填空解答：comply with"}], "instant_guide": {"core_concepts": ["1. 挖掘痛點提問法。", "2. 效益量化呈現與無縫整合。"], "misconceptions": ["誤解：comply 搭配 to（正確應為 comply with）。"], "exam_questions": ["Q1: 請造句說明新設備能無縫整合至現有產線。"]}, "socratic_quiz": [{"level": "技術銷售策略 (Level 1)", "prompt": "當客戶提出蒸氣逸散痛點時，為什麼先確認現有系統相容性比直接報價更關鍵？", "feedback": "化工客戶最關心停機時間與整合風險，確認能無縫接軌才能建立技術信任。"}], "confusion_fixer": {"analogy": "【生活類比】：介紹新設備就像幫手機換充電線，integrates seamlessly（無縫整合）比強調線材很粗更具說服力！", "real_example": "Our safety valve retrofit *complies with* regulations and integrates *seamlessly*.", "common_mistake": "錯誤：The system complies to the standard.（✖ comply 必須搭配 with）。"}, "gap_finder": ["⚠️ 潛在缺口：缺乏將專業術語轉化為商業財務語言（ROI）的能力。"]}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "行程重約與確認 (Rescheduling)", "category_en": "Scheduling & Rescheduling Meetings", "title": "會議重約、推遲與專業應對 (Rescheduling & Confirming Appointments)", "title_en": "Professional Meeting Rescheduling & Follow-ups", "key_takeaways": "1. 商務突發狀況應對：因緊急生產或稽核撞期時，向客戶推遲或改期。\n2. 改期黃金三步驟：致歉說明事由 (Something has come up) ➔ 提議時段 (Push back to...) ➔ 感謝彈性 (Thank you for your flexibility)。", "key_takeaways_en": "1. Politely reschedule or postpone meetings due to unexpected audits.\n2. Proposing alternatives and expressing appreciation for flexibility.", "main_content": "A: Good morning Alex, I'm calling regarding our scheduled safety review this afternoon.\nB: Sure Ryan. Has something urgent come up at the plant?\nA: Yes, an unexpected site audit requires my presence. Would it be possible to push our meeting back to Thursday morning?\nB: Thursday morning works perfectly. Shall we say 10:30 AM?\nA: That suits me well. I'll send out an updated calendar invite shortly. Thank you for your flexibility!", "vocab_notes": ["Push back [pʊʃ bæk (v. phr.)：推遲、延後會議。\n  例句：Can we *push back* the kick-off meeting by an hour?", "Something urgent has come up (phr.)：臨時有緊急要事發生。\n  例句：I apologize for the short notice, but *something urgent has come up*.", "Updated calendar invite (n.)：更新後的行事曆會議邀請。", "Thank you for your flexibility (phr.)：感謝您的彈性配合。"], "vocab_notes_en": ["Push back: Postpone or reschedule an event.", "Something urgent has come up: Unanticipated critical task."], "practice_quiz": [{"question": "【填空題】因為廠區突發狀況，你想提議「把會議延後到週四」，請填入片語 push ___：\nWould it be possible to _________ the safety meeting _________ to Thursday?", "answer": "✔ 填空解答：push, back"}], "instant_guide": {"core_concepts": ["1. 改期的黃金三步驟與後續行事曆確認。"], "misconceptions": ["誤解：口語習慣用 delay（應使用正向專業的 push back）。"], "exam_questions": ["Q1: 請寫出將會議延後至下週二下午兩點的商務信函句子。"]}, "socratic_quiz": [{"level": "情境應對 (Level 1)", "prompt": "臨時推遲會議時，為什麼主動加上 Thank you for your flexibility 能大幅降低對方的負面觀感？", "feedback": "這展現了對他人時間的尊重，將原本造成的不便轉化為對對方配合度的感謝。"}], "confusion_fixer": {"analogy": "【生活類比】：改會議就像改約打球，不能只說不去了，要說臨時有急事改明天可以嗎？謝謝配合！", "real_example": "Would it be possible to *push back* our session? *Thank you for your flexibility*!", "common_mistake": "錯誤：Can we delay the meeting?（delay 帶有消極拖延色彩）。"}, "gap_finder": ["⚠️ 潛在缺口：口語習慣使用 delay 或 cancel，缺少 push back 語感。"]}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "商務談判自習 (Negotiation Study)", "category_en": "Business Negotiation Study", "title": "商務合作意向與條件商討 (Business Partner A2 6.4.1)", "title_en": "Negotiating Terms & Mutual Value (BP A2 6.4.1)", "key_takeaways": "【詳細劇情情境摘要】\n雙方代表正式進入商務合作細節商討。對話聚焦於供貨週期（Lead Time）、保固維修條款以及最小採購量（MOQ）。雙方透過專業退讓與交換條件（Trade-offs），展現雙贏策略。", "key_takeaways_en": "Summary: Business representatives negotiate supply lead times, warranty terms, and minimum order quantities.", "main_content": "A: What is your standard lead time for customized chemical sensor units?\nB: Typically it takes 4 to 6 weeks from purchase order confirmation.\nA: We need delivery expedited within 3 weeks due to our turnaround schedule.\nB: If you can finalize the purchase order by this Friday, we can prioritize your batch.", "vocab_notes": ["Lead time [lid taɪm (n.)：交期、前置時間。\n  例句：Reducing *lead time* is vital for meeting turnaround deadlines.", "Turnaround [ˈtɜrnəˌraʊnd (n.)：工廠大修、歲修停爐維護期。\n  例句：All critical sensor replacements must finish before the annual *turnaround*.", "Expedite [ˈɛkspəˌdaɪt (v.)：加速、加快生產進度。\n  例句：We are willing to pay an overtime fee to *expedite* fabrication."], "vocab_notes_en": ["Lead time: Time between initiation and completion of a production process.", "Turnaround: Planned periodic shutdown of a unit for maintenance.", "Expedite: Make a process happen sooner."], "next_week_tasks": ["💡 課堂角色扮演預告：模擬採購主管與供應商，針對縮短交期進行 1 分鐘談判條件交換演練！"], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U6L4_6.4.1.mp4", "link_text": "觀看 Business Partner 6.4.1 談判影片 (MP4)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "BBC 職場自習 (BBC Meetings)", "category_en": "BBC English at Work", "title": "會議控場與發言技巧：Tip Top Trading (BBC #49 Clarification)", "title_en": "Clarifying Points & Chairing Meetings (BBC #49)", "key_takeaways": "【詳細劇情情境摘要】\nTip Top Trading 公司召開產品策略會議。本單元重點在於如何在會議中得體地打斷發言、請求澄清（Asking for clarification），並維持專業禮貌。", "key_takeaways_en": "Summary: Practice polite interruptions, seeking clarifications, and voicing constructive concerns respectfully in meetings.", "main_content": "A: Sorry to interrupt, but could you clarify the timeline for the safety audit?\nB: We are aiming to complete the verification before the end of Q3.\nA: What exactly do you mean by operational bottleneck?\nB: Let's make sure we are all on the same page before moving to the next agenda item.", "vocab_notes": ["Clarify [ˈklærəˌfaɪ (v.)：澄清、使...明確。\n  例句：Could you *clarify* the root cause outlined in the investigation report?", "Interrupt [ˌɪntəˈrʌpt (v.)：打斷、插話。\n  例句：Pardon me for *interrupting*, but I have an update from the control room."], "vocab_notes_en": ["Clarify: Make a statement less confused and more clearly comprehensible.", "Interrupt: Stop the continuous progress of speech."], "next_week_tasks": ["💡 課堂主持練習：分組進行 3 分鐘會議模擬，每位組員使用至少 1 次 'Sorry to interrupt, but could you clarify...' 進行提問！"], "link": "https://www.bbc.co.uk/learningenglish/features/english-at-work/49-asking-for-clarification", "link_text": "前往 BBC 課程網頁 (收聽音檔與劇本)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "線上會議工具與自學專題 (Additional Links)", "category_en": "Additional Study Links", "title": "線上會議疑難排解與實用專題 (Video Conferencing & Self-Study)", "title_en": "Video Conferencing Issues & Additional Resources", "key_takeaways": "【第三週補充影音與文章清單】\n收錄講義中包含的線上會議 6 大常見問題排解、Tripp & Tyler 幽默實境短片、Costco 便宜汽油商業分析及 BBC Humming 心理學短片。", "key_takeaways_en": "Summary: Comprehensive collection of additional video conferencing troubleshooting and self-study links for Week 3.", "main_content": "• 補充影音資源總覽:\n  1. BP A2 Video 1.1.1 (What Do You Do?): 了解職場日常工作職責描述。\n  2. 6 Common Issues with Video Conferencing and How to Solve Them: 掌握視訊會議音訊與連線故障排除英文。\n  3. BP A2 Video 4.4.1: 辨識線上會議中的各類問題。\n  4. Tripp & Tyler 爆笑短片: A Conference Call in Real Life。\n  5. CNBC Make It: Why Costco Gas is So Cheap (商業案例解析)。\n  6. BBC Global: The Psychological Benefits of Humming (身心放鬆技巧)。", "vocab_notes": ["Troubleshooting [ˈtrʌbəlˌʃutɪŋ (n.)：故障排除、問題除錯。\n  例句：IT specialists provide *troubleshooting* for video conferencing glitches."], "vocab_notes_en": ["Troubleshooting: Analyzing and solving complex problems in systems."], "next_week_tasks": ["💡 課後自習任務：觀看上述任一補充影片，並用 1-2 句英文寫下心得筆記。"], "link": "https://www.usherwood.com/blog/6-common-issues-with-video-conferencing-and-how-to-solve-them", "link_text": "閱讀 Usherwood 視訊會議疑難排解文章"}];
        const examData = {"title": "Networking English 全真模擬檢測試卷 (Mid-Term Practice)", "sections": [{"type": "單選題 (Multiple Choice)", "questions": [{"q": "1. Which of the following is grammatically CORRECT when ending a business email?", "options": ["A. I look forward to see you next week.", "B. I look forward to seeing you next week.", "C. I look forward to meet with you.", "D. I am looking forward to meet you."], "ans": "B", "explanation": "Look forward to 中的 to 是介系詞，後方必須搭配動名詞 (seeing)。"}, {"q": "2. When facing an unexpected scheduling conflict and needing to postpone a meeting, which phrase is most professional?", "options": ["A. I delay our meeting today.", "B. Would it be possible to push our meeting back to Thursday?", "C. Take it easy!", "D. Things have been pretty uneventful."], "ans": "B", "explanation": "push back 是商務上推遲、延後會議最得體專業的用語，不帶負面色彩。"}]}, {"type": "填空題 (Fill-in-the-Blank)", "questions": [{"q": "3. The new environmental recovery unit strictly _________ _________ international safety standards. (符合/遵守法規規範)", "ans": "complies with", "explanation": "comply with 為遵守安全標準之固定搭配片語（不可寫 comply to）。"}]}]};

        const FEMALE_VOICE_NAMES = ['Samantha', 'Karen', 'Victoria', 'Moira', 'Fiona', 'Veena', 'Priya', 'Zira', 'Jenny', 'Serena', 'Kate', 'Susan', 'Female'];

        function initVoicesByAccent(accentLang) {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (!voices.length) return;

            let matchVoices = voices.filter(v => v.lang.toLowerCase().replace('_', '-').startsWith(accentLang.toLowerCase()));
            if (!matchVoices.length) matchVoices = voices.filter(v => v.lang.startsWith('en'));

            speakerAVoice = matchVoices.find(v => MALE_VOICE_NAMES.some(n => v.name.includes(n))) || matchVoices[0];
            speakerBVoice = matchVoices.find(v => v !== speakerAVoice && FEMALE_VOICE_NAMES.some(n => v.name.includes(n))) || matchVoices[matchVoices.length - 1] || speakerAVoice;
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => initVoicesByAccent(selectedAccent);
            initVoicesByAccent(selectedAccent);
        }

        function switchAppMode(mode, btn) {
            document.querySelectorAll('.main-mode-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            document.getElementById('viewCards').style.display = (mode === 'cards') ? 'block' : 'none';
            document.getElementById('viewSuite').style.display = (mode === 'suite') ? 'block' : 'none';
            document.getElementById('viewExam').style.display = (mode === 'exam') ? 'block' : 'none';

            if (mode === 'suite') loadSuiteTool(currentSuiteTool);
            if (mode === 'exam') renderExam();
        }

        function setSuiteScope(scope, btn) {
            suiteScope = scope;
            document.querySelectorAll('.suite-scope-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadSuiteTool(currentSuiteTool);
        }

        function loadSuiteTool(toolName, btn) {
            currentSuiteTool = toolName;
            if (btn) {
                document.querySelectorAll('.suite-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            const panel = document.getElementById('suiteContentPanel');
            const targetLessons = (suiteScope === 'all') ? rawDatabase : [filteredPool[currentIndex] || rawDatabase[0]];

            if (toolName === 'confusion') {
                let confusions = [];
                targetLessons.forEach(l => {
                    if (l.confusion_fixer) confusions.push(l.confusion_fixer);
                });
                if (!confusions.length) {
                    confusions = [{
                        analogy: "【生活類比】：介系詞 to 就像接力棒，後面只傳給名詞或動名詞。",
                        real_example: "I look forward to our meeting tomorrow.",
                        common_mistake: "錯誤：I look forward to meet you."
                    }];
                }
                panel.innerHTML = `
                    <h3 style="margin-top:0; color:#1e1b4b;">💡 Confusion Fixer (${suiteScope === 'all' ? '全部課程概念盲點澄清' : '當前概念盲點澄清'})</h3>
                    ${confusions.map(c => `
                        <div style="margin-bottom:16px;">
                            <div style="background:#fffbeb; border:1px solid #fef3c7; border-radius:12px; padding:12px; margin-bottom:6px; font-size:14.5px; color:#92400e; font-weight:600;">
                                ${c.analogy}
                            </div>
                            <div style="background:#f0f9ff; border:1px solid #e0f2fe; border-radius:12px; padding:12px; margin-bottom:6px; font-size:14.5px; color:#0369a1; font-weight:600;">
                                🏢 職場實戰例句：<br>${c.real_example}
                            </div>
                            <div style="background:#fef2f2; border:1px solid #fee2e2; border-radius:12px; padding:12px; font-size:14.5px; color:#991b1b; font-weight:600;">
                                ⚠️ 最易犯錯對比：<br>${c.common_mistake}
                            </div>
                        </div>
                    `).join('')}
                `;
            } else if (toolName === 'guide') {
                let concepts = [], misconceptions = [], questions = [];
                targetLessons.forEach(l => {
                    if (l.instant_guide) {
                        concepts = concepts.concat(l.instant_guide.core_concepts || []);
                        misconceptions = misconceptions.concat(l.instant_guide.misconceptions || []);
                        questions = questions.concat(l.instant_guide.exam_questions || []);
                    }
                });
                if (!concepts.length) {
                    concepts = ["1. 掌握商務社交核心開場白", "2. 精準辨識對話情境", "3. 正確使用時態與介系詞"];
                    misconceptions = ["誤解 1：以為開場只能說 I'm fine", "誤解 2：忽略 Look forward to 後接動名詞"];
                    questions = ["Q1: 如何向外賓介紹在地美食並運用 worth + V-ing？", "Q2: 遇到行程撞期時如何專業說明？"];
                }
                panel.innerHTML = `
                    <h3 style="margin-top:0; color:#1e1b4b;">📖 Instant Study Guide (${suiteScope === 'all' ? '全部課程總覽' : '單週速成'})</h3>
                    <div style="font-size:14px; font-weight:700; color:#4f46e5; margin-bottom:6px;">🎯 核心概念：</div>
                    <ul class="vocab-ul">${concepts.map(c => `<li>${c}</li>`).join('')}</ul>
                    <div style="font-size:14px; font-weight:700; color:#b45309; margin:12px 0 6px 0;">⚠️ 常見誤解：</div>
                    <ul class="vocab-ul">${misconceptions.map(m => `<li>${m}</li>`).join('')}</ul>
                    <div style="font-size:14px; font-weight:700; color:#047857; margin:12px 0 6px 0;">✍️ 實戰自測題：</div>
                    <ul class="vocab-ul">${questions.map(q => `<li>${q}</li>`).join('')}</ul>
                `;
            } else if (toolName === 'socratic') {
                let sqList = [];
                targetLessons.forEach(l => {
                    if (l.socratic_quiz) sqList = sqList.concat(l.socratic_quiz);
                });
                if (!sqList.length) {
                    sqList = [{
                        level: "啟發提問 (Level 1)",
                        prompt: "為什麼在商務社交中，主動詢問對方部門業務比直接推銷更有效？",
                        feedback: "因為主動聆聽能先建立互信並找出業務痛點，後續才能精準提供自身專業作為解決方案。"
                    }];
                }
                panel.innerHTML = `
                    <h3 style="margin-top:0; color:#1e1b4b;">🏛️ Socratic Quiz (${suiteScope === 'all' ? '跨週階梯提問' : '當前主題提問'})</h3>
                    ${sqList.map(q => `
                        <div style="background:#faf5ff; border:1px solid #e9d5ff; border-radius:14px; padding:12px; margin-bottom:10px;">
                            <div style="font-weight:800; color:#6b21a8; font-size:14px;">${q.level}</div>
                            <div style="font-size:15px; margin:6px 0; font-weight:600; color:#1e1b4b;">${q.prompt}</div>
                            <button class="quiz-toggle-btn" style="padding:4px 10px; font-size:12px;" onclick="this.nextElementSibling.style.display = (this.nextElementSibling.style.display==='block'?'none':'block')">
                                💡 查看蘇格拉底啟發引導
                            </button>
                            <div style="display:none; margin-top:8px; font-size:14px; color:#15803d; line-height:1.5; font-weight:600;">
                                ${q.feedback}
                            </div>
                        </div>
                    `).join('')}
                `;
            } else if (toolName === 'gap') {
                let gapList = [];
                targetLessons.forEach(l => {
                    if (l.gap_finder) gapList = gapList.concat(l.gap_finder);
                });
                if (!gapList.length) {
                    gapList = [
                        "⚠️ 缺口 1：換名片後的 24 小時 Follow-up Email 句型練習不足。",
                        "⚠️ 缺口 2：在吵雜展會環境下，尚未準備好 10 秒精準自我介紹。"
                    ];
                }
                panel.innerHTML = `
                    <h3 style="margin-top:0; color:#1e1b4b;">🔍 Gap Finder (${suiteScope === 'all' ? '全部課程弱點診斷' : '單週弱點診斷'})</h3>
                    <div style="font-size:14.5px; color:#475569; line-height:1.6; font-weight:600;">
                        系統比對分析後，發現以下容易被忽略的實戰盲點：
                    </div>
                    <ul class="vocab-ul" style="margin-top:8px;">${gapList.map(g => `<li>${g}</li>`).join('')}</ul>
                `;
            } else if (toolName === 'forecaster') {
                panel.innerHTML = `
                    <h3 style="margin-top:0; color:#1e1b4b;">🎯 Exam Forecaster (高頻考點 Top 5 預測)</h3>
                    ${top5Data.map(t => `
                        <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:8px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="font-weight:800; color:#4f46e5;">${t.rank}</span>
                                <span style="background:#dcfce7; color:#166534; font-size:12px; font-weight:700; padding:2px 8px; border-radius:8px;">${t.prob}</span>
                            </div>
                            <div style="font-weight:700; margin:6px 0; color:#1e1b4b;">${t.topic}</div>
                            <div style="font-size:14px; color:#475569;">${t.challenge_q}</div>
                            <div style="margin-top:6px; font-size:14px; color:#166534; font-weight:600;">${t.challenge_ans}</div>
                        </div>
                    `).join('')}
                `;
            } else if (toolName === 'podcast') {
                panel.innerHTML = `
                    <div class="podcast-box">
                        <h3 style="color:#fff; margin:0 0 6px 0;">🎙️ Audio Study Partner (自然男女雙人聲)</h3>
                        <div style="font-size:13px; color:#c7d2fe; margin-bottom:10px;">👨 Speaker A (男聲) • 👩 Speaker B (女聲)</div>
                        <div class="podcast-controls">
                            <div class="control-row" style="margin-bottom:8px;">
                                <span>🗣️ 示範腔調:</span>
                                <select class="accent-select" onchange="selectedAccent=this.value; initVoicesByAccent(this.value);">
                                    <option value="en-US">🇺🇸 美式英語 (US)</option>
                                    <option value="en-GB">🇬🇧 英式英語 (UK)</option>
                                    <option value="en-AU">🇦🇺 澳式英語 (AU)</option>
                                    <option value="en-IN">🇮🇳 印度英語 (IN)</option>
                                </select>
                            </div>
                            <div class="control-row">
                                <span>⚡ 語速調節 Speed:</span>
                                <input type="range" min="0.5" max="2.0" step="0.1" value="${podcastRate}" class="speed-slider" oninput="podcastRate=parseFloat(this.value); document.getElementById('spVal').innerText=this.value+'x';">
                                <span id="spVal" style="color:#86efac; min-width:40px;">${podcastRate}x</span>
                            </div>
                        </div>
                        <button id="podcastMainBtn" class="podcast-play-btn" onclick="togglePodcastPlayback()">
                            ${isPodcastPlaying ? '⏹️ 停止播放' : '▶️ 開始雙人對話朗讀'}
                        </button>
                    </div>
                `;
            }
        }

        let speechQueue = [], queueIndex = 0;
        function togglePodcastPlayback() {
            if (!('speechSynthesis' in window)) return;
            const btn = document.getElementById('podcastMainBtn');

            if (isPodcastPlaying) {
                window.speechSynthesis.cancel();
                isPodcastPlaying = false;
                if (btn) btn.innerText = "▶️ 開始雙人對話朗讀";
            } else {
                window.speechSynthesis.cancel();
                speechQueue = [];
                queueIndex = 0;

                const target = (suiteScope === 'all') ? rawDatabase : [filteredPool[currentIndex] || rawDatabase[0]];
                target.forEach(l => {
                    const lines = l.main_content.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                    lines.forEach(line => {
                        if (line.startsWith('A:')) speechQueue.push({ speaker: 'A', text: line.substring(2).trim() });
                        else if (line.startsWith('B:')) speechQueue.push({ speaker: 'B', text: line.substring(2).trim() });
                        else speechQueue.push({ speaker: 'narrator', text: line.replace(/[•-]/g, '').trim() });
                    });
                });

                if (!speechQueue.length) return;
                isPodcastPlaying = true;
                if (btn) btn.innerText = "⏹️ 停止播放";
                playNextInQueue();
            }
        }

        function playNextInQueue() {
            if (!isPodcastPlaying || queueIndex >= speechQueue.length) {
                isPodcastPlaying = false;
                const btn = document.getElementById('podcastMainBtn');
                if (btn) btn.innerText = "▶️ 開始雙人對話朗讀";
                return;
            }

            const item = speechQueue[queueIndex];
            const utter = new SpeechSynthesisUtterance(item.text);
            utter.rate = podcastRate;

            if (item.speaker === 'A') {
                if (speakerAVoice) utter.voice = speakerAVoice;
                utter.pitch = 0.82;
            } else if (item.speaker === 'B') {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.22;
            } else {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.0;
            }

            utter.onend = () => { queueIndex++; setTimeout(playNextInQueue, 160); };
            utter.onerror = () => { isPodcastPlaying = false; };
            window.speechSynthesis.speak(utter);
        }

        function renderExam() {
            const container = document.getElementById('examContainer');
            container.innerHTML = "";
            examData.sections.forEach(sec => {
                const secDiv = document.createElement('div');
                secDiv.innerHTML = `<h4 style="color:#4f46e5; margin:14px 0 8px 0;">${sec.type}</h4>`;
                sec.questions.forEach(q => {
                    let optionsHtml = '';
                    if (q.options) {
                        optionsHtml = `<div style="margin:8px 0;">${q.options.map(o => `<div style="font-size:14.5px; margin:4px 0; color:#334155;">${o}</div>`).join('')}</div>`;
                    }
                    secDiv.innerHTML += `
                        <div class="exam-q-card" style="background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:12px; margin-bottom:10px;">
                            <div style="font-weight:700; color:#1e1b4b;">${q.q}</div>
                            ${optionsHtml}
                            <button class="quiz-toggle-btn" style="padding:6px 12px; font-size:12.5px; margin-top:8px;" onclick="this.nextElementSibling.style.display = (this.nextElementSibling.style.display==='block'?'none':'block')">
                                👁️ 顯示解答與詳解
                            </button>
                            <div style="display:none; margin-top:8px; padding:10px; background:#f0fdf4; border-radius:10px; color:#166534; font-weight:600;">
                                答案：${q.ans}<br>解析：${q.explanation}
                            </div>
                        </div>
                    `;
                });
                container.appendChild(secDiv);
            });
        }

        function renderMainContent(rawContent) {
            const container = document.getElementById('mainContentContainer');
            container.innerHTML = "";
            if (!rawContent) return;

            const lines = String(rawContent).split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const hasDialogue = lines.some(l => l.startsWith('A:') || l.startsWith('B:'));

            if (hasDialogue) {
                const dialogueBox = document.createElement('div');
                dialogueBox.className = 'dialogue-container';
                lines.forEach(line => {
                    if (line.startsWith('A:')) {
                        dialogueBox.innerHTML += `
                            <div class="chat-bubble-row speaker-a">
                                <div class="speaker-avatar avatar-a">A</div>
                                <div class="chat-bubble-content">${line.substring(2).trim()}</div>
                            </div>`;
                    } else if (line.startsWith('B:')) {
                        dialogueBox.innerHTML += `
                            <div class="chat-bubble-row speaker-b">
                                <div class="speaker-avatar avatar-b">B</div>
                                <div class="chat-bubble-content">${line.substring(2).trim()}</div>
                            </div>`;
                    } else {
                        dialogueBox.innerHTML += `<div style="font-size:14px; font-weight:700; color:#64748b; margin:4px 0;">${line}</div>`;
                    }
                });
                container.appendChild(dialogueBox);
            } else {
                const plain = document.createElement('div');
                plain.style.background = 'var(--sky-bg)';
                plain.style.padding = '14px';
                plain.style.borderRadius = '14px';
                plain.style.whiteSpace = 'pre-line';
                plain.innerText = rawContent;
                container.appendChild(plain);
            }
        }

        function formatVocabItem(rawText) {
            let text = String(rawText);
            text = text.replace(/\[([^\]]+)\]/g, '<span class="ipa-tag">[$1]</span>');
            text = text.replace(/\*([^*]+)\*/g, '<span class="highlight-term">$1</span>');
            return text.replace(/\n/g, '<br>');
        }

        function formatQuestionText(text) {
            let s = String(text);
            s = s.replace(/_{3,}/g, '<span class="blank-line">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
            return s;
        }

        function toggleAnswer(btn) {
            const wrapper = btn.nextElementSibling;
            if (wrapper.style.display === 'block') {
                wrapper.style.display = 'none';
                btn.innerText = '👁️ 顯示參考答案與示範';
            } else {
                wrapper.style.display = 'block';
                btn.innerText = '🙈 隱藏解答';
            }
        }

        function initWeekOptions() {
            const selector = document.getElementById('weekFilter');
            selector.innerHTML = "";
            const weekMap = {};
            rawDatabase.forEach(item => {
                if (item.week && !weekMap[item.week]) {
                    weekMap[item.week] = item.class_date || "2026";
                }
            });

            Object.keys(weekMap).sort((a, b) => {
                const numA = parseInt(a.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.replace(/\D/g, '')) || 0;
                return numA - numB;
            }).forEach(w => {
                const opt = document.createElement('option');
                opt.value = w;
                opt.innerText = `${w.toUpperCase()} (${weekMap[w]})`;
                selector.appendChild(opt);
            });
        }

        // ==================== 徹底修復：分頁切換與 UI 雙向綁定 ====================
        function setTab(tabName) {
            currentTab = tabName; // 'sentence' 或 'media'
            updateTabButtonsUI();
            applyFilters();
        }

        function updateTabButtonsUI() {
            const btnSentence = document.getElementById('tabSentence');
            const btnMedia = document.getElementById('tabMedia');
            if (currentTab === 'sentence') {
                btnSentence.classList.add('active');
                btnMedia.classList.remove('active');
            } else {
                btnMedia.classList.add('active');
                btnSentence.classList.remove('active');
            }
        }

        function applyFilters() {
            const selectedWeek = document.getElementById('weekFilter').value;
            filteredPool = rawDatabase.filter(item => {
                const wMatch = String(item.week).trim().toLowerCase() === String(selectedWeek).trim().toLowerCase();
                const tMatch = String(item.type).trim().toLowerCase() === String(currentTab).trim().toLowerCase();
                return wMatch && tMatch;
            });
            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            const cardEl = document.getElementById('cardElement');
            cardEl.scrollTop = 0;

            if (!filteredPool.length) {
                document.getElementById('categoryBadge').innerText = (currentTab === 'media') ? "影音 / 自習" : "句型 / 文法";
                document.getElementById('categoryBadge').className = (currentTab === 'media') ? "badge media-badge" : "badge";
                document.getElementById('dateDisplay').innerText = "";
                document.getElementById('titleDisplay').innerText = "本分類尚無資料";
                document.getElementById('takeawaysSection').style.display = "none";
                document.getElementById('mainContentSection').style.display = "none";
                document.getElementById('quizSection').style.display = "none";
                document.getElementById('vocabSection').style.display = "none";
                document.getElementById('taskSection').style.display = "none";
                document.getElementById('linkSection').style.display = "none";
                document.getElementById('counterDisplay').innerText = "0 / 0";
                return;
            }

            const item = filteredPool[currentIndex];
            const badge = document.getElementById('categoryBadge');
            badge.innerText = item.category || "教材";
            badge.className = (item.type === 'media') ? "badge media-badge" : "badge";

            document.getElementById('dateDisplay').innerText = item.class_date ? ` • ${item.class_date}` : '';
            document.getElementById('counterDisplay').innerText = `${currentIndex + 1} / ${filteredPool.length}`;
            document.getElementById('titleDisplay').innerText = item.title || "";

            const tkSection = document.getElementById('takeawaysSection');
            if (item.key_takeaways) {
                tkSection.style.display = "block";
                document.getElementById('takeawaysDisplay').innerText = item.key_takeaways;
            } else {
                tkSection.style.display = "none";
            }

            document.getElementById('mainContentSection').style.display = "block";
            renderMainContent(item.main_content);

            const quizSection = document.getElementById('quizSection');
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.innerHTML = "";
            if (item.practice_quiz && item.practice_quiz.length > 0) {
                quizSection.style.display = "block";
                item.practice_quiz.forEach(q => {
                    const qCard = document.createElement('div');
                    qCard.className = 'quiz-card';
                    qCard.innerHTML = `
                        <div class="quiz-q">${formatQuestionText(q.question)}</div>
                        <button class="quiz-toggle-btn" onclick="toggleAnswer(this)">👁️ 顯示參考答案與示範</button>
                        <div class="quiz-ans-wrapper">
                            <div class="quiz-ans-box">${q.answer}</div>
                        </div>
                    `;
                    quizContainer.appendChild(qCard);
                });
            } else {
                quizSection.style.display = "none";
            }

            const vbSection = document.getElementById('vocabSection');
            const vocabUl = document.getElementById('vocabDisplay');
            vocabUl.innerHTML = "";
            if (item.vocab_notes && item.vocab_notes.length > 0) {
                vbSection.style.display = "block";
                item.vocab_notes.forEach(note => {
                    const li = document.createElement('li');
                    li.innerHTML = formatVocabItem(note);
                    vocabUl.appendChild(li);
                });
            } else {
                vbSection.style.display = "none";
            }

            const taskSection = document.getElementById('taskSection');
            const taskContainer = document.getElementById('taskContainer');
            if (item.next_week_tasks && item.next_week_tasks.length > 0) {
                taskSection.style.display = "block";
                taskContainer.innerText = item.next_week_tasks.join('\n\n');
            } else {
                taskSection.style.display = "none";
            }

            const linkSection = document.getElementById('linkSection');
            const linkTag = document.getElementById('linkDisplay');
            if (item.link) {
                linkSection.style.display = "block";
                linkTag.href = item.link;
                linkTag.innerText = "🔗 " + (item.link_text || "開啟延伸學習資源");
            } else {
                linkSection.style.display = "none";
            }
        }

        function navigateCard(dir) {
            if (!filteredPool.length) return;
            currentIndex = (currentIndex + dir + filteredPool.length) % filteredPool.length;
            renderCard();
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            document.getElementById('penBtn').classList.toggle('active-pen', isPenMode);
            document.getElementById('cardElement').classList.toggle('canvas-active', isPenMode);
        }

        function clearAllCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function undoLastStroke() { clearAllCanvas(); }

        window.onload = () => {
            initWeekOptions();
            updateTabButtonsUI();
            applyFilters();
        };
    </script>
