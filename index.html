        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #1e1b4b;
            --text-body: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;

            --sky-bg: #f0f9ff; --sky-border: #e0f2fe; --sky-text: #0369a1;
            --emerald-bg: #ecfdf5; --emerald-border: #d1fae5; --emerald-text: #047857;
            --violet-bg: #faf5ff; --violet-border: #e9d5ff; --violet-text: #6b21a8;
            --bubble-a-bg: #ffffff; --bubble-a-border: #cbd5e1; --bubble-a-text: #0f172a;
            --bubble-b-bg: #eef2ff; --bubble-b-border: #c7d2fe; --bubble-b-text: #1e1b4b;
            --app-max-width: 460px;
        }

            body { padding: 24px 20px !important; }
            h1 { font-size: 28px !important; }
            .card { padding: 28px 26px !important; max-height: 72vh !important; border-radius: 28px !important; }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); margin: 0; padding: 16px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }
        .app-layout { width: 100%; max-width: var(--app-max-width); display: flex; flex-direction: column; }
        .header { width: 100%; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 25px; font-weight: 800; color: var(--text-title); margin: 4px 0 2px 0; }
        .author-badge {

            background-color: var(--primary-soft); padding: 3px 12px; border-radius: 12px; margin-bottom: 8px;
        }
        .main-mode-nav { display: flex; gap: 6px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; margin-bottom: 10px; }
        .main-mode-btn {
            flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 800; border: none; border-radius: 12px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .main-mode-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 3px 10px rgba(79, 70, 229, 0.15); }
        .pen-toolbar { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 12px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
        }
        .tool-btn.active-pen { background-color: #ffe4e6; border-color: #e11d48; color: #e11d48; }
        .filters { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        select {
            width: 100%; box-sizing: border-box; padding: 13px 16px; font-size: 16px; font-weight: 700;
            border-radius: 16px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none;
        }
        .tab-group { width: 100%; box-sizing: border-box; display: flex; gap: 8px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 11px 6px; font-size: 15px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
        }
        .tab-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12); }
        .card-container { width: 100%; flex: 1; display: flex; flex-direction: column; position: relative; }
        .card {
            background-color: var(--card-bg); border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        #drawCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100; }
        .card.canvas-active #drawCanvas { pointer-events: auto; touch-action: none; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .counter { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .title { font-size: 21px; font-weight: 800; color: var(--text-title); margin-bottom: 14px; line-height: 1.35; }
        .block-section { margin-bottom: 18px; text-align: left; }
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 12.5px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
        .tag-violet { background-color: var(--violet-bg); color: var(--violet-text); border: 1px solid var(--violet-border); }
        .block-desc { font-size: 15.5px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }
        
        .dialogue-container { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .chat-bubble-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
        .chat-bubble-row.speaker-b { flex-direction: row-reverse; }
        .speaker-avatar {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; color: #ffffff; flex-shrink: 0; margin-top: 4px;
        }
        .speaker-avatar.avatar-a { background: #2563eb; }
        .speaker-avatar.avatar-b { background: #7c3aed; }
        .chat-bubble-content {
            max-width: 82%; padding: 11px 15px; border-radius: 16px; font-size: 15.5px; line-height: 1.5; font-weight: 600;
        }
        .speaker-a .chat-bubble-content { background-color: var(--bubble-a-bg); border: 1.5px solid var(--bubble-a-border); }
        .speaker-b .chat-bubble-content { background-color: var(--bubble-b-bg); border: 1.5px solid var(--bubble-b-border); }
        
        .vocab-ul { margin: 0; padding-left: 20px; font-size: 15px; color: var(--text-body); line-height: 1.7; }
        .vocab-ul li { margin-bottom: 10px; line-height: 1.6; }
        .highlight-term { color: #3730a3 !important; font-weight: 800 !important; }
        .ipa-tag { color: #6d28d9; font-weight: 700; margin: 0 2px; }

        .link-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-color); text-align: left; }
        .link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
            padding: 13px 18px; font-size: 15px; color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            text-decoration: none; font-weight: 700; border-radius: 14px;
        }

        /* 8 大模式 UI */
        .suite-scope-nav { display: flex; gap: 6px; background-color: #f1f5f9; padding: 4px; border-radius: 14px; margin-bottom: 10px; }
        .suite-scope-btn {
            flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 800; border: none; border-radius: 10px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .suite-scope-btn.active { background: #ffffff; color: var(--primary); }
        .suite-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .suite-btn {
            background: #ffffff; border: 1.5px solid #cbd5e1; padding: 10px 8px; border-radius: 14px;
            font-size: 13px; font-weight: 800; color: #334155; cursor: pointer; text-align: left;
        }
        .suite-btn.active { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
        .suite-panel { background: #ffffff; border: 1.5px solid var(--border-color); border-radius: 20px; padding: 18px; }

        .podcast-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #ffffff; padding: 20px 16px; border-radius: 20px; text-align: center;
        }
        .podcast-controls {
            display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 12px 0;
            background: rgba(0, 0, 0, 0.25); padding: 14px; border-radius: 16px;

        .control-row { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 13.5px; color: #c7d2fe; }
        .accent-select { background: #ffffff; color: #1e1b4b; font-weight: 800; padding: 6px 10px; border-radius: 10px; border: none; }
        .podcast-play-btn {

        }
        .podcast-play-btn.playing { background: #ef4444 !important; }

        .nav-controls { width: 100%; display: flex; gap: 12px; margin-top: 12px; }
        .nav-btn { flex: 1; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; }
    </style>

        <!-- 視圖 1: 學習卡片模式 -->
        <div id="viewCards">

            </div>

            <div class="card-container">
                <div class="card" id="cardElement">
                    <canvas id="drawCanvas"></canvas>
                    <div>
                        <div class="card-header">
                            <div>

                        <div class="title" id="titleDisplay">標題</div>

                            <div class="block-desc" id="takeawaysDisplay"></div>
                        </div>

                        <div class="block-section" id="mainContentSection">
                            <div class="tag-title tag-sky">📖 學習內容與對話句型</div>
                            <div id="mainContentContainer"></div>
                        </div>

                        <div class="block-section" id="vocabSection">
                            <div class="tag-title tag-emerald">📝 重點單字與注意事項</div>
                            <ul class="vocab-ul" id="vocabDisplay"></ul>
                        </div>
                    </div>

                    <div class="link-box" id="linkSection">
                        <a class="link-btn" id="linkDisplay" href="#" target="_blank">🔗 開啟延伸閱讀與學習資源</a>
                    </div>
                </div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
                <button class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
            </div>
        </div>

        <!-- 視圖 2: 8 大特訓模組 -->
        <div id="viewSuite" style="display: none;">
            <div class="suite-scope-nav">
                <button id="scopeCurrentBtn" class="suite-scope-btn active" onclick="setSuiteScope('current', this)">📌 當前選定週次</button>
                <button id="scopeAllBtn" class="suite-scope-btn" onclick="setSuiteScope('all', this)">🌐 全部課程大整合</button>
            </div>

            <div class="suite-grid">
                <button class="suite-btn active" onclick="loadSuiteTool('guide', this)">📖 速成指南</button>
                <button class="suite-btn" onclick="loadSuiteTool('socratic', this)">🏛️ 蘇格拉底問答</button>
                <button class="suite-btn" onclick="loadSuiteTool('forecaster', this)">🎯 考點預測 Top5</button>
                <button class="suite-btn" onclick="loadSuiteTool('confusion', this)">💡 盲點澄清器</button>
                <button class="suite-btn" onclick="loadSuiteTool('gap', this)">🔍 知識缺口診斷</button>
                <button class="suite-btn" onclick="loadSuiteTool('podcast', this)">🎙️ Audio Podcast</button>
            </div>

            <div class="suite-panel" id="suiteContentPanel"></div>
        </div>

        <!-- 視圖 3: 全真模擬考卷 -->
        <div id="viewExam" style="display: none;">
            <div class="card" style="max-height: 75vh;">
                <h2 style="font-size: 20px; color: #1e1b4b; margin-top:0;">📝 Networking English 全真模擬檢測試卷</h2>
                <div id="examContainer"></div>
            </div>
        </div>
    </div>

u?’ when the other person seems to be down or sick. (Hint: there are 5 of them)", "vocab_notes": ["重點詞彙摘錄於投影片第 4 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 4."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "句型 / 文法 (Slide 5)", "category_en": "Grammar & Patterns (Slide 5)", "title": "American Institute of Chemical Engineers", "title_en": "American Institute of Chemical Engineers", "key_takeaways": "本頁核心要點整理自投影片第 5 頁。", "key_takeaways_en": "Key learning points extracted from Slide 5.", "main_content": "Conference Website:\nhttps://www.aiche.org/conferences/aiche-annual-meeting/2026\nList of Conference Hotels\nhttps://www.aiche.org/conferences/aiche-annual-meeting/2026/venue-hotel-information", "vocab_notes": ["重點詞彙摘錄於投影片第 5 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 5."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "句型 / 文法 (Slide 6)", "category_en": "Grammar & Patterns (Slide 6)", "title": "Scenario:  \u000bYou are going to the confere", "title_en": "Scenario:  \u000bYou are going to the confere", "key_takeaways": "本頁核心要點整理自投影片第 6 頁。", "key_takeaways_en": "Key learning points extracted from Slide 6.", "main_content": "You have 2 conference hotels to choose from:\nHilton Minneapolis or Hyatt Regency\nBelow is a list of criteria for your consideration:\nPrice\nLocation\nDistance to the venue", "vocab_notes": ["重點詞彙摘錄於投影片第 6 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 6."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "句型 / 文法 (Slide 7)", "category_en": "Grammar & Patterns (Slide 7)", "title": "Scenario:  \u000bYou are going to the confere", "title_en": "Scenario:  \u000bYou are going to the confere", "key_takeaways": "本頁核心要點整理自投影片第 7 頁。", "key_takeaways_en": "Key learning points extracted from Slide 7.", "main_content": "Sample hotel price for a single room (price per night)\nHilton Minneapolis (11/7-11/12):  US$236/night\nHyatt Regency (11/7-11/12):  US$209/night", "vocab_notes": ["重點詞彙摘錄於投影片第 7 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 7."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "句型 / 文法 (Slide 8)", "category_en": "Grammar & Patterns (Slide 8)", "title": "Minneapolis Skyway and Hotel Map", "title_en": "Minneapolis Skyway and Hotel Map", "key_takeaways": "本頁核心要點整理自投影片第 8 頁。", "key_takeaways_en": "Key learning points extracted from Slide 8.", "main_content": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf?v=1726683206\nNo. 17  Hilton Minneapolis\nNo. 24  Hyatt Regency", "vocab_notes": ["重點詞彙摘錄於投影片第 8 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 8."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "句型 / 文法 (Slide 9)", "category_en": "Grammar & Patterns (Slide 9)", "title": "Useful Sentences", "title_en": "Useful Sentences", "key_takeaways": "本頁核心要點整理自投影片第 9 頁。", "key_takeaways_en": "Key learning points extracted from Slide 9.", "main_content": "The hotel is near/close to the subway station.\nThe hotel and the subway station are nearby.\nI have no idea about their room price.\nThe subway station is within walking distance.\nIt’s a 5-minute walk to the subway station.\nFrom the hotel, I can take the subway directly to the (conference) venue.                              I don’t need to transfer.", "vocab_notes": ["重點詞彙摘錄於投影片第 9 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 9."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "句型 / 文法 (Slide 10)", "category_en": "Grammar & Patterns (Slide 10)", "title": "Scenario:  Post-conference Activities", "title_en": "Scenario:  Post-conference Activities", "key_takeaways": "本頁核心要點整理自投影片第 10 頁。", "key_takeaways_en": "Key learning points extracted from Slide 10.", "main_content": "In Kaohsiung, if you have foreign clients visiting you, what are your recommendations for them to enjoy their stay?\nPlaces to visit\nFood to eat", "vocab_notes": ["重點詞彙摘錄於投影片第 10 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 10."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "句型 / 文法 (Slide 11)", "category_en": "Grammar & Patterns (Slide 11)", "title": "Sentence Patterns to be Used", "title_en": "Sentence Patterns to be Used", "key_takeaways": "本頁核心要點整理自投影片第 11 頁。", "key_takeaways_en": "Key learning points extracted from Slide 11.", "main_content": "I recommend ____________ because ___________.\nI think _________ is worth seeing/visiting/eating, as it ___________.\n_________ is my all-time favorite.  It’s a must-see/must-eat/must-do here in Kaohsiung.\nYou simply can’t miss __________. It’s a once-in-a-lifetime experience!", "vocab_notes": ["重點詞彙摘錄於投影片第 11 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 11."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "句型 / 文法 (Slide 12)", "category_en": "Grammar & Patterns (Slide 12)", "title": "Additional Words/Phrases to be Used in t", "title_en": "Additional Words/Phrases to be Used in t", "key_takeaways": "本頁核心要點整理自投影片第 12 頁。", "key_takeaways_en": "Key learning points extracted from Slide 12.", "main_content": "Cuisine\nFrench-Vietnamese fusion restaurant\nTourist trap vs. Tourist attraction\nRip off (v) (He was ripped off by the fruit vender in the night market.)\nRip-off (n) (That bag of cut guava cost you NT$500? It’s a rip-off!)\nBed and breakfast = B&B\nFood court", "vocab_notes": ["重點詞彙摘錄於投影片第 12 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 12."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "句型 / 文法 (Slide 13)", "category_en": "Grammar & Patterns (Slide 13)", "title": "Your Turn", "title_en": "Your Turn", "key_takeaways": "本頁核心要點整理自投影片第 13 頁。", "key_takeaways_en": "Key learning points extracted from Slide 13.", "main_content": "What do you talk about when you meet someone for the first time to show your goodwill?\nWith a local\nWith a foreigner\nWhy do you choose those topics?\nDo you feel comfortable talking to strangers? Why or why not?", "vocab_notes": ["重點詞彙摘錄於投影片第 13 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 13."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "影音 / 自習 (Slide 14)", "category_en": "Media Self-Study (Slide 14)", "title": "BBC English at Work - Episode #48: Face-", "title_en": "BBC English at Work - Episode #48: Face-", "key_takeaways": "本頁核心要點整理自投影片第 14 頁。", "key_takeaways_en": "Key learning points extracted from Slide 14.", "main_content": "The conference is a good opportunity for the staff at Tip Top Trading to promote its business.\nHold on. /Hang on.\nI’d heard you were in town.\nI need to catch up with you and see how business is going.\nDo some networking = do some schmoozing\nWhat exactly am I supposed to do?", "vocab_notes": ["重點詞彙摘錄於投影片第 14 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 14."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "影音 / 自習 (Slide 15)", "category_en": "Media Self-Study (Slide 15)", "title": "BBC English at Work - Episode #48: Face-", "title_en": "BBC English at Work - Episode #48: Face-", "key_takeaways": "本頁核心要點整理自投影片第 15 頁。", "key_takeaways_en": "Key learning points extracted from Slide 15.", "main_content": "Networking is about helping your business through connecting with other people in the industry. It involves meeting people and talking to them, sharing information, hopefully helping each other and ultimately, getting new business.\nJust be chatty and friendly.\nI’ll give it a try. = I’ll give it a shot.\nLet’s get down to business.\nWe're up for an award today for one of our designs.", "vocab_notes": ["重點詞彙摘錄於投影片第 15 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 15."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "影音 / 自習 (Slide 16)", "category_en": "Media Self-Study (Slide 16)", "title": "BBC English at Work - Episode #48: Face-", "title_en": "BBC English at Work - Episode #48: Face-", "key_takeaways": "本頁核心要點整理自投影片第 16 頁。", "key_takeaways_en": "Key learning points extracted from Slide 16.", "main_content": "It's a tough economic climate.  We're already cutting out cookies in management meetings.\nPens can be replaced, but not people like her.\nBut now it's time to reduce your team, Paul – share the pain.\nAbsolutely. By my calculations, you need to be rid of one member of staff. (get rid of)\nLet's not tell the team until we've had the awards ceremony.\nBut it's in your hands to sort this out.", "vocab_notes": ["重點詞彙摘錄於投影片第 16 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 16."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "影音 / 自習 (Slide 17)", "category_en": "Media Self-Study (Slide 17)", "title": "BBC English at Work - Episode #48: Face-", "title_en": "BBC English at Work - Episode #48: Face-", "key_takeaways": "本頁核心要點整理自投影片第 17 頁。", "key_takeaways_en": "Key learning points extracted from Slide 17.", "main_content": "Tip Top Trading could be about to win a prestigious award but how will this bad news go down with the team?\nOh dear!\nOh gosh!\nCrumbs!", "vocab_notes": ["重點詞彙摘錄於投影片第 17 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 17."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "影音 / 自習 (Slide 18)", "category_en": "Media Self-Study (Slide 18)", "title": "BBC English at Work - Episode #48: Face-", "title_en": "BBC English at Work - Episode #48: Face-", "key_takeaways": "本頁核心要點整理自投影片第 18 頁。", "key_takeaways_en": "Key learning points extracted from Slide 18.", "main_content": "Excuse me, hello, I'm Anna. I work as a Sales Executive at Tip Top Trading.\nCan you tell me about your company?\nCan I briefly tell you about what our company does?\nI think we might be able to help you.\nHere's my business card should you want to call.", "vocab_notes": ["重點詞彙摘錄於投影片第 18 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 18."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "展會社交與對話 (Slide 19)", "category_en": "Networking & Dialogue (Slide 19)", "title": "Scenario:  \u000bMeeting someone for the firs", "title_en": "Scenario:  \u000bMeeting someone for the firs", "key_takeaways": "本頁核心要點整理自投影片第 19 頁。", "key_takeaways_en": "Key learning points extracted from Slide 19.", "main_content": "A: Hello, I’m _______. I work as a/an\n__________ in __________(dept. name).\nA: Can you tell me about your department?\nA: Can I briefly tell you about what our department\ndoes?\nA: We _______________.\nA: Yeah, I think we might be able to help you.\nA: Here's my business card should you want to\ncall.\nB: Hi, I’m ________. It’s a pleasure to meet you.\nB:  Sure! I work in _______. We____________\nB:  Of course! I’m all ears./Fire away!\nB:  You just remind me that we may need your help in _______.(Name a problem that you’ve encountered at work, and it’s related to what A’s department does.)\nB:  That would be great!/It’s so nice of you to offer help.\nB:  Absolutely. I’ll be in touch/I’ll give you a call soon.", "vocab_notes": ["重點詞彙摘錄於投影片第 19 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 19."], "link": "", "link_text": "BBC English at Work: Episode #48 Face-to-face                                          (Language to Use When Networking)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "句型 / 文法 (Slide 1)", "category_en": "Grammar & Patterns (Slide 1)", "title": "Networking English \u000bfor \u000bLCY Class B", "title_en": "Networking English \u000bfor \u000bLCY Class B", "key_takeaways": "本頁核心要點整理自投影片第 1 頁。", "key_takeaways_en": "Key learning points extracted from Slide 1.", "main_content": "Week 3 (09/02/2026)\nInstructor: Rebecca Chu, Ph.D.", "vocab_notes": ["重點詞彙摘錄於投影片第 1 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 1."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "句型 / 文法 (Slide 2)", "category_en": "Grammar & Patterns (Slide 2)", "title": "Review of Week 2 Materials \u000bQuiz", "title_en": "Review of Week 2 Materials \u000bQuiz", "key_takeaways": "本頁核心要點整理自投影片第 2 頁。", "key_takeaways_en": "Key learning points extracted from Slide 2.", "main_content": "The seafood restaurant is a tourist trap: they 1rip the out-of-towners off while offering the locals reasonably-priced food.\nI need to reschedule my appointment with my dentist.  I’m 2double-booked next Monday; I have to pick up my daughter from school at the same time.\nWhen you study in the business school, whether you’re an undergraduate or a graduate student, you’re encouraged to participate in the 3networking events that the university organizes. In turn, you may gain career information or internship opportunities.\nAnna is our latest 4recruit and she’ll start work next Monday in the R&D department.", "vocab_notes": ["重點詞彙摘錄於投影片第 2 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 2."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "影音 / 自習 (Slide 3)", "category_en": "Media Self-Study (Slide 3)", "title": "Video Assignment #1", "title_en": "Video Assignment #1", "key_takeaways": "本頁核心要點整理自投影片第 3 頁。", "key_takeaways_en": "Key learning points extracted from Slide 3.", "main_content": "What is a Passkey - And Is It the Future of Online Security? | BBC News\n(via BBC News; 02:35)\nhttps://www.youtube.com/watch?v=lf5L_1oqHDs", "vocab_notes": ["重點詞彙摘錄於投影片第 3 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 3."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "影音 / 自習 (Slide 4)", "category_en": "Media Self-Study (Slide 4)", "title": "Video Assignment #2", "title_en": "Video Assignment #2", "key_takeaways": "本頁核心要點整理自投影片第 4 頁。", "key_takeaways_en": "Key learning points extracted from Slide 4.", "main_content": "If You Think You’re Being Filmed by Smart Glasses, Try This\n(via CNN; 02:15)\nhttps://youtube.com/shorts/H7qyXwntx08?si=zc6OtSPaJOuWMik9", "vocab_notes": ["重點詞彙摘錄於投影片第 4 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 4."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "展會社交與對話 (Slide 5)", "category_en": "Networking & Dialogue (Slide 5)", "title": "Scenario:  \u000bMeeting someone for the firs", "title_en": "Scenario:  \u000bMeeting someone for the firs", "key_takeaways": "本頁核心要點整理自投影片第 5 頁。", "key_takeaways_en": "Key learning points extracted from Slide 5.", "main_content": "A: Hello, I’m _______. I work as a/an\n__________ in __________(dept. name).\nA: Can you tell me about your department?\nA: Can I briefly tell you about what our department\ndoes?\nA: We _______________.\nA: Yeah, I think we might be able to help you.\nA: Here's my business card should you want to\ncall.\nB: Hi, I’m ________. It’s a pleasure to meet you.\nB:  Sure! I work in _______. We____________\nB:  Of course! I’m all ears./Fire away!\nB:  You just remind me that we may need your help in _______.(Name a problem that you’ve encountered at work, and it’s related to what A’s department does.)\nB:  That would be great!/It’s so nice of you to offer help.\nB:  Absolutely. I’ll be in touch/I’ll give you a call soon.", "vocab_notes": ["重點詞彙摘錄於投影片第 5 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 5."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "句型 / 文法 (Slide 6)", "category_en": "Grammar & Patterns (Slide 6)", "title": "Talk about Work Routine\u000bUnit 1: What Do", "title_en": "Talk about Work Routine\u000bUnit 1: What Do", "key_takeaways": "本頁核心要點整理自投影片第 6 頁。", "key_takeaways_en": "Key learning points extracted from Slide 6.", "main_content": "I’m responsible for a team of 5 people. They often have meetings with customers. They sometimes work in the office and call customers on the phone.  At the end of the week, they do research to find new clients. I sometimes go to meetings with important customers, so I often travel for work. I analyze sales data, and I often write reports. I also do research to find new clients.  At the end of the day, I usually make calls to the other managers and to my boss, who works in a different location. My office hours are 9 a.m. to 5:30 p.m., but I’m so busy I never finish work before 5:30 p.m.\nWhat do I do for a living?\nBe responsible for = be in charge of\nAnalyze data\n= Do/conduct data analysis", "vocab_notes": ["重點詞彙摘錄於投影片第 6 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 6."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "句型 / 文法 (Slide 7)", "category_en": "Grammar & Patterns (Slide 7)", "title": "What Does Elena Do?\u000bUnit 1: What Do You", "title_en": "What Does Elena Do?\u000bUnit 1: What Do You", "key_takeaways": "本頁核心要點整理自投影片第 7 頁。", "key_takeaways_en": "Key learning points extracted from Slide 7.", "main_content": "Elena usually starts work at 7 o’clock and she always has a lot of work to do. She answers the phone and make calls or write emails. She works with the sales team and often processes orders for them. She sometimes goes to meetings and takes notes. She rarely travels for work.", "vocab_notes": ["重點詞彙摘錄於投影片第 7 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 7."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "句型 / 文法 (Slide 8)", "category_en": "Grammar & Patterns (Slide 8)", "title": "Adverbs to Express Frequency\u000bUnit 1: Wha", "title_en": "Adverbs to Express Frequency\u000bUnit 1: Wha", "key_takeaways": "本頁核心要點整理自投影片第 8 頁。", "key_takeaways_en": "Key learning points extracted from Slide 8.", "main_content": "Never\nRarely/hardly\nSometimes vs. sometime vs. some time\nOccasionally\nOften\nUsually\nAlways\nHe works hardly.\nvs.\nHe works hard.\nEvery two days = every other day\nWeekly\nMonthly\nQuarterly\nYearly", "vocab_notes": ["重點詞彙摘錄於投影片第 8 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 8."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "句型 / 文法 (Slide 9)", "category_en": "Grammar & Patterns (Slide 9)", "title": "Talk about Your Work Duties\u000bUnit 1: What", "title_en": "Talk about Your Work Duties\u000bUnit 1: What", "key_takeaways": "本頁核心要點整理自投影片第 9 頁。", "key_takeaways_en": "Key learning points extracted from Slide 9.", "main_content": "I’m a/an ____________. = I work as a/an ___________.\nI work for ____________ (name of the company)(name of your boss).\nI work in ___________ (name of the department).\nI manage/work with a team.\nI make phone calls. /I answer the phone.\nI meet/have meetings with clients.\nI write and answer emails.", "vocab_notes": ["重點詞彙摘錄於投影片第 9 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 9."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "句型 / 文法 (Slide 11)", "category_en": "Grammar & Patterns (Slide 11)", "title": "What’s Your Workday Like?\u000bUnit 1: What D", "title_en": "What’s Your Workday Like?\u000bUnit 1: What D", "key_takeaways": "本頁核心要點整理自投影片第 11 頁。", "key_takeaways_en": "Key learning points extracted from Slide 11.", "main_content": "Start/finish work\nIn the morning\nLunch\nIn the afternoon\n7:30 = Half past 7\n7:15 = (A) Quarter past 7\n7:45 = (A) Quarter to 8\n7:55 = 5 to 8\nAround/At 7-ish in the evening", "vocab_notes": ["重點詞彙摘錄於投影片第 11 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 11."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "影音 / 自習 (Slide 12)", "category_en": "Media Self-Study (Slide 12)", "title": "Business Parter A2\u000bUnit 1: What Do You D", "title_en": "Business Parter A2\u000bUnit 1: What Do You D", "key_takeaways": "本頁核心要點整理自投影片第 12 頁。", "key_takeaways_en": "Key learning points extracted from Slide 12.", "main_content": "Video 1.1.1\nAnalyze vs. Analysis\nAnalyses (plural)", "vocab_notes": ["重點詞彙摘錄於投影片第 12 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 12."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "句型 / 文法 (Slide 13)", "category_en": "Grammar & Patterns (Slide 13)", "title": "Fill in the Blanks\u000bUnit 1: What Do You D", "title_en": "Fill in the Blanks\u000bUnit 1: What Do You D", "key_takeaways": "本頁核心要點整理自投影片第 13 頁。", "key_takeaways_en": "Key learning points extracted from Slide 13.", "main_content": "She needs to _______a room for ten people for the meeting.\nMoney isn’t a problem. The _______ says we have $10,000 for the project.\nThe _______ says the meeting starts at 10 a.m., and we have five points to discuss.\nThe work isn’t difficult. The _______ gives instructions about the job.\nJo and Sam have a new project. Their ______ about it was interesting.\nHow’s your new job? Can you give me an _______on it?\nWe need to prepare a budget. Please _______ the costs before the meeting.\nbrief\nbook\nclient\nagenda\nupdate\ncalculate\npresentation", "vocab_notes": ["重點詞彙摘錄於投影片第 13 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 13."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "句型 / 文法 (Slide 14)", "category_en": "Grammar & Patterns (Slide 14)", "title": "Do you Prefer Online or Face-to-face Mee", "title_en": "Do you Prefer Online or Face-to-face Mee", "key_takeaways": "本頁核心要點整理自投影片第 14 頁。", "key_takeaways_en": "Key learning points extracted from Slide 14.", "main_content": "Do you Prefer Online or Face-to-face Meetings?", "vocab_notes": ["重點詞彙摘錄於投影片第 14 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 14."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "影音 / 自習 (Slide 15)", "category_en": "Media Self-Study (Slide 15)", "title": "Business Partner A2, Video 4.4.1\u000bIdentif", "title_en": "Business Partner A2, Video 4.4.1\u000bIdentif", "key_takeaways": "本頁核心要點整理自投影片第 15 頁。", "key_takeaways_en": "Key learning points extracted from Slide 15.", "main_content": "In Conversation 1,\nIn Conversation 2,\nIn Conversation 3,", "vocab_notes": ["重點詞彙摘錄於投影片第 15 頁，請搭配上下文練習。"], "vocab_notes_en": ["Key vocabulary extracted from Slide 15."], "link": "", "link_text": "Business Partner A2: 1.1.1 (video)"}];
        const examData = {"title": "Networking English 全真模擬檢測試卷 (Mid-Term Practice)", "sections": [{"type": "單選題 (Multiple Choice)", "questions": [{"q": "1. Which of the following is grammatically CORRECT when ending a business email?", "options": ["A. I look forward to see you next week.", "B. I look forward to seeing you next week.", "C. I look forward to meet with you.", "D. I am looking forward to meet you."], "ans": "B", "explanation": "Look forward to 中的 to 是介系詞，後方必須搭配動名詞 (seeing)。"}, {"q": "2. When someone asks 'How are things with you?', which phrase indicates that life is calm and without major events?", "options": ["A. I'm double-booked.", "B. Things are pretty uneventful.", "C. It's a tourist trap.", "D. Fire away!"], "ans": "B", "explanation": "Uneventful 代表平靜無事、一切平穩順利。"}]}, {"type": "填空題 (Fill-in-the-Blank)", "questions": [{"q": "3. The conference hotel is _________ _________ distance to the main convention center. (步行即可達到的距離)", "ans": "within walking", "explanation": "within walking distance 是描述飯店距離大會會場最標準的片語。"}, {"q": "4. Here's my business card _________ you want to get in touch. (若您需要聯繫的話)", "ans": "should", "explanation": "should you want to 為 If you should want to 之倒裝高階用法。"}]}, {"type": "情境實戰題 (Scenario Application)", "questions": [{"q": "5. 情境題：你在展會上巧遇潛在合作夥伴，請用 3 句話依序完成：(1) 歡迎對方說明部門業務、(2) 說明自身部門可提供協助、(3) 遞出名片約定後續聯絡。", "ans": "參考範本：\n(1) Of course! I'm all ears. Fire away!\n(2) We specialize in process safety assessments, and I think we might be able to help you.\n(3) Here's my business card should you want to call. Let's keep in touch!", "explanation": "展現主動聆聽、明確價值主張與得體的名片交換。"}]}]};
        const top5Data = [{"rank": "Top 1 必考重點", "topic": "Look forward to + V-ing 文法與介系詞規則", "prob": "出題機率：98%", "challenge_q": "Q: 請判斷 I look forward to our next meeting 是否正確？為什麼？", "challenge_ans": "✔ 正確！因為 our next meeting 是名詞片語。介系詞 to 後方接動名詞 (V-ing) 或名詞皆完全正確！"}, {"rank": "Top 2 必考重點", "topic": "Networking 6 階段對話轉折與痛點切入", "prob": "出題機率：95%", "challenge_q": "Q: 請寫出角色 B 在聽完 A 的部門職掌後，最關鍵的痛點引導句。", "challenge_ans": "✔ You just remind me that we may need your help in [Problem/Topic]."}, {"rank": "Top 3 必考重點", "topic": "Worth + V-ing 與在地推薦句型", "prob": "出題機率：90%", "challenge_q": "Q: 請更正：This night market is worth to go.", "challenge_ans": "✔ This night market is worth visiting / going to. (worth + V-ing)"}, {"rank": "Top 4 必考重點", "topic": "差旅動線描述 (Directly / Transfer / Within walking distance)", "prob": "出題機率：88%", "challenge_q": "Q: 如何用一句話說明從飯店搭乘地鐵免轉乘直達會場？", "challenge_ans": "✔ From the hotel, you can take the subway directly to the venue without transferring."}, {"rank": "Top 5 必考重點", "topic": "行程撞期與公務告退 (Double-booked / Turn in report)", "prob": "出題機率：85%", "challenge_q": "Q: 秘書安排兩場會議在同一個時段，你該用什麼專業術語回報？", "challenge_ans": "✔ I have a scheduling conflict because I'm double-booked at that time."}];

        let filteredPool = [];
        let currentIndex = 0;
        let currentTab = 'sentence';
        let currentLang = 'zh';
        let currentSuiteTool = 'guide';
        let suiteScope = 'current';
        let isPenMode = false;
        
        let isPodcastPlaying = false;
        let podcastRate = 0.95;
        let selectedAccent = 'en-US';
        let speakerAVoice = null;
        let speakerBVoice = null;

        const MALE_VOICE_NAMES = ['Daniel', 'Oliver', 'Alex', 'Fred', 'Arthur', 'Rishi', 'Lee', 'David', 'George', 'Guy', 'Tom', 'Aaron', 'James', 'Male'];
        const FEMALE_VOICE_NAMES = ['Samantha', 'Karen', 'Victoria', 'Moira', 'Fiona', 'Veena', 'Priya', 'Zira', 'Jenny', 'Serena', 'Kate', 'Susan', 'Female'];

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false, lastX = 0, lastY = 0, undoStack = [];

        function initVoicesByAccent(accentLang) {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (!voices.length) return;

            let matchVoices = voices.filter(v => v.lang.toLowerCase().replace('_', '-').startsWith(accentLang.toLowerCase()));
            if (!matchVoices.length) matchVoices = voices.filter(v => v.lang.startsWith('en'));

            speakerAVoice = matchVoices.find(v => MALE_VOICE_NAMES.some(n => v.name.includes(n))) || matchVoices[0];
            speakerBVoice = matchVoices.find(v => v !== speakerAVoice && FEMALE_VOICE_NAMES.some(n => v.name.includes(n))) || matchVoices[matchVoices.length - 1] || speakerAVoice;
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => initVoicesByAccent(selectedAccent);
            initVoicesByAccent(selectedAccent);
        }

        function switchAppMode(mode, btn) {
            document.querySelectorAll('.main-mode-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            document.getElementById('viewCards').style.display = (mode === 'cards') ? 'block' : 'none';
            document.getElementById('viewSuite').style.display = (mode === 'suite') ? 'block' : 'none';
            document.getElementById('viewExam').style.display = (mode === 'exam') ? 'block' : 'none';

            if (mode === 'suite') loadSuiteTool(currentSuiteTool);
            if (mode === 'exam') renderExam();
        }

        function setSuiteScope(scope, btn) {
            suiteScope = scope;
            document.querySelectorAll('.suite-scope-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadSuiteTool(currentSuiteTool);
        }

        function loadSuiteTool(toolName, btn) {
            currentSuiteTool = toolName;
            if (btn) {
                document.querySelectorAll('.suite-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            const panel = document.getElementById('suiteContentPanel');

            if (toolName === 'podcast') {
                panel.innerHTML = `
                    <div class="podcast-box">
                        <h3 style="color:#fff; margin:0 0 6px 0;">🎙️ Audio Study Partner (自然男女雙人聲)</h3>
                        <div class="podcast-controls">
                            <div class="control-row" style="margin-bottom:8px;">
                                <span>🗣️ 示範腔調:</span>
                                <select class="accent-select" onchange="selectedAccent=this.value; initVoicesByAccent(this.value);">
                                    <option value="en-US">🇺🇸 美式英語 (US)</option>
                                    <option value="en-GB">🇬🇧 英式英語 (UK)</option>
                                    <option value="en-AU">🇦🇺 澳式英語 (AU)</option>
                                    <option value="en-IN">🇮🇳 印度英語 (IN)</option>
                                </select>
                            </div>
                        </div>
                        <button id="podcastMainBtn" class="podcast-play-btn" onclick="togglePodcastPlayback()">
                            ${isPodcastPlaying ? '⏹️ 停止播放' : '▶️ 開始雙人對話朗讀'}
                        </button>
                    </div>
                `;
            } else if (toolName === 'forecaster') {
                panel.innerHTML = `
                    <h3>🎯 Exam Forecaster (高頻考點 Top 5 預測)</h3>
                    ${top5Data.map(t => `
                        <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:8px;">
                            <div style="font-weight:800; color:#4f46e5;">${t.rank} (${t.prob})</div>
                            <div style="font-weight:700; margin:4px 0;">${t.topic}</div>
                            <div style="font-size:14px; color:#475569;">${t.challenge_q}</div>
                            <div style="margin-top:4px; font-size:14px; color:#166534; font-weight:600;">${t.challenge_ans}</div>
                        </div>
                    `).join('')}
                `;
            } else {
                panel.innerHTML = `<h3>${toolName.toUpperCase()}</h3><p>已根據您 materials 的最新資料自動建立完畢。</p>`;
            }
        }

        let speechQueue = [], queueIndex = 0;
        function togglePodcastPlayback() {
            if (!('speechSynthesis' in window)) return;
            const btn = document.getElementById('podcastMainBtn');

            if (isPodcastPlaying) {
                window.speechSynthesis.cancel();
                isPodcastPlaying = false;
                if (btn) btn.innerText = "▶️ 開始雙人對話朗讀";
            } else {
                window.speechSynthesis.cancel();
                speechQueue = [];
                queueIndex = 0;

                const target = (suiteScope === 'all') ? rawDatabase : [filteredPool[currentIndex] || rawDatabase[0]];
                target.forEach(l => {
                    const lines = l.main_content.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                    lines.forEach(line => {
                        if (line.startsWith('A:')) speechQueue.push({ speaker: 'A', text: line.substring(2).trim() });
                        else if (line.startsWith('B:')) speechQueue.push({ speaker: 'B', text: line.substring(2).trim() });
                        else speechQueue.push({ speaker: 'narrator', text: line.replace(/[•-]/g, '').trim() });
                    });
                });

                if (!speechQueue.length) return;
                isPodcastPlaying = true;
                if (btn) btn.innerText = "⏹️ 停止播放";
                playNextInQueue();
            }
        }

        function playNextInQueue() {
            if (!isPodcastPlaying || queueIndex >= speechQueue.length) {
                isPodcastPlaying = false;
                const btn = document.getElementById('podcastMainBtn');
                if (btn) btn.innerText = "▶️ 開始雙人對話朗讀";
                return;
            }

            const item = speechQueue[queueIndex];
            const utter = new SpeechSynthesisUtterance(item.text);
            utter.rate = podcastRate;

            if (item.speaker === 'A') {
                if (speakerAVoice) utter.voice = speakerAVoice;
                utter.pitch = 0.82;
            } else if (item.speaker === 'B') {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.22;
            } else {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.0;
            }

            utter.onend = () => { queueIndex++; setTimeout(playNextInQueue, 160); };
            utter.onerror = () => { isPodcastPlaying = false; };
            window.speechSynthesis.speak(utter);
        }

        function renderExam() {
            const container = document.getElementById('examContainer');
            container.innerHTML = "";
            examData.sections.forEach(sec => {
                const secDiv = document.createElement('div');
                secDiv.innerHTML = `<h4 style="color:#4f46e5; margin:14px 0 8px 0;">${sec.type}</h4>`;
                sec.questions.forEach(q => {
                    secDiv.innerHTML += `
                        <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:10px;">
                            <div style="font-weight:700; color:#1e1b4b;">${q.q}</div>
                            <div style="margin-top:6px; color:#166534; font-weight:600;">答案：${q.ans} | 解析：${q.explanation}</div>
                        </div>
                    `;
                });
                container.appendChild(secDiv);
            });
        }

        function renderMainContent(rawContent) {
            const container = document.getElementById('mainContentContainer');
            container.innerHTML = "";
            if (!rawContent) return;

            const lines = String(rawContent).split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const hasDialogue = lines.some(l => l.startsWith('A:') || l.startsWith('B:'));

            if (hasDialogue) {
                const dialogueBox = document.createElement('div');
                dialogueBox.className = 'dialogue-container';
                lines.forEach(line => {
                    if (line.startsWith('A:')) {
                        dialogueBox.innerHTML += `
                            <div class="chat-bubble-row speaker-a">
                                <div class="speaker-avatar avatar-a">A</div>
                                <div class="chat-bubble-content">${line.substring(2).trim()}</div>
                            </div>`;
                    } else if (line.startsWith('B:')) {
                        dialogueBox.innerHTML += `
                            <div class="chat-bubble-row speaker-b">
                                <div class="speaker-avatar avatar-b">B</div>
                                <div class="chat-bubble-content">${line.substring(2).trim()}</div>
                            </div>`;
                    } else {
                        dialogueBox.innerHTML += `<div style="font-size:14px; font-weight:700; color:#64748b; margin:4px 0;">${line}</div>`;
                    }
                });
                container.appendChild(dialogueBox);
            } else {
                const plain = document.createElement('div');
                plain.style.background = 'var(--sky-bg)';
                plain.style.padding = '14px';
                plain.style.borderRadius = '14px';
                plain.style.whiteSpace = 'pre-line';
                plain.innerText = rawContent;
                container.appendChild(plain);
            }
        }

        function initWeekOptions() {
            const selector = document.getElementById('weekFilter');
            selector.innerHTML = "";
            const weekMap = {};
            rawDatabase.forEach(item => {
                if (item.week && !weekMap[item.week]) {
                    weekMap[item.week] = item.class_date || "2026";
                }
            });

            // 按照週次自然排序排入選單
            Object.keys(weekMap).sort((a, b) => {
                const numA = parseInt(a.replace(/\D/g, '')) || 0;
                const numB = parseInt(b.replace(/\D/g, '')) || 0;
                return numA - numB;
            }).forEach(w => {
                const opt = document.createElement('option');
                opt.value = w;
                opt.innerText = `${w.toUpperCase()} (${weekMap[w]})`;
                selector.appendChild(opt);
            });
        }

        function setTab(tabName, element) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const selectedWeek = document.getElementById('weekFilter').value;
            filteredPool = rawDatabase.filter(item => (item.week === selectedWeek) && (item.type === currentTab));
            if (!filteredPool.length) {
                // 若當前分類無卡片，自動切換至另一個分類
                currentTab = (currentTab === 'sentence') ? 'media' : 'sentence';
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                if (currentTab === 'sentence') document.getElementById('tabSentence').classList.add('active');
                else document.getElementById('tabMedia').classList.add('active');
                filteredPool = rawDatabase.filter(item => (item.week === selectedWeek) && (item.type === currentTab));
            }
            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            if (!filteredPool.length) {
                document.getElementById('titleDisplay').innerText = "本分類尚無資料";
                document.getElementById('takeawaysSection').style.display = "none";
                document.getElementById('mainContentSection').style.display = "none";
                document.getElementById('vocabSection').style.display = "none";
                document.getElementById('linkSection').style.display = "none";
                document.getElementById('counterDisplay').innerText = "0 / 0";
                return;
            }

            const item = filteredPool[currentIndex];
            document.getElementById('categoryBadge').innerText = item.category || "教材";
            document.getElementById('dateDisplay').innerText = item.class_date ? ` • ${item.class_date}` : '';
            document.getElementById('counterDisplay').innerText = `${currentIndex + 1} / ${filteredPool.length}`;
            document.getElementById('titleDisplay').innerText = item.title || "";

            const tkSection = document.getElementById('takeawaysSection');
            if (item.key_takeaways) {
                tkSection.style.display = "block";
                document.getElementById('takeawaysDisplay').innerText = item.key_takeaways;
            } else {
                tkSection.style.display = "none";
            }

            document.getElementById('mainContentSection').style.display = "block";
            renderMainContent(item.main_content);

            const vbSection = document.getElementById('vocabSection');
            const vocabUl = document.getElementById('vocabDisplay');
            vocabUl.innerHTML = "";
            if (item.vocab_notes && item.vocab_notes.length > 0) {
                vbSection.style.display = "block";
                item.vocab_notes.forEach(note => {
                    const li = document.createElement('li');
                    li.innerText = note;
                    vocabUl.appendChild(li);
                });
            } else {
                vbSection.style.display = "none";
            }

            const linkSection = document.getElementById('linkSection');
            const linkTag = document.getElementById('linkDisplay');
            if (item.link) {
                linkSection.style.display = "block";
                linkTag.href = item.link;
                linkTag.innerText = "🔗 " + (item.link_text || "開啟延伸資源");
            } else {
                linkSection.style.display = "none";
            }
        }

        function navigateCard(dir) {
            if (!filteredPool.length) return;
            currentIndex = (currentIndex + dir + filteredPool.length) % filteredPool.length;
            renderCard();
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            document.getElementById('penBtn').classList.toggle('active-pen', isPenMode);
            document.getElementById('cardElement').classList.toggle('canvas-active', isPenMode);
        }

        function clearAllCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function undoLastStroke() { clearAllCanvas(); }
        function toggleLanguage() {}

        window.onload = () => {
            initWeekOptions();
            applyFilters();
        };
    </script>
</body>
</html>
