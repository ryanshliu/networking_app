 Out of control (phr.) [系統失控]：脫序、失控、變叛逆。\n  例句：Safety interlocks automatically trip the system if digital valve controllers *go rogue*.", "White elephant (n.) [昂貴負擔]：大而無用、華而不實的累贅資產。\n  例句：Without skilled operators, that automated packaging line will become an expensive *white elephant*."], "link": "https://www.youtube.com/watch?v=EzKDGg99Qic", "link_text": "觀看 CBS: Jensen Huang on Artificial Intelligence (YouTube)"}, {"week": "week7", "class_date": "2026/09/30", "type": "sentence", "category": "商務異議與腦力激盪 (Language for Disagreeing)", "title": "腦力激盪、促銷定價與四頁投影片協商全攻略 (BBC Work #10 & PPT Review)", "key_takeaways": "【BBC Work #10 腦力激盪與完整 4 頁 PPT 觀點協商精讀】\n1. 專案籌備：Upcoming launch 新品發布；Get together to + V 齊聚；Agree on + 物 ↔ Agree with + 人。\n2. 完整收錄投影片 1~3 觀點庫：強烈贊同 (You can say that again! / I couldn't agree more!)；強烈反對 (Over my dead body! / Not in a million years!)；部分贊同 (I agree up to a point, but... / Yes and no)；提出建議 (Why don't we... / Hear me out)。\n3. 課堂重要片語：Hit a plateau (進入高原期/成長瓶頸)；Vent (發洩宣洩)；I caved in (我妥協讓步了)；Take me ages (耗費極長時間)；I'd better (最好)。", "main_content": "A: Everyone, let's get together to brainstorm the upcoming launch of our citrus surfactant line!\n（各位，讓我們聚在一起為即將上市的柑橘界面活性劑產品線進行腦力激盪吧！）\nB: I'm not so sure about that marketing discount. If we make a special offer, we should make it so compelling that everyone will say yes!\n（我對那個行銷折扣持保留態度。如果我們要做特別優惠，就應該把它做得極具吸引力，讓每個人都願意買單！）\nA: You can say that again! I see your point, but finance might think it's too aggressive. What if we offer it in pairs to special VIP clients?\n（你說得太對了！我明白你的意思，但財務部可能會認為這太激進了。如果我們兩人一組向特定 VIP 客戶提供專屬優惠呢？）\nB: I couldn't agree more! That hits the nail on the head. Let us agree on this strategy so we don't hit a plateau!\n（我完全同意！這切中了問題核心。讓我們在這項策略上達成協議，免得我們的新品推廣陷入瓶頸停滯期！）", "vocab_notes": ["Upcoming launch (n. phr.) [商務專案]：即將到來的新品發表/上市推展。\n  例句：Our global marketing division is preparing for the *upcoming launch* of low-carbon solvents.", "You can say that again! (idiom) [強烈贊同]：你說得太對了！我完全同意！\n  例句：'The turnaround was demanding.' — '*You can say that again!*'", "Hit a plateau (idiom) [成長瓶頸]：進入高原期、陷入停滯瓶頸期。\n  例句：Sales growth *hit a plateau* after penetrating primary domestic industrial accounts.", "I caved in (idiom) [妥協讓步]：我妥協了、我認輸服軟了。\n  例句：After intense price negotiations, the equipment supplier finally *caved in* and gave us a discount."], "practice_quiz": [{"question": "【第 1 題】想極度強烈地贊同對方的觀點：You can say that _________!", "answer": "✔ 填空解答：again\n👉 整句回答：You can say that again!"}, {"question": "【第 2 題】商務業務進入瓶頸期、停止成長：Our quarterly revenue growth has hit a _________.", "answer": "✔ 填空解答：plateau\n👉 整句回答：Our quarterly revenue growth has hit a plateau."}], "instant_guide": {"core_concepts": ["1. 掌握 4 頁 PPT 之同意、反對、部分贊同與建議完整句型庫。", "2. 優秀語言學習者的四大討論修養。"], "misconceptions": ["誤解：以為 disagree 只有 No，商務談判運用 'I agree to a certain extent, but...' 既展現專業又能堅持底線。"], "exam_questions": ["Q1: 請列舉兩種表達『極端強烈反對』的口語用法。"]}, "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/10-disagreeing", "link_text": "前往 BBC Work #10: The Brainstorm 官方網頁"}, {"week": "week7", "class_date": "2026/09/30", "type": "sentence", "category": "誤會化解與溝通重啟 (Explaining Misunderstandings)", "title": "化解誤會、釐清混淆與建立好印象 (BBC Work #19: The Open Window)", "key_takeaways": "【BBC Work #19 誤會排解與人際職場表達】\n1. 氣候與易混音字：Chilly 寒冷涼颼颼 vs. Chili 辣椒；It must've fallen off my desk (一定是從桌上掉下去)。\n2. 片語辨析：Keep up with (跟上) vs. Come up with (想出點子)。\n3. 規範義務：Be meant to = Be supposed to = Should (理應/原本應當)。\n4. 態度回應：'I'm not bothered' = I'm not upset (我沒生氣/不在意) vs. 'Don't bother' (別麻煩費心)。\n5. 人際職場：Leave someone to get on with (讓某人專心忙)；Leave with a good first impression 留下良好第一印象；A bit of a mix-up (小搞混弄錯)。", "main_content": "A: Why is the plant manager so upset about the unapproved audit report?\n（廠長為什麼對那份未經核可的稽核報告如此生氣？）\nB: I think there has been a bit of a mix-up! Anna wasn't meant to send the draft to headquarters.\n（我想這中間是有點小搞混弄錯了！Anna 原本不應該把草稿直接寄去總部的。）\nA: Let her explain what happened; hear her out!\n（讓她解釋發生了什麼事，聽她把話說完吧！）\nB: Exactly! The final revision must have fallen off her desk, but she came up with a rapid correction to leave the client with an impressive first impression.\n（沒錯！事實是，最終修正版肯定是從她桌上滑落了，但她隨後立刻想出補救方案，依舊給客戶留下了深刻優異的第一印象。）", "vocab_notes": ["A bit of a mix-up (n. phr.) [委婉化解]：有點小搞混、小差錯。\n  例句：I apologize for the delay; there was *a bit of a mix-up* in the shipping paperwork.", "Be meant to = Be supposed to (v. phr.) [職責規範]：本應當、理應做……\n  例句：Contractors *are meant to* wear personal protective gear at all times on the refinery floor.", "Come up with (phr. v.) [創意思維]：想出（點子、方案）。\n  例句：Our EHS committee *came up with* an innovative vapor capture proposal."], "practice_quiz": [{"question": "【第 1 題】商務場合委婉表示作業上發生小搞混：Don't worry, there has just been a bit of a _________-_________.", "answer": "✔ 填空解答：mix-up\n👉 整句回答：Don't worry, there has just been a bit of a mix-up."}], "instant_guide": {"core_concepts": ["1. 掌握委婉化解衝突公式 (A bit of a mix-up / Hear me out)。", "2. 分辨 be meant to 與 keep/come up with。"], "misconceptions": ["誤解：以為 mix-up 是嚴重錯誤，在職場口語中，使用 a bit of a mix-up 是極佳的卸除防備委婉說法。"], "exam_questions": ["Q1: 請挑出錯誤並改正：I am looking forward to come up with a solution."]}, "link": "https://www.bbc.com/learningenglish/persian/features/english-at-work/19-explaining-a-misunderstanding", "link_text": "前往 BBC Work #19: The Open Window 官方網頁"}, {"week": "week7", "class_date": "2026/09/30", "type": "media", "category": "乘車搭機禮儀自習 (William Hanson 02:43)", "title": "四大乘車與搭機乘客禮儀指南 (Top 4 Passenger Etiquette Tips)", "key_takeaways": "【英國皇家禮儀權威 William Hanson 專題】\n知名禮儀大師 William Hanson 傳授商務旅客必知的 4 大乘車與搭機乘客禮節：先下後上、走道通暢、耳機通話避免擴音、留意個人空間與椅背傾斜禮儀。", "main_content": "A: What is William Hanson's primary rule regarding seat reclining during flights?\n（William Hanson 關於飛行時傾斜椅背的首要規則是什麼？）\nB: Always look back and ask your fellow passenger politely before pushing your seat back!\n（在將椅背往後壓之前，務必先回頭客氣詢問後方乘客的意願！）\nA: Who gets ownership of the middle armrests in standard three-abreast aircraft seating?\n（在標準的三人排座位中，中間座椅的兩個扶手歸屬權屬於誰？）\nB: Etiquette dictates that the passenger stuck in the middle seat deserves both armrests as a courteous consolation!\n（乘車禮儀規定，夾在中間座位的乘客應享有兩側扶手，作為禮貌性的補償！）", "vocab_notes": ["Passenger etiquette (n. phr.) [商務差旅]：乘客禮儀規範。\n  例句：Observing proper *passenger etiquette* ensures smooth travels during executive delegations.", "Decorum (n.) [正式禮儀]：端莊得體、禮貌規矩。\n  例句：Business travelers are expected to maintain composure and *decorum* in VIP lounges."], "link": "https://www.youtube.com/watch?v=_MDYoFXqbIo", "link_text": "觀看 William Hanson: Top 4 Passenger Etiquette Tips (YouTube)"}, {"week": "week7", "class_date": "2026/09/30", "type": "media", "category": "全球奢侈品商業 (CNBC 04:25)", "title": "鑽石市場價格為何崩跌如此迅速？ (Why Diamond Prices Are Falling So Fast?)", "key_takeaways": "【CNBC 深度原物料與奢侈品商業分析】\n深入剖析全球天然鑽石價格為何急劇崩跌：實驗室人造培育鑽石產能爆發與價格斷崖、傳統開採巨頭 (De Beers 等) 定價權崩解、年輕世代消費觀念顛覆。", "main_content": "A: Why have natural diamond prices dropped so precipitously according to CNBC?\n（根據 CNBC 的報導，為什麼天然鑽石的價格會如此急劇暴跌？）\nB: The exponential boom of lab-grown diamonds has shattered the industry's illusion of scarcity!\n（實驗室培育鑽石的爆發性成長徹底粉碎了鑽石產業長年營造的稀缺性神話！）\nA: Are lab-grown diamonds chemically different from mined stones?\n（實驗室培育的鑽石與天然開採的鑽石在化學結構上有差異嗎？）\nB: Not at all! They possess identical optical and physical hardness, yet sell at an 80% discount compared to mined gems.\n（完全沒有差異！它們具有完全相同的光學折射與物理硬度，然而售價卻只要天然寶石的兩成不到。）", "vocab_notes": ["Lab-grown diamonds (n. phr.) [材料科技]：人造/實驗室培育鑽石。\n  例句：*Lab-grown diamonds* have emerged as a high-purity, sustainable alternative in semiconductor heat sinks.", "Precipitous collapse (n. phr.) [財經市場]：急劇暴跌、懸崖式崩塌。\n  例句：Unregulated capacity expansion triggered a *precipitous collapse* in solar polysilicon pricing."], "link": "https://www.youtube.com/watch?v=xrg6QCGzQGc", "link_text": "觀看 CNBC: Why Diamond Prices Are Falling So Fast? (YouTube)"}, {"week": "week7", "class_date": "2026/09/30", "type": "media", "category": "職場會議實務 (BBC Work #10)", "title": "腦力激盪與會議委婉異議 (BBC Work #10: The Brainstorm)", "key_takeaways": "【BBC English at Work 官方情境劇】\nTip Top Trading 團隊聚在一起討論塑膠水果新產品發布會。Anna 在會議中學習如何專業且不傷和氣地提出反對意見，並提出更好的促銷折衷方案。", "main_content": "A: How did Anna politely disagree during the brainstorming session in Episode 10?\n（Anna 在第10集的腦力激盪會議中是如何禮貌提出反對意見的？）\nB: Instead of saying 'You are wrong', she used 'I'm not so sure about that' and 'I see your point, but...'!\n（她沒有生硬地說『你錯了』，而是使用『我對此持保留態度』以及『我明白你的觀點，但是……』！）\nA: What was the outcome?\n（談判結果如何？）\nB: The manager appreciated her balanced feedback and agreed to refine the promotional offer.\n（主管非常讚賞她具建設性的反饋，並同意重新優化特別促銷方案。）", "vocab_notes": ["Special offer (n. phr.) [商務行銷]：特別優惠促銷方案。\n  例句：Our sales team created a targeted *special offer* for VIP accounts."], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/10-disagreeing", "link_text": "觀看 BBC English at Work: Episode 10"}, {"week": "week7", "class_date": "2026/09/30", "type": "media", "category": "誤會化解實戰 (BBC Work #19)", "title": "開窗風波：化解職場誤會 (BBC Work #19: The Open Window)", "key_takeaways": "【BBC English at Work 官方情境劇】\n因為辦公室窗戶開關與重要報告遺失，引發了一場跨部門誤會。學習如何用 'a bit of a mix-up' 委婉緩和氣氛，並以條理清晰的方式解釋事實原委。", "main_content": "A: What triggered the misunderstanding in Episode 19: The Open Window?\n（第19集『開著的窗戶』中是什麼引發了這場誤會？）\nB: A draft contract blew off the desk on a chilly morning, leading the manager to think someone had neglected the project!\n（在一個寒冷的早晨，合約草稿被風吹落桌底，導致主管誤以為有人怠慢了專案工作！）\nA: How did Anna de-escalate the tension?\n（Anna 是如何平息緊張氣氛的？）\nB: She said 'Hear me out; there's been a bit of a mix-up', and quickly produced the verified documents!\n（她說『聽我解釋，這中間只是有點小搞混』，隨後迅速拿出了經核實的正本文件！）", "vocab_notes": ["De-escalate (v.) [衝突管理]：降溫、緩和（緊張情勢）。\n  例句：Active empathy is the most effective tool to *de-escalate* workplace friction."], "link": "https://www.bbc.co.uk/learningenglish/persian/features/english-at-work/19-explaining-a-misunderstanding", "link_text": "觀看 BBC English at Work: Episode 19"}, {"week": "week8", "class_date": "2026/10/07", "type": "sentence", "category": "認錯道歉與立場辯護 (Justifying Your Position)", "title": "承認疏失與委婉為立場辯護 (BBC Work #54: Eating The Humble Pie)", "key_takeaways": "【BBC Work #54 承認錯誤與主管對談情境重點】[, 3]\n1. 核心成語：Eat humble pie 承認錯誤、低頭認錯賠罪[, 3]。\n2. 辦公室混亂與電話禮儀：\n   - Chaotic (adj.) 混亂脫序的 / Chaos (n.) 大混亂；Mess / Messy 雜亂的。\n   - Take a message (代接留言) vs. Leave a message (來電者留言)。\n   - Expect a phone call (預期接到來電)；Wash something off；Personal Hygiene 個人衛生。\n3. 文具與行動易混詞：\n   - Run out of (用光耗盡)；Stationery (文具，e for envelope) vs. Stationary (靜止不動的，a for anchor)。\n   - Hasty 倉促草率的（*Haste makes waste 欲速則不達*）。\n   - Reverse 翻轉撤銷 ➔ Reversible (可逆的) vs. Irreversible (不可逆的)。\n   - Awkward (尷尬彆扭的) vs. Embarrassing (令人難堪丟臉的)；Coward (懦夫膽小鬼)。\n   - 薪資調整：英式 Pay rise vs. 美式 Pay raise；First thing tomorrow (明早第一件事)。\n4. 責任歸屬與重啟聘用金句：\n   - You're the boss and I think the news is better coming from you. (你是主管，這消息由你親自傳達比較妥當)\n   - It was your decision in the first place, so you need to explain that the situation has changed. (當初是你做的決定，所以你必須親自解釋情況已變)\n   - This is your responsibility. (這是你的職責所在)\n   - I've been rethinking our staffing situation in the office. (我一直在重新思考辦公室的人力配置狀況)\n   - Sorry, I made a mistake. I miscalculated my staffing numbers. (抱歉，我犯了錯。我算錯了所需的人力數字)\n   - I would love to have you back in the office. (我非常希望你能重回辦公室工作)", "main_content": "A: The office has been completely chaotic since you slashed our personnel! We have run out of stationery and clients are furious.\n（自從你裁減我們的人員後，整個辦公室陷入了極度混亂！我們的文具都用光了，客戶也非常生氣。）\nB: I know, it's an awkward situation. It was a hasty decision, but is the damage reversible?\n（我知道，現在情況很尷尬。當初是倉促草率的決定，但這損害還有挽回逆轉的空間嗎？）\nA: You're the boss and this was your decision in the first place, so the news is better coming from you. This is your responsibility!\n（你是老闆，當初也是你做的決定，這消息由你親自去說比較好。這是你的責任！）\nB: Alright, I have to eat humble pie. First thing tomorrow, I will call Anna and say: 'Sorry, I made a mistake. I miscalculated our staffing numbers. I would love to have you back in the office!'\n（好吧，我只能低頭認錯賠罪了。明天一大早，我會親自打給 Anna 說：『抱歉，我犯了錯，算錯了人力配置。我非常希望你能重回辦公室上班！』）", "vocab_notes": ["Eat humble pie (idiom) [社交認錯]：低頭認錯、賠罪服軟[, 3]。\n  例句：After the audit proved him wrong, the plant superintendent had to *eat humble pie*.", "Chaotic (adj.) [場面描述]：混亂脫序的（名詞為 chaos）。\n  例句：Without a designated safety lead, the turnaround shutdown became completely *chaotic*.", "Stationery vs. Stationary [易混淆字]：Stationery 文具（e for envelope 信封）↔ Stationary 靜止不動的（a for anchor 錨）。\n  例句：Please submit a requisition before we run out of office *stationery*.", "Irreversible (adj.) [嚴重後果]：不可逆的、無法挽回的。\n  例句：Chemical reactor runaway causes *irreversible* equipment damage if pressure relief fails.", "Hasty (adj.) [決策態度]：倉促草率的（成語：Haste makes waste 欲速則不達）。\n  例句：Making a *hasty* decision to bypass the MOC procedure will inevitably lead to non-compliance."], "practice_quiz": [{"question": "【第 1 題】形容做錯決定後『低頭認錯賠罪』的英式成語：He had to eat _________ _________ after miscalculating the budget.[, 3]", "answer": "✔ 填空解答：humble pie\n👉 整句回答：He had to eat humble pie after miscalculating the budget."}, {"question": "【第 2 題】請填入正確的文具拼法：We need to purchase more office _________ (文具：stationery 還是 stationary？)。", "answer": "✔ 填空解答：stationery\n👉 整句回答：We need to purchase more office stationery."}], "instant_guide": {"core_concepts": ["1. 掌握認錯金句 (Eat humble pie / Miscalculated staffing numbers)[, 3]。", "2. 責任釐清與請對方復職 (Better coming from you / Love to have you back)。"], "misconceptions": ["誤解：以為道歉是失職，在商務管理上坦誠承認 miscalculated 並提出補救能重新贏得信任。"], "exam_questions": ["Q1: 請解釋 Stationery 與 Stationary 的拼法與意義差異。"]}, "link": "https://www.bbc.com/learningenglish/english/features/english-at-work/54-language-for-justifying-your-position", "link_text": "前往 BBC Work #54: Eating Humble Pie 課程網頁"}, {"week": "week8", "class_date": "2026/10/07", "type": "media", "category": "影集經典致歉 (Big Bang Theory #1)", "title": "謝爾頓向哥哥喬治道歉 (Sheldon Finally Apologized to His Brother George - 02:30)", "key_takeaways": "【影集經典互動精析】\n美劇《生活大爆炸 (The Big Bang Theory)》中，長年高傲自負、從不低頭的 Sheldon 面臨婚禮前夕，為了挽回哥哥 George 前來參加婚禮，終於放下身段坦承自己過去自私與傲慢的致歉過程。\n\n【Your Tasks & Reference Answer】\n1. Video Summary (1-3 sentences):\n   👉 Sheldon travels back to his hometown to persuade his estranged older brother George to attend his wedding.\n   👉 George confronts Sheldon about the unseen sacrifices their family made to support his genius childhood while Sheldon remained ungrateful.\n   👉 Sheldon swallows his pride and delivers a sincere, overdue apology, finally acknowledging his brother's hard work and reconciliation.\n2. New Words Learned:\n   👉 Estranged (疏遠冷戰的), Swallows his pride (放下自尊驕傲), Overdue apology (遲來的道歉), Reconciliation (和解破冰), Unseen sacrifices (看不見的犧牲奉獻).\n3. Assignment Task: Formulate a 2-sentence formal apology to a project partner after realizing an unintentional administrative oversight.", "main_content": "A: Why was it such a monumental moment when Sheldon apologized to George?\n（為什麼謝爾頓向哥哥喬治道歉是一個如此重大的時刻？）\nB: Because Sheldon had never acknowledged how much his family sacrificed for him. He ate humble pie and delivered a genuine apology!\n（因為謝爾頓從未承認過他的家人為他付出了多少犧牲。他放下了驕傲低頭認錯，給出了一段真誠的道歉！）\nA: How did George respond to Sheldon's overdue apology?\n（喬治對謝爾頓遲來的道歉有何反應？）\nB: He accepted it warmly, proving that swallowing one's pride can mend years of strained family ties.\n（他欣然接受了，證明了放下身段能夠修復多年緊張的家庭關係。）", "vocab_notes": ["Overdue apology (n. phr.) [人際修復]：遲來的道歉。\n  例句：Delivering an *overdue apology* cleared up years of resentment between the siblings."], "link": "https://www.youtube.com/watch?v=-zO0gN2_QyI", "link_text": "觀看 Sheldon Apologized to George (YouTube)"}, {"week": "week8", "class_date": "2026/10/07", "type": "media", "category": "喜劇公開致歉 (Big Bang Theory #2)", "title": "廣播公開道歉風波 (A Public Apology - The Big Bang Theory - 03:00)", "key_takeaways": "【商務與學術公關道歉探討】\n探討在科學公眾廣播 (NPR) 節目失言後，如何在公眾場合發表得體道歉 (Public apology)。分析道歉時語氣失當可能帶來的反效果與尷尬 (Awkward & Embarrassing)。\n\n【Your Tasks & Reference Answer】\n1. Video Summary (1-3 sentences):\n   👉 Sheldon is forced by university management to make a public on-air apology after disparaging a rival physicist during a National Public Radio broadcast.\n   👉 Instead of delivering a straightforward reconciliation, Sheldon attempts to rationalize his behavior with condescending academic justifications.\n   👉 His reluctant tone turns the live broadcast into an awkward PR disaster, showing how insincere apologies backfire.\n2. New Words Learned:\n   👉 Disparaging (貶低輕蔑的), Rationalize (合理化辯解), Condescending (居高臨下的), Insincere (缺乏誠意的), Backfire (適得其反).\n3. Assignment Task: Script two sentences showing how to deliver an on-air public retraction gracefully without sounding defensive.", "main_content": "A: Did Sheldon's radio public apology resolve the conflict?\n（謝爾頓在廣播中的公開道歉化解衝突了嗎？）\nB: Not at all! He sounded condescending and tried to rationalize his remarks. It was totally awkward and backfired completely!\n（完全沒有！他聽起來居高臨下還試圖合理化自己的言論。場面極度尷尬而且徹底適得其反！）\nA: What is the main takeaway for professional communication?\n（這對專業職場溝通有何啟示？）\nB: An apology must be straightforward and sincere; sounding defensive will only ruin your credibility.\n（道歉必須坦率而真誠；聽起來防禦心重只會毀掉你的公信力。）", "vocab_notes": ["Condescending (adj.) [傲慢態度]：居高臨下的、自以為高人一等的。\n  例句：Avoid adopting a *condescending* tone when addressing customer support tickets."], "link": "https://www.youtube.com/watch?v=p5cGPAzGFbM", "link_text": "觀看 A Public Apology (YouTube)"}, {"week": "week8", "class_date": "2026/10/07", "type": "media", "category": "商業擴張自學 (Bloomberg)", "title": "壽司郎進軍美國市場新篇章 (Sushiro's New Chapter in the American Market - 03:03)", "key_takeaways": "【彭博商業專題自學分析】\n日本迴轉壽司巨頭壽司郎 (Sushiro) 克服文化飲食習慣差異、進軍競爭激烈的美國餐飲市場。探討自動化輸送帶技術 (Conveyor-belt automation) 如何在缺工與高通膨環境下維持平價優勢 (Price competitiveness)。\n\n【Your Tasks & Reference Answer】\n1. Video Summary (1-3 sentences):\n   👉 Bloomberg examines how Japan's top conveyor-belt sushi chain Sushiro is expanding across the United States to unlock new international revenue streams.\n   👉 The chain adapts its touch-screen ordering and automated plate-tracking technology to cater to American culinary tastes and hygiene preferences.\n   👉 By leveraging robotics to cut labor overhead, Sushiro aims to deliver consistent Japanese dining at accessible price points amid ongoing inflation.\n2. New Words Learned:\n   👉 Conveyor-belt sushi (迴轉壽司), Price competitiveness (價格競爭力), Labor overhead (勞動力人事營運成本), Culinary preferences (飲食偏好風格), Accessible price points (平易近人的價格帶).\n3. Assignment Task: Write three sentences explaining why fast-casual restaurant automation provides a competitive moat in high-wage economies.", "main_content": "A: How is Sushiro differentiating itself in the American dining landscape?\n（壽司郎在美國餐飲版圖中如何做出差異化？）\nB: By combining automated conveyor-belt robotics with affordable sushi, they keep labor overhead down while maintaining authentic quality!\n（透過將自動化迴轉傳送帶與平價壽司相結合，他們在維持道地品質的同時大幅降低了人事營運成本！）\nA: Do you think automated delivery will succeed in the US?\n（你認為自動化送餐在美國會成功嗎？）\nB: Definitely, especially in metropolitan areas where rising operational costs demand tech-driven efficiency.\n（肯定會，特別是在不斷上漲的營運成本迫切需要技術驅動效率的大都會區。）", "vocab_notes": ["Conveyor-belt (n.) [自動化設備]：輸送帶、傳送帶。\n  例句：Modern production facilities use *conveyor-belt* sensors to inspect defect rates automatically."], "link": "https://www.youtube.com/watch?v=vJhZc-Uhbjw", "link_text": "觀看 Sushiro's New Chapter (Bloomberg)"}, {"week": "week8", "class_date": "2026/10/07", "type": "media", "category": "前瞻汽車自學 (WSJ News 03:25)", "title": "實測飛雅特微型電動車登陸美國道路 (Driving Fiat's Micro EV on American Roads - 03:25)", "key_takeaways": "【華爾街日報 WSJ 汽車硬體實測自學】\nWSJ 實測義大利車廠 Fiat 旗下超微型電動車 Topolino / 500e。探討在以巨大皮卡與 SUV 為主導的美國公路文化中，極限微型代步車所面臨的安全法規限制、續航力權衡與都市停車優勢。\n\n【Your Tasks & Reference Answer】\n1. Video Summary (1-3 sentences):\n   👉 WSJ automotive reporter tests Fiat's ultra-compact micro EV on busy American suburban and city roads.\n   👉 The video highlights the striking visual contrast between the tiny urban runabout and towering American pickup trucks, raising notable highway safety questions.\n   👉 While praised for effortless parking maneuvers and low charging costs, legal speed restrictions confine its practical utility strictly to dense urban neighborhoods.\n2. New Words Learned:\n   👉 Micro EV (微型電動車), Urban runabout (都會代步短程車), Towering pickup trucks (高聳龐大的皮卡貨車), Parking maneuvers (停車進出操作), Speed restrictions (行車速限規範).\n3. Assignment Task: Compose three sentences evaluating whether ultra-compact electric vehicles are viable for daily industrial plant commuting.", "main_content": "A: What was the reporter's verdict on driving a Fiat micro EV across American streets?\n（記者在美國街道上試駕飛雅特微型電動車後的評價是什麼？）\nB: It is incredibly agile for tight urban parking, but driving it next to gigantic pickup trucks feels slightly daunting due to speed and size disparities!\n（它在狹窄的市區停車時靈活無比，但因為速度與體積懸殊，開在巨大的皮卡車身旁讓人感到有點膽戰心驚！）\nA: Would it be suitable for industrial site inspections?\n（它適合拿來當作工業園區內的巡檢車嗎？）\nB: It would be ideal for short on-site plant commutes, provided speed limits and safety lanes are respected.\n（只要遵守廠區速限與安全通道規範，它非常適合作為短程廠區通勤工具。）", "vocab_notes": ["Agile (adj.) [操控反應]：靈活敏捷的。\n  例句：Compact vehicles are exceptionally *agile* in congested metropolitan centers.", "Disparity (n.) [懸殊落差]：巨大差距、懸殊差異。\n  例句：The significant size *disparity* between trucks and micro EVs creates highway safety concerns."], "link": "https://www.youtube.com/watch?v=qtV_U0fQICE", "link_text": "觀看 Fiat's Micro EV on American Roads (WSJ)"}];
        const examData = {"title": "Networking English 全真模擬檢測試卷 (Mid-Term & Review Practice)", "sections": [{"type": "單選題 (Multiple Choice)", "questions": [{"q": "1. Which idiom means to acknowledge that you were wrong and accept humiliation or apologize gracefully?", "options": ["A. Eat humble pie", "B. Beat around the bush", "C. Hit a plateau", "D. Break out of sandbox"], "ans": "A", "explanation": "Eat humble pie 是英語中表達『低頭認錯、賠罪服軟』的經典成語。"}, {"q": "2. Which of the following is spelled CORRECTLY for office envelopes and paper supplies?", "options": ["A. Stationery", "B. Stationary", "C. Stationerry", "D. Stationairy"], "ans": "A", "explanation": "文具為 Stationery（字尾為 -ery，口訣：e 代表 envelope 信封）；Stationary 則為形容詞靜止不動的。"}, {"q": "3. Which sentence pattern correctly uses the preposition 'to' when closing business correspondence?", "options": ["A. I look forward to see you.", "B. I look forward to seeing you.", "C. I look forward to meet you.", "D. I look forward to collaborate."], "ans": "B", "explanation": "Look forward to 中的 to 是介系詞，後方必須搭配動名詞 (V-ing) 或名詞。"}, {"q": "4. What idiom expresses the mental state of being so stressed or exhausted that you cannot think clearly?", "options": ["A. Can't think straight", "B. Stand one's ground", "C. Cut to the chase", "D. Go with the flow"], "ans": "A", "explanation": "Can't think straight 指思緒紊亂、無法理性清晰思考。"}]}]};
        const top5Data = [{"rank": "Top 1 必考核心", "topic": "Eat humble pie 與商務認錯金句 (BBC Work #54)", "prob": "出題機率：99%", "challenge_q": "Q: 請翻譯：『主管算錯了人力配置，明天一早必須親自向同仁道歉。』", "challenge_ans": "✔ 'The manager miscalculated the staffing numbers and must eat humble pie first thing tomorrow.'"}, {"rank": "Top 2 必考核心", "topic": "Stationery (文具) vs. Stationary (靜止的) 拼寫辨析", "prob": "出題機率：97%", "challenge_q": "Q: 請判斷：'The forklift collided with a stationery container.' 是否正確？", "challenge_ans": "✔ 錯誤！靜止不動的貨櫃應使用 stationary（a for anchor 錨），而非文具 stationery。"}, {"rank": "Top 3 必考核心", "topic": "Look forward to + V-ing 文法與介系詞規則", "prob": "出題機率：95%", "challenge_q": "Q: 請改正：'I look forward to hear your project feedback soon.'", "challenge_ans": "✔ 應改為 'I look forward to hearing your project feedback soon.' (to 為介系詞後接 V-ing)。"}, {"rank": "Top 4 必考核心", "topic": "誤會化解金句 (A bit of a mix-up & Hear me out)", "prob": "出題機率：93%", "challenge_q": "Q: 會議中如何客氣說明『兩份訂單資料搞混了』？", "challenge_ans": "✔ 'Don't worry, there seems to have been a bit of a mix-up with the order sheets.'"}, {"rank": "Top 5 必考核心", "topic": "可逆與不可逆詞彙 (Reversible vs. Irreversible)", "prob": "出題機率：90%", "challenge_q": "Q: 製程安全中『不可逆的腐蝕損害』英文如何表達？", "challenge_ans": "✔ 'Irreversible corrosion damage to the piping unit.'"}];

        const allItems = [...database];

        let currentPool = [];
        let currentIndex = 0;
        let currentTab = 'sentence';
        let currentSuiteTool = 'guide';
        let suiteScope = 'current';

        let isPenMode = false;
        let isDrawing = false;
        let undoStack = [];
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        function checkVersionUpdate() {
            const currentVer = "1.9";
            const cachedVer = localStorage.getItem('ryan_networking_app_ver');
            if (cachedVer !== currentVer) {
                const banner = document.getElementById('updateNoticeBanner');
                if (banner) banner.style.display = 'flex';
                localStorage.setItem('ryan_networking_app_ver', currentVer);
            }
        }
        function dismissUpdateBanner() {
            const banner = document.getElementById('updateNoticeBanner');
            if (banner) banner.style.display = 'none';
        }

        function resizeCanvas() {
            const card = document.getElementById('cardElement');
            if (card && canvas) {
                canvas.width = card.clientWidth;
                canvas.height = card.clientHeight;
            }
        }

        function saveCanvasState() {
            if (undoStack.length > 15) undoStack.shift();
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        function undoLastStroke() {
            if (undoStack.length > 0) {
                const prevState = undoStack.pop();
                ctx.putImageData(prevState, 0, 0);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            document.getElementById('penBtn').classList.toggle('active-pen', isPenMode);
            document.getElementById('cardElement').classList.toggle('canvas-active', isPenMode);
            if (isPenMode) resizeCanvas();
        }

        function clearAllCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            undoStack = [];
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!isPenMode) return;
            isDrawing = true;
            saveCanvasState();
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.strokeStyle = '#e11d48';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !isPenMode) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        });

        canvas.addEventListener('pointerup', () => { isDrawing = false; });
        canvas.addEventListener('pointercancel', () => { isDrawing = false; });

        function switchAppMode(mode, btn) {
            document.querySelectorAll('.main-mode-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            document.getElementById('viewCards').style.display = (mode === 'cards') ? 'block' : 'none';
            document.getElementById('viewSuite').style.display = (mode === 'suite') ? 'block' : 'none';
            document.getElementById('viewExam').style.display = (mode === 'exam') ? 'block' : 'none';

            if (mode === 'suite') loadSuiteTool(currentSuiteTool);
            if (mode === 'exam') renderExam();
        }

        function setTab(tabName) {
            currentTab = tabName;
            document.getElementById('tabSentence').classList.toggle('active', tabName === 'sentence');
            document.getElementById('tabMedia').classList.toggle('active', tabName === 'media');
            applyFilters();
        }

        function applyFilters() {
            const weekSelector = document.getElementById('weekFilter');
            const weekVal = (weekSelector ? weekSelector.value : 'week8').trim().toLowerCase();

            currentPool = allItems.filter(item => {
                const w = String(item.week).trim().toLowerCase();
                const t = String(item.type).trim().toLowerCase();
                return w === weekVal && t === currentTab;
            });

            if (currentPool.length === 0) {
                currentPool = allItems.filter(item => String(item.week).trim().toLowerCase() === weekVal);
            }
            if (currentPool.length === 0 && allItems.length > 0) {
                currentPool = [allItems[0]];
            }

            currentIndex = 0;
            renderCard();
        }

        function formatFormattedText(rawText) {
            if (!rawText) return '';
            let text = String(rawText);
            text = text.split('[').join('').split(']').join('');
            text = text.replace(/\*([^*]+)\*/g, '<span class="highlight-term">$1</span>');
            return text.replace(/\n/g, '<br>');
        }

        function renderVocabCardItem(rawText) {
            let text = String(rawText).trim();
            let exampleText = "";
            if (text.includes("例句：") || text.includes("例句:")) {
                let parts = text.split(/例句[：:]/);
                text = parts[0].trim();
                exampleText = parts[1].trim();
            }
            let posMatch = text.match(/\((v\.|n\.|adj\.|adv\.|phr\.|idiom|句型)[^\)]*\)/i);
            let posTagHtml = "";
            if (posMatch) {
                posTagHtml = '<span class="vocab-pos-tag">' + posMatch[0] + '</span>';
                text = text.replace(posMatch[0], "").trim();
            }
            let mainTerm = text;
            let defText = "";
            if (text.includes("：") || text.includes(":")) {
                let colonParts = text.split(/[：:]/);
                mainTerm = colonParts[0].trim();
                defText = colonParts.slice(1).join("：").trim();
            }
            return '<div class="vocab-card-item">' +
                '<div class="vocab-head-row"><span>' + formatFormattedText(mainTerm) + '</span>' + posTagHtml + '</div>' +
                (defText ? '<div class="vocab-def-text">' + formatFormattedText(defText) + '</div>' : '') +
                (exampleText ? '<div class="vocab-example-box"><strong>例句：</strong>' + formatFormattedText(exampleText) + '</div>' : '') +
                '</div>';
        }

        function renderTaskBlocks(taskContent) {
            let html = "";
            let lines = taskContent.split('\n');
            let currentTitle = "";
            let currentBody = [];

            function flushBlock() {
                if (currentTitle || currentBody.length) {
                    html += '<div class="task-block"><div class="task-block-title">' + currentTitle + '</div><div>' + formatFormattedText(currentBody.join('\n')) + '</div></div>';
                    currentTitle = "";
                    currentBody = [];
                }
            }

            lines.forEach(line => {
                let l = line.trim();
                if (!l) return;
                if (l.match(/^[123]\./) || l.startsWith("【Your Tasks")) {
                    flushBlock();
                    currentTitle = l;
                } else {
                    currentBody.push(l);
                }
            });
            flushBlock();
            return html;
        }

        function renderCard() {
            if (!currentPool || currentPool.length === 0) return;
            const item = currentPool[currentIndex];

            const badge = document.getElementById('categoryBadge');
            badge.innerText = item.category || "教材";
            
            if (item.category && (item.category.includes('自習') || item.category.includes('自學') || item.category.includes('專訪'))) {
                badge.className = "badge self-study-badge";
            } else if (item.type === 'media') {
                badge.className = "badge media-badge";
            } else {
                badge.className = "badge";
            }

            document.getElementById('dateDisplay').innerText = item.class_date ? ' • ' + item.class_date : '';
            document.getElementById('counterDisplay').innerText = (currentIndex + 1) + ' / ' + currentPool.length;
            document.getElementById('titleDisplay').innerText = item.title || "";

            const tkSection = document.getElementById('takeawaysSection');
            const taskCardSection = document.getElementById('taskCardSection');
            taskCardSection.style.display = 'none';
            taskCardSection.innerHTML = '';

            if (item.key_takeaways) {
                let fullTakeaway = item.key_takeaways;
                if (fullTakeaway.includes('【Your Tasks')) {
                    const parts = fullTakeaway.split(/(?=【Your Tasks)/);
                    tkSection.style.display = 'block';
                    document.getElementById('takeawaysDisplay').innerHTML = formatFormattedText(parts[0].trim());

                    taskCardSection.style.display = 'block';
                    taskCardSection.innerHTML = '<div class="task-card"><div class="task-card-header"><span>📋</span><span>課前預習指引與標準參考答案 (Assignment Tasks)</span></div><div class="task-card-content">' + renderTaskBlocks(parts[1].trim()) + '</div></div>';
                } else {
                    tkSection.style.display = 'block';
                    document.getElementById('takeawaysDisplay').innerHTML = formatFormattedText(fullTakeaway);
                }
            } else {
                tkSection.style.display = 'none';
            }

            const mainContainer = document.getElementById('mainContentContainer');
            mainContainer.innerHTML = '';
            if (item.main_content) {
                const lines = item.main_content.split('\n');
                const hasDialog = lines.some(l => l.startsWith('A:') || l.startsWith('B:'));
                if (hasDialog) {
                    const box = document.createElement('div');
                    box.className = 'dialogue-container';
                    for (let i = 0; i < lines.length; i++) {
                        let l = lines[i].trim();
                        if (!l) continue;
                        if (l.startsWith('A:')) {
                            let enText = l.substring(2).trim();
                            let cnText = '';
                            if (i + 1 < lines.length && (lines[i+1].trim().startsWith('（') || lines[i+1].trim().startsWith('('))) {
                                cnText = lines[i+1].trim();
                                i++;
                            }
                            box.innerHTML += '<div class="chat-bubble-row speaker-a"><div class="speaker-avatar avatar-a">A</div><div class="chat-bubble-content"><div>' + enText + '</div>' + (cnText ? '<div class="chat-cn-trans">' + cnText + '</div>' : '') + '</div></div>';
                        } else if (l.startsWith('B:')) {
                            let enText = l.substring(2).trim();
                            let cnText = '';
                            if (i + 1 < lines.length && (lines[i+1].trim().startsWith('（') || lines[i+1].trim().startsWith('('))) {
                                cnText = lines[i+1].trim();
                                i++;
                            }
                            box.innerHTML += '<div class="chat-bubble-row speaker-b"><div class="speaker-avatar avatar-b">B</div><div class="chat-bubble-content"><div>' + enText + '</div>' + (cnText ? '<div class="chat-cn-trans">' + cnText + '</div>' : '') + '</div></div>';
                        } else {
                            box.innerHTML += '<div style="font-size:13.5px; color:#64748b; margin:4px 0;">' + l + '</div>';
                        }
                    }
                    mainContainer.appendChild(box);
                } else {
                    mainContainer.innerHTML = '<div style="background:var(--sky-bg); padding:12px; border-radius:14px; white-space:pre-line;">' + formatFormattedText(item.main_content) + '</div>';
                }
            }

            const quizSection = document.getElementById('quizSection');
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.innerHTML = '';
            if (item.practice_quiz && item.practice_quiz.length > 0) {
                quizSection.style.display = 'block';
                item.practice_quiz.forEach(q => {
                    const card = document.createElement('div');
                    card.className = 'quiz-card';
                    card.innerHTML = '<div class="quiz-q">' + q.question + '</div>' +
                                     '<button class="quiz-toggle-btn" onclick="toggleAnswer(this)">👁 顯示參考答案與示範</button>' +
                                     '<div class="quiz-ans-wrapper"><div class="quiz-ans-box">' + q.answer + '</div></div>';
                    quizContainer.appendChild(card);
                });
            } else {
                quizSection.style.display = 'none';
            }

            const vocabSection = document.getElementById('vocabSection');
            const vocabContainer = document.getElementById('vocabDisplayContainer');
            vocabContainer.innerHTML = '';
            if (item.vocab_notes && item.vocab_notes.length > 0) {
                vocabSection.style.display = 'block';
                item.vocab_notes.forEach(v => {
                    vocabContainer.innerHTML += renderVocabCardItem(v);
                });
            } else {
                vocabSection.style.display = 'none';
            }

            const linkSection = document.getElementById('linkSection');
            const linkDisplay = document.getElementById('linkDisplay');
            if (item.link) {
                linkSection.style.display = 'block';
                linkDisplay.href = item.link;
                linkDisplay.innerText = '🔗 ' + (item.link_text || '開啟延伸學習資源');
            } else {
                linkSection.style.display = 'none';
            }
        }

        function navigateCard(direction) {
            if (currentPool.length === 0) return;
            currentIndex = (currentIndex + direction + currentPool.length) % currentPool.length;
            renderCard();
        }

        function toggleAnswer(btn) {
            const ans = btn.nextElementSibling;
            if (ans.style.display === 'block') {
                ans.style.display = 'none';
                btn.innerText = '👁 顯示參考答案與示範';
            } else {
                ans.style.display = 'block';
                btn.innerText = '🙈 隱藏解答';
            }
        }

        function setSuiteScope(scope, btn) {
            suiteScope = scope;
            document.querySelectorAll('.suite-scope-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            loadSuiteTool(currentSuiteTool);
        }

        function loadSuiteTool(toolName, btn) {
            currentSuiteTool = toolName;
            if (btn) {
                document.querySelectorAll('.suite-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }

            const panel = document.getElementById('suiteContentPanel');
            const targetLessons = (suiteScope === 'all') ? allItems : [currentPool[currentIndex] || allItems[0]];

            if (toolName === 'guide') {
                let concepts = [], misconceptions = [], questions = [];
                targetLessons.forEach(l => {
                    if (l.instant_guide) {
                        concepts = concepts.concat(l.instant_guide.core_concepts || []);
                        misconceptions = misconceptions.concat(l.instant_guide.misconceptions || []);
                        questions = questions.concat(l.instant_guide.exam_questions || []);
                    }
                });
                panel.innerHTML = '<h3 style="margin-top:0; color:#1e1b4b;">📖 Instant Study Guide</h3>' +
                    '<div style="font-size:14px; font-weight:700; color:#4f46e5;">🎯 核心概念：</div><ul class="vocab-ul">' +
                    (concepts.length ? concepts.map(c => '<li>' + c + '</li>').join('') : '<li>精選商務溝通與社交句型架構。</li>') + '</ul>' +
                    '<div style="font-size:14px; font-weight:700; color:#b45309; margin-top:8px;">⚠️ 常見誤解：</div><ul class="vocab-ul">' +
                    (misconceptions.length ? misconceptions.map(m => '<li>' + m + '</li>').join('') : '<li>避免直譯中文口語，應著重母語人士習慣搭配詞。</li>') + '</ul>' +
                    '<div style="font-size:14px; font-weight:700; color:#047857; margin-top:8px;">✍️ 實戰自測：</div><ul class="vocab-ul">' +
                    (questions.length ? questions.map(q => '<li>' + q + '</li>').join('') : '<li>請嘗試複述今日核心對話。</li>') + '</ul>';
            } else if (toolName === 'socratic') {
                let sqList = [];
                targetLessons.forEach(l => {
                    if (l.socratic_quiz) sqList.push(l.socratic_quiz);
                });
                if (!sqList.length) sqList.push({ level: "商務策略 (Level 1)", prompt: "在跨國商務社交中，如何透過開放式問句引導對方談論業務痛點？", feedback: "透過詢問對方部門面臨的主要挑戰，能自然帶出己方專業解決方案。" });
                panel.innerHTML = '<h3 style="margin-top:0; color:#1e1b4b;">🏛 蘇格拉底啟發引導</h3>' +
                    sqList.map(q => '<div style="background:#faf5ff; border:1px solid #e9d5ff; border-radius:14px; padding:12px; margin-bottom:10px;">' +
                        '<div style="font-weight:800; color:#6b21a8;">' + q.level + '</div>' +
                        '<div style="margin:6px 0; font-weight:600;">' + q.prompt + '</div>' +
                        '<button class="quiz-toggle-btn" style="padding:4px 10px; font-size:12px;" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display===\'block\'?\'none\':\'block\')">💡 啟發解析</button>' +
                        '<div style="display:none; margin-top:8px; color:#15803d; font-weight:600;">' + q.feedback + '</div>' +
                        '</div>').join('');
            } else if (toolName === 'forecaster') {
                panel.innerHTML = '<h3 style="margin-top:0; color:#1e1b4b;">🎯 Exam Forecaster (考點預測 Top 5)</h3>' +
                    top5Data.map(t => '<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:8px;">' +
                        '<div style="display:flex; justify-content:space-between;"><span style="font-weight:800; color:#4f46e5;">' + t.rank + '</span><span style="color:#166534; font-weight:700;">' + t.prob + '</span></div>' +
                        '<div style="font-weight:700; margin:6px 0;">' + t.topic + '</div>' +
                        '<div style="font-size:14px; color:#475569;">' + t.challenge_q + '</div>' +
                        '<div style="margin-top:6px; color:#166534; font-weight:600;">' + t.challenge_ans + '</div></div>').join('');
            } else if (toolName === 'confusion') {
                let confusions = [];
                targetLessons.forEach(l => {
                    if (l.confusion_fixer) confusions.push(l.confusion_fixer);
                });
                if (!confusions.length) confusions.push({ analogy: "介系詞 to 就像接力棒，只傳給名詞或動名詞。", real_example: "I look forward to our meeting.", common_mistake: "錯誤：I look forward to meet you." });
                panel.innerHTML = '<h3 style="margin-top:0; color:#1e1b4b;">💡 盲點澄清器</h3>' +
                    confusions.map(c => '<div style="margin-bottom:12px;">' +
                        '<div style="background:#fffbeb; padding:10px; border-radius:10px; color:#92400e; font-weight:600; margin-bottom:6px;">' + c.analogy + '</div>' +
                        '<div style="background:#f0f9ff; padding:10px; border-radius:10px; color:#0369a1; font-weight:600; margin-bottom:6px;">🏢 職場實戰：<br>' + c.real_example + '</div>' +
                        '<div style="background:#fef2f2; padding:10px; border-radius:10px; color:#991b1b; font-weight:600;">⚠️ 易犯錯：<br>' + c.common_mistake + '</div></div>').join('');
            } else if (toolName === 'gap') {
                let gaps = [];
                targetLessons.forEach(l => {
                    if (l.gap_finder) gaps = gaps.concat(l.gap_finder);
                });
                if (!gaps.length) gaps = ["⚠️ 潛在缺口：在提出批評反饋時過於生硬，缺少轉折緩衝與稱讚的權衡表達。"];
                panel.innerHTML = '<h3 style="margin-top:0; color:#1e1b4b;">🔍 知識缺口診斷</h3><ul class="vocab-ul">' +
                    gaps.map(g => '<li>' + g + '</li>').join('') + '</ul>';
            } else if (toolName === 'podcast') {
                panel.innerHTML = '<div class="podcast-box">' +
                    '<h3 style="color:#fff; margin:0 0 6px 0;">🎙 Audio Study Partner (自然雙人朗讀)</h3>' +
                    '<div style="font-size:13px; color:#c7d2fe; margin-bottom:10px;">👨 Speaker A • 👩 Speaker B</div>' +
                    '<div class="podcast-controls">' +
                    '<div class="control-row" style="margin-bottom:8px;"><span>🗣️ 選擇腔調:</span>' +
                    '<select id="podcastAccent" class="accent-select">' +
                        '<option value="en-US">🇺🇸 美式英語</option>' +
                        '<option value="en-GB">🇬🇧 英式英語</option>' +
                        '<option value="en-AU">🇦🇺 澳式英語</option>' +
                        '<option value="en-IN">🇮🇳 印度英語 (Indian English)</option>' +
                    '</select></div>' +
                    '<div class="control-row"><span>⚡ 語速調節:</span>' +
                    '<input type="range" id="podcastSpeed" min="0.5" max="2.0" step="0.1" value="0.95" oninput="document.getElementById(\'spdVal\').innerText=this.value+\'x\';">' +
                    '<span id="spdVal" style="color:#86efac;">0.95x</span></div></div>' +
                    '<button id="podcastMainBtn" class="podcast-play-btn" onclick="togglePodcastPlayback()">▶️ 開始朗讀對話</button>' +
                    '</div>';
            }
        }

        let isPodcastPlaying = false;
        function togglePodcastPlayback() {
            if (!('speechSynthesis' in window)) return;
            const btn = document.getElementById('podcastMainBtn');
            if (isPodcastPlaying) {
                window.speechSynthesis.cancel();
                isPodcastPlaying = false;
                if (btn) btn.innerText = "▶ 開始朗讀對話";
            } else {
                window.speechSynthesis.cancel();
                const target = (suiteScope === 'all') ? allItems : [currentPool[currentIndex] || allItems[0]];
                let queue = [];
                target.forEach(l => {
                    if (l.main_content) {
                        l.main_content.split('\n').forEach(line => {
                            let textLine = line.trim();
                            if (textLine.startsWith('（') || textLine.startsWith('(')) return;
                            if (textLine.startsWith('A:')) queue.push({ s: 'A', t: textLine.substring(2).trim() });
                            else if (textLine.startsWith('B:')) queue.push({ s: 'B', t: textLine.substring(2).trim() });
                        });
                    }
                });
                if (!queue.length) return;

                const accentSelect = document.getElementById('podcastAccent');
                const speedSlider = document.getElementById('podcastSpeed');
                const selectedLang = accentSelect ? accentSelect.value : 'en-US';
                const speed = speedSlider ? parseFloat(speedSlider.value) : 0.95;

                const availableVoices = window.speechSynthesis.getVoices();
                let matchedVoices = availableVoices.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(selectedLang.toLowerCase()));
                if (selectedLang === 'en-IN' && matchedVoices.length === 0) {
                    matchedVoices = availableVoices.filter(v => v.lang.toLowerCase().includes('in') || v.name.toLowerCase().includes('india'));
                }

                isPodcastPlaying = true;
                if (btn) btn.innerText = "⏹️ 停止朗讀";
                let idx = 0;

                function speakNext() {
                    if (!isPodcastPlaying || idx >= queue.length) {
                        isPodcastPlaying = false;
                        if (btn) btn.innerText = "▶️ 開始朗讀對話";
                        return;
                    }
                    const item = queue[idx];
                    const u = new SpeechSynthesisUtterance(item.t);
                    u.lang = selectedLang;
                    u.rate = speed;

                    if (matchedVoices.length > 0) {
                        if (item.s === 'A') {
                            u.voice = matchedVoices[0];
                            u.pitch = 0.9;
                        } else {
                            u.voice = matchedVoices[matchedVoices.length > 1 ? 1 : 0];
                            u.pitch = 1.2;
                        }
                    } else {
                        u.pitch = (item.s === 'A') ? 0.85 : 1.25;
                    }

                    u.onend = () => { idx++; speakNext(); };
                    u.onerror = () => { isPodcastPlaying = false; };
                    window.speechSynthesis.speak(u);
                }
                speakNext();
            }
        }

        function renderExam() {
            const container = document.getElementById('examContainer');
            container.innerHTML = '';
            examData.sections.forEach(sec => {
                const secDiv = document.createElement('div');
                secDiv.innerHTML = '<h4 style="color:#4f46e5; margin:14px 0 8px 0;">' + sec.type + '</h4>';
                sec.questions.forEach(q => {
                    let optHtml = '';
                    if (q.options) {
                        optHtml = '<div style="margin:8px 0;">' + q.options.map(o => '<div style="font-size:14px; margin:4px 0;">' + o + '</div>').join('') + '</div>';
                    }
                    secDiv.innerHTML += '<div style="background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:12px; margin-bottom:10px;">' +
                        '<div style="font-weight:700;">' + q.q + '</div>' + optHtml +
                        '<button class="quiz-toggle-btn" style="padding:6px 12px; font-size:12px; margin-top:8px;" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display===\'block\'?\'none\':\'block\')">👁️ 顯示解答</button>' +
                        '<div style="display:none; margin-top:8px; padding:10px; background:#f0fdf4; border-radius:10px; color:#166534; font-weight:600;">答案：' + q.ans + '<br>解析：' + q.explanation + '</div></div>';
                });
                container.appendChild(secDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkVersionUpdate();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                };
            }
            const selector = document.getElementById('weekFilter');
            if (selector) selector.value = 'week8';
            setTab('sentence');
        });
    </script>
