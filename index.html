<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Networking English - AI Learning Suite</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #1e1b4b;
            --text-body: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            
            --amber-bg: #fffbeb;
            --amber-border: #fef3c7;
            --amber-text: #b45309;
            
            --sky-bg: #f0f9ff;
            --sky-border: #e0f2fe;
            --sky-text: #0369a1;

            --emerald-bg: #ecfdf5;
            --emerald-border: #d1fae5;
            --emerald-text: #047857;

            --violet-bg: #faf5ff;
            --violet-border: #e9d5ff;
            --violet-text: #6b21a8;

            --bubble-a-bg: #ffffff;
            --bubble-a-border: #cbd5e1;
            --bubble-a-text: #0f172a;

            --bubble-b-bg: #eef2ff;
            --bubble-b-border: #c7d2fe;
            --bubble-b-text: #1e1b4b;

            --app-max-width: 460px;
        }

        @media (min-width: 640px) {
            :root {
                --app-max-width: 680px;
            }
            body {
                padding: 24px 20px !important;
            }
            h1 {
                font-size: 28px !important;
            }
            .card {
                padding: 28px 26px !important;
                max-height: 72vh !important;
                border-radius: 28px !important;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg);
            margin: 0; padding: 16px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }

        .app-layout {
            width: 100%;
            max-width: var(--app-max-width);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin: 0 auto;
        }

        #updateNotice {
            display: none; width: 100%;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff; padding: 10px 16px; border-radius: 14px;
            margin-bottom: 10px; box-sizing: border-box; font-size: 14px; font-weight: 700;
            text-align: center; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            cursor: pointer;
        }
        
        .header { width: 100%; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 25px; font-weight: 800; color: var(--text-title); margin: 4px 0 2px 0; letter-spacing: -0.5px; }
        
        .author-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            background-color: var(--primary-soft);
            padding: 3px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .main-mode-nav {
            display: flex; gap: 6px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; margin-bottom: 10px;
        }
        .main-mode-btn {
            flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 800; border: none; border-radius: 12px;
            background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.2s ease;
        }
        .main-mode-btn.active {
            background: #ffffff; color: var(--primary); box-shadow: 0 3px 10px rgba(79, 70, 229, 0.15);
        }

        .pen-toolbar {
            display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap;
        }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 12px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted);
            display: flex; align-items: center; gap: 4px; cursor: pointer; transition: all 0.2s ease;
        }
        .tool-btn.active-pen {
            background-color: #ffe4e6; border-color: #e11d48; color: #e11d48;
            box-shadow: 0 2px 8px rgba(225, 29, 72, 0.25);
        }
        .tool-btn.lang-btn {
            background-color: #f0fdf4; border-color: #86efac; color: #166534;
        }
        .tool-btn:active { transform: scale(0.96); }

        .filters { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        select {
            width: 100%; box-sizing: border-box; padding: 13px 16px; font-size: 16px; font-weight: 700;
            border-radius: 16px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none; box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        
        .tab-group { width: 100%; box-sizing: border-box; display: flex; gap: 8px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 11px 6px; font-size: 15px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-btn.active {
            background: #ffffff; color: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
        }

        .card-container {
            width: 100%; flex: 1; display: flex; flex-direction: column; position: relative;
        }
        .card {
            background-color: var(--card-bg); border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
            position: relative;
        }

        #drawCanvas {
            position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100;
        }
        .card.canvas-active #drawCanvas {
            pointer-events: auto; touch-action: none;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .badge.media-badge { background-color: #fef3c7; color: #92400e; }
        .badge.task-badge { background-color: #dcfce7; color: #166534; }
        .date-badge { font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
        .counter { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        
        .title { font-size: 21px; font-weight: 800; color: var(--text-title); margin-bottom: 14px; line-height: 1.35; }
        .block-section { margin-bottom: 18px; text-align: left; }
        
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 12.5px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
        .tag-violet { background-color: var(--violet-bg); color: var(--violet-text); border: 1px solid var(--violet-border); }

        .block-desc { font-size: 15.5px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }

        /* A/B 對話氣泡排版 */
        .dialogue-container { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .chat-bubble-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
        .chat-bubble-row.speaker-b { flex-direction: row-reverse; }
        .speaker-avatar {
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; color: #ffffff; flex-shrink: 0;
            margin-top: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .speaker-avatar.avatar-a { background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%); }
        .speaker-avatar.avatar-b { background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 100%); }

        .chat-bubble-content {
            max-width: 82%; padding: 11px 15px; border-radius: 16px;
            font-size: 15.5px; line-height: 1.5; font-weight: 600;
        }
        .speaker-a .chat-bubble-content {
            background-color: var(--bubble-a-bg); color: var(--bubble-a-text);
            border: 1.5px solid var(--bubble-a-border); border-top-left-radius: 4px;
        }
        .speaker-b .chat-bubble-content {
            background-color: var(--bubble-b-bg); color: var(--bubble-b-text);
            border: 1.5px solid var(--bubble-b-border); border-top-right-radius: 4px;
        }

        .vocab-ul { margin: 0; padding-left: 20px; font-size: 15px; color: var(--text-body); line-height: 1.7; }
        .vocab-ul li { margin-bottom: 10px; line-height: 1.6; }

        /* 純深藍色重點字高亮（無外框無底色） */
        .highlight-term {
            color: #3730a3 !important;
            font-weight: 800 !important;
            background: none !important;
            border: none !important;
            padding: 0 !important;
            display: inline !important;
        }
        .ipa-tag {
            color: #6d28d9;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 14px;
            font-weight: 700;
            margin: 0 2px;
        }

        .quiz-card {
            background-color: var(--violet-bg); border: 1.5px solid var(--violet-border);
            border-radius: 18px; padding: 16px; margin-bottom: 12px;
        }
        .quiz-q { font-size: 15.5px; font-weight: 700; color: #4c1d95; line-height: 1.6; margin-bottom: 10px; }
        .blank-line { display: inline-block; min-width: 80px; border-bottom: 2.5px solid #7c3aed; margin: 0 4px; }

        .quiz-toggle-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff; border: none; padding: 7px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer;
        }
        .quiz-ans-wrapper { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d8b4fe; }
        .quiz-ans-box {
            background: #ffffff; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #bbf7d0;
            font-size: 15px; color: #14532d; line-height: 1.65; white-space: pre-line; font-weight: 600;
        }

        .exam-q-card {
            background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 16px;
            padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .exam-ans-box {
            display: none; margin-top: 10px; padding: 12px 14px; background: #f0fdf4;
            border: 1.5px solid #86efac; border-radius: 12px; font-size: 14.5px;
            color: #166534; line-height: 1.6; white-space: pre-line; font-weight: 600;
        }

        .task-box {
            background-color: var(--violet-bg); border: 1.5px solid var(--violet-border);
            border-radius: 16px; padding: 16px; font-size: 15px; line-height: 1.6; color: #4c1d95; font-weight: 600;
        }
        .link-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-color); text-align: left; }
        .link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
            padding: 13px 18px; font-size: 15px; color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            text-decoration: none; font-weight: 700; border-radius: 14px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        /* 8 大模式 UI */
        .suite-scope-nav {
            display: flex; gap: 6px; background-color: #f1f5f9; padding: 4px; border-radius: 14px; margin-bottom: 10px;
        }
        .suite-scope-btn {
            flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 800; border: none; border-radius: 10px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .suite-scope-btn.active {
            background: #ffffff; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .suite-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;
        }
        .suite-btn {
            background: #ffffff; border: 1.5px solid #cbd5e1; padding: 10px 8px; border-radius: 14px;
            font-size: 13px; font-weight: 800; color: #334155; cursor: pointer; text-align: left;
            display: flex; align-items: center; gap: 6px; transition: all 0.2s ease;
        }
        .suite-btn.active {
            background: #eef2ff; border-color: #6366f1; color: #4338ca;
        }
        .suite-panel {
            background: #ffffff; border: 1.5px solid var(--border-color); border-radius: 20px;
            padding: 18px; margin-top: 8px;
        }
        .suite-panel h3 { margin: 0 0 10px 0; font-size: 17px; color: #1e1b4b; }

        /* Podcast 面板 (含男女雙聲道指示與腔調選單) */
        .podcast-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #ffffff; padding: 20px 16px; border-radius: 20px; text-align: center;
        }
        .podcast-speaker-badge {
            display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px;
            background: rgba(255, 255, 255, 0.15); padding: 5px 14px; border-radius: 14px; margin-bottom: 12px;
        }
        .podcast-controls {
            display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 12px 0;
            background: rgba(0, 0, 0, 0.25); padding: 14px; border-radius: 16px;
        }
        .control-row {
            display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 340px;
            font-size: 13.5px; font-weight: 700; color: #c7d2fe;
        }
        .accent-select {
            background: #ffffff; color: #1e1b4b; font-weight: 800; padding: 6px 10px;
            border-radius: 10px; border: none; outline: none; font-size: 13px; cursor: pointer;
        }
        .speed-slider {
            flex: 1; margin: 0 10px; accent-color: #10b981; cursor: pointer;
        }
        .podcast-play-btn {
            background: #10b981; color: #fff; border: none; padding: 13px 26px; border-radius: 24px;
            font-size: 15.5px; font-weight: 800; cursor: pointer; margin-top: 8px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4); transition: all 0.2s ease;
        }
        .podcast-play-btn.playing {
            background: #ef4444 !important; box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4) !important;
        }

        .teach-input {
            width: 100%; box-sizing: border-box; min-height: 90px; padding: 12px; font-size: 15px;
            border-radius: 12px; border: 1.5px solid #cbd5e1; margin-top: 8px; font-family: inherit;
        }

        .nav-controls { width: 100%; display: flex; gap: 12px; margin-top: 12px; margin-bottom: 10px; }
        .nav-btn {
            flex: 1; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer;
        }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; }
    </style>
</head>
<body>

    <div class="app-layout">
        <div id="updateNotice" onclick="forceReloadApp()">
            ✨ 發現最新教材版本，點此立即更新！
        </div>

        <div class="header">
            <h1>Networking English</h1>
            <!-- 版本更新為 V1.2 -->
            <div class="author-badge">By Ryan Liu, V1.2</div>
            
            <div class="main-mode-nav">
                <button class="main-mode-btn active" onclick="switchAppMode('cards', this)">📚 學習卡片</button>
                <button class="main-mode-btn" onclick="switchAppMode('suite', this)">⚡ 8大學習模組</button>
                <button class="main-mode-btn" onclick="switchAppMode('exam', this)">📝 全真模擬考</button>
            </div>

            <div class="pen-toolbar">
                <button id="langToggleBtn" class="tool-btn lang-btn" onclick="toggleLanguage()">
                    <span id="langBtnText">🌐 English</span>
                </button>
                <button id="penBtn" class="tool-btn" onclick="togglePenMode()">
                    <span id="penBtnText">🖍️ 細畫筆</span>
                </button>
                <button class="tool-btn" onclick="undoLastStroke()">
                    <span id="undoBtnText">↩️ 復原</span>
                </button>
                <button class="tool-btn" onclick="clearAllCanvas()">
                    <span id="clearBtnText">🗑️ 全清</span>
                </button>
            </div>
        </div>

        <!-- 視圖 1: 學習卡片模式 -->
        <div id="viewCards">
            <div class="filters">
                <select id="weekFilter" onchange="applyFilters()"></select>
                <div class="tab-group">
                    <button id="tabSentence" class="tab-btn active" onclick="setTab('sentence', this)">句型 / 文法</button>
                    <button id="tabMedia" class="tab-btn" onclick="setTab('media', this)">影音 / 自習</button>
                </div>
            </div>

            <div class="card-container">
                <div class="card" id="cardElement">
                    <canvas id="drawCanvas"></canvas>

                    <div>
                        <div class="card-header">
                            <div>
                                <span class="badge" id="categoryBadge">分類</span>
                                <span class="date-badge" id="dateDisplay"></span>
                            </div>
                            <span class="counter" id="counterDisplay">0 / 0</span>
                        </div>
                        <div class="title" id="titleDisplay">標題</div>

                        <div class="block-section" id="takeawaysSection">
                            <div class="tag-title tag-amber" id="tagTakeaways">💡 核心重點說明</div>
                            <div class="block-desc" id="takeawaysDisplay"></div>
                        </div>

                        <div class="block-section" id="mainContentSection">
                            <div class="tag-title tag-sky" id="tagMainContent">📖 整理後學習內容與核心句型</div>
                            <div id="mainContentContainer"></div>
                        </div>

                        <div class="block-section" id="quizSection">
                            <div class="tag-title tag-violet" id="tagQuiz">✍️ 實戰練習與自我檢測</div>
                            <div id="quizContainer"></div>
                        </div>

                        <div class="block-section" id="vocabSection">
                            <div class="tag-title tag-emerald" id="tagVocab">📝 重點單字與注意事項</div>
                            <ul class="vocab-ul" id="vocabDisplay"></ul>
                        </div>

                        <div class="block-section" id="taskSection">
                            <div class="tag-title tag-violet" id="tagTask">🎯 下週課堂延續示範任務</div>
                            <div id="taskContainer" class="task-box"></div>
                        </div>
                    </div>

                    <div class="link-box" id="linkSection">
                        <a class="link-btn" id="linkDisplay" href="#" target="_blank">🔗 開啟延伸閱讀與學習資源</a>
                    </div>
                </div>
            </div>

            <div class="nav-controls">
                <button id="btnPrev" class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
                <button id="btnNext" class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
            </div>
        </div>

        <!-- 視圖 2: 8 大特訓模組 -->
        <div id="viewSuite" style="display: none;">
            <div class="suite-scope-nav">
                <button id="scopeCurrentBtn" class="suite-scope-btn active" onclick="setSuiteScope('current', this)">📌 當前選定週次</button>
                <button id="scopeAllBtn" class="suite-scope-btn" onclick="setSuiteScope('all', this)">🌐 全部課程大整合</button>
            </div>

            <div class="suite-grid">
                <button class="suite-btn active" onclick="loadSuiteTool('guide', this)">📖 速成指南</button>
                <button class="suite-btn" onclick="loadSuiteTool('socratic', this)">🏛️ 蘇格拉底問答</button>
                <button class="suite-btn" onclick="loadSuiteTool('forecaster', this)">🎯 考點預測 Top5</button>
                <button class="suite-btn" onclick="loadSuiteTool('confusion', this)">💡 盲點澄清器</button>
                <button class="suite-btn" onclick="loadSuiteTool('gap', this)">🔍 知識缺口診斷</button>
                <button class="suite-btn" onclick="loadSuiteTool('podcast', this)">🎙️ Audio Podcast</button>
                <button class="suite-btn" onclick="loadSuiteTool('teachback', this)">🧑‍🏫 費曼自述檢測</button>
                <button class="suite-btn" onclick="loadSuiteTool('generator', this)">⚡ 模擬考題萃取</button>
            </div>

            <div class="suite-panel" id="suiteContentPanel">
                <!-- 動態注入內容 -->
            </div>
        </div>

        <!-- 視圖 3: 全真模擬考卷 -->
        <div id="viewExam" style="display: none;">
            <div class="card" style="max-height: 75vh;">
                <h2 style="font-size: 20px; color: #1e1b4b; margin-top:0;">📝 Networking English 全真模擬檢測試卷</h2>
                <div style="font-size: 13px; color: #64748b; margin-bottom: 14px;">⏱️ 建議作答時間：20 分鐘 | 每題皆可獨立查看詳解</div>
                
                <div id="examContainer"></div>
            </div>
        </div>

    </div>

    <script>
        const LOCAL_APP_VERSION = "2026-09-02 12:43:34";
        const rawDatabase = [{"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "社交問候 (Greetings)", "category_en": "Greetings & Small Talk", "title": "打招呼與近況寒暄 (Greetings & Responses)", "title_en": "Greetings & Daily Catch-ups", "key_takeaways": "1. 熟人與同事間的自然問候：優先使用 Hey there! 或 How’s it going?。\n2. 描述近況平淡無波折時：避免只說 I'm fine，使用 Same old, same old 或 The usual 更在地自然。", "key_takeaways_en": "1. Natural casual greetings: Use Hey there! or How’s it going? among coworkers.\n2. Neutral responses: Instead of just saying I’m fine, use Same old, same old or The usual for natural daily updates.", "main_content": "A: Hey there! How’s it going?\nB: Same old, same old! Pretty much the same.\nA: How are things with you?\nB: Can't complain, things have been pretty uneventful.", "vocab_notes": ["Same old, same old [sem old, sem old (idiom)：老樣子、一切照舊。\n  例句：How’s business these days? — Oh, *same old, same old*. We’re keeping busy.", "Uneventful [ˌʌnɪˈvɛntfəl (adj.)：平靜無事的、沒有重大事故發生的。\n  例句：The overnight plant operation was smooth and completely *uneventful*.", "How have you been? (phrase)：你最近好嗎？（現在完成式，詢問上次見面以來的近況）。\n  例句：It’s great to see you again in Kaohsiung! *How have you been*?", "Can't complain (idiom)：挺好的、沒什麼好挑剔的。\n  例句：How’s the new safety system working out? — *Can't complain*, it’s very reliable.", "Pretty much the same (phrase)：幾乎跟平常一模一樣。\n  例句：How are things in your department? — *Pretty much the same* as last month."], "vocab_notes_en": ["Same old, same old: Common idiom indicating that life or work is going on as usual.\n  Example: How’s business these days? — Oh, *same old, same old*.", "Uneventful [ˌʌnɪˈvɛntfəl: Adjective meaning quiet with no unexpected or disruptive events.\n  Example: The overnight plant operation was completely *uneventful*.", "How have you been?: Present perfect tense used to ask about someone's life since last meeting.\n  Example: Great to see you again! *How have you been*?", "Can't complain: Casual phrase meaning things are going well.\n  Example: How’s the new project? — *Can't complain*, running smoothly.", "Pretty much the same: Standard polite response indicating routine.\n  Example: Things are *pretty much the same* as usual."], "practice_quiz": [{"question": "【填空題】同事問你 How’s work going?，你想回答「老樣子，一切照舊」：\n_________ , _________ ! Pretty much the same.", "question_en": "Fill-in-the-blank: When asked How’s work going?, reply that everything is as usual:\n_________ , _________ ! Pretty much the same.", "answer": "✔ 填空解答：Same old, same old\n👉 整句回答：Same old, same old! Pretty much the same.\n💡 解析：Same old, same old 是最道地的口語說法，用來表達一切如常。", "answer_en": "✔ Answer: Same old, same old\n👉 Full Sentence: Same old, same old! Pretty much the same.\n💡 Explanation: Standard conversational reply indicating routine and normalcy."}], "instant_guide": {"core_concepts": ["1. 破冰開場語意強度階梯（Formal -> Casual）。", "2. 中性回答（Neutral Responses）的語境運用。", "3. 藉由現在完成式 (How have you been?) 延續對話動能。"], "misconceptions": ["誤解 1：以為每次都要回覆 I'm fine, thank you, and you?（過於生硬機械化）。", "誤解 2：以為 Same old 帶有負面抱怨意涵（其實是非常健康的日常中性表達）。"], "exam_questions": ["Q1: 當外國客戶在走廊問你 How are things?，請給出 2 種比 I am fine 更自然的商務中性回覆。", "Q2: 請說明 How do you do? 與 How have you been? 在使用時機與時態上的根本差異。"]}, "socratic_quiz": [{"level": "基礎題 (Level 1)", "prompt": "如果對方問你 How's it going?，你可以回答 I'm fine 嗎？為什麼母語人士很少這樣說？", "feedback": "可以，但在語感上偏向制式教科書用語。母語人士更常使用 Good, how are you?、Can't complain 或 Same old, same old 來建立平易近人的連結。"}], "confusion_fixer": {"analogy": "【生活類比】：問候就像打羽球發球。I'm fine 像是把球直接打在網上停住；而 Same old, how about you? 則是把球順暢地拍回對方場地。", "real_example": "在走廊遇到同事：Hey Ryan, how are things? ➔ Can't complain, just wrapping up the weekly safety audit. How are things on your side?", "common_mistake": "錯誤：How do you do? 用於熟人寒暄（✖ 錯誤，這只用於非常正式的初次見面握手）。"}, "gap_finder": ["⚠️ 潛在缺口 1：忽略了問候時的聲調（語調上揚表達熱情，平調表達平淡）。", "⚠️ 潛在缺口 2：缺少主動拋出第二個問題（Bounce-back question）的習慣。"], "teach_back": {"prompt": "請試著用你自己的話，向剛進公司的外籍同仁解釋什麼時候該用 Same old, same old，以及它的適用場合。", "keywords": ["照舊", "日常", "中性", "平穩", "usual", "routine"]}, "link": "https://www.linkedin.com/pulse/18-ways-say-hello-english-thomas-spengler/", "link_text": "18 Ways to Say Hello in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "道別用語 (Goodbyes)", "category_en": "Goodbyes & Core Grammar", "title": "道別與重要文法規則 (Ways to Say Goodbye & Grammar)", "title_en": "Ways to Say Goodbye & Grammar Rule", "key_takeaways": "Pro Tip 文法核心：Look forward to 中的 to 是介系詞，後面必須接動名詞 (V-ing) 或名詞，絕不可接原形動詞！\n✔ 正確：I look forward to seeing you in Kaohsiung.\n✖ 錯誤：I look forward to see you.", "key_takeaways_en": "Grammar Core: The to in look forward to is a preposition, so it MUST be followed by a gerund (V-ing) or a noun!\n✔ Correct: I look forward to seeing you in Kaohsiung.\n✖ Incorrect: I look forward to see you.", "main_content": "A: I’ve got to get going! I look forward to our next meeting.\nB: Take it easy! Have a good one!\nA: It was a pleasure to see you.\nB: I look forward to seeing you soon in Kaohsiung.", "vocab_notes": ["I've got to [aɪv ɡɑt tu (phr.)：我必須...（口語常縮讀為 I gotta）。\n  例句：*I’ve got to* get going now before the evening traffic starts.", "Have a good one (phr.)：祝你有美好的一天/週末（美式常用祝福）。\n  例句：Thanks for the discussion, Ryan. *Have a good one*!", "Take it easy (idiom)：保重、放輕鬆（非正式道別語）。\n  例句：*Take it easy* this weekend, you’ve been working really hard.", "Look forward to + V-ing [lʊk ˈfɔrwərd tu (phr.)：期待相會（商務書信核心介系詞片語）。\n  例句：I *look forward to collaborating* with your team on the upcoming audit."], "vocab_notes_en": ["I've got to: Equivalent to I have to, often contracted to I gotta in spoken English.\n  Example: *I’ve got to* get going now to catch my train.", "Have a good one: Common American farewell greeting where one stands for day or weekend.\n  Example: *Have a good one*! See you Monday.", "Take it easy: Friendly way to say goodbye and advise someone to rest.\n  Example: *Take it easy* and enjoy your vacation.", "Look forward to + V-ing: Formal phrase used in business correspondence to anticipate future meetings.\n  Example: I *look forward to meeting* with your executive board."], "practice_quiz": [{"question": "【文法填空題】請填入 see 的正確動詞形式：\nI look forward to _________ you at the conference next month.", "question_en": "Grammar Quiz: Fill in the correct form of the verb see:\nI look forward to _________ you at the conference next month.", "answer": "✔ 填空解答：seeing (V-ing)\n👉 整句回答：I look forward to seeing you at the conference next month.\n💡 解析：Look forward to 的 to 是介系詞，後面必須搭配動名詞 V-ing！", "answer_en": "✔ Answer: seeing (V-ing)\n👉 Full Sentence: I look forward to seeing you at the conference next month.\n💡 Explanation: To is a preposition here, requiring a gerund (V-ing)."}], "instant_guide": {"core_concepts": ["1. Look forward to + V-ing 的介系詞本質。", "2. 初次見面（meeting）與再次見面（seeing）的道別動詞區分。", "3. 職場非正式道別（I've got to get going）的得體性。"], "misconceptions": ["誤解 1：看到 to 就直覺接原形動詞（✖ 錯誤：I look forward to hear from you）。", "誤解 2：在非初次見面時說 Nice to meet you（再次見面應為 Good to see you）。"], "exam_questions": ["Q1: 請挑出錯誤並改正：We look forward to discuss the project with your team.", "Q2: 在週五下班前，美籍顧問向你說 Have a good one!，這句話的 one 指的是什麼？"]}, "socratic_quiz": [{"level": "文法陷阱題 (Level 1)", "prompt": "為什麼 I am looking forward to see you 在文法審查中會被判定為嚴重錯誤？", "feedback": "因為此處的 to 不是不定詞符號，而是表示方向與對象的介系詞（Preposition），介系詞後方必須接動名詞 (Gerund) 或名詞。"}], "confusion_fixer": {"analogy": "【生活類比】：to 就像一個收納箱，有些箱子只裝原形動詞（不定詞），有些箱子只裝名詞與動名詞（介系詞）。Look forward to 屬於後者！", "real_example": "信件結尾：I look forward to collaborating with your EHS team in Kaohsiung.", "common_mistake": "錯誤：I look forward to receive your feedback."}, "gap_finder": ["⚠️ 潛在缺口：在書信與口語中混淆 Nice meeting you（初見面結尾）與 Nice seeing you（熟人結尾）。"], "teach_back": {"prompt": "請說明為什麼 Look forward to 後面一定要接 V-ing，並造出一個正確的商務例句。", "keywords": ["介系詞", "動名詞", "V-ing", "preposition", "meeting", "seeing"]}, "link": "https://www.berlitz.com/blog/goodbye-english", "link_text": "81 Ways to Say Goodbye in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "展會社交 (Trade Fair)", "category_en": "Conference Small Talk", "title": "展會破冰與邀約 (Small Talk At a Conference)", "title_en": "Conference Ice-breaking & Happy Hour", "key_takeaways": "展會社交四部曲心法：\n1. 詢問抵達與交通 ➔ 2. 詢問住宿評價與距離 ➔ 3. 交流攤位心得 ➔ 4. 提出社交邀約 (Happy Hour)。", "key_takeaways_en": "Conference Networking 4-Step Formula:\n1. Ask arrival details ➔ 2. Check hotel quality & distance ➔ 3. Discuss exhibitor stands ➔ 4. Propose Happy Hour invitation.", "main_content": "A: When did you arrive?\nB: I flew here yesterday. And you?\nA: I got here 2 days ago. Where are you staying?\nB: At the Mason Park Hotel。\nA: That’s where I am! Do you like the hotel?\nB: It’s okay. The room is small, but comfortable, and it’s a 5-minute walk to the venue。\nA: What do you think of the trade fair?\nB: I like some of the exhibitor’s stands, and I plan to join the happy hour tomorrow at 5pm. Would you like to come?\nA: Why not? Count me in!", "vocab_notes": ["Exhibitor [ɪɡˈzɪbɪtɚ (n.)：參展商、展覽單位。\n  例句：Many international *exhibitors* showcased chemical safety equipment this year.", "Within walking distance (phr.)：步行即可達到的距離。\n  例句：Our hotel is conveniently located *within walking distance* of the venue.", "Count me in! (idiom)：算我一份、我也要參加。\n  例句：Are you guys going to the technical seminar? — Yes, *count me in*!", "Happy hour [ˈhæpi aʊr (n.)：歡聚暢飲時段、展會後社交酒會。\n  例句：Let’s join the *happy hour* at 5:30 PM to network with peers."], "vocab_notes_en": ["Exhibitor [ɪɡˈzɪbɪtɚ: Person or company that displays items at an exhibition.\n  Example: Several *exhibitors* presented automated safety sensors.", "Within walking distance: Close enough to walk to conveniently.\n  Example: The station is *within walking distance* of the plant.", "Count me in!: Casual phrase meaning include me in the activity.\n  Example: Who wants to join the dinner? — *Count me in*!", "Happy hour: Social gathering with discounted drinks after conference sessions.\n  Example: *Happy hour* starts right after the keynote address."], "practice_quiz": [{"question": "【填空題】對方邀請你參加展後聚會，你想表達「算我一份！」，請填入片語：\nWhy not? _________ me _________ !", "question_en": "Fill-in-the-blank: Accept an invitation enthusiastically (include me!):\nWhy not? _________ me _________ !", "answer": "✔ 填空解答：Count, in\n👉 整句回答：Why not? Count me in!\n💡 解析：Count me in! 是表示「我也要加入/算我一份」的高頻口語。", "answer_en": "✔ Answer: Count, in\n👉 Full Sentence: Why not? Count me in!\n💡 Explanation: Casual way to say you definitely want to join."}], "link": "", "link_text": ""}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "職場英語 (Workplace)", "category_en": "Workplace Communication", "title": "職場核心表達與行程衝突 (Useful Workplace Phrases)", "title_en": "Workplace Skills & Scheduling Conflicts", "key_takeaways": "職場商務溝通核心：精準表達職能特長、跨部門人際相處，以及面對會議撞期時的專業應對。", "key_takeaways_en": "Core Workplace Communication: Articulate skills clearly, build rapport with colleagues, and handle double-booked meetings professionally.", "main_content": "A: This job is an ideal match for my skills and experience.\nB: I get on with people easily and enjoy teamwork.\nA: I’ve got two meetings scheduled at the same time. I'm double-booked!\nB: That’s a tough scheduling conflict! The final decision is in the hands of the manager.", "vocab_notes": ["Ideal match [aɪˈdiəl mætʃ (n. phr.)：理想人選、完美契合。\n  例句：His extensive safety audit experience makes him an *ideal match* for this leadership role.", "Double-booked [ˈdʌbl bʊkt (adj.)：同一時間被重複安排了兩項行程（衝堂）。\n  例句：I’m *double-booked* at 2 PM, so I need to delegate one of the meetings.", "Scheduling conflict [ˈskɛdʒʊlɪŋ ˈkɑnflɪkt (n.)：時間衝突。\n  例句：Due to a *scheduling conflict*, the plant manager will attend remotely.", "In the hands of (phr.)：掌握在...手中、由...作決策。\n  例句：The final approval of the CAPEX budget is *in the hands of* the board."], "vocab_notes_en": ["Ideal match: A perfect fit for a job position or project role.\n  Example: She is an *ideal match* for our environmental compliance team.", "Double-booked: Having two commitments scheduled at the same time.\n  Example: I am *double-booked* on Thursday morning.", "Scheduling conflict: When two planned events clash in timetable.\n  Example: I apologize for the *scheduling conflict*; let's reschedule.", "In the hands of: Controlled by or dependent on someone's decision.\n  Example: The decision is *in the hands of* executive management."], "practice_quiz": [{"question": "【填空題】當你同一時間被排了兩場會議（撞期），請填入複合形容詞：\nI’m afraid I’m _________ at 3:00 PM.", "question_en": "Fill-in-the-blank: State that you have two meetings scheduled simultaneously:\nI’m afraid I’m _________ at 3:00 PM.", "answer": "✔ 填空解答：double-booked\n👉 整句回答：I’m afraid I’m double-booked at 3:00 PM.\n💡 解析：Double-booked 表示同一時段重複預約/行程衝堂。", "answer_en": "✔ Answer: double-booked\n👉 Full Sentence: I’m afraid I’m double-booked at 3:00 PM.\n💡 Explanation: Indicates a time conflict due to two overlapping meetings."}], "link": "https://www.bbc.co.uk/learningenglish/features/english-at-work/english-at-work-intro", "link_text": "BBC English at Work 介紹頁面"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "影音自習 (Video Study)", "category_en": "Video Self-Study", "title": "商務社交情境：巴黎會面 (Business Partner A2 5.4.1)", "title_en": "Business Socializing in Paris (BP A2 5.4.1)", "key_takeaways": "【詳細劇情情境摘要】\nJulia 抵達巴黎參加商務研討會，與合作夥伴 Maria 和 Max 會面。對話圍繞著抵達的交通方式、入住飯店品質展開。Max 提及雖然飯店房間不大，但勝在舒適且離展場步行僅需幾分鐘。最後三人順勢敲定當晚的晚餐邀約。\n\n【學習核心與聽力檢測】\n1. 掌握抵達時間與交通問答（When did you arrive? / I flew here yesterday）。\n2. 描述住宿品質與優缺點（small but comfortable, 5-minute walk to the venue）。\n3. 觀察非語言肢體語言（Body Language：翻白眼、撇嘴與眨眼）。", "key_takeaways_en": "Summary: Julia arrives in Paris for a conference and meets partners Maria and Max. They discuss travel routes and hotel comfort before planning a joint dinner.\n\nKey Focus: Inquire travel arrivals, describe hotel pros/cons, and identify non-verbal body language cues.", "main_content": "A: When did you arrive in Paris?\nB: I flew in yesterday afternoon. Traffic from the airport was heavy.\nA: How is the hotel you are staying at?\nB: The room is small, but comfortable, and it is a 5-minute walk to the exhibition venue.\nA: Do you have plans for dinner tonight?\nB: Would you like to join us for French bistro dishes? Count me in!", "vocab_notes": ["Exhibition venue [ˌɛksəˈbɪʃən ˈvɛnju (n.)：展覽會場、大會場地。\n  例句：The *exhibition venue* is equipped with advanced safety presentation rooms.", "Fly in / Fly here (v. phr.)：搭機抵達（商務差旅高頻動詞）。\n  例句：Our technical consultants *flew in* from Singapore this morning.", "Roll one's eyes [rol wʌnz aɪz (idiom)：翻白眼（表達無奈或受不了）。\n  例句：He *rolled his eyes* when the keynote speech ran 30 minutes over schedule.", "Make a face (idiom)：做鬼臉、撇嘴（表達嫌棄或不滿意）。\n  例句：She *made a face* when tasting the overpriced conference coffee.", "Wink [wɪŋk (v./n.)：眨眼示意（幽默玩笑或默契暗示）。\n  例句：Max gave a quick *wink* to signal that the dinner reservation was confirmed.", "Bistro [ˈbiːstroʊ (n.)：法式小餐館、休閒小酒館。\n  例句：Let’s book a table at a cozy *bistro* near the hotel."], "vocab_notes_en": ["Exhibition venue [ˌɛksəˈbɪʃən ˈvɛnju: The designated conference center or exhibition hall.\n  Example: The *venue* is just a short walk from the subway.", "Fly in / Fly here: Arrive by airplane for a business trip.\n  Example: The audit team *flew in* yesterday.", "Roll one's eyes: Move eyes upward to show frustration or disbelief.\n  Example: She *rolled his eyes* at the long delay.", "Make a face: Make a facial expression showing annoyance or dislike.\n  Example: He *made a face* when reading the report.", "Wink [wɪŋk: Close and open one eye quickly as a signal of shared humor.\n  Example: He gave a *wink* to confirm the agreement.", "Bistro [ˈbiːstroʊ: A small, informal restaurant serving classic cuisine.\n  Example: We had a pleasant dinner at a local *bistro*."], "next_week_tasks": ["💡 課堂示範預告：老師下週會隨機請同學模擬巴黎會面情境（扮演 Julia, Maria 或 Max），請準備好 30 秒抵達交通與飯店評價對話。"], "next_week_tasks_en": ["💡 In-Class Role-play: Practice a 30-second dialog about travel arrival and hotel review as Julia, Maria, or Max."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U5L4_5.4.1.mp4", "link_text": "觀看 Business Partner 5.4.1 影片 (MP4)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "聽力自習 (Audio Study)", "category_en": "Listening Self-Study", "title": "展館心得與產品發表聽力 (BP A2 Workbook 5.5)", "title_en": "Venue Reviews & Product Launch (BP 5.5)", "key_takeaways": "【詳細對話摘要】\nAmy 與 Marta 在展會現場交流彼此抵達展場的日期與參觀心得。Amy 分享了對展覽中心硬體設施的正面評價，並預告隔天自家公司將舉辦新產品發表會；隨後 Victor 加入討論，三人針對『資源回收 (Recycling)』專題演講交流意見，並客觀比較今年會議飯店在房間空間、交通距離與餐飲品質上的優缺點。\n\n【聽力核心檢測任務】\n1. Amy 和 Marta 是否同一天抵達？（注意聽辨時間差）\n2. Marta 是否會參加隔天 Amy 公司舉辦的新產品發表會？\n3. Victor 與 Amy 對於今年飯店大小與食物水準的看法是否一致？", "key_takeaways_en": "Summary: Amy and Marta exchange thoughts on venue facilities and upcoming product launches, joined by Victor to discuss presentations on recycling and hotel comfort.", "main_content": "A: The facilities at this new convention center are state-of-the-art.\nB: Our company is hosting a product launch presentation tomorrow at 10 AM.\nA: Have you attended the keynote presentation on recycling and circular economy?\nB: Yes, the speaker brought up innovative waste reduction strategies.", "vocab_notes": ["State-of-the-art [stet əv ði ɑrt (adj.)：最先進的、頂級設備的。\n  例句：Our laboratory is equipped with *state-of-the-art* gas chromatography devices.", "Product launch [ˈprɑdʌkt lɔntʃ (n.)：新產品發表會。\n  例句：The *product launch* attracted over 500 chemical industry professionals.", "Keynote presentation [ˈkiˌnoʊt ˌprɛznˈteɪʃən (n.)：大會主旨演講。\n  例句：The *keynote presentation* focused on ESG disclosure and carbon neutrality.", "Circular economy [ˈsɜrkjələr ɪˈkɑnəmi (n.)：循環經濟。\n  例句：Adopting *circular economy* models helps reduce petrochemical waste significantly.", "Level of comfort [ˈlɛvəl əv ˈkʌmfɚt (n. phr.)：舒適度水準。\n  例句：The overall *level of comfort* in the guest rooms exceeded our expectations."], "vocab_notes_en": ["State-of-the-art: Incorporating the newest ideas and the most up-to-date features.\n  Example: The plant features a *state-of-the-art* safety monitoring system.", "Product launch: An official event to introduce a new product to the market.\n  Example: Our annual *product launch* is scheduled for next quarter.", "Keynote presentation: The primary address opening an academic or business conference.\n  Example: The *keynote presentation* covered process safety innovations.", "Circular economy: An economic framework aimed at eliminating waste through recycling.\n  Example: *Circular economy* practices are essential for sustainability.", "Level of comfort: The degree of physical comfort provided by facilities.\n  Example: The hotel provides a high *level of comfort* for business travelers."], "next_week_tasks": ["💡 課堂延續練習：下週上課將核對 3 項聽力題目的細部答案，請先標記出 Amy 和 Marta 抵達日期的時間差距。"], "next_week_tasks_en": ["💡 Listening Task: Check the arrival date difference between Amy and Marta before class."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/BP_A2_WB_5_05.mp3", "link_text": "收聽 BP A2 5.5 練習音檔 (MP3)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "課後自習 (Self-Study)", "category_en": "Self-Study Task", "title": "拒絕制式回答：替代 'I’m fine, thank you' (Papa Teach Me)", "title_en": "Beyond I'm Fine, Thank You (Papa Teach Me)", "key_takeaways": "【影片核心內容摘要】\n深入探討母語人士在日常社交中如何依據真實心境提供靈活、道地的回覆，徹底擺脫死板的 I'm fine, thank you；同時傳授如何敏銳觀察對方面色並給予合適的關懷問候。\n\n【自習任務清單】\n✔ 任務 1：掌握至少 15 種回答 How are you? 的替換說法。\n✔ 任務 2：當對方看起來氣色不佳、生病或心情低落時，熟記 5 種關心問句。", "key_takeaways_en": "Summary: Learn authentic ways native speakers reply to How are you? based on mood, moving beyond robotic textbook answers.", "main_content": "A: How are you doing today?\nB: Never better! Couldn't be better!\nA: Are you feeling alright? You look a bit under the weather.\nB: I'm a bit tired, but hanging in there. The weekend is almost here!", "vocab_notes": ["Under the weather [ˈʌndɚ ðə ˈwɛðɚ (idiom)：身體微恙、精神不適。\n  例句：I’m feeling slightly *under the weather* today, so I’ll work from home.", "Can't complain [kænt kəmˈplen (idiom)：挺好的、沒什麼好抱怨的。\n  例句：How’s everything going with your team? — *Can't complain*, progress is steady.", "Never better [ˈnɛvɚ ˈbɛtɚ (idiom)：再好不過了、狀態處於顛峰。\n  例句：How are you feeling after the vacation? — *Never better*!", "Hang in there [hæŋ ɪn ðɛr (idiom)：撐著點、加油（安慰面臨壓力的人）。\n  例句：I know the pre-audit preparations are tough, but *hang in there*!", "Down in the dumps [daʊn ɪn ðə dʌmps (idiom)：心情低落、沮喪。\n  例句：He seemed *down in the dumps* after the project deadline was pushed back."], "vocab_notes_en": ["Under the weather: Feeling slightly ill, fatigued, or unwell.\n  Example: She stayed home because she felt *under the weather*.", "Can't complain: Casual reply indicating satisfactory progress.\n  Example: Business has been good; *can't complain*.", "Never better: Feeling at the peak of physical or mental health.\n  Example: How are you doing? — *Never better*!", "Hang in there: Encouraging someone to persevere through pressure.\n  Example: *Hang in there*, the final report is almost complete.", "Down in the dumps: Feeling depressed or discouraged.\n  Example: Why does he look so *down in the dumps* today?"], "next_week_tasks": ["💡 下週課堂暖身示範：下週課前寒暄，老師將隨機指定情境，請同學以影片中的在地說法即興回應，不可使用 I'm fine！"], "next_week_tasks_en": ["💡 Warm-up Task: Prepare to answer How are you? dynamically without using I'm fine."], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "開啟 YouTube 教學影片 (14:18)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "走廊寒暄 (Catching Up)", "category_en": "Corridor Small Talk", "title": "巧遇寒暄與公務告退 (Catching up with Each Other)", "title_en": "Casual Catch-up & Polite Departure", "key_takeaways": "【課堂情境與學習重點】\n1. 在走廊、電梯口或課後偶遇時，進行自然簡短的 30 秒破冰寒暄。\n2. 當有緊急公務（如趕著交報告、開會）時，如何有禮貌且合情合理地向對方告退，並給予正面口語祝福。", "key_takeaways_en": "1. 30-second quick catch-up in corridors or after class.\n2. How to politely excuse yourself when rushing to meet deadlines or submit reports.", "main_content": "A: Hi, [Name. How have you been?\nB: Things are good~ And how are things with you?\nA: Same old, same old。\nB: What are you doing after class?\nA: I’ve got to get back to work. I need to turn in a report by 5:30pm。\nB: Wow, ok. Good luck with that!\nA: Thanks! I really need it!", "vocab_notes": ["Turn in a report [tɜrn ɪn ə rɪˈpɔrt (v. phr.)：呈報/繳交報告。\n  例句：I must *turn in* the safety compliance report before 5:00 PM today.", "Good luck with that! (phr.)：祝你順利（日常高頻口語祝福）。\n  例句：You have two audits today? Wow, *good luck with that*!", "Get back to work (v. phr.)：回到工作崗位上。\n  例句：Break time is over; let’s *get back to work* on the HAZOP study."], "vocab_notes_en": ["Turn in a report: Submit or hand in a document/report before deadline.\n  Example: Please *turn in* the incident evaluation by Friday.", "Good luck with that!: Common friendly phrase offering encouragement for a challenging task.\n  Example: Presenting to the CEO? *Good luck with that*!", "Get back to work: Return to job duties or office.\n  Example: I’ve got to *get back to work* immediately."], "practice_quiz": [{"question": "【填空題】你想表達「我必須在下午五點半前繳交報告」，請填入片語 turn ___：\nI need to _________ in a report by 5:30 PM.", "question_en": "Fill-in-the-blank: Express that you must submit a report before 5:30 PM:\nI need to _________ in a report by 5:30 PM.", "answer": "✔ 填空解答：turn\n👉 整句回答：I need to turn in a report by 5:30 PM.\n💡 解析：Turn in 同義於 submit 或 hand in (繳交報告/文件)。", "answer_en": "✔ Answer: turn\n👉 Full Sentence: I need to turn in a report by 5:30 PM.\n💡 Explanation: Turn in is synonymous with submit."}], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation)", "category_en": "Travel & Logistics", "title": "研討會住宿與地鐵動線描述 (AIChE Minneapolis)", "title_en": "AIChE Conference Transit & Hotel Proximity", "key_takeaways": "【課堂情境與學習重點】\n1. 商務差旅中（以赴美參加 AIChE 2026 年會為例）精確描述飯店距離、步行時間、地鐵直達與免轉乘動線。\n2. 詢問與說明房價預算、掌握明尼阿波利斯 Skyway 空中步道系統在防寒與通行上的優勢。", "key_takeaways_en": "1. Describe hotel distances, walking duration, and direct transit without transfers.\n2. Inquire about room rates and leverage the Minneapolis Skyway climate-controlled system.", "main_content": "A: The hotel is near the subway station and within walking distance.\nB: From the hotel, can I take the subway directly to the conference venue?\nA: Yes, you can take the Blue Line directly. You don't need to transfer.\nB: That is very convenient. I have no idea about their room price.", "vocab_notes": ["Proximity [prɑkˈsɪməti (n.)：鄰近、接近程度。\n  例句：The *proximity* of our hotel to the convention center saved us a lot of travel time.", "Transfer [trænsˈfɚ (v./n.)：轉乘、換線。\n  例句：Take the Blue Line directly; there is no need to *transfer* at all.", "Within walking distance (phr.)：步行可達的距離。\n  例句：Several great local restaurants are located *within walking distance*.", "Skyway system [ˈskaɪˌwe ˈsɪstəm (n.)：空中連通步道系統（防寒/防雨通道）。\n  例句：You can navigate downtown Minneapolis comfortably via the indoor *Skyway system*."], "vocab_notes_en": ["Proximity [prɑkˈsɪməti: Nearness in space, time, or relationship.\n  Example: The hotel's *proximity* to the venue is ideal.", "Transfer [trænsˈfɚ: Change from one transit route or vehicle to another.\n  Example: You can ride directly without having to *transfer*.", "Within walking distance: Easily accessible on foot.\n  Example: The subway station is *within walking distance*.", "Skyway system: Enclosed elevated pedestrian walkways connecting downtown buildings.\n  Example: The *Skyway system* keeps pedestrians protected from extreme weather."], "practice_quiz": [{"question": "【填空題】商務出差描述飯店「走路就可抵達會場」，請填入核心片語：\nThe hotel is _________ _________ distance to the conference center.", "question_en": "Fill-in-the-blank: State that the hotel is easily walkable to the venue:\nThe hotel is _________ _________ distance to the conference center.", "answer": "✔ 填空解答：within walking\n👉 整句回答：The hotel is within walking distance to the conference center.\n💡 解析：within walking distance 是商務訂房與交通指南中最常用的片語。", "answer_en": "✔ Answer: within walking\n👉 Full Sentence: The hotel is within walking distance to the conference center.\n💡 Explanation: Standard business hospitality idiom."}, {"question": "【填空題】說明搭地鐵「直達會場、不需要轉乘」，請填入轉乘動詞：\nYou can take the blue line directly; you don’t need to _________ .", "question_en": "Fill-in-the-blank: You can ride directly without changing trains:\nYou can take the blue line directly; you don’t need to _________ .", "answer": "✔ 填空解答：transfer\n👉 整句回答：You can take the blue line directly; you don’t need to transfer.\n💡 解析：transfer 在大眾運輸中表示轉車、換線。", "answer_en": "✔ Answer: transfer\n👉 Full Sentence: You can take the blue line directly; you don’t need to transfer.\n💡 Explanation: Transfer means changing train/bus lines."}], "link": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf?v=1726683206", "link_text": "Minneapolis Skyway & Hotel Map"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "在地推薦 (Recommendations)", "category_en": "Local Recommendations", "title": "會後在地景點與美食推薦 (Post-conference Recommendations)", "title_en": "Local Sightseeing & Food Recommendations", "key_takeaways": "【課堂情境與學習重點】\n1. 向外國訪客介紹台灣在地景點（如高雄景點與特色小吃）的高階推薦句型。\n2. ★ 重要文法核心：worth (值得) 後方必須接動名詞『V-ing』！（例：is worth visiting / eating）。\n3. 提醒外國友人避開觀光陷阱與敲竹槓店家（Tourist trap / Rip-off）。", "key_takeaways_en": "1. Recommend local attractions and cuisine to foreign visitors.\n2. Grammar: Worth MUST be followed by a gerund V-ing (e.g., worth visiting).\n3. Advise visitors to avoid tourist traps and rip-off pricing.", "main_content": "A: I recommend Pier-2 Art Center because it has rich culture.\nB: I think it is definitely worth visiting.\nA: Taiwanese beef noodles is my all-time favorite dish.\nB: You simply cannot miss it; it is a must-eat in Kaohsiung!", "vocab_notes": ["Worth + V-ing [wɜrθ (prep.)：值得做某事（後方必須接動名詞）。\n  例句：The cultural exhibits at Pier-2 are definitely *worth exploring*.", "All-time favorite [ˌɔl taɪm ˈfevərɪt (n. phr.)：終極最愛、一直以來的最愛。\n  例句：Taiwanese beef noodle soup is my *all-time favorite* dish.", "Tourist trap [ˈtʊrɪst træp (n.)：專敲觀光客竹槓的黑店/名不副實的景點。\n  例句：That souvenir market is a known *tourist trap*; prices are inflated.", "Rip-off [ˈrɪpˌɔf (n.)：暴利商品、被敲竹槓。\n  例句：Paying $20 for a small bottle of water is a complete *rip-off*."], "vocab_notes_en": ["Worth + V-ing: Deserving of an action (requires a gerund).\n  Example: The night view from the tower is well *worth seeing*.", "All-time favorite: The single favorite choice across all time.\n  Example: This teahouse is my *all-time favorite* spot.", "Tourist trap: An overcrowded and overpriced venue targeting tourists.\n  Example: Beware of *tourist traps* selling generic souvenirs.", "Rip-off: Something that is far more expensive than it should be.\n  Example: Those taxi fares were an absolute *rip-off*."], "practice_quiz": [{"question": "【文法填空題】請填入 visit 的正確動詞形式：\nPier-2 Art Center is definitely worth _________ during your stay.", "question_en": "Grammar Quiz: Fill in the correct form of visit:\nPier-2 Art Center is definitely worth _________ during your stay.", "answer": "✔ 填空解答：visiting (V-ing)\n👉 整句回答：Pier-2 Art Center is definitely worth visiting during your stay.\n💡 解析：worth 後方接動名詞 V-ing。", "answer_en": "✔ Answer: visiting (V-ing)\n👉 Full Sentence: Pier-2 Art Center is definitely worth visiting during your stay.\n💡 Explanation: Worth requires a gerund."}], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "商務人脈 (Networking)", "category_en": "Networking Role-Play", "title": "展會破冰與部門職掌交流 (Networking Role-Play 投影片全劇本)", "title_en": "Networking Role-Play Full Script", "key_takeaways": "【課堂即興演練核心 Scenario】\n在 Networking Event 初次見面，互相介紹自身與公司，並在交流中自然帶出工作上遭遇的實際問題（Problem/Need），促成合作與交換名片！\n\n【標準 6 階段流程】\n1. 自我介紹與部門 ➔ 2. 詢問對方部門業務 ➔ 3. 簡述自己部門職掌 ➔ 4. 對方帶出工作痛點 ➔ 5. 主動提供協助 ➔ 6. 交換名片約定後續聯絡。", "key_takeaways_en": "Scenario: Meet someone for the first time at a networking event, introduce company roles, identify an operational problem, offer help, and exchange cards.\n\n6-Step Flow: Introduction ➔ Inquire role ➔ Explain dept capabilities ➔ Identify client pain point ➔ Offer assistance ➔ Exchange business cards.", "main_content": "A: Hello, I’m Ryan. I work as a Senior EHS Specialist in Process Safety.\nB: Hi, I’m Alex. It’s a pleasure to meet you.\nA: Can you tell me about your department?\nB: Sure! I work in Operations. We manage plant production lines.\nA: Can I briefly tell you about what our department does?\nB: Of course! I’m all ears. Fire away!\nA: We conduct safety risk assessments and incident prevention audits.\nB: You just remind me that we may need your help in identifying chemical vapor leakage risks.\nA: Yeah, I think we might be able to help you.\nB: That would be great! It’s so nice of you to offer help.\nA: Here's my business card should you want to call.\nB: Absolutely. I’ll be in touch soon.", "vocab_notes": ["I'm all ears [aɪm ɔl ɪrz (idiom)：我洗耳恭聽、全神貫注在聽。\n  例句：Tell me about your plant expansion plan; *I’m all ears*.", "Fire away! [ˈfaɪər əˈwe (idiom)：請說吧！開始問吧！\n  例句：Do you have questions regarding the safety protocol? *Fire away*!", "You just remind me that... (phr.)：你正好提醒了我...（切入痛點的關鍵句）。\n  例句：*You just remind me that* we need an external review for our relief valve sizing.", "Should you want to call (phr.)：若您想致電的話（If you should want to call 之倒裝高階句法）。\n  例句：Here is my contact info *should you want to call* regarding process safety."], "vocab_notes_en": ["I'm all ears: Idiom meaning listening with full attention.\n  Example: *I’m all ears*; let's hear your proposal.", "Fire away!: Colloquial phrase giving permission to start speaking/asking questions.\n  Example: Ready for questions? *Fire away*!", "You just remind me that...: Natural conversational bridge to introduce a relevant work problem.\n  Example: *You just remind me that* we need safety consulting.", "Should you want to call: Inverted formal conditional meaning 'If you should want to call'.\n  Example: Here’s my card *should you want to call*."], "practice_quiz": [{"question": "【填空題】對方想向你簡報業務，你想熱情表示「請儘管說吧！/ 我洗耳恭聽」：\nOf course! I’m all _________ . / _________ away!", "question_en": "Fill-in-the-blank: Politely tell the other person you are listening and to go ahead:\nOf course! I’m all _________ . / _________ away!", "answer": "✔ 填空解答：ears, Fire\n👉 整句回答：Of course! I’m all ears. / Fire away!\n💡 解析：I'm all ears 與 Fire away! 都是表達樂意聆聽的商務社交用語。", "answer_en": "✔ Answer: ears, Fire\n👉 Full Sentence: Of course! I’m all ears. / Fire away!\n💡 Explanation: Standard polite idiom in networking."}, {"question": "【課堂示範實戰填空範例（EHS / 製程安全情境）】", "question_en": "In-Class EHS Practice Sample Script:", "answer": "A: Hello, I'm Ryan. I work as a Senior EHS Specialist in Process Safety.\nB: Hi, I'm Alex. Pleasure to meet you.\nA: Can you tell me about your department?\nB: Sure! I work in Operations. We manage plant production lines.\nA: Can I briefly tell you about what our department does?\nB: Of course! Fire away!\nA: We conduct safety risk assessments and incident prevention audits.\nB: You just remind me that we may need your help in identifying chemical vapor leakage risks.\nA: Yeah, I think we might be able to help you.\nB: That would be great!\nA: Here's my business card should you want to call.\nB: Absolutely. I'll be in touch soon.", "answer_en": "A: Hello, I'm Ryan. I work as a Senior EHS Specialist in Process Safety.\nB: Hi, I'm Alex. Pleasure to meet you.\nA: Can you tell me about your department?\nB: Sure! I work in Operations. We manage plant production lines.\nA: Can I briefly tell you about what our department does?\nB: Of course! Fire away!\nA: We conduct safety risk assessments and incident prevention audits.\nB: You just remind me that we may need your help in identifying chemical vapor leakage risks.\nA: Yeah, I think we might be able to help you.\nB: That would be great!\nA: Here's my business card should you want to call.\nB: Absolutely. I'll be in touch soon."}], "instant_guide": {"core_concepts": ["1. Networking 的核心是解決對方問題（Value Creation）而非硬性推銷。", "2. 關鍵樞紐轉折句：You just remind me that we may need your help in...", "3. 名片遞交的高階假設句法：Here's my card should you want to call."], "misconceptions": ["誤解 1：以為 Networking 只是單向自我介紹（必須雙向詢問並挖掘痛點）。", "誤解 2：以為遞名片只能說 This is my card（使用 should you want to... 更展現專業與謙遜）。"], "exam_questions": ["Q1: 請默寫出從『聽取對方部門職掌』銜接到『帶出自身部門需求』的關鍵英文句子。", "Q2: 請說明倒裝假設句 should you want to call 的文法由來（If you should want to call）。"]}, "socratic_quiz": [{"level": "策略提問 (Level 1)", "prompt": "在 Networking 場合中，為什麼 A 要先詢問 B 的部門，而不是一開始就推銷自己的業務？", "feedback": "這展現了專業社交禮貌與聆聽者的素養（Active Listening），先理解對方的業務範疇，後續才能精準將自身能力包裝成對方的解決方案（Solution）。"}], "confusion_fixer": {"analogy": "【生活類比】：Networking 不像發傳單，而是像醫生問診：先聽對方的症狀（業務痛點），再開出你的專業處方（提供協助）。", "real_example": "A: We specialize in process hazard analysis. ➔ B: You just remind me that we need an independent review for our upcoming expansion project.", "common_mistake": "錯誤：直接塞名片說 Call me for business!（過於具侵略性且缺乏專業度）。"}, "gap_finder": ["⚠️ 潛在缺口 1：忘記在交換名片後 24-48 小時內寄送 Follow-up Email 鞏固人脈。", "⚠️ 潛在缺口 2：在吵雜展會環境下，尚未準備好 10 秒精準自我介紹 (Elevator Pitch)。"], "teach_back": {"prompt": "請用英文扮演角色 A，向一位新認識的工廠營運主管進行 30 秒自我介紹，並提出能夠協助改善製程安全的提議。", "keywords": ["process safety", "risk assessment", "help", "business card", "in touch"]}, "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "BBC 職場自習 (BBC Networking)", "category_en": "BBC Networking Self-Study", "title": "商務社交實戰：Tip Top Trading (BBC #48 Face-to-face)", "title_en": "Networking Face-to-Face (BBC #48)", "key_takeaways": "【詳細劇情情境摘要】\nTip Top Trading 的員工參加產業大會。Anna 必須在會場與同業積極拓展人脈（Networking）。同時公司正面臨嚴峻的經濟景氣（Tough economic climate），管理階層面臨裁員縮編壓力（Reduce team / be rid of staff）。Anna 必須把握展會機會展現熱情，積極爭取新商機。\n\n【Networking 社交心法與觀看重點】\n1. 核心精神：Networking 是透過結識同業建立連結、分享資訊並為公司爭取新業務。\n2. 社交心態：保持友善熱絡 (Just be chatty and friendly)。\n3. 破冰技巧：主動自我介紹 ➔ 詢問對方需求並簡介業務 ➔ 交換名片約定後續聯繫。", "key_takeaways_en": "Summary: Anna attends an industry conference to network in a tough economic climate. She must be friendly and chatty to secure new business and impress management.", "main_content": "A: Do some networking and do some schmoozing with new clients.\nB: I’ll give it a shot. Let’s get down to business.\nA: It is a tough economic climate, and we need new opportunities.\nB: Here is my business card should you want to call.", "vocab_notes": ["Schmooze [ʃmuz (v.)：社交應酬、拉攏關係、建立人脈（商務口語高頻詞）。\n  例句：Conference receptions are the perfect venue to *schmooze* with industry partners.", "Be rid of [bi rɪd əv (v. phr.)：擺脫、裁減（員工）。\n  例句：During corporate restructuring, the firm sought to *be rid of* redundant positions.", "Prestigious award [prɛˈstɪdʒəs əˈwɔrd (n.)：享有盛望的大獎、知名榮譽。\n  例句：Winning this *prestigious award* significantly boosts our brand reputation.", "Give it a shot [ɡɪv ɪt ə ʃɑt (idiom)：嘗試一下（同義於 give it a try）。\n  例句：I’m not sure if the client will agree, but let’s *give it a shot*!", "Tough economic climate (n. phr.)：艱困的經濟大環境。\n  例句：Companies must optimize operational efficiency in this *tough economic climate*."], "vocab_notes_en": ["Schmooze [ʃmuz: Talk casually and friendly in a social/business setting to gain advantage.\n  Example: Executives spent the evening *schmoozing* with potential investors.", "Be rid of: Dismiss or free oneself from someone or something redundant.\n  Example: The company plans to *be rid of* outdated equipment.", "Prestigious award [prɛˈstɪdʒəs əˈwɔrd: An esteemed and highly respected award.\n  Example: Receiving a *prestigious award* validates our safety achievements.", "Give it a shot: Try something out enthusiastically.\n  Example: We might win the contract, so let's *give it a shot*.", "Tough economic climate: Difficult economic market conditions.\n  Example: Growth requires innovation during a *tough economic climate*."], "next_week_tasks": ["💡 課堂角色扮演預告：下週課堂將進行兩人一組 Networking 配對演練，請務必熟記『投影片全劇本』的 6 階段對話流程！"], "next_week_tasks_en": ["💡 In-Class Task: Paired networking role-play following the 6-stage script."], "link": "https://www.bbc.co.uk/learningenglish/features/english-at-work/48-language-for-networking", "link_text": "前往 BBC 課程網頁 (收聽音檔與劇本)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "科技資安自習 (Tech & Security)", "category_en": "Tech & Security Self-Study", "title": "Passkey 通行密鑰原理 (BBC News 02:35)", "title_en": "What is a Passkey? (BBC News 02:35)", "key_takeaways": "【影片詳細摘要】\nBBC News 深入探討 Passkey（通行密鑰）技術如何透過裝置端生物辨識（指紋 Touch ID / 人臉 Face ID）取代傳統容易被駭、外洩或遺忘的字元密碼，成為新一代跨平台網路安全驗證標準。\n\n【課後自習任務 Tasks】\n✔ 任務：觀看影片後，用 1-3 句英文簡述 Passkey 相比傳統密碼最大的安全性優勢。", "key_takeaways_en": "Summary: Explains how biometric passkeys replace vulnerable passwords with on-device cryptographic keys.\n\nTask: Summarize why passkeys are more secure than passwords in 1-3 English sentences.", "main_content": "A: Passkeys replace traditional passwords with fast biometric authentication.\nB: They use cryptographic key pairs on your device to resist phishing attacks.\nA: You do not need to remember complex character strings anymore.\nB: It represents a truly passwordless future for online security.", "vocab_notes": ["Authentication [ɔˌθɛntɪˈkeʃən (n.)：身分驗證、認證程序。\n  例句：Two-factor *authentication* adds a vital layer of cybersecurity defense.", "Biometrics [ˌbaɪoʊˈmɛtrɪks (n.)：生物辨識技術（指紋、臉部或虹膜）。\n  例句：*Biometrics* provide seamless login experiences without typing passwords.", "Data encryption [ˈdetə ɪnˈkrɪpʃən (n.)：資料加密技術。\n  例句：All sensitive engineering files are protected by end-to-end *data encryption*.", "Phishing attack [ˈfɪʃɪŋ əˈtæk (n.)：網路釣魚攻擊。\n  例句：Passkeys cannot be stolen via *phishing attacks* because they are tied to verified domains.", "Data breach [ˈdetə britʃ (n.)：資料外洩事故。\n  例句：The recent *data breach* compromised millions of traditional user passwords."], "vocab_notes_en": ["Authentication [ɔˌθɛntɪˈkeʃən: Process of verifying identity before granting access.\n  Example: Multi-factor *authentication* is required for remote server access.", "Biometrics [ˌbaɪoʊˈmɛtrɪks: Identification of individuals based on biological traits.\n  Example: Mobile devices utilize *biometrics* for fast authorization.", "Data encryption: Encoding data to prevent unauthorized interception.\n  Example: *Data encryption* safeguards confidential client files.", "Phishing attack: Fraudulent attempt to steal credentials via fake websites.\n  Example: Passkeys eliminate vulnerability to *phishing attacks*.", "Data breach: Security incident where private data is accessed illegally.\n  Example: Stolen password lists often originate from a *data breach*."], "next_week_tasks": ["💡 課堂示範預告：下週課堂老師將抽點同學以 1 分鐘英文簡報說明：Why are passkeys more secure than traditional passwords?，請先擬妥要點。"], "next_week_tasks_en": ["💡 1-Minute Pitch: Prepare a quick explanation on why passkeys are superior to passwords."], "link": "https://www.youtube.com/watch?v=lf5L_1oqHDs", "link_text": "開啟 BBC Passkey 影片 (02:35)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "隱私防護自習 (Privacy & AI)", "category_en": "Privacy & AI Self-Study", "title": "智慧眼鏡防偷拍妙招 (CNN Shorts 02:15)", "title_en": "Smart Glasses Privacy Hack (CNN Shorts 02:15)", "key_takeaways": "【影片詳細情境摘要】\nCNN 報導網路上流傳一項應對智慧眼鏡（如 Meta Ray-Ban）未經同意偷拍的新招數：如果你懷疑身邊有人正配戴智慧眼鏡對你進行錄影，可以在現場播放或哼唱『迪士尼版權歌曲』！因為社群平台的演算法與版權偵測技術會自動識別受版權保護的音訊，一旦對方將偷拍影片上傳至社群平台，該影片很可能會直接被系統下架或消音。Meta 同時向 CNN 表示已在 AI 智慧眼鏡鏡框上內建 LED 隱私提示燈，並嚴肅看待未經同意的偷拍行為。\n\n【課後自習任務 Tasks】\n✔ 任務：記住關於隱私隱憂、拍攝與版權偵測相關的英文詞彙。", "key_takeaways_en": "Summary: A viral trick to stop covert filming by smart glasses involves playing copyrighted Disney music so automated platform algorithms block the uploaded video.\n\nTask: Master vocabulary regarding privacy concerns, filming without consent, and copyright detection.", "main_content": "A: If you suspect being filmed without consent, play a copyrighted song.\nB: Platform automated detection algorithms will flag the video upon uploading.\nA: The clip will be muted or taken down due to copyright infringement.\nB: The smart glasses also feature an LED indicator light during active recording.", "vocab_notes": ["Film without consent [fɪlm wɪðˈaʊt kənˈsɛnt (v. phr.)：未經同意擅自錄影。\n  例句：*Filming individuals without consent* in private areas can violate privacy laws.", "Copyright infringement [ˈkɑpiˌraɪt ɪnˈfrɪndʒmənt (n.)：侵犯著作權/版權。\n  例句：Playing background music triggers automatic *copyright infringement* filters.", "Automated detection [ˈɔtəˌmetɪd dɪˈtɛkʃən (n.)：自動化偵測演算法。\n  例句：Platform *automated detection* flags unauthorized audio within seconds.", "Take down / Mute (v.)：下架影片 / 靜音消音處理。\n  例句：The uploaded video was *taken down* immediately by the platform.", "Indicator light [ˈɪndəˌketɚ laɪt (n.)：LED 提示燈號。\n  例句：Smart glasses feature a visible *indicator light* to show when the camera is active."], "vocab_notes_en": ["Film without consent: Record someone on video without their knowledge or permission.\n  Example: Capturing footage *without consent* creates privacy liabilities.", "Copyright infringement [ˈkɑpiˌraɪt ɪnˈfrɪndʒmənt: Unauthorized use of copyrighted material.\n  Example: Background music triggered a *copyright infringement* strike.", "Automated detection: Algorithmic screening to identify matching digital assets.\n  Example: Content ID uses *automated detection* to scan video uploads.", "Take down / Mute: Remove online video or silence its audio track.\n  Example: Infringing clips were *muted* by the social network.", "Indicator light: An LED notification light signifying active hardware recording.\n  Example: The white *indicator light* turns on during video recording."], "next_week_tasks": ["💡 課堂討論預告：下週將針對『穿戴式 AI 裝置與個人隱私 (Privacy Concerns)』進行課堂分組討論，請準備好 1 個支持或反對在公共場合配戴智慧眼鏡的英文論點。"], "next_week_tasks_en": ["💡         const examData = {"title": "Networking English 全真模擬檢測試卷 (Mid-Term Practice)", "sections": [{"type": "單選題 (Multiple Choice)", "questions": [{"q": "1. Which of the following is grammatically CORRECT when ending a business email?", "options": ["A. I look forward to see you next week.", "B. I look forward to seeing you next week.", "C. I look forward to meet with you.", "D. I am looking forward to meet you."], "ans": "B", "explanation": "Look forward to 中的 to 是介系詞，後方必須搭配動名詞 (seeing)。"}, {"q": "2. When someone asks How are things with you?, which phrase indicates that life is calm and without major events?", "options": ["A. I'm double-booked.", "B. Things are pretty uneventful.", "C. It's a tourist trap.", "D. Fire away!"], "ans": "B", "explanation": "Uneventful 代表平靜無事、一切平穩順利。"}]}, {"type": "填空題 (Fill-in-the-Blank)", "questions": [{"q": "3. The conference hotel is _________ _________ distance to the main convention center. (步行即可達到的距離)", "ans": "within walking", "explanation": "within walking distance 是描述飯店距離大會會場最標準的片語。"}, {"q": "4. Here's my business card _________ you want to get in touch. (若您需要聯繫的話)", "ans": "should", "explanation": "should you want to 為 If you should want to 之倒裝高階用法。"}]}, {"type": "情境實戰題 (Scenario Application)", "questions": [{"q": "5. 情境題：你在展會上巧遇潛在合作夥伴，請用 3 句話依序完成：(1) 歡迎對方說明部門業務、(2) 說明自身部門可提供協助、(3) 遞出名片約定後續聯絡。", "ans": "參考範本：\n(1) Of course! I'm all ears. Fire away!\n(2) We specialize in process safety assessments, and I think we might be able to help you.\n(3) Here's my business card should you want to call. Let's keep in touch!", "explanation": "展現主動聆聽、明確價值主張與得體的名片交換。"}]}]};

            for (const name of targetNames) {
                const found = langMatches.find(v => v.name.includes(name));
                if (found) return found;
            }

            const allEn = voices.filter(v => v.lang.startsWith('en'));
            for (const name of targetNames) {
