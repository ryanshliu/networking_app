ng an error.", "main_content": "A: Did Sheldon's radio public apology resolve the conflict?\n（謝爾頓在廣播中的公開道歉化解衝突了嗎？）\nB: Not at all! He sounded condescending and tried to rationalize his remarks. It was totally awkward and backfired completely!\n（完全沒有！他聽起來居高臨下還試圖合理化自己的言論。場面極度尷尬而且徹底適得其反！）", "vocab_notes": ["Condescending (adj.)：居高臨下的。例句：Never sound *condescending* in public statements."], "link": "https://www.youtube.com/watch?v=p5cGPAzGFbM", "link_text": "觀看 A Public Apology (YouTube)"}, {"week": "week8", "class_date": "2026/10/07", "type": "media", "category": "商業擴張自學 (Bloomberg #3)", "title": "壽司郎進軍美國市場新篇章 (Sushiro's New Chapter in American Market - 03:03)", "key_takeaways": "【彭博商業：餐飲自動化】\n日本壽司郎以輸送帶自動化技術進軍美國，在高工資環境下創造價格競爭力。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: Bloomberg examines how Sushiro leverages robotic conveyor belts and digital ordering to lower labor costs while offering accessible dining across the US.\n2. New Words Learned: Conveyor-belt sushi (迴轉壽司), Price competitiveness (價格競爭力), Labor overhead (勞動力人事營運成本).\n3. Assignment Task: Explain the business benefits of restaurant robotics.", "main_content": "A: How is Sushiro differentiating itself in the American dining landscape?\n（壽司郎在美國餐飲版圖中如何做出差異化？）\nB: By combining automated conveyor-belt robotics with affordable sushi, they keep labor overhead down while maintaining authentic quality!\n（透過將自動化迴轉傳送帶與平價壽司相結合，他們在維持道地品質的同時大幅降低了人事營運成本！）", "vocab_notes": ["Conveyor-belt (n.)：輸送帶。例句：Automated *conveyor-belt* systems."], "link": "https://www.youtube.com/watch?v=vJhZc-Uhbjw", "link_text": "觀看 Sushiro's New Chapter (Bloomberg)"}, {"week": "week8", "class_date": "2026/10/07", "type": "media", "category": "前瞻汽車自學 (WSJ News #4)", "title": "實測飛雅特微型電動車登陸美國道路 (Driving Fiat's Micro EV on US Roads - 03:25)", "key_takeaways": "【華爾街日報：都會微型電車】\nWSJ 實測微型電動代步車在美國皮卡車環伺之下的道路生存挑戰與停車敏捷性。\n\n【Your Tasks & Reference Answer】\n1. Video Summary: WSJ tests Fiat's tiny micro EV on American roads, contrasting its effortless parking with safety limits when sharing roads with gigantic trucks.\n2. New Words Learned: Micro EV (微型電動車), Towering pickup trucks (巨大皮卡車), Speed disparity (速度落差).\n3. Assignment Task: Evaluate the feasibility of micro EVs inside industrial plant compounds.", "main_content": "A: What was the reporter's verdict on driving a Fiat micro EV across American streets?\n（記者在美國街道上試駕飛雅特微型電動車後的評價是什麼？）\nB: It is incredibly agile for tight urban parking, but driving it next to gigantic pickup trucks feels slightly daunting due to speed and size disparities!\n（它在狹窄的市區停車時靈活無比，但因為速度與體積懸殊，開在巨大的皮卡車身旁讓人感到有點膽戰心驚！）", "vocab_notes": ["Agile (adj.)：靈活敏捷的。例句：*Agile* vehicles in tight plant roads."], "link": "https://www.youtube.com/watch?v=qtV_U0fQICE", "link_text": "觀看 Fiat's Micro EV on US Roads (WSJ)"}];
        const examData = {"title": "Networking English 全真模擬檢測試卷 (Mid-Term & Review Practice)", "sections": [{"type": "單選題 (Multiple Choice)", "questions": [{"q": "1. Which idiom means to acknowledge that you were wrong and accept humiliation or apologize gracefully?[, 2]", "options": ["A. Eat humble pie", "B. Beat around the bush", "C. Hit a plateau", "D. Break out of sandbox"], "ans": "A", "explanation": "Eat humble pie 是英語中表達『低頭認錯、賠罪服軟』的經典成語[, 2]。"}, {"q": "2. Which of the following is spelled CORRECTLY for office envelopes and paper supplies?", "options": ["A. Stationery", "B. Stationary", "C. Stationerry", "D. Stationairy"], "ans": "A", "explanation": "文具為 Stationery（字尾為 -ery，口訣：e 代表 envelope 信封）；Stationary 則為形容詞靜止不動的。"}, {"q": "3. Which sentence pattern correctly uses the preposition 'to' when closing business correspondence?", "options": ["A. I look forward to see you.", "B. I look forward to seeing you.", "C. I look forward to meet you.", "D. I look forward to collaborate."], "ans": "B", "explanation": "Look forward to 中的 to 是介系詞，後方必須搭配動名詞 (V-ing) 或名詞。"}, {"q": "4. What idiom expresses the mental state of being so stressed or exhausted that you cannot think clearly?", "options": ["A. Can't think straight", "B. Stand one's ground", "C. Cut to the chase", "D. Go with the flow"], "ans": "A", "explanation": "Can't think straight 指思緒紊亂、無法理性清晰思考。"}]}]};
        const top5Data = [{"rank": "Top 1 必考核心", "topic": "Eat humble pie 與商務認錯金句 (BBC Work #54)", "prob": "出題機率：99%", "challenge_q": "Q: 請翻譯：『主管算錯了人力配置，明天一早必須親自向同仁道歉。』", "challenge_ans": "✔ 'The manager miscalculated the staffing numbers and must eat humble pie first thing tomorrow.'"}, {"rank": "Top 2 必考核心", "topic": "Stationery (文具) vs. Stationary (靜止的) 拼寫辨析", "prob": "出題機率：97%", "challenge_q": "Q: 請判斷：'The forklift collided with a stationery container.' 是否正確？", "challenge_ans": "✔ 錯誤！靜止不動的貨櫃應使用 stationary（a for anchor 錨），而非文具 stationery。"}, {"rank": "Top 3 必考核心", "topic": "Look forward to + V-ing 文法與介系詞規則", "prob": "出題機率：95%", "challenge_q": "Q: 請改正：'I look forward to hear your project feedback soon.'", "challenge_ans": "✔ 應改為 'I look forward to hearing your project feedback soon.' (to 為介系詞後接 V-ing)。"}, {"rank": "Top 4 必考核心", "topic": "誤會化解金句 (A bit of a mix-up & Hear me out)", "prob": "出題機率：93%", "challenge_q": "Q: 會議中如何客氣說明『兩份訂單資料搞混了』？", "challenge_ans": "✔ 'Don't worry, there seems to have been a bit of a mix-up with the order sheets.'"}, {"rank": "Top 5 必考核心", "topic": "可逆與不可逆詞彙 (Reversible vs. Irreversible)", "prob": "出題機率：90%", "challenge_q": "Q: 製程安全中『不可逆的腐蝕損害』英文如何表達？", "challenge_ans": "✔ 'Irreversible corrosion damage to the piping unit.'"}];

        let undoStack = [];
        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        function checkVersionUpdate() {
            const currentVer = "1.9";
            const cachedVer = localStorage.getItem('ryan_networking_app_ver');
            if (cachedVer !== currentVer) {
                const banner = document.getElementById('updateNoticeBanner');
                if (banner) banner.style.display = 'flex';
                localStorage.setItem('ryan_networking_app_ver', currentVer);
            }
        }
        function dismissUpdateBanner() {
            const banner = document.getElementById('updateNoticeBanner');
            if (banner) banner.style.display = 'none';
        }

        function resizeCanvas() {
            const card = document.getElementById('cardElement');
            if (card && canvas) {
                canvas.width = card.clientWidth;
                canvas.height = card.clientHeight;
            }
        }

        function saveCanvasState() {
            if (undoStack.length > 15) undoStack.shift();
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        function undoLastStroke() {
            if (undoStack.length > 0) {
                const prevState = undoStack.pop();
                ctx.putImageData(prevState, 0, 0);
            } else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            document.getElementById('penBtn').classList.toggle('active-pen', isPenMode);
            document.getElementById('cardElement').classList.toggle('canvas-active', isPenMode);
            if (isPenMode) resizeCanvas();
        }

        function clearAllCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            undoStack = [];
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (!isPenMode) return;
            isDrawing = true;
            saveCanvasState();
            const rect = canvas.getBoundingClientRect();
            ctx.beginPath();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.strokeStyle = '#e11d48';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || !isPenMode) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        });

        canvas.addEventListener('pointerup', () => { isDrawing = false; });
        canvas.addEventListener('pointercancel', () => { isDrawing = false; });

        function formatFormattedText(rawText) {
            let text = String(rawText);
            text = text.replace(/\[\s*\]/g, '');
            text = text.replace(/\[([^\[\]]*[ˈˌəɪæʊʌθðʃʒŋɑɔɒ][^\[\]]*)\]/g, '<span class="ipa-tag">/$1/</span>');
            text = text.replace(/\[([^\[\]]+)\]/g, function(match, content) {
                let lower = content.toLowerCase();
                if (lower.includes('英式') || lower.includes('交通') || lower.includes('差旅')) {
                    return '<span class="context-tag tag-blue">' + content + '</span>';
                } else if (lower.includes('美式') || lower.includes('警示') || lower.includes('急迫')) {
                    return '<span class="context-tag tag-amber-badge">' + content + '</span>';
                } else if (lower.includes('管理') || lower.includes('風格') || lower.includes('性格') || lower.includes('特質') || lower.includes('思維') || lower.includes('決策')) {
                    return '<span class="context-tag tag-purple">' + content + '</span>';
                } else if (lower.includes('多益') || lower.includes('核心') || lower.includes('商業') || lower.includes('商務') || lower.includes('財經') || lower.includes('經濟') || lower.includes('會計') || lower.includes('總體') || lower.includes('專案')) {
                    return '<span class="context-tag tag-green">' + content + '</span>';
                } else if (lower.includes('高頻') || lower.includes('口語') || lower.includes('情緒') || lower.includes('談判') || lower.includes('社交') || lower.includes('過渡') || lower.includes('禮貌') || lower.includes('委婉')) {
                    return '<span class="context-tag tag-rose">' + content + '</span>';
                } else {
                    return '<span class="context-tag tag-neutral">' + content + '</span>';
                }
            });
            text = text.replace(/\*([^*]+)\*/g, '<span class="highlight-term">$1</span>');
            return text.replace(/\n/g, '<br>');
        }

        function renderVocabCardItem(rawText) {
            let text = String(rawText).trim();
            let exampleText = "";
            if (text.includes("例句：") || text.includes("例句:")) {
                let parts = text.split(/例句[：:]/);
                text = parts[0].trim();
                exampleText = parts[1].trim();
            }
            let posMatch = text.match(/\((v\.|n\.|adj\.|adv\.|phr\.|idiom|句型)[^\)]*\)/i);
            let posTagHtml = "";
            if (posMatch) {
                posTagHtml = `<span class="vocab-pos-tag">${posMatch[0]}</span>`;
                text = text.replace(posMatch[0], "").trim();
            }
            let mainTerm = text;
            let defText = "";
            if (text.includes("：") || text.includes(":")) {
                let colonParts = text.split(/[：:]/);
                mainTerm = colonParts[0].trim();
                defText = colonParts.slice(1).join("：").trim();
            }
            return `
                <div class="vocab-card-item">
                    <div class="vocab-head-row">
                        <span>${formatFormattedText(mainTerm)}</span>
                        ${posTagHtml}
                    </div>
                    ${defText ? `<div class="vocab-def-text">${formatFormattedText(defText)}</div>` : ''}
                    ${exampleText ? `<div class="vocab-example-box"><strong>例句：</strong>${formatFormattedText(exampleText)}</div>` : ''}
                </div>
            `;
        }

        function renderTaskBlocks(taskContent) {
            let html = "";
            let lines = taskContent.split('\n');
            let currentTitle = "";
            let currentBody = [];

            function flushBlock() {
                if (currentTitle || currentBody.length) {
                    html += `
                        <div class="task-block">
                            <div class="task-block-title">${currentTitle}</div>
                            <div>${formatFormattedText(currentBody.join('\n'))}</div>
                        </div>
                    `;
                    currentTitle = "";
                    currentBody = [];
                }
            }

            lines.forEach(line => {
                let l = line.trim();
                if (!l) return;
                if (l.match(/^[123]\./) || l.startsWith("【Your Tasks")) {
                    flushBlock();
                    currentTitle = l;
                } else {
                    currentBody.push(l);
                }
            });
            flushBlock();
            return html;
        }

        let isPodcastPlaying = false;
        function togglePodcastPlayback() {
            if (!('speechSynthesis' in window)) return;
            const btn = document.getElementById('podcastMainBtn');
            if (isPodcastPlaying) {
                window.speechSynthesis.cancel();
                isPodcastPlaying = false;
                if (btn) btn.innerText = "▶ 開始朗讀對話";
            } else {
                window.speechSynthesis.cancel();
                const target = (suiteScope === 'all') ? allItems : [currentPool[currentIndex] || allItems[0]];
                let queue = [];
                target.forEach(l => {
                    if (l.main_content) {
                        l.main_content.split('\n').forEach(line => {
                            let textLine = line.trim();
                            if (textLine.startsWith('（') || textLine.startsWith('(')) return;
                            if (textLine.startsWith('A:')) queue.push({ s: 'A', t: textLine.substring(2).trim() });
                            else if (textLine.startsWith('B:')) queue.push({ s: 'B', t: textLine.substring(2).trim() });
                        });
                    }
                });
                if (!queue.length) return;

                const accentSelect = document.getElementById('podcastAccent');
                const speedSlider = document.getElementById('podcastSpeed');
                const selectedLang = accentSelect ? accentSelect.value : 'en-US';
                const speed = speedSlider ? parseFloat(speedSlider.value) : 0.95;

                const availableVoices = window.speechSynthesis.getVoices();
                let matchedVoices = availableVoices.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(selectedLang.toLowerCase()));
                if (selectedLang === 'en-IN' && matchedVoices.length === 0) {
                    matchedVoices = availableVoices.filter(v => v.lang.toLowerCase().includes('in') || v.name.toLowerCase().includes('india'));
                }

                isPodcastPlaying = true;
                if (btn) btn.innerText = "⏹️ 停止朗讀";
                let idx = 0;

                function speakNext() {
                    if (!isPodcastPlaying || idx >= queue.length) {
                        isPodcastPlaying = false;
                        if (btn) btn.innerText = "▶️ 開始朗讀對話";
                        return;
                    }
                    const item = queue[idx];
                    const u = new SpeechSynthesisUtterance(item.t);
                    u.lang = selectedLang;
                    u.rate = speed;

                    if (matchedVoices.length > 0) {
                        if (item.s === 'A') {
                            u.voice = matchedVoices[0];
                            u.pitch = 0.9;
                        } else {
                            u.voice = matchedVoices[matchedVoices.length > 1 ? 1 : 0];
                            u.pitch = 1.2;
                        }
                    } else {
                        u.pitch = (item.s === 'A') ? 0.85 : 1.25;
                    }

                    u.onend = () => { idx++; speakNext(); };
                    u.onerror = () => { isPodcastPlaying = false; };
                    window.speechSynthesis.speak(u);
                }
                speakNext();
            }
        }

                    secDiv.innerHTML += '<div style="background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:12px; margin-bottom:10px;">' +
                        '<div style="font-weight:700;">' + q.q + '</div>' + optHtml +
                        '<button class="quiz-toggle-btn" style="padding:6px 12px; font-size:12px; margin-top:8px;" onclick="this.nextElementSibling.style.display=(this.nextElementSibling.style.display===\'block\'?\'none\':\'block\')">👁️ 顯示解答</button>' +
                        '<div style="display:none; margin-top:8px; padding:10px; background:#f0fdf4; border-radius:10px; color:#166534; font-weight:600;">答案：' + q.ans + '<br>解析：' + q.explanation + '</div></div>';
                });
                container.appendChild(secDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            checkVersionUpdate();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                };
            }
            const selector = document.getElementById('weekFilter');
            if (selector) selector.value = 'week8';
            setTab('sentence');
        });
    </script>
</body>
</html>
