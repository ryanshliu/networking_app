        // ==================== 自然雙人聲隊列播放引擎 ====================
        let speechQueue = [];
        let queueIndex = 0;

        function togglePodcastPlayback() {
            if (!('speechSynthesis' in window)) {
                alert("抱歉，您的瀏覽器不支援語音合成！");
                return;
            }

            initVoicesByAccent(selectedAccent);
            const btn = document.getElementById('podcastMainBtn');

            if (isPodcastPlaying) {
                window.speechSynthesis.cancel();
                isPodcastPlaying = false;
                speechQueue = [];
                queueIndex = 0;
                if (btn) {
                    btn.innerText = "▶️ 開始雙人對話朗讀";
                    btn.classList.remove('playing');
                }
            } else {
                window.speechSynthesis.cancel();
                speechQueue = [];
                queueIndex = 0;

                const targetLessons = (suiteScope === 'all') ? rawDatabase : [filteredPool[currentIndex] || rawDatabase[0]];

                targetLessons.forEach((l, lIdx) => {
                    if (suiteScope === 'all') {
                        speechQueue.push({ speaker: 'narrator', text: `Topic ${lIdx + 1}: ${l.title_en || l.title}` });
                    }
                    const lines = l.main_content.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                    lines.forEach(line => {
                        if (line.startsWith('A:')) {
                            speechQueue.push({ speaker: 'A', text: line.substring(2).trim() });
                        } else if (line.startsWith('B:')) {
                            speechQueue.push({ speaker: 'B', text: line.substring(2).trim() });
                        } else {
                            speechQueue.push({ speaker: 'narrator', text: line.replace(/[•-]/g, '').trim() });
                        }
                    });
                });

                if (!speechQueue.length) return;

                isPodcastPlaying = true;
                if (btn) {
                    btn.innerText = "⏹️ 停止播放 (點擊停止)";
                    btn.classList.add('playing');
                }

                playNextInQueue();
            }
        }

        function playNextInQueue() {
            if (!isPodcastPlaying || queueIndex >= speechQueue.length) {
                isPodcastPlaying = false;
                const btn = document.getElementById('podcastMainBtn');
                if (btn) {
                    btn.innerText = "▶️ 開始雙人對話朗讀";
                    btn.classList.remove('playing');
                }
                return;
            }

            const item = speechQueue[queueIndex];
            const utter = new SpeechSynthesisUtterance(item.text);
            utter.rate = podcastRate;

            // 嚴格男女雙聲道分派與音頻分離
            if (item.speaker === 'A') {
                if (speakerAVoice) utter.voice = speakerAVoice;
                utter.pitch = 0.82; // 男聲：厚實穩重
            } else if (item.speaker === 'B') {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.22; // 女聲：清亮柔和
            } else {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.0;
            }

            utter.onend = () => {
                queueIndex++;
                setTimeout(playNextInQueue, 160);
            };

            utter.onerror = () => {
                isPodcastPlaying = false;
                const btn = document.getElementById('podcastMainBtn');
                if (btn) {
                    btn.innerText = "▶️ 開始雙人對話朗讀";
                    btn.classList.remove('playing');
                }
            };

            window.speechSynthesis.speak(utter);
        }

        function evaluateTeachBack() {
            const input = document.getElementById('teachInput').value.trim();
            const resultDiv = document.getElementById('teachResult');
            if (!input) {
                alert("請先輸入您的概念解釋！");
                return;
            }
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                ✨ <b>費曼回饋分析報告：</b><br>
                ✔ <b>掌握良好部分</b>：成功傳達了情境的核心語意，具備實戰應用概念！<br>
                💡 <b>精進建議</b>：可嘗試在解釋中加入一個完整的英文例句（例如：Same old, same old!），能讓說明更加精準專業！
            `;
        }

        function renderExam() {
            const container = document.getElementById('examContainer');
            container.innerHTML = "";

            examData.sections.forEach(sec => {
                const secDiv = document.createElement('div');
                secDiv.innerHTML = `<h4 style="font-size:16px; color:#4f46e5; margin:14px 0 8px 0;">${sec.type}</h4>`;
                
                sec.questions.forEach(q => {
                    const qDiv = document.createElement('div');
                    qDiv.className = 'exam-q-card';

                    let optionsHtml = '';
                    if (q.options) {
                        optionsHtml = `<div style="margin:8px 0;">${q.options.map(o => `<div style="font-size:14.5px; margin:4px 0; color:#334155;">${o}</div>`).join('')}</div>`;
                    }

                    qDiv.innerHTML = `
                        <div style="font-size:15px; font-weight:700; color:#1e1b4b; line-height:1.5;">${q.q}</div>
                        ${optionsHtml}
                        <button class="quiz-toggle-btn" style="padding:6px 14px; font-size:13px; margin-top:8px;" onclick="toggleExamItemAnswer(this)">
                            👁️ 顯示解答與詳解
                        </button>
                        <div class="exam-ans-box">
                            <b>✔ 正確答案：</b> ${q.ans}<br>
                            <b>💡 詳細解析：</b> ${q.explanation}
                        </div>
                    `;
                    secDiv.appendChild(qDiv);
                });
                container.appendChild(secDiv);
            });
        }

        function toggleExamItemAnswer(btn) {
            const ansBox = btn.nextElementSibling;
            if (ansBox.style.display === 'block') {
                ansBox.style.display = 'none';
                btn.innerText = '👁️ 顯示解答與詳解';
            } else {
                ansBox.style.display = 'block';
                btn.innerText = '🙈 隱藏解答';
            }
        }

        function toggleLanguage() {
            currentLang = (currentLang === 'zh') ? 'en' : 'zh';
            updateUIStrings();
            renderCard();
        }

        function updateUIStrings() {
            const t = i18nDict[currentLang];
            document.getElementById('langBtnText').innerText = t.langBtn;
            document.getElementById('penBtnText').innerText = t.penBtn;
            document.getElementById('undoBtnText').innerText = t.undoBtn;
            document.getElementById('clearBtnText').innerText = t.clearBtn;
            document.getElementById('tabSentence').innerText = t.tabSentence;
            document.getElementById('tabMedia').innerText = t.tabMedia;
            document.getElementById('tagTakeaways').innerText = t.tagTakeaways;
            document.getElementById('tagMainContent').innerText = t.tagMainContent;
            document.getElementById('tagQuiz').innerText = t.tagQuiz;
            document.getElementById('tagVocab').innerText = t.tagVocab;
            document.getElementById('tagTask').innerText = t.tagTask;
            document.getElementById('btnPrev').innerText = t.btnPrev;
            document.getElementById('btnNext').innerText = t.btnNext;
        }

        function checkAppVersion() {
            fetch('./index.html?check=' + Date.now(), { cache: 'no-store' })
                .then(res => res.text())
                .then(html => {
                    const match = html.match(/const LOCAL_APP_VERSION = "([^"]+)";/);
                    if (match && match[1] && match[1] !== LOCAL_APP_VERSION) {
                        const notice = document.getElementById('updateNotice');
                        if (notice) notice.style.display = 'block';
                    }
                })
                .catch(err => console.log('版本檢查略過:', err));
        }

        function forceReloadApp() {
            window.location.href = window.location.pathname + '?v=' + Date.now();
        }

        function cleanText(str) {
            if (!str) return '';
            return String(str).replace(/\]*\]/g, '').trim();
        }

        function resizeCanvas() {
            const card = document.getElementById('cardElement');
            const width = card.scrollWidth;
            const height = Math.max(card.scrollHeight, card.clientHeight);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            canvas.width = width;
            canvas.height = height;
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            const penBtn = document.getElementById('penBtn');
            const card = document.getElementById('cardElement');
            if (isPenMode) {
                penBtn.classList.add('active-pen');
                card.classList.add('canvas-active');
                resizeCanvas();
            } else {
                penBtn.classList.remove('active-pen');
                card.classList.remove('canvas-active');
            }
        }

        function saveSnapshot() {
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (undoStack.length > 25) undoStack.shift();
        }

        function undoLastStroke() {
            if (undoStack.length > 0) {
                const previousState = undoStack.pop();
                ctx.putImageData(previousState, 0, 0);
            } else {
                clearAllCanvas();
            }
        }

        function clearAllCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            undoStack = [];
        }

        function getExactCoords(e) {
            const card = document.getElementById('cardElement');
            const rect = card.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left + card.scrollLeft,
                y: clientY - rect.top + card.scrollTop
            };
        }

        function startDrawing(e) {
            if (!isPenMode) return;
            isDrawing = true;
            saveSnapshot();
            const coords = getExactCoords(e);
            lastX = coords.x; lastY = coords.y;
        }

        function draw(e) {
            if (!isDrawing || !isPenMode) return;
            if (e.cancelable) e.preventDefault();
            const coords = getExactCoords(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);
            ctx.strokeStyle = 'rgba(225, 29, 72, 0.85)';
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            lastX = coords.x; lastY = coords.y;
        }

        function stopDrawing() { isDrawing = false; }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);
        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        function renderMainContent(rawContent) {
            const container = document.getElementById('mainContentContainer');
            container.innerHTML = "";
            if (!rawContent) return;

            const text = cleanText(rawContent);
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const hasDialogue = lines.some(l => l.startsWith('A:') || l.startsWith('B:'));

            if (hasDialogue) {
                const dialogueBox = document.createElement('div');
                dialogueBox.className = 'dialogue-container';
                lines.forEach(line => {
                    if (line.startsWith('A:')) {
                        const row = document.createElement('div');
                        row.className = 'chat-bubble-row speaker-a';
                        row.innerHTML = `<div class="speaker-avatar avatar-a">A</div><div class="chat-bubble-content">${line.substring(2).trim()}</div>`;
                        dialogueBox.appendChild(row);
                    } else if (line.startsWith('B:')) {
                        const row = document.createElement('div');
                        row.className = 'chat-bubble-row speaker-b';
                        row.innerHTML = `<div class="speaker-avatar avatar-b">B</div><div class="chat-bubble-content">${line.substring(2).trim()}</div>`;
                        dialogueBox.appendChild(row);
                    } else {
                        const intro = document.createElement('div');
                        intro.style.fontSize = '14px'; intro.style.fontWeight = '700'; intro.style.color = '#64748b'; intro.style.margin = '4px 0';
                        intro.innerText = line;
                        dialogueBox.appendChild(intro);
                    }
                });
                container.appendChild(dialogueBox);
            } else {
                const plainBox = document.createElement('div');
                plainBox.style.fontSize = '16px'; plainBox.style.fontWeight = '600'; plainBox.style.color = '#0c4a6e';
                plainBox.style.backgroundColor = 'var(--sky-bg)'; plainBox.style.padding = '16px'; plainBox.style.borderRadius = '16px';
                plainBox.style.border = '1px solid var(--sky-border)'; plainBox.style.whiteSpace = 'pre-line';
                plainBox.innerText = text;
                container.appendChild(plainBox);
            }
        }

        function formatQuestionText(text) {
            let s = cleanText(text);
            s = s.replace(/_{3,}/g, '<span class="blank-line">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');
            return s;
        }

        function formatVocabItem(rawText) {
            let text = cleanText(rawText);
            text = text.replace(/\[([^\]]+)\]/g, '<span class="ipa-tag">[$1]</span>');
            text = text.replace(/\*([^*]+)\*/g, '<span class="highlight-term">$1</span>');
            return text.replace(/\n/g, '<br>');
        }

        function toggleAnswer(btn) {
            const t = i18nDict[currentLang];
            const wrapper = btn.nextElementSibling;
            if (wrapper.style.display === 'block') {
                wrapper.style.display = 'none';
                btn.innerText = t.showAnsBtn;
            } else {
                wrapper.style.display = 'block';
                btn.innerText = t.hideAnsBtn;
            }
        }

        function initWeekOptions() {
            const selector = document.getElementById('weekFilter');
            selector.innerHTML = "";
            const weekMap = {};
            rawDatabase.forEach(item => {
                if (item.week && !weekMap[item.week]) weekMap[item.week] = item.class_date;
            });
            Object.keys(weekMap).sort().forEach(w => {
                const opt = document.createElement('option');
                opt.value = w;
                opt.innerText = `${w.toUpperCase()}${weekMap[w] ? ` (${weekMap[w]})` : ''}`;
                selector.appendChild(opt);
            });
        }

        function setTab(tabName, element) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const selectedWeek = document.getElementById('weekFilter').value;
            filteredPool = rawDatabase.filter(item => (item.week === selectedWeek) && (item.type === currentTab));
            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            const cardEl = document.getElementById('cardElement');
            cardEl.scrollTop = 0;
            clearAllCanvas();
            const t = i18nDict[currentLang];

            if (!filteredPool.length) {
                document.getElementById('categoryBadge').innerText = t.noData;
                document.getElementById('dateDisplay').innerText = "";
                document.getElementById('titleDisplay').innerText = t.noContent;
                document.getElementById('takeawaysSection').style.display = "none";
                document.getElementById('mainContentSection').style.display = "none";
                document.getElementById('quizSection').style.display = "none";
                document.getElementById('vocabSection').style.display = "none";
                document.getElementById('taskSection').style.display = "none";
                document.getElementById('linkSection').style.display = "none";
                document.getElementById('counterDisplay').innerText = "0 / 0";
                return;
            }

            const item = filteredPool[currentIndex];
            const badge = document.getElementById('categoryBadge');
            badge.innerText = cleanText((currentLang === 'en' && item.category_en) ? item.category_en : item.category);

            if (item.category.includes("自習") || item.category.includes("Self-Study")) {
                badge.className = 'badge task-badge';
            } else if (item.type === 'media') {
                badge.className = 'badge media-badge';
            } else {
                badge.className = 'badge';
            }

            document.getElementById('dateDisplay').innerText = item.class_date ? ` • ${item.class_date}` : '';
            document.getElementById('counterDisplay').innerText = (currentIndex + 1) + " / " + filteredPool.length;
            document.getElementById('titleDisplay').innerText = cleanText((currentLang === 'en' && item.title_en) ? item.title_en : item.title);

            const tkSection = document.getElementById('takeawaysSection');
            const tkText = (currentLang === 'en' && item.key_takeaways_en) ? item.key_takeaways_en : item.key_takeaways;
            if (tkText) {
                tkSection.style.display = "block";
                document.getElementById('takeawaysDisplay').innerText = cleanText(tkText);
            } else {
                tkSection.style.display = "none";
            }

            const mcSection = document.getElementById('mainContentSection');
            if (item.main_content) {
                mcSection.style.display = "block";
                renderMainContent(item.main_content);
            } else {
                mcSection.style.display = "none";
            }

            // 句型練習題
            const quizSection = document.getElementById('quizSection');
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.innerHTML = "";
            if (item.type === 'sentence' && item.practice_quiz && item.practice_quiz.length > 0) {
                quizSection.style.display = "block";
                item.practice_quiz.forEach(q => {
                    const qText = (currentLang === 'en' && q.question_en) ? q.question_en : q.question;
                    const ansText = (currentLang === 'en' && q.answer_en) ? q.answer_en : q.answer;
                    const qCard = document.createElement('div');
                    qCard.className = 'quiz-card';
                    qCard.innerHTML = `
                        <div class="quiz-q">${formatQuestionText(qText)}</div>
                        <button class="quiz-toggle-btn" onclick="toggleAnswer(this)">${t.showAnsBtn}</button>
                        <div class="quiz-ans-wrapper">
                            <div class="quiz-ans-box">${cleanText(ansText)}</div>
                        </div>
                    `;
                    quizContainer.appendChild(qCard);
                });
            } else {
                quizSection.style.display = "none";
            }

            // 重點單字與注意事項
            const vbSection = document.getElementById('vocabSection');
            const vocabUl = document.getElementById('vocabDisplay');
            vocabUl.innerHTML = "";
            const vList = (currentLang === 'en' && item.vocab_notes_en) ? item.vocab_notes_en : item.vocab_notes;
            if (vList && vList.length > 0) {
                vbSection.style.display = "block";
                vList.forEach(note => {
                    const li = document.createElement('li');
                    li.innerHTML = formatVocabItem(note);
                    vocabUl.appendChild(li);
                });
            } else {
                vbSection.style.display = "none";
            }

            // 下週課堂延續示範任務
            const taskSection = document.getElementById('taskSection');
            const taskContainer = document.getElementById('taskContainer');
            taskContainer.innerHTML = "";
            const taskList = (currentLang === 'en' && item.next_week_tasks_en) ? item.next_week_tasks_en : item.next_week_tasks;
            if (taskList && taskList.length > 0) {
                taskSection.style.display = "block";
                taskContainer.innerHTML = cleanText(taskList.join('\n\n'));
            } else {
                taskSection.style.display = "none";
            }

            // 延伸閱讀與影音連結按鈕
            const linkSection = document.getElementById('linkSection');
            const linkTag = document.getElementById('linkDisplay');
            if (item.link) {
                linkSection.style.display = "block";
                linkTag.href = item.link;
                linkTag.innerText = (currentLang === 'en') ? "🔗 " + t.openResBtn : "🔗 " + (cleanText(item.link_text) || t.openResBtn);
            } else {
                linkSection.style.display = "none";
            }

            setTimeout(resizeCanvas, 60);
        }

        function navigateCard(direction) {
            if (!filteredPool.length) return;
            currentIndex = (currentIndex + direction + filteredPool.length) % filteredPool.length;
            renderCard();
        }

        window.onload = () => {
            initWeekOptions();
            updateUIStrings();
            applyFilters();
            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
            checkAppVersion();
        };
    </script>
</body>
</html>
