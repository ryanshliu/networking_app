<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Networking English - AI Learning Suite</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #1e1b4b;
            --text-body: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --amber-bg: #fffbeb; --amber-border: #fef3c7; --amber-text: #b45309;
            --sky-bg: #f0f9ff; --sky-border: #e0f2fe; --sky-text: #0369a1;
            --emerald-bg: #ecfdf5; --emerald-border: #d1fae5; --emerald-text: #047857;
            --violet-bg: #faf5ff; --violet-border: #e9d5ff; --violet-text: #6b21a8;
            --bubble-a-bg: #ffffff; --bubble-a-border: #cbd5e1; --bubble-a-text: #0f172a;
            --bubble-b-bg: #eef2ff; --bubble-b-border: #c7d2fe; --bubble-b-text: #1e1b4b;
            --app-max-width: 460px;
        }
        @media (min-width: 640px) {
            :root { --app-max-width: 680px; }
            body { padding: 24px 20px !important; }
            h1 { font-size: 28px !important; }
            .card { padding: 28px 26px !important; max-height: 72vh !important; border-radius: 28px !important; }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); margin: 0; padding: 16px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }
        .app-layout { width: 100%; max-width: var(--app-max-width); display: flex; flex-direction: column; }
        .header { width: 100%; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 25px; font-weight: 800; color: var(--text-title); margin: 4px 0 2px 0; }
        .author-badge {
            display: inline-block; font-size: 12px; font-weight: 700; color: var(--primary);
            background-color: var(--primary-soft); padding: 3px 12px; border-radius: 12px; margin-bottom: 8px;
        }
        .main-mode-nav { display: flex; gap: 6px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; margin-bottom: 10px; }
        .main-mode-btn {
            flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 800; border: none; border-radius: 12px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .main-mode-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 3px 10px rgba(79, 70, 229, 0.15); }
        .pen-toolbar { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 12px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
        }
        .tool-btn.active-pen { background-color: #ffe4e6; border-color: #e11d48; color: #e11d48; }
        .filters { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        select {
            width: 100%; box-sizing: border-box; padding: 13px 16px; font-size: 16px; font-weight: 700;
            border-radius: 16px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none;
        }
        .tab-group { width: 100%; box-sizing: border-box; display: flex; gap: 8px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 11px 6px; font-size: 15px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12); }
        .card-container { width: 100%; flex: 1; display: flex; flex-direction: column; position: relative; }
        .card {
            background-color: var(--card-bg); border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        #drawCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100; }
        .card.canvas-active #drawCanvas { pointer-events: auto; touch-action: none; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .badge.media-badge { background-color: #fef3c7; color: #92400e; }
        .counter { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .title { font-size: 21px; font-weight: 800; color: var(--text-title); margin-bottom: 14px; line-height: 1.35; }
        .block-section { margin-bottom: 18px; text-align: left; }
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 12.5px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
        .tag-violet { background-color: var(--violet-bg); color: var(--violet-text); border: 1px solid var(--violet-border); }
        .block-desc { font-size: 15.5px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }
        
        .dialogue-container { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .chat-bubble-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
        .chat-bubble-row.speaker-b { flex-direction: row-reverse; }
        .speaker-avatar {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; color: #ffffff; flex-shrink: 0; margin-top: 4px;
        }
        .speaker-avatar.avatar-a { background: #2563eb; }
        .speaker-avatar.avatar-b { background: #7c3aed; }
        .chat-bubble-content {
            max-width: 82%; padding: 11px 15px; border-radius: 16px; font-size: 15.5px; line-height: 1.5; font-weight: 600;
        }
        .speaker-a .chat-bubble-content { background-color: var(--bubble-a-bg); border: 1.5px solid var(--bubble-a-border); }
        .speaker-b .chat-bubble-content { background-color: var(--bubble-b-bg); border: 1.5px solid var(--bubble-b-border); }
        
        .vocab-ul { margin: 0; padding-left: 20px; font-size: 15px; color: var(--text-body); line-height: 1.7; }
        .vocab-ul li { margin-bottom: 10px; line-height: 1.6; }
        .highlight-term { color: #3730a3 !important; font-weight: 800 !important; }
        .ipa-tag { color: #6d28d9; font-weight: 700; margin: 0 2px; }

        .quiz-card {
            background-color: var(--violet-bg); border: 1.5px solid var(--violet-border);
            border-radius: 18px; padding: 16px; margin-bottom: 12px;
        }
        .quiz-q { font-size: 15.5px; font-weight: 700; color: #4c1d95; line-height: 1.6; margin-bottom: 10px; }
        .blank-line { display: inline-block; min-width: 80px; border-bottom: 2.5px solid #7c3aed; margin: 0 4px; }
        .quiz-toggle-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff; border: none; padding: 7px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer;
        }
        .quiz-ans-wrapper { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d8b4fe; }
        .quiz-ans-box {
            background: #ffffff; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #bbf7d0;
            font-size: 15px; color: #14532d; line-height: 1.65; white-space: pre-line; font-weight: 600;
        }

        .link-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-color); text-align: left; }
        .link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
            padding: 13px 18px; font-size: 15px; color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            text-decoration: none; font-weight: 700; border-radius: 14px;
        }

        /* 8 大模式 UI */
        .suite-scope-nav { display: flex; gap: 6px; background-color: #f1f5f9; padding: 4px; border-radius: 14px; margin-bottom: 10px; }
        .suite-scope-btn {
            flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 800; border: none; border-radius: 10px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .suite-scope-btn.active { background: #ffffff; color: var(--primary); }
        .suite-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .suite-btn {
            background: #ffffff; border: 1.5px solid #cbd5e1; padding: 10px 8px; border-radius: 14px;
            font-size: 13px; font-weight: 800; color: #334155; cursor: pointer; text-align: left;
        }
        .suite-btn.active { background: #eef2ff; border-color: #6366f1; color: #4338ca; }
        .suite-panel { background: #ffffff; border: 1.5px solid var(--border-color); border-radius: 20px; padding: 18px; }

        .podcast-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: #ffffff; padding: 20px 16px; border-radius: 20px; text-align: center;
        }
        .podcast-controls {
            display: flex; flex-direction: column; gap: 10px; align-items: center; margin: 12px 0;
            background: rgba(0, 0, 0, 0.25); padding: 14px; border-radius: 16px;
        }
        .control-row { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 13.5px; color: #c7d2fe; }
        .accent-select { background: #ffffff; color: #1e1b4b; font-weight: 800; padding: 6px 10px; border-radius: 10px; border: none; }
        .podcast-play-btn {
            background: #10b981; color: #fff; border: none; padding: 13px 26px; border-radius: 24px;
            font-size: 15.5px; font-weight: 800; cursor: pointer;
        }
        .podcast-play-btn.playing { background: #ef4444 !important; }

        .nav-controls { width: 100%; display: flex; gap: 12px; margin-top: 12px; }
        .nav-btn { flex: 1; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="header">
            <h1>Networking English</h1>
            <div class="author-badge">By Ryan Liu, V1.5</div>
            <div class="main-mode-nav">
                <button class="main-mode-btn active" onclick="switchAppMode('cards', this)">📚 學習卡片</button>
                <button class="main-mode-btn" onclick="switchAppMode('suite', this)">⚡ 8大學習模組</button>
                <button class="main-mode-btn" onclick="switchAppMode('exam', this)">📝 全真模擬考</button>
            </div>
            <div class="pen-toolbar">
                <button id="penBtn" class="tool-btn" onclick="togglePenMode()">🖍️ 細畫筆</button>
                <button class="tool-btn" onclick="undoLastStroke()">↩️ 復原</button>
                <button class="tool-btn" onclick="clearAllCanvas()">🗑️ 全清</button>
            </div>
        </div>

        <!-- 視圖 1: 學習卡片模式 -->
        <div id="viewCards">
            <div class="filters">
                <select id="weekFilter" onchange="applyFilters()"></select>
                <div class="tab-group">
                    <button id="tabSentence" class="tab-btn active" onclick="setTab('sentence')">句型 / 文法</button>
                    <button id="tabMedia" class="tab-btn" onclick="setTab('media')">影音 / 自習</button>
                </div>
            </div>

            <div class="card-container">
                <div class="card" id="cardElement">
                    <canvas id="drawCanvas"></canvas>
                    <div>
                        <div class="card-header">
                            <div>
                                <span class="badge" id="categoryBadge">分類</span>
                                <span style="font-size: 12.5px; color: #64748b;" id="dateDisplay"></span>
                            </div>
                            <span class="counter" id="counterDisplay">0 / 0</span>
                        </div>
                        <div class="title" id="titleDisplay">標題</div>

                        <div class="block-section" id="takeawaysSection">
                            <div class="tag-title tag-amber">💡 核心重點說明</div>
                            <div class="block-desc" id="takeawaysDisplay"></div>
                        </div>

                        <div class="block-section" id="mainContentSection">
                            <div class="tag-title tag-sky">📖 學習內容與核心對話</div>
                            <div id="mainContentContainer"></div>
                        </div>

                        <div class="block-section" id="quizSection">
                            <div class="tag-title tag-violet">✍️ 實戰練習題</div>
                            <div id="quizContainer"></div>
                        </div>

                        <div class="block-section" id="vocabSection">
                            <div class="tag-title tag-emerald">📝 重點單字與注意事項</div>
                            <ul class="vocab-ul" id="vocabDisplay"></ul>
                        </div>

                        <div class="block-section" id="taskSection">
                            <div class="tag-title tag-violet">🎯 下週課堂延續示範任務</div>
                            <div id="taskContainer" class="block-desc"></div>
                        </div>
                    </div>

                    <div class="link-box" id="linkSection">
                        <a class="link-btn" id="linkDisplay" href="#" target="_blank">🔗 開啟延伸閱讀與學習資源</a>
                    </div>
                </div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
                <button class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
            </div>
        </div>

        <!-- 視圖 2: 8 大特訓模組 -->
        <div id="viewSuite" style="display: none;">
            <div class="suite-scope-nav">
                <button id="scopeCurrentBtn" class="suite-scope-btn active" onclick="setSuiteScope('current', this)">📌 當前選定週次</button>
                <button id="scopeAllBtn" class="suite-scope-btn" onclick="setSuiteScope('all', this)">🌐 全部課程大整合</button>
            </div>

            <div class="suite-grid">
                <button class="suite-btn active" onclick="loadSuiteTool('guide', this)">📖 速成指南</button>
                <button class="suite-btn" onclick="loadSuiteTool('socratic', this)">🏛️ 蘇格拉底問答</button>
                <button class="suite-btn" onclick="loadSuiteTool('forecaster', this)">🎯 考點預測 Top5</button>
                <button class="suite-btn" onclick="loadSuiteTool('confusion', this)">💡 盲點澄清器</button>
                <button class="suite-btn" onclick="loadSuiteTool('gap', this)">🔍 知識缺口診斷</button>
                <button class="suite-btn" onclick="loadSuiteTool('podcast', this)">🎙️ Audio Podcast</button>
            </div>

            <div class="suite-panel" id="suiteContentPanel"></div>
        </div>

        <!-- 視圖 3: 全真模擬考卷 -->
        <div id="viewExam" style="display: none;">
            <div class="card" style="max-height: 75vh;">
                <h2 style="font-size: 20px; color: #1e1b4b; margin-top:0;">📝 Networking English 全真模擬檢測試卷</h2>
                <div id="examContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const rawDatabase = [{"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "社交問候 (Greetings)", "category_en": "Greetings & Small Talk", "title": "初次見面與熟人寒暄 (Greetings & Responses)", "title_en": "Greetings & Daily Catch-ups", "key_takeaways": "【TOEIC 400 句型與重點拆解】\n1. 詢問近況的道地句型：'How’s it going?' (最近好嗎？) / 'How are things with you?' (你那邊一切都好嗎？)\n2. 萬用中性回答公式：避免機械化回答 I'm fine。請記住三種自然說法：\n   - Same old, same old. (老樣子)\n   - Pretty much the same. (差不多就那樣)\n   - Can't complain. (挺好的/沒什麼好抱怨的)", "key_takeaways_en": "Learn natural casual updates instead of just saying 'I'm fine'. Master phrases like 'Same old' and 'Can't complain'.", "main_content": "A: Hi, my name is John. And you are?\nB: I'm Ryan. I'm from IT.\nA: How’s it going?\nB: Pretty good. And you?\nA: Can’t complain. Oops, I’ve got to go. See you around.\nB: Sure! Have a good one!", "vocab_notes": ["Complain [kəmˈplen] (v.) [基礎單字]：抱怨。\n  句型：Can't complain. (直譯：無法抱怨 ➔ 衍生意：一切都很好)。\n  例句：Business is good, so I *can't complain*.", "Same old, same old [sem old] (片語)：老樣子、一切照舊。\n  例句：How’s work? — Oh, *same old, same old*.", "Uneventful [ˌʌnɪˈvɛntfəl] (adj.) [進階單字]：平靜無事的 (un-否定 + event事件 + ful形容詞字尾)。\n  例句：My weekend was *uneventful*, just stayed at home.", "Have a good one (片語)：祝你有美好的一天 (口語道別常用)。\n  例句：Thanks for your help. *Have a good one*!"], "vocab_notes_en": ["Complain: To express dissatisfaction.", "Same old, same old: Common idiom indicating routine."], "practice_quiz": [{"question": "【填空題】同事問你 How’s work going?，你想回答「老樣子，一切照舊」：\n_________ , _________ ! Pretty much the same.", "answer": "✔ 填空解答：Same old, same old\n👉 整句回答：Same old, same old! Pretty much the same."}], "instant_guide": {"core_concepts": ["1. 破冰開場語意強度階梯。", "2. 避免機械化回答 I'm fine。"], "misconceptions": ["誤解：每次被問近況都只能回答 I'm fine, thank you."], "exam_questions": ["Q1: 請列舉 3 種以上回答 How are you? 的道地替代說法。"]}, "socratic_quiz": [{"level": "社交應對 (Level 1)", "prompt": "為什麼母語人士很少在日常寒暄中回答 'I'm fine, thank you'？", "feedback": "因為聽起來過於制式與距離感，使用 'Can't complain' 能展現更多人情味與互動。"}], "confusion_fixer": {"analogy": "【生活類比】：問候就像拋接球，制式回答會把球直接接死，而道地回覆則能順暢地把話題拋回給對方。", "real_example": "Hey Ryan, how are things? ➔ Can't complain, just wrapping up the weekly safety audit.", "common_mistake": "錯誤：How do you do? 用於熟人寒暄（✖ 僅用於非常正式的初次見面握手）。"}, "gap_finder": ["⚠️ 潛在缺口：缺少主動拋出反問（And you?）的習慣。"], "link": "https://www.linkedin.com/pulse/18-ways-say-hello-english-thomas-spengler/", "link_text": "18 Ways to Say Hello in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "影音自習 (Video Study)", "category_en": "Video Self-Study", "title": "商務社交情境：巴黎會面 (BP A2 5.4.1)", "title_en": "Business Socializing in Paris (BP A2 5.4.1)", "key_takeaways": "【TOEIC 400 劇情與句型拆解】\n1. 詢問抵達時間：'When did you arrive?' (你何時抵達的？) 搭配過去式動詞。\n2. 表達住宿地點：'Where are you staying?' (你住在哪裡？) 搭配現在進行式表示短暫停留。\n3. 邀約句型：'Would you like to join us for...?' (你想跟我們一起去...嗎？)\n4. 答應邀約：'Count me in!' (算我一份！)", "key_takeaways_en": "Summary: Julia arrives in Paris. Learn past tense for arrivals and polite invitation phrases.", "main_content": "A: When did you arrive in Paris?\nB: I flew in yesterday afternoon. Traffic from the airport was heavy.\nA: Where are you staying?\nB: At the Mason Park Hotel. It’s okay. The room is small, but comfortable, and it’s a 5-minute walk to the venue.\nA: Do you have plans for dinner tonight?\nB: Would you like to join us for French bistro dishes? Count me in!", "vocab_notes": ["Arrive [əˈraɪv] (v.) [基礎單字]：抵達、到達。\n  句型搭配：arrive in + 大地方 (如 Paris) / arrive at + 小地方 (如 hotel)。\n  例句：When did you *arrive in* Taiwan?", "Traffic [ˈtræfɪk] (n.) [基礎單字]：交通狀況、車流。\n  搭配詞：heavy traffic (塞車/車流量大)。\n  例句：*Traffic* from the airport was very heavy.", "Venue [ˈvɛnju] (n.) [TOEIC必考]：會場、舉辦地點。\n  例句：It’s a 5-minute walk to the exhibition *venue*.", "Count me in (片語) [實用口語]：算我一份。\n  例句：Are you going to the party? Yes, *count me in*!"], "vocab_notes_en": ["Arrive: To reach a destination.", "Venue: The place where an event happens."], "next_week_tasks": ["💡 課堂任務：準備好 30 秒的英文自我介紹，包含你何時抵達、住在哪間飯店以及飯店評價。"], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U5L4_5.4.1.mp4", "link_text": "觀看 Business Partner 5.4.1 影片 (MP4)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation)", "category_en": "Travel & Logistics", "title": "研討會住宿與地鐵動線描述 (AIChE Minneapolis)", "title_en": "AIChE Conference Transit & Hotel Proximity", "key_takeaways": "【TOEIC 400 句型與重點拆解】\n1. 描述距離很近的黃金片語：'within walking distance' (在步行可達的距離內)。\n2. 說明搭乘交通工具：'take the subway' (搭地鐵) / 'take the Blue Line' (搭乘藍線)。\n3. 說明不需換車：'directly' (直接地) + 'You don't need to transfer.' (你不需要轉車)。", "key_takeaways_en": "Expressing walkability (within walking distance) and direct subway transit without transfers.", "main_content": "A: The hotel is near the subway station and within walking distance.\nB: From the hotel, can I take the subway directly to the conference venue?\nA: Yes, you can take the Blue Line directly. You don't need to transfer.\nB: That is very convenient. I have no idea about their room price.", "vocab_notes": ["Near [nɪr] (prep./adj.) [基礎單字]：靠近、在...附近。\n  例句：The hotel is *near* the subway station.", "Distance [ˈdɪstəns] (n.) [基礎單字]：距離。\n  片語：within walking distance (走路就能到)。\n  例句：The restaurant is *within walking distance*.", "Directly [dəˈrɛktli] (adv.) [TOEIC 400核心]：直接地、直達地。\n  例句：You can take the train *directly* to the airport.", "Transfer [trænsˈfɚ] (v.) [商務/差旅必考]：轉乘、換車。\n  例句：You don't need to *transfer* to another line."], "vocab_notes_en": ["Distance: The length of the space between two points.", "Transfer: Change from one vehicle or line to another."], "practice_quiz": [{"question": "【填空題】如果你想告訴外國客戶「飯店離會場走路就能到」，請填寫：\nThe hotel is _________ _________ distance to the venue.", "answer": "✔ 填空解答：within walking\n💡 解析：這是商務差旅與飯店指南中最核心的表達方式。"}], "instant_guide": {"core_concepts": ["1. 住宿地點優勢描述。", "2. 大眾運輸直達與免轉乘表達。"], "misconceptions": ["誤解：將轉車說成 change train（商務正式用語優先用 transfer）。"], "exam_questions": ["Q1: 請用一句話說明飯店離地鐵站非常近，步行只要 5 分鐘。"]}, "socratic_quiz": [{"level": "差旅規劃 (Level 1)", "prompt": "在預訂國際研討會飯店時，為什麼向主辦方確認 'within walking distance' 比離機場近更關鍵？", "feedback": "因為研討會每日行程緊湊且常有夜間社交，步行可達能省下大量等車與轉車的時間成本。"}], "confusion_fixer": {"analogy": "【生活類比】：出差選飯店就像選高鐵站旁邊的停車場，'within walking distance'（走路就到）永遠比轉車更具時間效益！", "real_example": "We selected the Hyatt because it is *within walking distance* to the venue.", "common_mistake": "錯誤：The hotel is in walking distance.（介系詞必須搭配 within）。"}, "gap_finder": ["⚠️ 潛在缺口：口語常常忘記 directly (副詞) 來修飾搭乘交通工具。"], "link": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf?v=1726683206", "link_text": "Minneapolis Skyway & Hotel Map (PDF)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "BBC 職場自習 (BBC Networking)", "category_en": "BBC Networking Self-Study", "title": "商務社交實戰：Tip Top Trading (BBC #48)", "title_en": "Networking Face-to-Face (BBC #48)", "key_takeaways": "【TOEIC 400 劇情與句型拆解】\n1. 主題：Tip Top Trading 公司參加產業大會，要在經濟不景氣（Tough economic climate）下尋找新客戶。\n2. 鼓勵嘗試句型：'I’ll give it a shot.' (我會試試看/我來試試)。\n3. 切入正題句型：'Let’s get down to business.' (我們開始談正事吧)。", "key_takeaways_en": "Summary: Anna attends a conference to network. Learn basic phrases to start talking business.", "main_content": "A: We need to do some networking and meet new clients. Just be chatty and friendly.\nB: I’m a bit nervous, but I’ll give it a shot.\nA: Good! Let’s get down to business.\nA: Remember, it is a tough economic climate, and we need new opportunities.", "vocab_notes": ["Networking [ˈnɛtˌwɜrkɪŋ] (n.) [商務核心]：建立人脈、拓展業務關係。\n  例句：Going to the trade fair is good for *networking*.", "Tough [tʌf] (adj.) [基礎單字]：艱困的、棘手的。\n  搭配詞：tough climate (艱困的環境) / tough job (困難的工作)。\n  例句：It is a *tough* economic climate right now.", "Opportunity [ˌɑpɚˈtunəti] (n.) [TOEIC 400核心]：機會。\n  例句：We need to find new business *opportunities*.", "Give it a shot (片語) [口語極高頻]：嘗試一下。\n  例句：I have never done this before, but I will *give it a shot*."], "vocab_notes_en": ["Networking: Interacting with others to exchange information and develop professional contacts.", "Tough: Difficult to do or deal with."], "link": "https://www.bbc.co.uk/learningenglish/english/features/english-at-work/48-language-for-networking", "link_text": "前往 BBC #48 課程網頁 (收聽音檔與劇本)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "工作日常與職責 (Work Routine)", "category_en": "Work Routine & Duties", "title": "日常工作職責與頻率副詞 (What Do You Do? - BP Unit 1)", "title_en": "Work Routine & Frequency Adverbs (BP Unit 1)", "key_takeaways": "【TOEIC 400 句型與重點拆解】\n1. 詢問職業句型：'What do you do for a living?' (你是做什麼工作的？)\n2. 表達負責項目：'I'm responsible for...' + 名詞/V-ing (我負責...)。\n3. 頻率副詞運用：表示動作發生的頻率，依照機率高低為：Always(總是) > Usually(通常) > Often(經常) > Sometimes(有時) > Rarely(很少) > Never(從不)。", "key_takeaways_en": "1. Describing daily responsibilities: 'I am responsible for...'\n2. Using frequency adverbs correctly (always, usually, rarely).", "main_content": "A: What do you do for a living?\nB: I work as a manager. I'm responsible for a team of 5 people.\nA: What does your typical workday look like?\nB: I sometimes go to meetings with clients. I analyze sales data, and I often write reports.", "vocab_notes": ["Responsible [rɪˈspɑnsəbəl] (adj.) [TOEIC必備]：負責的。\n  句型：be responsible for (對...負責)。\n  例句：I am *responsible for* the sales department.", "Analyze [ˈænəˌlaɪz] (v.) [TOEIC 400核心]：分析。\n  例句：My job is to *analyze* data and write reports.", "Typical [ˈtɪpɪkəl] (adj.) [基礎單字]：典型的、平常的。\n  例句：What is your *typical* workday like?", "Rarely [ˈrɛrli] (adv.) [頻率副詞]：很少、難得。\n  例句：I *rarely* travel for work. (我很少因為工作出差。)"], "vocab_notes_en": ["Responsible for: Having an obligation to do something.", "Analyze: Examine information to explain it."], "practice_quiz": [{"question": "【單字填空題】請填入正確的商務頻率副詞（很少）：\nOur team works hard, we _________ take long breaks.", "answer": "✔ 填空解答：rarely (很少)\n💡 解析：rarely 表達頻率非常低，等同於 seldom。"}], "instant_guide": {"core_concepts": ["1. 職責表達句型。", "2. 頻率副詞的順序（放於一般動詞前）。"], "misconceptions": ["誤解：將 hardly（幾乎不）誤以為是 hard（努力地）的副詞。"], "exam_questions": ["Q1: 請用英文說明你每天負責的兩項工作。"]}, "socratic_quiz": [{"level": "文法除錯 (Level 1)", "prompt": "當同事對你說 'He works hardly' 時，為什麼這句話在語意上有問題？", "feedback": "因為 hardly 意為「幾乎不」，He works hardly 會變成「他幾乎不工作」，正確表達努力工作應為 'He works hard'。"}], "confusion_fixer": {"analogy": "【生活類比】：hard 像是加足馬力往前衝 (努力)，hardly 像是煞車踩到底幾乎沒在動 (幾乎不)。", "real_example": "We work *hard*, so we *hardly* have time to rest.", "common_mistake": "錯誤：I hardly work hard. (語意邏輯打架)。"}, "gap_finder": ["⚠️ 潛在缺口：頻率副詞放錯位置（正確：主詞 + 頻率副詞 + 一般動詞）。"]}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "展會深度洽談 (Trade Fair In-depth)", "category_en": "Trade Fair In-depth Discussion", "title": "規格需求詢問與價值主張 (Exploring Client Needs & Value Pitch)", "title_en": "Exploring Client Needs & Value Proposition", "key_takeaways": "【TOEIC 400 句型與重點拆解】\n1. 詢問對方困難：'What challenges are you facing?' (你面臨什麼挑戰？)\n2. 介紹自家產品優勢：使用 'comply with' (符合法規) 與 'reduce' (減少)。\n3. 強調好安裝：'integrate seamlessly' (無縫整合/完美相容)。", "key_takeaways_en": "1. Uncovering client pain points.\n2. Articulating product benefits (comply with, seamlessly).", "main_content": "A: What specific challenges are you currently facing with your production lines?\nB: We have a safety issue with chemical vapor.\nA: Our new system complies with the latest environmental regulations.\nB: Really? Does it integrate seamlessly with our old machines?\nA: Absolutely. It reduces emissions by 95%.", "vocab_notes": ["Challenge [ˈtʃælɪndʒ] (n.) [基礎單字]：挑戰、難題。\n  例句：What *challenges* are you facing today?", "Comply with [kəmˈplaɪ wɪð] (v. phr.) [TOEIC 必考片語]：遵守、符合（法規/標準）。\n  句型：comply WITH + 規則/法律。\n  例句：Our machines fully *comply with* OSHA safety rules.", "Seamlessly [ˈsimləsli] (adv.) [進階單字]：無縫地、順暢地。\n  例句：The software integrates *seamlessly* into your computer.", "Reduce [rɪˈdus] (v.) [基礎單字]：減少、降低。\n  例句：This system helps *reduce* air pollution."], "vocab_notes_en": ["Comply with: Act in accordance with rules.", "Seamlessly: Smoothly and continuously."], "practice_quiz": [{"question": "【填空題】新設備「符合」環保法規，請填入動詞片語 comply ___：\nThe new unit strictly _________ _________ environmental regulations.", "answer": "✔ 填空解答：complies with\n💡 解析：comply 必須搭配介系詞 with，這是多益閱讀極常考的搭配詞。"}], "instant_guide": {"core_concepts": ["1. 詢問痛點提問法。", "2. 說明符合法規與好安裝。"], "misconceptions": ["誤解：comply 搭配 to（正確應為 comply with）。"], "exam_questions": ["Q1: 請造句說明新設備能無縫整合 (integrate seamlessly)。"]}, "confusion_fixer": {"analogy": "【生活類比】：介紹新設備就像幫手機換充電線，integrates seamlessly（無縫整合相容）比強調線材外觀更讓客戶安心！", "real_example": "Our equipment *complies with* regulations and integrates *seamlessly*.", "common_mistake": "錯誤：The system complies to the standard.（✖ comply 必須搭配 with）。"}, "gap_finder": ["⚠️ 潛在缺口：只會說 good，不會用具體動詞如 reduce (減少) 來量化效益。"]}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "行程重約與確認 (Rescheduling)", "category_en": "Scheduling & Rescheduling Meetings", "title": "會議重約、推遲與專業應對 (Rescheduling & Appointments)", "title_en": "Professional Meeting Rescheduling", "key_takeaways": "【TOEIC 400 句型與重點拆解】\n1. 說明臨時有事：'Something urgent has come up.' (臨時有急事發生)。\n2. 提議延後會議：'Would it be possible to push our meeting back to...' (有沒有可能把會議延後到...)\n3. 表達感謝配合：'Thank you for your flexibility!' (感謝你的彈性/配合)。", "key_takeaways_en": "1. Politely reschedule or postpone meetings.\n2. Expressing appreciation for flexibility.", "main_content": "A: Good morning Alex. Has something urgent come up at the plant?\nB: Yes, an unexpected audit requires my presence. Would it be possible to push our meeting back to Thursday morning?\nA: Thursday morning works perfectly. Shall we say 10:30 AM?\nB: That suits me well. I'll send out an updated calendar invite shortly. Thank you for your flexibility!", "vocab_notes": ["Urgent [ˈɜrdʒənt] (adj.) [TOEIC 400核心]：緊急的、急迫的。\n  例句：*Something urgent* has come up, so I must leave now.", "Push back [pʊʃ bæk] (v. phr.) [商務必備]：推遲、延後（會議時程）。\n  句型：push + 會議 + back + to + 新時間。\n  例句：Can we *push back* the meeting to 3 PM?", "Flexibility [ˌflɛksəˈbɪləti] (n.) [進階單字]：彈性、靈活度。\n  例句：Thank you for your *flexibility* with my schedule change.", "Suit [sut] (v.) [商務單字]：適合、對...方便。\n  例句：Does 10:30 AM *suit* you? (早上10點半你方便嗎？)"], "vocab_notes_en": ["Urgent: Requiring immediate action or attention.", "Push back: Postpone or reschedule an event to a later time."], "practice_quiz": [{"question": "【填空題】因為突發狀況，你想提議「把會議延後到週四」：\nWould it be possible to _________ the meeting _________ to Thursday?", "answer": "✔ 填空解答：push, back\n💡 解析：push back 是商務上最專業的延後用語，比 delay 更好。"}], "instant_guide": {"core_concepts": ["1. 改期的黃金三步驟：致歉 ➔ 提議新時間 ➔ 感謝配合。"], "misconceptions": ["誤解：改期只說 I can't come，卻沒有主動給出新時間。"], "exam_questions": ["Q1: 當對方同意改期後，你要用哪一句英文感謝對方的彈性配合？"]}, "socratic_quiz": [{"level": "情境應對 (Level 1)", "prompt": "臨時推遲會議時，為什麼主動加上 'Thank you for your flexibility' 能大幅降低對方的負面觀感？", "feedback": "這展現了對他人時間的尊重，將原本造成的不便轉化為對對方配合度的稱讚與感謝。"}], "confusion_fixer": {"analogy": "【生活類比】：改會議就像改約吃飯，不能只說不去了，要主動說「改明天可以嗎？謝謝你的配合！」", "real_example": "Would it be possible to *push back* our meeting? *Thank you for your flexibility*!", "common_mistake": "錯誤：Can we delay the meeting?（delay 帶有消極拖延色彩，改期請用 push back）。"}, "gap_finder": ["⚠️ 潛在缺口：口語習慣使用 delay，缺乏使用 push back 的語感。"]}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "官方影音自習 (BP Video 1.1.1)", "category_en": "Official Video 1.1.1", "title": "日常工作與職責描述 (BP Video 1.1.1 & Script)", "title_en": "Business Partner A2 Video 1.1.1", "key_takeaways": "【TOEIC 400 影音重點拆解】\n1. 影片任務：聆聽三位主角描述自己的工作日常（Routine）。\n2. 必學動詞搭配：'process orders' (處理訂單), 'take notes' (做筆記)。\n3. 時間介系詞：'starts work AT 7:30'。", "key_takeaways_en": "Summary: Watch Video 1.1.1 and compare work routines.", "main_content": "• 聽力精選對話句型:\nA: Who starts work at 7:30?\nB: Liz does. She processes orders for the sales team.\nA: Who frequently travels to other countries for work?\nB: Muj travels a lot. He also analyses data and writes reports.", "vocab_notes": ["Process [ˈprɑsɛs] (v.) [TOEIC 400核心]：處理 (文件、訂單)。\n  搭配詞：process orders (處理訂單)。\n  例句：She often *processes orders* for the sales team.", "Take notes [tek noʊts] (v. phr.) [基礎片語]：做筆記、做會議記錄。\n  例句：Please *take notes* during the client meeting.", "Transcript [ˈtrænsˌkrɪpt] (n.) [名詞]：逐字稿（對應學習影片）。"], "vocab_notes_en": ["Process orders: To handle customer requests for goods.", "Take notes: To record information during a meeting."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U1L1_1.1.1.mp4", "link_text": "觀看 Business Partner Video 1.1.1 (MP4)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "線上會議工具與除錯 (Usherwood)", "category_en": "Video Conferencing Issues", "title": "視訊會議 6 大常見問題與排解 (Usherwood Guide)", "title_en": "Video Conferencing Troubleshooting Guide", "key_takeaways": "【TOEIC 400 文章重點拆解】\n1. 主題：跨國視訊會議最常遇到的技術問題（Technical issues）。\n2. 實用除錯句型：'My audio is cutting out.' (我的聲音斷斷續續)。\n3. 提醒對方開麥克風：'You are on mute.' (你被靜音了)。", "key_takeaways_en": "Summary: Learn professional expressions for troubleshooting 6 common video glitches.", "main_content": "• 實用視訊障礙排除對話：\nA: I can't hear you clearly. My audio is cutting out; could you repeat that?\nB: Oh, sorry. I think you're on mute; could you unmute yourself?\nA: Let me check my internet bandwidth and reconnect.", "vocab_notes": ["Troubleshoot [ˈtrʌbəlˌʃut] (v.) [商務必考]：故障排除、解決問題。\n  例句：The IT team will *troubleshoot* the computer issue.", "Mute / Unmute [mjut] (v.) [線上會議必備]：靜音 / 解除靜音。\n  例句：Please *unmute* your microphone when you want to speak.", "Bandwidth [ˈbændˌwɪdθ] (n.) [科技單字]：頻寬、網路連線速度。\n  例句：Low *bandwidth* causes the video to freeze (畫面卡頓)."], "vocab_notes_en": ["Troubleshoot: Solving complex problems in software or hardware.", "Unmute: Turn sound back on."], "link": "https://www.usherwood.com/blog/6-common-issues-with-video-conferencing-and-how-to-solve-them", "link_text": "閱讀 6 Common Issues 視訊會議排解文章"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "官方影音自習 (BP Video 4.4.1)", "category_en": "Official Video 4.4.1", "title": "線上會議真實狀況聽力特訓 (BP Video 4.4.1)", "title_en": "Business Partner A2 Video 4.4.1", "key_takeaways": "【TOEIC 400 影音重點拆解】\n1. 影片任務：觀察三段對話（Conversation 1, 2, 3）中的連線問題。\n2. 聆聽重點字：Lag (延遲), Freeze (畫面卡住), Connection (連線)。", "key_takeaways_en": "Summary: Watch Video 4.4.1 and identify connection problems in different conversations.", "main_content": "• 聽力對話句型分析:\nA: Are we experiencing audio delay (聲音延遲)?\nB: Yes, and someone is forgetting to share the screen (分享畫面).\nA: Did the internet connection drop (網路斷線)? Let's reconnect.", "vocab_notes": ["Delay [dɪˈle] (n./v.) [基礎單字]：延遲。\n  例句：There is a slight audio *delay* on the call.", "Connection [kəˈnɛkʃən] (n.) [基礎單字]：連線、網路連接。\n  例句：My internet *connection* is unstable today.", "Freeze [friz] (v.) [線上會議常見]：(畫面) 凍結、卡住。\n  例句：Your video just *froze*. Can you hear me?"], "vocab_notes_en": ["Delay: A period of time by which something is late.", "Freeze: When a computer screen stops moving or reacting."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U4L4_4.4.1.mp4", "link_text": "觀看 Business Partner Video 4.4.1 (MP4)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "商務談判自習 (Negotiation Study)", "category_en": "Business Negotiation Study", "title": "商務合作意向與條件商討 (BP A2 6.4.1)", "title_en": "Negotiating Terms & Mutual Value (BP A2 6.4.1)", "key_takeaways": "【TOEIC 400 劇情與句型拆解】\n1. 詢問交貨時間：'What is your standard lead time?' (你們標準的交期是多久？)\n2. 表達急需：'We need delivery expedited.' (我們需要加快交貨)。\n3. 條件交換 (Trade-off) 句型：'If you can... (如果你能...), we can... (我們就能...)'。", "key_takeaways_en": "Summary: Business representatives negotiate supply lead times and mutual concessions.", "main_content": "A: What is your standard lead time for the sensor units?\nB: Typically it takes 4 to 6 weeks from order confirmation.\nA: We need delivery expedited within 3 weeks due to our schedule.\nB: If you can confirm the order by this Friday, we can prioritize your batch.", "vocab_notes": ["Standard [ˈstændɚd] (adj.) [基礎單字]：標準的、常規的。\n  例句：What is the *standard* process for this?", "Lead time [lid taɪm] (n. phr.) [商務必備]：交期、從下單到交貨的前置時間。\n  例句：Our normal *lead time* is 2 weeks.", "Delivery [dɪˈlɪvəri] (n.) [基礎單字]：交貨、遞送。\n  例句：We guarantee fast *delivery*.", "Expedite [ˈɛkspəˌdaɪt] (v.) [進階商務]：加速、加快進度。\n  例句：Can we pay extra to *expedite* the shipping?"], "vocab_notes_en": ["Lead time: The time between placing an order and receiving it.", "Expedite: Make an action or process happen sooner."], "next_week_tasks": ["💡 課堂談判演練預告：請準備 1 分鐘英文，練習要求供應商縮短交期 (shorten the lead time)。"], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U6L4_6.4.1.mp4", "link_text": "觀看 Business Partner 6.4.1 談判影片 (MP4)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "BBC 職場自習 (BBC Meetings)", "category_en": "BBC English at Work", "title": "會議控場與發言技巧：Tip Top Trading (BBC #49)", "title_en": "Clarifying Points & Chairing Meetings (BBC #49)", "key_takeaways": "【TOEIC 400 劇情與句型拆解】\n1. 禮貌打斷別人：'Sorry to interrupt, but...' (抱歉打斷一下，但是...)\n2. 要求對方澄清說明：'Could you clarify what you mean by...?' (你能澄清一下...的意思嗎？)\n3. 確認大家理解一致：'Are we all on the same page?' (我們大家的認知都一樣嗎？)", "key_takeaways_en": "Summary: Practice polite interruptions and asking for clarification respectfully in meetings.", "main_content": "A: We will finish the project very soon.\nB: Sorry to interrupt, but could you clarify the timeline?\nA: We are aiming to complete it before the end of Q3.\nB: Understood. Let's make sure we are all on the same page.", "vocab_notes": ["Interrupt [ˌɪntəˈrʌpt] (v.) [TOEIC 400核心]：打斷、插話。\n  例句：Please do not *interrupt* him while he is speaking.", "Clarify [ˈklærəˌfaɪ] (v.) [進階單字]：澄清、使...明確。\n  例句：Could you *clarify* the details in the email?", "Timeline [ˈtaɪmˌlaɪn] (n.) [基礎單字]：時間表、時程。\n  例句：We need a clear *timeline* for this task.", "On the same page (idiom) [會議極高頻]：達成共識、理解一致。\n  例句：Before we sign the contract, are we *on the same page*?"], "vocab_notes_en": ["Clarify: Make a statement less confused and clearer.", "Interrupt: Stop the continuous progress of a speech."], "next_week_tasks": ["💡 會議主持練習：分組進行 3 分鐘會議模擬，必須使用至少 1 次 'Sorry to interrupt...' 進行發問！"], "link": "https://www.bbc.co.uk/learningenglish/features/english-at-work/49-asking-for-clarification", "link_text": "前往 BBC #49 課程網頁 (收聽音檔與劇本)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "進階實境短片 (Tripp & Tyler)", "category_en": "Video Conference Call in Real Life", "title": "YouTube 爆笑短片：A Video Conference Call in Real Life", "title_en": "A Video Conference Call in Real Life", "key_takeaways": "【生活英語與幽默自習】\n透過 YouTube 搞笑短片，輕鬆學習視訊會議中最常發生的尷尬狀況的英文說法（例如：忘記開麥克風、背景有人走過去、狗在叫）。", "key_takeaways_en": "Summary: Comedic depiction of conference call challenges with video enabled.", "main_content": "• 短片中常見的搞笑會議對白：\n  A: Who just joined the call? (剛剛是誰加入通話了？)\n  B: Can everyone see my screen? (大家看得到我的分享畫面嗎？)\n  C: I think there is a dog barking in the background. (我覺得背景有狗叫聲。)", "vocab_notes": ["Join [dʒɔɪn] (v.) [基礎單字]：加入、參加。\n  例句：Thanks for *joining* the meeting today.", "Screen [skrin] (n.) [基礎單字]：螢幕、畫面。\n  搭配：share screen (分享螢幕畫面)。\n  例句：Let me share my *screen* with you.", "Background [ˈbækˌɡraʊnd] (n.) [TOEIC 400核心]：背景 (包含聲音或畫面)。\n  例句：Please mute your mic if there is *background* noise."], "vocab_notes_en": ["Screen: The flat surface on a computer or TV.", "Background: The area behind the main object or speaker."], "link": "https://www.youtube.com/watch?v=JMOOG7rWTPq", "link_text": "觀看 A Video Conference Call in Real Life (YouTube)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "商業與生活自習 (CNBC & BBC)", "category_en": "CNBC & BBC Self-Study", "title": "商業思維與心理學：Costco 汽油與哼唱好處", "title_en":         let speechQueue = [], queueIndex = 0;
        function togglePodcastPlayback() {
            if (!('speechSynthesis' in window)) return;
            const btn = document.getElementById('podcastMainBtn');

            if (isPodcastPlaying) {
                window.speechSynthesis.cancel();
                isPodcastPlaying = false;
                if (btn) btn.innerText = "▶️ 開始雙人對話朗讀";
            } else {
                window.speechSynthesis.cancel();
                speechQueue = [];
                queueIndex = 0;

                const target = (suiteScope === 'all') ? rawDatabase : [filteredPool[currentIndex] || rawDatabase[0]];
                target.forEach(l => {
                    const lines = l.main_content.split('\n').map(s => s.trim()).filter(s => s.length > 0);
                    lines.forEach(line => {
                        if (line.startsWith('A:')) speechQueue.push({ speaker: 'A', text: line.substring(2).trim() });
                        else if (line.startsWith('B:')) speechQueue.push({ speaker: 'B', text: line.substring(2).trim() });
                        else speechQueue.push({ speaker: 'narrator', text: line.replace(/[•-]/g, '').trim() });
                    });
                });

                if (!speechQueue.length) return;
                isPodcastPlaying = true;
                if (btn) btn.innerText = "⏹️ 停止播放";
                playNextInQueue();
            }
        }

        function playNextInQueue() {
            if (!isPodcastPlaying || queueIndex >= speechQueue.length) {
                isPodcastPlaying = false;
                const btn = document.getElementById('podcastMainBtn');
                if (btn) btn.innerText = "▶️ 開始雙人對話朗讀";
                return;
            }

            const item = speechQueue[queueIndex];
            const utter = new SpeechSynthesisUtterance(item.text);
            utter.rate = podcastRate;

            if (item.speaker === 'A') {
                if (speakerAVoice) utter.voice = speakerAVoice;
                utter.pitch = 0.82;
            } else if (item.speaker === 'B') {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.22;
            } else {
                if (speakerBVoice) utter.voice = speakerBVoice;
                utter.pitch = 1.0;
            }

            utter.onend = () => { queueIndex++; setTimeout(playNextInQueue, 160); };
            utter.onerror = () => { isPodcastPlaying = false; };
            window.speechSynthesis.speak(utter);
        }

        function renderMainContent(rawContent) {
            const container = document.getElementById('mainContentContainer');
            container.innerHTML = "";
            if (!rawContent) return;

            const lines = String(rawContent).split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const hasDialogue = lines.some(l => l.startsWith('A:') || l.startsWith('B:'));

            if (hasDialogue) {
                const dialogueBox = document.createElement('div');
                dialogueBox.className = 'dialogue-container';
                lines.forEach(line => {
                    if (line.startsWith('A:')) {
                        dialogueBox.innerHTML += `
                            <div class="chat-bubble-row speaker-a">
                                <div class="speaker-avatar avatar-a">A</div>
                                <div class="chat-bubble-content">${line.substring(2).trim()}</div>
                            </div>`;
                    } else if (line.startsWith('B:')) {
                        dialogueBox.innerHTML += `
                            <div class="chat-bubble-row speaker-b">
                                <div class="speaker-avatar avatar-b">B</div>
                                <div class="chat-bubble-content">${line.substring(2).trim()}</div>
                            </div>`;
                    } else {
                        dialogueBox.innerHTML += `<div style="font-size:14px; font-weight:700; color:#64748b; margin:4px 0;">${line}</div>`;
                    }
                });
                container.appendChild(dialogueBox);
            } else {
                const plain = document.createElement('div');
                plain.style.background = 'var(--sky-bg)';
                plain.style.padding = '14px';
                plain.style.borderRadius = '14px';
                plain.style.whiteSpace = 'pre-line';
                plain.innerText = rawContent;
                container.appendChild(plain);
            }
        }

        function formatVocabItem(rawText) {

            return text.replace(/\n/g, '<br>');

            if (!filteredPool.length) {
                document.getElementById('categoryBadge').innerText = (currentTab === 'media') ? "影音 / 自習" : "句型 / 文法";
                document.getElementById('categoryBadge').className = (currentTab === 'media') ? "badge media-badge" : "badge";
                document.getElementById('dateDisplay').innerText = "";
                document.getElementById('titleDisplay').innerText = "本分類尚無資料";
                document.getElementById('takeawaysSection').style.display = "none";
                document.getElementById('mainContentSection').style.display = "none";
                document.getElementById('quizSection').style.display = "none";
                document.getElementById('vocabSection').style.display = "none";
                document.getElementById('taskSection').style.display = "none";
                document.getElementById('linkSection').style.display = "none";
                document.getElementById('counterDisplay').innerText = "0 / 0";
                return;
            }

            const item = filteredPool[currentIndex];
            const badge = document.getElementById('categoryBadge');
            badge.innerText = item.category || "教材";
            badge.className = (item.type === 'media') ? "badge media-badge" : "badge";

            document.getElementById('dateDisplay').innerText = item.class_date ? ` • ${item.class_date}` : '';
            document.getElementById('counterDisplay').innerText = `${currentIndex + 1} / ${filteredPool.length}`;
            document.getElementById('titleDisplay').innerText = item.title || "";

            const tkSection = document.getElementById('takeawaysSection');
            if (item.key_takeaways) {
                tkSection.style.display = "block";
                document.getElementById('takeawaysDisplay').innerText = item.key_takeaways;
            } else {
                tkSection.style.display = "none";
            }

            document.getElementById('mainContentSection').style.display = "block";
            renderMainContent(item.main_content);

            const quizSection = document.getElementById('quizSection');
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.innerHTML = "";
            if (item.practice_quiz && item.practice_quiz.length > 0) {
                quizSection.style.display = "block";
                item.practice_quiz.forEach(q => {
                    const qCard = document.createElement('div');
                    qCard.className = 'quiz-card';
                    qCard.innerHTML = `
                        <div class="quiz-q">${formatQuestionText(q.question)}</div>
                        <button class="quiz-toggle-btn" onclick="toggleAnswer(this)">👁️ 顯示參考答案與示範</button>
                        <div class="quiz-ans-wrapper">
                            <div class="quiz-ans-box">${q.answer}</div>
                        </div>
                    `;
                    quizContainer.appendChild(qCard);
                });
            } else {
                quizSection.style.display = "none";
            }

            const vbSection = document.getElementById('vocabSection');
            const vocabUl = document.getElementById('vocabDisplay');
            vocabUl.innerHTML = "";
            if (item.vocab_notes && item.vocab_notes.length > 0) {
                vbSection.style.display = "block";
                item.vocab_notes.forEach(note => {
                    const li = document.createElement('li');
                    li.innerHTML = formatVocabItem(note);
                    vocabUl.appendChild(li);
                });
            } else {
                vbSection.style.display = "none";
            }

            const taskSection = document.getElementById('taskSection');
            const taskContainer = document.getElementById('taskContainer');
            if (item.next_week_tasks && item.next_week_tasks.length > 0) {
                taskSection.style.display = "block";
                taskContainer.innerText = item.next_week_tasks.join('\n\n');
            } else {
                taskSection.style.display = "none";
            }

            const linkSection = document.getElementById('linkSection');
            const linkTag = document.getElementById('linkDisplay');
            if (item.link) {
                linkSection.style.display = "block";
                linkTag.href = item.link;
                linkTag.innerText = "🔗 " + (item.link_text || "開啟延伸學習資源");
            } else {
                linkSection.style.display = "none";
            }
        }

        function navigateCard(dir) {
            if (!filteredPool.length) return;
            currentIndex = (currentIndex + dir + filteredPool.length) % filteredPool.length;
            renderCard();
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            document.getElementById('penBtn').classList.toggle('active-pen', isPenMode);
            document.getElementById('cardElement').classList.toggle('canvas-active', isPenMode);
        }

        function clearAllCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function undoLastStroke() { clearAllCanvas(); }

        window.onload = () => {
            initWeekOptions();
            updateTabButtonsUI();
            applyFilters();
        };
    </script>
</body>
</html>
