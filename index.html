<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Networking English - AI Learning Suite (Version 1.2)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #1e1b4b;
            --text-body: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --amber-bg: #fffbeb; --amber-border: #fef3c7; --amber-text: #b45309;
            --sky-bg: #f0f9ff; --sky-border: #e0f2fe; --sky-text: #0369a1;
            --emerald-bg: #ecfdf5; --emerald-border: #d1fae5; --emerald-text: #047857;
            --violet-bg: #faf5ff; --violet-border: #e9d5ff; --violet-text: #6b21a8;
            --bubble-a-bg: #ffffff; --bubble-a-border: #cbd5e1;
            --bubble-b-bg: #eef2ff; --bubble-b-border: #c7d2fe;
            --app-max-width: 460px;
        }
        @media (min-width: 640px) {
            :root { --app-max-width: 680px; }
            body { padding: 24px 20px !important; }
            h1 { font-size: 28px !important; }
            .card { padding: 28px 26px !important; max-height: 72vh !important; border-radius: 28px !important; }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg); margin: 0; padding: 16px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }
        .app-layout { width: 100%; max-width: var(--app-max-width); display: flex; flex-direction: column; }
        .header { width: 100%; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 25px; font-weight: 800; color: var(--text-title); margin: 4px 0 2px 0; }
        .author-badge {
            display: inline-block; font-size: 12px; font-weight: 700; color: var(--primary);
            background-color: var(--primary-soft); padding: 3px 12px; border-radius: 12px; margin-bottom: 8px;
        }
        .main-mode-nav { display: flex; gap: 6px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; margin-bottom: 10px; }
        .main-mode-btn {
            flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 800; border: none; border-radius: 12px;
            background: transparent; color: var(--text-muted); cursor: pointer;
        }
        .main-mode-btn.active { background: #ffffff; color: var(--primary); box-shadow: 0 3px 10px rgba(79, 70, 229, 0.15); }
        .pen-toolbar { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 12px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer;
        }
        .tool-btn.active-pen { background-color: #ffe4e6; border-color: #e11d48; color: #e11d48; }
        .admin-btn { background-color: #f1f5f9; border: 1.5px dashed #64748b; color: #334155; }
        .filters { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        select {
            width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 15px; font-weight: 600;
            border-radius: 14px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none; margin-bottom: 8px;
        }
        .tab-group { width: 100%; box-sizing: border-box; display: flex; gap: 8px; background-color: #e2e8f0; padding: 5px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 11px 6px; font-size: 15px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active { background: #ffffff !important; color: var(--primary) !important; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12); }
        .card-container { width: 100%; flex: 1; display: flex; flex-direction: column; position: relative; }
        .card {
            background-color: var(--card-bg); border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 22px 18px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
        }
        #drawCanvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 100; }
        .card.canvas-active #drawCanvas { pointer-events: auto; touch-action: none; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .badge { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .badge.media-badge { background-color: #fef3c7; color: #92400e; }
        .counter { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .title { font-size: 21px; font-weight: 800; color: var(--text-title); margin-bottom: 14px; line-height: 1.35; }
        .block-section { margin-bottom: 18px; text-align: left; }
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 12.5px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }
        .tag-violet { background-color: var(--violet-bg); color: var(--violet-text); border: 1px solid var(--violet-border); }
        .block-desc { font-size: 15.5px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }
        
        .dialogue-container { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        .chat-bubble-row { display: flex; align-items: flex-start; gap: 8px; width: 100%; }
        .chat-bubble-row.speaker-b { flex-direction: row-reverse; }
        .speaker-avatar {
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 13.5px; font-weight: 800; color: #ffffff; flex-shrink: 0; margin-top: 4px;
        }
        .speaker-avatar.avatar-a { background: #2563eb; }
        .speaker-avatar.avatar-b { background: #7c3aed; }
        .chat-bubble-content {
            max-width: 82%; padding: 11px 15px; border-radius: 16px; font-size: 15.5px; line-height: 1.5; font-weight: 600;
        }
        .speaker-a .chat-bubble-content { background-color: var(--bubble-a-bg); border: 1.5px solid var(--bubble-a-border); }
        .speaker-b .chat-bubble-content { background-color: var(--bubble-b-bg); border: 1.5px solid var(--bubble-b-border); }
        
        .vocab-ul { margin: 0; padding-left: 20px; font-size: 15px; color: var(--text-body); line-height: 1.7; }
        .vocab-ul li { margin-bottom: 10px; line-height: 1.6; }
        .highlight-term { color: #3730a3 !important; font-weight: 800 !important; }
        .ipa-tag { color: #6d28d9; font-weight: 700; margin: 0 2px; }

        .quiz-card {
            background-color: var(--violet-bg); border: 1.5px solid var(--violet-border);
            border-radius: 18px; padding: 16px; margin-bottom: 12px;
        }
        .quiz-q { font-size: 15.5px; font-weight: 700; color: #4c1d95; line-height: 1.6; margin-bottom: 10px; }
        .blank-line { display: inline-block; min-width: 80px; border-bottom: 2.5px solid #7c3aed; margin: 0 4px; }
        .quiz-toggle-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            color: #ffffff; border: none; padding: 7px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 700; cursor: pointer;
        }
        .quiz-ans-wrapper { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #d8b4fe; }
        .quiz-ans-box {
            background: #ffffff; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #bbf7d0;
            font-size: 15px; color: #14532d; line-height: 1.65; white-space: pre-line; font-weight: 600;
        }

        .link-box { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border-color); text-align: left; }
        .link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
            padding: 13px 18px; font-size: 15px; color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            text-decoration: none; font-weight: 700; border-radius: 14px;
        }

        .nav-controls { width: 100%; display: flex; gap: 12px; margin-top: 12px; }
        .nav-btn { flex: 1; padding: 15px; font-size: 17px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer; }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; }

        /* 管理者 Modal */
        #adminModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 999; justify-content: center; align-items: center; padding: 14px; box-sizing: border-box;
        }
        .admin-box {
            background: #ffffff; border-radius: 24px; width: 100%; max-width: 500px; max-height: 85vh;
            overflow-y: auto; padding: 20px; box-sizing: border-box;
        }
        input, textarea {
            width: 100%; box-sizing: border-box; padding: 10px; border-radius: 12px; border: 1.5px solid var(--border-color); margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="header">
            <h1>Networking English</h1>
            <div class="author-badge">By Ryan Liu, Version 1.2</div>
            <div class="main-mode-nav">
                <button class="main-mode-btn active">📚 學習卡片</button>
            </div>
            <div class="pen-toolbar">
                <button id="penBtn" class="tool-btn" onclick="togglePenMode()">🖍️ 細畫筆</button>
                <button class="tool-btn" onclick="clearAllCanvas()">🗑️ 全清</button>
                <button class="tool-btn admin-btn" onclick="openAdminModal()">🔒 補充單字</button>
            </div>
        </div>

        <!-- 學習卡片模式 -->
        <div id="viewCards">
            <div class="filters">
                <select id="weekFilter" onchange="applyFilters()">
                    <option value="week1" selected>WEEK 1 (2026/08/12)</option>
                    <option value="week2">WEEK 2 (2026/08/19)</option>
                    <option value="week3">WEEK 3 (2026/09/02)</option>
                </select>
                <div class="tab-group">
                    <button id="tabSentence" class="tab-btn active" onclick="setTab('sentence')">句型 / 文法</button>
                    <button id="tabMedia" class="tab-btn" onclick="setTab('media')">影音 / 自習</button>
                </div>
            </div>

            <div class="card-container">
                <div class="card" id="cardElement">
                    <canvas id="drawCanvas"></canvas>
                    <div>
                        <div class="card-header">
                            <div>
                                <span class="badge" id="categoryBadge">分類</span>
                                <span style="font-size: 12.5px; color: #64748b;" id="dateDisplay"></span>
                            </div>
                            <span class="counter" id="counterDisplay">1 / 1</span>
                        </div>
                        <div class="title" id="titleDisplay">載入中...</div>

                        <div class="block-section" id="takeawaysSection">
                            <div class="tag-title tag-amber">💡 核心重點說明</div>
                            <div class="block-desc" id="takeawaysDisplay"></div>
                        </div>

                        <div class="block-section" id="mainContentSection">
                            <div class="tag-title tag-sky">📖 學習內容與核心對話</div>
                            <div id="mainContentContainer"></div>
                        </div>

                        <div class="block-section" id="quizSection">
                            <div class="tag-title tag-violet">✍️ 課堂實戰練習與填空題</div>
                            <div id="quizContainer"></div>
                        </div>

                        <div class="block-section" id="vocabSection">
                            <div class="tag-title tag-emerald">📝 重點單字與注意事項</div>
                            <ul class="vocab-ul" id="vocabDisplay"></ul>
                        </div>
                    </div>

                    <div class="link-box" id="linkSection">
                        <a class="link-btn" id="linkDisplay" href="#" target="_blank">🔗 開啟延伸學習資源</a>
                    </div>
                </div>
            </div>

            <div class="nav-controls">
                <button class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
                <button class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
            </div>
        </div>
    </div>

    <!-- 管理者 Modal -->
    <div id="adminModal">
        <div class="admin-box">
            <h3 style="margin-top:0; color:#1e1b4b;">🔒 管理者課堂即時補充</h3>
            <div id="adminAuthSection">
                <div style="font-size:14px; margin-bottom:8px; color:#64748b;">請輸入管理者密碼以解鎖編輯權限：</div>
                <input type="password" id="adminPwdInput">
                <button class="quiz-toggle-btn" style="width:100%; padding:10px;" onclick="verifyAdminPassword()">解鎖管理後台</button>
            </div>
            <div id="adminFormSection" style="display:none;">
                <label style="font-size:13px; font-weight:700;">選擇週次：</label>
                <select id="admWeek">
                    <option value="week1">Week 1 (2026/08/12)</option>
                    <option value="week2">Week 2 (2026/08/19)</option>
                    <option value="week3">Week 3 (2026/09/02)</option>
                </select>
                <label style="font-size:13px; font-weight:700;">補充標題：</label>
                <input type="text" id="admTitle">
                <label style="font-size:13px; font-weight:700;">核心句型/對話：</label>
                <textarea id="admContent" rows="3"></textarea>
                <label style="font-size:13px; font-weight:700;">補充單字 (每行一個)：</label>
                <textarea id="admVocab" rows="3"></textarea>
                
                <div style="display:flex; gap:8px; margin-top:10px;">
                    <button class="quiz-toggle-btn" style="flex:1; padding:10px;" onclick="saveAdminSupplement()">💾 儲存並即時套用</button>
                    <button class="quiz-toggle-btn" style="background:#64748b; padding:10px;" onclick="closeAdminModal()">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 資料來源注入
        const database = [{"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "社交問候 (Greetings)", "title": "初次見面與熟人寒暄 (Greetings & Responses)", "key_takeaways": "【多益高頻句型與職場延伸】\n1. 詢問近況的道地句型：How is it going? / How are things with you?\n2. 萬用中性回答公式：Same old, same old. / Pretty much the same. / Can not complain.\n3. 職場接人文化差異：美式常用 pick up someone，而英式英語則常使用 collect someone 來表示接送某人。\n4. 接待禮儀：正式會議開場引導外賓入座時，請使用 Please be seated。", "main_content": "A: Hi, my name is John. Please be seated. And you are?\nB: I am Ryan. I am a new recruit from the IT department.\nA: How is it going with your new project?\nB: Pretty good. Can not complain.\nA: I have got to go now to collect our client from the station. See ya!\nB: Sure! Catch up with you later!", "vocab_notes": ["Collect someone [kəˈlɛkt] (v. phr.) [英式高頻用法]：接送某人（英式常用，等同於美式的 pick up someone）。\n  例句：I need to *collect* my manager from Kaohsiung High Speed Rail Station at 3 PM.", "Pick up someone (v. phr.) [美式常用]：接送某人（美式最常見說法）。\n  例句：Can you *pick up* the client from the airport tomorrow morning?", "Recruit [rɪˈkrut] (n./v.) [職場高頻]：新進員工；招募。\n  例句：Anna is our latest *recruit* in the research and development department.", "Please be seated (句型) [正式商務禮儀]：請入座、請坐下。\n  例句：Ladies and gentlemen, the keynote presentation is starting, *please be seated*.", "Catch up with someone (片語) [商務社交高頻]：與某人敘舊、聊聊近況。\n  例句：It was wonderful to *catch up with you* after the regional conference."], "practice_quiz": [{"question": "【第 1 題】英式英語中要表達去車站接客戶，可以填入哪個動詞？\nI need to _________ our client from the train station.", "answer": "✔ 填空解答：collect\n👉 整句回答：I need to collect our client from the train station.\n💡 解析：在英式英語中，collect 常用於接送人；美式英語則偏好使用 pick up。"}], "link": "https://www.linkedin.com/pulse/18-ways-say-hello-english-thomas-spengler/", "link_text": "18 Ways to Say Hello in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "道別用語 (Goodbyes)", "title": "道別與核心文法規則 (Ways to Say Goodbye & Grammar)", "key_takeaways": "【多益高頻句型與文法規則】\n1. 職場非正式道別：I have got to get going / Take it easy / Have a good one / See ya.\n2. 正式商務道別：It was a pleasure to see you / I look forward to our next meeting.\n3. 多益必考文法 Pro Tip：Look forward to + V-ing（to 是介系詞，後面必須接動名詞 V-ing 或名詞，絕不可接原形動詞！）。", "main_content": "A: I have got to get going now! I look forward to our next meeting.\nB: Take it easy! Have a good one!\nA: It was a pleasure to see you.\nB: I look forward to seeing you soon in Kaohsiung.", "vocab_notes": ["Look forward to + V-ing [lʊk ˈfɔrwərd tu] (phr.) [多益核心文法]：期待相會。\n  例句：I *look forward to collaborating* with your process safety team on the upcoming plant audit.", "Take it easy (idiom) [口語常用]：保重、放輕鬆（非正式道別語）。\n  例句：*Take it easy* this weekend, you have been working exceptionally hard.", "Exit vs. Exist [易混淆字辨析]：\n  - Exit [ˈɛɡzɪt] (n./v.)：出口；離開。\n  - Exist [ɪɡˈzɪst] (v.)：存在、生存。\n  例句：Please proceed to the emergency *exit* if safety alarms sound."], "practice_quiz": [{"question": "【第 1 題】請填入 see 的正確動詞形式：\nI look forward to _________ you at the conference next month.", "answer": "✔ 填空解答：seeing (V-ing)\n👉 整句回答：I look forward to seeing you at the conference next month.\n💡 解析：Look forward to 中的 to 是介系詞，後方必須搭配動名詞 V-ing 或名詞！"}], "link": "https://www.berlitz.com/blog/goodbye-english", "link_text": "81 Ways to Say Goodbye in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "影音自習 (BP 5.4.1)", "title": "商務社交情境：巴黎會面 (Business Partner A2 5.4.1)", "key_takeaways": "【詳細劇情摘要與學習重點】\n1. 劇情核心：Julia 抵達巴黎參加商務研討會，與合作夥伴 Maria 和 Max 會面，討論抵達交通方式與飯店舒適度。\n2. 詢問抵達交通句型：When did you arrive? / I flew in yesterday afternoon.", "main_content": "A: When did you arrive in Paris?\nB: I flew here yesterday afternoon. Traffic from the airport was heavy.\nA: Where are you staying? Do you like the hotel?\nB: At the Mason Park Hotel. The room is small, but comfortable, and it is a 5-minute walk to the venue.\nA: Do you have plans for dinner tonight? Would you like to come?\nB: Count me in! Why not?", "vocab_notes": ["Venue [ˈvɛnju] (n.) [多益高頻]：會場、舉辦地點。\n  例句：It is a 5-minute walk from our hotel to the exhibition *venue*.", "Fly in / Fly here (v. phr.)：搭機抵達（商務出差高頻片語）。\n  例句：Our technical consultants *flew in* from Singapore this morning to join the conference."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U5L4_5.4.1.mp4", "link_text": "觀看 Business Partner 5.4.1 影片 (MP4)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "官方腳本閱讀 (BP Script)", "title": "Business Partner A2 影音逐字稿對照 (Page 3)", "key_takeaways": "【官方指定文件研讀】\n請參閱 Business Partner A2 影音腳本 PDF 第 3 頁（Video 5.4.1 完整對白文字檔），對照聽力逐字稿加強記憶，標記出生難字彙與連音技巧。", "main_content": "閱讀重點指引:\n請開啟下方 PDF 講義第 3 頁，比對 Julia、Maria 與 Max 在飯店大廳會面時的真實語速、發音弱化與商務社交措辭。", "vocab_notes": ["Transcript [ˈtrænsˌkrɪpt] (n.) [商務必備]：逐字稿、會議文字記錄。\n  例句：Please read through the video *transcript* to master natural liaison and reduction in speech."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_Video.pdf", "link_text": "閱讀 Business Partner A2 影音腳本 PDF (請翻至第 3 頁)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "聽力與發音特訓 (BP WB 5.5)", "title": "展會心得聽力特訓與標點發音 (BP Workbook 5.5)", "key_takeaways": "【聽力檢測與標點符號發音】\n1. 聽力辨識時間差：Did Amy and Marta arrive on the same day? If not, when did they arrive separately?\n2. 標點符號的英文唸法：Dash (破折號 —)、Hyphen (連字號 -)、Underscore (底線 _)。", "main_content": "A: What did Amy think about the conference center?\nB: She liked the recycling presentation. It is very accessible.\nA: I need to send her the compliance report. What is her email address?\nB: It is amy hyphen smith underscore ehs at company dot com.", "vocab_notes": ["Hyphen [ˈhaɪfən] (n.) [多益高頻]：連字號（-，用於連接複合字）。\n  例句：A *hyphen* is used in compound adjectives such as user-friendly."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/BP_A2_WB_5_05.mp3", "link_text": "聆聽 Business Partner Workbook 5.5 音檔 (MP3)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "BBC 職場入門 (BBC Intro)", "title": "職場求職與辦公室生存 (BBC English at Work Intro)", "key_takeaways": "【職場高頻單字與面試技巧】\n1. 公司背景：Tip Top Trading 是一家塑膠水果製造商 (Plastic fruit industry / sector)。\n2. 辦公室禁忌：嚴禁在走廊或茶水間刻意偷聽他人對話 (Eavesdrop vs. Overhear)。", "main_content": "A: Can you tell me about yourself?\nB: This job is an ideal match for my skills and experience. I get on with people easily.\nA: What does your company manufacture?\nB: We operate in the plastic fruit sector. Our company is prestigious and famous.", "vocab_notes": ["Eavesdrop [ˈivzˌdrɑp] (v.) [職場高頻]：偷聽、竊聽（有意識地故意去聽）。\n  例句：It is unethical to *eavesdrop* on private management discussions."], "link": "https://www.bbc.co.uk/learningenglish/features/english-at-work/english-at-work-intro", "link_text": "觀看 BBC English at Work: Intro"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "口語特訓 (Papa Teach Me)", "title": "告別生硬問候 (Stop Saying I am fine)", "key_takeaways": "【自學影音任務重點】\n學習超過 15 種回答 How are you 的在地自然替代說法，並掌握當對方氣色不佳時的關心問句。", "main_content": "A: How are you doing today?\nB: Never better! Couldn't be better!\nA: Are you feeling alright? You look a bit under the weather.\nB: I am feeling a bit exhausted due to the audit, but hanging in there.", "vocab_notes": ["Under the weather [ˈʌndɚ ðə ˈwɛðɚ] (idiom) [日常高頻]：身體微恙、身體不舒服。\n  例句：Our senior engineer is *under the weather* and taking sick leave today."], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "觀看 Papa Teach Me 教學影片 (YouTube)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation)", "title": "研討會住宿與地鐵動線 (AIChE Minneapolis)", "key_takeaways": "【多益高頻句型與差旅延伸】\n1. 飯店評估指標：Price, Location, Distance to the venue.\n2. 描述步行與地鐵直達：The hotel is within walking distance.\n3. 明尼阿波利斯 Skyway 空中步道系統在防寒防雪上的實務通行優勢。", "main_content": "A: The hotel is near the subway station and within walking distance.\nB: From the hotel, can I take the subway directly to the conference venue?\nA: Yes, you can take the Blue Line directly. You do not need to transfer.", "vocab_notes": ["Within walking distance (phr.) [多益核心]：步行可達的距離。\n  例句：Our conference hotel is located *within walking distance* of the convention center.", "Transfer [trænsˈfɚ] (v./n.)：轉乘、換車（搭乘大眾運輸）。\n  例句：Take the Blue Line directly; there is no need to *transfer* at all."], "practice_quiz": [{"question": "【第 1 題】告訴外國客戶飯店走路就能到會場，請填入核心片語：\nThe hotel is _________ _________ distance to the venue.", "answer": "✔ 填空解答：within walking\n👉 整句回答：The hotel is within walking distance to the venue.\n💡 解析：within walking distance 是商務訂房與交通指南中最常用的片語。"}], "link": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf?v=1726683206", "link_text": "Minneapolis Skyway & Hotel Map (PDF)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "在地推薦 (Recommendations)", "title": "在地美食景點推薦與避開觀光陷阱", "key_takeaways": "【多益高頻句型與在地推薦】\n1. 推薦句型：I recommend ___ because ___ / I think ___ is worth seeing / visiting / eating.\n2. 必訪與難忘體驗：It is my all-time favorite / It is a must-see!\n3. 觀光陷阱與敲竹槓辨析：Tourist trap (專坑遊客的店) vs. Tourist attraction (著名觀光景點)；Rip off (動詞) vs. Rip-off (名詞)。", "main_content": "A: In Kaohsiung, what food do you recommend to enjoy our stay?\nB: I think Hakka dishes and mutton fried rice are worth eating! They are accessible and delicious cuisine.\nA: What about the night market?\nB: The night market is a famous tourist attraction, but beware of overpriced fruit stands. Paying NT$500 for cut guava is a complete rip-off and a tourist trap!", "vocab_notes": ["Tourist trap [ˈtʊrɪst træp] (n.) [生活高頻]：專坑遊客的店（相對詞：Tourist attraction 著名景點）。\n  例句：That seafood restaurant is a *tourist trap*; they rip off out-of-towners with inflated prices.", "Rip-off [ˈrɪp ˌɔf] (n.) [多益常考]：敲竹槓、極度不合理的收費。\n  例句：Charging NT$500 for a small bag of cut guava is a complete *rip-off*."], "practice_quiz": [{"question": "【第 1 題】指控某家餐廳專門敲觀光客竹槓、收取暴利：\nThat restaurant is a _________ _________; charging NT$500 for fruit is a total _________-_________.", "answer": "✔ 填空解答：tourist trap, rip-off\n👉 整句回答：That restaurant is a tourist trap; charging NT$500 for fruit is a total rip-off."}], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "展會人脈 (Networking)", "title": "展會破冰與部門職掌交流 (Networking Role-Play)", "key_takeaways": "【課堂即興演練 6 階段黃金劇本】\n1. 自我介紹與部門 ➔ 2. 詢問對方部門 ➔ 3. 簡述己方職掌 ➔ 4. 帶出工作痛點 ➔ 5. 提供協助 ➔ 6. 交換名片約定後續聯絡。\n核心轉折金句：You just remind me that we may need your help in... / Here is my business card should you want to call.", "main_content": "A: Hello, I am Ryan. I work as a Senior Specialist in Process Safety.\nB: Hi, I am Alex. It is a pleasure to meet you.\nA: Can you tell me about your department?\nB: Sure! I work in Operations. We manage plant production lines.\nA: Can I briefly tell you about what our department does?\nB: Of course! I am all ears. Fire away!\nA: We conduct safety risk assessments and incident prevention audits.\nB: You just remind me that we may need your help in identifying vapor leakage risks.\nA: Yeah, I think we might be able to help you.\nB: That would be great! It is so nice of you to offer help.\nA: Here is my business card should you want to call.\nB: Absolutely. I will be in touch soon.", "vocab_notes": ["I am all ears [aɪm ɔl ɪrz] (idiom) [商務社交]：我洗耳恭聽、全神貫注。\n  例句：Tell me about your plant expansion plan; *I am all ears*.", "Fire away (idiom) [口語高頻]：請說吧、請開始提問吧。\n  例句：Do you have questions regarding the safety protocol? *Fire away*!"], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "BBC 職場自習 (BBC Networking)", "title": "商務社交實戰：Tip Top Trading (BBC #48)", "key_takeaways": "【詳細劇情與語言重點】\n1. 展會社交心態：在艱困經濟環境下，必須積極拓展人脈。\n2. 行動口訣：Just be chatty and friendly / I will give it a shot / Let us get down to business。", "main_content": "A: I heard you were in town! Let us do some networking and schmoozing with new clients.\nB: Smashing! I will give it a shot. Let us get down to business.\nA: It is a tough economic climate. By my calculations, you need to be rid of one member of staff.\nB: Crumbs! Bad news will not go down well with the team.", "vocab_notes": ["Schmooze [ʃmuz] (v.) [商務口語]：社交應酬、拉攏關係、建立人脈。\n  例句：Industry gala dinners are the perfect venue to *schmooze* with key accounts."], "link": "https://www.bbc.co.uk/learningenglish/features/english-at-work/48-language-for-networking", "link_text": "前往 BBC #48 課程網頁 (收聽音檔與劇本)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "科技與隱私自習 (Tech & Privacy)", "title": "Passkey 通行密鑰原理 (BBC News 02:35)", "key_takeaways": "【影片詳細摘要與科技字彙】\nBBC News 探討 Passkey（通行密鑰）技術如何透過生物辨識與非對稱加密取代傳統密碼，防禦釣魚攻擊與詐騙。", "main_content": "A: Passkeys replace traditional passwords with fast biometric authentication.\nB: They rely on public-key encryption to identify users and prevent fraud.\nA: You do not need to remember complex character strings anymore.\nB: It represents an inevitable evolution toward passwordless online security.", "vocab_notes": ["Biometrics [ˌbaɪoʊˈmɛtrɪks] (n.) [科技資安]：生物辨識技術（指紋、人臉辨識）。\n  例句：Modern smartphones use *biometrics* to identify authorized users securely."], "link": "https://www.youtube.com/watch?v=lf5L_1oqHDs", "link_text": "開啟 BBC Passkey 影片 (02:35)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "CNN 科技隱私 (CNN Shorts)", "title": "智慧眼鏡防偷拍奇招 (CNN Shorts 02:15)", "key_takeaways": "【短片情境與法律字彙】\nCNN 探討 Meta 等智慧眼鏡引發的未經授權錄影隱憂，以及透過播放受版權保護的知名音樂觸發演算法判定侵權而自動下架影片的反制策略。", "main_content": "A: What should you do if someone uses smart glasses to harass or film you without consent?\nB: Play a Disney song on your phone! The copyright infringement algorithm will block the video from being uploaded.", "vocab_notes": ["Consent [kənˈsɛnt] (n./v.) [多益高頻]：同意、許可。\n  例句：You must obtain informed *consent* before filming individuals on industrial premises."], "link": "https://youtube.com/shorts/H7qyXwntx08?si=zc6OtSPaJOuWMik9", "link_text": "觀看 CNN Smart Glasses 短片 (02:15)"}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "工作日常 (Work Routine)", "title": "日常工作職責與跨部門協調 (What Do You Do? - BP Unit 1)", "key_takeaways": "【多益高頻句型與職場延伸】\n1. 描述工作職責：I am responsible for a team of 5 people / I am in charge of plant safety。\n2. 跨部門協調與專案追蹤：Resolve inter-departmental conflicts (解決跨部門衝突) / Track project milestones (追蹤專案里程碑)。\n3. 通勤型態英美辨析：\n   - 英式用語：cycle to and from work。\n   - 美式用語：bike to and from work / commute by bicycle。\n4. 頻率副詞與易混淆字：Sometimes (有時) vs. Sometime (某個時候) vs. Some time (一段時間)。", "main_content": "A: What do you do for a living?\nB: I serve as Chief Executive Officer. I am responsible for resolving inter-departmental conflicts and tracking project milestones.\nA: How often do you commute or WFH?\nB: I sometimes cycle to and from the plant, but I usually WFH on Fridays to collect operational data and do the math for our budget.", "vocab_notes": ["Cycle to and from [ˈsaɪkəl tu ænd frʌm] (v. phr.) [英式用法]：騎自行車上下班通勤（美式常說 bike to and from 或 commute by bicycle）。\n  例句：In Cambridge, thousands of professionals *cycle to and from* work every day.", "Resolve inter-departmental conflicts (phr.) [高階管理]：解決跨部門衝突。\n  例句：A principal engineer must skillfully *resolve inter-departmental conflicts* between safety and production."], "practice_quiz": [{"question": "【第 1 題】英式英語常說 cycle to and from work，美式口語則常用哪個動詞來表達騎車通勤？\nI usually _________ to and from the office every sunny morning.", "answer": "✔ 填空解答：bike\n👉 整句回答：I usually bike to and from the office every sunny morning."}, {"question": "【第 2 題】She needs to _________ a room for ten people for the meeting. (預訂會議室)", "answer": "✔ 填空解答：book\n👉 整句：She needs to book a room for ten people for the meeting."}, {"question": "【第 3 題】Money isn’t a problem. The _________ says we have $10,000 for the project. (專案預算)", "answer": "✔ 填空解答：budget\n👉 整句：Money isn’t a problem. The budget says we have $10,000 for the project."}, {"question": "【第 4 題】The _________ says the meeting starts at 10 a.m., and we have five points to discuss. (會議議程)", "answer": "✔ 填空解答：agenda\n👉 整句：The agenda says the meeting starts at 10 a.m., and we have five points to discuss."}, {"question": "【第 5 題】The work isn’t difficult. The _________ gives instructions about the job. (任務簡報說明)", "answer": "✔ 填空解答：brief\n👉 整句：The work isn’t difficult. The brief gives instructions about the job."}], "link": "", "link_text": ""}, {"week": "week3", "class_date": "2026/09/02", "type": "sentence", "category": "會議議程 (Meeting Agendas)", "title": "會議型態比較與議程掌握 (Online Meetings & Hidden Agendas)", "key_takeaways": "【多益高頻句型與會議深度分析】\n1. 會議型態優缺點比較：Online meeting vs. Face-to-face meeting 的 Pros (優點) and Cons (缺點)。\n2. 專注力管理：容易分心 (Get distracted easily) vs. 容易集中精神 (Concentrated easily)。\n3. 會議議程名詞：Brief (專案簡報摘要), Hidden agenda (不可告人的隱藏意圖), Push one's agenda (強行推動個人議程), Sign on the dotted line (正式在虛線上簽字履約)。", "main_content": "A: What are the pros and cons of an online meeting?\nB: In virtual sessions, participants get distracted easily. In-person meetings consume more travel time, but people are concentrated easily.\nA: Does the vendor agree with our safety brief?\nB: Yes, but watch out for any hidden agenda. Make sure their authorized representative signs on the dotted line before work commences.", "vocab_notes": ["Pros and cons [proʊz ænd kɑnz] (n. phr.) [多益必備]：優缺點、利弊得失。\n  例句：We must carefully weigh the *pros and cons* before selecting a DCS vendor.", "Hidden agenda [ˈhɪdən əˈdʒɛndə] (n.) [商務高階]：隱藏的意圖、不可告人的動機。\n  例句：The contractor has a *hidden agenda* to request budget variations later in the project."], "link": "", "link_text": ""}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "官方影音自習 1 (BP Video 1.1.1)", "title": "工作職責與出差頻率 (Business Partner A2 1.1.1)", "key_takeaways": "【官方指定影音學習任務】\n1. 影片任務：觀看 Video 1.1.1，比較 Liz、Ellen 與 Muj 的上下班時間 (Starts work at 7:30 / Finishes work at 5:30) 與國際出差頻率。\n2. 掌握工作動詞搭配：Process orders (處理訂單), Take notes (做筆記), Conduct data analysis (進行數據分析)。", "main_content": "A: Who starts work at 7:30 in Video 1.1.1?\nB: Liz does. She works with the sales team and often processes orders.\nA: Who travels to other countries for work and finishes at 5:30?\nB: Muj does. He also analyzes data and prepares executive presentations.", "vocab_notes": ["Process orders [ˈprɑsɛs ˈɔrdɚz] (v. phr.) [多益核心]：處理客戶訂單。\n  例句：Our logistics team *processes orders* rapidly to ensure zero delivery delay."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U1L1_1.1.1.mp4", "link_text": "觀看 Business Partner Video 1.1.1 影片 (MP4)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "官方腳本研讀 (BP Script 1.1.1)", "title": "Business Partner A2 影音腳本對照 (Page 1)", "key_takeaways": "【官方文件閱讀任務】\n請參閱 Business Partner A2 影音腳本 PDF 第 1 頁（Video 1.1.1 What Do You Do? 完整對白文字檔），對照聽力逐字稿加強記憶，留意日常時間與動詞形態變化。", "main_content": "閱讀重點指引:\n請開啟下方 PDF 文件第 1 頁，仔細閱讀 Video 1.1.1 三位發言者的完整職責敘述，掌握動詞第三人稱單數加 s/es 的規則變化。", "vocab_notes": ["Sign [saɪn] (v./n.)：簽署；標誌。\n  例句：Please *sign* the safety entry permit before entering the processing unit."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_Video.pdf", "link_text": "閱讀 Business Partner A2 影音腳本 PDF (請見第 1 頁)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "線上會議除錯 (Usherwood)", "title": "視訊會議 6 大常見問題與排解 (Usherwood)", "key_takeaways": "【商務科技文章精讀】\n跨國視訊會議最常見的 6 大連線與影音障礙及專業英文排除術語：\n1. 聲音干擾：Static (靜電雜音), Echo / audio feedback (回音嘯叫), You are on mute (你被靜音了), Breaking up (聲音斷斷續續)。\n2. 畫面異常：Frozen screen (畫面凍結死當), Grainy video (畫質模糊粗糙), Glitch (小故障), On and off / get cut off (連線斷斷續續/徹底斷線)。", "main_content": "A: Alex, can you hear me? Your audio is breaking up and there is heavy static on the line.\nB: Sorry, my connection is unstable. Am I on mute?\nA: No, we can hear you now, but your camera feed is completely frozen and grainy. We got cut off earlier.\nB: Let me restart my router to troubleshoot the bandwidth issue.", "vocab_notes": ["Static [ˈstætɪk] (n.) [會議通訊]：雜音、靜電干擾聲。\n  例句：There is noticeable *static* on the conference phone; let us switch to Microsoft Teams."], "link": "https://www.usherwood.com/blog/6-common-issues-with-video-conferencing-and-how-to-solve-them", "link_text": "閱讀 Usherwood 視訊會議疑難排解文章"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "官方影音自習 2 (BP Video 4.4.1)", "title": "視訊會議真實狀況聽力檢測 (Business Partner A2 4.4.1)", "key_takeaways": "【官方影音任務：問題辨識】\n觀看 Video 4.4.1，識別三段不同遠端會議情境中的技術困難：\n- Conversation 1：音訊延遲與回音干擾？\n- Conversation 2：畫面分享權限未開或忘了取消靜音 (Forgot to unmute)？\n- Conversation 3：撥號輸入井字鍵 (Pound key #) 認證失敗？會議結束後的總結要點 (Recap)。", "main_content": "A: Welcome everyone. Please dial your participant code followed by the pound key.\nB: I think someone is on mute. Can you hear us?\nA: Yes, sorry! Let us do a quick recap of the three problems observed in Conversation 1, 2, and 3.", "vocab_notes": ["Pound key [paʊnd ki] (n.) [美式通訊]：井字鍵（#，美式稱 pound key，英式常稱 hash key）。\n  例句：Enter your conference meeting ID followed by the *pound key*."], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U4L4_4.4.1.mp4", "link_text": "觀看 Business Partner Video 4.4.1 影片 (MP4)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "實境喜劇 1 (Tripp & Tyler)", "title": "電話會議實境爆笑諷刺劇 (A Conference Call in Real Life)", "key_takeaways": "【YouTube 實境文化學習】\n透過 Tripp & Tyler 破千萬觀看的經典搞笑諷刺短片，體會電話會議中令人抓狂的荒唐實況：\n1. 經典開場尷尬句：Who just joined? / Can you hear me now?\n2. 各種背景噪音與搗亂者故意製造噪音、以及忘記解除靜音乾講三分鐘等文化反思。", "main_content": "短片經典爆笑對白片段:\n- Hi guys, sorry I am late, I had trouble with the access code.\n- Who just joined?\n- John, you are not muted, we can hear your dog barking!\n- Stop trolling the conference call and get back to work!", "vocab_notes": ["Troll [troʊl] (n./v.) [網路職場文化]：惡作劇者、網路酸民、故意搗亂者；惡意挑釁。\n  例句：Ignore anonymous *trolls* who try to derail constructive project discussions."], "link": "https://www.youtube.com/watch?v=DYu_bGbZiiQ", "link_text": "觀看 A Conference Call in Real Life (YouTube)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "實境喜劇 2 (Tripp & Tyler)", "title": "視訊會議實境爆笑短片 (A Video Conference Call in Real Life)", "key_takeaways": "【YouTube 實境文化學習】\n延續經典諷刺風格，本片刻畫升級為「視訊鏡頭」後的更多尷尬爆笑場景：鏡頭角度怪異、穿睡褲開會、忘記開螢幕分享、聲音延遲等。", "main_content": "視訊短片核心爆笑問句:\n- Can everyone see my screen?\n- No, you are sharing the wrong browser window!\n- Why is your camera pointed at the ceiling?", "vocab_notes": ["Screen sharing (n.)：螢幕畫面共享。\n  例句：Please grant permission so the auditor can initiate *screen sharing*."], "link": "https://www.youtube.com/watch?v=JMOOG7rWTPq", "link_text": "觀看 A Video Conference Call in Real Life (YouTube)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "商業策略自學 (CNBC Make It)", "title": "好市多汽油定價商業策略 (Why Costco Gas is So Cheap - CNBC 03:28)", "key_takeaways": "【CNBC 商業專題自學摘要】\n深入解析好市多 (Costco) 為什麼能長年維持低油價的商業策略：\n1. 帶路貨策略 (Loss leader)：以微薄利潤率甚至虧損銷售汽油，藉此吸引大量會員開車進入倉儲賣場購物。\n2. 會員費護城河：利用高續約率的會員年費彌補油品毛利，帶動巨大的客流量與整體獲利。", "main_content": "A: Why is Costco gas consistently cheaper than neighboring stations?\nB: Costco treats fuel as a loss leader. By accepting razor-thin profit margins on gas, they draw thousands of members into their warehouse to buy high-margin goods.", "vocab_notes": ["Profit margin [ˈprɑfɪt ˈmɑrdʒən] (n.) [多益核心商務]：利潤率、毛利率。\n  例句：Costco operates on lower *profit margins* than conventional supermarket chains."], "link": "https://www.youtube.com/watch?v=vvBYMNXgfVo", "link_text": "觀看 CNBC: Why Costco Gas is So Cheap 影片 (YouTube)"}, {"week": "week3", "class_date": "2026/09/02", "type": "media", "category": "身心健康自學 (BBC Global)", "title": "哼唱的心理與生理效益 (The Psychological Benefits of Humming - BBC 02:17)", "key_takeaways": "【BBC 科普影音自學摘要】\nBBC Global 探討「哼唱 (Humming)」在神經生物學上的效益：刺激迷走神經，促使副交感神經運作，顯著降低心率與皮質醇壓力，提升工作專注度與身心平靜。", "main_content": "A: Did you know that humming for just two minutes can calm down your nervous system?\nB: Yes, scientific research proves that humming stimulates the vagus nerve, reducing anxiety and promoting mental well-being.", "vocab_notes": ["Humming [ˈhʌmɪŋ] (n.) [生理心理]：哼唱、閉口發出嗡嗡聲。\n  例句：Rhythmic *humming* induces deep physical relaxation prior to public speaking."], "link": "https://www.youtube.com/watch?v=LCW5Ftg0_uI", "link_text": "觀看 BBC Global: Benefits of Humming 影片 (YouTube)"}];

        let localItems = [];
        try {
            const stored = localStorage.getItem('ryan_networking_supplements_v12');
            if (stored) localItems = JSON.parse(stored);
        } catch(e) { localItems = []; }

        const allItems = [...database, ...localItems];

        let currentPool = [];
        let currentIndex = 0;
        let currentTab = 'sentence';
        let isPenMode = false;

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        function setTab(tabName) {
            currentTab = tabName;
            document.getElementById('tabSentence').classList.toggle('active', tabName === 'sentence');
            document.getElementById('tabMedia').classList.toggle('active', tabName === 'media');
            applyFilters();
        }

        function applyFilters() {
            const weekVal = document.getElementById('weekFilter').value || 'week1';
            currentPool = allItems.filter(item => item.week === weekVal && item.type === currentTab);
            
            // 安全回退保證：如果該週該類別無資料，自動載入該週所有項目
            if (currentPool.length === 0) {
                currentPool = allItems.filter(item => item.week === weekVal);
            }
            // 終極防護：絕不出現 0/0
            if (currentPool.length === 0 && allItems.length > 0) {
                currentPool = [allItems[0]];
            }

            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            if (currentPool.length === 0) return;

            const item = currentPool[currentIndex];
            
            // 標頭與計數器
            const badge = document.getElementById('categoryBadge');
            badge.innerText = item.category || "教材";
            badge.className = (item.type === 'media') ? "badge media-badge" : "badge";
            
            document.getElementById('dateDisplay').innerText = item.class_date ? ' • ' + item.class_date : '';
            document.getElementById('counterDisplay').innerText = (currentIndex + 1) + ' / ' + currentPool.length;
            document.getElementById('titleDisplay').innerText = item.title || "";

            // 核心重點
            const tkSection = document.getElementById('takeawaysSection');
            if (item.key_takeaways) {
                tkSection.style.display = 'block';
                document.getElementById('takeawaysDisplay').innerText = item.key_takeaways;
            } else {
                tkSection.style.display = 'none';
            }

            // 對話內容
            const mainContainer = document.getElementById('mainContentContainer');
            mainContainer.innerHTML = '';
            if (item.main_content) {
                const lines = item.main_content.split('\n');
                const hasDialog = lines.some(l => l.startsWith('A:') || l.startsWith('B:'));
                if (hasDialog) {
                    const box = document.createElement('div');
                    box.className = 'dialogue-container';
                    lines.forEach(l => {
                        if (l.startsWith('A:')) {
                            box.innerHTML += '<div class="chat-bubble-row speaker-a"><div class="speaker-avatar avatar-a">A</div><div class="chat-bubble-content">' + l.substring(2).trim() + '</div></div>';
                        } else if (l.startsWith('B:')) {
                            box.innerHTML += '<div class="chat-bubble-row speaker-b"><div class="speaker-avatar avatar-b">B</div><div class="chat-bubble-content">' + l.substring(2).trim() + '</div></div>';
                        }
                    });
                    mainContainer.appendChild(box);
                } else {
                    mainContainer.innerHTML = '<div style="background:var(--sky-bg); padding:12px; border-radius:14px; white-space:pre-line;">' + item.main_content + '</div>';
                }
            }

            // 實戰填空測驗
            const quizSection = document.getElementById('quizSection');
            const quizContainer = document.getElementById('quizContainer');
            quizContainer.innerHTML = '';
            if (item.practice_quiz && item.practice_quiz.length > 0) {
                quizSection.style.display = 'block';
                item.practice_quiz.forEach(q => {
                    const card = document.createElement('div');
                    card.className = 'quiz-card';
                    card.innerHTML = '<div class="quiz-q">' + q.question + '</div>' +
                                     '<button class="quiz-toggle-btn" onclick="toggleAnswer(this)">👁️ 顯示參考答案與示範</button>' +
                                     '<div class="quiz-ans-wrapper"><div class="quiz-ans-box">' + q.answer + '</div></div>';
                    quizContainer.appendChild(card);
                });
            } else {
                quizSection.style.display = 'none';
            }

            // 重點單字
            const vocabSection = document.getElementById('vocabSection');
            const vocabDisplay = document.getElementById('vocabDisplay');
            vocabDisplay.innerHTML = '';
            if (item.vocab_notes && item.vocab_notes.length > 0) {
                vocabSection.style.display = 'block';
                item.vocab_notes.forEach(v => {
                    const li = document.createElement('li');
                    let text = v.replace(/\*([^*]+)\*/g, '<span class="highlight-term">$1</span>');
                    li.innerHTML = text.replace(/\n/g, '<br>');
                    vocabDisplay.appendChild(li);
                });
            } else {
                vocabSection.style.display = 'none';
            }

            // 延伸資源連結
            const linkSection = document.getElementById('linkSection');
            const linkDisplay = document.getElementById('linkDisplay');
            if (item.link) {
                linkSection.style.display = 'block';
                linkDisplay.href = item.link;
                linkDisplay.innerText = '🔗 ' + (item.link_text || '開啟延伸學習資源');
            } else {
                linkSection.style.display = 'none';
            }
        }

        function navigateCard(direction) {
            if (currentPool.length === 0) return;
            currentIndex = (currentIndex + direction + currentPool.length) % currentPool.length;
            renderCard();
        }

        function toggleAnswer(btn) {
            const ans = btn.nextElementSibling;
            if (ans.style.display === 'block') {
                ans.style.display = 'none';
                btn.innerText = '👁️ 顯示參考答案與示範';
            } else {
                ans.style.display = 'block';
                btn.innerText = '🙈 隱藏解答';
            }
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            document.getElementById('penBtn').classList.toggle('active-pen', isPenMode);
            document.getElementById('cardElement').classList.toggle('canvas-active', isPenMode);
        }
        function clearAllCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }
        function verifyAdminPassword() {
            if (document.getElementById('adminPwdInput').value.trim() === 'ryan2026') {
                document.getElementById('adminAuthSection').style.display = 'none';
                document.getElementById('adminFormSection').style.display = 'block';
            } else {
                alert('密碼錯誤！');
            }
        }

        function saveAdminSupplement() {
            const week = document.getElementById('admWeek').value;
            const title = document.getElementById('admTitle').value.trim() || '課堂即時補充';
            const content = document.getElementById('admContent').value.trim();
            const vocab = document.getElementById('admVocab').value.trim();

            if (!vocab && !content) {
                alert('請填寫內容！');
                return;
            }

            const newItem = {
                week: week,
                class_date: (week === 'week1') ? '2026/08/12' : (week === 'week2') ? '2026/08/19' : '2026/09/02',
                type: 'sentence',
                category: '課堂延伸補充',
                title: title,
                key_takeaways: '【課堂即時補充】\n紀錄課堂最新單字與句型。',
                main_content: content || '課堂延伸補充內容',
                vocab_notes: vocab ? vocab.split('\n').filter(s => s.trim()) : []
            };

            localItems.push(newItem);
            localStorage.setItem('ryan_networking_supplements_v12', JSON.stringify(localItems));
            allItems.push(newItem);

            alert('✅ 補充成功！');
            closeAdminModal();
            applyFilters();
        }

        // 啟動即執行渲染
        setTab('sentence');
    </script>
</body>
</html>
