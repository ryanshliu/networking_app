<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Networking English</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-soft: #eef2ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-title: #1e1b4b;
            --text-body: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            
            --amber-bg: #fffbeb;
            --amber-border: #fef3c7;
            --amber-text: #b45309;
            
            --sky-bg: #f0f9ff;
            --sky-border: #e0f2fe;
            --sky-text: #0369a1;

            --emerald-bg: #ecfdf5;
            --emerald-border: #d1fae5;
            --emerald-text: #047857;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg);
            margin: 0; padding: 18px 14px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;
            color: var(--text-body);
        }
        .header { width: 100%; max-width: 440px; margin-bottom: 6px; text-align: center; }
        h1 { font-size: 26px; font-weight: 800; color: var(--text-title); margin: 4px 0 8px 0; letter-spacing: -0.5px; }
        
        .pen-toolbar {
            display: flex; justify-content: center; gap: 6px; margin-bottom: 12px;
        }
        .tool-btn {
            background-color: #ffffff; border: 1.5px solid #cbd5e1; padding: 6px 12px;
            border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--text-muted);
            display: flex; align-items: center; gap: 4px; cursor: pointer; transition: all 0.2s ease;
        }
        .tool-btn.active-pen {
            background-color: #ffe4e6; border-color: #e11d48; color: #e11d48;
            box-shadow: 0 2px 8px rgba(225, 29, 72, 0.25);
        }
        .tool-btn:active { transform: scale(0.96); }

        .filters { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
        select {
            width: 100%; padding: 14px 16px; font-size: 17px; font-weight: 700;
            border-radius: 16px; border: 1.5px solid var(--border-color); background-color: #ffffff;
            color: var(--text-title); outline: none; box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        
        .tab-group { display: flex; gap: 8px; background-color: #e2e8f0; padding: 6px; border-radius: 16px; }
        .tab-btn {
            flex: 1; padding: 12px 6px; font-size: 16px; font-weight: 700; text-align: center;
            background: transparent; border: none; border-radius: 12px; color: var(--text-muted); cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-btn.active {
            background: #ffffff; color: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.12);
        }

        .card-container {
            width: 100%; max-width: 440px; flex: 1; display: flex; flex-direction: column;
            position: relative;
        }
        .card {
            background-color: var(--card-bg); border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 24px 20px; box-sizing: border-box; display: flex; flex-direction: column;
            max-height: 68vh; overflow-y: auto; border: 1px solid var(--border-color);
            position: relative;
        }

        #drawCanvas {
            position: absolute; top: 0; left: 0;
            pointer-events: none;
            z-index: 100;
        }
        .card.canvas-active #drawCanvas {
            pointer-events: auto;
            touch-action: none;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .badge { font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 20px; background-color: var(--primary-soft); color: var(--primary); }
        .badge.media-badge { background-color: #fef3c7; color: #92400e; }
        .badge.task-badge { background-color: #dcfce7; color: #166534; }
        .date-badge { font-size: 13px; color: var(--text-muted); font-weight: 600; }
        .counter { font-size: 14px; color: var(--text-muted); font-weight: 700; }
        
        .title { font-size: 22px; font-weight: 800; color: var(--text-title); margin-bottom: 16px; line-height: 1.35; }
        
        .block-section { margin-bottom: 18px; text-align: left; }
        
        .tag-title {
            display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
            font-size: 13px; font-weight: 800; border-radius: 8px; margin-bottom: 8px;
        }
        .tag-amber { background-color: var(--amber-bg); color: var(--amber-text); border: 1px solid var(--amber-border); }
        .tag-sky { background-color: var(--sky-bg); color: var(--sky-text); border: 1px solid var(--sky-border); }
        .tag-emerald { background-color: var(--emerald-bg); color: var(--emerald-text); border: 1px solid var(--emerald-border); }

        .block-desc { font-size: 16px; color: var(--text-body); line-height: 1.65; margin: 0; white-space: pre-line; }

        .content-box {
            font-size: 19px; font-weight: 600; color: #0c4a6e; line-height: 1.65;
            background-color: var(--sky-bg); padding: 18px; border-radius: 18px; white-space: pre-line;
            border: 1px solid var(--sky-border); margin: 0;
        }

        .vocab-ul {
            margin: 0; padding-left: 20px; font-size: 15.5px; color: var(--text-body); line-height: 1.7;
        }
        .vocab-ul li { margin-bottom: 8px; }

        .link-box { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border-color); text-align: left; }
        .link-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; box-sizing: border-box;
            padding: 14px 18px; font-size: 15px; color: #ffffff;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            text-decoration: none; font-weight: 700; border-radius: 14px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: all 0.2s ease;
        }

        .nav-controls { width: 100%; max-width: 440px; display: flex; gap: 12px; margin-top: 14px; margin-bottom: 10px; }
        .nav-btn {
            flex: 1; padding: 16px; font-size: 18px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-prev { background-color: #e2e8f0; color: #334155; }
        .btn-next { background-color: var(--primary); color: #ffffff; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3); }
        .nav-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Networking English</h1>
        
        <div class="pen-toolbar">
            <button id="penBtn" class="tool-btn" onclick="togglePenMode()">
                <span>🖍️ 細畫筆</span>
            </button>
            <button class="tool-btn" onclick="undoLastStroke()">
                <span>↩️ 復原</span>
            </button>
            <button class="tool-btn" onclick="clearAllCanvas()">
                <span>🗑️ 全清</span>
            </button>
        </div>
    </div>

    <div class="filters">
        <select id="weekFilter" onchange="applyFilters()"></select>
        <div class="tab-group">
            <button class="tab-btn active" onclick="setTab('sentence', this)">句型 / 文法</button>
            <button class="tab-btn" onclick="setTab('media', this)">影音 / 自學</button>
        </div>
    </div>

    <div class="card-container">
        <div class="card" id="cardElement">
            <canvas id="drawCanvas"></canvas>

            <div>
                <div class="card-header">
                    <div>
                        <span class="badge" id="categoryBadge">分類</span>
                        <span class="date-badge" id="dateDisplay"></span>
                    </div>
                    <span class="counter" id="counterDisplay">0 / 0</span>
                </div>
                <div class="title" id="titleDisplay">標題</div>

                <div class="block-section" id="takeawaysSection">
                    <div class="tag-title tag-amber">💡 核心重點說明</div>
                    <div class="block-desc" id="takeawaysDisplay"></div>
                </div>

                <div class="block-section" id="mainContentSection">
                    <div class="tag-title tag-sky">📖 整理後學習內容與核心句型</div>
                    <div class="content-box" id="mainContentDisplay"></div>
                </div>

                <div class="block-section" id="vocabSection">
                    <div class="tag-title tag-emerald">📝 重點單字與注意事項</div>
                    <ul class="vocab-ul" id="vocabDisplay"></ul>
                </div>
            </div>

            <div class="link-box" id="linkSection">
                <a class="link-btn" id="linkDisplay" href="#" target="_blank">🔗 開啟延伸閱讀與學習資源</a>
            </div>
        </div>
    </div>

    <div class="nav-controls">
        <button class="nav-btn btn-prev" onclick="navigateCard(-1)">上一則</button>
        <button class="nav-btn btn-next" onclick="navigateCard(1)">下一則</button>
    </div>

    <script>
        const rawDatabase = [{"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "社交問候 (Greetings)", "title": "打招呼與近況寒暄 (Greetings & Responses)", "key_takeaways": "1. 熟人與同事間的自然問候：優先使用 Hey there! 或 How’s it going?。\n2. 描述近況平淡無波折時：避免只說 I'm fine，使用 Same old, same old 或 The usual 更在地自然。", "main_content": "• 自然問候 (Informal Greetings)：\n  - Hey there!\n  - How’s it going?\n  - How are things (with you)?\n\n• 描述近況平穩 (Neutral Responses)：\n  - Same old, same old!\n  - The usual. / Pretty much the same.\n  - (Pretty) uneventful. / Nothing special.", "vocab_notes": ["Same old, same old：高頻口語，表達工作或生活一切照舊、沒太大變化。", "Uneventful：形容詞，指平靜無事的、沒有重大事件發生的。", "How have you been?：現在完成式，用於詢問自上次見面以來的近況。", "Can't complain：挺好的、沒什麼好挑剔的，相當於 Not bad 或 Pretty good。", "Pretty much the same：幾乎跟平常一模一樣，常用於回答 How are things?。", "文化要點：英美商務社交中，問候多屬於禮貌開場，回應簡短正面即可。", "Catch up：與久未見面的朋友或同事交流近況。"], "link": "https://www.linkedin.com/pulse/18-ways-say-hello-english-thomas-spengler/", "link_text": "18 Ways to Say Hello in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "道別用語 (Goodbyes)", "title": "道別與重要文法規則 (Ways to Say Goodbye & Grammar)", "key_takeaways": "Pro Tip 文法核心：Look forward to 中的 to 是介系詞，後面必須接動名詞 (V-ing) 或名詞，絕不可接原形動詞！\n✔ 正確：I look forward to seeing you in Kaohsiung.\n✖ 錯誤：I look forward to see you.", "main_content": "• 非正式道別 (Informal Goodbyes)：\n  - I’ve got to get going! (= I have to leave now)\n  - Take it easy! / Have a good one!\n  - I’m off!\n\n• 正式商務道別 (Formal Goodbyes)：\n  - It was nice meeting you. / It was a pleasure to see you。\n  - I look forward to our next meeting!\n  - I look forward to seeing you soon。", "vocab_notes": ["I've got to (= I have to / I need to)：口語中常縮讀為 I gotta。", "Have a good one：美式極常見祝福語，one 可泛指 day, weekend 或 evening。", "Take it easy：道別時使用，相當於保重、放輕鬆。", "I'm off：簡短口語，表示我先離開、我先走一步了。", "Look forward to + V-ing：商務書信與會面結尾最標準的期待相會用語。", "Pleasure meeting you：初次見面道別用 meeting；若非初次見面則用 Pleasure seeing you。", "See you around：回頭見、下次見，適用於常碰面的同棟辦公室同事。"], "link": "https://www.berlitz.com/blog/goodbye-english", "link_text": "81 Ways to Say Goodbye in English"}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "展會社交 (Trade Fair)", "title": "展會破冰與邀約 (Small Talk At a Conference)", "key_takeaways": "展會社交四部曲心法：\n1. 詢問抵達與交通 ➔ 2. 詢問住宿評價與距離 ➔ 3. 交流攤位心得 ➔ 4. 提出社交邀約 (Happy Hour)。", "main_content": "A: When did you arrive?\nB: I flew here yesterday. And you?\nA: I got here 2 days ago. Where are you staying?\nB: At the Mason Park Hotel。\nA: That’s where I am! Do you like the hotel?\nB: It’s okay. The room is small, but comfortable, and it’s a 5-minute walk to the venue。\nA: What do you think of the trade fair?\nB: I like some of the exhibitor’s stands, and I plan to join the happy hour tomorrow at 5pm. Would you like to come?\nA: Why not? Count me in!", "vocab_notes": ["Trade fair：商務展覽會、貿易展。", "Exhibitor's stand：參展商攤位（美式常稱 booth）。", "Within walking distance：步行即可達到的範圍。", "Count me in!：口語高頻片語，表示算我一份、我也要參加。", "Why not?：在此並非反問，而是表示贊同、好啊、何樂不為。", "Happy hour：展會結束後的非正式飲酒社交時段，破冰關鍵場合。", "Fly in / Fly here：搭乘飛機前來，商務出差常見動詞用法。", "Venue：大會活動或展覽舉辦的指定場地。"], "link": "", "link_text": ""}, {"week": "week1", "class_date": "2026/08/12", "type": "sentence", "category": "職場英語 (Workplace)", "title": "職場核心表達與行程衝突 (Useful Workplace Phrases)", "key_takeaways": "職場商務溝通核心：精準表達職能特長、跨部門人際相處，以及面對會議撞期時的專業應對。", "main_content": "• 專業特質與人際相處：\n  - This job is an ideal match for my skills and experience。\n  - I get on with people easily. (= I get along with people well)\n\n• 行程衝突與時間管理：\n  - I’ve got two meetings scheduled at the same time. (= I’m double-booked.)\n  - I can’t do them both at once! (= I have a scheduling conflict.)\n\n• 決策權限說明：\n  - The decision is in the hands of the manager。", "vocab_notes": ["Ideal match：理想搭配、完美契合的人選。", "Get on with：英式片語，等同於美式 get along with (與人相處融洽)。", "Double-booked：同一時間被重複安排了兩項會議行程。", "Scheduling conflict：時間安排上的衝突、衝堂。", "In the hands of：掌握在...手中、由...作決定。", "Interpersonal skills：人際溝通能力 (= people skills)。", "Apart from：除了...之外 (except / other than)。", "Timetable：時間表、議程表。"], "link": "https://www.bbc.co.uk/learningenglish/features/english-at-work/english-at-work-intro", "link_text": "BBC English at Work 介紹頁面"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "影音學習 (Video Study)", "title": "商務社交情境：巴黎會面 (Business Partner A2 5.4.1)", "key_takeaways": "【詳細劇情情境摘要】\nJulia 抵達巴黎參加商務研討會，與合作夥伴 Maria 和 Max 會面。對話圍繞著抵達的交通方式、入住飯店品質展開。Max 提及雖然飯店房間不大，但勝在舒適且離展場步行僅需幾分鐘。最後三人順勢敲定當晚的晚餐邀約。\n\n【觀看與學習重點】\n1. 聽辨關鍵資訊：何時抵達？搭乘何種交通工具？對住宿的真實評價是什麼？\n2. 觀察非語言肢體溝通 (Body Language)：\n   - Roll one's eyes (翻白眼：表達無奈或不置可否)\n   - Make a face (做鬼臉/撇嘴：表達不滿意或嫌棄)\n   - Wink (眨眼暗示)\n3. 學習如何在對話結束前自然促成後續晚餐邀約 (Dinner plan)。", "main_content": "• When did you arrive? / How did she get there?\n• Did Max like the hotel he was staying? (The room is small, but comfortable)\n• What was their dinner plan?", "vocab_notes": ["Socialize with clients：與客戶建立社交關係、商務應酬。", "Make a face：做出不悅、嫌棄或無奈的面部表情。", "Roll one's eyes：翻白眼，表示不認同或受不了。", "Wink：眨眼示意，用於默契或幽默玩笑場合。", "Catch up with：與久未見面的人更新彼此近況。", "Dinner arrangement：晚餐安排與餐廳預訂。", "Body language：肢體語言在跨文化商務溝通中的關鍵作用。"], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/Bus_Part_A2_U5L4_5.4.1.mp4", "link_text": "觀看 Business Partner 5.4.1 影片 (MP4)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "聽力學習 (Audio Study)", "title": "展館心得與產品發表聽力 (BP A2 Workbook 5.5)", "key_takeaways": "【詳細對話摘要】\nAmy 與 Marta 在展會現場交流彼此抵達展場的日期與參觀心得。Amy 分享了對展覽中心硬體設施的正面評價，並預告隔天自家公司將舉辦新產品發表會；隨後 Victor 加入討論，三人針對『資源回收 (Recycling)』專題演講交流意見，並客觀比較今年會議飯店在房間空間、交通距離與餐飲品質上的優缺點。\n\n【聽力核心檢測任務】\n1. Amy 和 Marta 是否同一天抵達？（留意各自抵達時間差距）\n2. Marta 是否會參加隔天 Amy 公司舉辦的新產品發表會？\n3. Victor 與 Amy 對於今年飯店大小與食物水準的看法是否一致？", "main_content": "• Conference center facilities (會議中心硬體設施)\n• Product launch presentation (新產品發表會)\n• Presentation on recycling (環保資源回收簡報)", "vocab_notes": ["Conference hotel：大會指定特約飯店。", "Level of comfort：舒適度水準。", "Product launch：新產品上市發布。", "Recycling presentation：資源回收專題簡報。", "Facility / Venue：場地與周邊設施。", "Attendee / Exhibitor：與會者 / 參展商。", "Audio comprehension：商務聽力理解練習。"], "link": "https://media.pearsoncmg.com/intl/elt/compose/Business_Partner_A2/BP_A2_WB_5_05.mp3", "link_text": "收聽 BP A2 5.5 練習音檔 (MP3)"}, {"week": "week1", "class_date": "2026/08/12", "type": "media", "category": "自學任務 (Self-Study)", "title": "拒絕制式回答：替代 'I’m fine, thank you' (Papa Teach Me)", "key_takeaways": "【影片核心內容摘要】\n知名英語教學頻道 Papa Teach Me 深入探討母語人士在日常社交中如何依據真實心境提供靈活、道地的回覆，徹底擺脫死板的 'I'm fine, thank you'；同時傳授如何敏銳觀察對方面色並給予合適的關懷問候。\n\n【自學任務清單】\n✔ 任務 1：掌握至少 15 種回答 'How are you?' 的替換說法。\n✔ 任務 2：當對方看起來氣色不佳、生病或心情低落時，熟記 5 種關心問句。", "main_content": "• 狀況極佳：Never better! / Couldn't be better!\n• 平淡日常：Can't complain. / Same old, same old. / The usual。\n• 關懷問句：Are you feeling alright? / You look a bit under the weather.", "vocab_notes": ["Can't complain：挺好的，沒什麼好挑剔的。", "A bit under the weather：身體微恙、略感不適（口語高頻慣用語）。", "Never better：再好不過了，表示個人狀態極佳。", "Couldn't be better：不能再更好了，最高級讚美。", "You look a bit down：你看起來有點沒精神/心情低落。", "Hang in there：撐著點、加油，用於安慰面臨壓力的人。", "Self-study task：課後自學訓練任務。"], "link": "https://www.youtube.com/watch?v=f259lQdMo2s", "link_text": "開啟 YouTube 教學影片 (14:18)"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "走廊寒暄 (Catching Up)", "title": "巧遇寒暄與公務告退 (Catching up with Each Other)", "key_takeaways": "【課堂情境與學習重點】\n1. 在走廊、電梯口或課後偶遇時，進行自然簡短的 30 秒破冰寒暄。\n2. 當有緊急公務（如趕著交報告、開會）時，如何有禮貌且合情合理地向對方告退，並給予正面口語祝福。", "main_content": "【情境示範對話】\nA: Hi, [Name. How have you been?\nB: Things are good~ And how are things with you?\nA: Same old, same old。\nB: What are you doing after class?\nA: I’ve got to get back to work. I need to turn in a report by 5:30pm。\nB: Wow, ok. Good luck with that!\nA: Thanks! I really need it!", "vocab_notes": ["Turn in a report：繳交/呈報報告（turn in 同義於 submit 或 hand in）。", "Good luck with that!：祝你在那件事上順利！日常高頻口語祝福。", "Get back to work：回到工作崗位上繼續忙碌。", "Things are good：近況挺不錯的，口語輕鬆回答。", "Deadline / By [Time：截止時間，by 5:30pm 表示最晚在5點半前。", "I really need it：我真的很需要（這句祝福），幽默表達手頭工作確實繁重。", "Wrap up：結束、收尾手邊工作。"], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "差旅交通 (Accommodation)", "title": "研討會住宿與地鐵動線描述 (AIChE Minneapolis)", "key_takeaways": "【課堂情境與學習重點】\n1. 商務差旅中（以赴美參加 AIChE 2026 年會為例）精確描述飯店距離、步行時間、地鐵直達與免轉乘動線。\n2. 詢問與說明房價預算、掌握明尼阿波利斯 Skyway 空中步道系統在防寒與通行上的優勢。", "main_content": "【核心句型模組】\n• 距離與位置描述：\n  - The hotel is near / close to the subway station。\n  - The subway station is within walking distance. (= It’s a 5-minute walk to the station.)\n\n• 交通動線與直達：\n  - From the hotel, I can take the subway directly to the conference venue。\n  - I don’t need to transfer。\n\n• 房價說明：\n  - I have no idea about their room price.", "vocab_notes": ["Within walking distance：步行可達的距離（商務出差選飯店首要考量）。", "Directly：副詞，直達地、直接地。", "Transfer：動詞/名詞，轉乘、換線。", "Have no idea about...：對...完全不清楚、毫不知情。", "Single room rate：單人房每晚房價。", "Skyway system：空中連通步道系統（如明尼阿波利斯著名防寒通道）。", "Venue：大會活動或展覽舉辦的指定會場。", "Proximity：鄰近程度、距離接近。"], "link": "https://minneapolis-2021.s3.amazonaws.com/images/2024_SkywayMap_Digital.pdf?v=1726683206", "link_text": "Minneapolis Skyway & Hotel Map"}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "在地推薦 (Recommendations)", "title": "會後在地景點與美食推薦 (Post-conference Recommendations)", "key_takeaways": "【課堂情境與學習重點】\n1. 向外國訪客介紹台灣在地景點（如高雄景點與特色小吃）的高階推薦句型。\n2. ★ 重要文法核心：worth (值得) 後方必須接動名詞『V-ing』！（例：is worth visiting / eating）。\n3. 提醒外國友人避開觀光陷阱與敲竹槓店家（Tourist trap / Rip-off）。", "main_content": "【核心句型模組】\n• 推薦原因句型：\n  - I recommend [Place/Food because [Reason。\n  - I think [Place/Food is worth seeing/visiting/eating, as it [Reason。\n\n• 最高評價句型：\n  - [Place/Food is my all-time favorite. It’s a must-see / must-eat / must-do here in Kaohsiung。\n  - You simply can’t miss [Place/Food. It’s a once-in-a-lifetime experience!", "vocab_notes": ["All-time favorite：一直以來的最愛、終極最愛。", "Must-see / Must-eat：必看景點 / 必吃美食（名詞用法）。", "Tourist trap：專門敲觀光客竹槓的黑店或名不副實的景點。", "Rip-off (n./v.)：敲竹槓、暴利商品；That guava cost NT$500? It’s a rip-off!", "Fusion restaurant：創意融合料理、跨國界風味餐廳。", "Bed and breakfast (B&B)：民宿、提供床位與早餐的旅宿。", "Food court：百貨公司或商場的美食街。", "Once-in-a-lifetime：一生一次、絕無僅有的難得體驗。", "Local specialty：在地特色名產/小吃。"], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "sentence", "category": "商務人脈 (Networking)", "title": "展會破冰與部門職掌交流 (Networking Role-Play)", "key_takeaways": "【課堂情境與學習重點】\n商務人脈拓展（Networking）標準五部曲：\n禮貌自我介紹 ➔ 詢問對方部門業務 ➔ 簡介自己部門職掌 ➔ 主動提出能為對方提供協助或解決問題 ➔ 交換名片約定後續跟進。", "main_content": "【實戰情境對話】\nA: Hello, I’m [Name. I work as a [Title in [Dept。\nB: Hi, I’m [Name. It’s a pleasure to meet you。\nA: Can you tell me about your department?\nB: Sure! We [Responsibilities。\nA: Can I briefly tell you about what our department does?\nB: Of course! I’m all ears. / Fire away!\nA: We [Our work. I think we might be able to help you。\nB: That would be great! / It’s so nice of you to offer help。\nA: Here's my business card should you want to call。\nB: Absolutely. I’ll be in touch / I'll give you a call soon。", "vocab_notes": ["Fire away!：口語片語，表示請說吧、開始問吧。", "I'm all ears：我洗耳恭聽、全神貫注在聽。", "Offer help：主動提出協助。", "I'll be in touch：我會再與您保持聯絡。", "Business card：名片；Here's my business card 這是我的名片。", "Briefly explain：簡明扼要地說明、簡述。", "Encounter a problem：在工作上遭遇問題或挑戰。", "Follow-up：後續跟進聯絡與業務推進。"], "link": "", "link_text": ""}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "BBC 職場英語 (BBC Networking)", "title": "商務社交實戰：Tip Top Trading (BBC #48 Face-to-face)", "key_takeaways": "【詳細劇情情境摘要】\nTip Top Trading 的員工參加產業大會。Anna 必須在會場與同業積極拓展人脈（Networking）。同時公司正面臨嚴峻的經濟景氣（Tough economic climate），管理階層面臨裁員縮編壓力（Reduce team / be rid of staff）。Anna 必須把握展會機會展現熱情，積極爭取新商機。\n\n【Networking 社交心法與觀看重點】\n1. 核心精神：Networking 是透過結識同業建立連結、分享資訊並為公司爭取新業務。\n2. 社交心態：保持友善熱絡 (Just be chatty and friendly)。\n3. 破冰技巧：主動自我介紹 ➔ 詢問對方需求並簡介業務 ➔ 交換名片約定後續聯繫。", "main_content": "• Do some networking = do some schmoozing (建立人脈 / 社交應酬)\n• I’ll give it a try. = I’ll give it a shot. (我來試試看)\n• Let’s get down to business. (讓我們切入正題談公事)\n• It's a tough economic climate. (這是個嚴峻的經濟景氣)\n• Here's my business card should you want to call。", "vocab_notes": ["Schmooze (v.)：社交應酬、拉攏關係、建立人脈。", "Be rid of：擺脫、裁減（員工）。", "Prestigious award：享有盛望的大獎。", "Give it a shot：嘗試一下（口語高頻同義詞 give it a try）。", "Tough economic climate：艱困的經濟大環境。", "Sort this out：解決這項難題、處理好這件事。", "Promote business：推廣公司業務與產品。", "In your hands：掌握在你的責任範圍內。"], "link": "https://www.bbc.co.uk/learningenglish/features/english-at-work/48-language-for-networking", "link_text": "前往 BBC 課程網頁 (收聽音檔與劇本)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "自學任務 (Self-Study)", "title": "Passkey 通行密鑰原理 (BBC News 02:35)", "key_takeaways": "【影片詳細摘要】\nBBC News 深入探討 Passkey（通行密鑰）技術如何透過裝置端生物辨識（指紋/FaceID）取代傳統容易被駭、外洩或遺忘的字元密碼，成為新一代跨平台網路安全驗證標準。\n\n【課後自學任務 Tasks】\n✔ 任務：觀看影片後，用 1-3 句英文簡述 Passkey 相比傳統密碼最大的安全性優勢。", "main_content": "【科技與資安核心詞彙】\n• Passkey (通行密鑰)\n• Online security & Authentication (網路安全與身分驗證)\n• Biometrics (生物辨識技術：Touch ID / Face ID)\n• Passwordless future (無密碼化趨勢)", "vocab_notes": ["Authentication：身分驗證、認證流程。", "Biometrics：生物辨識技術（如指紋、臉部辨識）。", "Data encryption：資料加密傳輸技術。", "Cybersecurity threat：資訊安全威脅與釣魚網站防護。"], "link": "https://www.youtube.com/watch?v=lf5L_1oqHDs", "link_text": "開啟 BBC Passkey 影片 (02:35)"}, {"week": "week2", "class_date": "2026/08/19", "type": "media", "category": "自學任務 (Self-Study)", "title": "智慧眼鏡防偷拍妙招 (CNN Shorts 02:15)", "key_takeaways": "【影片詳細情境摘要】\nCNN 報導網路上流傳一項應對智慧眼鏡（如 Meta Ray-Ban）未經同意偷拍的新招數：如果你懷疑身邊有人正配戴智慧眼鏡對你進行錄影，可以在現場播放或哼唱『迪士尼版權歌曲』！因為社群平台的演算法與版權偵測技術會自動識別受版權保護的音訊，一旦對方將偷拍影片上傳至社群平台，該影片很可能會直接被系統下架或消音。Meta 同時向 CNN 表示已在 AI 智慧眼鏡鏡框上內建 LED 隱私提示燈，並嚴肅看待未經同意的偷拍行為。\n\n【課後自學任務 Tasks】\n✔ 任務：記住關於隱私隱憂、拍攝與版權偵測相關的英文詞彙。", "main_content": "【科技隱私核心詞彙】\n• Smart glasses & Being filmed (智慧眼鏡與正在被錄影)\n• Privacy concern & Filming without consent (隱私隱憂與未經同意拍攝)\n• Copyrighted song & Detection technology (版權歌曲與偵測下架技術)\n• LED indicator light (鏡框拍攝提示指示燈)", "vocab_notes": ["Film without consent：未經同意擅自錄影/拍攝。", "Privacy concern：個人隱私隱憂與防範。", "Copyrighted content：受智慧財產權保護的內容。", "Detection technology：自動偵測辨識技術。", "Indicator light：LED 拍攝提示燈號。", "Take something seriously：嚴肅重視某項議題。"], "link": "https://youtube.com/shorts/H7qyXwntx08?si=zc6OtSPaJOuWMik9", "link_text": "開啟 CNN Smart Glasses 短片 (02:15)"}];
        let filteredPool = [];
        let currentIndex = 0;
        let currentTab = 'sentence';
        let isPenMode = false;

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let undoStack = [];

        function cleanText(str) {
            if (!str) return '';
            return String(str).replace(/\]*\]/g, '').trim();
        }

        function resizeCanvas() {
            const card = document.getElementById('cardElement');
            const width = card.scrollWidth;
            const height = Math.max(card.scrollHeight, card.clientHeight);

            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
            canvas.width = width;
            canvas.height = height;
        }

        function togglePenMode() {
            isPenMode = !isPenMode;
            const penBtn = document.getElementById('penBtn');
            const card = document.getElementById('cardElement');

            if (isPenMode) {
                penBtn.classList.add('active-pen');
                card.classList.add('canvas-active');
                resizeCanvas();
            } else {
                penBtn.classList.remove('active-pen');
                card.classList.remove('canvas-active');
            }
        }

        function saveSnapshot() {
            undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (undoStack.length > 25) undoStack.shift();
        }

        function undoLastStroke() {
            if (undoStack.length > 0) {
                const previousState = undoStack.pop();
                ctx.putImageData(previousState, 0, 0);
            } else {
                clearAllCanvas();
            }
        }

        function clearAllCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            undoStack = [];
        }

        function getExactCoords(e) {
            const card = document.getElementById('cardElement');
            const rect = card.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            return {
                x: clientX - rect.left + card.scrollLeft,
                y: clientY - rect.top + card.scrollTop
            };
        }

        function startDrawing(e) {
            if (!isPenMode) return;
            isDrawing = true;
            saveSnapshot();

            const coords = getExactCoords(e);
            lastX = coords.x;
            lastY = coords.y;
        }

        function draw(e) {
            if (!isDrawing || !isPenMode) return;
            if (e.cancelable) e.preventDefault();

            const coords = getExactCoords(e);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(coords.x, coords.y);
            ctx.strokeStyle = 'rgba(225, 29, 72, 0.85)';
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            lastX = coords.x;
            lastY = coords.y;
        }

        function stopDrawing() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        function initWeekOptions() {
            const selector = document.getElementById('weekFilter');
            selector.innerHTML = "";

            const weekMap = {};
            rawDatabase.forEach(item => {
                if (item.week && !weekMap[item.week]) {
                    weekMap[item.week] = item.class_date;
                }
            });

            const sortedWeeks = Object.keys(weekMap).sort();
            sortedWeeks.forEach(w => {
                const opt = document.createElement('option');
                opt.value = w;
                const dateStr = weekMap[w] ? ` (${weekMap[w]})` : '';
                opt.innerText = `${w.toUpperCase()}${dateStr}`;
                selector.appendChild(opt);
            });
        }

        function setTab(tabName, element) {
            currentTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const selectedWeek = document.getElementById('weekFilter').value;
            filteredPool = rawDatabase.filter(item => (item.week === selectedWeek) && (item.type === currentTab));
            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            const cardEl = document.getElementById('cardElement');
            cardEl.scrollTop = 0;
            clearAllCanvas();

            if (!filteredPool.length) {
                document.getElementById('categoryBadge').innerText = "無資料";
                document.getElementById('dateDisplay').innerText = "";
                document.getElementById('titleDisplay').innerText = "本分類尚無內容";
                document.getElementById('takeawaysSection').style.display = "none";
                document.getElementById('mainContentSection').style.display = "none";
                document.getElementById('vocabSection').style.display = "none";
                document.getElementById('linkSection').style.display = "none";
                document.getElementById('counterDisplay').innerText = "0 / 0";
                return;
            }

            const item = filteredPool[currentIndex];
            const badge = document.getElementById('categoryBadge');
            badge.innerText = cleanText(item.category);
            
            if (item.category.includes("自學") || item.category.includes("Self-Study")) {
                badge.className = 'badge task-badge';
            } else if (item.type === 'media') {
                badge.className = 'badge media-badge';
            } else {
                badge.className = 'badge';
            }

            document.getElementById('dateDisplay').innerText = item.class_date ? ` • ${item.class_date}` : '';
            document.getElementById('counterDisplay').innerText = (currentIndex + 1) + " / " + filteredPool.length;
            document.getElementById('titleDisplay').innerText = cleanText(item.title);

            const tkSection = document.getElementById('takeawaysSection');
            if (item.key_takeaways) {
                tkSection.style.display = "block";
                document.getElementById('takeawaysDisplay').innerText = cleanText(item.key_takeaways);
            } else {
                tkSection.style.display = "none";
            }

            const mcSection = document.getElementById('mainContentSection');
            if (item.main_content) {
                mcSection.style.display = "block";
                document.getElementById('mainContentDisplay').innerText = cleanText(item.main_content);
            } else {
                mcSection.style.display = "none";
            }

            const vbSection = document.getElementById('vocabSection');
            const vocabUl = document.getElementById('vocabDisplay');
            vocabUl.innerHTML = "";
            if (item.vocab_notes && item.vocab_notes.length > 0) {
                vbSection.style.display = "block";
                item.vocab_notes.forEach(note => {
                    const li = document.createElement('li');
                    li.innerText = cleanText(note);
                    vocabUl.appendChild(li);
                });
            } else {
                vbSection.style.display = "none";
            }

            const linkSection = document.getElementById('linkSection');
            const linkTag = document.getElementById('linkDisplay');
            if (item.link) {
                linkSection.style.display = "block";
                linkTag.href = item.link;
                linkTag.innerText = "🔗 " + (cleanText(item.link_text) || "開啟學習資源");
            } else {
                linkSection.style.display = "none";
            }

            setTimeout(resizeCanvas, 60);
        }

        function navigateCard(direction) {
            if (!filteredPool.length) return;
            currentIndex = (currentIndex + direction + filteredPool.length) % filteredPool.length;
            renderCard();
        }

        window.onload = () => {
            initWeekOptions();
            applyFilters();
            window.addEventListener('resize', resizeCanvas);
        };
    </script>
</body>
</html>
